name: Corvo
alignment: senza allineamento
traits.0.name: Imitare
traits.0.text: Il corvo può imitare i suoni semplici che sente, come il sussurro di una persona, il pianto di un bambino o il verso di un animale. Una creatura che oda tali suoni riesce a capire che si tratta di imitazioni superando una prova di Saggezza (Intuizione) con CD 10.
actions.0.name: Becco
actions.0.text: "Attacco con arma da mischia: +4 al tiro per colpire, portata 1,5 m, un bersaglio. Colpito: 1 danno perforante."
