name: Erinni
alignment: legale malvagia
armorClass.0.note: piastre
resistances.1.note: da attacchi non magici non argentati
languages: Infernale, telepatia 36 m
traits.0.name: Armi infernali
traits.0.text: Gli attacchi con arma dell'erinni sono magici e infliggono 13 (3d8) danni da veleno extra se vanno a segno (già inclusi negli attacchi).
traits.1.name: Resistenza alla magia
traits.1.text: L'erinni dispone di vantaggio ai tiri salvezza contro incantesimi e altri effetti magici.
actions.0.name: Multiattacco
actions.0.text: L'erinni effettua tre attacchi.
actions.1.name: Spada lunga
actions.1.text: "Attacco con arma da mischia: +8 al tiro per colpire, portata 1,5 m, un bersaglio. Colpito: 8 (1d8 + 4) danni taglienti, o 9 (1d10 + 4) danni taglienti se usata a due mani, più 13 (3d8) danni da veleno."
actions.2.name: Arco lungo
actions.2.text: "Attacco con arma a distanza: +7 al tiro per colpire, gittata 45/180 m, un bersaglio. Colpito: 7 (1d8 + 3) danni perforanti più 13 (3d8) danni da veleno e il bersaglio deve superare un tiro salvezza su Costituzione con CD 14, altrimenti è avvelenato. Il veleno permane finché non viene rimosso dall'incantesimo ristorare inferiore o da una magia analoga."
reactions.0.name: Parata
reactions.0.text: L'erinni aggiunge 4 alla sua CA contro un attacco in mischia che la colpirebbe. Per farlo, l'erinni deve vedere l'attaccante e deve impugnare un'arma da mischia.
