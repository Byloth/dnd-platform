name: Diavolo della fossa
alignment: legale malvagio
armorClass.0.note: armatura naturale
resistances.1.note: da attacchi non magici non argentati
languages: Infernale, telepatia 36 m
traits.0.name: Aura di paura
traits.0.text: Ogni creatura ostile al diavolo della fossa che inizi il proprio turno entro 6 metri da esso deve effettuare un tiro salvezza su Saggezza con CD 21, a meno che il diavolo della fossa non sia incapacitato. Se fallisce, la creatura è spaventata fino all'inizio del proprio turno successivo. Se lo supera, invece, è immune all'Aura di paura del diavolo della fossa per le 24 ore successive.
traits.1.name: Resistenza alla magia
traits.1.text: Il diavolo della fossa dispone di vantaggio ai tiri salvezza contro incantesimi e altri effetti magici.
traits.2.name: Armi magiche
traits.2.text: Gli attacchi con arma del diavolo della fossa sono magici.
traits.3.name: Incantesimi innati
traits.3.text: |-
  La caratteristica da incantatore del diavolo della fossa è Carisma (CD del tiro salvezza sull'incantesimo 21). Per sua natura, il diavolo della fossa è in grado di lanciare gli incantesimi indicati di seguito senza aver bisogno di componenti materiali:
  A volontà: individuazione del magico, palla di fuoco
  3/giorno ciascuno: blocca mostri, muro di fuoco
actions.0.name: Multiattacco
actions.0.text: "Il diavolo della fossa effettua quattro attacchi: uno con il morso, uno con gli artigli, uno con la mazza e uno con la coda."
actions.0.multiattack.0.action: Morso
actions.0.multiattack.1.action: Artiglio
actions.0.multiattack.2.action: Mazza
actions.0.multiattack.3.action: Coda
actions.1.name: Morso
actions.1.text: "Attacco con arma da mischia: +14 al tiro per colpire, portata 1,5 m, un bersaglio. Colpito: 22 (4d6 + 8) danni perforanti. Il bersaglio deve superare un tiro salvezza su Costituzione con CD 21, altrimenti viene avvelenato. Finché è avvelenato in questo modo, il bersaglio non può recuperare punti ferita e subisce 21 (6d6) danni da veleno all'inizio di ogni suo turno. La creatura avvelenata può ripetere il tiro salvezza alla fine di ogni suo turno e, se lo supera, l'effetto svanisce."
actions.2.name: Artiglio
actions.2.text: "Attacco con arma da mischia: +14 al tiro per colpire, portata 3 m, un bersaglio. Colpito: 17 (2d8 + 8) danni taglienti."
actions.3.name: Mazza
actions.3.text: "Attacco con arma da mischia: +14 al tiro per colpire, portata 3 m, un bersaglio. Colpito: 15 (2d6 + 8) danni contundenti più 21 (6d6) danni da fuoco."
actions.4.name: Coda
actions.4.text: "Attacco con arma da mischia: +14 al tiro per colpire, portata 3 m, un bersaglio. Colpito: 24 (3d10 + 8) danni contundenti."
