name: Tasso gigante
alignment: senza allineamento
traits.0.name: Olfatto acuto
traits.0.text: Il tasso dispone di vantaggio alle prove di Saggezza (Percezione) basate sull'olfatto.
actions.0.name: Multiattacco
actions.0.text: "Il tasso effettua due attacchi: uno con il morso e uno con gli artigli."
actions.0.multiattack.0.action: Morso
actions.0.multiattack.1.action: Artigli
actions.1.name: Morso
actions.1.text: "Attacco con arma da mischia: +3 al tiro per colpire, portata 1,5 m, un bersaglio. Colpito: 4 (1d6 + 1) danni perforanti."
actions.2.name: Artigli
actions.2.text: "Attacco con arma da mischia: +3 al tiro per colpire, portata 1,5 m, un bersaglio. Colpito: 6 (2d4 + 1) danni taglienti."
