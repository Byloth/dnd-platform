name: Idra
alignment: senza allineamento
armorClass.0.note: armatura naturale
traits.0.name: Apnea
traits.0.text: L'idra può trattenere il respiro per 1 ora.
traits.1.name: Policefalia
traits.1.text: |-
  L'idra possiede cinque teste. Finché ha più di una testa, dispone di vantaggio ai tiri salvezza contro le condizioni accecato, affascinato, assordato, privo di sensi, spaventato e stordito.
  Ogni volta che l'idra subisce 25 o più danni in un singolo turno, una delle teste muore. Se tutte le teste muoiono, l'idra muore.
  Alla fine del suo turno, due teste ricrescono per ogni testa morta dal suo ultimo turno, a meno che nel corso di tale periodo non abbia subito danni da fuoco. L'idra recupera 10 punti ferita per ogni testa ricresciuta in questo modo.
traits.2.name: Teste reattive
traits.2.text: Per ogni testa che l'idra possiede oltre la prima, riceve una reazione extra che può essere usata soltanto per gli attacchi di opportunità.
traits.3.name: Sempre all'erta
traits.3.text: Mentre l'idra dorme, almeno una delle sue teste rimane vigile.
actions.0.name: Multiattacco
actions.0.text: L'idra effettua un numero di attacchi con il morso pari al numero di teste che possiede.
actions.0.multiattack.0.action: Morso
actions.1.name: Morso
actions.1.text: "Attacco con arma da mischia: +8 al tiro per colpire, portata 3 m, un bersaglio. Colpito: 10 (1d10 + 5) danni perforanti."
