name: Assassino
text: Gli assassini, addestrati nell'uso dei veleni, sono killer spietati che agiscono per conto di nobili, maestri di gilda, sovrani e di chiunque li paghi debitamente.
alignment: qualsiasi allineamento non buono
armorClass.0.note: cuoio borchiato
languages: Gergo Ladresco più due qualsiasi
traits.0.name: Assassinare
traits.0.text: Durante il suo primo turno, l'assassino dispone di vantaggio ai tiri per colpire contro ogni creatura che non abbia ancora svolto il proprio turno. Ogni colpo che va a segno contro una creatura sorpresa è considerato un colpo critico.
traits.1.name: Elusione
traits.1.text: Se l'assassino è soggetto a un effetto che gli consente di effettuare un tiro salvezza su Destrezza per subire danni dimezzati, non subisce alcun danno in caso di successo, e ne subisce solo metà in caso di fallimento.
traits.2.name: Attacco furtivo (1/turno)
traits.2.text: L'assassino infligge 14 (4d6) danni extra quando colpisce un bersaglio con un attacco con un'arma e ha vantaggio al tiro per colpire, oppure quando il bersaglio si trova entro 1,5 metri da un alleato dell'assassino (purché l'alleato non sia incapacitato e l'assassino non subisca svantaggio al tiro per colpire).
actions.0.name: Multiattacco
actions.0.text: L'assassino effettua due attacchi con la spada corta.
actions.0.multiattack.0.action: Spada corta
actions.1.name: Spada corta
actions.1.text: "Attacco con arma da mischia: +6 al tiro per colpire, portata 1,5 m, un bersaglio. Colpito: 6 (1d6 + 3) danni perforanti e il bersaglio deve effettuare un tiro salvezza su Costituzione con CD 15, subendo 24 (7d6) danni da veleno in caso di fallimento, o la metà dei danni in caso di successo."
actions.2.name: Balestra leggera
actions.2.text: "Attacco con arma a distanza: +6 al tiro per colpire, gittata 24/96 m, un bersaglio. Colpito: 7 (1d8 + 3) danni perforanti e il bersaglio deve effettuare un tiro salvezza su Costituzione con CD 15, subendo 24 (7d6) danni da veleno in caso di fallimento, o la metà dei danni in caso di successo."
