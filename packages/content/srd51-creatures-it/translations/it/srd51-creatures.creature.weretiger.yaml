name: Tigre mannara
alignment: neutrale
immunities.0.note: da attacchi non magici con armi non argentate
languages: Comune (non può parlare in forma di tigre)
traits.0.name: Mutaforma
traits.0.text: La tigre mannara può usare la sua azione per trasformarsi in un ibrido umanoide-tigre o in una tigre, o per tornare alla sua forma naturale, che è umanoide. Le sue statistiche, a eccezione della taglia, restano le stesse in ogni forma. Ogni oggetto che indossa o trasporta non viene trasformato. Se muore, torna alla sua forma naturale.
traits.1.name: Udito e olfatto acuti
traits.1.text: La tigre mannara dispone di vantaggio alle prove di Saggezza (Percezione) basate sull'olfatto o sull'udito.
traits.2.name: Balzo (solo in forma di tigre o ibrida)
traits.2.text: Se la tigre mannara si muove di almeno 4,5 metri in linea retta verso una creatura e poi la colpisce con un attacco con gli artigli nello stesso turno, quel bersaglio deve superare un tiro salvezza su Forza con CD 14, altrimenti cade a terra prono. Se il bersaglio è prono, la tigre mannara può effettuare un attacco con il morso contro di esso come azione bonus.
actions.0.name: Multiattacco (solo in forma umanoide o ibrida)
actions.0.text: In forma umanoide, la tigre mannara effettua due attacchi con la scimitarra o due con l'arco lungo. In forma ibrida, può attaccare come un umanoide o effettuare due attacchi con gli artigli.
actions.1.name: Morso (solo in forma di tigre o ibrida)
actions.1.text: "Attacco con arma da mischia: +5 al tiro per colpire, portata 1,5 m, un bersaglio. Colpito: 8 (1d10 + 3) danni perforanti. Se il bersaglio è un umanoide, deve superare un tiro salvezza su Costituzione con CD 13, altrimenti è costretto a trasformarsi in una tigre mannara."
actions.2.name: Artiglio (solo in forma di tigre o ibrida)
actions.2.text: "Attacco con arma da mischia: +5 al tiro per colpire, portata 1,5 m, un bersaglio. Colpito: 7 (1d8 + 3) danni taglienti."
actions.3.name: Scimitarra (solo in forma umanoide o ibrida)
actions.3.text: "Attacco con arma da mischia: +5 al tiro per colpire, portata 1,5 m, un bersaglio. Colpito: 6 (1d6 + 3) danni taglienti."
actions.4.name: Arco lungo (solo in forma umanoide o ibrida)
actions.4.text: "Attacco con arma a distanza: +4 al tiro per colpire, gittata 45/180 m, un bersaglio. Colpito: 6 (1d8 + 2) danni perforanti."
forms.0.name: Umano
forms.1.name: Ibrido
forms.2.name: Tigre
