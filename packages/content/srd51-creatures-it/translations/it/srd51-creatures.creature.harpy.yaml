name: Arpia
alignment: caotica malvagia
languages: Comune
actions.0.name: Multiattacco
actions.0.text: "L'arpia effettua due attacchi: uno con gli artigli e uno con il randello."
actions.0.multiattack.0.action: Artigli
actions.0.multiattack.1.action: Randello
actions.1.name: Artigli
actions.1.text: "Attacco con arma da mischia: +3 al tiro per colpire, portata 1,5 m, un bersaglio. Colpito: 6 (2d4 + 1) danni taglienti."
actions.2.name: Randello
actions.2.text: "Attacco con arma da mischia: +3 al tiro per colpire, portata 1,5 m, un bersaglio. Colpito: 3 (1d4 + 1) danni contundenti."
actions.3.name: Canto seducente
actions.3.text: |-
  L'arpia intona una melodia magica. Ogni umanoide e gigante situato entro 90 metri dall'arpia e che sia in grado di udire il canto deve superare un tiro salvezza su Saggezza con CD 11, altrimenti è affascinato finché il canto non termina. L'arpia deve effettuare un'azione bonus nei suoi turni successivi per continuare a cantare. Può smettere di cantare in qualsiasi momento. Se l'arpia è incapacitata, il canto termina.
  Finché è affascinato dall'arpia, il bersaglio è incapacitato e ignora i canti delle altre arpie. Se il bersaglio affascinato si trova a più di 1,5 metri di distanza dall'arpia, esso deve muoversi nel proprio turno verso l'arpia seguendo il percorso più diretto e cercando di giungere entro 1,5 metri. Il bersaglio non evita gli attacchi di opportunità, ma prima di muoversi su un terreno pericoloso (come per esempio un lago di lava o una fossa) e qualora subisca danni da una fonte diversa dall'arpia, può ripetere il tiro salvezza. Un bersaglio affascinato può ripetere il tiro salvezza alla fine di ogni suo turno. Se lo supera, l'effetto svanisce.
  Un bersaglio che supera il tiro salvezza è immune al canto di quest'arpia per le 24 ore successive.
