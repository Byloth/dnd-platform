name: Naga spirituale
alignment: caotica malvagia
armorClass.0.note: armatura naturale
languages: Abissale, Comune
traits.0.name: Rigenerazione
traits.0.text: Se la naga muore, torna in vita 1d6 giorni dopo e recupera tutti i suoi punti ferita. Solo un incantesimo desiderio può impedire a questo tratto di funzionare.
traits.1.name: Incantesimi
traits.1.text: |-
  La naga è un incantatore di 10° livello: la sua caratteristica da incantatore è Intelligenza (CD del tiro salvezza sull'incantesimo 14, +6 al tiro per colpire con attacco con incantesimo) e necessita solo di componenti verbali per lanciare i suoi incantesimi. Ha a disposizione gli incantesimi da mago seguenti:

  - Trucchetti (a volontà): illusione minore, mano magica, raggio di gelo
  - 1° livello (4 slot): charme su persone, individuazione del magico, sonno
  - 2° livello (3 slot): blocca persone, individuazione dei pensieri
  - 3° livello (3 slot): fulmine, respirare sott'acqua
  - 4° livello (3 slot): inaridire, porta dimensionale
  - 5° livello (2 slot): dominare persone
actions.0.name: Morso
actions.0.text: "Attacco con arma da mischia: +7 al tiro per colpire, portata 3 m, una creatura. Colpito: 7 (1d6 + 4) danni perforanti e il bersaglio deve effettuare un tiro salvezza su Costituzione con CD 13, subendo 31 (7d8) danni da veleno in caso di fallimento, o la metà in caso di successo."
