name: Ragno-fase
text: "Un ragno-fase è dotato della capacità di entrare e uscire dal Piano Etereo: sembra apparire dal nulla e svanisce rapidamente dopo aver attaccato. Spostandosi sul Piano Etereo prima di fare ritorno sul Piano Materiale, dà l'impressione di potersi teletrasportare."
alignment: senza allineamento
armorClass.0.note: armatura naturale
traits.0.name: Transizione eterea
traits.0.text: Come azione bonus, il ragno può spostarsi magicamente dal Piano Materiale al Piano Etereo o viceversa.
traits.1.name: Movimenti del ragno
traits.1.text: Il ragno può scalare le superfici difficili, compresi i soffitti (lungo i quali si muove a testa in giù), senza effettuare una prova di caratteristica.
traits.2.name: Arrampicatele
traits.2.text: Il ragno ignora le restrizioni di movimento causate dalle ragnatele.
actions.0.name: Morso
actions.0.text: "Attacco con arma da mischia: +4 al tiro per colpire, portata 1,5 m, una creatura. Colpito: 7 (1d10 + 2) danni perforanti e il bersaglio deve effettuare un tiro salvezza su Costituzione con CD 11, subendo 18 (4d8) danni da veleno in caso di fallimento, o la metà in caso di successo. Se i danni da veleno riducono i punti ferita del bersaglio a 0, esso è stabile ma avvelenato per 1 ora anche dopo aver recuperato punti ferita e, mentre è avvelenato in questo modo, è paralizzato."
