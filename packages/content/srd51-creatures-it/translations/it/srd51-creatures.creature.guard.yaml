name: Guardia
text: Le guardie includono i membri della guardia cittadina, le sentinelle di una cittadella o di un paese fortificato e le guardie del corpo di nobili e mercanti.
alignment: qualsiasi allineamento
armorClass.0.note: giaco di maglia, scudo
languages: uno qualsiasi (di solito Comune)
actions.0.name: Lancia
actions.0.text: "Attacco con arma da mischia o a distanza: +3 al tiro per colpire, portata 1,5 m o gittata 6/18 m, un bersaglio. Colpito: 4 (1d6 + 1) danni perforanti o 5 (1d8 + 1) danni perforanti se usata a due mani per effettuare un attacco in mischia."
