name: Alce gigante
text: Il maestoso alce gigante è talmente raro che la sua comparsa è spesso interpretata come il presagio di un evento importante, come la nascita di un re. Secondo alcune leggende, gli dèi assumerebbero la forma di un alce gigante quando fanno visita al Piano Materiale. Molte culture credono quindi che cacciare queste creature significhi attirare su di sé la collera divina.
alignment: senza allineamento
armorClass.0.note: armatura naturale
languages: Alce Gigante, capisce il Comune, l'Elfico e il Silvano ma non li parla
traits.0.name: Carica
traits.0.text: Se l'alce si muove di almeno 6 metri in linea retta verso un bersaglio e poi lo colpisce con un attacco da sfondamento nello stesso turno, il bersaglio subisce 7 (2d6) danni extra. Se il bersaglio è una creatura, deve superare un tiro salvezza su Forza con CD 14, altrimenti cade a terra prono.
actions.0.name: Sfondamento
actions.0.text: "Attacco con arma da mischia: +6 al tiro per colpire, portata 3 m, un bersaglio. Colpito: 11 (2d6 + 4) danni contundenti."
actions.1.name: Zoccoli
actions.1.text: "Attacco con arma da mischia: +6 al tiro per colpire, portata 1,5 m, una creatura prona. Colpito: 22 (4d8 + 4) danni contundenti."
