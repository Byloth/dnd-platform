name: Serpente stritolatore gigante
alignment: senza allineamento
actions.0.name: Morso
actions.0.text: "Attacco con arma da mischia: +6 al tiro per colpire, portata 3 m, una creatura. Colpito: 11 (2d6 + 4) danni perforanti."
actions.1.name: Stritolare
actions.1.text: "Attacco con arma da mischia: +6 al tiro per colpire, portata 1,5 m, una creatura. Colpito: 13 (2d8 + 4) danni contundenti e il bersaglio è afferrato (CD 16 per sfuggire). Finché è afferrato, il bersaglio è trattenuto e il serpente non può stritolarne un altro."
