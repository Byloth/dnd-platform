name: Ragno lupo gigante
text: Un ragno lupo gigante, più piccolo di un ragno gigante, dà la caccia alle sue prede sui terreni aperti o si nasconde in fossi, crepacci o cavità tra i detriti.
alignment: senza allineamento
traits.0.name: Movimenti del ragno
traits.0.text: Il ragno può scalare le superfici difficili, compresi i soffitti (lungo i quali si muove a testa in giù), senza effettuare una prova di caratteristica.
traits.1.name: Percezione della ragnatela
traits.1.text: Finché è in contatto con una ragnatela, il ragno conosce l'ubicazione esatta di ogni altra creatura a contatto con la stessa ragnatela.
traits.2.name: Arrampicatele
traits.2.text: Il ragno ignora le restrizioni di movimento causate dalle ragnatele.
actions.0.name: Morso
actions.0.text: "Attacco con arma da mischia: +3 al tiro per colpire, portata 1,5 m, una creatura. Colpito: 4 (1d6 + 1) danni perforanti e il bersaglio deve effettuare un tiro salvezza su Costituzione con CD 11 subendo 7 (2d6) danni da veleno in caso di fallimento, o la metà in caso di successo. Se i danni da veleno riducono i punti ferita del bersaglio a 0, esso è stabile ma avvelenato per 1 ora anche dopo aver recuperato punti ferita e, mentre è avvelenato in questo modo, è paralizzato."
