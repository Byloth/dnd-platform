name: Diavolo del ghiaccio
alignment: legale malvagio
armorClass.0.note: armatura naturale
resistances.0.note: da attacchi non magici non argentati
languages: Infernale, telepatia 36 m
traits.0.name: Vista del diavolo
traits.0.text: L'oscurità magica non ostacola la scurovisione del diavolo.
traits.1.name: Resistenza alla magia
traits.1.text: Il diavolo dispone di vantaggio ai tiri salvezza contro incantesimi e altri effetti magici.
actions.0.name: Multiattacco
actions.0.text: "Il diavolo effettua tre attacchi: uno con il morso, uno con gli artigli e uno con la coda."
actions.0.multiattack.0.action: Morso
actions.0.multiattack.1.action: Artigli
actions.0.multiattack.2.action: Coda
actions.1.name: Morso
actions.1.text: "Attacco con arma da mischia: +10 al tiro per colpire, portata 1,5 m, un bersaglio. Colpito: 12 (2d6 + 5) danni perforanti più 10 (3d6) danni da freddo."
actions.2.name: Artigli
actions.2.text: "Attacco con arma da mischia: +10 al tiro per colpire, portata 1,5 m, un bersaglio. Colpito: 10 (2d4 + 5) danni taglienti più 10 (3d6) danni da freddo."
actions.3.name: Coda
actions.3.text: "Attacco con arma da mischia: +10 al tiro per colpire, portata 3 m, un bersaglio. Colpito: 12 (2d6 + 5) danni contundenti più 10 (3d6) danni da freddo."
actions.4.name: Muro di ghiaccio
actions.4.text: |-
  Il diavolo genera magicamente un muro di ghiaccio opaco su una superficie visibile entro 18 metri. Il muro è spesso 30 centimetri, lungo al massimo 9 metri e alto 3 metri, oppure è una cupola semisferica del diametro massimo di 6 metri.
  Quando il muro compare, ogni creatura nel suo spazio viene spinta fuori lungo il percorso più breve. La creatura sceglie su quale lato del muro finire, purché non sia incapacitata. La creatura effettua poi un tiro salvezza su Destrezza con CD 17, subendo 35 (10d6) danni da freddo in caso di fallimento, o la metà dei danni in caso di successo.
  Il muro permane per 1 minuto o finché il diavolo non è incapacitato o non muore. Il muro può essere danneggiato e sfondato; ogni sezione di 3 metri ha CA 5, 30 punti ferita, vulnerabilità ai danni da fuoco e immunità ai danni da acido, da freddo, necrotici, psichici e da veleno. Se una sezione viene distrutta, una cortina di aria gelida rimane nello spazio occupato in precedenza dal muro. Ogni volta che una creatura finisce di muoversi attraverso l'aria gelida in un turno, volontariamente o meno, deve effettuare un tiro salvezza su Costituzione con CD 17, subendo 17 (5d6) danni da freddo in caso di fallimento, o la metà dei danni in caso di successo. L'aria gelida si dissipa quando il resto del muro scompare.
