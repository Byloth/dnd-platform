name: Rinoceronte
alignment: senza allineamento
armorClass.0.note: armatura naturale
traits.0.name: Carica
traits.0.text: Se il rinoceronte si muove di almeno 6 metri in linea retta verso un bersaglio e poi lo colpisce con un'incornata nello stesso turno, la vittima subisce 9 (2d8) danni contundenti extra. Se il bersaglio è una creatura, deve superare un tiro salvezza su Forza con CD 15, altrimenti cade a terra prono.
actions.0.name: Incornata
actions.0.text: "Attacco con arma da mischia: +7 al tiro per colpire, portata 1,5 m, un bersaglio. Colpito: 14 (2d8 + 5) danni contundenti."
