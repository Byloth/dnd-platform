name: Guardiano protettore
alignment: senza allineamento
armorClass.0.note: armatura naturale
languages: capisce i comandi impartiti in qualsiasi linguaggio, ma non è in grado di parlare
traits.0.name: Vincolato
traits.0.text: Il guardiano protettore è vincolato magicamente a un amuleto. Finché il guardiano e il suo amuleto si trovano sullo stesso piano di esistenza, il portatore dell'amuleto può chiamare telepaticamente il guardiano affinché viaggi fino a lui. Il guardiano conosce la distanza e la direzione dell'oggetto. Se il guardiano si trova entro 18 metri dal portatore dell'amuleto, la metà dei danni (arrotondati per eccesso) che il portatore subisce viene trasferita al guardiano.
traits.1.name: Rigenerazione
traits.1.text: Il guardiano protettore recupera 10 punti ferita all'inizio del suo turno, se ha almeno 1 punto ferita.
traits.2.name: Accumula incantesimi
traits.2.text: Un incantatore che indossa l'amuleto del guardiano protettore può fare in modo che il guardiano custodisca un incantesimo di 4° livello o inferiore. Per farlo, il portatore deve lanciare l'incantesimo sul guardiano. L'incantesimo non ha effetto, ma è custodito all'interno del guardiano. Quando il portatore gli ordina di farlo o quando si verifica una condizione predefinita dall'incantatore, il guardiano lancia l'incantesimo custodito usando gli eventuali parametri stabiliti dall'incantatore originale e senza bisogno di componenti. Quando l'incantesimo viene lanciato o se un nuovo incantesimo viene custodito nel guardiano, ogni eventuale incantesimo custodito in precedenza va perduto.
actions.0.name: Multiattacco
actions.0.text: Il guardiano effettua due attacchi con i pugni.
actions.0.multiattack.0.action: Pugno
actions.1.name: Pugno
actions.1.text: "Attacco con arma da mischia: +7 al tiro per colpire, portata 1,5 m, un bersaglio. Colpito: 11 (2d6 + 4) danni contundenti."
reactions.0.name: Protettore
reactions.0.text: Quando una creatura effettua un attacco contro chi indossa l'amuleto, il guardiano concede un bonus di +2 alla CA del portatore se il guardiano si trova entro 1,5 metri da lui.
