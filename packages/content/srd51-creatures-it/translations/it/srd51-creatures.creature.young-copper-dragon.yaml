name: Drago di rame giovane
alignment: caotico buono
armorClass.0.note: armatura naturale
languages: Comune, Draconico
actions.0.name: Multiattacco
actions.0.text: "Il drago effettua tre attacchi: uno con il morso e due con gli artigli."
actions.0.multiattack.0.action: Morso
actions.0.multiattack.1.action: Artiglio
actions.1.name: Morso
actions.1.text: "Attacco con arma da mischia: +7 al tiro per colpire, portata 3 m, un bersaglio. Colpito: 15 (2d10 + 4) danni perforanti."
actions.2.name: Artiglio
actions.2.text: "Attacco con arma da mischia: +7 al tiro per colpire, portata 1,5 m, un bersaglio. Colpito: 11 (2d6 + 4) danni taglienti."
actions.3.name: Soffi
actions.3.text: |-
  Il drago usa uno dei seguenti soffi.
  Soffio di acido. Il drago esala una scia di acido lunga 12 metri e larga 1,5 metri. Ogni creatura su quella scia deve effettuare un tiro salvezza su Destrezza con CD 14, subendo 40 (9d8) danni da acido in caso di fallimento, o la metà dei danni in caso di successo.
  Soffio rallentante. Il drago esala gas in un cono di 9 metri. Ogni creatura in quell'area deve superare un tiro salvezza su Costituzione con CD 14; se lo fallisce, non può usare reazioni, la sua velocità è dimezzata e non può effettuare più di un attacco nel suo turno. Inoltre, nel suo turno la creatura può usare un'azione o un'azione bonus, ma non entrambe. Questi effetti durano 1 minuto. La creatura può ripetere il tiro salvezza alla fine di ogni suo turno e, se lo supera, l'effetto per lei termina.
