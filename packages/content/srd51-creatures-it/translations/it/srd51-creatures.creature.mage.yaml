name: Mago
text: I maghi trascorrono la vita a studiare e praticare la magia. I maghi di allineamento buono offrono consigli ai nobili o ad altre figure potenti, mentre quelli malvagi si nascondono in luoghi isolati per condurre esperimenti atroci senza che nessuno possa interferire.
alignment: qualsiasi allineamento
armorClass.1.note: con armatura magica
languages: quattro qualsiasi
traits.0.name: Incantesimi
traits.0.text: |-
  Il mago è un incantatore di 9° livello: la sua caratteristica da incantatore è Intelligenza (CD del tiro salvezza sull'incantesimo 14, +6 al tiro per colpire con attacco con incantesimo). Ha a disposizione i seguenti incantesimi da mago:

  - Trucchetti (a volontà): dardo di fuoco, luce, mano magica, prestidigitazione
  - 1° livello (4 slot): armatura magica, dardo incantato, individuazione del magico, scudo
  - 2° livello (3 slot): passo velato, suggestione
  - 3° livello (3 slot): controincantesimo, palla di fuoco, volare
  - 4° livello (3 slot): invisibilità superiore, tempesta di ghiaccio
  - 5° livello (1 slot): cono di freddo
actions.0.name: Pugnale
actions.0.text: "Attacco con arma da mischia o con arma a distanza: +5 al tiro per colpire, portata 1,5 m o gittata 6/18 m, un bersaglio. Colpito: 4 (1d4 + 2) danni perforanti."
