name: Drago rosso adulto
alignment: caotico malvagio
armorClass.0.note: armatura naturale
languages: Comune, Draconico
traits.0.name: Resistenza leggendaria
traits.0.text: Se il drago fallisce un tiro salvezza, può scegliere di superarlo comunque.
actions.0.name: Multiattacco
actions.0.text: "Il drago può usare la sua Presenza terrificante. Poi effettua tre attacchi: uno con il morso e due con gli artigli."
actions.0.multiattack.0.action: Presenza terrificante
actions.0.multiattack.1.action: Morso
actions.0.multiattack.2.action: Artiglio
actions.1.name: Morso
actions.1.text: "Attacco con arma da mischia: +14 al tiro per colpire, portata 3 m, un bersaglio. Colpito: 19 (2d10 + 8) danni perforanti più 7 (2d6) danni da fuoco."
actions.2.name: Artiglio
actions.2.text: "Attacco con arma da mischia: +14 al tiro per colpire, portata 1,5 m, un bersaglio. Colpito: 15 (2d6 + 8) danni taglienti."
actions.3.name: Coda
actions.3.text: "Attacco con arma da mischia: +14 al tiro per colpire, portata 4,5 m, un bersaglio. Colpito: 17 (2d8 + 8) danni contundenti."
actions.4.name: Presenza terrificante
actions.4.text: Ogni creatura a scelta del drago situata entro 36 metri da esso e consapevole della sua presenza deve superare un tiro salvezza su Saggezza con CD 19, altrimenti è spaventata per 1 minuto. La creatura può ripetere il tiro salvezza alla fine di ogni suo turno e, se lo supera, l'effetto svanisce. Se una creatura supera il tiro salvezza o se l'effetto per lei termina, è immune alla Presenza terrificante del drago per le 24 ore successive.
actions.5.name: Soffio di fuoco
actions.5.text: Il drago esala fuoco in un cono di 18 metri. Ogni creatura in quell'area deve effettuare un tiro salvezza su Destrezza con CD 21, subendo 63 (18d6) danni da fuoco in caso di fallimento, o la metà dei danni in caso di successo.
legendary.actions.0.name: Individuazione
legendary.actions.0.text: Il drago effettua una prova di Saggezza (Percezione).
legendary.actions.1.name: Attacco di coda
legendary.actions.1.text: Il drago effettua un attacco con la coda.
legendary.actions.2.name: Attacco d'ala (costa 2 azioni)
legendary.actions.2.text: Il drago sbatte le ali. Ogni creatura entro 3 metri dal drago deve superare un tiro salvezza su Destrezza con CD 22, altrimenti subisce 15 (2d6 + 8) danni contundenti e cade a terra prona. Il drago può poi volare fino a metà della sua velocità di volare.
