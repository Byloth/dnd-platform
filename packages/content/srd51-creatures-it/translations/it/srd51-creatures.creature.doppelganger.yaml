name: Doppelganger
alignment: neutrale
languages: Comune
traits.0.name: Mutaforma
traits.0.text: Il doppelganger può usare la sua azione per trasformarsi in un umanoide Piccolo o Medio che abbia visto in precedenza, o per tornare alla sua forma naturale. Le sue statistiche, a eccezione della taglia, restano le stesse in ogni forma. Ogni oggetto che indossa o trasporta non viene trasformato. Se muore, torna alla sua forma naturale.
traits.1.name: Imboscata
traits.1.text: Nel primo round di un combattimento, il doppelganger dispone di vantaggio ai tiri per colpire contro qualsiasi creatura che riesca a cogliere di sorpresa.
traits.2.name: Attacco a sorpresa
traits.2.text: Se il doppelganger sorprende una creatura e la colpisce con un attacco durante il primo round di combattimento, il bersaglio subisce 10 (3d6) danni extra dall'attacco.
actions.0.name: Multiattacco
actions.0.text: Il doppelganger effettua due attacchi in mischia.
actions.0.multiattack.0.action: Schianto
actions.1.name: Schianto
actions.1.text: "Attacco con arma da mischia: +6 al tiro per colpire, portata 1,5 m, un bersaglio. Colpito: 7 (1d6 + 4) danni contundenti."
actions.2.name: Lettura del pensiero
actions.2.text: Il doppelganger può leggere magicamente i pensieri superficiali di una creatura entro 18 metri da lui. Questo effetto può penetrare le barriere, ma 90 centimetri di legno o terriccio, 60 centimetri di pietra, 5 centimetri di metallo o una sottile lamina di piombo lo bloccano. Mentre il bersaglio si trova entro gittata, il doppelganger può continuare a leggere i suoi pensieri finché non perde la concentrazione (come se si concentrasse su un incantesimo). Quando legge i pensieri del bersaglio, il doppelganger dispone di vantaggio alle prove di Saggezza (Intuizione) e Carisma (Inganno, Intimidire e Persuasione) contro il bersaglio.
