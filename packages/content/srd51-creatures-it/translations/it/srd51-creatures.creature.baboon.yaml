name: Babbuino
alignment: senza allineamento
traits.0.name: Tattiche del branco
traits.0.text: Il babbuino dispone di un vantaggio nel tiro per colpire contro una creatura se almeno uno degli alleati del babbuino si trova entro 1,5 metri dalla creatura e non è incapacitato.
actions.0.name: Morso
actions.0.text: "Attacco con arma da mischia: +1 al tiro per colpire, portata 1,5 m, un bersaglio. Colpito: 1 (1d4 - 1) danni perforanti."
