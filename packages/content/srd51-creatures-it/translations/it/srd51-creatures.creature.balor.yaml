name: Balor
alignment: caotico malvagio
armorClass.0.note: armatura naturale
resistances.2.note: da attacchi non magici
languages: Abissale, telepatia 36 m
traits.0.name: Spasmi di morte
traits.0.text: Quando il balor muore, esplode e ogni creatura situata entro 9 metri da lui deve effettuare un tiro salvezza su Destrezza con CD 20, subendo 70 (20d6) danni da fuoco in caso di fallimento, o la metà dei danni in caso di successo. L'esplosione incendia gli oggetti infiammabili in quell'area che non sono indossati o trasportati e distrugge le armi del balor.
traits.1.name: Aura di fuoco
traits.1.text: All'inizio di ognuno dei turni del balor, ogni creatura situata entro 1,5 metri da lui subisce 10 (3d6) danni da fuoco e gli oggetti infiammabili nell'aura che non sono indossati o trasportati si incendiano. Una creatura che tocchi il balor o lo colpisca con un attacco in mischia mentre si trova entro 1,5 metri da lui subisce 10 (3d6) danni da fuoco.
traits.2.name: Resistenza alla magia
traits.2.text: Il balor dispone di vantaggio ai tiri salvezza contro incantesimi e altri effetti magici.
traits.3.name: Armi magiche
traits.3.text: Gli attacchi con arma del balor sono magici.
actions.0.name: Multiattacco
actions.0.text: "Il balor effettua due attacchi: uno con la spada lunga e uno con la frusta."
actions.0.multiattack.0.action: Spada lunga
actions.0.multiattack.1.action: Frusta
actions.1.name: Spada lunga
actions.1.text: "Attacco con arma da mischia: +14 al tiro per colpire, portata 3 m, un bersaglio. Colpito: 21 (3d8 + 8) danni taglienti più 13 (3d8) danni da fulmine. Se il balor mette a segno un colpo critico, tira i dadi per i danni tre volte invece che due."
actions.2.name: Frusta
actions.2.text: "Attacco con arma da mischia: +14 al tiro per colpire, portata 9 m, un bersaglio. Colpito: 15 (2d6 + 8) danni taglienti più 10 (3d6) danni da fuoco e il bersaglio deve superare un tiro salvezza su Forza con CD 20, altrimenti verrà tirato fino a 7,5 metri più vicino al balor."
actions.3.name: Teletrasporto
actions.3.text: Il balor si teletrasporta magicamente, insieme a ogni oggetto che indossa o trasporta, fino a uno spazio libero visibile entro 36 metri.
