name: Cane intermittente
text: Un cane intermittente trae il nome dalla sua capacità di apparire e scomparire da un piano di esistenza, un talento che usa per attaccare con più efficacia ed evitare di essere ferito.
alignment: legale buono
languages: Cane Intermittente, capisce il Silvano ma non lo parla
traits.0.name: Udito e olfatto acuti
traits.0.text: Il cane dispone di vantaggio alle prove di Saggezza (Percezione) basate sull'olfatto o sull'udito.
actions.0.name: Morso
actions.0.text: "Attacco con arma da mischia: +3 al tiro per colpire, portata 1,5 m, un bersaglio. Colpito: 4 (1d6 + 1) danni perforanti."
actions.1.name: Teletrasporto
actions.1.text: Il cane si teletrasporta magicamente, insieme a ogni oggetto che indossa o trasporta, fino a uno spazio libero visibile situato entro 12 metri. Prima o dopo essersi teletrasportato, il cane può effettuare un attacco con il morso.
