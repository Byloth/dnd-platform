name: Grimlock
alignment: neutrale malvagio
languages: Sottocomune
traits.0.name: Percezione cieca
traits.0.text: Il grimlock non può usare la sua vista cieca finché è assordato e non ha olfatto.
traits.1.name: Udito e olfatto acuti
traits.1.text: Il grimlock dispone di vantaggio alle prove di Saggezza (Percezione) basate sull'olfatto o sull'udito.
traits.2.name: Mimetizzazione rocciosa
traits.2.text: Il grimlock dispone di vantaggio alle prove di Destrezza (Furtività) effettuate per nascondersi nei terreni rocciosi.
actions.0.name: Clava di osso chiodata
actions.0.text: "Attacco con arma da mischia: +5 al tiro per colpire, portata 1,5 m, un bersaglio. Colpito: 5 (1d4 + 3) danni contundenti più 2 (1d4) danni perforanti."
