name: Minotauro
alignment: caotico malvagio
armorClass.0.note: armatura naturale
languages: Abissale
traits.0.name: Carica
traits.0.text: Se il minotauro si muove di almeno 3 metri in linea retta verso un bersaglio e poi lo colpisce con un'incornata nello stesso turno, la vittima subisce 9 (2d8) danni perforanti extra. Se il bersaglio è una creatura, deve superare un tiro salvezza su Forza con CD 14, altrimenti viene scagliato a 3 metri di distanza e buttato a terra prono.
traits.1.name: Ricordo labirintico
traits.1.text: Il minotauro è in grado di ricordarsi alla perfezione qualsiasi tragitto abbia già percorso.
traits.2.name: Avventato
traits.2.text: All'inizio del suo turno, il minotauro può ottenere un vantaggio a tutti i tiri per colpire con arma da mischia durante quel turno; tuttavia, i tiri per colpirlo hanno un vantaggio fino all'inizio del suo turno successivo.
actions.0.name: Ascia bipenne
actions.0.text: "Attacco con arma da mischia: +6 al tiro per colpire, portata 1,5 m, un bersaglio. Colpito: 17 (2d12 + 4) danni taglienti."
actions.1.name: Incornata
actions.1.text: "Attacco con arma da mischia: +6 al tiro per colpire, portata 1,5 m, un bersaglio. Colpito: 13 (2d8 + 4) danni perforanti."
