name: Rakshasa
alignment: legale malvagio
armorClass.0.note: armatura naturale
vulnerabilities.0.note: da armi magiche impugnate da creature buone
immunities.0.note: da attacchi non magici
languages: Comune, Infernale
traits.0.name: Immunità alla magia limitata
traits.0.text: Il rakshasa non può essere influenzato o individuato dagli incantesimi di 6° livello o inferiori se non lo desidera. Dispone di vantaggio ai tiri salvezza contro tutti gli altri incantesimi ed effetti magici.
traits.1.name: Incantesimi innati
traits.1.text: |-
  La caratteristica innata da incantatore del rakshasa è Carisma (CD del tiro salvezza sull'incantesimo 18, +10 al tiro per colpire con attacco con incantesimo). Per sua natura, il rakshasa è in grado di lanciare gli incantesimi indicati di seguito senza aver bisogno di componenti materiali:

  A volontà: camuffare se stesso, illusione minore, individuazione dei pensieri, mano magica
  3/giorno ciascuno: charme su persone, immagine maggiore, individuazione del magico, invisibilità, suggestione
  1/giorno ciascuno: dominare persone, spostamento planare, visione del vero, volare
actions.0.name: Multiattacco
actions.0.text: Il rakshasa effettua due attacchi con gli artigli.
actions.0.multiattack.0.action: Artiglio
actions.1.name: Artiglio
actions.1.text: "Attacco con arma da mischia: +7 al tiro per colpire, portata 1,5 m, un bersaglio. Colpito: 9 (2d6 + 2) danni taglienti e il bersaglio è maledetto se è una creatura. La maledizione magica ha effetto ogni volta che il bersaglio inizia un riposo breve o lungo, e provoca immagini e incubi orribili nella mente della vittima. Il bersaglio maledetto non ottiene alcun beneficio quando completa un riposo breve o lungo. La maledizione permane finché non viene rimossa da un incantesimo rimuovi maledizione o da una magia analoga."
