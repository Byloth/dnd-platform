name: Hezrou
alignment: caotico malvagio
armorClass.0.note: armatura naturale
resistances.3.note: da attacchi non magici
languages: Abissale, telepatia 36 m
traits.0.name: Resistenza alla magia
traits.0.text: L'hezrou dispone di vantaggio ai tiri salvezza contro incantesimi e altri effetti magici.
traits.1.name: Fetore
traits.1.text: Ogni creatura che inizia il proprio turno entro 3 metri dall'hezrou deve superare un tiro salvezza su Costituzione con CD 14, altrimenti è avvelenata fino all'inizio del proprio turno successivo. Se supera il tiro salvezza, la creatura è immune al fetore dell'hezrou per 24 ore.
actions.0.name: Multiattacco
actions.0.text: "L'hezrou effettua tre attacchi: uno con il morso e due con gli artigli."
actions.0.multiattack.0.action: Morso
actions.0.multiattack.1.action: Artiglio
actions.1.name: Morso
actions.1.text: "Attacco con arma da mischia: +7 al tiro per colpire, portata 1,5 m, un bersaglio. Colpito: 15 (2d10 + 4) danni perforanti."
actions.2.name: Artiglio
actions.2.text: "Attacco con arma da mischia: +7 al tiro per colpire, portata 1,5 m, un bersaglio. Colpito: 11 (2d6 + 4) danni taglienti."
