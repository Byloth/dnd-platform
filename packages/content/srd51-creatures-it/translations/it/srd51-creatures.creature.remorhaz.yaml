name: Remorhaz
alignment: senza allineamento
armorClass.0.note: armatura naturale
traits.0.name: Corpo surriscaldato
traits.0.text: Una creatura che tocchi il remorhaz o lo colpisca con un attacco in mischia mentre si trova entro 1,5 metri da lui subisce 10 (3d6) danni da fuoco.
actions.0.name: Morso
actions.0.text: "Attacco con arma da mischia: +11 al tiro per colpire, portata 3 m, un bersaglio. Colpito: 40 (6d10 + 7) danni perforanti più 10 (3d6) danni da fuoco. Se il bersaglio è una creatura, viene afferrato (CD 17 per sfuggire). Finché la presa perdura, il bersaglio viene trattenuto e il remorhaz non può morderne un altro."
actions.1.name: Inghiottire
actions.1.text: |-
  Il remorhaz effettua un attacco con il morso contro una creatura di taglia Media o inferiore con cui sta lottando. Se l'attacco va a segno, la creatura subisce i danni del morso e viene inghiottita, ma la lotta termina. Mentre è inghiottita, la creatura è accecata e trattenuta, beneficia di copertura totale contro gli attacchi e altri effetti al di fuori del remorhaz e subisce 21 (6d6) danni da acido all'inizio di ogni turno del mostro.
  Se il remorhaz subisce 30 o più danni in un singolo turno da una creatura al suo interno, deve superare un tiro salvezza su Costituzione con CD 15 alla fine di quel turno, altrimenti rigurgita tutte le creature inghiottite, che cadono a terra prone in uno spazio entro 3 metri da lui. Se il remorhaz muore, la creatura inghiottita non è più trattenuta dal mostro e può sfuggire usando 4,5 metri di movimento, uscendo prona dal mostro.
