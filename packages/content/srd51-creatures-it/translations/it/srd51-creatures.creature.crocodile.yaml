actions.0.text: "Attacco con arma da mischia: +4 al tiro per colpire, portata 1,5 m, una creatura. Colpito: 7 (1d10 + 2) danni perforanti e il bersaglio viene afferrato (CD 12 per sfuggire). Finché la presa perdura, il bersaglio viene trattenuto e il coccodrillo non può morderne un altro."
