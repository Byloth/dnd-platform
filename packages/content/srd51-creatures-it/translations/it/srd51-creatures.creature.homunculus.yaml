name: Omuncolo
alignment: neutrale
armorClass.0.note: armatura naturale
languages: comprende i linguaggi del suo creatore ma non li sa parlare
traits.0.name: Legame telepatico
traits.0.text: Finché l'omuncolo si trova sullo stesso piano di esistenza del suo padrone, può trasmettergli magicamente ciò che percepisce e i due possono comunicare telepaticamente.
actions.0.name: Morso
actions.0.text: "Attacco con arma da mischia: +4 al tiro per colpire, portata 1,5 m, una creatura. Colpito: 1 danno perforante e il bersaglio deve superare un tiro salvezza su Costituzione con CD 10, altrimenti è avvelenato per 1 minuto. Se fallisce il tiro salvezza di 5 o più, il bersaglio è invece avvelenato per 5 (1d10) minuti ed è privo di sensi finché è in questo stato."
