name: Pseudodrago
alignment: neutrale buono
armorClass.0.note: armatura naturale
languages: capisce Comune e Draconico, ma non è in grado di parlarli
traits.0.name: Sensi acuti
traits.0.text: Lo pseudodrago dispone di vantaggio alle prove di Saggezza (Percezione) basate sulla vista, sull'udito o sull'olfatto.
traits.1.name: Resistenza alla magia
traits.1.text: Lo pseudodrago dispone di vantaggio ai tiri salvezza contro incantesimi e altri effetti magici.
traits.2.name: Telepatia limitata
traits.2.text: Lo pseudodrago può trasmettere magicamente idee, emozioni e immagini semplici a qualsiasi creatura situata entro 30 metri da lui e che sia in grado di comprendere un linguaggio.
actions.0.name: Morso
actions.0.text: "Attacco con arma da mischia: +4 al tiro per colpire, portata 1,5 m, un bersaglio. Colpito: 4 (1d4 + 2) danni perforanti."
actions.1.name: Pungiglione
actions.1.text: "Attacco con arma da mischia: +4 al tiro per colpire, portata 1,5 m, una creatura. Colpito: 4 (1d4 + 2) danni perforanti e il bersaglio deve superare un tiro salvezza su Costituzione con CD 11, altrimenti è avvelenato per 1 ora. Se fallisce il tiro salvezza di 5 o più, il bersaglio perde conoscenza per la stessa durata, o finché non subisce danni o un'altra creatura non usa un'azione per risvegliarlo scuotendolo."
