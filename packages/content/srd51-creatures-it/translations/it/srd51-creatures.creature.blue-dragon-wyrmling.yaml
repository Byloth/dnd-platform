name: Drago blu cucciolo
alignment: legale malvagio
armorClass.0.note: armatura naturale
languages: Draconico
actions.0.name: Morso
actions.0.text: "Attacco con arma da mischia: +5 al tiro per colpire, portata 1,5 m, un bersaglio. Colpito: 8 (1d10 + 3) danni perforanti più 3 (1d6) danni da fulmine."
actions.1.name: Soffio di fulmini
actions.1.text: Il drago esala una scarica di fulmini lunga 9 metri e larga 1,5 metri. Ogni creatura su quella linea deve effettuare un tiro salvezza su Destrezza con CD 12, subendo 22 (4d10) danni da fulmine in caso di fallimento, o la metà dei danni in caso di successo.
