name: Kraken
alignment: caotico malvagio
armorClass.0.note: armatura naturale
immunities.1.note: da attacchi non magici
languages: capisce l'Abissale, il Celestiale, l'Infernale e il Primordiale ma non li parla, telepatia 36 m
traits.0.name: Anfibio
traits.0.text: Il kraken può respirare in aria e in acqua.
traits.1.name: Libertà di movimento
traits.1.text: Il kraken ignora il terreno difficile e gli effetti magici non possono ridurre la sua velocità o trattenerlo. Può spendere 1,5 metri di movimento per liberarsi dalle costrizioni non magiche o dall'essere afferrato.
traits.2.name: Mostro da assedio
traits.2.text: Il kraken infligge danni doppi agli oggetti e alle strutture.
actions.0.name: Multiattacco
actions.0.text: Il kraken effettua tre attacchi con i tentacoli; ognuno può essere sostituito con un uso di Scagliare.
actions.1.name: Morso
actions.1.text: "Attacco con arma da mischia: +17 al tiro per colpire, portata 1,5 m, un bersaglio. Colpito: 23 (3d8 + 10) danni perforanti. Se il bersaglio afferrato è una creatura di taglia Grande o inferiore, viene inghiottito e il kraken molla la presa. Mentre è inghiottita, la creatura è accecata e trattenuta, beneficia di copertura totale contro gli attacchi e altri effetti al di fuori del kraken, e subisce 42 (12d6) danni da acido all'inizio di ogni turno del mostro. Se il kraken subisce 50 o più danni in un singolo turno da una creatura al suo interno, deve superare un tiro salvezza su Costituzione con CD 25 alla fine di quel turno, altrimenti rigurgita tutte le creature inghiottite, che cadono prone in uno spazio entro 3 metri da lui. Se il kraken muore, la creatura inghiottita non è più trattenuta dal mostro e può sfuggire usando 4,5 metri di movimento, uscendo prona dal mostro."
actions.2.name: Tentacolo
actions.2.text: "Attacco con arma da mischia: +17 al tiro per colpire, portata 9 m, un bersaglio. Colpito: 20 (3d6 + 10) danni contundenti e il bersaglio è afferrato (CD 18 per sfuggire). Finché la presa perdura, il bersaglio viene trattenuto. Il kraken ha dieci tentacoli, ognuno dei quali può afferrare un bersaglio."
actions.3.name: Scagliare
actions.3.text: Un oggetto impugnato o una creatura afferrata dal kraken di taglia Grande o inferiore viene scagliato a un'altezza massima di 18 metri in una direzione casuale e gettato a terra prono. Se un bersaglio scagliato colpisce una superficie solida, subisce 3 (1d6) danni contundenti per ogni 3 metri di cui è stato scagliato. Se il bersaglio viene lanciato contro un'altra creatura, quest'ultima deve superare un tiro salvezza su Destrezza con CD 18, altrimenti subirà gli stessi danni e cadrà a terra prona.
actions.4.name: Tempesta di fulmini
actions.4.text: Il kraken crea magicamente tre fulmini, ognuno dei quali può colpire un bersaglio nel suo campo visivo in un raggio di 36 metri. Il bersaglio deve effettuare un tiro salvezza su Destrezza con CD 23, subendo 22 (4d10) danni da fulmine in caso di fallimento, o la metà dei danni in caso di successo.
legendary.actions.0.name: Attacco con i tentacoli o Scagliare
legendary.actions.0.text: Il kraken effettua un attacco con i tentacoli o usa Scagliare.
legendary.actions.1.name: Tempesta di fulmini (costa 2 azioni)
legendary.actions.1.text: Il kraken usa Tempesta di fulmini.
legendary.actions.2.name: Nebbia di inchiostro (costa 3 azioni)
legendary.actions.2.text: Mentre è sott'acqua, il kraken espelle una nube d'inchiostro nel raggio di 18 metri. La nube si diffonde nell'ambiente e quell'area è pesantemente oscurata per tutte le creature tranne il kraken. Ogni creatura diversa dal kraken che termina il proprio turno in quell'area deve effettuare un tiro salvezza su Costituzione con CD 23, subendo 16 (3d10) danni da veleno in caso di fallimento, o la metà in caso di successo. Una corrente forte disperde la nube, che altrimenti si dissipa alla fine del turno successivo del kraken.
