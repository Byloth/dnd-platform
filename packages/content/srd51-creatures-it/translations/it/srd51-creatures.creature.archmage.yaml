name: Arcimago
text: |-
  Gli arcimaghi sono incantatori potenti (e di solito piuttosto anziani) dediti allo studio delle arti arcane. Quelli più benevoli fungono da consiglieri per re e regine, mentre quelli malvagi esercitano il potere tirannicamente e ambiscono a trasformarsi in lich. Quelli che non sono né buoni né malvagi si isolano all'interno di remote torri per poter praticare la loro magia indisturbati.

  Un arcimago solitamente è assistito da uno o più apprendisti maghi e protegge la sua dimora con numerose interdizioni e guardiani magici per scoraggiare eventuali intrusioni.
