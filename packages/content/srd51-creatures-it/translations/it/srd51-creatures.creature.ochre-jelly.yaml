name: Ameba paglierina
alignment: senza allineamento
traits.0.name: Amorfo
traits.0.text: L'ameba può muoversi attraverso uno spazio stretto fino a 2,5 centimetri senza doversi stringere.
traits.1.name: Movimenti del ragno
traits.1.text: L'ameba può scalare le superfici difficili, inclusi i soffitti (lungo i quali si muove a testa in giù), senza effettuare una prova di caratteristica.
actions.0.name: Pseudopode
actions.0.text: "Attacco con arma da mischia: +4 al tiro per colpire, portata 1,5 m, un bersaglio. Colpito: 9 (2d6 + 2) danni contundenti più 3 (1d6) danni da acido."
reactions.0.name: Scindersi
reactions.0.text: Quando un'ameba di taglia Media o superiore è soggetta a danni da fulmine o a danni taglienti, si scinde in due nuove amebe se possiede almeno 10 punti ferita. Ogni nuova ameba ha un numero di punti ferita pari alla metà dell'ameba originale, arrotondando per difetto. Le nuove amebe sono inferiori di una taglia rispetto a quella originale.
