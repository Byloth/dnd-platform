name: Hobgoblin
alignment: legale malvagio
armorClass.0.note: cotta di maglia, scudo
languages: Comune, Goblin
traits.0.name: Vantaggio marziale
traits.0.text: Una volta per turno, l'hobgoblin può infliggere 7 (2d6) danni extra a una creatura che colpisce con un attacco con arma, se quella creatura si trova entro 1,5 metri da un alleato dell'hobgoblin che non sia incapacitato.
actions.0.name: Spada lunga
actions.0.text: "Attacco con arma da mischia: +3 al tiro per colpire, portata 1,5 m, un bersaglio. Colpito: 5 (1d8 + 1) danni taglienti o 6 (1d10 + 1) danni taglienti se impugnata con due mani."
actions.1.name: Arco lungo
actions.1.text: "Attacco con arma a distanza: +3 al tiro per colpire, gittata 45/180 m, un bersaglio. Colpito: 5 (1d8 + 1) danni perforanti."
