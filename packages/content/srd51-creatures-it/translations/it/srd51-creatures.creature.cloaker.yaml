name: Manto assassino
alignment: caotico neutrale
armorClass.0.note: armatura naturale
languages: Gergo delle profondità, Sottocomune
traits.0.name: Trasferire danni
traits.0.text: Finché è avvinghiato a una creatura, il manto assassino subisce solo metà dei danni che gli vengono inflitti (arrotondati per difetto) e quella creatura subisce l'altra metà.
traits.1.name: Falso aspetto
traits.1.text: Finché il manto assassino rimane immobile e non rende visibile il suo lato inferiore, non è possibile distinguerlo da un mantello di cuoio scuro.
traits.2.name: Sensibilità alla luce
traits.2.text: Finché è esposto alla luce intensa, il manto assassino subisce svantaggio ai tiri per colpire e alle prove di Saggezza (Percezione) basate sulla vista.
actions.0.name: Multiattacco
actions.0.text: "Il manto assassino effettua due attacchi: uno con il morso e uno con la coda."
actions.0.multiattack.0.action: Morso
actions.0.multiattack.1.action: Coda
actions.1.name: Morso
actions.1.text: "Attacco con arma da mischia: +6 al tiro per colpire, portata 1,5 m, una creatura. Colpito: 10 (2d6 + 3) danni perforanti e, se il bersaglio è di taglia Grande o inferiore, il manto assassino si avvinghia a esso. Se il manto assassino dispone di vantaggio contro il bersaglio, si avvinghia alla testa del bersaglio, che è accecato e impossibilitato a respirare finché il manto assassino resta attaccato. Mentre è avvinghiato, il manto assassino può effettuare questo attacco solo contro il bersaglio e dispone di vantaggio al tiro per colpire. Il manto assassino può staccarsi da solo spendendo 1,5 metri del suo movimento. Una creatura, incluso il bersaglio, può usare la sua azione per staccare il manto assassino, se effettua con successo una prova di Forza con CD 16."
actions.2.name: Coda
actions.2.text: "Attacco con arma da mischia: +6 al tiro per colpire, portata 3 m, una creatura. Colpito: 7 (1d8 + 3) danni taglienti."
actions.3.name: Gemito
actions.3.text: Ogni creatura entro 18 metri dal manto assassino che possa sentire il suo gemito e che non sia un'aberrazione deve superare un tiro salvezza su Saggezza con CD 13, altrimenti è spaventata fino alla fine del turno successivo del manto assassino. Se la creatura supera il tiro salvezza, è immune al gemito del manto assassino per le 24 ore successive.
actions.4.name: Allucinazioni
actions.4.text: |-
  Il manto assassino crea magicamente tre duplicati illusori di se stesso se non è esposto alla luce intensa. I duplicati si muovono insieme a lui e imitano le sue azioni, scambiandosi di posizione in modo che sia impossibile capire quale manto assassino sia quello vero. Se il manto assassino si trova in un'area di luce intensa, i duplicati scompaiono.
  Ogni volta che una creatura bersaglia il manto assassino con un attacco o un incantesimo dannoso finché permane un duplicato, quella creatura effettua un tiro casuale per determinare se bersaglia il manto assassino o uno dei suoi duplicati. Una creatura non è influenzata da questo effetto magico se non può vedere o se si affida a sensi diversi dalla vista.
  Un duplicato possiede la CA del manto assassino e usa i suoi tiri salvezza. Se un attacco colpisce un duplicato o se un duplicato fallisce un tiro salvezza contro un effetto che infligge danni, quel duplicato scompare.
