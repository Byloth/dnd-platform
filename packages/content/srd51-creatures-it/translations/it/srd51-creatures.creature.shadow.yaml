name: Ombra
alignment: caotico malvagio
resistances.5.note: da attacchi non magici
traits.0.name: Amorfo
traits.0.text: L'ombra può muoversi attraverso uno spazio stretto fino a 2,5 centimetri senza doversi stringere.
traits.1.name: Furtività d'ombra
traits.1.text: Quando si trova in condizioni di luce fioca o oscurità, l'ombra può nascondersi come azione bonus.
traits.2.name: Debolezza al sole
traits.2.text: Quando è esposta alla luce del sole, l'ombra subisce svantaggio ai tiri per colpire, alle prove di caratteristica e ai tiri salvezza.
actions.0.name: Risucchio di forza
actions.0.text: |-
  Attacco con arma da mischia: +4 al tiro per colpire, portata 1,5 m, una creatura. Colpito: 9 (2d6 + 2) danni necrotici e il punteggio di Forza del bersaglio è ridotto di 1d4. Se questo porta la sua Forza a 0, il bersaglio muore. Altrimenti, questa riduzione dura finché il bersaglio non termina un riposo breve o lungo.
  Se a causa di questo attacco muore un umanoide non malvagio, una nuova ombra emerge dal cadavere 1d4 ore dopo.
