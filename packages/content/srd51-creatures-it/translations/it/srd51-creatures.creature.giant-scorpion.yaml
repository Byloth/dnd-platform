name: Scorpione gigante
alignment: senza allineamento
armorClass.0.note: armatura naturale
actions.0.name: Artiglio
actions.0.text: "Attacco con arma da mischia: +4 al tiro per colpire, portata 1,5 m, un bersaglio. Colpito: 6 (1d8 + 2) danni contundenti e il bersaglio è afferrato (CD 12 per sfuggire). Lo scorpione ha due artigli, ognuno dei quali può afferrare un solo bersaglio."
actions.1.name: Multiattacco
actions.1.text: "Lo scorpione effettua tre attacchi: due con gli artigli e uno con il pungiglione."
actions.1.multiattack.0.action: Artiglio
actions.1.multiattack.1.action: Pungiglione
actions.2.name: Pungiglione
actions.2.text: "Attacco con arma da mischia: +4 al tiro per colpire, portata 1,5 m, una creatura. Colpito: 7 (1d10 + 2) danni perforanti e il bersaglio deve effettuare un tiro salvezza su Costituzione con CD 12, subendo 22 (4d10) danni da veleno in caso di fallimento, o la metà in caso di successo."
