name: Nalfeshnee
alignment: caotico malvagio
armorClass.0.note: armatura naturale
resistances.3.note: da attacchi non magici
languages: Abissale, telepatia 36 m
traits.0.name: Resistenza alla magia
traits.0.text: Il nalfeshnee dispone di vantaggio ai tiri salvezza contro incantesimi e altri effetti magici.
actions.0.name: Multiattacco
actions.0.text: "Il nalfeshnee usa Nube di orrore, se ne è in grado. Poi effettua tre attacchi: uno con il morso e due con gli artigli."
actions.0.multiattack.0.action: Nube di orrore
actions.0.multiattack.1.action: Morso
actions.0.multiattack.2.action: Artiglio
actions.1.name: Morso
actions.1.text: "Attacco con arma da mischia: +10 al tiro per colpire, portata 1,5 m, un bersaglio. Colpito: 32 (5d10 + 5) danni perforanti."
actions.2.name: Artiglio
actions.2.text: "Attacco con arma da mischia: +10 al tiro per colpire, portata 3 m, un bersaglio. Colpito: 15 (3d6 + 5) danni taglienti."
actions.3.name: Nube di orrore
actions.3.text: Il nalfeshnee emette magicamente una luce multicolore scintillante. Ogni creatura entro 4,5 metri dal nalfeshnee che sia in grado di vedere la luce deve superare un tiro salvezza su Saggezza con CD 15, altrimenti è spaventata per 1 minuto. La creatura può ripetere il tiro salvezza alla fine di ogni suo turno e, se lo supera, l'effetto svanisce. Se il tiro salvezza di una creatura ha successo o l'effetto per lei termina, è immune alla Nube di orrore del nalfeshnee per le 24 ore successive.
actions.4.name: Teletrasporto
actions.4.text: Il nalfeshnee si teletrasporta magicamente, insieme a ogni oggetto che indossa o trasporta, fino a uno spazio libero visibile entro 36 metri.
