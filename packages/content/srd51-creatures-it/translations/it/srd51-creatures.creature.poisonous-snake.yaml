name: Serpente velenoso
alignment: senza allineamento
actions.0.name: Morso
actions.0.text: "Attacco con arma da mischia: +5 al tiro per colpire, portata 1,5 m, un bersaglio. Colpito: 1 danno perforante e il bersaglio deve effettuare un tiro salvezza su Costituzione con CD 10 subendo 5 (2d4) danni da veleno in caso di fallimento, o la metà in caso di successo."
