name: Drago d'argento cucciolo
alignment: legale buono
armorClass.0.note: armatura naturale
languages: Draconico
actions.0.name: Morso
actions.0.text: "Attacco con arma da mischia: +6 al tiro per colpire, portata 1,5 m, un bersaglio. Colpito: 9 (1d10 + 4) danni perforanti."
actions.1.name: Soffi
actions.1.text: |-
  Il drago usa uno dei seguenti soffi.
  Soffio di freddo. Il drago esala una folata gelida in un cono di 4,5 metri. Ogni creatura in quell'area deve effettuare un tiro salvezza su Costituzione con CD 13, subendo 18 (4d8) danni da freddo in caso di fallimento, o la metà dei danni in caso di successo.
  Soffio paralizzante. Il drago esala gas paralizzante in un cono di 4,5 metri. Ogni creatura in quell'area deve superare un tiro salvezza su Costituzione con CD 13, altrimenti è paralizzata per 1 minuto. La creatura può ripetere il tiro salvezza alla fine di ogni suo turno e, se lo supera, l'effetto svanisce.
