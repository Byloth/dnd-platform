name: Drago di bronzo cucciolo
alignment: legale buono
armorClass.0.note: armatura naturale
languages: Draconico
traits.0.name: Anfibio
traits.0.text: Il drago può respirare in aria e in acqua.
actions.0.name: Morso
actions.0.text: "Attacco con arma da mischia: +5 al tiro per colpire, portata 1,5 m, un bersaglio. Colpito: 8 (1d10 + 3) danni perforanti."
actions.1.name: Soffi
actions.1.text: |-
  Il drago usa uno dei seguenti soffi.
  Soffio di fulmini. Il drago esala una scarica di fulmini lunga 12 metri e larga 1,5 metri. Ogni creatura su quella linea deve effettuare un tiro salvezza su Destrezza con CD 12, subendo 16 (3d10) danni da fulmine in caso di fallimento, o la metà dei danni in caso di successo.
  Soffio repulsivo. Il drago esala energia repulsiva in un cono di 9 metri. Ogni creatura in quell'area deve superare un tiro salvezza su Forza con CD 12. Se lo fallisce, viene scagliata a 9 metri dal drago.
