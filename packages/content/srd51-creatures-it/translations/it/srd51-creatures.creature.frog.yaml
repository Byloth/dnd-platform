name: Rana
text: La rana non possiede alcun tipo di attacco efficace. Si nutre di piccoli insetti e in genere dimora vicino all'acqua, sugli alberi o sottoterra. Le statistiche della rana possono essere utilizzate anche per descrivere un rospo.
alignment: senza allineamento
traits.0.name: Anfibio
traits.0.text: La rana può respirare in aria e in acqua.
traits.1.name: Balzo da fermo
traits.1.text: La rana può compiere un salto in lungo di un massimo di 3 metri e uno in alto di un massimo di 1,5 metri, con o senza rincorsa.
