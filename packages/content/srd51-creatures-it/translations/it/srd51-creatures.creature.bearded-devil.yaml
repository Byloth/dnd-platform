name: Diavolo barbuto
alignment: legale malvagio
armorClass.0.note: armatura naturale
resistances.1.note: da attacchi non magici non argentati
languages: Infernale, telepatia 36 m
traits.0.name: Vista del diavolo
traits.0.text: L'oscurità magica non ostacola la scurovisione del diavolo.
traits.1.name: Resistenza alla magia
traits.1.text: Il diavolo dispone di vantaggio ai tiri salvezza contro incantesimi e altri effetti magici.
traits.2.name: Nervi saldi
traits.2.text: Il diavolo non può essere spaventato finché vede una creatura alleata entro 9 metri da sé.
actions.0.name: Multiattacco
actions.0.text: "Il diavolo effettua due attacchi: uno con la barba e uno con il falcione."
actions.0.multiattack.0.action: Barba
actions.0.multiattack.1.action: Falcione
actions.1.name: Barba
actions.1.text: "Attacco con arma da mischia: +5 al tiro per colpire, portata 1,5 m, una creatura. Colpito: 6 (1d8 + 2) danni perforanti e il bersaglio deve superare un tiro salvezza su Costituzione con CD 12, altrimenti è avvelenato per 1 minuto. Finché è avvelenato in questo modo, il bersaglio non può recuperare punti ferita. Il bersaglio può ripetere il tiro salvezza alla fine di ogni suo turno e, se lo supera, l'effetto svanisce."
actions.2.name: Falcione
actions.2.text: "Attacco con arma da mischia: +5 al tiro per colpire, portata 3 m, un bersaglio. Colpito: 8 (1d10 + 3) danni taglienti. Se il bersaglio è una creatura diversa da un non morto o da un costrutto, deve superare un tiro salvezza su Costituzione con CD 12, altrimenti perde 5 (1d10) punti ferita all'inizio di ogni suo turno a causa di una ferita infernale. Ogni volta che il diavolo colpisce il bersaglio ferito con questo attacco, i danni inflitti dalla ferita aumentano di 5 (1d10). Una creatura qualsiasi può effettuare un'azione per tamponare la ferita superando una prova di Saggezza (Medicina) con CD 12. La ferita si richiude anche se il bersaglio riceve una qualsiasi forma di guarigione magica."
