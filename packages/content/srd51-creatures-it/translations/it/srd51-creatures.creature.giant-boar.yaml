name: Cinghiale gigante
alignment: senza allineamento
armorClass.0.note: armatura naturale
traits.0.name: Carica
traits.0.text: Se il cinghiale si muove di almeno 6 metri in linea retta verso un bersaglio e poi lo colpisce con un attacco con le zanne nello stesso turno, il bersaglio subisce 7 (2d6) danni taglienti extra. Se il bersaglio è una creatura, deve superare un tiro salvezza su Forza con CD 13, altrimenti cade a terra prono.
traits.1.name: Implacabile
traits.1.text: Se il cinghiale subisce un massimo di 10 danni che lo porterebbero a 0 punti ferita, viene ridotto invece a 1 punto ferita.
actions.0.name: Zanne
actions.0.text: "Attacco con arma da mischia: +5 al tiro per colpire, portata 1,5 m, un bersaglio. Colpito: 10 (2d6 + 3) danni taglienti."
