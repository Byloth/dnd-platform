name: Gnomo delle profondità (svirfneblin)
alignment: neutrale buono
armorClass.0.note: giaco di maglia
languages: Gnomesco, Sottocomune, Terran
traits.0.name: Mimetizzazione rocciosa
traits.0.text: Lo gnomo dispone di vantaggio alle prove di Destrezza (Furtività) effettuate per nascondersi nei terreni rocciosi.
traits.1.name: Astuzia gnomesca
traits.1.text: Lo gnomo dispone di vantaggio ai tiri salvezza su Intelligenza, Saggezza e Carisma contro la magia.
traits.2.name: Incantesimi innati
traits.2.text: |-
  La caratteristica innata da incantatore dello gnomo è Intelligenza (CD del tiro salvezza sull'incantesimo 11). Per sua natura, è in grado di lanciare gli incantesimi indicati di seguito senza aver bisogno di componenti materiali:
  A volontà: anti-individuazione (solo se stesso)
  1/giorno ciascuno: camuffare se stesso, cecità/sordità, sfocatura
actions.0.name: Piccone da guerra
actions.0.text: "Attacco con arma da mischia: +4 al tiro per colpire, portata 1,5 m, un bersaglio. Colpito: 6 (1d8 + 2) danni perforanti."
actions.1.name: Dardo avvelenato
actions.1.text: "Attacco con arma a distanza: +4 al tiro per colpire, gittata 9/36 m, una creatura. Colpito: 4 (1d4 + 2) danni perforanti e il bersaglio deve superare un tiro salvezza su Costituzione con CD 12, altrimenti è avvelenato per 1 minuto. Il bersaglio può ripetere il tiro salvezza alla fine di ogni suo turno e, se lo supera, l'effetto svanisce."
