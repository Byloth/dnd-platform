name: Golem di argilla
alignment: senza allineamento
armorClass.0.note: armatura naturale
immunities.3.note: da attacchi non magici non adamantini
languages: comprende i linguaggi del suo creatore ma non li sa parlare
traits.0.name: Assorbimento dell'acido
traits.0.text: Ogni volta che il golem riceve danni da acido, non subisce danni e anzi recupera un numero di punti ferita pari ai danni da acido inflitti.
traits.1.name: Berserk
traits.1.text: Ogni volta che il golem inizia il suo turno con 60 punti ferita o meno, si tira un d6. Con un risultato di 6, il golem entra in uno stato di berserk. A ogni suo turno, finché è in stato di berserk, il golem attacca la creatura visibile più vicina. Se nessuna creatura è abbastanza vicina per un attacco, il golem prende di mira un oggetto, prediligendone uno più piccolo di lui. Una volta che il golem è in stato di berserk, non si arresta finché non viene distrutto o non recupera tutti i suoi punti ferita.
traits.2.name: Forma immutabile
traits.2.text: Il golem è immune a qualsiasi incantesimo o effetto che ne altererebbe la forma.
traits.3.name: Resistenza alla magia
traits.3.text: Il golem dispone di vantaggio ai tiri salvezza contro incantesimi e altri effetti magici.
traits.4.name: Armi magiche
traits.4.text: Gli attacchi con arma del golem sono magici.
actions.0.name: Multiattacco
actions.0.text: Il golem effettua due attacchi con schianto.
actions.0.multiattack.0.action: Schianto
actions.1.name: Schianto
actions.1.text: "Attacco con arma da mischia: +8 al tiro per colpire, portata 1,5 m, un bersaglio. Colpito: 16 (2d10 + 5) danni contundenti. Se il bersaglio è una creatura, deve superare un tiro salvezza su Costituzione con CD 15, altrimenti i suoi punti ferita massimi vengono ridotti di un importo pari ai danni inflitti. Il bersaglio muore se questo attacco riduce a 0 i suoi punti ferita massimi. La riduzione permane finché non viene rimossa da un incantesimo ristorare superiore o altre magie analoghe."
actions.2.name: Velocità
actions.2.text: Fino alla fine del suo turno successivo, il golem ottiene magicamente un bonus di +2 alla CA, dispone di vantaggio ai tiri salvezza su Destrezza e può usare il suo attacco con schianto come azione bonus.
