name: Viverna
alignment: senza allineamento
armorClass.0.note: armatura naturale
actions.0.name: Multiattacco
actions.0.text: "La viverna effettua due attacchi: uno con il morso e uno con il pungiglione. Mentre vola, può usare gli artigli al posto di un altro attacco."
actions.0.multiattack.0.action: Morso
actions.0.multiattack.1.action: Pungiglione
actions.1.name: Morso
actions.1.text: "Attacco con arma da mischia: +7 al tiro per colpire, portata 3 m, una creatura. Colpito: 11 (2d6 + 4) danni perforanti."
actions.2.name: Artigli
actions.2.text: "Attacco con arma da mischia: +7 al tiro per colpire, portata 1,5 m, un bersaglio. Colpito: 13 (2d8 + 4) danni taglienti."
actions.3.name: Pungiglione
actions.3.text: "Attacco con arma da mischia: +7 al tiro per colpire, portata 3 m, una creatura. Colpito: 11 (2d6 + 4) danni perforanti. Il bersaglio deve effettuare un tiro salvezza su Costituzione con CD 15, subendo 24 (7d6) danni da veleno in caso di fallimento, o la metà in caso di successo."
