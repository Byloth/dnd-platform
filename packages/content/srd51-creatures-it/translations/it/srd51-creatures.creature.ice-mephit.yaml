name: Mephit del ghiaccio
alignment: neutrale malvagio
languages: Aquan, Auran
traits.0.name: Esplosione della morte
traits.0.text: Quando il mephit muore, esplode in una pioggia di frammenti di ghiaccio acuminati. Ogni creatura entro 1,5 metri dal mephit deve effettuare un tiro salvezza su Destrezza con CD 10, subendo 4 (1d8) danni taglienti in caso di fallimento, o la metà in caso di successo.
traits.1.name: Falso aspetto
traits.1.text: Finché il mephit rimane immobile, non è possibile distinguerlo da un normale pezzo di ghiaccio.
traits.2.name: Incantesimi innati
traits.2.text: Il mephit può lanciare nube di nebbia come incantesimo innato senza aver bisogno di componenti materiali. La sua caratteristica innata da incantatore è Carisma.
actions.0.name: Artigli
actions.0.text: "Attacco con arma da mischia: +3 al tiro per colpire, portata 1,5 m, una creatura. Colpito: 3 (1d4 + 1) danni taglienti più 2 (1d4) danni da freddo."
actions.1.name: Soffio di gelo
actions.1.text: Il mephit esala aria fredda in un cono di 4,5 metri. Ogni creatura in quell'area deve effettuare un tiro salvezza su Destrezza con CD 10, subendo 5 (2d4) danni da freddo in caso di fallimento, o la metà dei danni in caso di successo.
