name: Wight
alignment: neutrale malvagio
armorClass.0.note: cuoio borchiato
resistances.1.note: da attacchi non magici non argentati
languages: quelli conosciuti in vita
traits.0.name: Sensibilità al sole
traits.0.text: Finché è esposto alla luce del sole, il wight subisce svantaggio ai tiri per colpire, oltre che alle prove di Saggezza (Percezione) basate sulla vista.
actions.0.name: Multiattacco
actions.0.text: Il wight effettua due attacchi con la spada lunga o con l'arco lungo. Può usare il Risucchio di vita al posto di un attacco con la spada lunga.
actions.1.name: Risucchio di vita
actions.1.text: |-
  Attacco con arma da mischia: +4 al tiro per colpire, portata 1,5 m, una creatura. Colpito: 5 (1d6 + 2) danni necrotici. Il bersaglio deve superare un tiro salvezza su Costituzione con CD 13, o i suoi punti ferita massimi vengono ridotti di un importo pari al danno subito. Questa riduzione dura finché il bersaglio non completa un riposo lungo. Il bersaglio muore se questo effetto riduce a 0 i suoi punti ferita massimi.
  Un umanoide ucciso da questo attacco si anima 24 ore dopo come zombi sotto il controllo del wight, a meno che l'umanoide non sia riportato in vita o il suo corpo non venga distrutto. Il wight non può controllare più di dodici zombi simultaneamente.
actions.2.name: Spada lunga
actions.2.text: "Attacco con arma da mischia: +4 al tiro per colpire, portata 1,5 m, un bersaglio. Colpito: 6 (1d8 + 2) danni taglienti o 7 (1d10 + 2) danni taglienti se impugnata con due mani."
actions.3.name: Arco lungo
actions.3.text: "Attacco con arma a distanza: +4 al tiro per colpire, gittata 45/180 m, un bersaglio. Colpito: 6 (1d8 + 2) danni perforanti."
