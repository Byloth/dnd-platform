name: Golem di pietra
alignment: senza allineamento
armorClass.0.note: armatura naturale
immunities.2.note: da attacchi non magici non adamantini
languages: comprende i linguaggi del suo creatore ma non li sa parlare
traits.0.name: Forma immutabile
traits.0.text: Il golem è immune a qualsiasi incantesimo o effetto che ne altererebbe la forma.
traits.1.name: Resistenza alla magia
traits.1.text: Il golem dispone di vantaggio ai tiri salvezza contro incantesimi e altri effetti magici.
traits.2.name: Armi magiche
traits.2.text: Gli attacchi con arma del golem sono magici.
actions.0.name: Multiattacco
actions.0.text: Il golem effettua due attacchi con schianto.
actions.0.multiattack.0.action: Schianto
actions.1.name: Schianto
actions.1.text: "Attacco con arma da mischia: +10 al tiro per colpire, portata 1,5 m, un bersaglio. Colpito: 19 (3d8 + 6) danni contundenti."
actions.2.name: Lentezza
actions.2.text: Il golem prende di mira una o più creature visibili entro 3 metri da lui. Ogni bersaglio deve effettuare un tiro salvezza su Saggezza con CD 17 contro questa magia; se lo fallisce, non può usare reazioni, la sua velocità è dimezzata e non può effettuare più di un attacco nel suo turno. Inoltre, nel suo turno il bersaglio può effettuare un'azione o un'azione bonus, ma non entrambe. Questi effetti durano 1 minuto. Un bersaglio può ripetere il tiro salvezza alla fine di ogni suo turno e, se lo supera, l'effetto svanisce.
