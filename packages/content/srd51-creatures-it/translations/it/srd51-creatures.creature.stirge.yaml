name: Uccello stigeo
alignment: senza allineamento
armorClass.0.note: armatura naturale
actions.0.name: Risucchio di sangue
actions.0.text: |-
  Attacco con arma da mischia: +5 al tiro per colpire, portata 1,5 m, una creatura. Colpito: 5 (1d4 + 3) danni perforanti e l'uccello stigeo si avvinghia al bersaglio. Finché è avvinghiato, l'uccello stigeo non attacca. All'inizio di ogni turno del mostro, il bersaglio perde 5 (1d4 + 3) punti ferita a causa del dissanguamento.
  L'uccello stigeo può staccarsi da solo utilizzando 1,5 metri del suo movimento. Lo fa dopo aver risucchiato 10 punti ferita di sangue dal bersaglio o se il bersaglio muore. Una creatura, incluso il bersaglio, può usare la sua azione per staccare l'essere.
