name: Mephit della polvere
alignment: neutrale malvagio
languages: Auran, Terran
traits.0.name: Esplosione della morte
traits.0.text: Quando il mephit muore, esplode in una nube di polvere. Ogni creatura entro 1,5 metri dal mephit deve superare un tiro salvezza su Costituzione con CD 10, altrimenti è accecata per 1 minuto. Una creatura accecata può ripetere il tiro salvezza a ogni suo turno e, se lo supera, l'effetto svanisce.
traits.1.name: Incantesimi innati
traits.1.text: Il mephit può lanciare sonno come incantesimo innato senza aver bisogno di componenti materiali. La sua caratteristica innata da incantatore è Carisma.
actions.0.name: Artigli
actions.0.text: "Attacco con arma da mischia: +4 al tiro per colpire, portata 1,5 m, una creatura. Colpito: 4 (1d4 + 2) danni taglienti."
actions.1.name: Soffio accecante
actions.1.text: Il mephit esala polvere accecante in un cono di 4,5 metri. Ogni creatura in quell'area deve superare un tiro salvezza su Destrezza con CD 10, altrimenti è accecata per 1 minuto. La creatura può ripetere il tiro salvezza alla fine di ogni suo turno e, se lo supera, l'effetto svanisce.
