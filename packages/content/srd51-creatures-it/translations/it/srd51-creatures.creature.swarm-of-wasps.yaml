name: Sciame di vespe
alignment: senza allineamento
armorClass.0.note: armatura naturale
traits.0.name: Sciame
traits.0.text: Lo sciame può occupare lo spazio di un'altra creatura e viceversa, e può muoversi attraverso qualsiasi apertura sufficientemente larga da far passare un insetto Minuscolo. Lo sciame non può recuperare punti ferita, né ottenere punti ferita temporanei.
actions.0.name: Morsi
actions.0.text: "Attacco con arma da mischia: +3 al tiro per colpire, portata 0 m, un bersaglio nello spazio dello sciame. Colpito: 10 (4d4) danni perforanti o 5 (2d4) danni perforanti se lo sciame ha la metà dei suoi punti ferita o meno."
