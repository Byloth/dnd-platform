name: Gnoll
alignment: caotico malvagio
armorClass.0.note: armatura di pelle, scudo
languages: Gnoll
traits.0.name: Furia
traits.0.text: Quando lo gnoll riduce una creatura a 0 punti ferita con un attacco in mischia nel suo turno, il mostro può effettuare un'azione bonus per muoversi fino a metà della sua velocità ed effettuare un attacco con il morso.
actions.0.name: Morso
actions.0.text: "Attacco con arma da mischia: +4 al tiro per colpire, portata 1,5 m, una creatura. Colpito: 4 (1d4 + 2) danni perforanti."
actions.1.name: Lancia
actions.1.text: "Attacco con arma da mischia o a distanza: +4 al tiro per colpire, portata 1,5 m o gittata 6/18 m, un bersaglio. Colpito: 5 (1d6 + 2) danni perforanti o 6 (1d8 + 2) danni perforanti se impugnata con due mani per effettuare un attacco in mischia."
actions.2.name: Arco lungo
actions.2.text: "Attacco con arma a distanza: +3 al tiro per colpire, gittata 45/180 m, un bersaglio. Colpito: 5 (1d8 + 1) danni perforanti."
