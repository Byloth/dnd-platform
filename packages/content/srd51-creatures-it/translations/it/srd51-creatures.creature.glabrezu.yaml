name: Glabrezu
alignment: caotico malvagio
armorClass.0.note: armatura naturale
resistances.3.note: da attacchi non magici
languages: Abissale, telepatia 36 m
traits.0.name: Incantesimi innati
traits.0.text: |-
  La caratteristica da incantatore del glabrezu è Intelligenza (CD del tiro salvezza sull'incantesimo 16). Per sua natura, il glabrezu è in grado di lanciare gli incantesimi indicati di seguito senza aver bisogno di componenti materiali:
  A volontà: dissolvi magie, individuazione del magico, oscurità
  1/giorno ciascuno: confusione, parola del potere stordire, volare
traits.1.name: Resistenza alla magia
traits.1.text: Il glabrezu dispone di vantaggio ai tiri salvezza contro incantesimi e altri effetti magici.
actions.0.name: Multiattacco
actions.0.text: "Il glabrezu effettua quattro attacchi: due con le tenaglie e due con i pugni. In alternativa, effettua due attacchi con le tenaglie e lancia un incantesimo."
actions.1.name: Tenaglia
actions.1.text: "Attacco con arma da mischia: +9 al tiro per colpire, portata 3 m, un bersaglio. Colpito: 16 (2d10 + 5) danni contundenti. Se il bersaglio è una creatura di taglia Media o inferiore, viene afferrato (CD 15 per sfuggire). Il glabrezu ha due tenaglie, ognuna delle quali può afferrare solo un bersaglio."
actions.2.name: Pugno
actions.2.text: "Attacco con arma da mischia: +9 al tiro per colpire, portata 1,5 m, un bersaglio. Colpito: 7 (2d4 + 2) danni contundenti."
