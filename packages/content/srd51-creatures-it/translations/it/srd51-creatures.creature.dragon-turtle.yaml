name: Testuggine dragona
alignment: neutrale
armorClass.0.note: armatura naturale
languages: Aquan, Draconico
traits.0.name: Anfibio
traits.0.text: La testuggine dragona può respirare in aria e in acqua.
actions.0.name: Multiattacco
actions.0.text: "La testuggine dragona effettua tre attacchi: uno con il morso e due con gli artigli. Può effettuare un attacco con la coda al posto dei due attacchi con gli artigli."
actions.1.name: Morso
actions.1.text: "Attacco con arma da mischia: +13 al tiro per colpire, portata 4,5 m, un bersaglio. Colpito: 26 (3d12 + 7) danni perforanti."
actions.2.name: Artiglio
actions.2.text: "Attacco con arma da mischia: +13 al tiro per colpire, portata 3 m, un bersaglio. Colpito: 16 (2d8 + 7) danni taglienti."
actions.3.name: Coda
actions.3.text: "Attacco con arma da mischia: +13 al tiro per colpire, portata 4,5 m, un bersaglio. Colpito: 26 (3d12 + 7) danni contundenti. Se il bersaglio è una creatura, deve superare un tiro salvezza su Forza con CD 20, altrimenti è scagliato a 3 metri dalla testuggine dragona e buttato a terra prono."
actions.4.name: Soffio di vapore
actions.4.text: La testuggine dragona esala vapore ustionante in un cono di 18 metri. Ogni creatura in quell'area deve effettuare un tiro salvezza su Costituzione con CD 18, subendo 52 (15d6) danni da fuoco in caso di fallimento, o la metà dei danni in caso di successo. Trovarsi sott'acqua non conferisce resistenza a tali danni.
