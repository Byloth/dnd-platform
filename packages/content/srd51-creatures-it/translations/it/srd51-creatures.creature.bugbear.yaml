name: Bugbear
alignment: caotico malvagio
armorClass.0.note: armatura di pelle, scudo
languages: Comune, Goblin
traits.0.name: Bruto
traits.0.text: Quando il bugbear colpisce con un'arma da mischia, l'attacco infligge un dado extra del tipo di danno dell'arma (già incluso nell'attacco).
traits.1.name: Attacco a sorpresa
traits.1.text: Se il bugbear sorprende una creatura e la colpisce con un attacco durante il primo round di combattimento, il bersaglio subisce 7 (2d6) danni extra dall'attacco.
actions.0.name: Mazza chiodata
actions.0.text: "Attacco con arma da mischia: +4 al tiro per colpire, portata 1,5 m, un bersaglio. Colpito: 11 (2d8 + 2) danni perforanti."
actions.1.name: Giavellotto
actions.1.text: "Attacco con arma da mischia o a distanza: +4 al tiro per colpire, portata 1,5 m o gittata 9/36 m, un bersaglio. Colpito: 9 (2d6 + 2) danni perforanti in mischia o 5 (1d6 + 2) danni perforanti a distanza."
