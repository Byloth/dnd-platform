name: Melma grigia
alignment: senza allineamento
traits.0.name: Amorfo
traits.0.text: La melma può muoversi attraverso uno spazio stretto fino a 2,5 centimetri senza doversi stringere.
traits.1.name: Corrodere il metallo
traits.1.text: |-
  Qualsiasi arma non magica fatta di metallo colpisca la melma si corrode. Dopo avere inflitto danni, l'arma subisce una penalità cumulativa e permanente di -1 ai tiri per i danni. Se la sua penalità scende a -5, l'arma viene distrutta. Le munizioni non magiche fatte di metallo che colpiscono la melma vengono distrutte dopo aver inflitto danni.
  La melma può corrodere fino a 5 centimetri di metallo non magico in 1 round.
traits.2.name: Falso aspetto
traits.2.text: Finché la melma rimane immobile, non è distinguibile da una pozza oleosa o da una roccia umida.
actions.0.name: Pseudopode
actions.0.text: "Attacco con arma da mischia: +3 al tiro per colpire, portata 1,5 m, un bersaglio. Colpito: 4 (1d6 + 1) danni contundenti più 7 (2d6) danni da acido e, se il bersaglio indossa un'armatura di metallo non magica, quest'ultima viene in parte corrosa e subisce una penalità cumulativa e permanente di -1 alla CA che fornisce. Se la penalità riduce la sua CA a 10, l'armatura si distrugge."
