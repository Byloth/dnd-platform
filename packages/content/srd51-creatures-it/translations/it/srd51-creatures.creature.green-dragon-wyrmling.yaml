name: Drago verde cucciolo
alignment: legale malvagio
armorClass.0.note: armatura naturale
languages: Draconico
traits.0.name: Anfibio
traits.0.text: Il drago può respirare in aria e in acqua.
actions.0.name: Morso
actions.0.text: "Attacco con arma da mischia: +4 al tiro per colpire, portata 1,5 m, un bersaglio. Colpito: 7 (1d10 + 2) danni perforanti più 3 (1d6) danni da veleno."
actions.1.name: Soffio di veleno
actions.1.text: Il drago esala gas velenoso in un cono di 4,5 metri. Ogni creatura in quell'area deve effettuare un tiro salvezza su Costituzione con CD 11, subendo 21 (6d6) danni da veleno in caso di fallimento, o la metà dei danni in caso di successo.
