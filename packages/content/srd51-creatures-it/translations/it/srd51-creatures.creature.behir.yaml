name: Behir
alignment: neutrale malvagio
armorClass.0.note: armatura naturale
languages: Draconico
actions.0.name: Multiattacco
actions.0.text: "Il behir effettua due attacchi: uno con il morso e uno per stritolare."
actions.0.multiattack.0.action: Morso
actions.0.multiattack.1.action: Stritolare
actions.1.name: Morso
actions.1.text: "Attacco con arma da mischia: +10 al tiro per colpire, portata 3 m, un bersaglio. Colpito: 22 (3d10 + 6) danni perforanti."
actions.2.name: Stritolare
actions.2.text: "Attacco con arma da mischia: +10 al tiro per colpire, portata 1,5 m, una creatura di taglia Grande o inferiore. Colpito: 17 (2d10 + 6) danni contundenti più 17 (2d10 + 6) danni taglienti. Il bersaglio è afferrato (CD 16 per sfuggire). Finché la presa perdura, il bersaglio è trattenuto e il behir non può stritolarne un altro."
actions.3.name: Soffio di fulmini
actions.3.text: Il behir esala una scarica di fulmini lunga 6 metri e larga 1,5 metri. Ogni creatura su quella linea deve effettuare un tiro salvezza su Destrezza con CD 16, subendo 66 (12d10) danni da fulmine in caso di fallimento, o la metà dei danni in caso di successo.
actions.4.name: Inghiottire
actions.4.text: |-
  Il behir effettua un attacco con il morso contro una creatura di taglia Media o inferiore con cui sta lottando. Se l'attacco va a segno, il bersaglio viene anche inghiottito e la lotta termina. Mentre è inghiottito, il bersaglio è accecato e trattenuto, beneficia di copertura totale contro gli attacchi e altri effetti al di fuori del behir e subisce 21 (6d6) danni da acido all'inizio di ogni turno del behir, che può inghiottire soltanto una creatura alla volta.
  Se il behir subisce 30 o più danni in un singolo turno dalla creatura inghiottita, deve superare un tiro salvezza su Costituzione con CD 14 alla fine di quel turno, altrimenti rigurgita la creatura, che cade prona in uno spazio entro 3 metri dal behir. Se il behir muore, la creatura inghiottita non è più trattenuta dal mostro e può sfuggire usando 4,5 metri di movimento, uscendo prona dal mostro.
