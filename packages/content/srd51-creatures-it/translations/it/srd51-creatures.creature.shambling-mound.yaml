name: Cumulo strisciante
alignment: senza allineamento
armorClass.0.note: armatura naturale
traits.0.name: Assorbimento del fulmine
traits.0.text: Ogni volta che il cumulo strisciante è soggetto a danni da fulmine, non subisce danni e anzi recupera un numero di punti ferita pari ai danni da fulmine inflitti.
actions.0.name: Multiattacco
actions.0.text: Il cumulo strisciante effettua due attacchi con schianto. Se entrambi gli attacchi colpiscono un bersaglio di taglia Media o inferiore, quest'ultimo viene afferrato (CD 14 per sfuggire) e il mostro usa Avviluppare su di lui.
actions.0.multiattack.0.action: Schianto
actions.0.multiattack.1.action: Avviluppare
actions.1.name: Schianto
actions.1.text: "Attacco con arma da mischia: +7 al tiro per colpire, portata 1,5 m, un bersaglio. Colpito: 13 (2d8 + 4) danni contundenti."
actions.2.name: Avviluppare
actions.2.text: Il cumulo strisciante avviluppa una creatura di taglia Media o inferiore che ha afferrato. Il bersaglio avviluppato è accecato e trattenuto, non è in grado di respirare e deve superare un tiro salvezza su Costituzione con CD 14 all'inizio di ogni turno del mostro, altrimenti subisce 13 (2d8 + 4) danni contundenti. Se il cumulo si muove, la vittima avviluppata si muove insieme a lui. Il cumulo può eseguire quest'azione su una sola creatura alla volta.
