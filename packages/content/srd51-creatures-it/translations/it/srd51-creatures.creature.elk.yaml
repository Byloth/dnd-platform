name: Alce
alignment: senza allineamento
traits.0.name: Carica
traits.0.text: Se l'alce si muove di almeno 6 metri in linea retta verso un bersaglio e poi lo colpisce con un attacco da sfondamento nello stesso turno, il bersaglio subisce 7 (2d6) danni extra. Se il bersaglio è una creatura, deve superare un tiro salvezza su Forza con CD 13, altrimenti cade a terra prono.
actions.0.name: Sfondamento
actions.0.text: "Attacco con arma da mischia: +5 al tiro per colpire, portata 1,5 m, un bersaglio. Colpito: 6 (1d6 + 3) danni contundenti."
actions.1.name: Zoccoli
actions.1.text: "Attacco con arma da mischia: +5 al tiro per colpire, portata 1,5 m, una creatura prona. Colpito: 8 (2d4 + 3) danni contundenti."
