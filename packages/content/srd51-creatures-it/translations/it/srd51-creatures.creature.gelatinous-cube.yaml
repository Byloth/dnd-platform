name: Cubo gelatinoso
alignment: senza allineamento
traits.0.name: Cubo di melma
traits.0.text: |-
  Il cubo occupa tutto il suo spazio. Le altre creature possono accedervi, ma se lo fanno sono soggette all'avviluppamento del cubo e subiscono svantaggio al tiro salvezza.
  Le creature all'interno del cubo possono essere viste ma beneficiano di copertura totale.
  Una creatura entro 1,5 metri dal cubo può effettuare un'azione per tirare fuori da esso una creatura o un oggetto. Per farlo è necessario superare una prova di Forza con CD 12 e la creatura che esegue il tentativo subisce 10 (3d6) danni da acido.
  Il cubo può contenere al suo interno simultaneamente solo una creatura Grande o fino a quattro creature di taglia Media o inferiore.
traits.1.name: Trasparente
traits.1.text: Anche quando il cubo è in bella vista, è necessario superare una prova di Saggezza (Percezione) con CD 15 per avvistare un cubo che non si sia mosso o che non abbia attaccato. Una creatura che cerca di entrare nello spazio del cubo senza essere consapevole della sua presenza viene colta di sorpresa.
actions.0.name: Pseudopode
actions.0.text: "Attacco con arma da mischia: +4 al tiro per colpire, portata 1,5 m, una creatura. Colpito: 10 (3d6) danni da acido."
actions.1.name: Avviluppare
actions.1.text: |-
  Il cubo si muove fino al massimo della sua velocità. Durante questo movimento, può entrare negli spazi delle creature di taglia Grande o inferiore. Ogni volta che il cubo entra nello spazio di una creatura, quest'ultima deve effettuare un tiro salvezza su Destrezza con CD 12.
  Se lo supera, la creatura può scegliere di essere spinta di 1,5 metri indietro o lateralmente rispetto al cubo. Una creatura che sceglie di non essere mossa subisce le conseguenze di un tiro salvezza fallito.
  In caso di tiro salvezza fallito, il cubo entra nello spazio della creatura, che subisce 10 (3d6) danni da acido ed è avviluppata. In questo stato non può respirare, è trattenuta e riceve 21 (6d6) danni da acido all'inizio di ogni turno del cubo. Quando il cubo si muove, la creatura avviluppata si muove insieme a lui.
  Una creatura avviluppata può tentare di sfuggire usando un'azione per effettuare una prova di Forza con CD 12. In caso di successo, la creatura sfugge ed entra in uno spazio a sua scelta entro 1,5 metri dal cubo.
