name: Capo dei banditi
text: |-
  Ci vogliono personalità, astuzia e uno spiccato talento per l'arte oratoria per tenere in riga un gruppo di banditi. Un **capo dei banditi** eccelle in questo senso.

  Il **capitano dei pirati** è una variante del capo dei banditi che, oltre a gestire una ciurma di delinquenti egoisti, ha una nave da proteggere e comandare. Per mantenere l'equipaggio in riga, il capitano deve elargire regolarmente ricompense e infliggere punizioni.

  Più che un tesoro, un capo dei banditi o un capitano dei pirati brama la fama di malevolo. Un prigioniero che si appella alla vanità o all'ego del capitano ha maggiori probabilità di essere trattato bene rispetto a un prigioniero che non conosce o afferma di non conoscere la reputazione iconica del capitano.
alignment: qualsiasi allineamento non legale
armorClass.0.note: cuoio borchiato
languages: due qualsiasi
actions.0.name: Multiattacco
actions.0.text: "Il capo dei banditi effettua tre attacchi in mischia: due con la scimitarra e uno con il pugnale. In alternativa, effettua due attacchi a distanza con i suoi pugnali."
actions.1.name: Scimitarra
actions.1.text: "Attacco con arma da mischia: +5 al tiro per colpire, portata 1,5 m, un bersaglio. Colpito: 6 (1d6 + 3) danni taglienti."
actions.2.name: Pugnale
actions.2.text: "Attacco con arma da mischia o con arma a distanza: +5 al tiro per colpire, portata 1,5 m o gittata 6/18 m, un bersaglio. Colpito: 5 (1d4 + 3) danni perforanti."
reactions.0.name: Parata
reactions.0.text: Il capo aggiunge 2 alla sua CA contro un attacco in mischia che lo colpirebbe. Per farlo, deve vedere l'attaccante e deve impugnare un'arma da mischia.
