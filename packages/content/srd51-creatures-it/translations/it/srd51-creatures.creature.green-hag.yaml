name: Megera verde
alignment: neutrale malvagio
armorClass.0.note: armatura naturale
languages: Comune, Draconico, Silvano
traits.0.name: Anfibio
traits.0.text: La megera può respirare in aria e in acqua.
traits.1.name: Incantesimi innati
traits.1.text: |-
  La caratteristica innata da incantatore della megera è Carisma (CD del tiro salvezza sull'incantesimo 12). Per sua natura, è in grado di lanciare gli incantesimi indicati di seguito senza aver bisogno di componenti materiali:

  A volontà: beffa crudele, illusione minore, luci danzanti
traits.2.name: Imitare
traits.2.text: La megera può imitare i versi degli animali e le voci degli umanoidi. Una creatura che oda tali suoni riesce a capire che si tratta di imitazioni superando una prova di Saggezza (Intuizione) con CD 14.
actions.0.name: Artigli
actions.0.text: "Attacco con arma da mischia: +6 al tiro per colpire, portata 1,5 m, un bersaglio. Colpito: 13 (2d8 + 4) danni taglienti."
actions.1.name: Aspetto illusorio
actions.1.text: |-
  La megera avvolge se stessa e tutto ciò che indossa o trasporta in un'illusione magica che la fa apparire come un'altra creatura di taglia e di forma umanoide simile alla sua. L'illusione termina se la megera usa un'azione bonus per terminarla o se muore.
  I cambiamenti apportati da questo effetto non passano il vaglio di un'ispezione fisica. Per esempio, la megera potrebbe apparire dotata di una pelle liscia, ma chiunque la toccasse sentirebbe che la sua pelle è ruvida. Sotto ogni altro aspetto, una creatura deve effettuare un'azione per ispezionare l'illusione e superare una prova di Intelligenza (Indagare) con CD 20 per capire che la megera è camuffata.
actions.2.name: Passaggio invisibile
actions.2.text: La megera diventa invisibile magicamente finché non attacca o lancia un incantesimo, o finché non perde la concentrazione (come se si concentrasse su un incantesimo). Mentre è invisibile, non lascia alcuna traccia fisica del suo passaggio, quindi è possibile seguirla solo tramite la magia. Ogni oggetto che indossa o trasporta diventa invisibile insieme a lei.
