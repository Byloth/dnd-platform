name: Oni
alignment: legale malvagio
armorClass.0.note: cotta di maglia
languages: Comune, Gigante
traits.0.name: Incantesimi innati
traits.0.text: |-
  La caratteristica innata da incantatore dell'oni è Carisma (CD del tiro salvezza sull'incantesimo 13). Per sua natura, è in grado di lanciare gli incantesimi indicati di seguito senza aver bisogno di componenti materiali:

  A volontà: invisibilità, oscurità
  1/giorno ciascuno: charme su persone, cono di freddo, forma gassosa, sonno
traits.1.name: Armi magiche
traits.1.text: Gli attacchi con arma dell'oni sono magici.
traits.2.name: Rigenerazione
traits.2.text: L'oni recupera 10 punti ferita all'inizio del suo turno, se ha almeno 1 punto ferita.
actions.0.name: Multiattacco
actions.0.text: L'oni effettua due attacchi e può scegliere se con gli artigli o con il falcione.
actions.1.name: Artiglio (solo in forma di oni)
actions.1.text: "Attacco con arma da mischia: +7 al tiro per colpire, portata 1,5 m, un bersaglio. Colpito: 8 (1d8 + 4) danni taglienti."
actions.2.name: Falcione
actions.2.text: "Attacco con arma da mischia: +7 al tiro per colpire, portata 3 m, un bersaglio. Colpito: 15 (2d10 + 4) danni taglienti o 9 (1d10 + 4) danni taglienti in forma Piccola o Media."
actions.3.name: Cambiare forma
actions.3.text: L'oni si trasforma magicamente in un umanoide Piccolo o Medio, in un gigante Grande, o ritorna alla sua vera forma. A eccezione della taglia, le sue statistiche restano le stesse in ogni forma. L'unico oggetto del suo equipaggiamento che viene trasformato è il suo falcione, che si riduce in modo da poter essere impugnato in forma umanoide. Se l'oni muore, torna alla sua vera forma e il falcione torna alla sua taglia normale.
