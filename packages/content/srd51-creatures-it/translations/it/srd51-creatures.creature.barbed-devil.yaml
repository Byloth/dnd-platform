name: Diavolo uncinato
alignment: legale malvagio
armorClass.0.note: armatura naturale
resistances.1.note: da attacchi non magici non argentati
languages: Infernale, telepatia 36 m
traits.0.name: Pelle uncinata
traits.0.text: All'inizio di ogni suo turno, il diavolo uncinato infligge 5 (1d10) danni perforanti a ogni creatura con cui lotta.
traits.1.name: Vista del diavolo
traits.1.text: L'oscurità magica non ostacola la scurovisione del diavolo.
traits.2.name: Resistenza alla magia
traits.2.text: Il diavolo dispone di vantaggio ai tiri salvezza contro incantesimi e altri effetti magici.
actions.0.name: Multiattacco
actions.0.text: "Il diavolo effettua tre attacchi in mischia: uno con la coda e due con gli artigli. In alternativa, può usare Scagliare fiamma due volte."
actions.1.name: Artiglio
actions.1.text: "Attacco con arma da mischia: +6 al tiro per colpire, portata 1,5 m, un bersaglio. Colpito: 6 (1d6 + 3) danni perforanti."
actions.2.name: Coda
actions.2.text: "Attacco con arma da mischia: +6 al tiro per colpire, portata 1,5 m, un bersaglio. Colpito: 10 (2d6 + 3) danni perforanti."
actions.3.name: Scagliare fiamma
actions.3.text: "Attacco a distanza con incantesimo: +5 al tiro per colpire, gittata 45 m, un bersaglio. Colpito: 10 (3d6) danni da fuoco. Se il bersaglio è un oggetto infiammabile che non è indossato o trasportato, prende anche fuoco."
