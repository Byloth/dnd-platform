name: Rana gigante
alignment: senza allineamento
traits.0.name: Anfibio
traits.0.text: La rana può respirare in aria e in acqua.
traits.1.name: Balzo da fermo
traits.1.text: La rana può compiere un salto in lungo di un massimo di 6 metri e uno in alto di un massimo di 3 metri, con o senza rincorsa.
actions.0.name: Morso
actions.0.text: "Attacco con arma da mischia: +3 al tiro per colpire, portata 1,5 m, un bersaglio. Colpito: 4 (1d6 + 1) danni perforanti e il bersaglio è afferrato (CD 11 per sfuggire). Finché la presa perdura, il bersaglio viene trattenuto e la rana non può morderne un altro."
actions.1.name: Inghiottire
actions.1.text: La rana effettua un attacco con il morso contro un bersaglio di taglia Piccola o inferiore con cui sta lottando. Se l'attacco va a segno, il bersaglio viene inghiottito e la lotta termina. Mentre è inghiottito, il bersaglio è accecato e trattenuto, beneficia di copertura totale contro gli attacchi e altri effetti al di fuori della rana e subisce 5 (2d4) danni da acido all'inizio di ogni turno dell'animale, che può inghiottire soltanto un bersaglio alla volta. Se la rana muore, la creatura inghiottita non è più trattenuta dal mostro e può sfuggire usando 1,5 metri di movimento, uscendo prona dall'animale.
