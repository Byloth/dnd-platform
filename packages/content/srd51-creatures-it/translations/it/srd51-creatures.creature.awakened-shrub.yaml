name: Cespuglio risvegliato
text: Un cespuglio risvegliato è un cespuglio comune diventato senziente e in grado di muoversi grazie all'incantesimo risveglio o ad altre magie simili.
alignment: senza allineamento
languages: un linguaggio conosciuto dal suo creatore
traits.0.name: Falso aspetto
traits.0.text: Finché questo essere rimane immobile, non è possibile distinguerlo da un normale cespuglio.
actions.0.name: Graffiare
actions.0.text: "Attacco con arma da mischia: +1 al tiro per colpire, portata 1,5 m, un bersaglio. Colpito: 1 (1d4 - 1) danni taglienti."
