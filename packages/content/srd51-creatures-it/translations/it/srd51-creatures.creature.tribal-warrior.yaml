name: Combattente tribale
text: I combattenti tribali vivono al di fuori della civiltà, il più delle volte sostentandosi con pesca e caccia. Ogni tribù obbedisce agli ordini del suo capotribù, in genere il combattente più grande o il più anziano, oppure uno benedetto dagli dèi.
alignment: qualsiasi allineamento
armorClass.0.note: armatura di pelle
languages: uno qualsiasi
traits.0.name: Tattiche del branco
traits.0.text: Il combattente dispone di vantaggio nel tiro per colpire contro una creatura se almeno uno dei suoi alleati si trova entro 1,5 metri dalla creatura e non è incapacitato.
actions.0.name: Lancia
actions.0.text: "Attacco con arma da mischia o a distanza: +3 al tiro per colpire, portata 1,5 m o gittata 6/18 m, un bersaglio. Colpito: 4 (1d6 + 1) danni perforanti o 5 (1d8 + 1) danni perforanti se usata a due mani per effettuare un attacco in mischia."
