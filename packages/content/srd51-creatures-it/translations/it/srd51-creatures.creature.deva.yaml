name: Deva
alignment: legale buono
armorClass.0.note: armatura naturale
resistances.1.note: da attacchi non magici
languages: tutti, telepatia 36 m
traits.0.name: Armi angeliche
traits.0.text: Gli attacchi con arma del deva sono magici. Quando il deva colpisce con qualsiasi arma, la sua arma infligge 4d8 danni radiosi extra (già inclusi nell'attacco).
traits.1.name: Incantesimi innati
traits.1.text: |-
  La caratteristica da incantatore del deva è Carisma (CD del tiro salvezza sull'incantesimo 17). Il deva può lanciare i seguenti incantesimi innati, che richiedono solo componenti verbali:
  A volontà: individuazione del bene e del male
  1/giorno ciascuno: comunione, rianimare morti
traits.2.name: Resistenza alla magia
traits.2.text: Il deva dispone di vantaggio ai tiri salvezza contro incantesimi e altri effetti magici.
actions.0.name: Multiattacco
actions.0.text: Il deva effettua due attacchi in mischia.
actions.0.multiattack.0.action: Mazza
actions.1.name: Mazza
actions.1.text: "Attacco con arma da mischia: +8 al tiro per colpire, portata 1,5 m, un bersaglio. Colpito: 7 (1d6 + 4) danni contundenti più 18 (4d8) danni radiosi."
actions.2.name: Tocco guaritore
actions.2.text: Il deva tocca un'altra creatura. Il bersaglio recupera magicamente 20 (4d8 + 2) punti ferita ed è liberato da qualsiasi maledizione, malattia, veleno, cecità o sordità.
actions.3.name: Cambiare forma
actions.3.text: |-
  Il deva si trasforma magicamente in una bestia o in un umanoide con grado di sfida pari o inferiore al proprio, o ritorna alla sua vera forma. Se muore, torna alla sua forma naturale. Ogni oggetto che indossava o trasportava viene assorbito o trasportato dalla sua nuova forma (a scelta del deva).
  In una nuova forma, il deva conserva le sue statistiche di gioco e la capacità di parlare, ma CA, modalità di movimento, Forza, Destrezza e sensi speciali sono sostituiti da quelli della nuova forma. Inoltre, il deva ottiene le eventuali statistiche e capacità (eccetto i privilegi di classe, le azioni leggendarie e le azioni di tana) che la nuova forma possiede, ma di cui egli è privo.
