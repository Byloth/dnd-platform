name: Armatura animata
alignment: senza allineamento
armorClass.0.note: armatura naturale
traits.0.name: Suscettibilità all'anti-magia
traits.0.text: L'armatura è incapacitata finché si trova nell'area di un campo anti-magia. Se bersagliata da un incantesimo dissolvi magie, l'armatura deve superare un tiro salvezza su Costituzione contro la CD del tiro salvezza sull'incantesimo di chi lo lancia, altrimenti è priva di sensi per 1 minuto.
traits.1.name: Falso aspetto
traits.1.text: Finché l'armatura rimane immobile, non è distinguibile da un'armatura normale.
actions.0.name: Multiattacco
actions.0.text: L'armatura effettua due attacchi in mischia.
actions.0.multiattack.0.action: Schianto
actions.1.name: Schianto
actions.1.text: "Attacco con arma da mischia: +4 al tiro per colpire, portata 1,5 m, un bersaglio. Colpito: 5 (1d6 + 2) danni contundenti."
