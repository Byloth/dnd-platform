name: Quipper
text: Un quipper è un pesce carnivoro dai denti aguzzi. Queste bestie possono adattarsi a qualsiasi ambiente acquatico, inclusi i gelidi laghi sotterranei. Spesso si riuniscono in sciami, le cui statistiche sono specificate di seguito in quest'appendice.
alignment: senza allineamento
traits.0.name: Frenesia di sangue
traits.0.text: Il quipper dispone di vantaggio ai tiri per colpire in mischia contro ogni creatura che non possieda tutti i propri punti ferita.
traits.1.name: Respirare sott'acqua
traits.1.text: Il quipper può respirare soltanto sott'acqua.
actions.0.name: Morso
actions.0.text: "Attacco con arma da mischia: +5 al tiro per colpire, portata 1,5 m, un bersaglio. Colpito: 1 danno perforante."
