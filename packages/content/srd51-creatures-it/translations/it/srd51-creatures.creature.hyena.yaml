name: Iena
alignment: senza allineamento
traits.0.name: Tattiche del branco
traits.0.text: La iena dispone di vantaggio a un tiro per colpire contro una creatura se almeno uno degli alleati dell'animale si trova entro 1,5 metri dalla creatura e non è incapacitato.
actions.0.name: Morso
actions.0.text: "Attacco con arma da mischia: +2 al tiro per colpire, portata 1,5 m, un bersaglio. Colpito: 3 (1d6) danni perforanti."
