name: Sciacallo
alignment: senza allineamento
traits.0.name: Udito e olfatto acuti
traits.0.text: Lo sciacallo dispone di vantaggio alle prove di Saggezza (Percezione) basate sull'olfatto o sull'udito.
traits.1.name: Tattiche del branco
traits.1.text: Lo sciacallo dispone di un vantaggio nel tiro per colpire contro una creatura se almeno uno degli alleati dell'animale si trova entro 1,5 metri dalla creatura e non è incapacitato.
actions.0.name: Morso
actions.0.text: "Attacco con arma da mischia: +1 al tiro per colpire, portata 1,5 m, un bersaglio. Colpito: 1 (1d4 - 1) danni perforanti."
