name: Fustigatore
alignment: neutrale malvagio
armorClass.0.note: armatura naturale
traits.0.name: Falso aspetto
traits.0.text: Finché il fustigatore rimane immobile, non è possibile distinguerlo da una normale formazione rocciosa, come una stalagmite.
traits.1.name: Tentacoli afferranti
traits.1.text: Il fustigatore può avere al massimo sei tentacoli contemporaneamente. Ogni tentacolo può essere attaccato (CA 20; 10 punti ferita; immunità ai danni psichici e da veleno). La distruzione di un tentacolo non infligge danni al fustigatore, che può impiegare un tentacolo sostitutivo nel suo turno successivo. Un tentacolo può anche essere spezzato se una creatura effettua un'azione e supera una prova di Forza con CD 15 contro di esso.
traits.2.name: Movimenti del ragno
traits.2.text: Il fustigatore può arrampicarsi su superfici difficili, compresi i soffitti (lungo i quali si muove a testa in giù), senza effettuare una prova di caratteristica.
actions.0.name: Multiattacco
actions.0.text: Il fustigatore effettua quattro attacchi con i tentacoli, usa Riavvolgere ed esegue un attacco con il morso.
actions.0.multiattack.0.action: Tentacolo
actions.0.multiattack.1.action: Riavvolgere
actions.0.multiattack.2.action: Morso
actions.1.name: Morso
actions.1.text: "Attacco con arma da mischia: +7 al tiro per colpire, portata 1,5 m, un bersaglio. Colpito: 22 (4d8 + 4) danni perforanti."
actions.2.name: Tentacolo
actions.2.text: "Attacco con arma da mischia: +7 al tiro per colpire, portata 15 m, una creatura. Colpito: il bersaglio è afferrato (CD 15 per sfuggire). Finché il fustigatore afferra il bersaglio, quest'ultimo è trattenuto e subisce svantaggio alle prove di Forza e ai tiri salvezza su Forza. Inoltre, il fustigatore non può usare lo stesso tentacolo su un altro bersaglio."
actions.3.name: Riavvolgere
actions.3.text: Il fustigatore tira verso di sé ogni creatura che ha afferrato per un massimo di 7,5 metri.
