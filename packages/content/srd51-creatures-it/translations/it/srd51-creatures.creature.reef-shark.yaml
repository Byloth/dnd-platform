name: Squalo tropicale
text: Gli squali tropicali, più piccoli di quelli giganti e degli squali cacciatori, infestano le acque poco profonde e le barriere coralline. Cacciano in piccoli branchi. Un esemplare pienamente sviluppato misura dagli 1,8 ai 3 metri.
alignment: senza allineamento
armorClass.0.note: armatura naturale
traits.0.name: Tattiche del branco
traits.0.text: Lo squalo dispone di vantaggio a un tiro per colpire contro una creatura se almeno uno degli alleati dello squalo si trova entro 1,5 metri dalla creatura e non è incapacitato.
traits.1.name: Respirare sott'acqua
traits.1.text: Lo squalo può respirare soltanto sott'acqua.
actions.0.name: Morso
actions.0.text: "Attacco con arma da mischia: +4 al tiro per colpire, portata 1,5 m, un bersaglio. Colpito: 6 (1d8 + 2) danni perforanti."
