name: Manticora
alignment: legale malvagia
armorClass.0.note: armatura naturale
traits.0.name: Ricrescita degli aculei caudali
traits.0.text: La manticora possiede ventiquattro aculei caudali. Quelli usati ricrescono quando la manticora completa un riposo lungo.
actions.0.name: Multiattacco
actions.0.text: "La manticora effettua tre attacchi: uno con il morso e due con gli artigli oppure tre con gli aculei caudali."
actions.1.name: Morso
actions.1.text: "Attacco con arma da mischia: +5 al tiro per colpire, portata 1,5 m, un bersaglio. Colpito: 7 (1d8 + 3) danni perforanti."
actions.2.name: Artiglio
actions.2.text: "Attacco con arma da mischia: +5 al tiro per colpire, portata 1,5 m, un bersaglio. Colpito: 6 (1d6 + 3) danni taglienti."
actions.3.name: Aculeo caudale
actions.3.text: "Attacco con arma a distanza: +5 al tiro per colpire, gittata 30/60 m, un bersaglio. Colpito: 7 (1d8 + 3) danni perforanti."
languages: Comune
