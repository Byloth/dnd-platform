name: Sciame di topi
alignment: senza allineamento
traits.0.name: Olfatto acuto
traits.0.text: Lo sciame dispone di vantaggio alle prove di Saggezza (Percezione) basate sull'olfatto.
traits.1.name: Sciame
traits.1.text: Lo sciame può occupare lo spazio di un'altra creatura e viceversa, e può muoversi attraverso qualsiasi apertura abbastanza grande per un ratto Minuscolo. Lo sciame non può recuperare punti ferita, né ottenere punti ferita temporanei.
actions.0.name: Morsi
actions.0.text: "Attacco con arma da mischia: +2 al tiro per colpire, portata 0 m, un bersaglio nello spazio dello sciame. Colpito: 7 (2d6) danni perforanti o 3 (1d6) danni perforanti se lo sciame possiede la metà dei suoi punti ferita o meno."
