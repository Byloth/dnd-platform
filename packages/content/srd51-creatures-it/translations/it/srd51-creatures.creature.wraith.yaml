name: Wraith
alignment: neutrale malvagio
resistances.5.note: da attacchi non magici con armi non argentate
languages: quelli conosciuti in vita
traits.0.name: Movimento incorporeo
traits.0.text: Il wraith può muoversi attraverso altre creature e oggetti come se fossero terreno difficile. Subisce 5 (1d10) danni da forza se termina il proprio turno all'interno di un oggetto.
traits.1.name: Sensibilità al sole
traits.1.text: Finché è esposto alla luce del sole, il wraith subisce svantaggio ai tiri per colpire, oltre che alle prove di Saggezza (Percezione) basate sulla vista.
actions.0.name: Risucchio di vita
actions.0.text: "Attacco con arma da mischia: +6 al tiro per colpire, portata 1,5 m, una creatura. Colpito: 21 (4d8 + 3) danni necrotici. Il bersaglio deve superare un tiro salvezza su Costituzione con CD 14, o i suoi punti ferita massimi vengono ridotti di un importo pari al danno subito. Questa riduzione dura finché il bersaglio non completa un riposo lungo. Il bersaglio muore se questo effetto riduce a 0 i suoi punti ferita massimi."
actions.1.name: Creare spettro
actions.1.text: Il wraith bersaglia un umanoide situato entro 3 metri da lui, che non abbia perso la vita da più di 1 minuto e che sia morto di morte violenta. Lo spirito del bersaglio si anima come spettro nello spazio del suo cadavere o nello spazio libero più vicino. Lo spettro è sotto il controllo del wraith. Il wraith non può controllare più di sette spettri simultaneamente.
