name: Drider
alignment: caotico malvagio
armorClass.0.note: armatura naturale
languages: Elfico, Sottocomune
traits.0.name: Retaggio fatato
traits.0.text: Il drider dispone di vantaggio ai tiri salvezza contro la condizione di affascinato e non può essere addormentato tramite la magia.
traits.1.name: Incantesimi innati
traits.1.text: |-
  La caratteristica innata da incantatore del drider è Saggezza (CD del tiro salvezza sull'incantesimo 13). Per sua natura, il drider è in grado di lanciare gli incantesimi indicati di seguito senza aver bisogno di componenti materiali:
  A volontà: luci danzanti
  1/giorno ciascuno: luminescenza, oscurità
traits.2.name: Movimenti del ragno
traits.2.text: Il drider può scalare le superfici difficili, inclusi i soffitti, lungo i quali si muove a testa in giù, senza effettuare una prova di caratteristica.
traits.3.name: Sensibilità al sole
traits.3.text: Finché è esposto alla luce del sole, il drider subisce svantaggio ai tiri per colpire, oltre che alle prove di Saggezza (Percezione) basate sulla vista.
traits.4.name: Arrampicatele
traits.4.text: Il drider ignora le restrizioni di movimento causate dalle ragnatele.
actions.0.name: Multiattacco
actions.0.text: Il drider effettua tre attacchi a scelta con la spada lunga o con l'arco lungo. Può sostituire una di queste mosse con un morso.
actions.1.name: Morso
actions.1.text: "Attacco con arma da mischia: +6 al tiro per colpire, portata 1,5 m, una creatura. Colpito: 2 (1d4) danni perforanti più 9 (2d8) danni da veleno."
actions.2.name: Spada lunga
actions.2.text: "Attacco con arma da mischia: +6 al tiro per colpire, portata 1,5 m, un bersaglio. Colpito: 7 (1d8 + 3) danni taglienti o 8 (1d10 + 3) danni taglienti se impugnata con due mani."
actions.3.name: Arco lungo
actions.3.text: "Attacco con arma a distanza: +6 al tiro per colpire, gittata 45/180 m, un bersaglio. Colpito: 7 (1d8 + 3) danni perforanti più 4 (1d8) danni da veleno."
