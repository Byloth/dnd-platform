name: Sciame di pipistrelli
alignment: senza allineamento
traits.0.name: Senso radar
traits.0.text: Lo sciame non può usare vista cieca se è assordato.
traits.1.name: Udito acuto
traits.1.text: Lo sciame dispone di vantaggio alle prove di Saggezza (Percezione) basate sull'udito.
traits.2.name: Sciame
traits.2.text: Lo sciame può occupare lo spazio di un'altra creatura e viceversa, e può muoversi attraverso qualsiasi apertura sufficientemente larga da far passare un pipistrello Minuscolo. Lo sciame non può recuperare punti ferita, né ottenere punti ferita temporanei.
actions.0.name: Morsi
actions.0.text: "Attacco con arma da mischia: +4 al tiro per colpire, portata 0 m, una creatura nello spazio dello sciame. Colpito: 5 (2d4) danni perforanti o 2 (1d4) danni perforanti se lo sciame possiede la metà dei suoi punti ferita o meno."
