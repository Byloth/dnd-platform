name: Cultista fanatico
text: I fanatici fanno spesso parte dei vertici di un culto e usano il loro carisma e i dogmi che conoscono per influenzare i deboli e approfittarsi di loro. Molti sono interessati al potere personale più di qualsiasi altra cosa.
alignment: qualsiasi allineamento non buono
armorClass.0.note: armatura di cuoio
languages: uno qualsiasi (di solito Comune)
traits.0.name: Devozione oscura
traits.0.text: Il fanatico dispone di vantaggio ai tiri salvezza contro le condizioni affascinato e spaventato.
traits.1.name: Incantesimi
traits.1.text: |-
  Il fanatico è un incantatore di 4° livello: la sua caratteristica da incantatore è Saggezza (CD del tiro salvezza sull'incantesimo 11, +3 al tiro per colpire con attacco con incantesimo). Il fanatico ha a disposizione i seguenti incantesimi da chierico:

  Trucchetti (a volontà): fiamma sacra, luce, taumaturgia
  - 1° livello (4 slot): comando, infliggi ferite, scudo della fede
  - 2° livello (3 slot): arma spirituale, blocca persone
actions.0.name: Multiattacco
actions.0.text: Il fanatico effettua due attacchi in mischia.
actions.0.multiattack.0.action: Pugnale
actions.1.name: Pugnale
actions.1.text: "Attacco con arma da mischia o a distanza: +4 al tiro per colpire, portata 1,5 m o gittata 6/18 m, una creatura. Colpito: 4 (1d4 + 2) danni perforanti."
