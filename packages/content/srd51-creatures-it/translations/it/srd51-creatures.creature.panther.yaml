name: Pantera
alignment: senza allineamento
traits.0.name: Olfatto acuto
traits.0.text: La pantera dispone di vantaggio alle prove di Saggezza (Percezione) basate sull'olfatto.
traits.1.name: Balzo
traits.1.text: Se la pantera si muove di almeno 6 metri in linea retta verso una creatura e poi la colpisce con un attacco con gli artigli nello stesso turno, quel bersaglio deve superare un tiro salvezza su Forza con CD 12, altrimenti cade a terra prono. Se il bersaglio è prono, la pantera può effettuare un attacco con il morso contro di esso come azione bonus.
actions.0.name: Morso
actions.0.text: "Attacco con arma da mischia: +4 al tiro per colpire, portata 1,5 m, un bersaglio. Colpito: 5 (1d6 + 2) danni perforanti."
actions.1.name: Artiglio
actions.1.text: "Attacco con arma da mischia: +4 al tiro per colpire, portata 1,5 m, un bersaglio. Colpito: 4 (1d4 + 2) danni taglienti."
