name: Falco di sangue
text: Il falco di sangue, che deve il nome al suo caratteristico piumaggio scarlatto e alla sua natura aggressiva, attacca senza paura qualsiasi altro animale, infilzandolo col suo becco appuntito e affilato. I falchi di sangue formano grossi stormi e attaccano insieme per abbattere le prede.
alignment: senza allineamento
traits.0.name: Vista acuta
traits.0.text: Il falco dispone di vantaggio alle prove di Saggezza (Percezione) basate sulla vista.
traits.1.name: Tattiche del branco
traits.1.text: Il falco dispone di vantaggio nel tiro per colpire contro una creatura se almeno uno degli alleati dell'animale si trova entro 1,5 metri dalla creatura e non è incapacitato.
actions.0.name: Becco
actions.0.text: "Attacco con arma da mischia: +4 al tiro per colpire, portata 1,5 m, un bersaglio. Colpito: 4 (1d4 + 2) danni perforanti."
