name: Rospo gigante
alignment: senza allineamento
traits.0.name: Anfibio
traits.0.text: Il rospo può respirare in aria e in acqua.
traits.1.name: Balzo da fermo
traits.1.text: Il rospo può compiere un salto in lungo di massimo 6 metri e uno in alto di massimo 3 metri, con o senza rincorsa.
actions.0.name: Morso
actions.0.text: "Attacco con arma da mischia: +4 al tiro per colpire, portata 1,5 m, un bersaglio. Colpito: 7 (1d10 + 2) danni perforanti più 5 (1d10) danni da veleno e il bersaglio è afferrato (CD 13 per sfuggire). Finché la presa perdura, il bersaglio viene trattenuto e il rospo non può morderne un altro."
actions.1.name: Inghiottire
actions.1.text: |-
  Il rospo effettua un attacco con il morso contro un bersaglio di taglia Media o inferiore con cui stia lottando. Se l'attacco va a segno, il bersaglio viene inghiottito e la lotta termina. Mentre è inghiottito, il bersaglio è accecato e trattenuto, beneficia di copertura totale contro gli attacchi e altri effetti al di fuori del rospo e subisce 10 (3d6) danni da acido all'inizio di ogni turno dell'animale, che può inghiottire soltanto un bersaglio alla volta.
  Se il rospo muore, la creatura inghiottita non è più trattenuta dalla bestia e può sfuggire usando 1,5 metri di movimento, uscendo prona dal cadavere.
