name: Mezzodrago rosso veterano
alignment: qualsiasi allineamento
armorClass.0.note: piastre
languages: Comune, Draconico
actions.0.name: Multiattacco
actions.0.text: Il veterano sferra due attacchi con la spada lunga. Se ha sfoderato una spada corta, può effettuare anche un attacco con quest'ultima.
actions.0.multiattack.0.action: Spada lunga
actions.0.multiattack.1.action: Spada corta
actions.1.name: Spada lunga
actions.1.text: "Attacco con arma da mischia: +5 al tiro per colpire, portata 1,5 m, un bersaglio. Colpito: 7 (1d8 + 3) danni taglienti o 8 (1d10 + 3) danni taglienti se impugnata con due mani."
actions.2.name: Spada corta
actions.2.text: "Attacco con arma da mischia: +5 al tiro per colpire, portata 1,5 m, un bersaglio. Colpito: 6 (1d6 + 3) danni perforanti."
actions.3.name: Balestra pesante
actions.3.text: "Attacco con arma a distanza: +3 al tiro per colpire, gittata 30/120 m, un bersaglio. Colpito: 6 (1d10 + 1) danni perforanti."
actions.4.name: Soffio di fuoco
actions.4.text: Il veterano esala fuoco in un cono di 4,5 metri. Ogni creatura in quell'area deve effettuare un tiro salvezza su Destrezza con CD 15, subendo 24 (7d6) danni da fuoco in caso di fallimento, o la metà dei danni in caso di successo.
