name: Capra gigante
alignment: senza allineamento
armorClass.0.note: armatura naturale
traits.0.name: Carica
traits.0.text: Se la capra si muove di almeno 6 metri in linea retta verso un bersaglio e poi lo colpisce con un attacco da sfondamento nello stesso turno, il bersaglio subisce 5 (2d4) danni contundenti extra. Se il bersaglio è una creatura, deve superare un tiro salvezza su Forza con CD 13, altrimenti cade a terra prono.
traits.1.name: Ben piantato
traits.1.text: La capra ha vantaggio ai tiri salvezza su Forza e Destrezza contro effetti che la farebbero cadere prona.
actions.0.name: Sfondamento
actions.0.text: "Attacco con arma da mischia: +5 al tiro per colpire, portata 1,5 m, un bersaglio. Colpito: 8 (2d4 + 3) danni contundenti."
