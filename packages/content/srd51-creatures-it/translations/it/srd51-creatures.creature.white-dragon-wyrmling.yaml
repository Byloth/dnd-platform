name: Drago bianco cucciolo
alignment: caotico malvagio
armorClass.0.note: armatura naturale
languages: Draconico
actions.0.name: Morso
actions.0.text: "Attacco con arma da mischia: +4 al tiro per colpire, portata 1,5 m, un bersaglio. Colpito: 7 (1d10 + 2) danni perforanti più 2 (1d4) danni da freddo."
actions.1.name: Soffio di freddo
actions.1.text: Il drago esala una folata gelida in un cono di 4,5 metri. Ogni creatura in quell'area deve effettuare un tiro salvezza su Costituzione con CD 12, subendo 22 (5d8) danni da freddo in caso di fallimento, o la metà dei danni in caso di successo.
