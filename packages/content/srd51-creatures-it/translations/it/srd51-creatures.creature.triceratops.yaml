name: Triceratopo
alignment: senza allineamento
armorClass.0.note: armatura naturale
traits.0.name: Carica travolgente
traits.0.text: Se il triceratopo si muove di almeno 6 metri in linea retta verso una creatura e poi la colpisce con un'incornata nello stesso turno, quel bersaglio deve superare un tiro salvezza su Forza con CD 13, altrimenti cade a terra prono. Se il bersaglio è prono, il triceratopo può effettuare un pestone contro di esso come azione bonus.
actions.0.name: Incornata
actions.0.text: "Attacco con arma da mischia: +9 al tiro per colpire, portata 1,5 m, un bersaglio. Colpito: 24 (4d8 + 6) danni perforanti."
actions.1.name: Pestone
actions.1.text: "Attacco con arma da mischia: +9 al tiro per colpire, portata 1,5 m, una creatura prona. Colpito: 22 (3d10 + 6) danni contundenti."
