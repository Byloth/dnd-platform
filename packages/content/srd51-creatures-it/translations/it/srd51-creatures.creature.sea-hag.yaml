name: Megera marina
alignment: caotica malvagia
armorClass.0.note: armatura naturale
languages: Aquan, Comune, Gigante
traits.0.name: Anfibio
traits.0.text: La megera può respirare in aria e in acqua.
traits.1.name: Aspetto orripilante
traits.1.text: |-
  Qualsiasi umanoide che inizi il proprio turno nel campo visivo della megera, entro un raggio di 9 metri da lei, può vederne la vera forma e deve effettuare un tiro salvezza su Saggezza con CD 11; se lo fallisce, è spaventato per 1 minuto. Una creatura può ripetere il tiro salvezza alla fine di ogni suo turno, subendo svantaggio se la megera è situata nel suo campo visivo; se lo supera, l'effetto svanisce. Se una creatura supera il tiro salvezza o se l'effetto per lei termina, diventa immune all'Aspetto orripilante della megera per le 24 ore successive.
  A meno che il bersaglio non sia sorpreso o la rivelazione della vera forma della megera non sia improvvisa, il bersaglio può distogliere lo sguardo ed evitare di effettuare il tiro salvezza iniziale. Fino all'inizio del proprio turno successivo, una creatura che distoglie lo sguardo subisce svantaggio ai tiri per colpire contro la megera.
actions.0.name: Artigli
actions.0.text: "Attacco con arma da mischia: +5 al tiro per colpire, portata 1,5 m, un bersaglio. Colpito: 10 (2d6 + 3) danni taglienti."
actions.1.name: Sguardo mortale
actions.1.text: La megera prende di mira una creatura spaventata visibile entro un raggio di 9 metri. Se il bersaglio può vedere la megera, deve superare un tiro salvezza su Saggezza con CD 11 contro questa magia, altrimenti scende a 0 punti ferita.
actions.2.name: Aspetto illusorio
actions.2.text: |-
  La megera avvolge se stessa e tutto ciò che indossa o trasporta in un'illusione magica che la fa apparire come una creatura brutta, di taglia e di forma umanoide simile alla sua. L'illusione termina se la megera usa un'azione bonus per terminarla o se muore.
  I cambiamenti apportati da questo effetto non passano il vaglio di un'ispezione fisica. Per esempio, la megera potrebbe apparire priva di artigli, ma chiunque toccasse la sua mano sentirebbe che è artigliata. Sotto ogni altro aspetto, una creatura deve usare un'azione per ispezionare l'illusione e superare una prova di Intelligenza (Indagare) con CD 16 per capire che la megera è camuffata.
