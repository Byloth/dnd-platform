name: Cavallo degli incubi
alignment: neutrale malvagio
armorClass.0.note: armatura naturale
languages: capisce Abissale, Comune e Infernale ma non li parla
traits.0.name: Conferire resistenza al fuoco
traits.0.text: Il cavallo degli incubi può conferire resistenza ai danni da fuoco a chiunque lo cavalchi.
traits.1.name: Illuminazione
traits.1.text: Il cavallo degli incubi emana luce intensa in un raggio di 3 metri e luce fioca per ulteriori 3 metri.
actions.0.name: Zoccoli
actions.0.text: "Attacco con arma da mischia: +6 al tiro per colpire, portata 1,5 m, un bersaglio. Colpito: 13 (2d8 + 4) danni contundenti più 7 (2d6) danni da fuoco."
actions.1.name: Passo etereo
actions.1.text: Il cavallo degli incubi e un massimo di tre creature consenzienti situate entro 1,5 metri da esso passano magicamente dal Piano Materiale al Piano Etereo o viceversa.
