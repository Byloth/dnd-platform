name: Gigante delle nuvole
alignment: neutrale buono (50%) o neutrale malvagio (50%)
armorClass.0.note: armatura naturale
languages: Comune, Gigante
traits.0.name: Olfatto acuto
traits.0.text: Il gigante dispone di vantaggio alle prove di Saggezza (Percezione) basate sull'olfatto.
traits.1.name: Incantesimi innati
traits.1.text: |-
  La caratteristica innata da incantatore del gigante è Carisma. Per sua natura, è in grado di lanciare gli incantesimi indicati di seguito senza aver bisogno di componenti materiali:

  A volontà: individuazione del magico, luce, nube di nebbia
  3/giorno ciascuno: caduta morbida, passo velato, telecinesi, volare
  1/giorno ciascuno: controllare tempo atmosferico, forma gassosa
actions.0.name: Multiattacco
actions.0.text: Il gigante effettua due attacchi con la mazza chiodata.
actions.0.multiattack.0.action: Mazza chiodata
actions.1.name: Mazza chiodata
actions.1.text: "Attacco con arma da mischia: +12 al tiro per colpire, portata 3 m, un bersaglio. Colpito: 21 (3d8 + 8) danni perforanti."
actions.2.name: Roccia
actions.2.text: "Attacco con arma a distanza: +12 al tiro per colpire, gittata 18/72 m, un bersaglio. Colpito: 30 (4d10 + 8) danni contundenti."
