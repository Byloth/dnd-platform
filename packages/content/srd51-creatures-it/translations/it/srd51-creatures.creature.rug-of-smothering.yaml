name: Tappeto soffocante
alignment: senza allineamento
traits.0.name: Suscettibilità all'anti-magia
traits.0.text: Il tappeto è incapacitato finché si trova nell'area di un campo anti-magia. Se bersagliato da un incantesimo dissolvi magie, il tappeto deve superare un tiro salvezza su Costituzione contro la CD del tiro salvezza sull'incantesimo di chi lo lancia, altrimenti è privo di sensi per 1 minuto.
traits.1.name: Trasferire danni
traits.1.text: Mentre lotta con una creatura, il tappeto subisce solo metà dei danni che gli vengono inflitti e la creatura con cui lotta subisce l'altra metà.
traits.2.name: Falso aspetto
traits.2.text: Finché il tappeto rimane immobile, non è distinguibile da un tappeto normale.
actions.0.name: Soffocare
actions.0.text: "Attacco con arma da mischia: +5 al tiro per colpire, portata 1,5 m, una creatura di taglia Media o inferiore. Colpito: la creatura è afferrata (CD 13 per sfuggire). Finché la presa perdura, il bersaglio è trattenuto, accecato e rischia di soffocare, ma il tappeto non può soffocare un altro bersaglio. Inoltre, all'inizio di ogni suo turno, il bersaglio subisce 10 (2d6 + 3) danni contundenti."
