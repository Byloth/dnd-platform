name: Mammut
text: Un mammut è una creatura simile a un elefante, dalla pelliccia folta e le zanne lunghe. È più tarchiato e feroce dei normali elefanti e può vivere in diversi habitat, da quelli subartici a quelli subtropicali.
alignment: senza allineamento
armorClass.0.note: armatura naturale
traits.0.name: Carica travolgente
traits.0.text: Se il mammut si muove di almeno 6 metri in linea retta verso una creatura e poi la colpisce effettuando un'incornata con le zanne nello stesso turno, quel bersaglio deve superare un tiro salvezza su Forza con CD 18, altrimenti cade a terra prono. Se il bersaglio è prono, il mammut può effettuare un pestone contro di esso come azione bonus.
actions.0.name: Incornata
actions.0.text: "Attacco con arma da mischia: +10 al tiro per colpire, portata 3 m, un bersaglio. Colpito: 25 (4d8 + 7) danni perforanti."
actions.1.name: Pestone
actions.1.text: "Attacco con arma da mischia: +10 al tiro per colpire, portata 1,5 m, una creatura prona. Colpito: 29 (4d10 + 7) danni contundenti."
