name: Drago d'oro giovane
alignment: legale buono
armorClass.0.note: armatura naturale
languages: Comune, Draconico
traits.0.name: Anfibio
traits.0.text: Il drago può respirare in aria e in acqua.
actions.0.name: Multiattacco
actions.0.text: "Il drago effettua tre attacchi: uno con il morso e due con gli artigli."
actions.0.multiattack.0.action: Morso
actions.0.multiattack.1.action: Artiglio
actions.1.name: Morso
actions.1.text: "Attacco con arma da mischia: +10 al tiro per colpire, portata 3 m, un bersaglio. Colpito: 17 (2d10 + 6) danni perforanti."
actions.2.name: Artiglio
actions.2.text: "Attacco con arma da mischia: +10 al tiro per colpire, portata 1,5 m, un bersaglio. Colpito: 13 (2d6 + 6) danni taglienti."
actions.3.name: Soffi
actions.3.text: |-
  Il drago usa uno dei seguenti soffi.
  Soffio di fuoco. Il drago esala fuoco in un cono di 9 metri. Ogni creatura in quell'area deve effettuare un tiro salvezza su Destrezza con CD 17, subendo 55 (10d10) danni da fuoco in caso di fallimento, o la metà dei danni in caso di successo.
  Soffio indebolente. Il drago esala gas in un cono di 9 metri. Ogni creatura in quell'area deve superare un tiro salvezza su Forza con CD 17, altrimenti subisce svantaggio ai tiri per colpire basati sulla Forza, alle prove di Forza e ai tiri salvezza su Forza per 1 minuto. La creatura può ripetere il tiro salvezza alla fine di ogni suo turno e, se lo supera, l'effetto svanisce.
