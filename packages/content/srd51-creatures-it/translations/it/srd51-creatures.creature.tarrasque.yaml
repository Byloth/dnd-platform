name: Tarrasque
alignment: senza allineamento
armorClass.0.note: armatura naturale
immunities.2.note: da attacchi non magici
traits.0.name: Resistenza leggendaria
traits.0.text: Se il tarrasque fallisce un tiro salvezza, può scegliere di superarlo comunque.
traits.1.name: Resistenza alla magia
traits.1.text: Il tarrasque dispone di vantaggio ai tiri salvezza contro incantesimi e altri effetti magici.
traits.2.name: Carapace riflettente
traits.2.text: Ogni volta che il tarrasque è bersagliato da un incantesimo dardo incantato, un incantesimo che ha una linea come area di effetto o un incantesimo che richiede un tiro per colpire a distanza, si tira un d6. Con un risultato da 1 a 5, il tarrasque non ne è influenzato. Con un risultato di 6, il tarrasque non ne è influenzato e l'effetto viene riflesso contro l'incantatore come se avesse origine dal tarrasque, rendendo l'incantatore il bersaglio.
traits.3.name: Mostro da assedio
traits.3.text: Il tarrasque infligge danni doppi a oggetti e strutture.
actions.0.name: Multiattacco
actions.0.text: "Il tarrasque può usare la sua presenza terrificante. Poi effettua cinque attacchi: uno con il morso, due con gli artigli, uno con le corna e uno con la coda. Può usare Inghiottire al posto del morso."
actions.0.multiattack.0.action: Morso
actions.0.multiattack.1.action: Artiglio
actions.0.multiattack.2.action: Corna
actions.0.multiattack.3.action: Coda
actions.1.name: Morso
actions.1.text: "Attacco con arma da mischia: +19 al tiro per colpire, portata 3 m, un bersaglio. Colpito: 36 (4d12 + 10) danni perforanti. Se il bersaglio è una creatura, viene afferrato (CD 20 per sfuggire). Finché la presa perdura, il bersaglio viene trattenuto e il tarrasque non può morderne un altro."
actions.2.name: Artiglio
actions.2.text: "Attacco con arma da mischia: +19 al tiro per colpire, portata 4,5 m, un bersaglio. Colpito: 28 (4d8 + 10) danni taglienti."
actions.3.name: Corna
actions.3.text: "Attacco con arma da mischia: +19 al tiro per colpire, portata 3 m, un bersaglio. Colpito: 32 (4d10 + 10) danni perforanti."
actions.4.name: Coda
actions.4.text: "Attacco con arma da mischia: +19 al tiro per colpire, portata 6 m, un bersaglio. Colpito: 24 (4d6 + 10) danni contundenti. Se il bersaglio è una creatura, deve superare un tiro salvezza su Forza con CD 20, altrimenti cade a terra prono."
actions.5.name: Presenza terrificante
actions.5.text: Ogni creatura a scelta del tarrasque situata entro 36 metri da esso e che sia consapevole della sua presenza deve superare un tiro salvezza su Saggezza con CD 17, altrimenti è spaventata per 1 minuto. Una creatura può ripetere il tiro salvezza alla fine di ogni suo turno, subendo svantaggio se il tarrasque è situato nel suo campo visivo; se lo supera, l'effetto svanisce. Se una creatura supera il tiro salvezza o se l'effetto per lei termina, diventa immune alla presenza terrificante del tarrasque per le 24 ore successive.
actions.6.name: Inghiottire
actions.6.text: |-
  Il tarrasque effettua un attacco con il morso contro una creatura di taglia Grande o inferiore con cui sta lottando. Se l'attacco va a segno, il bersaglio subisce i danni del morso, viene inghiottito e la lotta termina. Mentre è inghiottita, la creatura è accecata e trattenuta, beneficia di copertura totale contro gli attacchi e altri effetti al di fuori del tarrasque e subisce 56 (16d6) danni da acido all'inizio di ogni turno del mostro.
  Se il tarrasque subisce 60 o più danni in un singolo turno da una creatura inghiottita, il tarrasque deve superare un tiro salvezza su Costituzione con CD 20 alla fine di quel turno, altrimenti rigurgita tutte le creature inghiottite, che cadono prone in uno spazio entro 3 metri dal tarrasque. Se il tarrasque muore, la creatura inghiottita non è più trattenuta dal mostro e può sfuggire usando 9 metri di movimento, uscendo prona dal cadavere.
legendary.actions.0.name: Attacco
legendary.actions.0.text: Il tarrasque effettua un attacco con l'artiglio o con la coda.
legendary.actions.1.name: Movimento
legendary.actions.1.text: Il tarrasque si muove fino a metà della sua velocità.
legendary.actions.2.name: Masticare (costa 2 azioni)
legendary.actions.2.text: Il tarrasque effettua un attacco con il morso o usa Inghiottire.
legendary.text: Il tarrasque può eseguire 3 azioni leggendarie a scelta tra le opzioni seguenti. È possibile utilizzare solo un'opzione di azione leggendaria alla volta e soltanto alla fine del turno di un'altra creatura. All'inizio del proprio turno, il tarrasque recupera le azioni leggendarie effettuate.
