name: Diavolo delle catene
alignment: legale malvagio
armorClass.0.note: armatura naturale
resistances.1.note: da attacchi non magici non argentati
languages: Infernale, telepatia 36 m
traits.0.name: Vista del diavolo
traits.0.text: L'oscurità magica non ostacola la scurovisione del diavolo.
traits.1.name: Resistenza alla magia
traits.1.text: Il diavolo dispone di vantaggio ai tiri salvezza contro incantesimi e altri effetti magici.
actions.0.name: Multiattacco
actions.0.text: Il diavolo effettua due attacchi con le catene.
actions.0.multiattack.0.action: Catena
actions.1.name: Catena
actions.1.text: "Attacco con arma da mischia: +8 al tiro per colpire, portata 3 m, un bersaglio. Colpito: 11 (2d6 + 4) danni taglienti. Il bersaglio è afferrato (CD 14 per sfuggire) se il diavolo non sta già afferrando una creatura. Finché la presa perdura, il bersaglio è trattenuto e subisce 7 (2d6) danni perforanti all'inizio di ogni suo turno."
actions.2.name: Catene animate
actions.2.text: |-
  Da un massimo di quattro catene entro 18 metri nel campo visivo del diavolo crescono magicamente degli spuntoni affilati come lame; le catene si animano sotto il suo controllo, purché non siano indossate o trasportate.
  Ogni catena animata è un oggetto con CA 20, 20 punti ferita, resistenza ai danni perforanti e immunità ai danni psichici e ai danni da tuono. Quando il diavolo usa Multiattacco nel suo turno, può usare ogni catena animata per effettuare un attacco aggiuntivo con una catena. Una catena animata può afferrare una creatura di sua spontanea volontà, ma non può effettuare attacchi finché è impegnata in questa lotta. Torna nel suo stato inanimato se ridotta a 0 punti ferita oppure se il diavolo è incapacitato o muore.
reactions.0.name: Maschera snervante
reactions.0.text: Quando una creatura che il diavolo è in grado di vedere inizia il proprio turno entro 9 metri da quest'ultimo, il diavolo può creare un'illusione che lo fa apparire come una persona scomparsa cara alla creatura o come un suo acerrimo nemico. Se la creatura può vedere il diavolo, deve superare un tiro salvezza su Saggezza con CD 14, altrimenti è spaventata fino alla fine del proprio turno.
