name: Albero risvegliato
text: Un albero risvegliato è un albero comune diventato senziente e in grado di muoversi grazie all'incantesimo risveglio o ad altre magie simili.
alignment: senza allineamento
armorClass.0.note: armatura naturale
languages: un linguaggio conosciuto dal suo creatore
traits.0.name: Falso aspetto
traits.0.text: Finché questo essere rimane immobile, non è possibile distinguerlo da un normale albero.
actions.0.name: Schianto
actions.0.text: "Attacco con arma da mischia: +6 al tiro per colpire, portata 3 m, un bersaglio. Colpito: 14 (3d6 + 4) danni contundenti."
