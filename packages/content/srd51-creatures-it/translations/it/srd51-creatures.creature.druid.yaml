name: Druido
text: I **druidi** vivono nelle foreste e in altri luoghi isolati delle terre selvagge, dove proteggono il mondo naturale dai mostri e dall'avanzata della civiltà. Alcuni sono **sciamani tribali** che curano i malati, pregano gli spiriti animali e forniscono guida spirituale.
alignment: qualsiasi allineamento
armorClass.1.note: con pelle coriacea
languages: Druidico più altri due qualsiasi
traits.0.name: Incantesimi
traits.0.text: |-
  Il druido è un incantatore di 4° livello: la sua caratteristica da incantatore è Saggezza (CD del tiro salvezza sull'incantesimo 12, +4 al tiro per colpire con attacco con incantesimo). Ha a disposizione i seguenti incantesimi da druido:

  - Trucchetti (a volontà): artificio druidico, produrre fiamma, randello incantato
  - 1° livello (4 slot): intralciare, onda tonante, parlare con gli animali, passo veloce
  - 2° livello (3 slot): animale messaggero, pelle coriacea
actions.0.name: Bastone ferrato
actions.0.text: "Attacco con arma da mischia: +2 al tiro per colpire (+4 con randello incantato), portata 1,5 m, un bersaglio. Colpito: 3 (1d6) danni contundenti, 4 (1d8) danni contundenti se usato a due mani o 6 (1d8 + 2) danni contundenti con randello incantato."
