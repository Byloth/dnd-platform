name: Lamia
alignment: caotico malvagio
armorClass.0.note: armatura naturale
languages: Abissale, Comune
traits.0.name: Incantesimi innati
traits.0.text: "La caratteristica innata da incantatore del lamia è Carisma (CD del tiro salvezza sull'incantesimo 13). Per sua natura, è in grado di lanciare gli incantesimi indicati di seguito senza aver bisogno di componenti materiali. A volontà: camuffare se stesso (qualsiasi forma umanoide), immagine maggiore 3/giorno ciascuno: charme su persone, immagine speculare, scrutare, suggestione 1/giorno: costrizione"
actions.0.name: Multiattacco
actions.0.text: "Il lamia effettua due attacchi: uno con gli artigli e uno con il pugnale o con il tocco intossicante."
actions.1.name: Artigli
actions.1.text: "Attacco con arma da mischia: +5 al tiro per colpire, portata 1,5 m, un bersaglio. Colpito: 14 (2d10 + 3) danni taglienti."
actions.2.name: Pugnale
actions.2.text: "Attacco con arma da mischia: +5 al tiro per colpire, portata 1,5 m, un bersaglio. Colpito: 5 (1d4 + 3) danni perforanti."
actions.3.name: Tocco intossicante
actions.3.text: "Attacco in mischia con incantesimo: +5 al tiro per colpire, portata 1,5 m, una creatura. Colpito: Il bersaglio è magicamente maledetto per 1 ora. Finché la maledizione non termina, il bersaglio subisce svantaggio ai tiri salvezza su Saggezza e a tutte le prove di caratteristica."
