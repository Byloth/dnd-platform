name: Orso bruno
alignment: senza allineamento
armorClass.0.note: armatura naturale
traits.0.name: Olfatto acuto
traits.0.text: L'orso dispone di vantaggio alle prove di Saggezza (Percezione) basate sull'olfatto.
actions.0.name: Multiattacco
actions.0.text: "L'orso effettua due attacchi: uno con il morso e uno con gli artigli."
