name: Elfo drow
alignment: neutrale malvagio
armorClass.0.note: giaco di maglia
languages: Elfico, Sottocomune
traits.0.name: Retaggio fatato
traits.0.text: Il drow dispone di vantaggio ai tiri salvezza contro la condizione di affascinato e non può essere addormentato tramite la magia.
traits.1.name: Incantesimi innati
traits.1.text: |-
  La caratteristica da incantatore del drow è Carisma (CD del tiro salvezza sull'incantesimo 11). Per sua natura, è in grado di lanciare gli incantesimi indicati di seguito senza aver bisogno di componenti materiali:
  A volontà: luci danzanti
  1/giorno ciascuno: luminescenza, oscurità
traits.2.name: Sensibilità al sole
traits.2.text: Mentre è alla luce del sole, il drow ha uno svantaggio nei tiri per colpire, così come nelle prove di Saggezza (Percezione) che si basano sulla vista.
actions.0.name: Spada corta
actions.0.text: "Attacco con arma da mischia: +4 al tiro per colpire, portata 1,5 m, un bersaglio. Colpito: 5 (1d6 + 2) danni perforanti."
actions.1.name: Balestra a mano
actions.1.text: "Attacco con arma a distanza: +4 al tiro per colpire, gittata 9/36 m, un bersaglio. Colpito: 5 (1d6 + 2) danni perforanti e il bersaglio deve superare un tiro salvezza su Costituzione con CD 13, altrimenti viene avvelenato per 1 ora. Se il tiro salvezza fallisce di 5 o più, il bersaglio avvelenato rimane anche privo di sensi. Il bersaglio si risveglia se subisce danni o se un'altra creatura usa un'azione per svegliarlo scuotendolo."
