name: Drago verde giovane
alignment: legale malvagio
armorClass.0.note: armatura naturale
languages: Comune, Draconico
traits.0.name: Anfibio
traits.0.text: Il drago può respirare in aria e in acqua.
actions.0.name: Multiattacco
actions.0.text: "Il drago effettua tre attacchi: uno con il morso e due con gli artigli."
actions.0.multiattack.0.action: Morso
actions.0.multiattack.1.action: Artiglio
actions.1.name: Morso
actions.1.text: "Attacco con arma da mischia: +7 al tiro per colpire, portata 3 m, un bersaglio. Colpito: 15 (2d10 + 4) danni perforanti più 7 (2d6) danni da veleno."
actions.2.name: Artiglio
actions.2.text: "Attacco con arma da mischia: +7 al tiro per colpire, portata 1,5 m, un bersaglio. Colpito: 11 (2d6 + 4) danni taglienti."
actions.3.name: Soffio di veleno
actions.3.text: Il drago esala gas velenoso in un cono di 9 metri. Ogni creatura in quell'area deve effettuare un tiro salvezza su Costituzione con CD 14, subendo 42 (12d6) danni da veleno in caso di fallimento, o la metà dei danni in caso di successo.
