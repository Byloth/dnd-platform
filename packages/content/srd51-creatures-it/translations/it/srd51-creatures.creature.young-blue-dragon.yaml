name: Drago blu giovane
alignment: legale malvagio
armorClass.0.note: armatura naturale
languages: Comune, Draconico
actions.0.name: Multiattacco
actions.0.text: "Il drago effettua tre attacchi: uno con il morso e due con gli artigli."
actions.0.multiattack.0.action: Morso
actions.0.multiattack.1.action: Artiglio
actions.1.name: Morso
actions.1.text: "Attacco con arma da mischia: +9 al tiro per colpire, portata 3 m, un bersaglio. Colpito: 16 (2d10 + 5) danni perforanti più 5 (1d10) danni da fulmine."
actions.2.name: Artiglio
actions.2.text: "Attacco con arma da mischia: +9 al tiro per colpire, portata 1,5 m, un bersaglio. Colpito: 12 (2d6 + 5) danni taglienti."
actions.3.name: Soffio di fulmini
actions.3.text: Il drago esala una scarica di fulmini lunga 18 metri e larga 1,5 metri. Ogni creatura su quella linea deve effettuare un tiro salvezza su Destrezza con CD 16, subendo 55 (10d10) danni da fulmine in caso di fallimento, o la metà dei danni in caso di successo.
