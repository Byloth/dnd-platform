name: Beccoaguzzo
text: Un beccoaguzzo è un uccello alto, incapace di volare, con zampe robuste e un grosso becco acuminato. Ha un caratteraccio e tende ad attaccare qualsiasi creatura sconosciuta gli si avvicini troppo.
alignment: senza allineamento
actions.0.name: Becco
actions.0.text: "Attacco con arma da mischia: +4 al tiro per colpire, portata 1,5 m, un bersaglio. Colpito: 6 (1d8 + 2) danni taglienti."
