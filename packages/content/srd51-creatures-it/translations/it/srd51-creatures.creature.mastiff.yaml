name: Mastino
text: I mastini sono possenti cani apprezzatissimi dagli umanoidi per la loro fedeltà e i loro sensi acuti. Questi animali possono essere addestrati come cani da guardia, da caccia o da guerra. Gli halfling e altri umanoidi Piccoli li usano come cavalcature.
alignment: senza allineamento
traits.0.name: Udito e olfatto acuti
traits.0.text: Il mastino dispone di vantaggio alle prove di Saggezza (Percezione) basate sull'olfatto o sull'udito.
actions.0.name: Morso
actions.0.text: "Attacco con arma da mischia: +3 al tiro per colpire, portata 1,5 m, un bersaglio. Colpito: 4 (1d6 + 1) danni perforanti. Se il bersaglio è una creatura, deve superare un tiro salvezza su Forza con CD 11, altrimenti cade a terra prono."
