name: Tigre dai denti a sciabola
alignment: senza allineamento
traits.0.name: Olfatto acuto
traits.0.text: La tigre dispone di vantaggio alle prove di Saggezza (Percezione) basate sull'olfatto.
traits.1.name: Balzo
traits.1.text: Se la tigre si muove di almeno 6 metri in linea retta verso una creatura e poi la colpisce con un attacco con gli artigli nello stesso turno, quel bersaglio deve superare un tiro salvezza su Forza con CD 14, altrimenti cade a terra prono. Se il bersaglio è prono, la tigre può effettuare un attacco con il morso contro di esso come azione bonus.
actions.0.name: Morso
actions.0.text: "Attacco con arma da mischia: +6 al tiro per colpire, portata 1,5 m, un bersaglio. Colpito: 10 (1d10 + 5) danni perforanti."
actions.1.name: Artiglio
actions.1.text: "Attacco con arma da mischia: +6 al tiro per colpire, portata 1,5 m, un bersaglio. Colpito: 12 (2d6 + 5) danni taglienti."
