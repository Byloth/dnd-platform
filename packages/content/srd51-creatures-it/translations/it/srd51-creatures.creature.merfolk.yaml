actions.0.text: "Attacco con arma da mischia o a distanza: +2 al tiro per colpire, portata 1,5 m o gittata 6/18 m, un bersaglio. Colpito: 3 (1d6) danni perforanti o 4 (1d8) danni perforanti se usata a due mani per effettuare un attacco in mischia."
