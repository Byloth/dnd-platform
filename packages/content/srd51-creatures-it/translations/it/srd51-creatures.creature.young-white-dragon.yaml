name: Drago bianco giovane
alignment: caotico malvagio
armorClass.0.note: armatura naturale
languages: Comune, Draconico
traits.0.name: Camminare sul ghiaccio
traits.0.text: Il drago può muoversi sulle superfici di ghiaccio e scalarle senza bisogno di effettuare una prova di caratteristica. Inoltre, un terreno difficile costituito da ghiaccio o neve non gli costa alcun movimento aggiuntivo.
actions.0.name: Multiattacco
actions.0.text: "Il drago effettua tre attacchi: uno con il morso e due con gli artigli."
actions.0.multiattack.0.action: Morso
actions.0.multiattack.1.action: Artiglio
actions.1.name: Morso
actions.1.text: "Attacco con arma da mischia: +7 al tiro per colpire, portata 3 m, un bersaglio. Colpito: 15 (2d10 + 4) danni perforanti più 4 (1d8) danni da freddo."
actions.2.name: Artiglio
actions.2.text: "Attacco con arma da mischia: +7 al tiro per colpire, portata 1,5 m, un bersaglio. Colpito: 11 (2d6 + 4) danni taglienti."
actions.3.name: Soffio di freddo
actions.3.text: Il drago esala una folata gelida in un cono di 9 metri. Ogni creatura in quell'area deve effettuare un tiro salvezza su Costituzione con CD 15, subendo 45 (10d8) danni da freddo in caso di fallimento, o la metà dei danni in caso di successo.
