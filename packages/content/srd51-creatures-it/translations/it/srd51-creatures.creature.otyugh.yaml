name: Otyugh
alignment: neutrale
armorClass.0.note: armatura naturale
languages: Otyugh
traits.0.name: Telepatia limitata
traits.0.text: L'otyugh può trasmettere magicamente messaggi e immagini semplici a qualsiasi creatura situata entro 36 metri da lui e che sia in grado di comprendere un linguaggio. Questa forma di telepatia non consente alla creatura che riceve il messaggio di rispondere telepaticamente.
actions.0.name: Multiattacco
actions.0.text: "L'otyugh effettua tre attacchi: uno con il morso e due con i tentacoli."
actions.0.multiattack.0.action: Morso
actions.0.multiattack.1.action: Tentacolo
actions.1.name: Morso
actions.1.text: "Attacco con arma da mischia: +6 al tiro per colpire, portata 1,5 m, un bersaglio. Colpito: 12 (2d8 + 3) danni perforanti. Se il bersaglio è una creatura, deve superare un tiro salvezza su Costituzione con CD 15 contro le malattie, altrimenti è avvelenato finché la malattia non viene curata. Dopo ogni 24 ore, il bersaglio deve ripetere il tiro salvezza; riduce i suoi punti ferita massimi di 5 (1d10) in caso di fallimento, e viene curato dalla malattia in caso di successo. Se la malattia porta i suoi punti ferita massimi a 0, il bersaglio muore. Questa riduzione dei punti ferita massimi del bersaglio dura finché la malattia non viene curata."
actions.2.name: Tentacolo
actions.2.text: "Attacco con arma da mischia: +6 al tiro per colpire, portata 3 m, un bersaglio. Colpito: 7 (1d8 + 3) danni contundenti più 4 (1d8) danni perforanti. Se il bersaglio è di taglia Media o inferiore, viene afferrato (CD 13 per sfuggire) e, finché l'otyugh non molla la presa, è trattenuto. Il mostro possiede due tentacoli, ognuno dei quali può afferrare un bersaglio."
actions.3.name: Schianto con tentacolo
actions.3.text: L'otyugh scaglia le creature afferrate l'una contro l'altra o contro una superficie solida. Ogni creatura deve superare un tiro salvezza su Costituzione con CD 14, altrimenti subisce 10 (2d6 + 3) danni contundenti ed è stordita fino alla fine del turno successivo dell'otyugh. Se supera il tiro salvezza, il bersaglio subisce la metà dei danni contundenti e non è stordito.
