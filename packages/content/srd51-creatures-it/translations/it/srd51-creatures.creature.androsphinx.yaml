name: Androsfinge
alignment: legale neutrale
armorClass.0.note: armatura naturale
immunities.1.note: da attacchi non magici
languages: Comune, Sfinge
traits.0.name: Imperscrutabile
traits.0.text: La sfinge è immune a qualsiasi effetto che tenti di percepire le emozioni o leggere nel pensiero, nonché a qualsiasi incantesimo di divinazione a cui rifiuti di sottoporsi. Le prove di Saggezza (Intuizione) effettuate per discernere le intenzioni o la sincerità della sfinge subiscono svantaggio.
traits.1.name: Armi magiche
traits.1.text: Gli attacchi con arma della sfinge sono magici.
traits.2.name: Incantesimi
traits.2.text: |-
  La sfinge è un'incantatrice di 12° livello: la sua caratteristica da incantatore è Saggezza (CD del tiro salvezza sull'incantesimo 18, +10 al tiro per colpire con attacco con incantesimo). Non ha bisogno di componenti materiali per lanciare i suoi incantesimi. La sfinge ha a disposizione i seguenti incantesimi da chierico:

  - Trucchetti (a volontà): fiamma sacra, salvare i morenti, taumaturgia
  - 1° livello (4 slot): comando, individuazione del bene e del male, individuazione del magico
  - 2° livello (3 slot): ristorare inferiore, zona di verità
  - 3° livello (3 slot): dissolvi magie, linguaggi
  - 4° livello (3 slot): esilio, libertà di movimento
  - 5° livello (2 slot): colpo infuocato, ristorare superiore
  - 6° livello (1 slot): banchetto degli eroi
actions.0.name: Multiattacco
actions.0.text: La sfinge effettua due attacchi con gli artigli.
actions.0.multiattack.0.action: Artiglio
actions.1.name: Artiglio
actions.1.text: "Attacco con arma da mischia: +12 al tiro per colpire, portata 1,5 m, un bersaglio. Colpito: 17 (2d10 + 6) danni taglienti."
actions.2.name: Ruggito
actions.2.text: |-
  La sfinge emette un ruggito magico. Ogni volta che ruggisce prima di completare un riposo lungo, il verso è più forte e l'effetto è diverso, come descritto di seguito. Ogni creatura entro 150 metri dalla sfinge e in grado di udire il ruggito deve effettuare un tiro salvezza.

  Primo ruggito. Ogni creatura che fallisce un tiro salvezza su Saggezza con CD 18 è spaventata per 1 minuto. La creatura spaventata può ripetere il tiro salvezza alla fine di ogni suo turno e, se lo supera, l'effetto svanisce.

  Secondo ruggito. Ogni creatura che fallisce un tiro salvezza su Saggezza con CD 18 è assordata e spaventata per 1 minuto. La creatura spaventata è paralizzata e può ripetere il tiro salvezza alla fine di ogni suo turno: se lo supera, l'effetto svanisce.

  Terzo ruggito. Ogni creatura effettua un tiro salvezza su Costituzione con CD 18: chi lo fallisce subisce 44 (8d10) danni da tuono e cade a terra prona; chi lo supera, invece, subisce soltanto la metà di quei danni e non viene buttata a terra prona.
legendary.actions.0.name: Attacco con artiglio
legendary.actions.0.text: La sfinge effettua un attacco con artiglio.
legendary.actions.1.name: Teletrasporto (costa 2 azioni)
legendary.actions.1.text: La sfinge si teletrasporta magicamente, insieme a ogni oggetto che indossa o trasporta, fino a uno spazio libero visibile entro 36 metri.
legendary.actions.2.name: Lanciare un incantesimo (costa 3 azioni)
legendary.actions.2.text: La sfinge lancia un incantesimo dalla sua lista degli incantesimi preparati, usando uno slot incantesimo come di consueto.
