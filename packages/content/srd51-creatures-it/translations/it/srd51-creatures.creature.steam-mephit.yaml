name: Mephit del vapore
alignment: neutrale malvagio
languages: Aquan, Ignan
traits.0.name: Esplosione della morte
traits.0.text: Quando il mephit muore, esplode in una nube di vapore. Ogni creatura situata entro 1,5 metri dal mephit deve superare un tiro salvezza su Destrezza con CD 10, altrimenti subisce 4 (1d8) danni da fuoco.
traits.1.name: Incantesimi innati
traits.1.text: Il mephit può lanciare sfocatura come incantesimo innato senza aver bisogno di componenti materiali. La sua caratteristica innata da incantatore è Carisma.
actions.0.name: Artigli
actions.0.text: "Attacco con arma da mischia: +2 al tiro per colpire, portata 1,5 m, una creatura. Colpito: 2 (1d4) danni taglienti più 2 (1d4) danni da fuoco."
actions.1.name: Soffio di vapore
actions.1.text: Il mephit esala vapore ustionante in un cono di 4,5 metri. Ogni creatura in quell'area deve effettuare un tiro salvezza su Destrezza con CD 10, subendo 4 (1d8) danni da fuoco in caso di fallimento, o la metà in caso di successo.
