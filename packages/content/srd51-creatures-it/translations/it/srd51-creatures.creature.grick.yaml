name: Grick
alignment: neutrale
armorClass.0.note: armatura naturale
resistances.0.note: da attacchi non magici
traits.0.name: Mimetizzazione rocciosa
traits.0.text: Il grick dispone di vantaggio alle prove di Destrezza (Furtività) effettuate per nascondersi nei terreni rocciosi.
actions.0.name: Multiattacco
actions.0.text: Il grick effettua un attacco con i tentacoli. Se va a segno, può effettuarne uno con il becco contro lo stesso bersaglio.
actions.0.multiattack.0.action: Tentacoli
actions.0.multiattack.1.action: Becco
actions.1.name: Tentacoli
actions.1.text: "Attacco con arma da mischia: +4 al tiro per colpire, portata 1,5 m, un bersaglio. Colpito: 9 (2d6 + 2) danni taglienti."
actions.2.name: Becco
actions.2.text: "Attacco con arma da mischia: +4 al tiro per colpire, portata 1,5 m, un bersaglio. Colpito: 5 (1d6 + 2) danni perforanti."
