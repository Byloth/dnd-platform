name: Elementale dell'acqua
alignment: neutrale
armorClass.0.note: armatura naturale
resistances.1.note: da attacchi non magici
languages: Aquan
traits.0.name: Forma d'acqua
traits.0.text: L'elementale può entrare nello spazio di una creatura ostile e soffermarvisi. Può muoversi attraverso uno spazio stretto fino a 2,5 centimetri senza doversi stringere.
traits.1.name: Congelamento
traits.1.text: Se l'elementale subisce danni da freddo, si congela parzialmente; la sua velocità è ridotta di 6 metri fino alla fine del suo turno successivo.
actions.0.name: Multiattacco
actions.0.text: L'elementale effettua due attacchi con schianto.
actions.0.multiattack.0.action: Schianto
actions.1.name: Schianto
actions.1.text: "Attacco con arma da mischia: +7 al tiro per colpire, portata 1,5 m, un bersaglio. Colpito: 13 (2d8 + 4) danni contundenti."
actions.2.name: Sommergere
actions.2.text: |-
  Ogni creatura nello spazio dell'elementale deve effettuare un tiro salvezza su Forza con CD 15; se lo fallisce, subisce 13 (2d8 + 4) danni contundenti. Se la creatura è di taglia Grande o inferiore, viene anche afferrata (CD 14 per sfuggire). Finché la presa perdura, il bersaglio è trattenuto e non può respirare a meno che non riesca a respirare in acqua. Se il bersaglio supera il tiro salvezza, viene spinto fuori dallo spazio dell'elementale.
  L'elementale può afferrare una creatura Grande o un massimo di due creature Medie o di taglia inferiore contemporaneamente tramite questa capacità. All'inizio di ogni turno dell'elementale, ogni bersaglio afferrato subisce 13 (2d8 + 4) danni contundenti. Con un'azione, una creatura entro 1,5 metri dall'elementale può tirare fuori da esso una creatura o un oggetto effettuando con successo una prova di Forza con CD 14.
