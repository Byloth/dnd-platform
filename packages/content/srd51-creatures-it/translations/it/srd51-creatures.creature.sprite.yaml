name: Spiritello
alignment: neutrale buono
armorClass.0.note: armatura di cuoio
languages: Comune, Elfico, Silvano
actions.0.name: Spada lunga
actions.0.text: "Attacco con arma da mischia: +2 al tiro per colpire, portata 1,5 m, un bersaglio. Colpito: 1 danno tagliente."
actions.1.name: Arco corto
actions.1.text: "Attacco con arma a distanza: +6 al tiro per colpire, gittata 12/48 m, un bersaglio. Colpito: 1 danno perforante e il bersaglio deve superare un tiro salvezza su Costituzione con CD 10, altrimenti è avvelenato per 1 minuto. Se il risultato del tiro salvezza è pari o inferiore a 5, il bersaglio avvelenato perde conoscenza ed è privo di sensi per la stessa durata, finché non subisce danni o finché un'altra creatura non usa un'azione per risvegliarlo scuotendolo."
actions.2.name: Vista del cuore
actions.2.text: Lo spiritello tocca una creatura e capisce magicamente il suo stato emotivo attuale. Se il bersaglio fallisce un tiro salvezza su Carisma con CD 10, lo spiritello apprende anche l'allineamento della creatura. I celestiali, gli immondi e i non morti falliscono automaticamente il tiro salvezza.
actions.3.name: Invisibilità
actions.3.text: Lo spiritello diventa magicamente invisibile finché non attacca, non lancia un incantesimo o finché non perde la concentrazione (come se si concentrasse su un incantesimo). Ogni oggetto che lo spiritello indossa o trasporta diventa invisibile insieme a lui.
