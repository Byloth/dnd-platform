name: Lupo invernale
text: Il lupo invernale, una creatura che infesta i territori artici, è grande quanto un lupo feroce, ma ha la pelliccia bianca come la neve e gli occhi azzurri. I giganti del gelo usano queste creature malvagie come guardie e bestie da caccia, sfruttando il loro soffio letale contro gli avversari. I lupi invernali comunicano tra loro usando latrati e ringhi, ma parlano il Comune e il Gigante quanto basta per partecipare alle conversazioni più semplici.
alignment: neutrale malvagio
armorClass.0.note: armatura naturale
languages: Comune, Gigante, Lupo Invernale
traits.0.name: Udito e olfatto acuti
traits.0.text: Il lupo dispone di vantaggio alle prove di Saggezza (Percezione) basate sull'olfatto o sull'udito.
traits.1.name: Tattiche del branco
traits.1.text: Il lupo dispone di vantaggio nel tiro per colpire contro una creatura se almeno uno degli alleati dell'animale si trova entro 1,5 metri dalla creatura e non è incapacitato.
traits.2.name: Mimetismo sulla neve
traits.2.text: Il lupo dispone di vantaggio alle prove di Destrezza (Furtività) effettuate per nascondersi nei terreni innevati.
actions.0.name: Morso
actions.0.text: "Attacco con arma da mischia: +6 al tiro per colpire, portata 1,5 m, un bersaglio. Colpito: 11 (2d6 + 4) danni perforanti. Se il bersaglio è una creatura, deve superare un tiro salvezza su Forza con CD 14, altrimenti cade a terra prono."
actions.1.name: Soffio di freddo
actions.1.text: Il lupo esala una folata di vento gelido in un cono di 4,5 metri. Ogni creatura in quell'area deve effettuare un tiro salvezza su Destrezza con CD 12, subendo 18 (4d8) danni da freddo in caso di fallimento, o la metà dei danni in caso di successo.
