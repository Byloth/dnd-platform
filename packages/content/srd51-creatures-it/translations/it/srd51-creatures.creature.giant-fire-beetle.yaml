name: Scarabeo di fuoco gigante
text: Uno scarabeo di fuoco gigante è una creatura notturna che trae il suo nome da un paio di ghiandole fosforescenti che emanano luce. I minatori e gli avventurieri danno grande valore a queste creature, in quanto le ghiandole di uno scarabeo di fuoco gigante continuano a proiettare luce per 1d6 giorni dopo la morte dello scarabeo. Questi animali sono diffusi soprattutto sottoterra e nelle foreste più buie.
alignment: senza allineamento
armorClass.0.note: armatura naturale
traits.0.name: Illuminazione
traits.0.text: Lo scarabeo proietta luce intensa in un raggio di 3 metri e luce fioca per altri 3 metri.
actions.0.name: Morso
actions.0.text: "Attacco con arma da mischia: +1 al tiro per colpire, portata 1,5 m, un bersaglio. Colpito: 2 (1d6 - 1) danni taglienti."
