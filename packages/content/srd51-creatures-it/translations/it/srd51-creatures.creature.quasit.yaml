name: Quasit
alignment: caotico malvagio
resistances.3.note: da attacchi non magici
languages: Abissale, Comune
traits.0.name: Mutaforma
traits.0.text: Il quasit può usare la sua azione per assumere la forma bestiale di un pipistrello (velocità 3 m, volare 12 m), di un millepiedi (12 m, scalare 12 m) o di un rospo (12 m, nuotare 12 m) oppure riassumere la sua vera forma. Le sue statistiche restano le stesse in ogni forma, a eccezione dei cambiamenti di velocità menzionati. Ogni oggetto che indossa o trasporta non viene trasformato. Se muore, torna alla sua forma naturale.
traits.1.name: Resistenza alla magia
traits.1.text: Il quasit dispone di vantaggio ai tiri salvezza contro incantesimi e altri effetti magici.
actions.0.name: Artigli (morso in forma bestiale)
actions.0.text: "Attacco con arma da mischia: +4 al tiro per colpire, portata 1,5 m, un bersaglio. Colpito: 5 (1d4 + 3) danni perforanti e il bersaglio deve superare un tiro salvezza su Costituzione con CD 10, altrimenti subisce 5 (2d4) danni da veleno e diventa avvelenato per 1 minuto. Il bersaglio può ripetere il tiro salvezza alla fine di ogni suo turno e, se lo supera, l'effetto svanisce."
actions.1.name: Spaventare
actions.1.text: "Una creatura a scelta del quasit e situata entro 6 metri da lui deve superare un tiro salvezza su Saggezza con CD 10, altrimenti è spaventata per 1 minuto. Il bersaglio può ripetere il tiro salvezza alla fine di ogni suo turno, subendo svantaggio se il quasit si trova entro il suo campo visivo: se il bersaglio lo supera, l'effetto svanisce."
actions.2.name: Invisibilità
actions.2.text: Il quasit diventa magicamente invisibile finché non attacca, non usa Spaventare o finché non perde la concentrazione (come se si concentrasse su un incantesimo). Gli oggetti che il quasit indossa o trasporta diventano invisibili insieme a lui.
forms.0.name: Quasit
forms.1.name: Pipistrello
forms.2.name: Millepiedi
forms.3.name: Rospo
