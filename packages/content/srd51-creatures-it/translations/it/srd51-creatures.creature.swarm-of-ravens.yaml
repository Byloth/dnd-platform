name: Sciame di corvi
alignment: senza allineamento
traits.0.name: Sciame
traits.0.text: Lo sciame può occupare lo spazio di un'altra creatura e viceversa, e può muoversi attraverso qualsiasi apertura abbastanza grande per un corvo Minuscolo. Lo sciame non può recuperare punti ferita, né ottenere punti ferita temporanei.
actions.0.name: Becchi
actions.0.text: "Attacco con arma da mischia: +4 al tiro per colpire, portata 1,5 m, un bersaglio nello spazio dello sciame. Colpito: 7 (2d6) danni perforanti o 3 (1d6) danni perforanti se lo sciame possiede la metà dei suoi punti ferita o meno."
