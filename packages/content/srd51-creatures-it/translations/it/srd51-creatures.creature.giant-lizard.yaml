name: Lucertola gigante
text: Una lucertola gigante può essere cavalcata o usata come bestia da soma. I lucertoloidi le usano anche come animali da compagnia. Le varianti sotterranee sono invece usate come cavalcature e bestie da soma da drow, duergar e altri.
alignment: senza allineamento
armorClass.0.note: armatura naturale
actions.0.name: Morso
actions.0.text: "Attacco con arma da mischia: +4 al tiro per colpire, portata 1,5 m, un bersaglio. Colpito: 6 (1d8 + 2) danni perforanti."
