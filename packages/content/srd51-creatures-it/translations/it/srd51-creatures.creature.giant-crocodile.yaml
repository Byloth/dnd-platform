name: Coccodrillo gigante
alignment: senza allineamento
armorClass.0.note: armatura naturale
traits.0.name: Apnea
traits.0.text: Il coccodrillo può trattenere il respiro per 30 minuti.
actions.0.name: Multiattacco
actions.0.text: "Il coccodrillo effettua due attacchi: uno con il morso e uno con la coda."
actions.0.multiattack.0.action: Morso
actions.0.multiattack.1.action: Coda
actions.1.name: Morso
actions.1.text: "Attacco con arma da mischia: +8 al tiro per colpire, portata 1,5 m, un bersaglio. Colpito: 21 (3d10 + 5) danni perforanti e il bersaglio è afferrato (CD 16 per sfuggire). Finché la presa perdura, il bersaglio viene trattenuto e il coccodrillo non può morderne un altro."
actions.2.name: Coda
actions.2.text: "Attacco con arma da mischia: +8 al tiro per colpire, portata 3 m, un bersaglio non afferrato dal coccodrillo. Colpito: 14 (2d8 + 5) danni contundenti. Se il bersaglio è una creatura, deve superare un tiro salvezza su Forza con CD 16, altrimenti cade a terra prono."
