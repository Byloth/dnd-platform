name: Accolito
text: Gli accoliti sono i membri più giovani di un clericato, solitamente al servizio di un sacerdote. Svolgono varie funzioni all'interno di un tempio e ricevono alcuni poteri minori come incantatori dalle loro divinità.
alignment: qualsiasi allineamento
languages: uno qualsiasi (di solito Comune)
traits.0.name: Incantesimi
traits.0.text: |-
  L'accolito è un incantatore di 1° livello: la sua caratteristica da incantatore è Saggezza (CD del tiro salvezza sull'incantesimo 12, +4 al tiro per colpire con attacco con incantesimo). L'accolito ha a disposizione i seguenti incantesimi da chierico:

  - Trucchetti (a volontà): fiamma sacra, luce, taumaturgia
  - 1° livello (3 slot): benedizione, cura ferite, santuario
actions.0.name: Randello
actions.0.text: "Attacco con arma da mischia: +2 al tiro per colpire, portata 1,5 m, un bersaglio. Colpito: 2 (1d4) danni contundenti."
