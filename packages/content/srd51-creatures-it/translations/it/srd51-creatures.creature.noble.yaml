name: Nobile
text: |-
  I **nobili** esercitano grande autorità e influenza come membri della classe agiata, dal momento che possiedono ricchezza e contatti che possono renderli potenti quanto monarchi e generali. Un nobile viaggia spesso in compagnia di guardie, oltre che di servitori popolani.

  Le statistiche del nobile possono anche essere usate per rappresentare **cortigiani** con origini non nobili.
alignment: qualsiasi allineamento
armorClass.0.note: corazza
languages: due qualsiasi
actions.0.name: Stocco
actions.0.text: "Attacco con arma da mischia: +3 al tiro per colpire, portata 1,5 m, un bersaglio. Colpito: 5 (1d8 + 1) danni perforanti."
reactions.0.name: Parata
reactions.0.text: Il nobile aggiunge 2 alla sua CA contro un attacco in mischia che lo colpirebbe. Per farlo, deve vedere l'attaccante e deve impugnare un'arma da mischia.
