name: Cinghiale mannaro
alignment: neutrale malvagio
immunities.0.note: da attacchi non magici con armi non argentate
traits.0.name: Mutaforma
traits.0.text: Il cinghiale mannaro può usare la sua azione per trasformarsi in un ibrido umanoide-cinghiale o in un cinghiale, o per tornare alla sua forma naturale, che è umanoide. Le sue statistiche, a eccezione della CA, restano le stesse in ogni forma. Ogni oggetto che indossa o trasporta non viene trasformato. Se muore, torna alla sua forma naturale.
traits.1.name: Carica (solo in forma di cinghiale o ibrida)
traits.1.text: Se il cinghiale mannaro si muove di almeno 4,5 metri in linea retta verso un bersaglio e poi lo colpisce con le zanne nello stesso turno, il bersaglio subisce 7 (2d6) danni taglienti extra. Se il bersaglio è una creatura, deve superare un tiro salvezza su Forza con CD 13, altrimenti cade a terra prono.
traits.2.name: Implacabile
traits.2.text: Se il cinghiale mannaro subisce 14 o meno danni che lo porterebbero a 0 punti ferita, è ridotto invece a 1 punto ferita.
actions.0.name: Multiattacco (solo in forma umanoide o ibrida)
actions.0.text: Il cinghiale mannaro effettua due attacchi, di cui solo uno può essere con le zanne.
actions.0.multiattack.0.action: Dilaniare (solo in forma umanoide o ibrida)
actions.1.name: Dilaniare (solo in forma umanoide o ibrida)
actions.1.text: "Attacco con arma da mischia: +5 al tiro per colpire, portata 1,5 m, un bersaglio. Colpito: 10 (2d6 + 3) danni contundenti."
actions.2.name: Zanne (solo in forma di cinghiale o ibrida)
actions.2.text: "Attacco con arma da mischia: +5 al tiro per colpire, portata 1,5 m, un bersaglio. Colpito: 10 (2d6 + 3) danni taglienti. Se il bersaglio è un umanoide, deve superare un tiro salvezza su Costituzione con CD 12, altrimenti è costretto a trasformarsi in un cinghiale mannaro."
forms.0.name: Umano
forms.1.name: Cinghiale
forms.1.armorClass.0.note: armatura naturale
forms.2.name: Ibrido
forms.2.armorClass.0.note: armatura naturale
languages: Comune (non può parlare in forma di cinghiale)
