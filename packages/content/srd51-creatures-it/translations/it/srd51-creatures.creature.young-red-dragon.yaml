name: Drago rosso giovane
alignment: caotico malvagio
armorClass.0.note: armatura naturale
languages: Comune, Draconico
actions.0.name: Multiattacco
actions.0.text: "Il drago effettua tre attacchi: uno con il morso e due con gli artigli."
actions.0.multiattack.0.action: Morso
actions.0.multiattack.1.action: Artiglio
actions.1.name: Morso
actions.1.text: "Attacco con arma da mischia: +10 al tiro per colpire, portata 3 m, un bersaglio. Colpito: 17 (2d10 + 6) danni perforanti più 3 (1d6) danni da fuoco."
actions.2.name: Artiglio
actions.2.text: "Attacco con arma da mischia: +10 al tiro per colpire, portata 1,5 m, un bersaglio. Colpito: 13 (2d6 + 6) danni taglienti."
actions.3.name: Soffio di fuoco
actions.3.text: Il drago esala fuoco in un cono di 9 metri. Ogni creatura in quell'area deve effettuare un tiro salvezza su Destrezza con CD 17, subendo 56 (16d6) danni da fuoco in caso di fallimento, o la metà dei danni in caso di successo.
