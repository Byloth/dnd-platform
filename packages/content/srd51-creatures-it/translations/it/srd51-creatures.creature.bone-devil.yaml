name: Diavolo d'ossa
alignment: legale malvagio
armorClass.0.note: armatura naturale
resistances.1.note: da attacchi non magici non argentati
languages: Infernale, telepatia 36 m
traits.0.name: Vista del diavolo
traits.0.text: L'oscurità magica non ostacola la scurovisione del diavolo.
traits.1.name: Resistenza alla magia
traits.1.text: Il diavolo dispone di vantaggio ai tiri salvezza contro incantesimi e altri effetti magici.
actions.0.name: Multiattacco
actions.0.text: "Il diavolo effettua tre attacchi: due con gli artigli e uno con il pungiglione."
actions.0.multiattack.0.action: Artiglio
actions.0.multiattack.1.action: Pungiglione
actions.1.name: Artiglio
actions.1.text: "Attacco con arma da mischia: +8 al tiro per colpire, portata 3 m, un bersaglio. Colpito: 8 (1d8 + 4) danni taglienti."
actions.2.name: Pungiglione
actions.2.text: "Attacco con arma da mischia: +8 al tiro per colpire, portata 3 m, un bersaglio. Colpito: 13 (2d8 + 4) danni perforanti più 17 (5d6) danni da veleno e il bersaglio deve superare un tiro salvezza su Costituzione con CD 14, altrimenti è avvelenato per 1 minuto. Il bersaglio può ripetere il tiro salvezza alla fine di ogni suo turno e, se lo supera, l'effetto svanisce."
