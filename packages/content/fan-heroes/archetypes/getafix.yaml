why:
  class:
    en: 'The druid himself: the golden sickle and the herbalism kit are a druid''s own.'
  species:
    en: A human, a wise old man of the village.
  subclass:
    en: 'The Circle of the Land (level 2), the forest: the spells of the woods he knows.'
