    en: 'A wizard copies every spell found into the spellbook: a thousand years of collecting.'
  species:
    en: 'A high elf: she lives for centuries, and knows one more cantrip.'
  subclass:
    en: 'The School of Evocation (level 2): Zoltraak, the killing magic, is an evocation.'
  background:
    en: A sage, or a collector of spells of her own.
  abilityPriority:
    en: Intelligence for the wizard's magic.
path:
- level: 1
  text:
    en: 'Magic Missile: Zoltraak, a magic that never misses.'
- level: 1
  text:
    en: 'Detect Magic: she feels the mana of everyone around.'
- level: 2
  text:
    en: Arcane Recovery, and a spellbook that only grows.
