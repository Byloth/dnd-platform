  subspecies: srd51.species.elf.high-elf
  class: srd51.class.wizard
  subclass: srd51.subclass.wizard.school-of-evocation
  prefer:
    background:
    - phb14.background.sage
  customBackground:
    name:
      en: Collector of spells
    skills:
    - nature
    - investigation
    tools:
    - calligraphers-supplies
    languages:
    - draconic
    feature: srd51.feature.acolyte.shelter-of-the-faithful
    equipment: srd51.background.acolyte
  abilityPriority:
  - int
  - con
  - dex
  - wis
  - cha
  - str
