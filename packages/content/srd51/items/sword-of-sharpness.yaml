        filter:
          item: srd51.item.sword-of-sharpness
        set:
          magical: true
        note:
          en: Any sword that deals slashing damage; this item carries no base weapon properties of its own. When you hit an object with it, maximize your weapon damage dice against the target.
  - id: srd51.feature.item.sword-of-sharpness.sharpness
    name:
      en: Sharpness
    effects:
      - kind: add-action
        action: sharpness
        name:
          en: Sharpness
        activation: special
        trigger:
