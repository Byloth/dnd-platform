    name:
      en: Robe of Stars
    effects:
      - kind: modify
        target: save.all
        op: add
        value: 1
  - id: srd51.feature.item.robe-of-stars.stars
    name:
      en: Stars
    effects:
      - kind: grant-spells
        spells:
