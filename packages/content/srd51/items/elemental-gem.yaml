id: srd51.item.elemental-gem
name:
  en: Elemental Gem
source: srd51
text:
  en: |-
    Wondrous item, uncommon

    This gem contains a mote of elemental energy. When you use an action to break the gem, an elemental is summoned as if you had cast the conjure elemental spell, and the gem's magic is lost. The type of gem determines the elemental summoned by the spell.

    | Gem | Summoned Elemental |

    |---|---|

    | Blue sapphire | Air elemental |

    | Yellow diamond | Earth elemental |

    | Red corundum | Fire elemental |

    | Emerald | Water elemental |
type: wondrous
magical: true
rarity: uncommon
tags:
  - magic-item
  - wondrous-items
onUse:
  - kind: note
    text:
      en: "Break the gem as an action: an elemental is summoned as if you had cast the conjure elemental spell, and the gem's magic is lost. The gem's type determines the elemental: blue sapphire (air), yellow diamond (earth), red corundum (fire), emerald (water)."
