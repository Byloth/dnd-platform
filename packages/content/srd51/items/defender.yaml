          damageBonus: 3
          magical: true
      - kind: add-action
        action: defender-transfer-bonus
        name:
          en: Transfer the sword's bonus to AC
        activation: free
        text:
          en: The first time you attack with the sword on each of your turns, you can transfer some or all of the sword's +3 bonus to your Armor Class instead of using it on attacks that turn (for example, +1 to attack and damage rolls and +2 to AC). The adjusted bonuses remain until the start of your next turn; you must hold the sword to gain the AC bonus.
