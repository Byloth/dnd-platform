          against:
            - spells that target only you (not in an area of effect)
      - kind: add-text
        section: features
        text:
          en: '"If you roll a 20 on such a save and the spell is 7th level or lower, the spell has no effect on you and instead targets the caster, using the slot level, spell save DC, attack bonus and spellcasting ability of the caster."'
