id: srd51.item.cloak-of-the-bat
name:
  en: Cloak of the Bat
source: srd51
text:
  en: |-
    Wondrous item, rare (requires attunement)

    While wearing this cloak, you have advantage on Dexterity (Stealth) checks. In an area of dim light or darkness, you can grip the edges of the cloak with both hands and use it to fly at a speed of 40 feet. If you ever fail to grip the cloak's edges while flying in this way, or if you are no longer in dim light or darkness, you lose this flying speed.

    While wearing the cloak in an area of dim light or darkness, you can use your action to cast polymorph on yourself, transforming into a bat. While you are in the form of the bat, you retain your Intelligence, Wisdom, and Charisma scores. The cloak can't be used this way again until the next dawn.
type: wondrous
magical: true
rarity: rare
attunement: true
tags:
  - magic-item
  - wondrous-items
features:
  - id: srd51.feature.item.cloak-of-the-bat.benefits
    name:
      en: Cloak of the Bat
    effects:
      - kind: roll-advantage
        on:
          type: check
          skill: stealth
      - kind: add-action
        action: grip-cloak-of-the-bat
        name:
          en: Grip the cloak's edges to fly
        activation: free
        toggle:
          state: cloak-of-the-bat-flying
          expires:
            manual: true
        text:
          en: In an area of dim light or darkness, you can grip the edges of the cloak with both hands and use it to fly at a speed of 40 feet. If you fail to grip the cloak's edges while flying this way, or if you are no longer in dim light or darkness, you lose this flying speed.
      - kind: modify
        target: speed.fly
        op: min
        value: 40
        when:
          toggled: cloak-of-the-bat-flying
        note:
          en: Only in dim light or darkness, while gripping the cloak's edges with both hands.
      - kind: grant-spells
        spells:
          - srd51.spell.polymorph
        as: always-prepared
        uses:
          count: 1
          recharge: dawn
        note:
          en: Cast on yourself as an action, only in dim light or darkness, transforming into a bat; you retain your Intelligence, Wisdom, and Charisma scores.
