            action: countercharm
            name:
              en: Countercharm
            activation: action
            toggle:
              state: countercharm
              expires:
                until: next-turn-end
            text:
              en: As an action, you can start a performance that lasts until the end of your next turn. During that time, you and any friendly creatures within 30 feet of you have advantage on saving throws against being frightened or charmed. A creature must be able to hear you to gain this benefit. The performance ends early if you are incapacitated or silenced or if you voluntarily end it (no action required).
            onUse:
              - kind: note
                text:
                  en: Friendly creatures within 30 feet who can hear you share the advantage.
          - kind: roll-advantage
            on:
              type: save
              against:
                - being charmed
                - being frightened
            when:
              toggled: countercharm
