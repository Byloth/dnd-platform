# Generated by tools/import (map stage) from the SRD 5.1 datasets pinned in tools/import/sources.lock.yaml.
# Mechanics come from tools/import/overlay/<entity-id>.yaml; edit those, then re-run `node tools/import/src/map.ts`.
id: srd51.class.fighter
name:
  en: Fighter
source: srd51
hitDie: 10
savingThrows:
  - str
  - con
proficiencies:
  armor:
    - light
    - medium
    - heavy
    - shield
  weapons:
    - simple
    - martial
  skills:
    choose: 2
    from:
      - acrobatics
      - animal-handling
      - athletics
      - history
      - insight
      - intimidation
      - perception
      - survival
startingEquipment:
  fixed: []
  choices:
    - options:
        - - item: srd51.item.chain-mail
        - - item: srd51.item.leather-armor
          - item: srd51.item.longbow
          - item: srd51.item.arrow
            quantity: 20
    - options:
        - - filter:
              weapon: martial
          - item: srd51.item.shield
        - - filter:
              weapon: martial
            quantity: 2
    - options:
        - - item: srd51.item.crossbow-light
          - item: srd51.item.crossbow-bolt
            quantity: 20
        - - item: srd51.item.handaxe
            quantity: 2
    - options:
        - - item: srd51.item.dungeoneers-pack
        - - item: srd51.item.explorers-pack
multiclass:
  proficiencies:
    armor:
      - light
      - medium
      - shield
    weapons:
      - simple
      - martial
subclassLevel: 3
subclassChoice: martial-archetype
casterWeight: 0
levels:
  "1":
    features:
      - id: srd51.feature.fighter.fighting-style
        name:
          en: Fighting Style
        source: srd51
        text:
          en: |-
            You adopt a particular style of fighting as your specialty. Choose one of the following options. You can't take a Fighting Style option more than once, even if you later get to choose again.

            ###Archery

            You gain a +2 bonus to attack rolls you make with ranged weapons.

            ###Defense

            While you are wearing armor, you gain a +1 bonus to AC.

            ###Dueling

            When you are wielding a melee weapon in one hand and no other weapons, you gain a +2 bonus to damage rolls with that weapon.

            ###Great Weapon Fighting

            When you roll a 1 or 2 on a damage die for an attack you make with a melee weapon that you are wielding with two hands, you can reroll the die and must use the new roll, even if the new roll is a 1 or a 2. The weapon must have the two-handed or versatile property for you to gain this benefit.

            ###Protection

            When a creature you can see attacks a target other than you that is within 5 feet of you, you can use your reaction to impose disadvantage on the attack roll. You must be wielding a shield.

            ###Two-Weapon Fighting

            When you engage in two-weapon fighting, you can add your ability modifier to the damage of the second attack.
        effects:
          - kind: open-choice
            choice: fighting-style
            of: fighting-style
            count: 1
            options:
              - id: archery
                name:
                  en: Archery
                text:
                  en: You gain a +2 bonus to attack rolls you make with ranged weapons.
                effects:
                  - kind: modify
                    target: attack.ranged.bonus
                    op: add
                    value: 2
              - id: defense
                name:
                  en: Defense
                text:
                  en: While you are wearing armor, you gain a +1 bonus to AC.
                effects:
                  - kind: modify
                    target: ac
                    op: add
                    value: 1
                    when:
                      not:
                        armorCategory: none
              - id: dueling
                name:
                  en: Dueling
                text:
                  en: When you are wielding a melee weapon in one hand and no other weapons, you gain a +2 bonus to damage rolls with that weapon.
                effects:
                  - kind: modify-attacks
                    filter:
                      melee: true
                    set:
                      damageBonus: 2
                    when:
                      wieldingOnly:
                        melee: true
                        count: 1
              - id: great-weapon-fighting
                name:
                  en: Great Weapon Fighting
                text:
                  en: When you roll a 1 or 2 on a damage die for an attack you make with a melee weapon that you are wielding with two hands, you can reroll the die and must use the new roll, even if the new roll is a 1 or a 2. The weapon must have the two-handed or versatile property for you to gain this benefit.
                effects:
                  - kind: add-text
                    section: attacks
                    text:
                      en: "Great Weapon Fighting: when you roll a 1 or 2 on a damage die with a melee weapon wielded in two hands (two-handed or versatile), reroll the die and use the new roll."
                    note:
                      en: "Play mode: rerolling individual damage dice of 1 or 2 is not executed by the engine."
              - id: protection
                name:
                  en: Protection
                text:
                  en: When a creature you can see attacks a target other than you that is within 5 feet of you, you can use your reaction to impose disadvantage on the attack roll. You must be wielding a shield.
                effects:
                  - kind: add-action
                    action: protection
                    name:
                      en: Protection
                    activation: reaction
                    trigger:
                      en: when a creature you can see attacks a target other than you that is within 5 feet of you
                    requires:
                      condition:
                        shield: true
                    text:
                      en: Impose disadvantage on the attack roll. You must be wielding a shield.
              - id: two-weapon-fighting
                name:
                  en: Two-Weapon Fighting
                text:
                  en: When you engage in two-weapon fighting, you can add your ability modifier to the damage of the second attack.
                effects:
                  - kind: add-text
                    section: attacks
                    text:
                      en: "Two-Weapon Fighting: when you engage in two-weapon fighting, add your ability modifier to the damage of the second attack."
                    note:
                      en: "Play mode: the off-hand attack's damage modifier is not derived by the engine."
      - id: srd51.feature.fighter.second-wind
        name:
          en: Second Wind
        source: srd51
        text:
          en: You have a limited well of stamina that you can draw on to protect yourself from harm. On your turn, you can use a bonus action to regain hit points equal to 1d10 + your fighter level. Once you use this feature, you must finish a short or long rest before you can use it again.
        effects:
          - kind: declare-resource
            resource: second-wind
            name:
              en: Second Wind
            max: 1
            display: pips
            recharge:
              - on: short-rest
                amount: full
              - on: long-rest
                amount: full
          - kind: add-action
            action: second-wind
            name:
              en: Second Wind
            activation: bonus-action
            cost:
              - resource: second-wind
                amount: 1
            text:
              en: On your turn, you can use a bonus action to regain hit points equal to 1d10 + your fighter level.
            onUse:
              - kind: heal
                amount: 1d10 + classLevel(fighter)
                target: self
  "2":
    features:
      - id: srd51.feature.fighter.action-surge
        name:
          en: Action Surge
        source: srd51
        text:
          en: |-
            Starting at 2nd level, you can push yourself beyond your normal limits for a moment. On your turn, you can take one additional action on top of your regular action and a possible bonus action.

            Once you use this feature, you must finish a short or long rest before you can use it again. Starting at 17th level, you can use it twice before a rest, but only once on the same turn.
        effects:
          - kind: declare-resource
            resource: action-surge
            name:
              en: Action Surge
            max: table(fighter.action-surges)
            display: pips
            recharge:
              - on: short-rest
                amount: full
              - on: long-rest
                amount: full
          - kind: add-action
            action: action-surge
            name:
              en: Action Surge
            activation: free
            cost:
              - resource: action-surge
                amount: 1
            text:
              en: On your turn, you can take one additional action on top of your regular action and a possible bonus action. Starting at 17th level, you can use it twice before a rest, but only once on the same turn.
            onUse:
              - kind: note
                text:
                  en: Take one additional action this turn. Only one use per turn.
  "3":
    features:
      - id: srd51.feature.fighter.martial-archetype
        name:
          en: Martial Archetype
        source: srd51
        text:
          en: At 3rd level, you choose an archetype that you strive to emulate in your combat styles and techniques, such as Champion. The archetype you choose grants you features at 3rd level and again at 7th, 10th, 15th, and 18th level.
    choices:
      - id: martial-archetype
        of: subclass
  "4":
    features:
      - id: srd51.feature.fighter.ability-score-improvement
        name:
          en: Ability Score Improvement
        source: srd51
        text:
          en: When you reach 4th level, and again at 6th, 8th, 12th, 14th, 16th, and 19th level, you can increase one ability score of your choice by 2, or you can increase two ability scores of your choice by 1. As normal, you can't increase an ability score above 20 using this feature.
    choices:
      - id: asi-4
        of: asi-or-feat
  "5":
    features:
      - id: srd51.feature.fighter.extra-attack
        name:
          en: Extra Attack
        source: srd51
        text:
          en: |-
            Beginning at 5th level, you can attack twice, instead of once, whenever you take the Attack action on your turn.

            The number of attacks increases to three when you reach 11th level in this class and to four when you reach 20th level in this class.
        effects:
          - kind: modify
            target: attacks.perAction
            op: set
            formula: 1 + table(fighter.extra-attacks)
            note:
              en: Two attacks at 5th level, three at 11th and four at 20th level in this class.
  "6":
    choices:
      - id: asi-6
        of: asi-or-feat
  "8":
    choices:
      - id: asi-8
        of: asi-or-feat
  "9":
    features:
      - id: srd51.feature.fighter.indomitable
        name:
          en: Indomitable
        source: srd51
        text:
          en: |-
            Beginning at 9th level, you can reroll a saving throw that you fail. If you do so, you must use the new roll, and you can't use this feature again until you finish a long rest.

            You can use this feature twice between long rests starting at 13th level and three times between long rests starting at 17th level.
        effects:
          - kind: declare-resource
            resource: indomitable
            name:
              en: Indomitable
            max: table(fighter.indomitable-uses)
            display: pips
            recharge:
              - on: long-rest
                amount: full
          - kind: add-action
            action: indomitable
            name:
              en: Indomitable
            activation: free
            cost:
              - resource: indomitable
                amount: 1
            trigger:
              en: when you fail a saving throw
            text:
              en: Reroll a saving throw that you fail. You must use the new roll.
            onUse:
              - kind: reroll
                roll: save
                keep: new
  "12":
    choices:
      - id: asi-12
        of: asi-or-feat
  "14":
    choices:
      - id: asi-14
        of: asi-or-feat
  "16":
    choices:
      - id: asi-16
        of: asi-or-feat
  "19":
    choices:
      - id: asi-19
        of: asi-or-feat
tables:
  action-surges:
    by: classLevel
    rows:
      "1": 0
      "2": 1
      "17": 2
  indomitable-uses:
    by: classLevel
    rows:
      "1": 0
      "9": 1
      "13": 2
      "17": 3
  extra-attacks:
    by: classLevel
    rows:
      "1": 0
      "5": 1
      "11": 2
      "20": 3
