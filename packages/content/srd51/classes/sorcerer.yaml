id: srd51.class.sorcerer
name:
  en: Sorcerer
source: srd51
hitDie: 6
savingThrows:
  - con
  - cha
proficiencies:
  weapons:
    - dagger
    - dart
    - sling
    - quarterstaff
    - light-crossbow
  skills:
