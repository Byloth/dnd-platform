subclassLevel: 3
subclassChoice: primal-path
casterWeight: 0
levels:
  "1":
    features:
      - id: srd51.feature.barbarian.rage
        name:
          en: Rage
        source: srd51
        text:
          en: |-
            In battle, you fight with primal ferocity. On your turn, you can enter a rage as a bonus action.

            While raging, you gain the following benefits if you aren't wearing heavy armor:

            * You have advantage on Strength checks and Strength saving throws.
            * When you make a melee weapon attack using Strength, you gain a bonus to the damage roll that increases as you gain levels as a barbarian, as shown in the Rage Damage column of the Barbarian table.
            * You have resistance to bludgeoning, piercing, and slashing damage. 

            If you are able to cast spells, you can't cast them or concentrate on them while raging.

            Your rage lasts for 1 minute. It ends early if you are knocked unconscious or if your turn ends and you haven't attacked a hostile creature since your last turn or taken damage since then. You can also end your rage on your turn as a bonus action.

            Once you have raged the number of times shown for your barbarian level in the Rages column of the Barbarian table, you must finish a long rest before you can rage again.
      - id: srd51.feature.barbarian.unarmored-defense
        name:
          en: Unarmored Defense
        source: srd51
        text:
          en: While you are not wearing any armor, your Armor Class equals 10 + your Dexterity modifier + your Constitution modifier. You can use a shield and still gain this benefit.
  "2":
    features:
      - id: srd51.feature.barbarian.danger-sense
        name:
          en: Danger Sense
        source: srd51
        text:
          en: |-
            At 2nd level, you gain an uncanny sense of when things nearby aren’t as they should be, giving you an edge when you dodge away from danger.

            You have advantage on Dexterity saving throws against effects that you can see, such as traps and spells. To gain this benefit, you can’t be blinded, deafened, or incapacitated.
      - id: srd51.feature.barbarian.reckless-attack
        name:
          en: Reckless Attack
        source: srd51
        text:
          en: Starting at 2nd level, you can throw aside all concern for defense to attack with fierce desperation. When you make your first attack on your turn, you can decide to attack recklessly. Doing so gives you advantage on melee weapon attack rolls using Strength during this turn, but attack rolls against you have advantage until your next turn.
  "3":
    features:
      - id: srd51.feature.barbarian.primal-path
        name:
          en: Primal Path
        source: srd51
        text:
          en: At 3rd level, you choose a path that shapes the nature of your rage. Choose the Path of the Berserker or the Path of the Totem Warrior, both detailed at the end of the class description. Your choice grants you features at 3rd level and again at 6th, 10th, and 14th levels.
        effects:
          - kind: open-choice
            choice: primal-path
            of: subclass
            count: 1
            level: 3
  "4":
    features:
      - id: srd51.feature.barbarian.ability-score-improvement
        name:
          en: Ability Score Improvement
        source: srd51
        text:
          en: When you reach 4th level, and again at 8th, 12th, 16th, and 19th level, you can increase one ability score of your choice by 2, or you can increase two ability scores of your choice by 1. As normal, you can’t increase an ability score above 20 using this feature.
    choices:
      - id: asi-4
        of: asi-or-feat
  "5":
    features:
      - id: srd51.feature.barbarian.extra-attack
        name:
          en: Extra Attack
        source: srd51
        text:
          en: Beginning at 5th level, you can attack twice, instead of once, whenever you take the Attack action on your turn.
      - id: srd51.feature.barbarian.fast-movement
        name:
          en: Fast Movement
        source: srd51
        text:
          en: Starting at 5th level, your speed increases by 10 feet while you aren’t wearing heavy armor.
  "7":
    features:
      - id: srd51.feature.barbarian.feral-instinct
        name:
          en: Feral Instinct
        source: srd51
        text:
          en: |-
            By 7th level, your instincts are so honed that you have advantage on initiative rolls.

            Additionally, if you are surprised at the beginning of combat and aren’t incapacitated, you can act normally on your first turn, but only if you enter your rage before doing anything else on that turn.
  "8":
    choices:
      - id: asi-8
        of: asi-or-feat
  "9":
    features:
      - id: srd51.feature.barbarian.brutal-critical
        name:
          en: Brutal Critical
        source: srd51
        text:
          en: |-
            Beginning at 9th level, you can roll one additional weapon damage die when determining the extra damage for a critical hit with a melee attack.

            This increases to two additional dice at 13th level and three additional dice at 17th level.
  "11":
    features:
      - id: srd51.feature.barbarian.relentless-rage
        name:
          en: Relentless Rage
        source: srd51
        text:
          en: |-
            Starting at 11th level, your rage can keep you fighting despite grievous wounds. If you drop to 0 hit points while you’re raging and don’t die outright, you can make a DC 10 Constitution saving throw. If you succeed, you drop to 1 hit point instead.

            Each time you use this feature after the first, the DC increases by 5. When you finish a short or long rest, the DC resets to 10.
  "12":
    choices:
      - id: asi-12
        of: asi-or-feat
  "15":
    features:
      - id: srd51.feature.barbarian.persistent-rage
        name:
          en: Persistent Rage
        source: srd51
        text:
          en: Beginning at 15th level, your rage is so fierce that it ends early only if you fall unconscious or if you choose to end it.
  "16":
    choices:
      - id: asi-16
        of: asi-or-feat
  "18":
    features:
      - id: srd51.feature.barbarian.indomitable-might
        name:
          en: Indomitable Might
        source: srd51
        text:
          en: Beginning at 18th level, if your total for a Strength check is less than your Strength score, you can use that score in place of the total.
  "19":
    choices:
      - id: asi-19
        of: asi-or-feat
  "20":
    features:
      - id: srd51.feature.barbarian.primal-champion
        name:
          en: Primal Champion
        source: srd51
        text:
          en: At 20th level, you embody the power of the wilds. Your Strength and Constitution scores increase by 4. Your maximum for those scores is now 24.
