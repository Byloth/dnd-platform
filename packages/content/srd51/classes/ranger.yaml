    choices:
      - id: asi-8
        of: asi-or-feat
    features:
      - id: srd51.feature.ranger.lands-stride
        name:
          en: Land's Stride
        source: srd51
        text:
          en: |-
            Starting at 8th level, moving through nonmagical difficult terrain costs you no extra movement. You can also pass through nonmagical plants without being slowed by them and without taking damage from them if they have thorns, spines, or a similar hazard.

            In addition, you have advantage on saving throws against plants that are magically created or manipulated to impede movement, such those created by the entangle spell.
        effects:
          - kind: roll-advantage
            on:
              type: save
              against:
                - plants that are magically created or manipulated to impede movement (such as the entangle spell)
          - kind: add-text
            section: features
            text:
              en: Moving through nonmagical difficult terrain costs you no extra movement. You can also pass through nonmagical plants without being slowed by them and without taking damage from them if they have thorns, spines, or a similar hazard.
            note:
              en: Movement-cost rules have no catalogue kind; applied in play.
  "10":
    features:
      - id: srd51.feature.ranger.hide-in-plain-sight
        name:
          en: Hide in Plain Sight
        source: srd51
        text:
          en: |-
            Starting at 10th level, you can spend 1 minute creating camouflage for yourself. You must have access to fresh mud, dirt, plants, soot, and other naturally occurring materials with which to create your camouflage.

            Once you are camouflaged in this way, you can try to hide by pressing yourself up against a solid surface, such as a tree or wall, that is at least as tall and wide as you are. You gain a +10 bonus to Dexterity (Stealth) checks as long as you remain there without moving or taking actions. Once you move or take an action or a reaction, you must camouflage yourself again to gain this benefit.
        effects:
          - kind: add-action
            action: hide-in-plain-sight
            name:
              en: Hide in Plain Sight
            activation: special
            duration:
              type: special
            toggle:
              state: hide-in-plain-sight
              expires:
                manual: true
            text:
              en: Spend 1 minute creating camouflage for yourself (you need fresh mud, dirt, plants, soot, and other naturally occurring materials). Once camouflaged, you can try to hide by pressing yourself up against a solid surface, such as a tree or wall, that is at least as tall and wide as you are. You gain a +10 bonus to Dexterity (Stealth) checks as long as you remain there without moving or taking actions. Once you move or take an action or a reaction, you must camouflage yourself again to gain this benefit.
            onUse:
              - kind: note
                text:
                  en: Takes 1 minute. Switch the state off as soon as you move or take an action or a reaction.
          - kind: modify
            target: skill.stealth
            op: add
            value: 10
            when:
              toggled: hide-in-plain-sight
            note:
              en: Only while camouflaged and pressed against a solid surface without moving or taking actions.
  "12":
    choices:
      - id: asi-12
        of: asi-or-feat
  "14":
    features:
      - id: srd51.feature.ranger.vanish
        name:
          en: Vanish
        source: srd51
        text:
          en: Starting at 14th level, you can use the Hide action as a bonus action on your turn. Also, you can't be tracked by nonmagical means, unless you choose to leave a trail.
        effects:
          - kind: add-action
            action: vanish
            name:
              en: Vanish
            activation: bonus-action
            text:
              en: You can use the Hide action as a bonus action on your turn.
            onUse:
              - kind: note
                text:
                  en: Take the Hide action (make a Dexterity (Stealth) check).
          - kind: add-text
            section: features
            text:
              en: You can't be tracked by nonmagical means, unless you choose to leave a trail.
  "16":
    choices:
      - id: asi-16
        of: asi-or-feat
  "18":
    features:
      - id: srd51.feature.ranger.feral-senses
        name:
          en: Feral Senses
        source: srd51
        text:
          en: |-
            At 18th level, you gain preternatural senses that help you fight creatures you can't see. When you attack a creature you can't see, your inability to see it doesn't impose disadvantage on your attack rolls against it.

            You are also aware of the location of any invisible creature within 30 feet of you, provided that the creature isn't hidden from you and you aren't blinded or deafened.
        effects:
          - kind: add-text
            section: features
            text:
              en: When you attack a creature you can't see, your inability to see it doesn't impose disadvantage on your attack rolls against it.
            note:
              en: Negating the unseen-target disadvantage is a play-mode roll rule; no catalogue kind.
          - kind: add-text
            section: senses
            text:
              en: You are aware of the location of any invisible creature within 30 feet of you, provided that the creature isn't hidden from you and you aren't blinded or deafened.
  "19":
    choices:
      - id: asi-19
        of: asi-or-feat
  "20":
    features:
      - id: srd51.feature.ranger.foe-slayer
        name:
          en: Foe Slayer
        source: srd51
        text:
          en: At 20th level, you become an unparalleled hunter of your enemies. Once on each of your turns, you can add your Wisdom modifier to the attack roll or the damage roll of an attack you make against one of your favored enemies. You can choose to use this feature before or after the roll, but before any effects of the roll are applied.
        effects:
          - kind: add-action
            action: foe-slayer
            name:
              en: Foe Slayer
            activation: free
            text:
              en: Once on each of your turns, you can add your Wisdom modifier to the attack roll or the damage roll of an attack you make against one of your favored enemies. You can choose to use this feature before or after the roll, but before any effects of the roll are applied.
            onUse:
              - kind: note
                text:
                  en: Add your Wisdom modifier (mod(wis)) to the attack roll or the damage roll of one attack against a favored enemy; once per turn, before or after the roll but before its effects apply.
