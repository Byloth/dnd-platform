  "2":
    features:
      - id: srd51.feature.ranger.fighting-style
        name:
          en: Fighting Style
        source: srd51
        text:
          en: |-
            At 2nd level, you adopt a particular style of fighting as your specialty. Choose one of the following options. You can't take a Fighting Style option more than once, even if you later get to choose again.

            ### Archery

            You gain a +2 bonus to attack rolls you make with ranged weapons.

            ### Defense

            While you are wearing armor, you gain a +1 bonus to AC.

            ### Dueling

            When you are wielding a melee weapon in one hand and no other weapons, you gain a +2 bonus to damage rolls with that weapon.

            ### Two-Weapon Fighting

            When you engage in two-weapon fighting, you can add your ability modifier to the damage of the second attack.
        effects:
          - kind: open-choice
            choice: fighting-style
            of: fighting-style
            count: 1
            note:
              en: You can't take a Fighting Style option more than once, even if you later get to choose again.
            options:
              - id: archery
                name:
                  en: Archery
                text:
                  en: You gain a +2 bonus to attack rolls you make with ranged weapons.
                effects:
                  - kind: modify-attacks
                    filter:
                      ranged: true
                    set:
                      attackBonus: 2
              - id: defense
                name:
                  en: Defense
                text:
                  en: While you are wearing armor, you gain a +1 bonus to AC.
                effects:
                  - kind: modify
                    target: ac
                    op: add
                    value: 1
                    when:
                      any:
                        - armorCategory: light
                        - armorCategory: medium
                        - armorCategory: heavy
              - id: dueling
                name:
                  en: Dueling
                text:
                  en: When you are wielding a melee weapon in one hand and no other weapons, you gain a +2 bonus to damage rolls with that weapon.
                effects:
