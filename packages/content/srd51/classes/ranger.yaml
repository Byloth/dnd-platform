      - id: srd51.feature.ranger.primeval-awareness
        name:
          en: Primeval Awareness
        source: srd51
        text:
          en: "Beginning at 3rd level, you can use your action and expend one ranger spell slot to focus your awareness on the region around you. For 1 minute per level of the spell slot you expend, you can sense whether the following types of creatures are present within 1 mile of you (or within up to 6 miles if you are in your favored terrain): aberrations, celestials, dragons, elementals, fey, fiends, and undead. This feature doesn't reveal the creatures' location or number."
        effects:
          - kind: add-action
            action: primeval-awareness
            name:
              en: Primeval Awareness
            activation: action
            cost:
              - resource: spell-slot
                level: 1
            duration:
              type: timed
              minutes: 1
            text:
              en: "Use your action and expend one ranger spell slot to focus your awareness on the region around you. For 1 minute per level of the spell slot you expend, you can sense whether the following types of creatures are present within 1 mile of you (or within up to 6 miles if you are in your favored terrain): aberrations, celestials, dragons, elementals, fey, fiends, and undead. This feature doesn't reveal the creatures' location or number."
            onUse:
              - kind: note
                text:
                  en: For 1 minute per level of the slot spent, sense whether aberrations, celestials, dragons, elementals, fey, fiends or undead are present within 1 mile (6 miles in your favored terrain); not their location or number.
            note:
              en: The cost is fixed at a 1st-level slot and the duration at 1 minute; spending a higher-level slot for a longer duration is not expressible yet (no slot-level cost variable).
      - id: srd51.feature.ranger.ranger-archetype
        name:
          en: Ranger Archetype
        source: srd51
        text:
          en: "At 3rd level, you choose an archetype that you strive to emulate: Hunter or Beast Master, both detailed at the end of the class description. Your choice grants you features at 3rd level and again at 7th, 11th, and 15th level."
    choices:
