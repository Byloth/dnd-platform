    choices:
      - id: asi-8
        of: asi-or-feat
  "11":
    features:
      - id: srd51.feature.warlock.mystic-arcanum
        name:
          en: Mystic Arcanum
        source: srd51
        text:
          en: |-
            At 11th level, your patron bestows upon you a magical secret called an arcanum. Choose one 6th- level spell from the warlock spell list as this arcanum.

            You can cast your arcanum spell once without expending a spell slot. You must finish a long rest before you can do so again.

            At higher levels, you gain more warlock spells of your choice that can be cast in this way: one 7th- level spell at 13th level, one 8th-level spell at 15th level, and one 9th-level spell at 17th level. You regain all uses of your Mystic Arcanum when you finish a long rest.
        effects:
          - kind: open-choice
            choice: mystic-arcanum-6
            of: spell
            count: 1
            level: 11
            filter:
              list: srd51.spell-list.warlock
              level: 6
            note:
              en: Your 6th-level arcanum. You can cast it once without expending a spell slot; you regain the use when you finish a long rest.
          - kind: open-choice
            choice: mystic-arcanum-7
            of: spell
            count: 1
            level: 13
            filter:
              list: srd51.spell-list.warlock
              level: 7
            note:
              en: Your 7th-level arcanum, gained at 13th level. You can cast it once without expending a spell slot; you regain the use when you finish a long rest.
          - kind: open-choice
            choice: mystic-arcanum-8
            of: spell
            count: 1
            level: 15
            filter:
              list: srd51.spell-list.warlock
              level: 8
            note:
              en: Your 8th-level arcanum, gained at 15th level. You can cast it once without expending a spell slot; you regain the use when you finish a long rest.
          - kind: open-choice
            choice: mystic-arcanum-9
            of: spell
            count: 1
            level: 17
            filter:
              list: srd51.spell-list.warlock
              level: 9
            note:
              en: Your 9th-level arcanum, gained at 17th level. You can cast it once without expending a spell slot; you regain the use when you finish a long rest.
          - kind: declare-resource
            resource: mystic-arcanum-6
            name:
              en: Mystic Arcanum (6th level)
            max: table(warlock.mystic-arcanum-level-6)
            display: pips
            recharge:
              - on: long-rest
                amount: full
          - kind: declare-resource
            resource: mystic-arcanum-7
            name:
              en: Mystic Arcanum (7th level)
            max: table(warlock.mystic-arcanum-level-7)
            display: pips
            recharge:
              - on: long-rest
                amount: full
          - kind: declare-resource
            resource: mystic-arcanum-8
            name:
              en: Mystic Arcanum (8th level)
            max: table(warlock.mystic-arcanum-level-8)
            display: pips
            recharge:
              - on: long-rest
                amount: full
          - kind: declare-resource
            resource: mystic-arcanum-9
            name:
              en: Mystic Arcanum (9th level)
            max: table(warlock.mystic-arcanum-level-9)
            display: pips
            recharge:
              - on: long-rest
                amount: full
          - kind: add-text
            section: features
            text:
              en: You can cast each arcanum spell once without expending a spell slot. You must finish a long rest before you can do so again.
            note:
              en: A spell chosen through a choice cannot yet be granted with uses (grant-spells needs fixed spell ids); spend the matching Mystic Arcanum use by hand when you cast the arcanum.
  "12":
    choices:
      - id: asi-12
        of: asi-or-feat
  "19":
    choices:
      - id: asi-19
        of: asi-or-feat
  "20":
    features:
      - id: srd51.feature.warlock.eldritch-master
        name:
          en: Eldritch Master
        source: srd51
        text:
          en: At 20th level, you can draw on your inner reserve of mystical power while entreating your patron to regain expended spell slots. You can spend 1 minute entreating your patron for aid to regain all your expended spell slots from your Pact Magic feature. Once you regain spell slots with this feature, you must finish a long rest before you can do so again.
        effects:
          - kind: declare-resource
            resource: eldritch-master
            name:
              en: Eldritch Master
            max: 1
            display: pips
            recharge:
              - on: long-rest
                amount: full
          - kind: add-action
            action: eldritch-master
            name:
              en: Eldritch Master
            activation: special
            cost:
              - resource: eldritch-master
                amount: 1
            duration:
              type: timed
              minutes: 1
            text:
              en: You can spend 1 minute entreating your patron for aid to regain all your expended spell slots from your Pact Magic feature. Once you regain spell slots with this feature, you must finish a long rest before you can do so again.
            onUse:
              - kind: restoreResource
                resource: spell-slots
                amount: full
                note:
                  en: Regain all expended Pact Magic spell slots after 1 minute of entreating your patron.
