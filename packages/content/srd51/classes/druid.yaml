levels:
  "1":
    features:
      - id: srd51.feature.druid.druidic
        name:
          en: Druidic
        source: srd51
        text:
          en: You know Druidic, the secret language of druids. You can speak the language and use it to leave hidden messages. You and others who know this language automatically spot such a message. Others spot the message's presence with a successful DC 15 Wisdom (Perception) check but can't decipher it without magic.
        effects:
          - kind: grant-proficiency
            type: language
            items:
              - druidic
            note:
              en: Hidden messages in Druidic are spotted automatically by those who know the language; others notice them with a DC 15 Wisdom (Perception) check but cannot decipher them without magic.
      - id: srd51.feature.druid.spellcasting
        name:
          en: Spellcasting
        source: srd51
        text:
          en: |-
            Drawing on the divine essence of nature itself, you can cast spells to shape that essence to your will.

            ###Cantrips

            At 1st level, you know two cantrips of your choice from the druid spell list. You learn additional druid cantrips of your choice at higher levels, as shown in the Cantrips Known column of the Druid table.

            ###Preparing and Casting Spells

            The Druid table shows how many spell slots you have to cast your spells of 1st level and higher. To cast one of these druid spells, you must expend a slot of the spell's level or higher. You regain all expended spell slots when you finish a long rest.

            You prepare the list of druid spells that are available for you to cast, choosing from the druid spell list. When you do so, choose a number of druid spells equal to your Wisdom modifier + your druid level (minimum of one spell). The spells must be of a level for which you have spell slots.

            For example, if you are a 3rd-level druid, you have four 1st-level and two 2nd-level spell slots. With a Wisdom of 16, your list of prepared spells can include six spells of 1st or 2nd level, in any combination. If you prepare the 1st-level spell cure wounds, you can cast it using a 1st-level or 2nd-level slot. Casting the spell doesn't remove it from your list of prepared spells.

            You can also change your list of prepared spells when you finish a long rest. Preparing a new list of druid spells requires time spent in prayer and meditation: at least 1 minute per spell level for each spell on your list.

            ###Spellcasting Ability

            Wisdom is your spellcasting ability for your druid spells, since your magic draws upon your devotion and attunement to nature. You use your Wisdom whenever a spell refers to your spellcasting ability. In addition, you use your Wisdom modifier when setting the saving throw DC for a druid spell you cast and when making an attack roll with one.

            **Spell save DC** = 8 + your proficiency bonus + your Wisdom modifier

            **Spell attack modifier** = your proficiency bonus + your Wisdom modifier

            ###Ritual Casting

            You can cast a druid spell as a ritual if that spell has the ritual tag and you have the spell prepared.

            ###Spellcasting Focus

            You can use a druidic focus (see chapter 5, “Equipment”) as a spellcasting focus for your druid spells.
        effects:
          - kind: grant-spellcasting
            ability: wis
            list: srd51.spell-list.druid
            preparation: prepared
            slots:
              progression: full
            cantrips:
              table: srd51.table.druid.cantrips-known
            ritual: true
      - id: srd51.feature.druid.timeless-body
        name:
          en: Timeless Body
        source: srd51
        text:
          en: Starting at 18th level, the primal magic that you wield causes you to age more slowly. For every 10 years that pass, your body ages only 1 year.
  "2":
    features:
      - id: srd51.feature.druid.druid-circle
        name:
          en: Druid Circle
        source: srd51
        text:
          en: At 2nd level, you choose to identify with a circle of druids such as the Circle of the Land. Your choice grants you features at 2nd level and again at 6th, 10th, and 14th level.
      - id: srd51.feature.druid.wild-shape
        name:
          en: Wild Shape
        source: srd51
        text:
          en: |-
            Starting at 2nd level, you can use your action to magically assume the shape of a beast that you have seen before. You can use this feature twice. You regain expended uses when you finish a short or long rest.

            Your druid level determines the beasts you can transform into, as shown in the Beast Shapes table. At 2nd level, for example, you can transform into any beast that has a challenge rating of 1/4 or lower that doesn't have a flying or swimming speed.

            | Level | Max. CR | Limitations | Example |
            | --- | --- | --- | --- |
            | 2nd | 1/4 | No flying or swimming speed | Wolf |
            | 4th | 1/2 | No flying speed | Crocodile |
            | 8th | 1 | - | Giant Eagle |

            You can stay in a beast shape for a number of hours equal to half your druid level (rounded down). You then revert to your normal form unless you expend another use of this feature. You can revert to your normal form earlier by using a bonus action on your turn. You automatically revert if you fall unconscious, drop to 0 hit points, or die.

            While you are transformed, the following rules apply:
            Your game statistics are replaced by the statistics of the beast, but you retain your alignment, personality, and Intelligence, Wisdom, and Charisma scores. You also retain all of your skill and saving throw proficiencies, in addition to gaining those of the creature. If the creature has the same proficiency as you and the bonus in its stat block is higher than yours, use the creature's bonus instead of yours. If the creature has any legendary or lair actions, you can't use them.

            When you transform, you assume the beast's hit points and Hit Dice. When you revert to your normal form, you return to the number of hit points you had before you transformed. However, if you revert as a result of dropping to 0 hit points, any excess damage carries over to your normal form. For example, if you take 10 damage in animal form and have only 1 hit point left, you revert and take 9 damage. As long as the excess damage doesn't reduce your normal form to 0 hit points, you aren't knocked unconscious.

            You can't cast spells, and your ability to speak or take any action that requires hands is limited to the capabilities of your beast form. Transforming doesn't break your concentration on a spell you've already cast, however, or prevent you from taking actions that are part of a spell, such as call lightning, that you've already cast.

            You retain the benefit of any features from your class, race, or other source and can use them if the new form is physically capable of doing so. However, you can't use any of your special senses, such as darkvision, unless your new form also has that sense.

            You choose whether your equipment falls to the ground in your space, merges into your new form, or is worn by it. Worn equipment functions as normal, but the GM decides whether it is practical for the new form to wear a piece of equipment, based on the creature's shape and size. Your equipment doesn't change size or shape to match the new form, and any equipment that the new form can't wear must either fall to the ground or merge with it. Equipment that merges with the form has no effect until you leave the form.
        effects:
          - kind: declare-resource
            resource: wild-shape
            name:
              en: Wild Shape uses
            max: 2
            display: pips
            recharge:
              - on: short-rest
                amount: full
              - on: long-rest
                amount: full
          - kind: add-action
            action: wild-shape
            name:
              en: Wild Shape
            activation: action
            cost:
              - resource: wild-shape
                amount: 1
            toggle:
              state: wild-shape
              expires:
                manual: true
            text:
              en: Magically assume the shape of a beast that you have seen before, with a challenge rating no higher than the Beast Shapes table allows for your druid level (no flying or swimming speed before 4th level, no flying speed before 8th level). You can stay in a beast shape for a number of hours equal to half your druid level (rounded down).
            onUse:
              - kind: note
                text:
                  en: "Maximum CR: table(druid.wild-shape-max-cr). Your game statistics are replaced by the beast's, but you keep your alignment, personality, Intelligence, Wisdom and Charisma scores, and all your skill and saving throw proficiencies (use the beast's bonus if it is higher). You assume the beast's hit points and Hit Dice; when you revert you return to the hit points you had before, and excess damage from dropping to 0 carries over. You can't cast spells while transformed."
          - kind: add-action
            action: wild-shape-revert
            name:
              en: Revert from Wild Shape
            activation: bonus-action
            requires:
              condition:
                toggled: wild-shape
            text:
              en: Revert to your normal form. You automatically revert if you fall unconscious, drop to 0 hit points, or die.
          - kind: add-text
            section: features
            text:
              en: While transformed by Wild Shape your game statistics are replaced by the statistics of the beast; you retain your alignment, personality, Intelligence, Wisdom and Charisma scores, your skill and saving throw proficiencies, and the benefit of your class, race and other features if the new form is physically capable of using them. You can't use your special senses unless the form has them, and you can't cast spells. Your equipment falls to the ground, merges into the form, or is worn by it.
            note:
              en: "Gap: replacing the sheet with a beast stat block while keeping mental scores and proficiencies needs an alternate-form capability the engine does not have; the duration (half your druid level in hours), hit point carry-over and the spellcasting restriction are tracked in play. The max-CR table is the class table druid.wild-shape-max-cr."
    choices:
      - id: druid-circle
        of: subclass
  "4":
    features:
      - id: srd51.feature.druid.ability-score-improvement
        name:
          en: Ability Score Improvement
        source: srd51
        text:
          en: When you reach 4th level, and again at 8th, 12th, 16th, and 19th level, you can increase one ability score of your choice by 2, or you can increase two ability scores of your choice by 1. As normal, you can't increase an ability score above 20 using this feature.
    choices:
      - id: asi-4
        of: asi-or-feat
  "8":
    choices:
      - id: asi-8
        of: asi-or-feat
  "12":
    choices:
      - id: asi-12
        of: asi-or-feat
  "16":
    choices:
      - id: asi-16
        of: asi-or-feat
  "18":
    features:
      - id: srd51.feature.druid.beast-spells
        name:
          en: Beast Spells
        source: srd51
        text:
          en: Beginning at 18th level, you can cast many of your druid spells in any shape you assume using Wild Shape. You can perform the somatic and verbal components of a druid spell while in a beast shape, but you aren't able to provide material components.
        effects:
          - kind: add-text
            section: features
            text:
              en: You can cast many of your druid spells in any shape you assume using Wild Shape. You can perform the somatic and verbal components of a druid spell while in a beast shape, but you aren't able to provide material components.
            note:
              en: "Gap: lifts the no-spellcasting restriction of the Wild Shape state for druid spells without material components; the engine does not enforce that restriction."
  "19":
    choices:
      - id: asi-19
        of: asi-or-feat
  "20":
    features:
      - id: srd51.feature.druid.archdruid
        name:
          en: Archdruid
        source: srd51
        text:
          en: |-
            At 20th level, you can use your Wild Shape an unlimited number of times.

            Additionally, you can ignore the verbal and somatic components of your druid spells, as well as any material components that lack a cost and aren't consumed by a spell. You gain this benefit in both your normal shape and your beast shape from Wild Shape.
        effects:
          - kind: modify
            target: resource.wild-shape.max
            op: set
            value: unlimited
            note:
              en: You can use your Wild Shape an unlimited number of times.
          - kind: add-text
            section: features
            text:
              en: You can ignore the verbal and somatic components of your druid spells, as well as any material components that lack a cost and aren't consumed by a spell. You gain this benefit in both your normal shape and your beast shape from Wild Shape.
            note:
              en: "Gap: spell components are not modelled by the engine."
