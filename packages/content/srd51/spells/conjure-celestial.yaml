      en: The summoned celestial (challenge rating 4 or lower) is friendly to you and your companions, rolls its own initiative and obeys your verbal commands (no action required) as long as they don't violate its alignment; without commands it only defends itself. It disappears at 0 hit points or when the spell ends.
onCast:
