id: srd51.spell.bestow-curse
name:
  en: Bestow Curse
source: srd51
level: 3
school: necromancy
castingTime:
  activation: action
range:
  type: touch
components:
  v: true
  s: true
  m: false
duration:
  type: timed
  minutes: 1
  concentration: true
text:
  en: |-
    You touch a creature, and that creature must succeed on a wisdom saving throw or become cursed for the duration of the spell. When you cast this spell, choose the nature of the curse from the following options: 
    - Choose one ability score. While cursed, the target has disadvantage on ability checks and saving throws made with that ability score. 
    - While cursed, the target has disadvantage on attack rolls against you. 
    - While cursed, the target must make a wisdom saving throw at the start of each of its turns. If it fails, it wastes its action that turn doing nothing. 
    - While the target is cursed, your attacks and spells deal an extra 1d8 necrotic damage to the target. A remove curse spell ends this effect. At the DM's option, you may choose an alternative curse effect, but it should be no more powerful than those described above. The DM has final say on such a curse's effect.
higherLevel:
  en: If you cast this spell using a spell slot of 4th level or higher, the duration is concentration, up to 10 minutes. If you use a spell slot of 5th level or higher, the duration is 8 hours. If you use a spell slot of 7th level or higher, the duration is 24 hours. If you use a 9th level spell slot, the spell lasts until it is dispelled. Using a spell slot of 5th level or higher grants a duration that doesn't require concentration.
rolls:
  - type: save
    ability: wis
    onSuccess: none
effects:
  - kind: add-text
    section: features
    text:
      en: "Cursed (one option chosen when cast): disadvantage on ability checks and saving throws made with one chosen ability score; or disadvantage on attack rolls against the caster; or a Wisdom saving throw at the start of each of your turns, wasting your action on a failure; or the caster's attacks and spells deal an extra 1d8 necrotic damage to you."
    note:
      en: "Option-dependent, so not expressed as roll-disadvantage; 'cursed' is not a standard condition. Higher slots extend the duration: concentration up to 10 minutes at 4th level, 8 hours at 5th, 24 hours at 7th, until dispelled at 9th (no concentration from 5th level)."
onCast:
  - kind: note
    text:
      en: Wisdom saving throw negates. A remove curse spell ends the effect; the DM may allow an alternative curse of similar power.
