    text:
      en: While possessing a body, your game statistics are replaced by the creature's, though you retain your alignment and your Intelligence, Wisdom and Charisma scores, and you keep your own class features (but can't use the host's). While your soul is in the container you can't move or use reactions; your only action is to project your soul up to 100 feet to return to your body or attempt a possession.
    note:
      en: Stat-block replacement is not expressible in v0; the host's statistics must be tracked by hand.
onCast:
