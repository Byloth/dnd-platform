id: srd51.spell.find-familiar
name:
  en: Find Familiar
source: srd51
level: 1
school: conjuration
castingTime:
  activation: special
  hours: 1
range:
  type: point
  distance: 10
components:
  v: true
  s: true
  m:
    en: 10 gp worth of charcoal, incense, and herbs that must be consumed by fire in a brass brazier
duration:
  type: instantaneous
ritual: true
text:
  en: "You gain the service of a familiar, a spirit that takes an animal form you choose: bat, cat, crab, frog (toad), hawk, lizard, octopus, owl, poisonous snake, fish (quipper), rat, raven, sea horse, spider, or weasel. Appearing in an unoccupied space within range, the familiar has the statistics of the chosen form, though it is a celestial, fey, or fiend (your choice) instead of a beast. Your familiar acts independently of you, but it always obeys your commands. In combat, it rolls its own initiative and acts on its own turn. A familiar can't attack, but it can take other actions as normal. When the familiar drops to 0 hit points, it disappears, leaving behind no physical form. It reappears after you cast this spell again. While your familiar is within 100 feet of you, you can communicate with it telepathically. Additionally, as an action, you can see through your familiar's eyes and hear what it hears until the start of your next turn, gaining the benefits of any special senses that the familiar has. During this time, you are deaf and blind with regard to your own senses. As an action, you can temporarily dismiss your familiar. It disappears into a pocket dimension where it awaits your summons. Alternatively, you can dismiss it forever. As an action while it is temporarily dismissed, you can cause it to reappear in any unoccupied space within 30 feet of you. You can't have more than one familiar at a time. If you cast this spell while you already have a familiar, you instead cause it to adopt a new form. Choose one of the forms from the above list. Your familiar transforms into the chosen creature. Finally, when you cast a spell with a range of touch, your familiar can deliver the spell as if it had cast the spell. Your familiar must be within 100 feet of you, and it must use its reaction to deliver the spell when you cast it. If the spell requires an attack roll, you use your attack modifier for the roll."
onCast:
  - kind: note
    text:
      en: The familiar takes the statistics of the chosen animal form (bat, cat, crab, frog, hawk, lizard, octopus, owl, poisonous snake, fish, rat, raven, sea horse, spider or weasel) as a celestial, fey or fiend; the DM has the statistics (no stat blocks in v0). It rolls its own initiative, can't attack, and disappears at 0 hit points until you cast the spell again. While it is within 100 feet you can communicate with it telepathically; as an action you can see through its eyes and hear what it hears until the start of your next turn (deaf and blind to your own senses meanwhile), temporarily dismiss it, or make it reappear within 30 feet of you. It can deliver a touch spell you cast by using its reaction while within 100 feet. Casting the spell while you have a familiar changes its form.
