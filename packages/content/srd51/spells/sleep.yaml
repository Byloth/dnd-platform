id: srd51.spell.sleep
name:
  en: Sleep
source: srd51
level: 1
school: enchantment
castingTime:
  activation: action
range:
  type: creature
  distance: 90
components:
  v: true
  s: true
  m:
    en: A pinch of fine sand, rose petals, or a cricket.
duration:
  type: timed
  minutes: 1
text:
  en: This spell sends creatures into a magical slumber. Roll 5d8; the total is how many hit points of creatures this spell can affect. Creatures within 20 feet of a point you choose within range are affected in ascending order of their current hit points (ignoring unconscious creatures). Starting with the creature that has the lowest current hit points, each creature affected by this spell falls unconscious until the spell ends, the sleeper takes damage, or someone uses an action to shake or slap the sleeper awake. Subtract each creature's hit points from the total before moving on to the creature with the next lowest hit points. A creature's hit points must be equal to or less than the remaining total for that creature to be affected. Undead and creatures immune to being charmed aren't affected by this spell.
higherLevel:
  en: When you cast this spell using a spell slot of 2nd level or higher, roll an additional 2d8 for each slot level above 1st.
tags:
  - area
onCast:
  - kind: applyCondition
    condition: srd51.condition.unconscious
    target: other
    expires:
      minutes: 1
    note:
      en: "No saving throw. Roll 5d8 (+2d8 per slot level above 1st): creatures within 20 feet of the point are affected in ascending order of current hit points, each subtracting its hit points from the total, as long as its hit points are at or below what remains. Undead and creatures immune to being charmed aren't affected. A sleeper wakes if it takes damage or someone uses an action to shake or slap it."
