id: srd51.spell.gaseous-form
name:
  en: Gaseous Form
source: srd51
level: 3
school: transmutation
castingTime:
  activation: action
range:
  type: touch
components:
  v: true
  s: true
  m:
    en: A bit of gauze and a wisp of smoke.
duration:
  type: timed
  hours: 1
  concentration: true
text:
  en: You transform a willing creature you touch, along with everything it's wearing and carrying, into a misty cloud for the duration. The spell ends if the creature drops to 0 hit points. An incorporeal creature isn't affected. While in this form, the target's only method of movement is a flying speed of 10 feet. The target can enter and occupy the space of another creature. The target has resistance to nonmagical damage, and it has advantage on Strength, Dexterity, and constitution saving throws. The target can pass through small holes, narrow openings, and even mere cracks, though it treats liquids as though they were solid surfaces. The target can't fall and remains hovering in the air even when stunned or otherwise incapacitated. While in the form of a misty cloud, the target can't talk or manipulate objects, and any objects it was carrying or holding can't be dropped, used, or otherwise interacted with. The target can't attack or cast spells.
rolls:
  - type: save
    ability: con
    onSuccess: none
effects:
  - kind: modify
    target: speed.fly
    op: set
    value: 10
    note:
      en: Your only method of movement while in this form.
  - kind: defense
    defense: resistance
    to:
      - acid
      - bludgeoning
      - cold
      - fire
      - force
      - lightning
      - necrotic
      - piercing
      - poison
      - psychic
      - radiant
      - slashing
      - thunder
    note:
      en: Nonmagical damage only.
  - kind: roll-advantage
    on:
      type: save
      ability: str
  - kind: roll-advantage
    on:
      type: save
      ability: dex
  - kind: roll-advantage
    on:
      type: save
      ability: con
  - kind: add-text
    section: features
    text:
      en: "Misty cloud: you can enter and occupy another creature's space and pass through small holes, narrow openings and mere cracks (liquids count as solid surfaces); you can't fall and remain hovering even when stunned or otherwise incapacitated; you can't talk, manipulate or use objects, attack or cast spells. The spell ends if you drop to 0 hit points."
