id: srd51.spell.magic-circle
name:
  en: Magic Circle
source: srd51
level: 3
school: abjuration
castingTime:
  activation: special
  minutes: 1
range:
  type: point
  distance: 10
components:
  v: true
  s: true
  m:
    en: Holy water or powdered silver and iron worth at least 100 gp, which the spell consumes.
  cost: 100
  consumed: true
duration:
  type: timed
  hours: 1
text:
  en: |-
    You create a 10-­--foot-­--radius, 20-­--foot-­--tall cylinder of magical energy centered on a point on the ground that you can see within range. Glowing runes appear wherever the cylinder intersects with the floor or other surface. Choose one or more of the following types of creatures: celestials, elementals, fey, fiends, or undead. The circle affects a creature of the chosen type in the following ways: 
    - The creature can't willingly enter the cylinder by nonmagical means. If the creature tries to use teleportation or interplanar travel to do so, it must first succeed on a charisma saving throw. 
    - The creature has disadvantage on attack rolls against targets within the cylinder. 
    - Targets within the cylinder can't be charmed, frightened, or possessed by the creature.
    When you cast this spell, you can elect to cause its magic to operate in the reverse direction, preventing a creature of the specified type from leaving the cylinder and protecting targets outside it.
higherLevel:
  en: When you cast this spell using a spell slot of 4th level or higher, the duration increases by 1 hour for each slot level above 3rd.
rolls:
  - type: save
    ability: cha
    onSuccess: none
tags:
  - area
effects:
  - kind: add-text
    section: features
    text:
      en: "Against the chosen creature types (celestials, elementals, fey, fiends or undead): they can't willingly enter the cylinder by nonmagical means (Charisma save to do so by teleportation or interplanar travel), have disadvantage on attack rolls against targets inside it, and can't charm, frighten or possess them. The circle can be reversed to keep such creatures inside. Each slot level above 3rd adds 1 hour to the duration."
    note:
      en: "Keyed on the attacker's creature type: reminder only."
