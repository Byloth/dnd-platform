# Generated by tools/import (map stage) from the SRD 5.1 datasets pinned in tools/import/sources.lock.yaml.
# Mechanics come from tools/import/overlay/<entity-id>.yaml; edit those, then re-run `node tools/import/src/map.ts`.
id: srd51.subclass.fighter.champion
name:
  en: Champion
source: srd51
class: srd51.class.fighter
levels:
  "3":
    features:
      - id: srd51.feature.champion.improved-critical
        name:
          en: Improved Critical
        source: srd51
        text:
          en: Beginning when you choose this archetype at 3rd level, your weapon attacks score a critical hit on a roll of 19 or 20.
        effects:
          - kind: modify-attacks
            set:
              critRange: 19
            note:
              en: Your weapon attacks score a critical hit on a roll of 19 or 20.
  "7":
    features:
      - id: srd51.feature.champion.remarkable-athlete
        name:
          en: Remarkable Athlete
        source: srd51
        text:
          en: |-
            Starting at 7th level, you can add half your proficiency bonus (round up) to any Strength, Dexterity, or Constitution check you make that doesn't already use your proficiency bonus.

            In addition, when you make a running long jump, the distance you can cover increases by a number of feet equal to your Strength modifier.
        effects:
          - kind: modify
            target: check.str
            op: add
            formula: ceil(proficiencyBonus / 2)
            note:
              en: Half your proficiency bonus (round up) on Strength checks that don't already use your proficiency bonus.
          - kind: modify
            target: check.dex
            op: add
            formula: ceil(proficiencyBonus / 2)
            note:
              en: Half your proficiency bonus (round up) on Dexterity checks that don't already use your proficiency bonus.
          - kind: modify
            target: check.con
            op: add
            formula: ceil(proficiencyBonus / 2)
            note:
              en: Half your proficiency bonus (round up) on Constitution checks that don't already use your proficiency bonus.
          - kind: modify
            target: initiative
            op: add
            formula: ceil(proficiencyBonus / 2)
            note:
              en: Initiative is a Dexterity check.
          - kind: modify
            target: skill.athletics
            op: add
            formula: ceil(proficiencyBonus / 2)
            when:
              not:
                proficient:
                  type: skill
                  item: athletics
          - kind: modify
            target: skill.acrobatics
            op: add
            formula: ceil(proficiencyBonus / 2)
            when:
              not:
                proficient:
                  type: skill
                  item: acrobatics
          - kind: modify
            target: skill.sleight-of-hand
            op: add
            formula: ceil(proficiencyBonus / 2)
            when:
              not:
                proficient:
                  type: skill
                  item: sleight-of-hand
          - kind: modify
            target: skill.stealth
            op: add
            formula: ceil(proficiencyBonus / 2)
            when:
              not:
                proficient:
                  type: skill
                  item: stealth
          - kind: modify
            target: jump.long
            op: add
            formula: mod(str)
            note:
              en: When you make a running long jump, the distance you can cover increases by a number of feet equal to your Strength modifier.
  "10":
    features:
      - id: srd51.feature.champion.additional-fighting-style
        name:
          en: Additional Fighting Style
        source: srd51
        text:
          en: At 10th level, you can choose a second option from the Fighting Style class feature.
        effects:
          - kind: open-choice
            choice: additional-fighting-style
            of: fighting-style
            count: 1
            note:
              en: A second option from the Fighting Style class feature. You can't take a Fighting Style option more than once.
            options:
              - id: archery
                prerequisites:
                  not:
                    answer:
                      choice: fighting-style
                      is: archery
                name:
                  en: Archery
                text:
                  en: You gain a +2 bonus to attack rolls you make with ranged weapons.
                effects:
                  - kind: modify
                    target: attack.ranged.bonus
                    op: add
                    value: 2
              - id: defense
                prerequisites:
                  not:
                    answer:
                      choice: fighting-style
                      is: defense
                name:
                  en: Defense
                text:
                  en: While you are wearing armor, you gain a +1 bonus to AC.
                effects:
                  - kind: modify
                    target: ac
                    op: add
                    value: 1
                    when:
                      not:
                        armorCategory: none
              - id: dueling
                prerequisites:
                  not:
                    answer:
                      choice: fighting-style
                      is: dueling
                name:
                  en: Dueling
                text:
                  en: When you are wielding a melee weapon in one hand and no other weapons, you gain a +2 bonus to damage rolls with that weapon.
                effects:
                  - kind: modify-attacks
                    filter:
                      melee: true
                    set:
                      damageBonus: 2
                    when:
                      wieldingOnly:
                        melee: true
                        count: 1
              - id: great-weapon-fighting
                prerequisites:
                  not:
                    answer:
                      choice: fighting-style
                      is: great-weapon-fighting
                name:
                  en: Great Weapon Fighting
                text:
                  en: When you roll a 1 or 2 on a damage die for an attack you make with a melee weapon that you are wielding with two hands, you can reroll the die and must use the new roll, even if the new roll is a 1 or a 2. The weapon must have the two-handed or versatile property for you to gain this benefit.
                effects:
                  - kind: add-text
                    section: attacks
                    text:
                      en: "Great Weapon Fighting: when you roll a 1 or 2 on a damage die with a melee weapon wielded in two hands (two-handed or versatile), reroll the die and use the new roll."
                    note:
                      en: "Play mode: rerolling individual damage dice of 1 or 2 is not executed by the engine."
              - id: protection
                prerequisites:
                  not:
                    answer:
                      choice: fighting-style
                      is: protection
                name:
                  en: Protection
                text:
                  en: When a creature you can see attacks a target other than you that is within 5 feet of you, you can use your reaction to impose disadvantage on the attack roll. You must be wielding a shield.
                effects:
                  - kind: add-action
                    action: protection
                    name:
                      en: Protection
                    activation: reaction
                    trigger:
                      en: when a creature you can see attacks a target other than you that is within 5 feet of you
                    requires:
                      condition:
                        shield: true
                    text:
                      en: Impose disadvantage on the attack roll. You must be wielding a shield.
              - id: two-weapon-fighting
                prerequisites:
                  not:
                    answer:
                      choice: fighting-style
                      is: two-weapon-fighting
                name:
                  en: Two-Weapon Fighting
                text:
                  en: When you engage in two-weapon fighting, you can add your ability modifier to the damage of the second attack.
                effects:
                  - kind: add-text
                    section: attacks
                    text:
                      en: "Two-Weapon Fighting: when you engage in two-weapon fighting, add your ability modifier to the damage of the second attack."
                    note:
                      en: "Play mode: the off-hand attack's damage modifier is not derived by the engine."
  "15":
    features:
      - id: srd51.feature.champion.superior-critical
        name:
          en: Superior Critical
        source: srd51
        text:
          en: Starting at 15th level, your weapon attacks score a critical hit on a roll of 18-20.
        effects:
          - kind: modify-attacks
            set:
              critRange: 18
            note:
              en: Your weapon attacks score a critical hit on a roll of 18-20. Supersedes Improved Critical.
  "18":
    features:
      - id: srd51.feature.champion.survivor
        name:
          en: Survivor
        source: srd51
        text:
          en: At 18th level, you attain the pinnacle of resilience in battle. At the start of each of your turns, you regain hit points equal to 5 + your Constitution modifier if you have no more than half of your hit points left. You don't gain this benefit if you have 0 hit points.
        onTurnStart:
          - kind: heal
            amount: 5 + mod(con)
            target: self
            note:
              en: Only if you have no more than half of your hit points left and more than 0 hit points.
