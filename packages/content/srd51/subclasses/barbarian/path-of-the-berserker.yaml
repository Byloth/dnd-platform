id: srd51.subclass.barbarian.path-of-the-berserker
name:
  en: Path of the Berserker
source: srd51
class: srd51.class.barbarian
levels:
  "3":
    features:
      - id: srd51.feature.path-of-the-berserker.frenzy
        name:
          en: Frenzy
        source: srd51
        text:
          en: Starting when you choose this path at 3rd level, you can go into a frenzy when you rage. If you do so, for the duration of your rage you can make a single melee weapon attack as a bonus action on each of your turns after this one. When your rage ends, you suffer one level of exhaustion (as described in appendix A).
        toggle:
          state: frenzy
          expires:
            minutes: 1
        effects:
          - kind: add-action
            action: frenzy-attack
            name:
              en: Frenzy attack
            activation: bonus-action
            requires:
              condition:
                all:
                  - toggled: raging
                  - toggled: frenzy
            text:
              en: When you rage, you can go into a frenzy. If you do so, for the duration of your rage you can make a single melee weapon attack as a bonus action on each of your turns after this one. When your rage ends, you suffer one level of exhaustion.
            onUse:
              - kind: note
                text:
                  en: Make a single melee weapon attack.
          - kind: add-text
            section: features
            text:
              en: When your rage ends after a frenzy, you suffer one level of exhaustion.
            note:
              en: "Gap: no hook for a toggle ending; apply one level of srd51.condition.exhaustion by hand when the rage ends."
  "6":
    features:
      - id: srd51.feature.path-of-the-berserker.mindless-rage
        name:
          en: Mindless Rage
        source: srd51
        text:
          en: Beginning at 6th level, you can't be charmed or frightened while raging. If you are charmed or frightened when you enter your rage, the effect is suspended for the duration of the rage.
        effects:
          - kind: defense
            defense: condition-immunity
            to:
              - srd51.condition.charmed
              - srd51.condition.frightened
            when:
              toggled: raging
          - kind: add-text
            section: features
            text:
              en: If you are charmed or frightened when you enter your rage, the effect is suspended for the duration of the rage.
            note:
              en: "Gap: suspending an already-applied condition for the rage is resolved in play."
  "10":
    features:
      - id: srd51.feature.path-of-the-berserker.intimidating-presence
        name:
          en: Intimidating Presence
        source: srd51
        text:
          en: |-
            Beginning at 10th level, you can use your action to frighten someone with your menacing presence. When you do so, choose one creature that you can see within 30 feet of you. If the creature can see or hear you, it must succeed on a Wisdom saving throw (DC equal to 8 + your proficiency bonus + your Charisma modifier) or be frightened of you until the end of your next turn. On subsequent turns, you can use your action to extend the duration of this effect on the frightened creature until the end of your next turn. This effect ends if the creature ends its turn out of line of sight or more than 60 feet away from you.

            If the creature succeeds on its saving throw, you can't use this feature on that creature again for 24 hours.
        effects:
          - kind: add-action
            action: intimidating-presence
            name:
              en: Intimidating Presence
            activation: action
            dc: 8 + proficiencyBonus + mod(cha)
            range:
              type: point
              distance: 30
            text:
              en: Choose one creature that you can see within 30 feet of you. If the creature can see or hear you, it must succeed on a Wisdom saving throw (DC equal to 8 + your proficiency bonus + your Charisma modifier) or be frightened of you until the end of your next turn. On subsequent turns, you can use your action to extend the duration of this effect on the frightened creature until the end of your next turn. This effect ends if the creature ends its turn out of line of sight or more than 60 feet away from you. If the creature succeeds on its saving throw, you can't use this feature on that creature again for 24 hours.
            onUse:
              - kind: applyCondition
                condition: srd51.condition.frightened
                target: other
                expires:
                  until: next-turn-end
                note:
                  en: On a failed Wisdom saving throw.
              - kind: note
                text:
                  en: Extend with your action on later turns; ends if the creature ends its turn out of line of sight or more than 60 feet away. On a success, the creature is immune to this feature for 24 hours.
  "14":
    features:
      - id: srd51.feature.path-of-the-berserker.retaliation
        name:
          en: Retaliation
        source: srd51
        text:
          en: Starting at 14th level, when you take damage from a creature that is within 5 feet of you, you can use your reaction to make a melee weapon attack against that creature.
        effects:
          - kind: add-action
            action: retaliation
            name:
              en: Retaliation
            activation: reaction
            trigger:
              en: when you take damage from a creature that is within 5 feet of you
            text:
              en: You can use your reaction to make a melee weapon attack against that creature.
