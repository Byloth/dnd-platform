id: srd51.subclass.warlock.the-fiend
name:
  en: The Fiend
source: srd51
class: srd51.class.warlock
levels:
  "1":
    features:
      - id: srd51.feature.the-fiend.dark-ones-blessing
        name:
          en: Dark One's Blessing
        source: srd51
        text:
          en: Starting at 1st level, when you reduce a hostile creature to 0 hit points, you gain temporary hit points equal to your Charisma modifier + your warlock level (minimum of 1).
        effects:
          - kind: add-action
            action: dark-ones-blessing
            name:
              en: Dark One's Blessing
            activation: free
            trigger:
              en: When you reduce a hostile creature to 0 hit points.
            text:
              en: When you reduce a hostile creature to 0 hit points, you gain temporary hit points equal to your Charisma modifier + your warlock level (minimum of 1).
            onUse:
              - kind: tempHp
                amount: max(1, mod(cha) + classLevel(warlock))
            note:
              en: The trigger (reducing a hostile creature to 0 hit points) is not detected by the play engine; use this when it happens.
      - id: srd51.feature.the-fiend.expanded-spell-list
        name:
          en: Expanded Spell List
        source: srd51
        text:
          en: |-
            The Fiend lets you choose from an expanded list of spells when you learn a warlock spell. The following spells are added to the warlock spell list for you.

            ### Fiend Expanded Spells (table)
            | Spell Level | Spells |
            | --- | --- |
            | 1st | burning hands, command |
            | 2nd | blindness/deafness, scorching ray |
            | 3rd | fireball, stinking cloud |
            | 4th | fire shield, wall of fire |
            | 5th | flame strike, hallow |
        effects:
          - kind: extend-spell-list
            list: srd51.spell-list.warlock
            spells:
              - srd51.spell.burning-hands
              - srd51.spell.command
              - srd51.spell.blindnessdeafness
              - srd51.spell.scorching-ray
              - srd51.spell.fireball
              - srd51.spell.stinking-cloud
              - srd51.spell.fire-shield
              - srd51.spell.wall-of-fire
              - srd51.spell.flame-strike
              - srd51.spell.hallow
  "6":
    features:
      - id: srd51.feature.the-fiend.dark-ones-own-luck
        name:
          en: Dark One's Own Luck
        source: srd51
        text:
          en: |-
            Starting at 6th level, you can call on your patron to alter fate in your favor. When you make an ability check or a saving throw, you can use this feature to add a d10 to your roll. You can do so after seeing the initial roll but before any of the roll's effects occur.

            Once you use this feature, you can't use it again until you finish a short or long rest.
        effects:
          - kind: declare-resource
            resource: dark-ones-own-luck
            name:
              en: Dark One's Own Luck
            max: 1
            display: pips
            recharge:
              - on: short-rest
                amount: full
              - on: long-rest
                amount: full
          - kind: add-action
            action: dark-ones-own-luck
            name:
              en: Dark One's Own Luck
            activation: free
            cost:
              - resource: dark-ones-own-luck
                amount: 1
            text:
              en: When you make an ability check or a saving throw, you can use this feature to add a d10 to your roll. You can do so after seeing the initial roll but before any of the roll's effects occur.
            onUse:
              - kind: note
                text:
                  en: Add 1d10 to the ability check or saving throw you just rolled.
