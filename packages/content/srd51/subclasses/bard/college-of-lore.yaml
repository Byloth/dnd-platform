id: srd51.subclass.bard.college-of-lore
name:
  en: College of Lore
source: srd51
class: srd51.class.bard
levels:
  "3":
    features:
      - id: srd51.feature.college-of-lore.bonus-proficiencies
        name:
          en: Bonus Proficiencies
        source: srd51
        text:
          en: When you join the College of Lore at 3rd level, you gain proficiency with three skills of your choice.
        effects:
          - kind: grant-proficiency
            type: skill
            choose:
              count: 3
              from:
                - acrobatics
                - animal-handling
                - arcana
                - athletics
                - deception
                - history
                - insight
                - intimidation
                - investigation
                - medicine
                - nature
                - perception
                - performance
                - persuasion
                - religion
                - sleight-of-hand
                - stealth
                - survival
      - id: srd51.feature.college-of-lore.cutting-words
        name:
          en: Cutting Words
        source: srd51
        text:
          en: Also at 3rd level, you learn how to use your wit to distract, confuse, and otherwise sap the confidence and competence of others. When a creature that you can see within 60 feet of you makes an attack roll, an ability check, or a damage roll, you can use your reaction to expend one of your uses of Bardic Inspiration, rolling a Bardic Inspiration die and subtracting the number rolled from the creature's roll. You can choose to use this feature after the creature makes its roll, but before the GM determines whether the attack roll or ability check succeeds or fails, or before the creature deals its damage. The creature is immune if it can't hear you or if it's immune to being charmed.
        effects:
          - kind: add-action
            action: cutting-words
            name:
              en: Cutting Words
            activation: reaction
            trigger:
              en: when a creature that you can see within 60 feet of you makes an attack roll, an ability check, or a damage roll
            cost:
              - resource: bardic-inspiration
                amount: 1
            range:
              type: point
              distance: 60
            text:
              en: Expend one use of Bardic Inspiration, rolling a Bardic Inspiration die and subtracting the number rolled from the creature's roll. You can do so after the creature makes its roll, but before the GM determines whether the attack roll or ability check succeeds or fails, or before the creature deals its damage. The creature is immune if it can't hear you or if it's immune to being charmed.
            onUse:
              - kind: note
                text:
                  en: Roll a Bardic Inspiration die (size table(bard.bardic-inspiration-die)) and subtract it from the creature's roll.
  "6":
    features:
      - id: srd51.feature.college-of-lore.additional-magical-secrets
        name:
          en: Additional Magical Secrets
        source: srd51
        text:
          en: At 6th level, you learn two spells of your choice from any class. A spell you choose must be of a level you can cast, as shown on the Bard table, or a cantrip. The chosen spells count as bard spells for you but don't count against the number of bard spells you know.
        effects:
          - kind: open-choice
            choice: additional-magical-secrets
            of: spell
            count: 2
            level: 6
            filter:
              type: spell
              maxLevel: 3
            note:
              en: Two spells from any class, of a level you can cast or cantrips; they count as bard spells but don't count against the number of bard spells you know.
  "14":
    features:
      - id: srd51.feature.college-of-lore.peerless-skill
        name:
          en: Peerless Skill
        source: srd51
        text:
          en: Starting at 14th level, when you make an ability check, you can expend one use of Bardic Inspiration. Roll a Bardic Inspiration die and add the number rolled to your ability check. You can choose to do so after you roll the die for the ability check, but before the GM tells you whether you succeed or fail.
        effects:
          - kind: add-action
            action: peerless-skill
            name:
              en: Peerless Skill
            activation: free
            cost:
              - resource: bardic-inspiration
                amount: 1
            text:
              en: When you make an ability check, you can expend one use of Bardic Inspiration. Roll a Bardic Inspiration die and add the number rolled to your ability check. You can choose to do so after you roll the die for the ability check, but before the GM tells you whether you succeed or fail.
            onUse:
              - kind: note
                text:
                  en: Add a Bardic Inspiration die (size table(bard.bardic-inspiration-die)) to your ability check.
