  "6":
    features:
      - id: srd51.feature.circle-of-the-land.lands-stride
        name:
          en: Land's Stride
        source: srd51
        text:
          en: |-
            Starting at 6th level, moving through nonmagical difficult terrain costs you no extra movement. You can also pass through nonmagical plants without being slowed by them and without taking damage from them if they have thorns, spines, or a similar hazard.

            In addition, you have advantage on saving throws against plants that are magically created or manipulated to impede movement, such those created by the entangle spell.
        effects:
          - kind: add-text
            section: features
            text:
              en: Moving through nonmagical difficult terrain costs you no extra movement. You can also pass through nonmagical plants without being slowed by them and without taking damage from them if they have thorns, spines, or a similar hazard.
            note:
              en: "Play mode: difficult terrain and plant hazards are situational and not tracked by the engine."
          - kind: roll-advantage
            on:
              type: save
              against:
                - plants that are magically created or manipulated to impede movement
  "10":
    features:
      - id: srd51.feature.circle-of-the-land.natures-ward
        name:
          en: Nature's Ward
        source: srd51
        text:
          en: When you reach 10th level, you can't be charmed or frightened by elementals or fey, and you are immune to poison and disease.
        effects:
          - kind: defense
            defense: immunity
            to:
              - poison
              - disease
          - kind: defense
            defense: condition-immunity
            to:
              - srd51.condition.poisoned
          - kind: add-text
            section: conditions
            text:
              en: You can't be charmed or frightened by elementals or fey.
            note:
              en: "Gap: a condition immunity limited to elementals and fey as the source; defense cannot scope by source, so it is shown as text."
  "14":
    features:
      - id: srd51.feature.circle-of-the-land.natures-sanctuary
        name:
          en: Nature's Sanctuary
        source: srd51
        text:
          en: |-
            When you reach 14th level, creatures of the natural world sense your connection to nature and become hesitant to attack you. When a beast or plant creature attacks you, that creature must make a Wisdom saving throw against your druid spell save DC. On a failed save, the creature must choose a different target, or the attack automatically misses. On a successful save, the creature is immune to this effect for 24 hours.

            The creature is aware of this effect before it makes its attack against you.
        effects:
          - kind: add-text
            section: features
            text:
              en: When a beast or plant creature attacks you, that creature must make a Wisdom saving throw against your druid spell save DC. On a failed save, the creature must choose a different target, or the attack automatically misses. On a successful save, the creature is immune to this effect for 24 hours. The creature is aware of this effect before it makes its attack against you.
            note:
              en: "Play mode: a passive effect resolved by the attacker's save against your spell save DC; nothing derived on the sheet beyond the DC."
