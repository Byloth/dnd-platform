id: srd51.subclass.druid.circle-of-the-land
name:
  en: Circle of the Land
source: srd51
class: srd51.class.druid
levels:
  "2":
    features:
      - id: srd51.feature.circle-of-the-land.bonus-cantrip
        name:
          en: Bonus Cantrip
        source: srd51
        text:
          en: When you choose this circle at 2nd level, you learn one additional druid cantrip of your choice.
        effects:
          - kind: open-choice
            choice: bonus-cantrip
            of: spell
            count: 1
            filter:
              type: spell
              list: srd51.spell-list.druid
              level: 0
            note:
              en: One additional druid cantrip, in addition to the Cantrips Known column of the Druid table.
      - id: srd51.feature.circle-of-the-land.natural-recovery
        name:
          en: Natural Recovery
        source: srd51
        text:
          en: |-
            Starting at 2nd level, you can regain some of your magical energy by sitting in meditation and communing with nature. During a short rest, you choose expended spell slots to recover. The spell slots can have a combined level that is equal to or less than half your druid level (rounded up), and none of the slots can be 6th level or higher. You can't use this feature again until you finish a long rest.

            For example, when you are a 4th-level druid, you can recover up to two levels worth of spell slots. You can recover either a 2nd-level slot or two 1st-level slots.
        effects:
          - kind: declare-resource
            resource: natural-recovery
            name:
              en: Natural Recovery
            max: 1
            display: pips
            recharge:
              - on: long-rest
                amount: full
          - kind: add-action
            action: natural-recovery
            name:
              en: Natural Recovery
            activation: special
            cost:
              - resource: natural-recovery
                amount: 1
            trigger:
              en: during a short rest
            text:
              en: During a short rest, you choose expended spell slots to recover. The spell slots can have a combined level that is equal to or less than half your druid level (rounded up), and none of the slots can be 6th level or higher.
            onUse:
              - kind: restoreResource
                resource: spell-slots
                amount: ceil(classLevel(druid) / 2)
                budget: ceil(classLevel(druid) / 2)
                note:
                  en: Combined slot level up to half your druid level (rounded up); no slot of 6th level or higher.
  "3":
    features:
      - id: srd51.feature.circle-of-the-land.circle-spells
        name:
          en: Circle Spells
        source: srd51
        text:
          en: |-
            Your mystical connection to the land infuses you with the ability to cast certain spells. At 3rd, 5th, 7th, and 9th level you gain access to circle spells connected to the land where you became a druid. Choose that land-arctic, coast, desert, forest, grassland, mountain, or swamp-and consult the associated list of spells. 

            Once you gain access to a circle spell, you always have it prepared, and it doesn't count against the number of spells you can prepare each day. If you gain access to a spell that doesn't appear on the druid spell list, the spell is nonetheless a druid spell for you.

            **Arctic (table)**
            | Druid Level | Circle Spells  | 
            |---|---| 
            | 3rd | hold person, spike growth | 
            | 5th | sleet storm, slow | 
            | 7th | freedom of movement, ice storm  | 
            | 9th | commune with nature, cone of cold | 
             
            **Coast (table)** 
             
            | Druid Level | Circle Spells  | 
            |---|---| 
            | 3rd | mirror image, misty step | 
            | 5th | water breathing, water walk  | 
            | 7th | control water, freedom of movement | 
            | 9th | conjure elemental, scrying | 
             
            **Desert (table)** 
             
            | Druid Level | Circle Spells | 
            |---|---| 
            | 3rd | blur, silence | 
            | 5th | create food and water, protection from energy | 
            | 7th | blight, hallucinatory terrain | 
            | 9th | insect plague, wall of stone  | 
             
            **Forest (table)** 
             
            | Druid Level | Circle Spells  | 
            |---|---| 
            | 3rd | barkskin, spider climb | 
            | 5th | call lightning, plant growth | 
            | 7th | divination, freedom of movement  | 
            | 9th | commune with nature, tree stride | 
             
            **Grassland (table)** 
             
            | Druid Level | Circle Spells  | 
            |---|---| 
            | 3rd | invisibility, pass without trace | 
            | 5th | daylight, haste  | 
            | 7th | divination, freedom of movement  | 
            | 9th | dream, insect plague | 
             
            **Mountain (table)** 
             
            | Druid Level | Circle Spells | 
            |---|---| 
            | 3rd | spider climb, spike growth  | 
            | 5th | lightning bolt, meld into stone | 
            | 7th | stone shape, stoneskin  | 
            | 9th | passwall, wall of stone | 
             
            **Swamp (table)** 
             
            | Druid Level | Circle Spells  | 
            |---|---| 
            | 3rd | acid arrow, darkness | 
            | 5th | water walk, stinking cloud | 
            | 7th | freedom of movement, locate creature | 
            | 9th | insect plague, scrying |
        effects:
