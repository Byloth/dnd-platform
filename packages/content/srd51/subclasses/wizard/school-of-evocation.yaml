id: srd51.subclass.wizard.school-of-evocation
name:
  en: School of Evocation
source: srd51
class: srd51.class.wizard
levels:
  "2":
    features:
      - id: srd51.feature.school-of-evocation.evocation-savant
        name:
          en: Evocation Savant
        source: srd51
        text:
          en: Beginning when you select this school at 2nd level, the gold and time you must spend to copy an evocation spell into your spellbook is halved.
      - id: srd51.feature.school-of-evocation.sculpt-spells
        name:
          en: Sculpt Spells
        source: srd51
        text:
          en: Beginning at 2nd level, you can create pockets of relative safety within the effects of your evocation spells. When you cast an evocation spell that affects other creatures that you can see, you can choose a number of them equal to 1 + the spell's level. The chosen creatures automatically succeed on their saving throws against the spell, and they take no damage if they would normally take half damage on a successful save.
        effects:
          - kind: add-text
            section: features
            text:
              en: When you cast an evocation spell that affects other creatures that you can see, you can choose a number of them equal to 1 + the spell's level. The chosen creatures automatically succeed on their saving throws against the spell, and they take no damage if they would normally take half damage on a successful save.
            note:
              en: Sparing chosen creatures from your evocation spells happens on cast against other creatures, which the play engine does not model.
  "6":
    features:
      - id: srd51.feature.school-of-evocation.potent-cantrip
        name:
          en: Potent Cantrip
        source: srd51
        text:
          en: Starting at 6th level, your damaging cantrips affect even creatures that avoid the brunt of the effect. When a creature succeeds on a saving throw against your cantrip, the creature takes half the cantrip's damage (if any) but suffers no additional effect from the cantrip.
        effects:
          - kind: add-text
            section: features
            text:
              en: When a creature succeeds on a saving throw against your cantrip, the creature takes half the cantrip's damage (if any) but suffers no additional effect from the cantrip.
            note:
              en: Half damage on a successful save against your cantrips is resolved on the target's save, which the play engine does not model.
  "10":
    features:
      - id: srd51.feature.school-of-evocation.empowered-evocation
        name:
          en: Empowered Evocation
        source: srd51
        text:
          en: Beginning at 10th level, you can add your Intelligence modifier to one damage roll of any wizard evocation spell you cast.
        effects:
          - kind: modify
            target: damage.spell.bonus
            op: add
            formula: mod(int)
            note:
              en: Only to one damage roll of a wizard evocation spell you cast; the bonus cannot be limited to a school, so ignore it on other spells.
  "14":
    features:
      - id: srd51.feature.school-of-evocation.overchannel
        name:
          en: Overchannel
        source: srd51
        text:
          en: |-
            Starting at 14th level, you can increase the power of your simpler spells. When you cast a wizard spell of 1st through 5th level that deals damage, you can deal maximum damage with that spell.

            The first time you do so, you suffer no adverse effect. If you use this feature again before you finish a long rest, you take 2d12 necrotic damage for each level of the spell, immediately after you cast it. Each time you use this feature again before finishing a long rest, the necrotic damage per spell level increases by 1d12. This damage ignores resistance and immunity.
        effects:
          - kind: declare-resource
            resource: overchannel
            name:
              en: Overchannel uses
            max: unlimited
            display: counter
            recharge:
              - on: long-rest
                amount: full
            note:
              en: Counts how many times you have used Overchannel since your last long rest; the necrotic damage escalates with each use after the first.
          - kind: add-action
            action: overchannel
            name:
              en: Overchannel
            activation: free
            cost:
              - resource: overchannel
                amount: 1
            text:
              en: When you cast a wizard spell of 1st through 5th level that deals damage, you can deal maximum damage with that spell. The first time you do so, you suffer no adverse effect. If you use this feature again before you finish a long rest, you take 2d12 necrotic damage for each level of the spell, immediately after you cast it. Each time you use this feature again before finishing a long rest, the necrotic damage per spell level increases by 1d12. This damage ignores resistance and immunity.
            onUse:
              - kind: note
                text:
                  en: "The spell deals maximum damage. If this is not your first use since a long rest, you take necrotic damage immediately after casting: 2d12 per spell level on the second use, 3d12 per level on the third, and so on. This damage ignores resistance and immunity."
            note:
              en: The escalating self-damage depends on the number of uses and the spell's level, which a play effect cannot compute yet; roll it by hand from the counter.
