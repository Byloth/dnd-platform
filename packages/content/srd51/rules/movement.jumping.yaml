id: srd51.rule.movement.jumping
name:
  en: Jumping
source: srd51
category: movement
text:
  en: |-
    Your Strength determines how far you can jump.

    **Long Jump.** When you make a long jump, you cover a number of feet upto your Strength score if you move at least 10 feet on foot immediatelybefore the jump. When you make a standing long jump, you can leap onlyhalf that distance. Either way, each foot you clear on the jump costs afoot of movement.
    This rule assumes that the height of your jump doesn't matter, such as ajump across a stream or chasm. At your GM's option, you must succeed ona DC 10 Strength (Athletics) check to clear a low obstacle (no tallerthan a quarter of the jump's distance), such as a hedge or low wall.
    Otherwise, you hit it.
    When you land in difficult terrain, you must succeed on a DC 10Dexterity (Acrobatics) check to land on your feet. Otherwise, you landprone.

    **High Jump.** When you make a high jump, you leap into the air a numberof feet equal to 3 + your Strength modifier if you move at least 10 feeton foot immediately before the jump. When you make a standing high jump,you can jump only half that distance. Either way, each foot you clear onthe jump costs a foot of movement. In some circumstances, your GM mightallow you to make a Strength (Athletics) check to jump higher than younormally can.
    You can extend your arms half your height above yourself during thejump. Thus, you can reach above you a distance equal to the height ofthe jump plus 1½ times your height.
