id: srd51.rule.attacking.shoving
name:
  en: Shoving a Creature
source: srd51
category: combat
text:
  en: |-
    Using the Attack action, you can make a special melee attack to shove a creature, either to knock it srd:prone or push it away from you. If you're able to make multiple attacks with the Attack action, this attack replaces one of them.

    The target must be no more than one size larger than you and must be within your reach. Instead of making an attack roll, you make a Strength (Athletics) check contested by the target's Strength (Athletics) or Dexterity (Acrobatics) check (the target chooses the ability to use). If you win the contest, you either knock the target srd:prone or push it 5 feet away from you.
tags:
  - attacking
