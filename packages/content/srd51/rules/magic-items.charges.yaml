id: srd51.rule.magic-items.charges
name:
  en: Charges
source: srd51
category: general
text:
  en: Some magic items have charges that must be expended to activate their properties. The number of charges an item has remaining is revealed when an identify spell is cast on it, as well as when a creature attunes to it. Additionally, when an item regains charges, the creature attuned to it learns how many charges it regained.
