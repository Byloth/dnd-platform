name:
  en: Falling
source: srd51
category: general
text:
  en: A fall from a great height is one of the most common hazards facing anadventurer. At the end of a fall, a creature takes 1d6 bludgeoningdamage for every 10 feet it fell, to a maximum of 20d6. The creaturelands prone, unless it avoids taking damage from the fall.
