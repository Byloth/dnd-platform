id: srd51.rule.magic-items.paired-items
name:
  en: Paired Items
source: srd51
category: general
text:
  en: Items that come in pairs—such as boots, bracers, gauntlets, and gloves—impart their benefits only if both items of the pair are worn. For example, a character wearing a boot of striding and springing on one foot and a boot of elvenkind on the other foot gains no benefit from either.
