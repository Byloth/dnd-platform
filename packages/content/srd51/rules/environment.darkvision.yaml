name:
  en: Blindsight
source: srd51
category: general
text:
  en: Many creatures in fantasy gaming worlds, especially those that dwell underground, have darkvision. Within a specified range, a creature withdarkvision can see in darkness as if the darkness were dim light, soareas of darkness are only lightly obscured as far as that creature is concerned. However, the creature can't discern color in darkness, only shades of gray.
