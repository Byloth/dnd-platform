id: srd51.rule.environment.suffocating
name:
  en: Suffocating
source: srd51
category: general
text:
  en: |-
    A creature can hold its breath for a number of minutes equal to 1 + itsConstitution modifier (minimum of 30 seconds).
    When a creature runs out of breath or is choking, it can survive for anumber of rounds equal to its Constitution modifier (minimum of 1round). At the start of its next turn, it drops to 0 hit points and isdying, and it can't regain hit points or be stabilized until it canbreathe again.
    For example, a creature with a Constitution of 14 can hold its breathfor 3 minutes. If it starts suffocating, it has 2 rounds to reach airbefore it drops to 0 hit points.
tags:
  - environment
