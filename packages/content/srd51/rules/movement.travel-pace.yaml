id: srd51.rule.movement.travel-pace
name:
  en: Travel Pace
source: srd51
category: movement
text:
  en: |-
    While traveling, a group of adventurers can move at a normal, fast, orslow pace, as shown on the Travel Pace table. The table states how farthe party can move in a period of time and whether the pace has anyeffect. A fast pace makes characters less perceptive, while a slow pacemakes it possible to sneak around and to search an area more carefully.

    **Forced March.** The Travel Pace table assumes that characters travelfor 8 hours in day. They can push on beyond that limit, at the risk of exhaustion.

    For each additional hour of travel beyond 8 hours, the characters coverthe distance shown in the Hour column for their pace, and each charactermust make a Constitution saving throw at the end of the hour. The DC is 10 + 1 for each hour past 8 hours. On a failed saving throw, a charactersuffers one level of exhaustion.

    **Mounts and Vehicles.** For short spans of time (up to an hour), many animals move much faster than humanoids. A mounted character can ride at a gallop for about an hour, covering twice the usual distance for a fastpace. If fresh mounts are available every 8 to 10 miles, characters cancover larger distances at this pace, but this is very rare except indensely populated areas.
    Characters in wagons, carriages, or other land vehicles choose a pace asnormal. Characters in a waterborne vessel are limited to the speed ofthe vessel, and they don't suffer penalties for a fast pace or gainbenefits from a slow pace. Depending on the vessel and the size of thecrew, ships might be able to travel for up to 24 hours per day.
    Certain special mounts, such as a pegasus or griffon, or specialvehicles, such as a carpet of flying, allow you to travel more swiftly.
