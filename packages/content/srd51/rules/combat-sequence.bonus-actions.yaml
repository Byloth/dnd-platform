id: srd51.rule.combat-sequence.bonus-actions
name:
  en: Bonus Actions
source: srd51
category: combat
text:
  en: |-
    Various class features, spells, and other abilities let you take an additional action on your turn called a bonus action. The Cunning Action feature, for example, allows a rogue to take a bonus action. You can take a bonus action only when a special ability, spell, or other feature of the game states that you can do something as a bonus action. You otherwise don't have a bonus action to take.

    > **Sage Advice**

    > Actions and bonus actions can't be exchanged. If you have two abilities that require bonus actions to activate you can only use one, even if you take no other actions.

    > Source: [Sage Advice > Compendium](http://media.wizards.com/2015/downloads/dnd/SA_Compendium_1.01.pdf)

    You can take only one bonus action on your turn, so you must choose which bonus action to use when you have more than one available.

    You choose when to take a bonus action during your turn, unless the bonus action's timing is specified, and anything that deprives you of your ability to take actions also prevents you from taking a bonus action.
