id: srd51.rule.monsters.size
name:
  en: Size
source: srd51
category: general
text:
  en: |-
    A monster can be Tiny, Small, Medium, Large, Huge, or Gargantuan. The Size Categories table shows how much space a creature of a particular size controls in combat. See the *Player’s Handbook* for more information on creature size and space.

    ### Size Categories

    | Size | Space | Examples |
    |--------|----------|---------------|
    | Tiny | 2½ by 2½ ft. | Imp, sprite |
    | Small | 5 b 5 ft. | Giant rat, goblin |
    | Medium | 5 b 5 ft. | Orc, werewolf |
    | Large | 10 b 10 ft. | Hippogriff, ogre |
    | Huge | 15 b 15 ft. | Fire giant, treant |
    | Gargantuan | 20 b 20 ft. or larger | Kraken, purple worm
