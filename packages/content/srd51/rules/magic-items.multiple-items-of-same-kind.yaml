id: srd51.rule.magic-items.multiple-items-of-same-kind
name:
  en: Multiple Items of the Same Kind
source: srd51
category: general
text:
  en: Use common sense to determine whether more than one of a given kind of magic item can be worn. A character can’t normally wear more than one pair of footwear, one pair of gloves or gauntlets, one pair of bracers, one suit of armor, one item of headwear, and one cloak. You can make exceptions; a character might be able to wear a circlet under a helmet, for example, or to layer two cloaks.
tags:
