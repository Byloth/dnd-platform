id: srd51.rule.multiclassing.experience-points
name:
  en: Experience Points
source: srd51
category: general
text:
  en: The experience point cost to gain a level is always based on your total character level, as shown in the Character Advancement table, not your level in a particular class. So, if you are a cleric 6/fighter 1, you must gain enough XP to reach 8th level before you can take your second level as a fighter or your seventh level as a cleric.
