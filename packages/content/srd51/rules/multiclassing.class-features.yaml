id: srd51.rule.multiclassing.class-features
name:
  en: Class Features
source: srd51
category: general
text:
  en: "When you gain a new level in a class, you get its features for that level. You don't, however, receive the class's starting equipment, and a few features have additional rules when you're multiclassing: Channel Divinity, Extra Attack, Unarmored Defense, and Spellcasting."
