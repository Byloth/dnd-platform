id: srd51.rule.attacking.ranged-attacks-in-close-combat
name:
  en: Ranged Attacks in Close Combat
source: srd51
category: combat
text:
  en: Aiming a ranged attack is more difficult when a foe is next to you. When you make a ranged attack with a weapon, a spell, or some other means, you have disadvantage on the attack roll if you are within 5 feet of a hostile creature who can see you and who isn't incapacitated.
