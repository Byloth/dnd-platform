id: srd51.rule.spellcasting.cantrips
name:
  en: Cantrips
source: srd51
category: spellcasting
text:
  en: A cantrip is a spell that can be cast at will, without using a spell slot and without being prepared in advance. Repeated practice has fixed the spell in the caster's mind and infused the caster with the magic needed to produce the effect over and over. A cantrip's spell level is 0.
