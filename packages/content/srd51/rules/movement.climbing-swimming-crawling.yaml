name:
  en: Climbing, Swimming and Crawling
source: srd51
category: movement
text:
  en: While climbing or swimming, each foot of movement costs 1 extra foot (2extra feet in difficult terrain), unless a creature has a climbing orswimming speed. At the GM's option, climbing a slippery vertical surfaceor one with few handholds requires a successful Strength (Athletics) check. Similarly, gaining any distance in rough water might require asuccessful Strength (Athletics) check.
