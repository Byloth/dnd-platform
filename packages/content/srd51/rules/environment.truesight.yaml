text:
  en: A creature with truesight can, out to a specific range, see in normal and magical darkness, see invisible creatures and objects,automatically detect visual illusions and succeed on saving throwsagainst them, and perceives the original form of a shapechanger or acreature that is transformed by magic. Furthermore, the creature can see into the Ethereal Plane.
