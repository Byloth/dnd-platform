# Generated by tools/import (map stage) from the SRD 5.1 datasets pinned in tools/import/sources.lock.yaml.
# Mechanics come from tools/import/overlay/<entity-id>.yaml; edit those, then re-run `node tools/import/src/map.ts`.
id: srd51.species.dragonborn
name:
  en: Dragonborn
source: srd51
text:
  en: Your draconic heritage manifests in a variety of traits you share with other dragonborn.
size: medium
speed:
  walk: 30
languages:
  fixed:
    - common
    - draconic
features:
  - id: srd51.feature.dragonborn.ability-score-increase
    name:
      en: Ability Score Increase
    source: srd51
    text:
      en: Your Strength score increases by 2, and your Charisma score increases by 1.
    effects:
      - kind: modify
        target: ability.str
        op: add
        value: 2
      - kind: modify
        target: ability.cha
        op: add
        value: 1
  - id: srd51.feature.dragonborn.speed
    name:
      en: Speed
    source: srd51
    text:
      en: Your base walking speed is 30 feet.
  - id: srd51.feature.dragonborn.age
    name:
      en: Age
    source: srd51
    text:
      en: Young dragonborn grow quickly. They walk hours after hatching, attain the size and development of a 10-year-old human child by the age of 3, and reach adulthood by 15. They live to be around 80.
  - id: srd51.feature.dragonborn.alignment
    name:
      en: Alignment
    source: srd51
    text:
      en: Dragonborn tend to extremes, making a conscious choice for one side or the other in the cosmic war between good and evil. Most dragonborn are good, but those who side with evil can be terrible villains.
  - id: srd51.feature.dragonborn.size
    name:
      en: Size
    source: srd51
    text:
      en: Dragonborn are taller and heavier than humans, standing well over 6 feet tall and averaging almost 250 pounds. Your size is Medium.
  - id: srd51.feature.dragonborn.languages
    name:
      en: Languages
    source: srd51
    text:
      en: You can speak, read, and write Common and Draconic. Draconic is thought to be one of the oldest languages and is often used in the study of magic. The language sounds harsh to most other creatures and includes numerous hard consonants and sibilants.
  - id: srd51.feature.dragonborn.draconic-ancestry-table
    name:
      en: Draconic Ancestry table
    source: srd51
    text:
      en: |-
        | Dragon       | Damage Type       | Breath Weapon                |
        |--------------|-------------------|------------------------------|
        | Black        | Acid              | 5 by 30 ft. line (Dex. save) |
        | Blue         | Lightning         | 5 by 30 ft. line (Dex. save) |
        | Brass        | Fire              | 5 by 30 ft. line (Dex. save) |
        | Bronze       | Lightning         | 5 by 30 ft. line (Dex. save) |
        | Copper       | Acid              | 5 by 30 ft. line (Dex. save) |
        | Gold         | Fire              | 15 ft. cone (Dex. save)      |
        | Green        | Poison            | 15 ft. cone (Con. save)      |
        | Red          | Fire              | 15 ft. cone (Dex. save)      |
        | Silver       | Cold              | 15 ft. cone (Con. save)      |
        | White        | Cold              | 15 ft. cone (Con. save)      |
  - id: srd51.feature.dragonborn.draconic-ancestry
    name:
      en: Draconic Ancestry
    source: srd51
    text:
      en: You have draconic ancestry. Choose one type of dragon from the Draconic Ancestry table. Your breath weapon and damage resistance are determined by the dragon type, as shown in the table.
    effects:
      - kind: open-choice
        choice: draconic-ancestry
        of: option
        count: 1
        options:
          - id: black
            name:
              en: Black
            text:
              en: "Acid damage. Breath weapon: 5 by 30 ft. line (Dex. save)."
          - id: blue
            name:
              en: Blue
            text:
              en: "Lightning damage. Breath weapon: 5 by 30 ft. line (Dex. save)."
          - id: brass
            name:
              en: Brass
            text:
              en: "Fire damage. Breath weapon: 5 by 30 ft. line (Dex. save)."
          - id: bronze
            name:
              en: Bronze
            text:
              en: "Lightning damage. Breath weapon: 5 by 30 ft. line (Dex. save)."
          - id: copper
            name:
              en: Copper
            text:
              en: "Acid damage. Breath weapon: 5 by 30 ft. line (Dex. save)."
          - id: gold
            name:
              en: Gold
            text:
              en: "Fire damage. Breath weapon: 15 ft. cone (Dex. save)."
          - id: green
            name:
              en: Green
            text:
              en: "Poison damage. Breath weapon: 15 ft. cone (Con. save)."
          - id: red
            name:
              en: Red
            text:
              en: "Fire damage. Breath weapon: 15 ft. cone (Dex. save)."
          - id: silver
            name:
              en: Silver
            text:
              en: "Cold damage. Breath weapon: 15 ft. cone (Con. save)."
          - id: white
            name:
              en: White
            text:
              en: "Cold damage. Breath weapon: 15 ft. cone (Con. save)."
        note:
          en: The damage resistance and the breath weapon of the chosen dragon are applied by the Damage Resistance and Breath Weapon traits.
  - id: srd51.feature.dragonborn.breath-weapon
    name:
      en: Breath Weapon
    source: srd51
    text:
      en: |-
        You can use your action to exhale destructive energy. Your draconic ancestry determines the size, shape, and damage type of the exhalation.
        When you use your breath weapon, each creature in the area of the exhalation must make a saving throw, the type of which is determined by your draconic ancestry. The DC for this saving throw equals 8 + your Constitution modifier + your proficiency bonus. A creature takes 2d6 damage on a failed save, and half as much damage on a successful one. The damage increases to 3d6 at 6th level, 4d6 at 11th level, and 5d6 at 16th level.
    effects:
      - kind: declare-resource
        resource: breath-weapon
        name:
          en: Breath Weapon
        max: 1
        recharge:
          - on: short-rest
            amount: full
          - on: long-rest
            amount: full
        display: pips
        note:
          en: Once per short or long rest; the imported text omits the rest sentence, the limit follows the SRD.
      - kind: add-action
        action: breath-weapon
        name:
          en: Breath Weapon
        activation: action
        cost:
          - resource: breath-weapon
            amount: 1
        dc: 8 + mod(con) + proficiencyBonus
        rolls:
          - type: save
            onSuccess: half
          - type: damage
            dice: 2d6
        text:
          en: You exhale destructive energy in the area determined by your draconic ancestry. Each creature in the area must make a saving throw (DC 8 + your Constitution modifier + your proficiency bonus), taking 2d6 damage on a failed save and half as much on a successful one. The damage increases to 3d6 at 6th level, 4d6 at 11th level, and 5d6 at 16th level.
        onUse:
          - kind: note
            text:
              en: "Area, save ability and damage type follow your Draconic Ancestry: black/blue/brass/bronze/copper 5 by 30 ft. line (Dex. save); gold/red 15 ft. cone (Dex. save); green/silver/white 15 ft. cone (Con. save). Damage: 2d6, 3d6 at 6th level, 4d6 at 11th, 5d6 at 16th."
        note:
          en: The damage dice scale with character level and the shape, save and damage type vary with the ancestry answer; v0 carries them in the note.
  - id: srd51.feature.dragonborn.damage-resistance
    name:
      en: Damage Resistance
    source: srd51
    text:
      en: You have resistance to the damage type associated with your draconic ancestry.
    effects:
      - kind: defense
        defense: resistance
        to:
          - acid
        when:
          answer:
