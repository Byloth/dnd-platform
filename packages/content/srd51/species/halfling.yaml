id: srd51.species.halfling
name:
  en: Halfling
source: srd51
text:
  en: Your halfling character has a number of traits in common with all other halflings.
size: small
speed:
  walk: 25
languages:
  fixed:
    - common
    - halfling
features:
  - id: srd51.feature.halfling.ability-score-increase
    name:
      en: Ability Score Increase
    source: srd51
    text:
      en: Your Dexterity score increases by 2.
    effects:
      - kind: modify
        target: ability.dex
        op: add
        value: 2
  - id: srd51.feature.halfling.speed
    name:
      en: Speed
    source: srd51
    text:
      en: Your base walking speed is 25 feet.
  - id: srd51.feature.halfling.age
    name:
      en: Age
    source: srd51
    text:
      en: A halfling reaches adulthood at the age of 20 and generally lives into the middle of his or her second century.
  - id: srd51.feature.halfling.alignment
    name:
      en: Alignment
    source: srd51
    text:
      en: Most halflings are lawful good. As a rule, they are good-hearted and kind, hate to see others in pain, and have no tolerance for oppression. They are also very orderly and traditional, leaning heavily on the support of their community and the comfort of their old ways.
  - id: srd51.feature.halfling.size
    name:
      en: Size
    source: srd51
    text:
      en: Halflings average about 3 feet tall and weigh about 40 pounds. Your size is Small.
  - id: srd51.feature.halfling.languages
    name:
      en: Languages
    source: srd51
    text:
      en: You can speak, read, and write Common and Halfling. The Halfling language isn't secret, but halflings are loath to share it with others. They write very little, so they don't have a rich body of literature. Their oral tradition, however, is very strong. Almost all halflings speak Common to converse with the people in whose lands they dwell or through which they are traveling.
  - id: srd51.feature.halfling.lucky
    name:
      en: Lucky
    source: srd51
    text:
      en: When you roll a 1 on the d20 for an attack roll, ability check, or saving throw, you can reroll the die and must use the new roll.
  - id: srd51.feature.halfling.brave
    name:
      en: Brave
    source: srd51
    text:
      en: You have advantage on saving throws against being frightened.
  - id: srd51.feature.halfling.halfling-nimbleness
    name:
      en: Halfling Nimbleness
    source: srd51
    text:
      en: You can move through the space of any creature that is of a size larger than yours.
subspecies:
  - id: srd51.species.halfling.lightfoot
    name:
      en: Lightfoot
    source: srd51
    text:
      en: As a lightfoot halfling, you can easily hide from notice, even using other people as cover. You're inclined to be affable and get along well with others. Lightfoots are more prone to wanderlust than other halflings, and often dwell alongside other races or take up a nomadic life.
    features:
      - id: srd51.feature.lightfoot.ability-score-increase
        name:
          en: Ability Score Increase
        source: srd51
        text:
          en: Your Charisma score increases by 1.
      - id: srd51.feature.lightfoot.naturally-stealthy
        name:
          en: Naturally Stealthy
        source: srd51
        text:
          en: You can attempt to hide even when you are obscured only by a creature that is at least one size larger than you.
