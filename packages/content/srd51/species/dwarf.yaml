# Generated by tools/import (map stage) from the SRD 5.1 datasets pinned in tools/import/sources.lock.yaml.
# Mechanics come from tools/import/overlay/<entity-id>.yaml; edit those, then re-run `node tools/import/src/map.ts`.
id: srd51.species.dwarf
name:
  en: Dwarf
source: srd51
text:
  en: Your dwarf character has an assortment of inborn abilities, part and parcel of dwarven nature.
size: medium
speed:
  walk: 25
languages:
  fixed:
    - common
    - dwarvish
features:
  - id: srd51.feature.dwarf.ability-score-increase
    name:
      en: Ability Score Increase
    source: srd51
    text:
      en: Your Constitution score increases by 2.
    effects:
      - kind: modify
        target: ability.con
        op: add
        value: 2
  - id: srd51.feature.dwarf.speed
    name:
      en: Speed
    source: srd51
    text:
      en: Your base walking speed is 25 feet. Your speed is not reduced by wearing heavy armor.
    effects:
      - kind: add-text
        section: features
        text:
          en: Your speed is not reduced by wearing heavy armor.
        when:
          armorStrengthUnmet: true
        note:
          en: The heavy-armour speed penalty is a play-mode reminder; no derived value models it in v0.
  - id: srd51.feature.dwarf.darkvision
    name:
      en: Darkvision
    source: srd51
    text:
      en: Accustomed to life underground, you have superior vision in dark and dim conditions. You can see in dim light within 60 feet of you as if it were bright light, and in darkness as if it were dim light. You can't discern color in darkness, only shades of gray.
    effects:
      - kind: modify
        target: sense.darkvision
        op: max
        value: 60
  - id: srd51.feature.dwarf.age
    name:
      en: Age
    source: srd51
    text:
      en: Dwarves mature at the same rate as humans, but they're considered young until they reach the age of 50. On average, they live about 350 years.
    effects: []
  - id: srd51.feature.dwarf.alignment
    name:
      en: Alignment
    source: srd51
    text:
      en: Most dwarves are lawful, believing firmly in the benefits of a well-ordered society. They tend toward good as well, with a strong sense of fair play and a belief that everyone deserves to share in the benefits of a just order.
    effects: []
  - id: srd51.feature.dwarf.size
    name:
      en: Size
    source: srd51
    text:
      en: Dwarves stand between 4 and 5 feet tall and average about 150 pounds. Your size is Medium.
    effects: []
  - id: srd51.feature.dwarf.languages
    name:
      en: Languages
    source: srd51
    text:
      en: You can speak, read, and write Common and Dwarvish. Dwarvish is full of hard consonants and guttural sounds, and those characteristics spill over into whatever other language a dwarf might speak.
    effects:
      - kind: grant-proficiency
        type: language
        items:
          - common
          - dwarvish
  - id: srd51.feature.dwarf.dwarven-resilience
    name:
      en: Dwarven Resilience
    source: srd51
    text:
      en: You have advantage on saving throws against poison, and you have resistance against poison damage.
    effects:
      - kind: roll-advantage
        on:
          type: save
          against:
            - poison
      - kind: defense
        defense: resistance
        to:
          - poison
  - id: srd51.feature.dwarf.dwarven-combat-training
    name:
      en: Dwarven Combat Training
    source: srd51
    text:
      en: You have proficiency with the battleaxe, handaxe, light hammer, and warhammer.
    effects:
      - kind: grant-proficiency
        type: weapon
        items:
          - battleaxe
          - handaxe
          - light-hammer
          - warhammer
  - id: srd51.feature.dwarf.tool-proficiency
    name:
      en: Tool Proficiency
    source: srd51
    text:
      en: "You gain proficiency with the artisan's tools of your choice: smith's tools, brewer's supplies, or mason's tools."
    effects:
      - kind: grant-proficiency
        type: tool
        choose:
          count: 1
          from:
            - smiths-tools
            - brewers-supplies
            - masons-tools
  - id: srd51.feature.dwarf.stonecunning
    name:
      en: Stonecunning
    source: srd51
    text:
      en: Whenever you make an Intelligence (History) check related to the origin of stonework, you are considered proficient in the History skill and add double your proficiency bonus to the check, instead of your normal proficiency bonus.
    effects:
      - kind: add-text
        section: features
        text:
          en: Double proficiency bonus on Intelligence (History) checks about the origin of stonework.
        note:
          en: "Situational: the player asserts the check is about stonework; not derived."
subspecies:
  - id: srd51.species.dwarf.hill-dwarf
    name:
      en: Hill Dwarf
    source: srd51
    text:
      en: As a hill dwarf, you have keen senses, deep intuition, and remarkable resilience.
    features:
      - id: srd51.feature.hill-dwarf.ability-score-increase
        name:
          en: Ability Score Increase
        source: srd51
        text:
          en: Your Wisdom score increases by 1.
        effects:
          - kind: modify
            target: ability.wis
            op: add
            value: 1
      - id: srd51.feature.hill-dwarf.dwarven-toughness
        name:
          en: Dwarven Toughness
        source: srd51
        text:
          en: Your hit point maximum increases by 1, and it increases by 1 every time you gain a level.
        effects:
          - kind: modify
            target: hp.perLevel
            op: add
            value: 1
            note:
              en: +1 hit point per level, including the first.
