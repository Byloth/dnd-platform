# Generated by tools/import (map stage) from the SRD 5.1 datasets pinned in tools/import/sources.lock.yaml.
# Mechanics come from tools/import/overlay/<entity-id>.yaml; edit those, then re-run `node tools/import/src/map.ts`.
id: srd51.species.tiefling
name:
  en: Tiefling
source: srd51
text:
  en: Tieflings share certain racial traits as a result of their infernal descent.
size: medium
speed:
  walk: 30
languages:
  fixed:
    - common
    - infernal
features:
  - id: srd51.feature.tiefling.ability-score-increase
    name:
      en: Ability Score Increase
    source: srd51
    text:
      en: Your Intelligence score increases by 1, and your Charisma score increases by 2.
    effects:
      - kind: modify
        target: ability.int
        op: add
        value: 1
      - kind: modify
        target: ability.cha
        op: add
        value: 2
  - id: srd51.feature.tiefling.speed
    name:
      en: Speed
    source: srd51
    text:
      en: Your base walking speed is 30 feet.
  - id: srd51.feature.tiefling.darkvision
    name:
      en: Darkvision
    source: srd51
    text:
      en: Thanks to your infernal heritage, you have superior vision in dark and dim conditions. You can see in dim light within 60 feet of you as if it were bright light, and in darkness as if it were dim light. You can't discern color in darkness, only shades of gray.
    effects:
      - kind: modify
        target: sense.darkvision
        op: max
        value: 60
  - id: srd51.feature.tiefling.age
    name:
      en: Age
    source: srd51
    text:
      en: Tieflings mature at the same rate as humans but live a few years longer.
  - id: srd51.feature.tiefling.alignment
    name:
      en: Alignment
    source: srd51
    text:
      en: Tieflings might not have an innate tendency toward evil, but many of them end up there. Evil or not, an independent nature inclines many tieflings toward a chaotic alignment.
  - id: srd51.feature.tiefling.size
    name:
      en: Size
    source: srd51
    text:
      en: Tieflings are about the same size and build as humans. Your size is Medium.
  - id: srd51.feature.tiefling.languages
    name:
      en: Languages
    source: srd51
    text:
      en: You can speak, read, and write Common and Infernal.
  - id: srd51.feature.tiefling.hellish-resistance
    name:
      en: Hellish Resistance
    source: srd51
    text:
      en: You have resistance to fire damage.
    effects:
      - kind: defense
        defense: resistance
        to:
          - fire
  - id: srd51.feature.tiefling.infernal-legacy
    name:
      en: Infernal Legacy
    source: srd51
    text:
      en: You know the thaumaturgy cantrip. When you reach 3rd level, you can cast the hellish rebuke spell as a 2nd-level spell once with this trait and regain the ability to do so when you finish a long rest. When you reach 5th level, you can cast the darkness spell once with this trait and regain the ability to do so when you finish a long rest. Charisma is your spellcasting ability for these spells.
    effects:
      - kind: grant-spells
        spells:
          - srd51.spell.thaumaturgy
        as: known
        ability: cha
      - kind: grant-spells
        spells:
          - srd51.spell.hellish-rebuke
        as: always-prepared
        ability: cha
        level: 2
        uses:
          count: 1
          recharge: long-rest
        when:
          level:
            min: 3
      - kind: grant-spells
        spells:
          - srd51.spell.darkness
        as: always-prepared
        ability: cha
        uses:
          count: 1
          recharge: long-rest
        when:
          level:
            min: 5
