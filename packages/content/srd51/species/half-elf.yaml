# Generated by tools/import (map stage) from the SRD 5.1 datasets pinned in tools/import/sources.lock.yaml.
# Mechanics come from tools/import/overlay/<entity-id>.yaml; edit those, then re-run `node tools/import/src/map.ts`.
id: srd51.species.half-elf
name:
  en: Half-Elf
source: srd51
text:
  en: Your half-elf character has some qualities in common with elves and some that are unique to half-elves.
size: medium
speed:
  walk: 30
languages:
  fixed:
    - common
    - elvish
  choose: 1
features:
  - id: srd51.feature.half-elf.ability-score-increase
    name:
      en: Ability Score Increase
    source: srd51
    text:
      en: Your Charisma score increases by 2, and two other ability scores of your choice increase by 1.
    effects:
      - kind: modify
        target: ability.cha
        op: add
        value: 2
      - kind: open-choice
        choice: ability-scores
        of: ability
        count: 2
        amount: 1
        from:
          - str
          - dex
          - con
          - int
          - wis
  - id: srd51.feature.half-elf.speed
    name:
      en: Speed
    source: srd51
    text:
      en: Your base walking speed is 30 feet.
  - id: srd51.feature.half-elf.darkvision
    name:
      en: Darkvision
    source: srd51
    text:
      en: Thanks to your elf blood, you have superior vision in dark and dim conditions. You can see in dim light within 60 feet of you as if it were bright light, and in darkness as if it were dim light. You can't discern color in darkness, only shades of gray.
    effects:
      - kind: modify
        target: sense.darkvision
        op: max
        value: 60
  - id: srd51.feature.half-elf.age
    name:
      en: Age
    source: srd51
    text:
      en: Half-elves mature at the same rate humans do and reach adulthood around the age of 20. They live much longer than humans, however, often exceeding 180 years.
  - id: srd51.feature.half-elf.alignment
    name:
      en: Alignment
    source: srd51
    text:
      en: Half-elves share the chaotic bent of their elven heritage. They value both personal freedom and creative expression, demonstrating neither love of leaders nor desire for followers. They chafe at rules, resent others' demands, and sometimes prove unreliable, or at least unpredictable.
  - id: srd51.feature.half-elf.size
    name:
      en: Size
    source: srd51
    text:
      en: Half-elves are about the same size as humans, ranging from 5 to 6 feet tall. Your size is Medium.
  - id: srd51.feature.half-elf.languages
    name:
      en: Languages
    source: srd51
    text:
      en: You can speak, read, and write Common, Elvish, and one extra language of your choice.
  - id: srd51.feature.half-elf.fey-ancestry
    name:
      en: Fey Ancestry
    source: srd51
    text:
      en: You have advantage on saving throws against being charmed, and magic can't put you to sleep.
    effects:
      - kind: roll-advantage
        on:
          type: save
          against:
            - charmed
      - kind: defense
        defense: condition-immunity
        to:
          - magical-sleep
        note:
          en: "Magic can't put you to sleep: sleep is not a listed condition, so this uses the descriptive id magical-sleep."
  - id: srd51.feature.half-elf.skill-versatility
    name:
      en: Skill Versatility
    source: srd51
    text:
      en: You gain proficiency in two skills of your choice.
    effects:
      - kind: grant-proficiency
        type: skill
        choose:
          count: 2
          from:
            - acrobatics
            - animal-handling
            - arcana
            - athletics
            - deception
            - history
            - insight
            - intimidation
            - investigation
            - medicine
            - nature
            - perception
            - performance
            - persuasion
            - religion
            - sleight-of-hand
            - stealth
            - survival
