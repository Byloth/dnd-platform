# Generated by tools/import (map stage) from the SRD 5.1 datasets pinned in tools/import/sources.lock.yaml.
# Mechanics come from tools/import/overlay/<entity-id>.yaml; edit those, then re-run `node tools/import/src/map.ts`.
id: srd51.species.elf
name:
  en: Elf
source: srd51
text:
  en: Your elf character has a variety of natural abilities, the result of thousands of years of elven refinement.
size: medium
speed:
  walk: 30
languages:
  fixed:
    - common
    - elvish
features:
  - id: srd51.feature.elf.ability-score-increase
    name:
      en: Ability Score Increase
    source: srd51
    text:
      en: Your Dexterity score increases by 2.
    effects:
      - kind: modify
        target: ability.dex
        op: add
        value: 2
  - id: srd51.feature.elf.speed
    name:
      en: Speed
    source: srd51
    text:
      en: Your base walking speed is 30 feet.
  - id: srd51.feature.elf.darkvision
    name:
      en: Darkvision
    source: srd51
    text:
      en: Accustomed to twilit forests and the night sky, you have superior vision in dark and dim conditions. You can see in dim light within 60 feet of you as if it were bright light, and in darkness as if it were dim light. You can't discern color in darkness, only shades of gray.
    effects:
      - kind: modify
        target: sense.darkvision
        op: max
        value: 60
  - id: srd51.feature.elf.age
    name:
      en: Age
    source: srd51
    text:
      en: Although elves reach physical maturity at about the same age as humans, the elven understanding of adulthood goes beyond physical growth to encompass worldly experience. An elf typically claims adulthood and an adult name around the age of 100 and can live to be 750 years old.
  - id: srd51.feature.elf.alignment
    name:
      en: Alignment
    source: srd51
    text:
      en: Elves love freedom, variety, and self-­expression, so they lean strongly toward the gentler aspects of chaos. They value and protect others’ freedom as well as their own, and they are more often good than not.
  - id: srd51.feature.elf.size
    name:
      en: Size
    source: srd51
    text:
      en: Elves range from under 5 to over 6 feet tall and have slender builds. Your size is Medium.
  - id: srd51.feature.elf.languages
    name:
      en: Languages
    source: srd51
    text:
      en: You can speak, read, and write Common and Elvish. Elvish is fluid, with subtle intonations and intricate grammar. Elven literature is rich and varied, and their songs and poems are famous among other races. Many bards learn their language so they can add Elvish ballads to their repertoires.
  - id: srd51.feature.elf.keen-senses
    name:
      en: Keen Senses
    source: srd51
    text:
      en: You have proficiency in the Perception skill.
  - id: srd51.feature.elf.fey-ancestry
    name:
      en: Fey Ancestry
    source: srd51
    text:
      en: You have advantage on saving throws against being charmed, and magic can't put you to sleep.
  - id: srd51.feature.elf.trance
    name:
      en: Trance
    source: srd51
    text:
      en: Elves don't need to sleep. Instead, they meditate deeply, remaining semiconscious, for 4 hours a day. (The Common word for such meditation is “trance.”) While meditating, you can dream after a fashion; such dreams are actually mental exercises that have become reflexive through years of practice. After resting in this way, you gain the same benefit that a human does from 8 hours of sleep.
subspecies:
  - id: srd51.species.elf.high-elf
    name:
      en: High Elf
    source: srd51
    text:
      en: As a high elf, you have a keen mind and a mastery of at least the basics of magic. In many fantasy gaming worlds, there are two kinds of high elves. One type is haughty and reclusive, believing themselves to be superior to non-elves and even other elves. The other type is more common and more friendly, and often encountered among humans and other races.
    features:
      - id: srd51.feature.high-elf.ability-score-increase
        name:
          en: Ability Score Increase
        source: srd51
        text:
          en: Your Intelligence score increases by 1.
        effects:
          - kind: modify
            target: ability.int
            op: add
            value: 1
      - id: srd51.feature.high-elf.elf-weapon-training
        name:
          en: Elf Weapon Training
        source: srd51
        text:
          en: You have proficiency with the longsword, shortsword, shortbow, and longbow.
      - id: srd51.feature.high-elf.cantrip
        name:
          en: Cantrip
        source: srd51
        text:
          en: You know one cantrip of your choice from the wizard spell list. Intelligence is your spellcasting ability for it.
      - id: srd51.feature.high-elf.extra-language
        name:
          en: Extra Language
        source: srd51
        text:
          en: You can speak, read, and write one extra language of your choice.
