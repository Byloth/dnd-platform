# Generated by tools/import (map stage) from the SRD 5.1 datasets pinned in tools/import/sources.lock.yaml.
# Mechanics come from tools/import/overlay/<entity-id>.yaml; edit those, then re-run `node tools/import/src/map.ts`.
id: srd51.species.gnome
name:
  en: Gnome
source: srd51
text:
  en: Your gnome character has certain characteristics in common with all other gnomes.
size: small
speed:
  walk: 25
languages:
  fixed:
    - common
    - gnomish
features:
  - id: srd51.feature.gnome.ability-score-increase
    name:
      en: Ability Score Increase
    source: srd51
    text:
      en: Your Intelligence score increases by 2.
    effects:
      - kind: modify
        target: ability.int
        op: add
        value: 2
  - id: srd51.feature.gnome.speed
    name:
      en: Speed
    source: srd51
    text:
      en: Your base walking speed is 25 feet.
  - id: srd51.feature.gnome.darkvision
    name:
      en: Darkvision
    source: srd51
    text:
      en: Accustomed to life underground, you have superior vision in dark and dim conditions. You can see in dim light within 60 feet of you as if it were bright light, and in darkness as if it were dim light. You can't discern color in darkness, only shades of gray.
    effects:
      - kind: modify
        target: sense.darkvision
        op: max
        value: 60
  - id: srd51.feature.gnome.age
    name:
      en: Age
    source: srd51
    text:
      en: Gnomes mature at the same rate humans do, and most are expected to settle down into an adult life by around age 40. They can live 350 to almost 500 years.
  - id: srd51.feature.gnome.alignment
    name:
      en: Alignment
    source: srd51
    text:
      en: Gnomes are most often good. Those who tend toward law are sages, engineers, researchers, scholars, investigators, or inventors. Those who tend toward chaos are minstrels, tricksters, wanderers, or fanciful jewelers. Gnomes are good-hearted, and even the tricksters among them are more playful than vicious.
  - id: srd51.feature.gnome.size
    name:
      en: Size
    source: srd51
    text:
      en: Gnomes are between 3 and 4 feet tall and average about 40 pounds. Your size is Small.
  - id: srd51.feature.gnome.languages
    name:
      en: Languages
    source: srd51
    text:
      en: You can speak, read, and write Common and Gnomish. The Gnomish language, which uses the Dwarvish script, is renowned for its technical treatises and its catalogs of knowledge about the natural world.
  - id: srd51.feature.gnome.gnome-cunning
    name:
      en: Gnome Cunning
    source: srd51
    text:
      en: You have advantage on all Intelligence, Wisdom, and Charisma saving throws against magic.
subspecies:
  - id: srd51.species.gnome.rock-gnome
    name:
      en: Rock Gnome
    source: srd51
    text:
      en: As a rock gnome, you have a natural inventiveness and hardiness beyond that of other gnomes.
    features:
      - id: srd51.feature.rock-gnome.ability-score-increase
        name:
          en: Ability Score Increase
        source: srd51
        text:
          en: Your Constitution score increases by 1.
        effects:
          - kind: modify
            target: ability.con
            op: add
            value: 1
      - id: srd51.feature.rock-gnome.artificers-lore
        name:
          en: Artificer's Lore
        source: srd51
        text:
          en: Whenever you make an Intelligence (History) check related to magic items, alchemical objects, or technological devices, you can add twice your proficiency bonus, instead of any proficiency bonus you normally apply.
      - id: srd51.feature.rock-gnome.tinker
        name:
          en: Tinker
        source: srd51
        text:
          en: |-
            You have proficiency with artisan's tools (tinker's tools). Using those tools, you can spend 1 hour and 10 gp worth of materials to construct a Tiny clockwork device (AC 5, 1 hp). The device ceases to function after 24 hours (unless you spend 1 hour repairing it to keep the device functioning), or when you use your action to dismantle it; at that time, you can reclaim the materials used to create it. You can have up to three such devices active at a time.

            When you create a device, choose one of the following options:
            * _Clockwork Toy._ This toy is a clockwork animal, monster, or person, such as a frog, mouse, bird, dragon, or soldier. When placed on the ground, the toy moves 5 feet across the ground on each of your turns in a random direction. It makes noises as appropriate to the creature it represents.
            * _Fire Starter._ The device produces a miniature flame, which you can use to light a candle, torch, or campfire. Using the device requires your action.
            * _Music Box._ When opened, this music box plays a single song at a moderate volume. The box stops playing when it reaches the song's end or when it is closed.
