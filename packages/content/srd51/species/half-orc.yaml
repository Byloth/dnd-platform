# Generated by tools/import (map stage) from the SRD 5.1 datasets pinned in tools/import/sources.lock.yaml.
# Mechanics come from tools/import/overlay/<entity-id>.yaml; edit those, then re-run `node tools/import/src/map.ts`.
id: srd51.species.half-orc
name:
  en: Half-Orc
source: srd51
text:
  en: Your half-orc character has certain traits deriving from your orc ancestry.
size: medium
speed:
  walk: 30
languages:
  fixed:
    - common
    - orc
features:
  - id: srd51.feature.half-orc.ability-score-increase
    name:
      en: Ability Score Increase
    source: srd51
    text:
      en: Your Strength score increases by 2, and your Constitution score increases by 1.
    effects:
      - kind: modify
        target: ability.str
        op: add
        value: 2
      - kind: modify
        target: ability.con
        op: add
        value: 1
  - id: srd51.feature.half-orc.speed
    name:
      en: Speed
    source: srd51
    text:
      en: Your base walking speed is 30 feet.
  - id: srd51.feature.half-orc.darkvision
    name:
      en: Darkvision
    source: srd51
    text:
      en: Thanks to your orc blood, you have superior vision in dark and dim conditions. You can see in dim light within 60 feet of you as if it were bright light, and in darkness as if it were dim light. You can't discern color in darkness, only shades of gray.
    effects:
      - kind: modify
        target: sense.darkvision
        op: max
        value: 60
  - id: srd51.feature.half-orc.age
    name:
      en: Age
    source: srd51
    text:
      en: Half-orcs mature a little faster than humans, reaching adulthood around age 14. They age noticeably faster and rarely live longer than 75 years.
  - id: srd51.feature.half-orc.alignment
    name:
      en: Alignment
    source: srd51
    text:
      en: Half-orcs inherit a tendency toward chaos from their orc parents and are not strongly inclined toward good. Half-orcs raised among orcs and willing to live out their lives among them are usually evil.
  - id: srd51.feature.half-orc.size
    name:
      en: Size
    source: srd51
    text:
      en: Half-orcs are somewhat larger and bulkier than humans, and they range from 5 to well over 6 feet tall. Your size is Medium.
  - id: srd51.feature.half-orc.languages
    name:
      en: Languages
    source: srd51
    text:
      en: You can speak, read, and write Common and Orc. Orc is a harsh, grating language with hard consonants. It has no script of its own but is written in the Dwarvish script.
  - id: srd51.feature.half-orc.menacing
    name:
      en: Menacing
    source: srd51
    text:
      en: You gain proficiency in the Intimidation skill.
    effects:
      - kind: grant-proficiency
        type: skill
        items:
          - intimidation
  - id: srd51.feature.half-orc.relentless-endurance
    name:
      en: Relentless Endurance
    source: srd51
    text:
      en: When you are reduced to 0 hit points but not killed outright, you can drop to 1 hit point instead. You can't use this feature again until you finish a long rest.
    effects:
      - kind: declare-resource
        resource: relentless-endurance
        name:
          en: Relentless Endurance
        max: 1
        recharge:
          - on: long-rest
            amount: full
        display: pips
      - kind: add-action
        action: relentless-endurance
        name:
          en: Relentless Endurance
        activation: special
        trigger:
          en: when you are reduced to 0 hit points but not killed outright
        cost:
          - resource: relentless-endurance
            amount: 1
        text:
          en: When you are reduced to 0 hit points but not killed outright, you can drop to 1 hit point instead. You can't use this feature again until you finish a long rest.
        onUse:
          - kind: note
            text:
              en: Drop to 1 hit point instead of 0.
  - id: srd51.feature.half-orc.savage-attacks
    name:
      en: Savage Attacks
    source: srd51
    text:
      en: When you score a critical hit with a melee weapon attack, you can roll one of the weapon's damage dice one additional time and add it to the extra damage of the critical hit.
    effects:
      - kind: add-text
        section: features
        text:
          en: When you score a critical hit with a melee weapon attack, roll one of the weapon's damage dice one additional time and add it to the extra damage of the critical hit.
        note:
          en: Play-mode critical hit rule (same shape as Brutal Critical); no derived value models it in v0.
