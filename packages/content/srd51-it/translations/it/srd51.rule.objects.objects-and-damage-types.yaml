name: "Oggetti e tipi di danno"
text: |-
  Gli oggetti sono immuni ai danni da veleno e psichici. Inoltre, il GM potrebbe decidere che alcuni tipi di danno siano più efficaci contro un oggetto o una sostanza particolare. Per esempio, i danni contundenti sono efficaci nel caso si voglia spaccare qualcosa, ma non per tagliare una corda o perforare il cuoio. Gli oggetti di carta e stoffa potrebbero essere più vulnerabili ai danni da fulmine e da fuoco. Un piccone può spaccare la pietra, ma non è utile per tagliare un albero. Come sempre, il GM userà il buon senso.
