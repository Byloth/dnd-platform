name: Tiri per colpire
text: |-
  Quando un personaggio effettua un attacco, il suo tiro per colpire determina se l'attacco colpisce o manca. Per effettuare un tiro per colpire si tira un d20 e si aggiungono i modificatori appropriati. Se il totale del tiro più i modificatori è pari o superiore alla Classe Armatura (CA) del bersaglio, l'attacco va a segno. La CA di un personaggio viene determinata al momento della sua creazione, mentre la CA di un mostro compare nella sua scheda delle statistiche.
