name: Muro di vento
components.m: Un ventaglio minuscolo e una piuma di origini esotiche.
text: |-
  Un muro di vento forte si solleva dal terreno in un punto a scelta dell'incantatore situato entro gittata. Il muro può essere lungo fino a 15 metri, alto 4,5 metri e spesso 30 cm. L'incantatore può modellarlo nel modo che preferisce, purché formi un percorso continuo lungo il terreno. Il muro permane per tutta la durata dell'incantesimo. Quando il muro appare, ogni creatura nella sua area deve effettuare un tiro salvezza su Forza, subendo 3d8 danni contundenti in caso di fallimento, o la metà dei danni in caso di successo. Il vento forte tiene lontani fumo, nebbia e altri gas. Le creature o gli oggetti volanti di taglia Piccola o inferiore non possono passare attraverso il muro e i materiali leggeri, non fissati in qualche modo, volano verso l'alto una volta portati al suo interno. Frecce, quadrelli e altri proiettili ordinari lanciati contro bersagli dietro il muro vengono deviati verso l'alto e mancano automaticamente il bersaglio. (I macigni scagliati dai giganti o dalle macchine d'assedio e altri proiettili simili non sono influenzati dal muro.) Le creature in forma gassosa inoltre non possono attraversare questa barriera di vento.
