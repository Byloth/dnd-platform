name: Danni e guarigione
text: Ferirsi e rischiare di morire sono delle costanti per coloro che esplorano gli universi di gioco fantasy. Un affondo di spada, una freccia ben piazzata o l'esplosione di un incantesimo *palla di fuoco* sono tutti attacchi che possono infliggere danni alla più tenace delle creature o perfino ucciderla.
