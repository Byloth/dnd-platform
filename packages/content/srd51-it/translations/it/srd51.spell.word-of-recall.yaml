name: Parola del ritiro
text: |-
  L'incantatore e un massimo di cinque creature consenzienti entro 1,5 metri da lui si teletrasportano immediatamente in un santuario indicato in precedenza. L'incantatore e le creature che si teletrasportano con lui appaiono nello spazio libero più vicino al punto indicato dall'incantatore quando ha preparato il suo santuario (vedi di seguito). Se lancia questo incantesimo senza prima preparare un santuario, l'incantesimo non ha effetto. L'incantatore deve prima indicare un santuario lanciando l'incantesimo all'interno di un luogo dedicato o fortemente legato alla sua divinità, come per esempio un tempio. Se l'incantatore cerca di lanciare l'incantesimo in questo modo in un'area che non è dedicata alla sua divinità, non ha effetto.
