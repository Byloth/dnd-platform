name: Estasiare
text: |-
  L'incantatore pronuncia una sequenza di parole disorientante, costringendo le creature da lui scelte entro gittata, che sono in grado di sentirlo e che egli è in grado di vedere, a effettuare un tiro salvezza su Saggezza. Qualsiasi creatura che non può essere affascinata supera automaticamente questo tiro salvezza. Inoltre, se l'incantatore e i suoi compagni stanno combattendo contro una creatura, quella dispone di vantaggio al tiro salvezza. Se lo fallisce, il bersaglio subisce svantaggio alle prove di Saggezza (Percezione) effettuate per percepire una qualsiasi creatura diversa dall'incantatore, finché l'incantesimo non termina o finché il bersaglio non è più in grado di sentirlo. L'incantesimo termina se l'incantatore è incapacitato o non è più in grado di parlare.
effects.0.note: Solo alle prove di Saggezza (Percezione) effettuate per percepire una qualsiasi creatura diversa dall'incantatore, e solo finché il bersaglio è in grado di sentirlo.
onCast.0.text: Un tiro salvezza su Saggezza nega l'effetto; una creatura che non può essere affascinata lo supera automaticamente e una creatura contro cui l'incantatore o i suoi compagni stanno combattendo dispone di vantaggio al tiro salvezza. L'incantesimo termina se l'incantatore è incapacitato o non è più in grado di parlare.
