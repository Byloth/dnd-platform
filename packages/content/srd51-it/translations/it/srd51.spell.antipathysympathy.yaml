name: Antipatia/Simpatia
components.m: Un frammento di allume immerso nell'aceto per l'effetto di antipatia o una goccia di miele per l'effetto di simpatia.
text: |-
  Questo incantesimo attira o repelle le creature. L'incantatore sceglie un bersaglio entro gittata, che può essere un oggetto o una creatura di taglia Enorme o inferiore, oppure un'area non più ampia di un cubo di 60 metri. Dopodiché, specifica un tipo di creatura intelligente, come per esempio draghi rossi, goblin o vampiri. L'incantatore infonde nel bersaglio un'aura che attira oppure respinge le creature specificate per la durata dell'incantesimo, scegliendo antipatia o simpatia come suo effetto.

  **Antipatia.** L'ammaliamento suscita nelle creature del tipo scelto dall'incantatore un intenso desiderio di abbandonare l'area ed evitare il bersaglio. Quando una tale creatura è in grado di vedere il bersaglio o si trova entro 18 metri da esso, deve superare un tiro salvezza su Saggezza, altrimenti ne rimane spaventata per tutto il tempo in cui il bersaglio si trova nel suo campo visivo o entro 18 metri da essa. Finché è spaventata dal bersaglio, la creatura deve usare il suo movimento per spostarsi verso il punto sicuro più vicino da cui non può vedere il bersaglio. Se si allontana a più di 18 metri dal bersaglio e non è più in grado di vederlo, la creatura non è più spaventata, ma lo diventa di nuovo se il bersaglio torna nel suo campo visivo o si trova entro 18 metri da essa.

  **Simpatia.** L'ammaliamento suscita nelle creature del tipo scelto dall'incantatore un intenso desiderio di avvicinarsi al bersaglio quando si trovano a 18 metri da esso o se sono in grado di vederlo. Quando una tale creatura è in grado di vedere il bersaglio o si trova entro 18 metri da esso, deve superare un tiro salvezza su Saggezza o usare il suo movimento in ogni suo turno per entrare nell'area o muoversi entro la portata del bersaglio. Una volta fatto questo, la creatura non può allontanarsi dal bersaglio di sua spontanea volontà. Se il bersaglio infligge danni o in altro modo danneggia la creatura influenzata, questa può effettuare un tiro salvezza su Saggezza per porre fine all'effetto, come descritto di seguito.

  **Porre fine all'effetto.** Se una creatura influenzata termina il suo turno a più di 18 metri dal bersaglio o non è in grado di vederlo, effettua un tiro salvezza su Saggezza. In caso di successo, la creatura non è più influenzata dal bersaglio e riconosce che la sensazione di ripugnanza o attrazione era frutto della magia. Inoltre, una creatura influenzata dall'incantesimo ha diritto a effettuare un ulteriore tiro salvezza su Saggezza ogni 24 ore finché l'incantesimo permane. Una creatura che supera un tiro salvezza contro l'effetto ne è immune per 1 minuto, al termine del quale può esserne influenzata di nuovo.
onCast.0.note: |-
  Solo antipatia: una creatura del tipo scelto che fallisce il tiro salvezza su Saggezza è spaventata finché è in grado di vedere il bersaglio o si trova entro 18 metri da esso, e deve spostarsi verso il punto sicuro più vicino da cui non può vedere il bersaglio; non è più spaventata una volta che si trova a più di 18 metri dal bersaglio e non è in grado di vederlo.
onCast.1.text: |-
  Simpatia: se fallisce il tiro salvezza su Saggezza, la creatura deve usare il suo movimento in ogni suo turno per avvicinarsi al bersaglio e non può allontanarsene di sua spontanea volontà. Una creatura influenzata ripete il tiro salvezza quando termina il suo turno a più di 18 metri dal bersaglio senza poterlo vedere, e ogni 24 ore; un tiro salvezza superato le conferisce l'immunità per 1 minuto.
