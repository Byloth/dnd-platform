name: Spada e scudo
pitch: "Un soldato addestrato in armatura pesante, con spada e scudo: semplice da giocare e difficile da battere."
why.class: "I guerrieri sono la classe più semplice con cui iniziare: ottime armature, molte armi e privilegi che funzionano senza bisogno di pianificare."
why.species: "Un umano migliora un po' in tutto (+1 a ogni punteggio): è bravo in qualunque cosa finisca per fare il tuo guerriero."
why.abilityPriority: La Forza guida i tuoi attacchi e ti permette di indossare un'armatura pesante; la Costituzione ti dà punti ferita; la Destrezza aiuta con l'iniziativa e i tiri salvezza.
why.background: Accolito, l'unico background dell'SRD, ti dà le abilità Intuizione e Religione e due linguaggi.
