name: Nascondersi
text: |-
  Quando un personaggio effettua l'azione di Nascondersi, deve effettuare una prova di Destrezza (Furtività) nel tentativo di nascondersi, come previsto dalle regole per nascondersi. Se la supera ottiene determinati benefici, come descritto in srd:unseen-attackers-and-targets.
