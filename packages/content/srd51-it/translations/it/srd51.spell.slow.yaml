name: Lentezza
components.m: Una goccia di melassa.
text: |-
  L'incantatore altera il tempo intorno a un massimo di sei creature a sua scelta all'interno di un cubo di 12 metri entro gittata. Ogni bersaglio deve superare un tiro salvezza su Saggezza, altrimenti è influenzato da questo incantesimo per tutta la sua durata. Un bersaglio influenzato subisce una penalità di -2 alla CA e ai tiri salvezza su Destrezza, non può usare reazioni e la sua velocità è dimezzata. Nel proprio turno, può usare un'azione o un'azione bonus, ma non entrambe. A prescindere dalle sue capacità o oggetti magici, la creatura non può effettuare più di un attacco in mischia o a distanza durante il suo turno. Se la creatura tenta di lanciare un incantesimo con un tempo di lancio di 1 azione, deve tirare un d20. Con un risultato pari o superiore a 11, l'incantesimo non ha effetto fino al turno successivo della creatura, che deve usare una sua azione per completare l'incantesimo. Se non può farlo, l'incantesimo viene sprecato. Una creatura influenzata da questo incantesimo deve effettuare un altro tiro salvezza su Saggezza al termine del suo turno. In caso di successo, l'effetto svanisce.
effects.3.text: |-
  Non può usare reazioni; nel proprio turno può usare un'azione o un'azione bonus, ma non entrambe, e non può effettuare più di un attacco in mischia o a distanza. Quando lancia un incantesimo con un tempo di lancio di 1 azione, tira un d20: con un risultato pari o superiore a 11, l'incantesimo ha effetto nel suo turno successivo solo se usa la sua azione per completarlo.
onCast.0.text: |-
  Fino a sei creature in un cubo di 12 metri, se falliscono un tiro salvezza su Saggezza. Una creatura influenzata ripete il tiro salvezza al termine del suo turno; in caso di successo, l'effetto svanisce per lei.
