name: Borsa divorante
text: |-
  Oggetto meraviglioso, molto raro

  A una prima occhiata questa borsa sembra una borsa conservante, ma in realtà si tratta di un orifizio attraverso cui si nutre una gigantesca creatura extradimensionale. Rivoltando la borsa da dentro a fuori si chiude l'orifizio.

  La creatura extradimensionale collegata alla borsa può percepire tutto ciò che viene posto al suo interno. Ogni materiale animale o vegetale inserito completamente all'interno della borsa viene divorato e perduto per sempre. Quando una parte di una creatura vivente entra nella borsa, per esempio quando qualcuno vi infila una mano, c'è una probabilità del 50 percento che tutta la creatura venga risucchiata all'interno. Una creatura all'interno della borsa può usare la sua azione per tentare di sfuggire superando una prova di Forza con CD 15. Un'altra creatura può usare la propria azione per infilare le mani nella borsa e tirare fuori la creatura imprigionata effettuando con successo una prova di Forza con CD 20 (sempre che non venga prima trascinata all'interno a sua volta). Ogni creatura che inizia il proprio turno all'interno della borsa viene divorata e il suo corpo viene distrutto.

  Nella borsa è possibile conservare oggetti inanimati fino a un volume pari a un cubo con spigolo di 30 cm. Tuttavia, una volta al giorno la borsa inghiotte tutti gli oggetti al suo interno e li sputa fuori su un altro piano di esistenza. Il GM determina il momento in cui questo accade e il piano dove finiscono gli oggetti.

  Se la borsa viene bucata o strappata, è considerata distrutta e tutto ciò che conteneva viene trasportato in un luogo casuale sul Piano Astrale.
