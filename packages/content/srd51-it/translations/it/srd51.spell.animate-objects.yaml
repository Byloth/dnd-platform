name: Animare oggetti
text: |-
  Gli oggetti prendono vita al comando dell'incantatore, che sceglie un massimo di dieci oggetti non magici entro gittata che non siano indossati o trasportati. I bersagli di taglia Media contano come due oggetti, quelli di taglia Grande come quattro oggetti e quelli di taglia Enorme come otto oggetti. L'incantatore non può animare oggetti di taglia superiore a Enorme. Ogni bersaglio animato diventa una creatura sotto il suo controllo finché l'incantesimo non termina o finché non scende a 0 punti ferita.
  Come azione bonus, l'incantatore può comandare mentalmente qualsiasi creatura creata con questo incantesimo, a patto che si trovi entro 150 metri da lui (se controlla varie creature, l'incantatore può comandarne una o tutte allo stesso momento, impartendo lo stesso comando a ciascuna di loro). L'incantatore decide quale azione effettuerà la creatura e dove si muoverà durante il suo turno successivo, oppure può impartirle un comando generale, come proteggere una stanza o un corridoio particolare. Se non impartisce comandi, la creatura si limita a difendersi dalle creature ostili. Una volta ricevuto un ordine, la creatura continua a seguirlo finché non ha portato a termine il compito.
  ### Statistiche degli oggetti animati
  | Taglia | PF | CA | Attacco | For | Des |
  |---|---|---|---|---|---|
  | Minuscola | 20 | 18 | +8 al tiro per colpire, 1d4 + 4 danni | 4 | 18 |
  | Piccola | 25 | 16 | +6 al tiro per colpire, 1d8 + 2 danni | 6 | 14 |
  | Media | 40 | 13 | +5 al tiro per colpire, 2d6 + 1 danni | 10 | 12 |
  | Grande | 50 | 10 | +6 al tiro per colpire, 2d10 + 2 danni | 14 | 10 |
  | Enorme | 80 | 10 | +8 al tiro per colpire, 2d12 + 4 danni | 18 | 6 |

  Un oggetto animato è un costrutto con CA, punti ferita, attacchi, Forza e Destrezza determinati dalla sua taglia. La sua Costituzione è pari a 10, la sua Intelligenza e Saggezza sono pari a 3 e il suo Carisma è pari a 1. La sua velocità è di 9 metri; se invece l'oggetto è privo di gambe o altre appendici che possa utilizzare per la locomozione, ha una velocità di volare pari a 9 metri e può fluttuare. Se l'oggetto è agganciato saldamente a una superficie o a un oggetto più grande, come una catena fissata a una parete, la sua velocità è pari a 0. È dotato di vista cieca con un raggio di 9 metri ed è cieco oltre quella distanza. Quando un oggetto animato scende a 0 punti ferita, riassume la sua forma originale, a cui viene trasferito ogni danno rimanente. Se l'incantatore comanda a un oggetto di attaccare, esso può effettuare un singolo attacco in mischia contro una creatura entro 1,5 metri da esso. L'oggetto effettua un attacco Schianto con un bonus di attacco e danni contundenti determinati dalla sua taglia. Il GM potrebbe decidere che un oggetto specifico infligga danni taglienti o perforanti in base alla sua forma.
higherLevel: |-
  Quando l'incantatore lancia questo incantesimo usando uno slot incantesimo di 6° livello o superiore, può animare due oggetti aggiuntivi per ogni slot superiore al 5°.
effects.0.name: Comandare gli oggetti animati
effects.0.text: Comanda mentalmente qualsiasi creatura creata con questo incantesimo entro 150 metri (tutte insieme con lo stesso comando). Se riceve il comando di attaccare, un oggetto effettua un singolo attacco Schianto in mischia contro una creatura entro 1,5 metri, con il bonus di attacco e i danni contundenti della sua taglia.
effects.1.text: "Gli oggetti animati (Minuscola: 20 PF, CA 18, +8 al tiro per colpire, 1d4 + 4; Piccola: 25 PF, CA 16, +6 al tiro per colpire, 1d8 + 2; Media: 40 PF, CA 13, +5 al tiro per colpire, 2d6 + 1; Grande: 50 PF, CA 10, +6 al tiro per colpire, 2d10 + 2; Enorme: 80 PF, CA 10, +8 al tiro per colpire, 2d12 + 4) sono costrutti con Cos 10, Int 3, Sag 3, Car 1, velocità 9 metri (volare 9 metri e fluttuare se sono privi di gambe) e vista cieca 9 metri; a 0 punti ferita un oggetto riassume la sua forma originale."
effects.1.note: Le statistiche degli oggetti non sono registrate nella v0.
onCast.0.text: Si animano fino a dieci oggetti non magici non indossati né trasportati (un oggetto di taglia Media conta come due oggetti, Grande come quattro, Enorme come otto); due oggetti aggiuntivi per ogni slot di livello superiore al 5°.
