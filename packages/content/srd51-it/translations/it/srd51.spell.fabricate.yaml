name: Fabbricare
text: |-
  L'incantatore converte materie prime in prodotti dello stesso materiale. Per esempio, può fabbricare un ponte di legno da una catasta di tronchi, una corda da un groviglio di canapa e abiti da lino o lana. L'incantatore sceglie materie prime entro gittata che è in grado di vedere e, qualora ne possegga una quantità sufficiente, può fabbricare un oggetto di taglia Grande o inferiore (contenuto in un cubo di 3 metri o in otto cubi di 1,5 metri collegati tra loro). Tuttavia, se l'incantatore lavora con metallo, pietra o un'altra sostanza minerale, l'oggetto fabbricato potrà essere al massimo di taglia Media (contenuto in un solo cubo di 1,5 metri). La qualità degli oggetti realizzati dall'incantesimo è proporzionale alla qualità delle materie prime. Questo incantesimo non può creare o trasmutare creature o oggetti magici. Inoltre, l'incantatore non può utilizzarlo per creare oggetti che normalmente richiedono un alto grado di precisione, come gioielli, armi, vetro o armature, a meno che non possegga competenza con il tipo di strumenti da artigiano usati per realizzare tali oggetti.
