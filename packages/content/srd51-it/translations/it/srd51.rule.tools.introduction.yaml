name: Strumenti
text: Uno strumento consente a un personaggio di fare qualcosa che altrimenti non sarebbe in grado di fare, come fabbricare o riparare un oggetto, falsificare un documento o scassinare una serratura. La razza, la classe, il background o i talenti possono fornire a un personaggio competenza in certi strumenti. Essa gli consente di aggiungere il proprio bonus di competenza a qualsiasi prova di caratteristica effettuata usando tale strumento. L'utilizzo di uno strumento non è collegato a una singola caratteristica, dal momento che la relativa competenza rappresenta una conoscenza più vasta del suo utilizzo basilare. Per esempio, il GM potrebbe chiedere a un personaggio di effettuare una prova di Destrezza per incidere qualche minuscolo dettaglio con i suoi strumenti da intagliatore, o una prova di Forza per ricavare un oggetto da un pezzo di legno particolarmente duro.
