name: "Attacchi in mischia e a distanza"
text: |-
  Le azioni più comuni che un mostro può effettuare in combattimento sono gli attacchi in mischia e a distanza. Può trattarsi di attacchi con un incantesimo o con un'arma; in questo caso, il termine "arma" può indicare anche un oggetto fabbricato o un'arma naturale come ad esempio un artiglio o un aculeo caudale. Per ulteriori informazioni sui vari tipi di attacco, vedi il *Manuale del Giocatore*.

  ***Creatura o Bersaglio.*** Il bersaglio di un attacco in mischia o a distanza è solitamente una creatura o un bersaglio; la differenza sta nel fatto che un "bersaglio" può essere sia una creatura che un oggetto.

  ***Colpito.*** Gli eventuali danni inflitti o altri effetti che si verificano quando un attacco colpisce un bersaglio sono descritti alla voce "*Colpito*". Il GM può scegliere se applicare i danni medi o tirare per i danni. A tale scopo sono forniti sia i danni medi che la formula dei dadi.

  ***Mancato.*** Se un attacco prevede un effetto che si verifica in caso di colpo mancato, questa informazione è presentata alla voce "*Mancato:*".
