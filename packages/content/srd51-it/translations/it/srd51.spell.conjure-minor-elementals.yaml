name: Evoca elementali minori
text: |-
  L'incantatore evoca elementali che appaiono in spazi liberi entro gittata che è in grado di vedere e per determinare ciò che appare, sceglie una tra le opzioni seguenti:
  - Un elementale con grado di sfida pari o inferiore a 2
  - Due elementali con grado di sfida pari o inferiore a 1
  - Quattro elementali con grado di sfida pari o inferiore a 1/2
  - Otto elementali con grado di sfida pari o inferiore a 1/4

  Un elementale evocato da questo incantesimo scompare quando scende a 0 punti ferita o al termine dell'incantesimo. Le creature evocate sono amichevoli nei confronti dell'incantatore e dei suoi compagni. Si tira per l'iniziativa delle creature evocate, che svolgono i propri turni come gruppo. Le creature obbediscono ai comandi verbali dell'incantatore (nessuna azione richiesta). Se l'incantatore non impartisce dei comandi, si difendono dalle creature ostili, ma non intraprendono altre azioni. Il GM possiede le statistiche delle creature.
higherLevel: |-
  Quando l'incantatore lancia questo incantesimo usando determinati slot incantesimo di livello superiore, sceglie una delle opzioni di evocazione elencate sopra e appaiono nuove creature: il doppio con uno slot di 6° livello e il triplo con uno slot di 8° livello.
effects.0.text: |-
  Gli elementali evocati (uno con grado di sfida pari o inferiore a 2, due con GS pari o inferiore a 1, quattro con GS pari o inferiore a 1/2 oppure otto con GS pari o inferiore a 1/4) sono amichevoli nei confronti dell'incantatore e dei suoi compagni, tirano l'iniziativa come gruppo e obbediscono ai suoi comandi verbali (nessuna azione richiesta); se non ricevono comandi, si limitano a difendersi. Un elementale scompare quando scende a 0 punti ferita o al termine dell'incantesimo.
onCast.0.text: |-
  Il GM possiede le statistiche delle creature (nessun blocco di statistiche nella v0). Il doppio delle creature con uno slot di 6° livello, il triplo con uno slot di 8° livello.
