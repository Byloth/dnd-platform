name: Blocca mostri
components.m: Una piccola sbarra di ferro.
text: L'incantatore sceglie una creatura entro gittata che è in grado di vedere. Il bersaglio deve superare un tiro salvezza su Saggezza, altrimenti sarà paralizzato per la durata dell'incantesimo. Questo incantesimo non ha effetto sui non morti. Il bersaglio può effettuare un altro tiro salvezza su Saggezza alla fine di ogni suo turno. Se lo supera, si libera dall'effetto dell'incantesimo.
higherLevel: Quando l'incantatore lancia questo incantesimo usando uno slot incantesimo di 6° livello o superiore, può bersagliare una creatura aggiuntiva per ogni slot superiore al 5°. Quando l'incantatore le bersaglia, le creature devono trovarsi a non più di 9 metri l'una dall'altra.
onCast.1.text: Se fallisce il tiro salvezza su Saggezza; nessun effetto sui non morti. Alla fine di ogni suo turno il bersaglio può effettuare un altro tiro salvezza su Saggezza; se lo supera, l'incantesimo termina su di lui. Ogni slot di livello superiore al 5° bersaglia una creatura aggiuntiva (a non più di 9 metri l'una dall'altra).
