name: Blocca mostri
components.m: Una piccola sbarra di ferro.
text: |-
  L'incantatore sceglie una creatura entro gittata che è in grado di vedere. Il bersaglio deve superare un tiro salvezza su Saggezza, altrimenti sarà paralizzato per la durata dell'incantesimo. Questo incantesimo non ha effetto sui non morti. Il bersaglio può effettuare un altro tiro salvezza su Saggezza alla fine di ogni suo turno. Se lo supera, si libera dall'effetto dell'incantesimo.
higherLevel: |-
  Quando l'incantatore lancia questo incantesimo usando uno slot incantesimo di 6° livello o superiore, può bersagliare una creatura aggiuntiva per ogni slot superiore al 5°. Quando l'incantatore le bersaglia, le creature devono trovarsi a non più di 9 metri l'una dall'altra.
onCast.1.text: |-
  Con un tiro salvezza su Saggezza fallito; nessun effetto sui non morti. Alla fine di ogni round il bersaglio ripete il tiro salvezza; in caso di successo l'incantesimo termina per lui. Ogni slot di livello superiore al 5° bersaglia una creatura aggiuntiva (entro 9 metri l'una dall'altra).
