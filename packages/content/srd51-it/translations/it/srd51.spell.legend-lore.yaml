name: Conoscenza delle leggende
components.m: Incenso del valore di almeno 250 mo, che l'incantesimo consuma e quattro lamine di avorio del valore di almeno 50 mo ciascuna.
text: |-
  L'incantatore nomina o descrive una persona, un luogo o un oggetto. L'incantesimo trasmette alla sua mente un breve riassunto delle conoscenze più significative relative all'oggetto nominato. Queste conoscenze possono includere storie attuali, racconti dimenticati o perfino conoscenze segrete che non sono note ai più. Se ciò che l'incantatore ha nominato non è di leggendaria importanza, non ottiene alcuna informazione. Più informazioni l'incantatore possiede già, più precise e dettagliate saranno le informazioni che riceverà. Le informazioni apprese dall'incantatore sono accurate ma potrebbero essere espresse in un linguaggio figurativo. Per esempio, se l'incantatore impugna un'ascia magica, l'incantesimo potrebbe fornire le seguenti informazioni: "La sventura attende il malfattore la cui mano tocca l'ascia, dacché la sola impugnatura fende il palmo dei malvagi. Soltanto un vero Figlio della Pietra, fedele a Moradin e da lui amato, può risvegliare i veri poteri dell'ascia, purché la parola sacra Rudnogg abbia sulle labbra."
