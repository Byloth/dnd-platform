name: Tagliola
text: Quando il personaggio usa la sua azione per predisporre questa trappola, colloca a terra un cerchio di metallo dentato che si chiude con uno scatto quando una creatura preme una piastra a pressione situata al centro. La trappola viene fissata a una pesante catena o a un oggetto immobile come un albero o un palo piantato a terra. Quando una creatura mette un piede sulla piastra, deve superare un tiro salvezza su Destrezza con CD 13, altrimenti subisce 1d4 danni perforanti e smette di muoversi. A quel punto, finché la creatura non si libera dalla trappola, il suo movimento è limitato dalla lunghezza della catena (solitamente 90 centimetri). Una creatura può usare la sua azione per effettuare una prova di Forza con CD 13 e liberare se stessa o qualcun altro nel suo raggio in caso di successo. Ogni prova fallita infligge 1 danno perforante alla creatura intrappolata.
