name: Zona di verità
text: |-
  L'incantatore crea una zona magica che protegge dagli inganni all'interno di una sfera con raggio di 4,5 metri, centrata su un punto entro gittata a sua scelta. Fino al termine dell'incantesimo, una creatura che entra nell'area dell'incantesimo per la prima volta in un turno o vi inizia il suo turno deve superare un tiro salvezza su Carisma. Se lo fallisce, non può mentire deliberatamente mentre si trova nell'area. Inoltre, l'incantatore è a conoscenza di quali creature hanno superato o fallito il proprio tiro salvezza. Una creatura influenzata è consapevole dell'incantesimo e può quindi evitare di rispondere alle domande a cui normalmente risponderebbe mentendo. Una tale creatura può fornire risposte sfuggenti, purché rimanga entro i confini della verità.
