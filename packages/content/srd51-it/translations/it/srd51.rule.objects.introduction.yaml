name: "Oggetti"
text: |-
  Quando i personaggi devono tagliare delle corde, sfondare una finestra o distruggere la bara di un vampiro, esiste solo una regola ferrea: se dispongono di tempo a sufficienza e degli strumenti giusti, possono distruggere qualsiasi oggetto distruttibile. Il GM userà il buon senso al momento di determinare il successo di un personaggio nel danneggiare un oggetto. Un guerriero può abbattere una sezione di parete di pietra con una spada? No, la spada probabilmente si romperà prima del muro.

  Ai fini di tali regole, per oggetto si considera qualcosa di dimensioni ridotte e inanimato come una finestra, una porta, una spada, un libro, un tavolo, una sedia o una roccia; questo non include un edificio o un veicolo che sono composti da molti altri oggetti.
