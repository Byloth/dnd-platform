name: Contattare altri piani
text: |-
  L'incantatore contatta mentalmente un semidio, lo spirito di un sapiente defunto da tempo o qualche altra entità misteriosa appartenente a un altro piano. Contattare questa intelligenza extraplanare può tuttavia affaticare o addirittura sconvolgere la sua mente: quando l'incantatore lancia questo incantesimo, deve effettuare un tiro salvezza su Intelligenza con CD 15. In caso di fallimento, subisce 6d6 danni psichici e impazzisce finché non completa un riposo lungo. Mentre è in questa condizione, non può effettuare azioni, capire i discorsi altrui o leggere e si limita a farfugliare parole senza senso. Un incantesimo ristorare superiore fa svanire questo effetto. In caso di successo, l'incantatore può porre all'entità un massimo di cinque domande prima del termine dell'incantesimo. Il GM risponde a ogni domanda con una parola, come per esempio "sì", "no", "forse", "mai", "irrilevante" o "ignoto" (se l'entità non conosce la risposta alla domanda). Nel caso in cui una risposta di una parola sola possa rivelarsi fuorviante, il GM può fornire come risposta una breve frase.
