name: Vuoto mentale
text: Finché l'incantesimo non termina, una creatura consenziente toccata dall'incantatore è immune ai danni psichici, a qualsiasi effetto che possa percepirne le emozioni o leggerne i pensieri, agli incantesimi di divinazione e alla condizione affascinato. L'incantesimo annulla perfino gli incantesimi desiderio e gli incantesimi o effetti di potenza analoga usati per influenzare la mente del bersaglio o per ottenere informazioni su quest'ultimo.
effects.2.text: Immune a qualsiasi effetto che possa percepirne le emozioni o leggerne i pensieri e agli incantesimi di divinazione, perfino a desiderio e agli effetti di potenza analoga rivolti alla sua mente o a ottenere informazioni su di essa.
