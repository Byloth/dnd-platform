name: Comunione con la natura
text: |-
  L'incantatore diventa brevemente un tutt'uno con la natura, acquisendo la conoscenza del territorio circostante. All'aperto, l'incantesimo fornisce all'incantatore la conoscenza del territorio entro un raggio di 4,5 km. Nelle caverne e in altri ambienti naturali sotterranei, il raggio è limitato a 90 metri. L'incantesimo non funziona nei luoghi in cui la natura è stata sostituita da costruzioni, come dungeon e cittadine. L'incantatore ottiene immediatamente la conoscenza di un massimo di tre fatti a sua scelta sui seguenti argomenti legati all'area:
  - terreno e distese d'acqua
  - vegetali, minerali, animali o popolazioni predominanti
  - celestiali, folletti, immondi, elementali o non morti potenti
  - influenza da altri piani di esistenza
  - edifici

  Per esempio, l'incantatore potrebbe determinare la posizione di potenti non morti nell'area, delle principali fonti d'acqua potabile e di cittadine vicine.
