name: Camminare nel vento
components.m: Fuoco e acqua santa.
text: |-
  L'incantatore e un massimo di dieci creature consenzienti che è in grado di vedere entro gittata assumono forma gassosa per la durata dell'incantesimo, apparendo come sbuffi di nuvole. Finché rimane in questa forma gassosa, una creatura possiede una velocità di volare di 90 metri e resistenza ai danni inferti dalle armi non magiche. Le uniche azioni che una creatura può effettuare in questa forma sono l'azione Scatto o riassumere la propria forma normale. Riassumere la propria forma richiede 1 minuto, durante il quale una creatura è incapacitata e non è in grado di muoversi. Fino al termine dell'incantesimo, una creatura può tornare in forma gassosa, il che richiede 1 minuto di trasformazione. Se una creatura è in forma gassosa e sta volando quando l'effetto termina, scende di 18 metri per round per 1 minuto finché non atterra, senza subire danni. Se tuttavia non riesce ad atterrare in 1 minuto, la creatura cade per la distanza rimanente.
effects.0.note: Finché è in forma gassosa.
effects.1.text: |-
  In forma gassosa: resistenza ai danni inferti dalle armi non magiche; le uniche azioni possibili sono Scatto o riassumere la forma normale. Riassumere la forma normale (o tornare in forma gassosa) richiede 1 minuto, durante il quale la creatura è incapacitata e non è in grado di muoversi. Se l'incantesimo termina mentre sta volando, la creatura scende di 18 metri per round per 1 minuto, atterrando senza subire danni.
effects.1.note: |-
  La resistenza ai danni delle armi non magiche resta come testo: la difesa elenca tipi di danno, non fonti. L'essere incapacitata durante la trasformazione di 1 minuto è uno stato transitorio, non applicato come condizione.
