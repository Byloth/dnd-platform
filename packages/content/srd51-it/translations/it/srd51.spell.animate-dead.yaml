name: Animare morti
components.m: Una goccia di sangue, un pezzo di carne e un pizzico di polvere d'osso.
text: |-
  Questo incantesimo crea un servo non morto. L'incantatore sceglie una pila di ossa o un cadavere umanoide di taglia Media o Piccola entro gittata, infondendo nel bersaglio tramite l'incantesimo un'empia parvenza di vita, animandolo come creatura non morta. Il bersaglio diventa uno scheletro se l'incantatore ha scelto le ossa o uno zombi se ha scelto il cadavere (il GM possiede le statistiche di gioco della creatura).

  A ogni suo turno, l'incantatore può usare un'azione bonus per comandare mentalmente qualsiasi creatura creata con questo incantesimo, a patto che si trovi entro 18 metri da lui (se controlla varie creature, l'incantatore può comandarne una o tutte allo stesso momento, impartendo lo stesso comando a ciascuna di loro). L'incantatore decide quale azione effettuerà la creatura e dove si muoverà durante il suo turno successivo, oppure può impartirle un comando generale, come proteggere una stanza o un corridoio particolare. Se non impartisce comandi, la creatura si limita a difendersi dalle creature ostili. Una volta ricevuto un ordine, la creatura continua a seguirlo finché non ha portato a termine il compito.

  La creatura rimane sotto il controllo dell'incantatore per 24 ore, passate le quali smette di obbedire a qualsiasi comando ulteriore. Per mantenere il controllo sulla creatura per altre 24 ore, l'incantatore deve lanciare di nuovo questo incantesimo su di essa prima che l'attuale periodo di 24 ore termini. Questo uso dell'incantesimo gli permette di ristabilire il controllo su un massimo di quattro creature da lui animate tramite questo incantesimo, anziché animarne una nuova.
higherLevel: |-
  Quando l'incantatore lancia questo incantesimo usando uno slot incantesimo di 4° livello o superiore, può animare o ristabilire il controllo su due creature non morte aggiuntive per ogni slot superiore al 3°. Ognuna delle creature deve provenire da un diverso cadavere o mucchio d'ossa.
onCast.0.text: Anima uno scheletro (dalle ossa) o uno zombi (da un cadavere) sotto il controllo dell'incantatore per 24 ore; il GM possiede le sue statistiche (nessun blocco di statistiche nella v0). A ogni suo turno, l'incantatore può usare un'azione bonus per comandare le creature create con questo incantesimo entro 18 metri. Lanciare di nuovo l'incantesimo permette invece di ristabilire il controllo su un massimo di quattro creature; due creature aggiuntive per ogni slot di livello superiore al 3°.
