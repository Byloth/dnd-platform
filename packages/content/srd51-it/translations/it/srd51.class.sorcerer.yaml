levels.4.features.0.name: Aumento dei Punteggi di Caratteristica
levels.4.features.0.text: |-
  Quando arriva al 4° livello, e poi di nuovo all'8°, 12°, 16° e 19° livello, uno stregone può aumentare di 2 un punteggio di caratteristica a sua scelta, oppure può aumentare di 1 due punteggi di caratteristica a sua scelta. Come di consueto, non è consentito aumentare un punteggio di caratteristica a più di 20 utilizzando questo privilegio.
levels.20.features.0.name: Ripristino Stregonesco
levels.20.features.0.text: |-
  Al 20° livello, uno stregone recupera 4 punti stregoneria spesi ogni volta che completa un riposo breve.
levels.20.features.0.onRest.0.note: |-
  Lo stregone recupera 4 punti stregoneria spesi ogni volta che completa un riposo breve (un riposo lungo li ripristina già tutti).
