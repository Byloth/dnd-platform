name: "Iniziativa"
text: |-
  L'iniziativa determina l'ordine dei turni durante il combattimento. Quando il combattimento inizia, ogni partecipante effettua una prova di Destrezza per determinare la sua posizione nell'ordine di iniziativa. Il GM effettua un solo tiro per un intero gruppo di creature identiche, quindi tutti i membri di quel gruppo agiscono contemporaneamente.

  Il GM elenca i combattenti in un ordine che va da quello con il totale più alto della prova di Destrezza a quello con il totale più basso. Questo è l'ordine (chiamato ordine di iniziativa) in cui i combattenti agiranno nel corso di ogni round. L'ordine di iniziativa rimane lo stesso per tutti i round.

  In caso di parità, il GM decide l'ordine tra le creature in parità sotto il suo controllo e i giocatori decidono l'ordine tra i loro personaggi in parità. Se si verifica una parità tra un mostro e un personaggio giocante, è il GM a decidere l'ordine. In alternativa, il GM può chiedere ai personaggi e ai mostri in parità di tirare un d20 a testa per determinare l'ordine: chi ottiene il risultato più alto agisce per primo.
