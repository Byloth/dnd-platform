name: "Riposo lungo"
text: |-
  Un riposo lungo è un periodo di inattività esteso pari almeno a 8 ore in cui un personaggio dorme e svolge attività poco impegnative come parlare, mangiare, leggere o fare la guardia per non più di 2 ore. Se il riposo è interrotto da un periodo di attività stancanti (almeno 1 ora trascorsa a camminare, combattere, lanciare incantesimi o altre attività da avventuriero analoghe), il personaggio deve ricominciare il riposo da capo per ottenerne i benefici.

  Alla fine di un riposo lungo, un personaggio recupera tutti i punti ferita perduti. Recupera anche i Dadi Vita spesi, fino a un numero pari alla metà del totale di dadi del suo personaggio (minimo di un dado). Per esempio, se un personaggio possiede otto Dadi Vita, può recuperare fino a quattro Dadi Vita spesi quando completa un riposo lungo.

  Un personaggio non può beneficiare di più di un riposo lungo in un periodo di 24 ore e deve possedere almeno 1 punto ferita all'inizio del riposo per ottenerne i benefici.
