name: Proiezione astrale
components.m: Per ogni creatura influenzata da questo incantesimo, l'incantatore deve fornire un giacinto del valore di almeno 1.000 mo e un lingotto d'argento finemente decorato del valore di almeno 100 mo, che l'incantesimo consuma.
text: |-
  L'incantatore e un massimo di otto creature consenzienti entro gittata proiettano i loro corpi astrali sul Piano Astrale (l'incantesimo fallisce e il lancio è sprecato se l'incantatore si trova già su quel piano). Il corpo materiale abbandonato cade privo di sensi e in uno stato di animazione sospesa; non ha bisogno di cibo o aria e non invecchia. Il corpo astrale assomiglia alla forma mortale dell'incantatore in ogni particolare e replica le sue statistiche di gioco e proprietà. La differenza principale consiste nell'aggiunta di un cordone argentato che si snoda tra le scapole dell'incantatore e fluttua alle sue spalle, diventando invisibile dopo 30 cm. Questo cordone tiene ancorato l'incantatore al suo corpo materiale e, finché rimane intatto, l'incantatore può trovare la strada del ritorno. Se il cordone viene reciso, cosa che può accadere solo quando un effetto lo specifica chiaramente, l'anima e il corpo vengono separati, uccidendo l'incantatore all'istante. La forma astrale dell'incantatore può viaggiare liberamente per il Piano Astrale e passare attraverso i portali che da lì conducono su altri piani. Se l'incantatore si sposta su un nuovo piano o ritorna al piano in cui si trovava quando ha lanciato l'incantesimo, il suo corpo e le sue proprietà vengono trasportati lungo il cordone argentato, permettendogli di rientrare nel suo corpo nel momento in cui accede al nuovo piano. La forma astrale è un'incarnazione separata: ogni danno o altro effetto che si applichi a essa non ha effetto sul corpo fisico dell'incantatore e non persiste quando vi fa ritorno. L'incantesimo termina per l'incantatore e i suoi compagni quando l'incantatore utilizza la sua azione per interromperlo. Al termine dell'incantesimo, la creatura influenzata ritorna nel suo corpo fisico e si risveglia. È anche possibile che l'incantesimo termini prematuramente per l'incantatore e i suoi compagni: un incantesimo dissolvi magie lanciato con successo contro una forma astrale o un corpo fisico termina l'incantesimo per quella creatura. Inoltre, l'incantesimo termina se il corpo originale o la forma astrale di una creatura scende a 0 punti ferita. Se l'incantesimo termina e il cordone argentato è ancora intatto, questo trascina la forma astrale della creatura all'interno del suo corpo, ponendo fine allo stato di animazione sospesa. Se l'incantatore è tornato prematuramente nel suo corpo, i suoi compagni rimangono nelle loro forme astrali e devono trovare da soli il modo di rientrare nei loro corpi, solitamente scendendo a 0 punti ferita.
