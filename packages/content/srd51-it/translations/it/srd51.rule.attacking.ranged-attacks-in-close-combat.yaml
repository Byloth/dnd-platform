name: Attacchi a distanza in combattimento ravvicinato
text: |-
  Colpire un bersaglio con un attacco a distanza è più difficile quando il nemico è molto vicino. Quando un personaggio effettua un attacco a distanza con un'arma, un incantesimo o altri mezzi, subisce svantaggio al tiro per colpire se si trova entro 1,5 metri da una creatura ostile non incapacitata e che sia in grado di vederlo.
