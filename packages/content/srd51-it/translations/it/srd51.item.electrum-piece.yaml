name: "Moneta di electrum"
text: "Esistono inoltre alcune monete insolite fatte di altri metalli preziosi, che a volte compaiono nei cumuli dei tesori. La moneta di electrum (me) e la moneta di platino (mp) provengono da imperi decaduti e regni perduti e a volte destano sospetto e scetticismo se usate nelle transazioni. Una moneta di electrum vale cinque monete d'argento e una moneta di platino vale dieci monete d'oro."
