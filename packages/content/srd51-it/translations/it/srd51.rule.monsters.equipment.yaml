name: "Equipaggiamento"
text: |-
  È raro che una scheda delle statistiche elenchi l'equipaggiamento di un mostro, a eccezione dell'armatura o delle armi che potrebbe usare. Si presume che una creatura che abitualmente indossa degli abiti, come un umanoide, sia vestita in modo adeguato.

  È possibile dotare i mostri di ulteriore equipaggiamento e dei monili che si preferisce, oltre che decidere quale parte dell'equipaggiamento del mostro è recuperabile dopo che la creatura è stata uccisa e se una qualsiasi parte di quell'equipaggiamento è ancora utilizzabile. Per esempio, è raro che un'armatura malridotta creata per un mostro sia utilizzabile da qualcun altro.

  Se un mostro in grado di lanciare incantesimi ha bisogno di componenti materiali per lanciarli, si presume che possieda le componenti materiali necessarie per lanciare gli incantesimi della sua scheda delle statistiche.
