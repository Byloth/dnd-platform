name: Pugnale avvelenato
text: |-
  Arma (pugnale), rara

  Il personaggio ottiene un bonus di +1 ai tiri per colpire e ai tiri per i danni effettuati con quest'arma magica.

  Può usare un'azione per fare in modo che la lama del coltello si ricopra di uno spesso strato di veleno nero. Il veleno resta sulla lama per 1 minuto o finché un attacco sferrato con quest'arma non colpisce una creatura. La creatura colpita deve superare un tiro salvezza su Costituzione con CD 15, altrimenti subisce 2d10 danni da veleno e diventa avvelenata per 1 minuto. Il pugnale non può più essere utilizzato in questo modo fino all'alba successiva.
features.0.name: Bonus di +1
features.1.name: Veleno
features.1.effects.0.name: Ricoprire la lama di veleno
features.1.effects.0.text: Uno spesso strato di veleno nero ricopre la lama per 1 minuto o finché un attacco sferrato con quest'arma non colpisce una creatura. La creatura colpita deve superare un tiro salvezza su Costituzione con CD 15, altrimenti subisce 2d10 danni da veleno e diventa avvelenata per 1 minuto. Il pugnale non può più essere utilizzato in questo modo fino all'alba successiva.
features.1.effects.0.onUse.0.text: "Al prossimo colpo entro 1 minuto: tiro salvezza su Costituzione con CD 15, altrimenti 2d10 danni da veleno e avvelenato per 1 minuto; poi disattiva il veleno."
