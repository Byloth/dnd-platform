name: Bastone del colpo possente
text: |-
  Bastone, molto raro (richiede sintonia)

  Questo bastone può essere impugnato come un bastone ferrato magico che garantisce un bonus di +3 ai tiri per colpire e ai tiri per i danni effettuati con esso.

  Il bastone possiede 10 cariche. Quando il personaggio colpisce con un attacco in mischia usando il bastone, può consumare fino a 3 delle sue cariche. Per ogni carica consumata, il bersaglio subisce 1d6 danni da forza extra. All'alba di ogni giorno, il bastone recupera 1d6 + 4 cariche consumate. Se il personaggio consuma l'ultima carica, deve tirare un d20; con un 1, il bastone diventa un bastone ferrato non magico.
