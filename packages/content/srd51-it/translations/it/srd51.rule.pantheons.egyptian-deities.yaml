name: "Divinità egizie"
text: |-
  | Divinità                                                | Allineamento | Domini suggeriti         | Simbolo                                |
  |---------------------------------------------------------|--------------|--------------------------|----------------------------------------|
  | Ra-Horakhty, dio del sole e signore degli dèi           | LB           | Luce, Vita               | Disco solare circondato da un serpente |
  | Anubi, dio del giudizio e della morte                   | LN           | Morte                    | Sciacallo nero                         |
  | Apopi, dio del male, del fuoco e dei serpenti           | NM           | Inganno                  | Serpente infuocato                     |
  | Bast, dea dei gatti e della vendetta                    | CB           | Guerra                   | Gatto                                  |
  | Bes, dio della fortuna e della musica                   | CN           | Inganno                  | Immagine della divinità deforme        |
  | Hathor, dea dell'amore, della musica e della maternità  | NB           | Luce, Vita               | Testa di vacca cornuta con disco lunare |
  | Imhotep, dio dell'artigianato e della medicina          | NB           | Conoscenza               | Piramide a gradoni                     |
  | Iside, dea della fertilità e della magia                | NB           | Conoscenza, Vita         | Ankh e stella                          |
  | Nefti, dea della morte e del lutto                      | CB           | Morte                    | Corna su disco lunare                  |
  | Osiride, dio della natura e dell'oltretomba             | LB           | Natura, Vita             | Vincastro e mazzafrusto                |
  | Ptah, dio dell'artigianato, della conoscenza e dei segreti | LN        | Conoscenza               | Toro                                   |
  | Set, dio dell'oscurità e delle tempeste di sabbia       | CM           | Inganno, Morte, Tempesta | Cobra arrotolato                       |
  | Sobek, dio dell'acqua e dei coccodrilli                 | LM           | Natura, Tempesta         | Testa di coccodrillo con corna e piume |
  | Toth, dio della conoscenza e della saggezza             | N            | Conoscenza               | Ibis                                   |
