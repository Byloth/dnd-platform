name: Invocatore
pitch: Uno studioso della magia con un libro degli incantesimi pieno di fuoco, fulmini e trucchi, che risolve i problemi sapendone di più.
why.class: I maghi hanno più incantesimi di tutti; il tuo libro degli incantesimi cresce mentre giochi, e ogni giorno prepari quelli che ti servono.
why.species: Uno gnomo delle rocce aumenta l'Intelligenza e la Costituzione e resiste alla magia che prende di mira la mente.
why.abilityPriority: L'Intelligenza alimenta i tuoi incantesimi; la Costituzione ti dà punti ferita e mantiene la tua concentrazione; la Destrezza ti protegge senza armatura.
why.background: Accolito, l'unico background dell'SRD, ti dà le abilità Intuizione e Religione e due linguaggi.
