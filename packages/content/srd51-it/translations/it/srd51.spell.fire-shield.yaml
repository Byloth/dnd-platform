name: Scudo di fuoco
components.m: Un frammento di fosforo o una lucciola.
text: |-
  Per la durata dell'incantesimo, il corpo dell'incantatore è avvolto da fiamme sottili, che proiettano luce intensa in un raggio di 3 metri e luce fioca per ulteriori 3 metri. L'incantatore può usare un'azione per far terminare prematuramente l'incantesimo. Le fiamme conferiscono all'incantatore uno scudo ardente o gelido a sua scelta. Lo scudo ardente gli conferisce resistenza ai danni da freddo, mentre lo scudo gelido resistenza ai danni da fuoco. Inoltre, ogni volta che una creatura entro 1,5 metri dall'incantatore lo colpisce con un attacco in mischia, dallo scudo erompono delle fiamme: l'attaccante subisce 2d8 danni da fuoco da uno scudo ardente o danni da freddo da uno scudo gelido.
effects.0.text: "Scudo ardente: resistenza ai danni da freddo; scudo gelido: resistenza ai danni da fuoco (a tua scelta al momento del lancio). Ogni volta che una creatura entro 1,5 metri da te ti colpisce con un attacco in mischia, subisce 2d8 danni da fuoco (scudo ardente) o danni da freddo (scudo gelido). Proietti luce intensa in un raggio di 3 metri e luce fioca per ulteriori 3 metri; puoi usare un'azione per far terminare prematuramente l'incantesimo."
effects.0.note: La resistenza dipende dall'opzione scelta, quindi non è espressa come difesa; i danni inflitti agli attaccanti non sono esprimibili in v0.
