name: "Azioni di tana"
text: |-
  Se una creatura leggendaria possiede delle azioni di tana, può usarle per convogliare la magia latente nella sua tana. Con un punteggio di iniziativa 20 (perdendo tutte le iniziative in parità), può usare una delle sue opzioni di azioni di tana. Non può farlo finché è incapacitata o impossibilitata in altri modi a effettuare azioni. Se colta di sorpresa, può usarne una soltanto dopo il suo primo turno in combattimento.
