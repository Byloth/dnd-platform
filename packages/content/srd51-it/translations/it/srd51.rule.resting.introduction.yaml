name: "Riposare"
text: |-
  Per quanto possano essere eroici, gli avventurieri non possono trascorrere ogni ora del giorno immersi in esplorazioni, interazioni sociali e combattimenti. Anche gli eroi hanno bisogno di riposare, di tempo per dormire e mangiare, curarsi le ferite, rinfrancare la mente e lo spirito per lanciare nuovi incantesimi e recuperare le forze in previsione di nuove avventure.

  Sia gli avventurieri che le altre creature possono concedersi dei riposi brevi nell'arco della giornata e un riposo lungo a fine giornata.
