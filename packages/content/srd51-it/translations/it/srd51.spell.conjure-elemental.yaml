name: Evoca elementale
components.m: Incenso bruciato per l'aria, argilla morbida per la terra, zolfo e fosforo per il fuoco o acqua e sabbia per l'acqua.
text: |-
  L'incantatore evoca un servo elementale, scegliendo un'area di aria, terra, fuoco o acqua delle dimensioni di un cubo di 3 metri entro gittata. Un elementale con grado di sfida pari o inferiore a 5 e compatibile con l'area scelta appare in uno spazio libero entro 3 metri da essa. Per esempio, un elementale del fuoco emerge da un falò e un elementale della terra affiora dal terreno. L'elementale scompare quando scende a 0 punti ferita o al termine dell'incantesimo. L'elementale è amichevole nei confronti dell'incantatore e dei suoi compagni per tutta la durata dell'incantesimo. Si tira per l'iniziativa dell'elementale, che svolge i propri turni. L'elementale obbedisce ai comandi verbali dell'incantatore (nessuna azione richiesta). Se l'incantatore non impartisce comandi, l'elementale si difende dalle creature ostili, ma non intraprende altre azioni. Se la concentrazione viene meno, l'elementale non scompare ma l'incantatore perde il controllo su di lui attirandone l'ostilità su di sé e sui suoi compagni, rischiando che l'elementale li attacchi. L'incantatore non può scacciare un elementale fuori dal suo controllo, che tuttavia scompare 1 ora dopo essere stato evocato. Il GM possiede le statistiche dell'elementale.
higherLevel: |-
  Quando l'incantatore lancia questo incantesimo usando uno slot incantesimo di 6° livello o superiore, il grado di sfida aumenta di 1 per ogni slot di livello superiore al 5°.
effects.0.text: |-
  L'elementale evocato (grado di sfida pari o inferiore a 5, compatibile con l'area di aria, terra, fuoco o acqua scelta) è amichevole nei confronti dell'incantatore e dei suoi compagni, tira la propria iniziativa e obbedisce ai suoi comandi verbali (nessuna azione richiesta); se non riceve comandi, si limita a difendersi. Scompare quando scende a 0 punti ferita o al termine dell'incantesimo. Se la concentrazione viene meno, l'elementale non scompare, diventa ostile, non può essere scacciato e scompare 1 ora dopo essere stato evocato.
onCast.0.text: |-
  Il GM possiede le statistiche dell'elementale (nessun blocco di statistiche nella v0). Il grado di sfida aumenta di 1 per ogni slot di livello superiore al 5°.
