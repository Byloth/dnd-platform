name: Sogno
components.m: Una manciata di sabbia, una goccia d'inchiostro e una penna strappata a un uccello addormentato.
text: |-
  Questo incantesimo modella i sogni di una creatura. L'incantatore sceglie come bersaglio dell'incantesimo una creatura a lui nota, che deve trovarsi sul suo stesso piano di esistenza. Le creature che non dormono, come gli elfi, non possono essere contattate con questo incantesimo. L'incantatore o una creatura consenziente da lui toccata entra in uno stato di trance, assumendo il ruolo di messaggero. Durante la trance, il messaggero è consapevole di ciò che lo circonda, ma non può intraprendere azioni o muoversi. Se il bersaglio dorme, il messaggero gli appare in sogno e può conversare con lui finché rimane addormentato e l'incantesimo non termina. Il messaggero può anche modellare l'ambiente del sogno, creando paesaggi, oggetti e altre immagini. Il messaggero può uscire dalla trance in ogni momento, terminando prematuramente l'effetto dell'incantesimo. Al suo risveglio, il bersaglio ricorda il sogno perfettamente. Se il bersaglio è sveglio quando l'incantatore lancia l'incantesimo, il messaggero ne è consapevole e può terminare la trance (e l'incantesimo) o aspettare che il bersaglio si addormenti e così apparire nei suoi sogni. L'incantatore può fare in modo che il messaggero appaia mostruoso e terrificante al bersaglio. In questo caso, il messaggero può trasmettere un messaggio di massimo dieci parole e poi il bersaglio deve effettuare un tiro salvezza su Saggezza. Se lo fallisce, echi della mostruosità spettrale generano un incubo che permane per tutta la durata del suo sonno e gli impedisce di ottenere benefici da quel riposo. Inoltre, al suo risveglio, il bersaglio subisce 3d6 danni psichici. Se l'incantatore possiede una parte del corpo, una ciocca di capelli, un frammento di unghia o parti analoghe del corpo del bersaglio, questo subisce svantaggio al tiro salvezza.
