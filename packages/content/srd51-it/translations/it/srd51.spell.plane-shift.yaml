name: Spostamento planare
components.m: Una verga di metallo biforcuta del valore di almeno 250 mo, in sintonia con un particolare piano di esistenza.
text: L'incantatore e un massimo di otto creature consenzienti, che si tengono per mano formando un cerchio, vengono trasportati su un piano di esistenza diverso. L'incantatore può specificare la destinazione in termini generici, come la Città di Ottone sul Piano Elementale del Fuoco o il palazzo di Dispater sul secondo livello dei Nove Inferi, apparendo in quella destinazione o nelle sue immediate vicinanze. Per esempio, se cerca di raggiungere la Città di Ottone, potrebbe arrivare nella Via dell'Acciaio, davanti alla Porta delle Ceneri, oppure nei pressi della città ma dalla parte opposta del Mare di Fuoco, a discrezione del GM. In alternativa, se l'incantatore conosce la sequenza di sigilli di un cerchio di teletrasporto su un altro piano di esistenza, questo incantesimo può portarlo fino a quel cerchio. Se il cerchio di teletrasporto è troppo piccolo per contenere tutte le creature trasportate dall'incantatore, esse appariranno negli spazi liberi più vicini. L'incantatore può usare questo incantesimo per esiliare una creatura non consenziente su un altro piano, scegliendo una creatura alla sua portata ed effettuando un attacco con incantesimo in mischia contro di essa. Se il colpo va a segno, la creatura deve effettuare un tiro salvezza su Carisma. Se lo fallisce, viene trasportata in un luogo casuale sul piano di esistenza specificato dall'incantatore e dovrà trovare da sola il modo di tornare sul piano di esistenza in cui si trovava in precedenza.
