name: "Follia"
text: "In una campagna normale, i personaggi non impazziscono a causa degli orrori che affrontano e dai massacri che infliggono giorno dopo giorno, ma la tensione della vita da avventurieri può talvolta risultare insopportabile. Se la sua campagna fa uso di forti tematiche horror, il GM potrebbe usare la follia per enfatizzare quel tema, sottolineando la natura straordinaria e raccapricciante delle minacce che gli avventurieri devono affrontare."
