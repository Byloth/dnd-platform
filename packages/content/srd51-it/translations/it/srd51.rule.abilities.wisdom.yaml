name: Saggezza
text: |-
  La Saggezza rappresenta la percezione, l'intuizione e il grado di sintonia del personaggio con il mondo circostante.

  ## Prove di Saggezza

  Una prova di Saggezza rappresenta un tentativo di interpretare il linguaggio corporeo o le emozioni di qualcuno, notare qualcosa nell'ambiente o prendersi cura di una persona ferita. Le abilità Addestrare Animali, Intuizione, Medicina, Percezione e Sopravvivenza rappresentano una maggiore sensibilità in certi tipi di prove di Saggezza.

  ### Addestrare Animali

  Quando un personaggio deve determinare se sia in grado di calmare un animale domestico, evitare che una cavalcatura si spaventi o intuire le intenzioni di un animale, il GM può richiedere una prova di Saggezza (Addestrare Animali). Un personaggio effettua una prova di Saggezza (Addestrare Animali) anche per controllare la sua cavalcatura quando tenta una manovra rischiosa.

  ### Intuizione

  Una prova di Saggezza (Intuizione) determina se il personaggio è in grado di discernere le vere intenzioni di una creatura, come per esempio scoprire se sta mentendo o predire la sua prossima mossa. Per farlo deve cogliere indizi dal linguaggio corporeo, dal modo di parlare e dalle alterazioni dei modi di fare di quella creatura.

  ### Medicina

  Una prova di Saggezza (Medicina) consente a un personaggio di stabilizzare un compagno morente o diagnosticare una malattia.

  ### Percezione

  Una prova di Saggezza (Percezione) consente a un personaggio di avvistare, udire o individuare in altri modi la presenza di qualcosa. Misura la consapevolezza generale dell'ambiente circostante da parte di un personaggio e l'efficacia dei suoi sensi. Per esempio, un personaggio potrebbe origliare una conversazione attraverso una porta chiusa, spiare da sotto una finestra aperta o sentire dei mostri che si muovono furtivamente nella foresta. Oppure potrebbe cercare di avvistare qualcosa di nascosto o difficile da notare, come un gruppo di orchi in agguato lungo la strada, un malvivente nascosto tra le ombre di un vicolo o la luce di una candela che filtra dalla fessura di una porta segreta.

  ### Sopravvivenza

  Il GM potrebbe richiedere a un personaggio di effettuare una prova di Saggezza (Sopravvivenza) per seguire tracce, cacciare animali selvatici, guidare il gruppo attraverso una distesa ghiacciata, riconoscere i segni della presenza di orsigufo, predire il tempo o evitare sabbie mobili e altri pericoli naturali.

  ### Altre prove di Saggezza

  Il GM potrebbe richiedere una prova di Saggezza anche quando un personaggio tenta di compiere imprese come:  - Affidarsi al proprio sesto senso sul corso d'azione da intraprendere - Capire se una creatura apparentemente viva o morta è in realtà un non morto  ## Caratteristica da incantatore

  I chierici, i druidi e i ranger usano Saggezza come caratteristica da incantatore per determinare le CD dei tiri salvezza degli incantesimi che lanciano.
