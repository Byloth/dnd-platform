name: "Vendere i tesori"
text: |-
  Esplorando i dungeon, gli avventurieri hanno numerose opportunità di recuperare tesori, equipaggiamento, armi, armature e altro ancora. In genere possono vendere tutto questo quando tornano in una città o in un altro insediamento, purché riescano a trovare compratori e mercanti interessati al loro bottino.

  **_Armi, armature e altro equipaggiamento._** Come regola generale, le armi, le armature e gli altri oggetti integri sono valutati alla metà del loro costo al mercato. È raro che le armi e le armature usate dai mostri siano in condizioni sufficientemente buone da essere vendute.

  **_Oggetti magici._** La vendita di oggetti magici è problematica. Trovare qualcuno che compri una pozione o una pergamena non è difficile, ma solo i nobili più ricchi possono permettersi altri oggetti. Per lo stesso motivo, fatta eccezione per alcuni oggetti magici comuni, difficilmente un avventuriero troverà oggetti magici o incantesimi da acquistare. Il valore della magia è di gran lunga superiore a quello dell'oro e bisogna sempre tenerne conto.

  **_Gemme, gioielli e opere d'arte._** Questi oggetti mantengono il loro intero valore sul mercato e possono essere ceduti in cambio di monete o usati come valuta per altre transazioni. Nel caso di tesori particolarmente preziosi, il GM potrebbe chiedere ai giocatori di trovare prima un compratore in una cittadina di grandi dimensioni o in una comunità più popolosa.

  **_Merci._** Nelle terre di confine, molti conducono le transazioni tramite il baratto. Come le gemme e le opere d'arte, le merci (lingotti di ferro, sacchi di sale, bestiame e così via) mantengono il loro intero valore sul mercato e possono essere usate come valuta.
