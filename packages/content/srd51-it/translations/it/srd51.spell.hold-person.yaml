name: Blocca persone
components.m: Una piccola sbarra di ferro.
text: |-
  L'incantatore sceglie un umanoide entro gittata che è in grado di vedere. Il bersaglio deve superare un tiro salvezza su Saggezza, altrimenti sarà paralizzato per la durata dell'incantesimo. Il bersaglio può effettuare un altro tiro salvezza su Saggezza alla fine di ogni suo turno. Se lo supera, si libera dall'effetto dell'incantesimo.
higherLevel: |-
  Quando l'incantatore lancia questo incantesimo usando uno slot incantesimo di 3° livello o superiore, può bersagliare un umanoide aggiuntivo per ogni slot superiore al 2°. In quel momento, gli umanoidi devono trovarsi a non più di 9 metri l'uno dall'altro.
onCast.1.text: |-
  Solo umanoidi, con un tiro salvezza su Saggezza fallito. Alla fine di ogni suo turno il bersaglio ripete il tiro salvezza; in caso di successo l'incantesimo termina per lui. Ogni slot di livello superiore al 2° bersaglia un umanoide aggiuntivo (entro 9 metri l'uno dall'altro).
