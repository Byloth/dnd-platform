name: Bastone dello charme
text: |-
  Bastone, raro (richiede sintonia con un bardo, un chierico, un druido, un mago, uno stregone o un warlock)

  Mentre il personaggio impugna questo bastone, può usare un'azione e consumare 1 delle sue 10 cariche per lanciare con esso *charme su persone*, *comando* o *comprensione dei linguaggi* usando la sua CD del tiro salvezza sull'incantesimo. Il bastone può anche essere usato come un bastone ferrato magico.

  Se il personaggio impugna il bastone e fallisce un tiro salvezza contro un incantesimo di ammaliamento che ha solo lui come bersaglio, può trasformare il tiro salvezza fallito in un successo. Una volta usata, quest'azione non può essere riutilizzata fino all'alba successiva. Se il personaggio supera il tiro salvezza contro un incantesimo di ammaliamento che ha solo lui come bersaglio, con o senza l'intervento del bastone, può usare la sua reazione e consumare 1 carica del bastone per riflettere l'incantesimo contro il suo incantatore, come se fosse stato il personaggio a lanciarlo.

  Il bastone recupera 1d8 + 2 cariche consumate all'alba di ogni giorno. Se il personaggio consuma l'ultima carica, deve tirare un d20; con un 1, il bastone diventa un bastone ferrato non magico.
attunement.by: un bardo, un chierico, un druido, un mago, uno stregone o un warlock
