name: Triboli (sacchetto da 20)
text: Con un'azione, un personaggio può spargere il contenuto di un sacchetto di triboli per coprire un'area quadrata con lato di 1,5 metri. Ogni creatura che entra in quell'area deve superare un tiro salvezza su Destrezza con CD 15, altrimenti dovrà smettere di muoversi per questo turno e subire 1 danno perforante. Se subisce questo danno, la sua velocità base sul terreno è ridotta di 3 metri finché non recupera almeno 1 punto ferita. Se la creatura si muove attraverso l'area a velocità dimezzata, non deve effettuare il tiro salvezza.
