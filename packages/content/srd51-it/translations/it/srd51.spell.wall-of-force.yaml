name: Muro di forza
components.m: Un pizzico di polvere ricavata dalla distruzione di una gemma trasparente.
text: |-
  Un muro di forza invisibile si materializza in un punto a scelta dell'incantatore situato entro gittata. Esso appare nell'orientamento che l'incantatore desidera, come barriera orizzontale, verticale o inclinata. Può fluttuare nell'aria o poggiare su una superficie solida. L'incantatore può modellare la barriera in una cupola semisferica o in una sfera con raggio massimo di 3 metri, oppure come una superficie piatta composta da dieci pannelli con lato di 3 metri. Ogni pannello dev'essere contiguo a un altro pannello. In qualsiasi forma, il muro ha uno spessore di 0,6 cm e permane per tutta la durata dell'incantesimo. Inoltre, se quando appare passa attraverso lo spazio di una creatura, questa viene spinta da un lato del muro a scelta dell'incantatore. Nulla può fisicamente attraversare il muro, che è immune a tutti i danni e non può essere dissolto con dissolvi magie. Tuttavia, un incantesimo disintegrazione distrugge il muro all'istante. Il muro si estende anche sul Piano Etereo, bloccando i viaggi eterei che lo attraversano.
