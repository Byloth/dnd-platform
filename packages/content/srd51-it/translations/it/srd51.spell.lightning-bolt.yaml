name: Fulmine
components.m: Un ciuffo di pelo e una verga d'ambra, di cristallo o di vetro.
text: |-
  Un fulmine parte dall'incantatore in una direzione a sua scelta, formando una linea lunga 30 metri e larga 1,5 metri. Ogni creatura entro la linea deve effettuare un tiro salvezza su Destrezza. Se lo fallisce, la creatura subisce 8d6 danni da fulmine, mentre se lo supera subisce soltanto la metà di quei danni. Il fulmine incendia ogni oggetto infiammabile nell'area che non sia indossato o trasportato.
higherLevel: |-
  Quando l'incantatore lancia questo incantesimo usando uno slot incantesimo di 4° livello o superiore, i danni aumentano di 1d6 per ogni slot di livello superiore al 3°.
