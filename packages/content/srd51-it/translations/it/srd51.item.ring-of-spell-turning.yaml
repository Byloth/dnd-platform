name: Anello rifletti incantesimo
text: |-
  Anello, leggendario (richiede sintonia)

  Finché il personaggio indossa questo anello, dispone di vantaggio ai tiri salvezza contro qualsiasi incantesimo che bersagli soltanto lui (non in un'area di effetto). Inoltre, se il personaggio ottiene 20 al tiro salvezza e l'incantesimo è di livello pari o inferiore al 7°, esso non ha alcun effetto sul personaggio e viene invece riflesso contro l'incantatore, usando il livello di slot, la CD del tiro salvezza sull'incantesimo, il bonus di attacco e la caratteristica da incantatore di chi ha lanciato l'incantesimo.
features.0.name: Riflettere incantesimi
features.0.effects.1.text: |-
  Se ottieni 20 a un tale tiro salvezza e l'incantesimo è di livello pari o inferiore al 7°, l'incantesimo non ha alcun effetto su di te e viene invece riflesso contro l'incantatore, usando il livello di slot, la CD del tiro salvezza sull'incantesimo, il bonus di attacco e la caratteristica da incantatore di chi ha lanciato l'incantesimo.
features.0.effects.1.note: Riflettere un incantesimo con un 20 naturale si risolve al tavolo; il motore di gioco mostra solo questo promemoria.
