name: Colpo accurato
text: |-
  L'incantatore tende la mano e punta il dito contro un bersaglio entro gittata e la magia gli concede una breve percezione delle sue difese. Nel suo turno successivo, l'incantatore dispone di vantaggio al primo tiro per colpire contro il bersaglio, purché l'incantesimo non sia terminato.
effects.0.note: Solo il tuo primo tiro per colpire contro il bersaglio nel tuo turno successivo, purché l'incantesimo non sia terminato.
