name: Scopa volante
text: |-
  Oggetto meraviglioso, non comune

  Questa scopa di legno, del peso di 1,5 kg, funziona in modo normale finché il personaggio non ci monta a cavallo e pronuncia la sua parola d'ordine. A questo punto la scopa si solleva in aria e può essere cavalcata in volo. Ha una velocità di volare pari a 15 metri e può trasportare fino a 200 kg di peso, ma con un carico superiore a 100 kg la sua velocità di volare scende a 9 metri. Quando il personaggio atterra, la scopa smette di fluttuare.

  Il personaggio può inviare la scopa in volo da sola fino a una destinazione entro 1,5 km da lui, pronunciando la parola d'ordine e nominando il luogo in questione, purché abbia familiarità con esso. Il personaggio può far tornare indietro la scopa pronunciando un'altra parola d'ordine, purché essa si trovi ancora entro 1,5 km da lui.
