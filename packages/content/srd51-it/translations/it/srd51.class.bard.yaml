name: Bardo
levels.1.features.0.name: Ispirazione Bardica
levels.1.features.0.text: |-
  Un bardo può ispirare gli altri tramite il lirismo delle sue parole o della sua musica. Per farlo usa un'azione bonus nel suo turno per scegliere una creatura diversa da se stesso, situata entro 18 metri da lui e in grado di sentirlo. Quella creatura ottiene un dado di Ispirazione Bardica, un d6.

  Una volta entro i 10 minuti successivi, quella creatura può tirare il dado e aggiungere il risultato ottenuto a una prova di caratteristica, un tiro per colpire o un tiro salvezza da essa effettuato. La creatura può aspettare di avere tirato il d20 prima di decidere se utilizzare il dado di Ispirazione Bardica, ma deve decidere se utilizzarlo prima che il GM dichiari se il tiro ha avuto successo o meno. Una volta tirato il dado di Ispirazione Bardica, quel dado è perduto. Una creatura può possedere un solo dado di Ispirazione Bardica alla volta.

  Il bardo può utilizzare questo privilegio un numero di volte pari al suo modificatore di Carisma (minimo di una volta). Recupera tutti gli utilizzi spesi quando completa un riposo lungo.

  Il dado di Ispirazione Bardica cambia quando vengono raggiunti determinati livelli in questa classe. Il dado diventa un d8 al 5° livello, un d10 al 10° livello e un d12 al 15° livello.
levels.1.features.0.effects.0.name: Ispirazione Bardica
levels.1.features.0.effects.0.note: |-
  Dado di Ispirazione Bardica: d6, d8 al 5° livello, d10 al 10°, d12 al 15° (table(bard.bardic-inspiration-die)).
levels.1.features.0.effects.1.name: Ispirazione Bardica
levels.1.features.0.effects.1.text: |-
  Scegli una creatura diversa da te, situata entro 18 metri da te e in grado di sentirti. Quella creatura ottiene un dado di Ispirazione Bardica. Una volta entro i 10 minuti successivi, quella creatura può tirare il dado e aggiungere il risultato ottenuto a una prova di caratteristica, un tiro per colpire o un tiro salvezza da essa effettuato, decidendo dopo avere tirato il d20 ma prima che il GM dichiari se il tiro ha avuto successo. Una creatura può possedere un solo dado di Ispirazione Bardica alla volta.
levels.1.features.0.effects.1.onUse.0.text: |-
  Il bersaglio ottiene un dado di Ispirazione Bardica del tipo table(bard.bardic-inspiration-die); il dado è perduto una volta tirato o dopo 10 minuti.
levels.1.features.1.name: Incantesimi
levels.1.features.1.text: |-
  Un bardo ha imparato a districare e rimodellare la trama della realtà in armonia con i suoi desideri e con la musica.

  I suoi incantesimi fanno parte del suo vasto repertorio come magie che il bardo può mettere in sintonia con le situazioni più disparate.

  ###Trucchetti

  Un bardo conosce due trucchetti a sua scelta tratti dalla lista degli incantesimi da bardo. Apprende ulteriori trucchetti da bardo a sua scelta ai livelli successivi, come indicato dalla colonna "Trucchetti Conosciuti" nella tabella "Bardo".

  ###Slot incantesimo

  La tabella "Bardo" indica quanti slot incantesimo possiede un bardo per lanciare i suoi incantesimi di 1° livello e di livello superiore. Per lanciare uno di questi incantesimi, deve spendere uno slot incantesimo di livello pari o superiore a quello dell'incantesimo. Recupera tutti gli slot incantesimo spesi quando completa un riposo lungo.

  Per esempio, se un bardo conosce l'incantesimo di 1° livello *cura ferite* e possiede uno slot incantesimo di 1° livello e uno slot incantesimo di 2° livello, può lanciare *cura ferite* usando uno qualsiasi dei due slot.

  ###Incantesimi conosciuti di 1° livello e di livello superiore

  Un bardo conosce quattro incantesimi di 1° livello a sua scelta dalla lista degli incantesimi da bardo.

  La colonna "Incantesimi conosciuti" nella tabella "Bardo" indica quando un bardo impara altri incantesimi da bardo a sua scelta. Ognuno di questi incantesimi deve appartenere a un livello di cui il bardo possiede degli slot incantesimo, come indicato nella tabella. Per esempio, quando un bardo arriva al 3° livello, può imparare un nuovo incantesimo di 1° o di 2° livello.

  Inoltre, quando un bardo acquisisce un livello, può scegliere un incantesimo da bardo che conosce e sostituirlo con un altro incantesimo dalla lista degli incantesimi da bardo; anche il nuovo incantesimo deve essere di un livello di cui il bardo possiede degli slot incantesimo.

  ###Caratteristica da incantatore

  Carisma è la caratteristica da incantatore per gli incantesimi da bardo. La magia di un bardo fluisce dal cuore e dall'anima che egli riversa in ogni esibizione della sua musica o della sua oratoria. Usa Carisma ogni volta che un incantesimo fa riferimento alla sua caratteristica da incantatore. Usa inoltre il suo modificatore di Carisma per definire la CD del tiro salvezza di un incantesimo da bardo da lui lanciato e quando effettua un tiro per colpire con un incantesimo.

  *CD del tiro salvezza sull'incantesimo* = 8 + il bonus di competenza + il modificatore di Carisma

  *Modificatore di attacco dell'incantesimo* = il bonus di competenza + il modificatore di Carisma

  ###Celebrare rituali

  Un bardo può lanciare qualsiasi incantesimo da bardo a lui conosciuto come rituale se quell'incantesimo possiede il descrittore rituale.

  ###Focus da incantatore

  Un bardo può usare uno strumento musicale (vedi capitolo 5, "Equipaggiamento") come focus da incantatore per i suoi incantesimi da bardo.
levels.2.features.0.name: Factotum
levels.2.features.0.text: |-
  A partire dal 2° livello, un bardo può aggiungere metà del suo bonus di competenza, arrotondato per difetto, a ogni prova di caratteristica da lui effettuata che non includa già il suo bonus di competenza.
levels.2.features.0.effects.0.note: |-
  Metà del tuo bonus di competenza, arrotondato per difetto, alle prove di caratteristica che non lo includono già.
levels.2.features.1.name: Canto di Riposo
levels.2.features.1.text: |-
  Dal 2° livello, un bardo può usare una musica o un'orazione lenitiva per infondere nuova vita nei suoi alleati feriti durante un riposo breve. Se il bardo o le eventuali creature amiche in grado di udire la sua esibizione recuperano punti ferita alla fine di un riposo breve spendendo uno o più Dadi Vita, ognuna di quelle creature recupera 1d6 punti ferita extra.

  I punti ferita extra aumentano quando il bardo raggiunge determinati livelli in questa classe: 1d8 al 9° livello, 1d10 al 13° livello e 1d12 al 17° livello.
levels.2.features.1.onRest.0.text: |-
  Riposo breve: se tu o le eventuali creature amiche in grado di udire la tua esibizione recuperate punti ferita alla fine del riposo spendendo uno o più Dadi Vita, ognuna di quelle creature recupera punti ferita extra: 1d6, 1d8 al 9° livello, 1d10 al 13°, 1d12 al 17° (tipo di dado table(bard.song-of-rest-die)).
levels.3.features.0.name: Collegio Bardico
levels.3.features.0.text: |-
  Al 3° livello, un bardo apprende le tecniche più avanzate di un collegio bardico a sua scelta: il Collegio della Sapienza o il Collegio del Valore, entrambi descritti in dettaglio alla fine della descrizione della classe. Questa scelta gli conferisce alcuni privilegi al 3° livello e poi di nuovo al 6° e al 14° livello.
levels.3.features.1.name: Maestria
levels.3.features.1.text: |-
  Al 3° livello, un bardo sceglie due tra le sue competenze nelle abilità. Il suo bonus di competenza raddoppia in ogni prova di caratteristica effettuata usando una delle competenze scelte.

  Al 10° livello, un bardo può scegliere altre due competenze nelle abilità per ottenere questo beneficio.
levels.3.features.1.effects.0.note: |-
  Scegli due tra le tue competenze nelle abilità; il tuo bonus di competenza raddoppia in ogni prova di caratteristica effettuata usando una di esse. La scelta non può ancora essere limitata alle abilità in cui hai già competenza.
levels.3.features.1.effects.1.note: |-
  Al 10° livello, scegli altre due competenze nelle abilità per ottenere questo beneficio. La scelta non può ancora essere limitata alle abilità in cui hai già competenza.
levels.4.features.0.name: Aumento dei Punteggi di Caratteristica
levels.4.features.0.text: |-
  Quando arriva al 4° livello e poi di nuovo all'8°, al 12°, al 16° e al 19° livello, un bardo può aumentare di 2 un punteggio di caratteristica a sua scelta, oppure può aumentare di 1 due punteggi di caratteristica a sua scelta. Come di consueto, non è consentito aumentare un punteggio di caratteristica a più di 20 utilizzando questo privilegio.
levels.5.features.0.name: Fonte di Ispirazione
levels.5.features.0.text: |-
  A partire dal 5° livello, un bardo recupera tutti i suoi utilizzi spesi di Ispirazione Bardica quando completa un riposo breve o lungo.
levels.5.features.0.effects.0.note: |-
  Recuperi tutti i tuoi utilizzi spesi di Ispirazione Bardica quando completi un riposo breve o lungo.
levels.6.features.0.name: Controfascino
levels.6.features.0.text: |-
  Al 6° livello, un bardo ottiene la capacità di usare note musicali o parole del potere per interferire negli effetti di influenza mentale. Con un'azione può iniziare un'esibizione che dura fino alla fine del suo turno successivo. Durante quel periodo, il bardo e ogni creatura amica entro 9 metri da lui dispongono di vantaggio ai tiri salvezza per non essere affascinati o spaventati. Una creatura deve essere in grado di sentire il bardo per ottenere questo beneficio. L'esibizione termina prematuramente se il bardo diventa incapacitato o è ridotto al silenzio, o se vi pone fine volontariamente (nessuna azione richiesta).
levels.6.features.0.effects.0.name: Controfascino
levels.6.features.0.effects.0.text: |-
  Con un'azione puoi iniziare un'esibizione che dura fino alla fine del tuo turno successivo. Durante quel periodo, tu e ogni creatura amica entro 9 metri da te disponete di vantaggio ai tiri salvezza per non essere affascinati o spaventati. Una creatura deve essere in grado di sentirti per ottenere questo beneficio. L'esibizione termina prematuramente se diventi incapacitato o sei ridotto al silenzio, o se vi poni fine volontariamente (nessuna azione richiesta).
levels.6.features.0.effects.0.onUse.0.text: |-
  Le creature amiche entro 9 metri in grado di sentirti condividono il vantaggio.
levels.10.features.0.name: Segreti Magici
levels.10.features.0.text: |-
  Giunto al 10° livello, un bardo ha attinto alle conoscenze magiche provenienti da una vasta gamma di discipline. Il bardo sceglie due incantesimi di qualsiasi classe, inclusa questa stessa classe. Ogni incantesimo scelto deve essere di un livello che il bardo sia in grado di lanciare, come indicato dalla tabella "Bardo", oppure deve essere un trucchetto.

  Gli incantesimi scelti contano come incantesimi da bardo e vanno inclusi nel numero specificato dalla colonna "Incantesimi conosciuti" nella tabella "Bardo".

  Un bardo apprende due incantesimi aggiuntivi di qualsiasi classe al 14° livello e poi di nuovo al 18° livello.
levels.10.features.0.effects.0.note: |-
  Due incantesimi di qualsiasi classe, di un livello che sei in grado di lanciare o trucchetti; contano come incantesimi da bardo e vanno inclusi nei tuoi Incantesimi conosciuti.
levels.10.features.0.effects.1.note: |-
  Altri due incantesimi di qualsiasi classe al 14° livello, di un livello che sei in grado di lanciare o trucchetti.
levels.10.features.0.effects.2.note: |-
  Altri due incantesimi di qualsiasi classe al 18° livello, di un livello che sei in grado di lanciare o trucchetti.
levels.20.features.0.name: Ispirazione Superiore
levels.20.features.0.text: |-
  Al 20° livello, quando il bardo tira per l'iniziativa e non gli rimane alcun utilizzo di Ispirazione Bardica, ne recupera un utilizzo.
levels.20.features.0.effects.0.text: |-
  Quando tiri per l'iniziativa e non ti rimane alcun utilizzo di Ispirazione Bardica, ne recuperi un utilizzo.
levels.20.features.0.effects.0.note: |-
  Lacuna: non esiste un aggancio all'evento dell'iniziativa; ripristina 1 utilizzo di bardic-inspiration quando la riserva è vuota al momento dell'iniziativa.
