name: Il Piano Materiale
text: |-
  Il Piano Materiale è il fulcro in cui le forze filosofiche ed elementali che definiscono gli altri piani si scontrano nell'esistenza concitata della vita mortale e della materia comune. Tutti i mondi fantastici del gioco esistono sul Piano Materiale, rendendolo il punto di partenza della maggior parte delle campagne e delle avventure. Il resto del multiverso è definito in relazione al Piano Materiale.

  I mondi del Piano Materiale sono immensamente variegati, in quanto espressione dell'immaginazione dei GM che vi ambientano le proprie partite, nonché della creatività dei giocatori i cui eroi vivono lì le loro avventure. Includono pianeti desertici devastati dalla magia e mondi acquatici disseminati di isole, pianeti in cui la magia si combina alle tecnologie più avanzate o intrappolati in un'età della pietra eterna, mondi in cui gli dèi camminano tra gli uomini e luoghi che invece sono stati da loro completamente abbandonati.
