features.0.effects.2.note: Vantaggio alle prove di Carisma (Persuasione) effettuate per interagire con i nani.
features.0.effects.3.text: Dopo che sei entrato in sintonia con la cintura, ogni mattina all'alba c'è una probabilità del 50 percento che ti spuntino barba e baffi, premesso che il tuo corpo possa svilupparli, o che la tua barba cresca vistosamente, se già ne hai una.
features.1.name: Benefici per chi non è un nano
