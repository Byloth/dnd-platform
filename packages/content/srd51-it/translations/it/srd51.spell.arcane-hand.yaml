name: Mano arcana
components.m: Un guscio d'uovo e un guanto di pelle di serpente.
text: |-
  L'incantatore crea una mano Grande di forza luccicante e traslucida in uno spazio libero entro gittata che è in grado di vedere. La mano permane per la durata dell'incantesimo e si muove al comando dell'incantatore, imitando i movimenti della sua mano. La mano è un oggetto che possiede CA 20 e una quantità di punti ferita pari ai punti ferita massimi dell'incantatore; quando i punti ferita scendono a 0, l'incantesimo termina. La mano possiede una Forza pari a 26 (+8) e una Destrezza pari a 10 (+0). Inoltre, non riempie il suo spazio. Quando l'incantatore lancia l'incantesimo e come azione bonus nei suoi turni successivi, può muovere la mano per un massimo di 18 metri e poi causare uno dei seguenti effetti.

  **Pugno serrato.** La mano colpisce una creatura o un oggetto situato entro 1,5 metri da essa. Con questo incantesimo l'incantatore effettua un attacco in mischia per la mano usando le proprie statistiche di gioco. Se il colpo va a segno, il bersaglio subisce 4d8 danni da forza.

  **Mano possente.** La mano tenta di spingere una creatura che si trova entro 1,5 metri da essa in una direzione a scelta dell'incantatore. Quest'ultimo effettua una prova con la Forza della mano contrapposta alla prova di Forza (Atletica) del bersaglio. Se il bersaglio è di taglia Media o inferiore, l'incantatore dispone di vantaggio alla prova. In caso di successo, la mano spinge il bersaglio fino a una distanza pari a 1,5 metri, più un numero di metri pari a 1,5 volte il modificatore di caratteristica da incantatore. La mano si muove insieme al bersaglio in modo da rimanere entro 1,5 metri da esso.

  **Mano stritolatrice.** La mano tenta di afferrare una creatura di taglia Enorme o inferiore situata entro 1,5 metri da essa: l'incantatore utilizza il punteggio di Forza della mano per risolvere la presa. Se il bersaglio è di taglia Media o inferiore, l'incantatore dispone di vantaggio alla prova. Mentre la mano afferra il bersaglio, l'incantatore può usare un'azione bonus per ordinarle di stritolarlo. In questo caso, il bersaglio subisce 2d6 danni contundenti + il modificatore di caratteristica da incantatore.

  **Mano interposta.** La mano si interpone tra l'incantatore e una creatura a sua scelta finché non le è impartito un comando diverso. Essa si muove tra l'incantatore e il bersaglio, fornendogli mezza copertura contro quest'ultimo. Il bersaglio non può muoversi nello spazio della mano se il suo punteggio di Forza è pari o inferiore a quello della mano. Se il punteggio di Forza del bersaglio è superiore a quello della mano, esso si può muovere verso l'incantatore attraversando il suo spazio, che tuttavia risulta per lui un terreno difficile.
higherLevel: |-
  Quando l'incantatore lancia questo incantesimo usando uno slot incantesimo di 6° livello o superiore, i danni provocati dall'opzione pugno serrato aumentano di 2d8 e quelli provocati da mano stritolatrice di 2d6 per ogni slot di livello superiore al 5°.
effects.0.name: Mano arcana
effects.0.text: |-
  Muovi la mano fino a 18 metri, poi scegli un effetto: Pugno serrato (attacco in mischia con incantesimo contro una creatura o un oggetto entro 1,5 metri dalla mano, 4d8 danni da forza se il colpo va a segno); Mano possente (prova di Forza della mano contrapposta alla prova di Forza (Atletica) del bersaglio, che viene spinto fino a 1,5 metri più un numero di metri pari a 1,5 volte il tuo modificatore di caratteristica da incantatore); Mano stritolatrice (afferra una creatura di taglia Enorme o inferiore usando la Forza della mano); Mano interposta (la mano rimane tra te e una creatura e ti fornisce mezza copertura; la creatura non può attraversare lo spazio della mano a meno che la sua Forza non sia superiore, e in quel caso quello spazio è per lei terreno difficile). Disponi di vantaggio alle prove contrapposte contro bersagli di taglia Media o inferiore.
effects.0.note: |-
  I tiri sono quelli del Pugno serrato; i suoi danni aumentano di 2d8 per ogni slot di livello superiore al 5°.
effects.1.name: "Mano arcana: stritolare"
effects.1.text: |-
  Mentre la mano afferra un bersaglio, ordinale di stritolarlo: il bersaglio subisce 2d6 danni contundenti + il tuo modificatore di caratteristica da incantatore.
effects.1.note: |-
  Più il tuo modificatore di caratteristica da incantatore (nessuna variabile disponibile in v0); aumenta di 2d6 per ogni slot di livello superiore al 5°.
effects.2.text: |-
  La mano è un oggetto Grande con CA 20, punti ferita pari ai tuoi punti ferita massimi, Forza 26 (+8) e Destrezza 10 (+0); se scende a 0 punti ferita, l'incantesimo termina.
