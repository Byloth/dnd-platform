features.0.effects.0.name: Evocare il djinni
features.0.effects.0.onUse.0.text: |-
  Un djinni (blocco di statistiche) compare entro 36 metri e obbedisce ai tuoi comandi finché mantieni la concentrazione, fino a 1 ora o finché non scende a 0 punti ferita. Non può essere evocato di nuovo per 24 ore (ripristina la carica a mano); se il djinni muore, l'anello diventa non magico.
features.0.effects.0.text: |-
  Pronuncia la parola d'ordine per evocare un djinni per un massimo di 1 ora di concentrazione. Una volta ogni 24 ore.
