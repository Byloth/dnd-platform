name: "Semipiani"
text: |-
  I semipiani sono piccoli spazi extradimensionali dotati di regole proprie, frammenti di realtà che non sembrano appartenere ad alcun luogo. I semipiani possono essere creati in modi diversi. Alcuni sono generati da incantesimi, come _semipiano_, o dal volere di una potente divinità o forza di altro tipo. Altri potrebbero essere nati in modo naturale, come pieghe della realtà esistente strappate al resto del multiverso, oppure come universi neonati destinati a crescere in potenza. È possibile accedere a uno specifico semipiano tramite un singolo punto in cui esso tocca un altro piano. In teoria, un incantesimo _spostamento planare_ è in grado di trasportare i viaggiatori su un semipiano, ma la frequenza corretta richiesta per il diapason è estremamente difficile da ottenere. L'incantesimo _portale_ è più affidabile, ammesso che l'incantatore sia a conoscenza dell'esistenza del semipiano.
