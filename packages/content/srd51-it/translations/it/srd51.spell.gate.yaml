name: Portale
components.m: Un diamante del valore di almeno 5.000 mo.
text: |-
  L'incantatore evoca un portale che collega uno spazio libero che è in grado di vedere a un luogo preciso su un piano di esistenza differente. Il portale è un'apertura circolare, del diametro variabile tra 1,5 e 6 metri a scelta dell'incantatore e può essere orientato in qualsiasi direzione, permanendo per tutta la durata dell'incantesimo. Il portale ha un lato anteriore e un lato posteriore su ogni piano dove appare e i viaggi sono possibili solo attraversandolo dalla parte anteriore. Tutto ciò che lo attraversa è trasportato immediatamente sull'altro piano, apparendo nello spazio libero più vicino al portale. Divinità e altri signori planari possono impedire che i portali creati tramite questo incantesimo si aprano in loro presenza o nei loro domini. Quando lancia questo incantesimo, l'incantatore può pronunciare il nome di una creatura specifica (pseudonimi, titoli o soprannomi non funzionano). Se la creatura nominata si trova su un piano diverso da quello in cui si trova l'incantatore, il portale si apre nelle sue immediate vicinanze attirandola attraverso di esso, fino allo spazio libero più vicino sul lato del portale in cui si trova l'incantatore. L'incantatore non ottiene alcun potere speciale sulla creatura, che è libera di agire come il GM ritiene più appropriato: potrebbe andarsene, attaccarlo o aiutarlo.
