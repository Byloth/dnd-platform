name: Immagine proiettata
components.m: Una piccola replica dell'incantatore realizzata con materiali del valore di almeno 5 mo.
text: |-
  L'incantatore crea una copia illusoria di se stesso che permane per la durata dell'incantesimo. La copia può apparire in qualsiasi luogo entro gittata che l'incantatore abbia visto in precedenza, a prescindere dalla presenza di ostacoli. L'illusione assomiglia in tutto e per tutto all'incantatore, ma è intangibile. Inoltre, se subisce danni, scompare e l'incantesimo termina. L'incantatore può usare la sua azione per muovere questa illusione fino al doppio della sua velocità e farla gesticolare, parlare e comportare nel modo che ritiene più opportuno. L'illusione imita i modi di fare dell'incantatore alla perfezione. L'incantatore può vedere e sentire attraverso l'illusione, come se si trovasse nel suo spazio. Nel suo turno come azione bonus, l'incantatore può passare dall'uso dei propri sensi a quelli dell'illusione e viceversa. Mentre utilizza i sensi del sosia, non può vedere né sentire nulla di ciò che circonda il suo vero corpo. L'illusione può essere rivelata da un'interazione fisica, perché è possibile passarle attraverso. Una creatura che usa la sua azione per esaminare l'immagine può determinare che si tratta di un'illusione superando una prova di Intelligenza (Indagare) contro la CD del tiro salvezza sull'incantesimo. Se una creatura riconosce l'illusione per ciò che è, riesce a vedere attraverso l'immagine e gli eventuali suoni che emette si attenuano alle sue orecchie.
