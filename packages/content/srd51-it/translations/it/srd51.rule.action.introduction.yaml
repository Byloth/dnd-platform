name: Azioni in combattimento
text: |-
  Quando un personaggio effettua la sua azione nel suo turno, può effettuare una delle azioni presentate di seguito, un'azione fornitagli dalla sua classe o da un privilegio speciale, oppure un'azione di sua improvvisazione. Molti mostri dispongono di opzioni personali, descritte nelle loro schede delle statistiche.

  Quando un giocatore descrive un'azione che non è definita da alcuna regola, il GM gli comunica se quell'azione è possibile e che tipo di tiro deve effettuare per determinare il superamento o il fallimento della stessa.
