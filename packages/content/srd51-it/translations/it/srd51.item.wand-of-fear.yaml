name: Bacchetta della paura
text: |-
  Bacchetta, rara (richiede sintonia)

  Questa bacchetta possiede 7 cariche per le seguenti proprietà. All'alba di ogni giorno, recupera 1d6 + 1 cariche consumate. Se il personaggio consuma l'ultima carica, deve tirare un d20: se ottiene 1, la bacchetta diventa cenere e viene distrutta.

  ***Comando.*** Mentre il personaggio impugna la bacchetta, può usare un'azione e consumare 1 carica per ordinare a un'altra creatura di fuggire o di supplicare, come se avesse lanciato l'incantesimo comando (CD del tiro salvezza 15).

  ***Cono di paura.*** Mentre il personaggio impugna la bacchetta, può usare un'azione e consumare 2 cariche e proiettare dalla punta della bacchetta un cono di 18 metri di luce ambrata. Ogni creatura entro il cono deve superare un tiro salvezza su Saggezza con CD 15, altrimenti diventa spaventata dal personaggio per 1 minuto. Una creatura spaventata deve spendere i suoi turni tentando di allontanarsi il più possibile dal personaggio e non può volontariamente muoversi in uno spazio entro 9 metri da lui. Inoltre, non può effettuare reazioni. Come azione, può usare solo l'azione di Scatto o tentare di fuggire da un effetto che le impedisce di muoversi. Se non può muoversi in alcuno spazio, la creatura può usare l'azione Schivata. Alla fine di ogni suo turno, la creatura può ripetere un tiro salvezza e, se lo supera, l'effetto per lei svanisce.
features.0.name: Comando
features.0.effects.0.note: |-
  CD del tiro salvezza 15; ordina a un'altra creatura soltanto di fuggire o di supplicare, come con l'incantesimo comando. Se consumi l'ultima carica, tira un d20: con un 1 la bacchetta diventa cenere e viene distrutta.
features.1.name: Cono di paura
features.1.effects.0.name: Cono di paura
features.1.effects.0.text: |-
  La punta della bacchetta proietta un cono di 18 metri di luce ambrata. Ogni creatura nel cono deve superare un tiro salvezza su Saggezza con CD 15, altrimenti diventa spaventata da te per 1 minuto. Finché è spaventata in questo modo, una creatura deve spendere i suoi turni tentando di allontanarsi il più possibile da te, non può volontariamente muoversi entro 9 metri da te, non può effettuare reazioni e come azione può usare solo l'azione di Scatto o tentare di fuggire da un effetto che le impedisce di muoversi (Schivata se non può muoversi in alcuno spazio). Alla fine di ogni suo turno, può ripetere il tiro salvezza e, se lo supera, l'effetto per lei svanisce.
features.1.effects.0.onUse.0.note: |-
  Solo le creature che falliscono il tiro salvezza su Saggezza con CD 15; ciascuna ripete il tiro salvezza alla fine dei suoi turni.
