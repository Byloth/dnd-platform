features.4.effects.0.text: |-
  Spezzi il bastone: è distrutto e sprigiona la magia che gli restava in un'esplosione che riempie una sfera del raggio di 9 metri centrata su di esso. Hai una probabilità del 50% di spostarti istantaneamente su un piano di esistenza casuale, evitando l'esplosione; altrimenti subisci danni da forza pari a 16 × il numero di cariche nel bastone. Ogni altra creatura nell'area effettua un tiro salvezza su Destrezza con CD 17 e subisce danni in base alla sua distanza dal punto di origine (la metà in caso di successo).
