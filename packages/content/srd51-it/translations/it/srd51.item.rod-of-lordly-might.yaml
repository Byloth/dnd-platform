name: Verga della potenza divina
text: |-
  Verga, leggendaria (richiede sintonia)

  Questa verga ha una testa flangiata e funziona come una mazza magica che conferisce un bonus di +3 ai tiri per colpire e ai tiri per i danni effettuati con essa. Possiede una serie di proprietà associate a sei pulsanti diversi disposti in fila lungo l'asta. Possiede anche le tre proprietà descritte di seguito.

  ***Sei pulsanti.*** Come azione bonus, il personaggio può premere uno dei sei pulsanti della verga. L'effetto di un pulsante dura finché il personaggio non ne preme un altro o finché non lo preme di nuovo, riportando la verga alla sua forma originaria.

  Se il personaggio preme il **pulsante 1**, la verga diventa una *lingua di fiamme* e una lama fiammeggiante spunta dall'estremità opposta alla testa flangiata.

  Se il personaggio preme il **pulsante 2**, la testa flangiata della verga si ritrae e due lame a forma di mezzaluna spuntano da quell'estremità, trasformando la verga in un'ascia da battaglia magica che conferisce un bonus di +3 ai tiri per colpire e ai tiri per i danni effettuati con essa.

  Se il personaggio preme il **pulsante 3**, la testa flangiata della verga si ritrae, una punta di lancia spunta da quell'estremità e l'impugnatura si allunga fino a diventare un'asta lunga 1,8 metri, trasformando la verga in una lancia magica che conferisce un bonus di +3 ai tiri per colpire e ai tiri per i danni effettuati con essa.

  Se il personaggio preme il **pulsante 4**, la verga si trasforma in una pertica di una lunghezza a sua scelta, fino a un massimo di 15 metri. Sulle superfici dure come il granito, la pertica viene fissata grazie a uno spuntone sul fondo e a tre uncini sulla cima. Dai lati spuntano delle sbarre lunghe 7,5 cm a intervalli di 30 cm che formano una scala a pioli. La pertica può reggere un peso massimo di 2.000 kg. Un peso superiore o la mancanza di un ancoraggio sicuro fa tornare la verga alla sua forma originaria.

  Se il personaggio preme il **pulsante 5**, la verga si trasforma in un ariete portatile e conferisce un bonus di +10 alle prove di Forza effettuate per abbattere porte, barricate e altri ostacoli.

  Se il personaggio preme il **pulsante 6**, la verga rimane nella sua forma originaria o la riassume e indica il nord magnetico. (Se questa funzione viene usata in un luogo dove non esiste un nord magnetico, non accade nulla.) La verga fornisce inoltre al personaggio un'indicazione approssimativa della profondità o dell'altitudine a cui si trova rispetto al terreno.

  ***Risucchio vitale.*** Quando il personaggio colpisce una creatura con un attacco in mischia usando la verga, può obbligare il bersaglio a effettuare un tiro salvezza su Costituzione con CD 17. In caso di fallimento, il bersaglio subisce 4d6 danni necrotici extra e il personaggio recupera un numero di punti ferita pari alla metà di quei danni. Questa proprietà non può essere riutilizzata fino all'alba successiva.

  ***Paralisi.*** Quando il personaggio colpisce una creatura con un attacco in mischia usando la verga, può obbligare il bersaglio a effettuare un tiro salvezza su Forza con CD 17. In caso di fallimento, il bersaglio rimane paralizzato per 1 minuto. Il bersaglio può ripetere il tiro salvezza alla fine di ogni suo turno e, se lo supera, l'effetto svanisce. Questa proprietà non può essere riutilizzata fino all'alba successiva.

  ***Terrificante.*** Mentre il personaggio impugna la verga, può usare un'azione per costringere tutte le creature situate entro 9 metri da lui che è in grado di vedere a effettuare un tiro salvezza su Saggezza con CD 17. In caso di fallimento, il bersaglio rimane spaventato per 1 minuto. Il bersaglio spaventato può ripetere il tiro salvezza alla fine di ogni suo turno e, se lo supera, l'effetto svanisce. Questa proprietà non può essere riutilizzata fino all'alba successiva.
