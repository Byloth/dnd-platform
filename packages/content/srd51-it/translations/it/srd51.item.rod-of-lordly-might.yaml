features.4.effects.1.text: |-
  Ogni creatura che sei in grado di vedere entro 9 metri da te deve effettuare un tiro salvezza su Saggezza con CD 17. In caso di fallimento, il bersaglio rimane spaventato da te per 1 minuto; può ripetere il tiro salvezza alla fine di ogni suo turno e, se lo supera, l'effetto su di lui svanisce.
