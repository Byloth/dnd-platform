features.1.effects.0.name: Premere un pulsante
features.1.effects.0.text: |-
  Premi uno dei sei pulsanti della verga. L'effetto dura finché non ne premi un altro o non premi di nuovo lo stesso pulsante, riportando la verga alla sua forma originaria.
features.1.effects.0.onUse.0.text: |-
  Pulsante 1: la verga diventa una *lingua di fiamme*. Pulsante 2: un'ascia da battaglia magica con un bonus di +3 ai tiri per colpire e ai tiri per i danni. Pulsante 3: una lancia magica con un bonus di +3 ai tiri per colpire e ai tiri per i danni. Pulsante 4: una pertica lunga fino a 15 metri che regge fino a 2.000 kg. Pulsante 5: un ariete portatile che conferisce un bonus di +10 alle prove di Forza effettuate per abbattere porte, barricate e altri ostacoli. Pulsante 6: forma originaria; la verga indica il nord magnetico e ti fornisce un'indicazione approssimativa della profondità o dell'altitudine a cui ti trovi rispetto al terreno.
features.1.effects.0.note: |-
  Cambiare la forma d'arma della verga (lingua di fiamme, ascia da battaglia, lancia) non ha un tipo nella v0; le righe d'attacco restano quelle della mazza +3 e le forme alternative si applicano al tavolo.
