name: Forma gassosa
components.m: Un frammento di garza e un filo di fumo.
text: |-
  L'incantatore trasforma una creatura consenziente da lui toccata, nonché tutto ciò che indossa o trasporta, in una nube fosca per la durata dell'incantesimo, che termina quando i punti ferita della creatura scendono a 0. Una creatura incorporea non subisce gli effetti dell'incantesimo. Mentre si trova in questa forma, una velocità di volare di 3 metri è l'unico metodo di movimento del bersaglio, che può entrare o occupare lo spazio di un'altra creatura. Inoltre, il bersaglio ha resistenza ai danni non magici e dispone di vantaggio ai tiri salvezza su Forza, Destrezza e Costituzione. Può passare attraverso piccoli fori, aperture strette e perfino semplici crepe, benché tratti i liquidi come fossero superfici solide. Il bersaglio non può cadere e continua a fluttuare nell'aria anche quando è stordito o incapacitato in altri modi. Mentre è sotto forma di nube, il bersaglio non può parlare o manipolare oggetti e quelli che trasporta o impugna non possono essere lasciati cadere, usati o manipolati in alcun modo. Il bersaglio non può attaccare o lanciare incantesimi.
effects.0.note: L'unico metodo di movimento mentre ti trovi in questa forma.
effects.1.note: Solo danni non magici.
effects.5.text: "Nube fosca: puoi entrare o occupare lo spazio di un'altra creatura e passare attraverso piccoli fori, aperture strette e perfino semplici crepe (i liquidi contano come superfici solide); non puoi cadere e continui a fluttuare nell'aria anche quando sei stordito o incapacitato in altri modi; non puoi parlare, manipolare o usare oggetti, attaccare o lanciare incantesimi. L'incantesimo termina se i tuoi punti ferita scendono a 0."
