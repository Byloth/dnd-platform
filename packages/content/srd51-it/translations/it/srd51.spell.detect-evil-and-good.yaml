name: Individuazione del bene e del male
text: |-
  Per tutta la durata dell'incantesimo, l'incantatore è a conoscenza della presenza e dell'esatta posizione di un'aberrazione, un celestiale, un elementale, un folletto, un immondo o un non morto entro 9 metri da lui. Allo stesso modo, sa se entro 9 metri da lui c'è un luogo o un oggetto consacrato o dissacrato magicamente. L'incantesimo può penetrare la maggior parte delle barriere, ma viene bloccato da 30 cm di pietra, 2,5 cm di metallo comune, una sottile lamina di piombo o 90 cm di legno o terriccio.
