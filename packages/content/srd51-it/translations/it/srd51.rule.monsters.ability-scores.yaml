name: "Punteggi di caratteristica"
text: |-
  Ogni mostro possiede sei punteggi di caratteristica (Forza, Destrezza, Costituzione, Intelligenza, Saggezza e Carisma) e i relativi modificatori. Per ulteriori informazioni sui punteggi di caratteristica e sul loro impiego durante il gioco, consulta il *Manuale del Giocatore*.
