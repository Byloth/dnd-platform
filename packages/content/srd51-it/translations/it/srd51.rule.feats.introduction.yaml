name: "Talenti"
text: |-
  Un talento rappresenta una dote o un'area di esperienza che conferisce a un personaggio alcune capacità speciali. Incarna un genere di addestramento, esperienza e capacità che va oltre ciò che una classe fornisce.

  Certi livelli di classe forniscono al personaggio il privilegio Aumento dei Punteggi di Caratteristica. Usando la regola facoltativa dei talenti, il personaggio può rinunciare a quel privilegio e acquisire invece un talento a sua scelta. Può prendere ogni talento soltanto una volta, a meno che la descrizione di quel talento non specifichi diversamente.

  Un personaggio deve soddisfare gli eventuali prerequisiti specificati in un talento al fine di acquisire quel talento. Se perde il prerequisito di un talento, non può più usare quel talento finché non recupera il relativo prerequisito. Per esempio, il talento Lottatore richiede al personaggio una Forza pari o superiore a 13. Se la sua Forza scende sotto 13 per qualche motivo (per esempio a causa di una potente maledizione), il personaggio non potrà beneficiare del talento Lottatore finché la sua Forza non verrà ripristinata.
