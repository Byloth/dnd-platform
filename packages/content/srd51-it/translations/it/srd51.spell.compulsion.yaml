name: Compulsione
text: |-
  Le creature scelte dall'incantatore situate entro gittata, che sono in grado di sentirlo e che egli è in grado di vedere, devono effettuare un tiro salvezza su Saggezza. Un bersaglio supera automaticamente questo tiro salvezza se non può essere affascinato. Se fallisce, è influenzato dall'incantesimo. Finché l'incantesimo non termina, l'incantatore può usare un'azione bonus in ogni suo turno per scegliere una direzione orizzontale rispetto a lui. Ogni bersaglio influenzato deve usare la maggior parte possibile del suo movimento per muoversi in quella direzione nel suo turno successivo, potendo effettuare prima la sua azione. Dopo essersi mosso in quella direzione, il bersaglio può effettuare un altro tiro salvezza su Saggezza per provare a terminare l'effetto. Un bersaglio non è obbligato a muoversi verso un pericolo mortale, come un incendio o una fossa, ma provocherà attacchi di opportunità nel muoversi verso la direzione designata.
