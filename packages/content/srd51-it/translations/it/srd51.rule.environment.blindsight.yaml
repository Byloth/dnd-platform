name: "Vista cieca"
text: |-
  Una creatura dotata di vista cieca può percepire l'ambiente circostante entro un raggio specifico senza affidarsi alla vista. Le creature prive di occhi, come le melme, e le creature dotate del senso Radar o di sensi amplificati, come i pipistrelli e i draghi puri, possiedono questa caratteristica.
