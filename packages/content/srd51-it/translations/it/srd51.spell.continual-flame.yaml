name: Fiamma perenne
components.m: Polvere di rubino del valore di 50 mo, che l'incantesimo consuma.
text: |-
  Una fiamma di intensità equivalente a quella di una torcia si sprigiona da un oggetto toccato dall'incantatore. L'effetto è quello di una fiamma comune, ma non crea calore e non utilizza ossigeno. Una fiamma perenne può essere coperta o nascosta, ma non soffocata o estinta.
