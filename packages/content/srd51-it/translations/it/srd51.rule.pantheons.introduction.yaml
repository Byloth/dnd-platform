name: "Pantheon fantasy-storici"
text: "I pantheon celtici, egizi, greci e norreni sono interpretazioni fantastiche delle religioni storiche dei nostri tempi antichi. Includono le divinità più adatte a essere utilizzate nel gioco, svuotate del loro contesto storico nel mondo reale e aggiunte ai pantheon più appropriati alle esigenze di gioco."
