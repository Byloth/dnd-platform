name: "Polvere prosciugante"
text: |-
  Oggetto meraviglioso, non comune

  Questo pacchetto contiene 1d6 + 4 pizzichi di polvere. Con un'azione, il personaggio può spargere un pizzico di polvere sull'acqua. La polvere trasforma un cubo d'acqua con spigolo di 4,5 metri in una sfera delle dimensioni di una biglia, che fluttua o resta vicino al luogo in cui è caduta la polvere. Il peso della biglia è trascurabile.

  Chiunque può usare un'azione per schiantare la biglia contro una superficie rigida, rompendola e liberando l'acqua che era stata assorbita. Quando questo accade, la magia della biglia termina.

  Un elementale composto per la maggior parte d'acqua che si trovi esposto a un pizzico di questa polvere deve effettuare un tiro salvezza su Costituzione con CD 13; in caso di fallimento, subisce 10d6 danni necrotici, o la metà dei danni in caso di successo.
