features.0.effects.0.text: "La polvere trasforma un cubo d'acqua con spigolo di 4,5 metri in una sfera delle dimensioni di una biglia, dal peso trascurabile. Chiunque può usare un'azione per schiantare la biglia contro una superficie rigida, liberando l'acqua e ponendo fine alla magia della biglia. Un elementale composto per la maggior parte d'acqua che si trovi esposto a un pizzico deve effettuare un tiro salvezza su Costituzione con CD 13; in caso di fallimento, subisce 10d6 danni necrotici, o la metà in caso di successo."
