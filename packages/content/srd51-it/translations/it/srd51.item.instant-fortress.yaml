name: Fortezza istantanea
text: |-
  Oggetto meraviglioso, raro

  Il personaggio può usare un'azione per posare a terra questo cubo metallico con spigolo di 2,5 cm e pronunciarne la parola d'ordine. Il cubo cresce rapidamente fino a trasformarsi in una fortezza che permane fino a quando il personaggio, usando un'azione, non pronuncia la parola d'ordine che la disattiva. La fortezza si disattiva solo se è vuota.

  La fortezza è una torre con base quadrata di 6 metri di lato, alta 9 metri e fornita di feritoie su tutti i lati e parapetti sulla sommità. All'interno è divisa in due piani, collegati da una scala a pioli che corre lungo una delle pareti. La scala termina in corrispondenza di una botola che conduce al tetto. Quando viene attivata, la torre rivela una piccola porta d'ingresso che si apre sul lato posizionato di fronte al personaggio. La porta si apre solo su ordine del personaggio, che può pronunciare tale ordine come azione bonus. La porta è immune all'incantesimo scassinare e altre magie simili, come quelle di una campana dell'apertura.

  Ogni creatura situata nell'area in cui la fortezza compare deve effettuare un tiro salvezza su Destrezza con CD 15: subisce 10d10 danni contundenti in caso di fallimento, o la metà dei danni in caso di successo. In entrambi i casi, la creatura viene spinta in uno spazio libero esterno accanto alla fortezza. Gli oggetti presenti nell'area che non sono indossati o trasportati subiscono questi danni e vengono spinti via automaticamente.

  La torre è fatta di adamantio e la sua magia le impedisce di venire rovesciata. Il tetto, la porta e le pareti hanno 100 punti ferita ciascuno, immunità ai danni inflitti da armi non magiche, con l'eccezione delle armi d'assedio, e resistenza a tutti gli altri danni. La fortezza può essere riparata solo tramite un incantesimo desiderio (quest'uso dell'incantesimo conta come riproduzione di un incantesimo di 8° livello o inferiore). Ogni lancio dell'incantesimo desiderio fa recuperare 50 punti ferita al tetto, alla porta o a una delle pareti.
