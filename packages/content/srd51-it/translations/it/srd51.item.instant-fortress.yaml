features.0.effects.0.name: Innalzare la fortezza
features.0.effects.0.onUse.0.text: Sul posto cresce una torre di adamantio con base quadrata di 6 metri di lato, alta 9 metri. Le creature nella sua area vengono spinte in uno spazio libero accanto a essa. La porta si apre solo su tuo ordine (un'azione bonus). Il tetto, la porta e le pareti hanno 100 punti ferita ciascuno. La disattivi con un'azione mentre è vuota.
features.0.effects.0.text: Posi il cubo e pronunci la parola d'ordine per far crescere una fortezza. Le creature nell'area effettuano un tiro salvezza su Destrezza con CD 15 contro 10d10 danni contundenti e vengono spinte all'esterno.
features.0.effects.1.name: Disattivare la fortezza
features.0.effects.1.text: Pronunci la parola d'ordine che disattiva la fortezza. La fortezza si disattiva solo se è vuota.
