name: Folata di vento
components.m: Un seme di legume.
text: |-
  Una linea di vento forte lunga 18 metri e ampia 3 metri viene indirizzata dall'incantatore in una direzione a sua scelta per la durata dell'incantesimo. Ogni creatura che inizia il suo turno nella linea deve superare un tiro salvezza su Forza o viene spinta per 4,5 metri lontano dall'incantatore nella direzione della linea. Qualsiasi creatura nella linea deve usare 60 cm di movimento per ogni 30 cm percorsi per avvicinarsi all'incantatore. La folata può disperdere gas o vapore e spegne candele, torce e simili fiamme non protette nell'area. Le fiamme protette, come quelle delle lanterne, tremolano e hanno il 50% di possibilità di spegnersi. Come azione bonus in ogni suo turno prima del termine dell'incantesimo, l'incantatore può cambiare la direzione della linea da lui originata.
effects.0.name: "Folata di vento: cambiare direzione"
effects.0.text: Cambia la direzione della linea di vento che hai originato.
effects.1.text: |-
  Ogni creatura che inizia il suo turno nella linea deve superare un tiro salvezza su Forza o viene spinta per 4,5 metri lontano da te lungo la linea; avvicinarsi a te all'interno della linea costa 60 cm di movimento per ogni 30 cm percorsi. La folata disperde gas o vapore e spegne le fiamme non protette (le fiamme protette hanno il 50% di possibilità di spegnersi).
