name: "Autosufficienza"
text: |-
  > Le spese e gli stili di vita descritti in questo capitolo presumono che un personaggio trascorra il suo tempo tra un'avventura e l'altra in città, avvalendosi dei servizi che può permettersi (pagandosi vitto e alloggio, pagando artigiani che affilino la sua spada e riparino la sua armatura, e così via). Alcuni personaggi, tuttavia, scelgono di trascorrere il loro tempo lontani dal mondo civilizzato: si sostentano nelle terre selvagge con le loro forze, andando a caccia, raccogliendo frutti e riparando da soli il proprio equipaggiamento.
  >
  > Chi adotta questo stile di vita non spende denaro, ma deve dedicare molto tempo a queste attività. Chi trascorre il proprio tempo tra un'avventura e l'altra esercitando una professione può guadagnarsi l'equivalente di uno stile di vita povero. La competenza nell'abilità Sopravvivenza consente a un personaggio di vivere con l'equivalente di uno stile di vita agiato.
