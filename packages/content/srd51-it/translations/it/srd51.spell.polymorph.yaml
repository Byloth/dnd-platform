name: Metamorfosi
components.m: Il bozzolo di un bruco.
text: Questo incantesimo conferisce una nuova forma a una creatura entro gittata che l'incantatore è in grado di vedere. Per evitarne l'effetto, una creatura non consenziente deve effettuare un tiro salvezza su Saggezza. Un mutaforma supera automaticamente questo tiro salvezza. La trasformazione permane per la durata dell'incantesimo o finché il bersaglio non scende a 0 punti ferita o muore. La nuova forma può essere quella di qualsiasi bestia il cui grado di sfida sia pari o inferiore a quello del bersaglio (o al livello del bersaglio, se esso non possiede un grado di sfida). Le statistiche di gioco del bersaglio, inclusi i punteggi di caratteristica mentali, vengono sostituite dalle statistiche della bestia scelta, ma mantiene il suo allineamento e la sua personalità. Il bersaglio assume i punti ferita della nuova forma e, quando riassume la sua forma normale, ritorna al numero di punti ferita che aveva prima della trasformazione. Se torna alla sua forma normale per essere sceso a 0 punti ferita, gli eventuali danni in eccesso si trasmettono alla sua forma normale. Fintantoché i danni in eccesso non riducono la forma normale della creatura a 0 punti ferita, questa non cade priva di sensi. La creatura è limitata alle azioni che può effettuare in base alla natura della sua nuova forma e non può parlare, lanciare incantesimi o effettuare qualsiasi altra azione che richieda l'uso delle mani o della parola. L'attrezzatura del bersaglio si fonde nella sua nuova forma e la creatura non può attivare, usare, impugnare o beneficiare del proprio equipaggiamento.
effects.0.text: Le statistiche di gioco (inclusi i punteggi di caratteristica mentali) vengono sostituite da quelle di una bestia con un grado di sfida non superiore a quello del bersaglio (o al suo livello); il bersaglio mantiene il suo allineamento e la sua personalità. Il bersaglio ha i punti ferita della bestia, non può parlare, lanciare incantesimi o effettuare azioni che richiedano l'uso delle mani o della parola, e la sua attrezzatura si fonde nella nuova forma e non può essere usata.
effects.0.note: "La sostituzione delle statistiche non è esprimibile nella v0: le statistiche della bestia vanno tenute a mano."
onCast.0.text: Una creatura non consenziente effettua un tiro salvezza su Saggezza per evitare l'effetto; un mutaforma lo supera automaticamente. La trasformazione termina a 0 punti ferita, quando la creatura torna ai punti ferita che aveva prima; i danni in eccesso si trasmettono alla sua forma normale.
