name: "Mezzorco"
text: |-
  Un mezzorco possiede alcuni tratti che derivano dal suo retaggio orchesco.
features.0.name: "Incremento dei punteggi di caratteristica"
features.0.text: |-
  Il punteggio di Forza di un mezzorco aumenta di 2 e quello di Costituzione di 1.
features.1.name: "Velocità"
features.1.text: |-
  La velocità base sul terreno di un mezzorco è di 9 metri.
features.2.name: "Scurovisione"
features.2.text: |-
  Grazie al suo sangue orchesco, un mezzorco beneficia di una vista superiore nell'oscurità e nelle condizioni di luce fioca. In condizioni di luce fioca, può vedere fino a una distanza di 18 metri come se si trovasse in condizioni di luce intensa e nell'oscurità come se si trovasse in presenza di luce fioca. Nell'oscurità non è in grado di discernere i colori, ma solo le tonalità di grigio.
features.3.name: "Età"
features.3.text: |-
  I mezzorchi maturano un po' più velocemente degli umani, raggiungendo l'età adulta attorno ai 14 anni. Invecchiano più velocemente e raramente vivono più a lungo di 75 anni.
features.4.name: "Allineamento"
features.4.text: |-
  I mezzorchi tendono per natura al caos, un retaggio della loro metà orchesca, e difficilmente tendono al bene. I mezzorchi cresciuti fra gli orchi e disposti a vivere in mezzo a loro sono solitamente malvagi.
features.5.name: "Taglia"
features.5.text: |-
  I mezzorchi sono leggermente più grandi e robusti degli umani: la loro altezza varia da 1,5 metri a ben oltre 1,8 metri. Un mezzorco è una creatura di taglia Media.
features.6.name: "Linguaggi"
features.6.text: |-
  Un mezzorco può parlare, leggere e scrivere in Comune e in Orchesco. L'Orchesco è una lingua dura e sgradevole, dalle consonanti aspre. Non possiede un suo alfabeto, quindi per la forma scritta utilizza l'alfabeto nanico.
features.7.name: "Minaccioso"
features.7.text: |-
  Un mezzorco ha competenza nell'abilità Intimidire.
features.8.name: "Resistenza implacabile"
features.8.text: |-
  Quando un mezzorco scende a 0 punti ferita ma non viene ucciso sul colpo, può decidere di rimanere a 1 punto ferita. Non può più utilizzare questa capacità finché non completa un riposo lungo.
features.8.effects.0.name: "Resistenza implacabile"
features.8.effects.1.name: "Resistenza implacabile"
features.8.effects.1.trigger: "quando scendi a 0 punti ferita ma non vieni ucciso sul colpo"
features.8.effects.1.text: |-
  Quando scendi a 0 punti ferita ma non vieni ucciso sul colpo, puoi decidere di rimanere a 1 punto ferita. Non puoi più utilizzare questa capacità finché non completi un riposo lungo.
features.8.effects.1.onUse.0.text: |-
  Rimani a 1 punto ferita anziché scendere a 0.
features.9.name: "Attacchi selvaggi"
features.9.text: |-
  Quando un mezzorco mette a segno un colpo critico con un attacco con arma da mischia, può tirare un dado dell'arma aggiuntivo quando determina i danni extra del colpo critico.
features.9.effects.0.text: |-
  Quando metti a segno un colpo critico con un attacco con arma da mischia, tira un dado dei danni dell'arma aggiuntivo e aggiungilo ai danni extra del colpo critico.
features.9.effects.0.note: |-
  Regola del colpo critico della modalità di gioco (stessa forma di Critico Brutale); nella v0 nessun valore derivato la rappresenta.
