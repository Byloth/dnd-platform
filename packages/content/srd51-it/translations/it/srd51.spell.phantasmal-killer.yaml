name: Allucinazione mortale
text: L'incantatore attinge agli incubi di una creatura entro gittata che è in grado di vedere e crea una manifestazione illusoria delle sue paure più profonde, visibile solo a lei. Il bersaglio deve effettuare un tiro salvezza su Saggezza. Se lo fallisce, diventa spaventato per tutta la durata dell'incantesimo. All'inizio di ogni suo turno prima che l'incantesimo finisca, il bersaglio deve superare un tiro salvezza su Saggezza, altrimenti subisce 4d10 danni psichici. In caso di successo, l'incantesimo termina.
higherLevel: Quando l'incantatore lancia questo incantesimo usando uno slot incantesimo di 5° livello o superiore, i danni aumentano di 1d10 per ogni slot di livello superiore al 4°.
onCast.1.text: Se il bersaglio fallisce il tiro salvezza su Saggezza. All'inizio di ogni suo turno il bersaglio deve superare un tiro salvezza su Saggezza, altrimenti subisce 4d10 danni psichici (+1d10 per ogni slot di livello superiore al 4°); in caso di successo, l'incantesimo termina.
