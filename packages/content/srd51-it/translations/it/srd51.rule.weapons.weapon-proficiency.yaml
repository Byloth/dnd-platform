name: Competenza nelle armi
text: |-
  Le razze, le classi e i talenti conferiscono ai personaggi competenza in certe armi o categorie di armi. Le due categorie sono le armi **semplici** e **da guerra**. La maggior parte della gente è in grado di usare con competenza le armi semplici, che includono mazze, randelli e altre armi che i popolani maneggiano spesso. Le armi da guerra, come le spade, le asce e le armi su asta, richiedono un addestramento più specifico per essere usate con efficacia. La maggior parte dei combattenti utilizza le armi da guerra per sfruttare al meglio il proprio stile di combattimento e addestramento.

  La competenza in un'arma consente a un personaggio di aggiungere il proprio bonus di competenza al tiro per colpire di ogni attacco che effettua con quell'arma. Se un personaggio effettua un tiro per colpire usando un'arma in cui non possiede competenza, non aggiunge il suo bonus di competenza al tiro.
