name: Muro di ghiaccio
components.m: Un frammento di quarzo.
text: |-
  L'incantatore crea un muro di ghiaccio su una superficie solida entro gittata, modellandolo in una cupola semisferica o in una sfera con raggio massimo di 3 metri, oppure in una superficie piatta composta da dieci pannelli con lato di 3 metri. Ogni pannello dev'essere contiguo a un altro pannello. In qualsiasi forma, il muro ha uno spessore di 30 cm e permane per la durata dell'incantesimo. Se il muro passa attraverso lo spazio di una creatura quando appare, questa viene spinta da un lato del muro e deve effettuare un tiro salvezza su Destrezza. Se lo fallisce, subisce 10d6 danni da freddo, o la metà dei danni in caso di successo. Il muro è un oggetto che può essere danneggiato e quindi sfondato, possiede CA 12 e 30 punti ferita per ogni sezione di 3 metri ed è vulnerabile ai danni da fuoco. Una sezione di 3 metri viene distrutta se scende a 0 punti ferita e, nello spazio che occupava in precedenza, rimane una cortina d'aria gelida. Una creatura che attraversa questa cortina per la prima volta in un turno deve effettuare un tiro salvezza su Costituzione e subisce 5d6 danni da freddo in caso di fallimento, o la metà dei danni in caso di successo.
higherLevel: |-
  Quando l'incantatore lancia questo incantesimo usando uno slot incantesimo di 7° livello o superiore, i danni inflitti dal muro quando compare aumentano di 2d6 e quelli subiti da chi passa attraverso la cortina d'aria gelida aumentano di 1d6 per ogni slot di livello superiore al 6°.
