name: Legame planare
components.m: Una gemma del valore di almeno 1.000 mo, che l'incantesimo consuma.
text: Con questo incantesimo, l'incantatore tenta di vincolare un celestiale, un elementale, un folletto o un immondo al suo servizio. La creatura deve trovarsi entro gittata per l'intera durata del lancio dell'incantesimo (solitamente essa viene prima evocata al centro di un cerchio magico invertito per tenerla intrappolata mentre l'incantesimo viene lanciato). Una volta completato il lancio, il bersaglio deve effettuare un tiro salvezza su Carisma. Se lo fallisce, è obbligato a servire l'incantatore per tutta la durata dell'incantesimo. Se la creatura è stata evocata o creata da un altro incantesimo, la durata di quell'incantesimo viene estesa per corrispondere alla durata di questo. Una creatura vincolata deve eseguire le istruzioni al meglio delle sue capacità. L'incantatore potrebbe ordinarle di accompagnarlo in un'avventura, di proteggere un luogo o consegnare un messaggio. La creatura obbedisce alla lettera alle sue istruzioni, ma se è ostile nei confronti dell'incantatore lotterà per interpretare a modo suo le parole di quest'ultimo perseguendo i suoi obiettivi personali. Se la creatura porta a termine le istruzioni dell'incantatore prima del termine dell'incantesimo, si reca da lui per riferirglielo, ma solo se si trovano sullo stesso piano di esistenza. Se l'incantatore si trova su un piano di esistenza diverso, la creatura ritorna nel luogo in cui è stata vincolata e vi rimane fino al termine dell'incantesimo.
higherLevel: Quando l'incantatore lancia questo incantesimo usando uno slot incantesimo di un livello superiore, la durata aumenta a 10 giorni con uno slot di 6° livello, a 30 giorni con uno slot di 7° livello, a 180 giorni con uno slot di 8° livello e a un anno e un giorno con uno slot di 9° livello.
