name: Spada danzante
text: |-
  Arma (qualsiasi spada), molto rara (richiede sintonia)

  Il personaggio può usare un'azione bonus per lanciare in aria questa spada magica e pronunciare la sua parola d'ordine. Quando lo fa, la spada inizia a fluttuare, vola fino a una distanza di 9 metri e attacca una creatura a scelta del personaggio situata entro 1,5 metri da sé. La spada usa il tiro per colpire e il modificatore al punteggio di caratteristica del personaggio per i tiri per i danni.

  Finché la spada fluttua, il personaggio può usare un'azione bonus per farla volare in un altro punto entro 9 metri da lui. Come parte della stessa azione bonus, il personaggio può far sì che la spada attacchi una creatura entro 1,5 metri da essa.

  Dopo avere effettuato il quarto attacco, la spada fluttuante si muove in volo fino a 9 metri e cerca di tornare in mano al personaggio. Se quest'ultimo non ha mani libere, la spada cade a terra ai suoi piedi. Se non esiste un percorso sgombro fino al personaggio, la spada si avvicina a lui quanto più possibile e poi cade a terra. Smette di fluttuare anche se il personaggio la prende in mano o se si allontana più di 9 metri da essa.
features.0.name: Danzante
features.0.effects.0.name: Lanciare la spada in aria
features.0.effects.0.text: "Pronuncia la parola d'ordine: la spada inizia a fluttuare, vola fino a una distanza di 9 metri e attacca una creatura a tua scelta situata entro 1,5 metri da essa, usando il tuo tiro per colpire e il tuo modificatore di caratteristica per i tiri per i danni. Dopo avere effettuato il quarto attacco, la spada fluttuante si muove in volo fino a 9 metri e cerca di tornare nella tua mano; smette di fluttuare anche se la prendi in mano o se ti allontani più di 9 metri da essa."
features.0.effects.0.onUse.0.text: La spada attacca con il tuo bonus di attacco e aggiunge il tuo modificatore di caratteristica ai danni; tieni il conto dei suoi quattro attacchi.
features.0.effects.1.name: Dirigere la spada fluttuante
features.0.effects.1.text: La spada vola fino a 9 metri in un altro punto entro 9 metri da te e, come parte della stessa azione bonus, attacca una creatura entro 1,5 metri da essa.
