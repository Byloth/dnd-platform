name: Trappole
text: |-
  Le trappole possono celarsi ovunque. Un passo falso in un'antica tomba potrebbe innescare una serie di lame oscillanti in grado di tagliare ossa e armature. Rampicanti apparentemente innocui che pendono dall'ingresso di una caverna potrebbero afferrare e strangolare chiunque tenti di oltrepassarli. Una rete nascosta tra gli alberi potrebbe cadere sui viaggiatori che vi passano sotto. In un gioco fantastico, gli avventurieri più imprudenti potrebbero precipitare verso la morte, essere bruciati vivi o soccombere sotto una raffica di dardi avvelenati.

  Una trappola può essere di natura meccanica o magica. Le trappole meccaniche includono fosse, trappole con frecce, caduta di massi, ambienti allagati artificialmente, lame rotanti e tutto ciò che dipende da un meccanismo per funzionare. Le trappole magiche possono fare uso di congegni magici o di incantesimi. Le trappole azionate da congegni magici scatenano effetti magici quando attivate. In alternativa, alcuni incantesimi come _glifo di interdizione_ e _simbolo_ possono funzionare come trappole.
