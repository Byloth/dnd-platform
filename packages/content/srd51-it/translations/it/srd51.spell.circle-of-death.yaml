name: Cerchio di morte
components.m: Polvere ricavata da una perla nera, del valore di almeno 500 mo.
text: |-
  Una sfera d'energia negativa si espande in un raggio di 18 metri da un punto entro gittata. Ogni creatura nell'area deve effettuare un tiro salvezza su Costituzione e subisce 8d6 danni necrotici in caso di fallimento, o la metà dei danni in caso di successo.
higherLevel: |-
  Quando l'incantatore lancia questo incantesimo usando uno slot incantesimo di 7° livello o superiore, i danni aumentano di 2d6 per ogni slot di livello superiore al 6°.
