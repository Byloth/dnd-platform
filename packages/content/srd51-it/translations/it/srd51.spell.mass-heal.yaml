name: Guarigione di massa
text: Un'ondata di energia curativa si sprigiona dall'incantatore, investendo le creature ferite intorno a lui. In questo modo, ripristina fino a 700 punti ferita, ripartendoli come desidera tra un qualsiasi numero di creature entro gittata e che è in grado di vedere. Le creature guarite da questo incantesimo vengono inoltre curate da ogni malattia e qualsiasi effetto che le accechi o assordi. Questo incantesimo non ha effetto sui non morti o sui costrutti.
onCast.0.note: Fino a 700 punti ferita in totale, ripartiti a scelta dell'incantatore tra un qualsiasi numero di creature entro gittata che è in grado di vedere. Le creature guarite vengono inoltre curate da ogni malattia e da qualsiasi effetto che le accechi o assordi. Nessun effetto sui non morti o sui costrutti.
