name: "Ispirazione"
text: "L'ispirazione è una regola che il Game Master può usare per ricompensare un personaggio che agisce in modo fedele ai suoi tratti caratteriali, ideali, legami e difetti. Usando l'ispirazione, un personaggio può attingere al tratto caratteriale di compassione nei confronti degli oppressi per partire avvantaggiato nei negoziati con il Principe dei Mendicanti. In alternativa, l'ispirazione può consentire a un personaggio di appellarsi al suo legame quando deve difendere il suo villaggio natio per scrollarsi di dosso gli effetti di un incantesimo lanciato su di lui."
