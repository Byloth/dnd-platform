name: Fermare il tempo
text: |-
  L'incantatore interrompe brevemente lo scorrere del tempo per tutti tranne che per se stesso. Per le altre creature il tempo non passa, mentre l'incantatore effettua 1d4 + 1 turni consecutivamente, nel corso dei quali può usare azioni e muoversi normalmente. Questo incantesimo termina se una delle azioni usate o qualsiasi effetto creato dall'incantatore durante questo periodo influenza una creatura diversa da lui o un oggetto indossato o trasportato da qualcuno diverso da lui. Termina inoltre se l'incantatore si muove in un luogo a più di 300 metri dal punto in cui ha lanciato l'incantesimo.
