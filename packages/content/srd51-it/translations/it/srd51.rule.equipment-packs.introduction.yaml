name: "Dotazioni"
text: "L'equipaggiamento di partenza che un personaggio riceve dalla sua classe include anche un insieme di oggetti da avventuriero riuniti in una dotazione. Il contenuto di ogni dotazione è elencato di seguito. Se il personaggio sceglie di acquistare il suo equipaggiamento di partenza, può comprare una dotazione al prezzo indicato, che generalmente è più conveniente rispetto all'acquisto dei singoli oggetti separati."
