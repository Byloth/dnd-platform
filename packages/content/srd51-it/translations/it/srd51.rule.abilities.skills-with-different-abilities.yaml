name: "Variante: abilità con caratteristiche diverse"
text: |-
  In genere la competenza di un personaggio in un'abilità si applica soltanto a un tipo specifico di prova di caratteristica. Per esempio, la competenza in Atletica solitamente si applica alle prove di Forza. Tuttavia, in certe situazioni una competenza potrebbe ragionevolmente applicarsi a un tipo diverso di prova. In questi casi il GM potrebbe richiedere una prova che utilizzi una combinazione insolita di caratteristica e abilità; oppure potrebbe essere il giocatore a chiedere al GM di applicare una competenza a una prova diversa. Per esempio, se un personaggio deve raggiungere la riva a nuoto partendo da un'isola al largo, il GM potrebbe richiedergli una prova di Costituzione per determinare se la sua resistenza fisica gli consente di nuotare tanto a lungo. In quel caso il GM potrebbe concedergli di applicare la propria competenza in Atletica e chiedergli di effettuare una prova di Costituzione (Atletica). Quindi, se il personaggio è competente in Atletica, applica il suo bonus di competenza alla prova di Costituzione proprio come farebbe per una normale prova di Forza (Atletica). Analogamente, quando un mezzorco barbaro si esibisce in uno sfoggio di forza per intimidire un nemico, il GM potrebbe richiedere una prova di Forza (Intimidire) anche se Intimidire normalmente è associato a Carisma.
