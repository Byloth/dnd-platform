name: "Piani Interni"
text: |-
  I Piani Interni circondano e avvolgono il Piano Materiale e i suoi echi, fornendo le materie prime elementali da cui sono stati creati tutti i mondi. I quattro **Piani Elementali**, acqua, aria, fuoco e terra, compongono un anello intorno al Piano Materiale, sospeso nel turbolento **Caos Elementale**.

  Ai loro confini esterni, nel punto in cui sono più vicini al Piano Materiale (in senso concettuale e non letteralmente geografico), i quattro Piani Elementali assomigliano a un mondo del Piano Materiale. I quattro elementi si combinano insieme proprio come sul Piano Materiale, formando cielo, mare e terra. Tuttavia, più ci si allontana dal Piano Materiale, più i Piani Elementali diventano alieni e ostili, luoghi in cui gli elementi esistono nella loro forma più pura: vaste distese di terra solida, fiamme ardenti, acque cristalline e aria incontaminata. Queste regioni sono meno conosciute, quindi quando si parla del Piano del Fuoco, per esempio, è probabile che un interlocutore si riferisca alla regione di confine. Alle estremità più remote dei Piani Interni, gli elementi allo stato puro si dissolvono e si uniscono in un tumulto eterno di energie in conflitto e sostanze in collisione: il Caos Elementale.
