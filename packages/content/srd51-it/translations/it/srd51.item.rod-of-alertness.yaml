  Pianta l'asta della verga nel terreno: la sua estremità superiore proietta luce intensa in un raggio di 18 metri e luce fioca per altri 18 metri. Finché tu e ogni creatura amichevole nei tuoi confronti vi trovate entro quella luce intensa, ottenete un bonus di +1 alla CA e ai tiri salvezza e potete percepire la presenza di eventuali creature ostili invisibili che si trovano a loro volta entro la luce intensa. L'effetto termina dopo 10 minuti o quando una creatura usa un'azione per estrarre la verga dal terreno.
