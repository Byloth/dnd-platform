name: Verga dell'allerta
text: |-
  Verga, molto rara (richiede sintonia)

  Questa verga ha una testa flangiata e possiede le seguenti proprietà:

  ***Allerta.*** Mentre il personaggio impugna la verga, dispone di vantaggio alle prove di Saggezza (Percezione) e ai tiri per l'iniziativa.

  ***Incantesimi.*** Mentre il personaggio impugna la verga, può usare un'azione per lanciare con essa uno degli incantesimi seguenti: *individuazione del bene e del male*, *individuazione del magico*, *individuazione delle malattie e dei veleni* o *vedere invisibilità*.

  ***Aura protettiva.*** Con un'azione, il personaggio può piantare l'asta della verga nel terreno; quando lo fa, l'estremità superiore della verga proietta luce intensa in un raggio di 18 metri e luce fioca per altri 18 metri. Finché il personaggio e ogni creatura amichevole nei suoi confronti si trovano entro il raggio di quella luce intensa, ottengono un bonus di +1 alla CA e ai tiri salvezza, e possono percepire la presenza di eventuali creature ostili invisibili che si trovano a loro volta entro la luce intensa.

  La punta della verga smette di brillare e l'effetto termina dopo 10 minuti o quando una creatura usa un'azione per estrarre la verga dal terreno. Questa proprietà non può essere riutilizzata fino all'alba successiva.
features.0.name: Allerta
features.1.name: Incantesimi
features.1.effects.0.note: Si lanciano con la verga con un'azione mentre la impugni; il testo non indica un limite di utilizzi.
