name: "Arnesi da falsario"
text: |-
  Questa piccola scatola contiene vari tipi di fogli di carta e di pergamena, pennini, inchiostri, sigilli e cera per sigilli, filigrana d'oro e d'argento e altri materiali necessari per creare dei documenti falsi che risultino convincenti.

  La competenza in questi arnesi consente a un personaggio di aggiungere il proprio bonus di competenza a ogni prova di caratteristica effettuata per creare una falsificazione fisica di un documento.
