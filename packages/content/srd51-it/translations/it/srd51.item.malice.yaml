name: Malizia
text: |-
  Una creatura vittima di questo veleno deve superare un tiro salvezza su Costituzione con CD 15, altrimenti viene avvelenata per 1 ora, rimanendo anche accecata per quel periodo.

  **_Inalazione._** Questi veleni possono essere in polvere o gas e hanno effetto quando vengono inalati. Soffiare nell'aria la polvere o rilasciare il gas infligge gli effetti del veleno alle creature entro un cubo di 1,5 metri. La nube causata si dissipa subito dopo. Trattenere il respiro non funziona contro i veleni inalati, in quanto colpiscono le membrane nasali, i condotti lacrimali e altre parti del corpo.
