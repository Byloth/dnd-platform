name: Sguardo penetrante
text: |-
  Per tutta la durata dell'incantesimo, gli occhi dell'incantatore diventano neri, vacui e pervasi da un potere sinistro. Una creatura a scelta dell'incantatore entro 18 metri da lui e che è in grado di vedere deve superare un tiro salvezza su Saggezza o essere influenzata da uno dei seguenti effetti a sua scelta per la durata dell'incantesimo. In ogni suo turno finché l'incantesimo non termina, l'incantatore può usare un'azione per bersagliare un'altra creatura, non potendo tuttavia bersagliare di nuovo una creatura che abbia superato un tiro salvezza contro questo lancio di sguardo penetrante.

  **Addormentato.** Il bersaglio cade privo di sensi, riprendendosi se subisce danni o se un'altra creatura usa la propria azione per risvegliarlo scuotendolo.

  **In preda al panico.** Il bersaglio è spaventato dall'incantatore. In ogni suo turno, la creatura spaventata deve effettuare l'azione Scatto e muoversi per allontanarsi dall'incantatore lungo il percorso più sicuro e rapido possibile, sempre che abbia lo spazio per muoversi. Se il bersaglio si muove in un punto a più di 18 metri dall'incantatore dove non è più in grado di vederlo, l'effetto termina.

  **Nauseato.** Il bersaglio subisce svantaggio ai tiri per colpire e alle prove di caratteristica e può effettuare un altro tiro salvezza su Saggezza alla fine di ogni suo turno. In caso di successo, l'effetto termina.
effects.0.name: "Sguardo penetrante: bersagliare un'altra creatura"
effects.0.text: Una creatura a tua scelta entro 18 metri che sei in grado di vedere deve superare un tiro salvezza su Saggezza o essere influenzata da Addormentato, In preda al panico o Nauseato per la durata dell'incantesimo; una creatura che abbia superato un tiro salvezza contro questo lancio non può essere bersagliata di nuovo.
onCast.0.note: "Solo Addormentato: il bersaglio si riprende se subisce danni o se un'altra creatura usa la propria azione per risvegliarlo scuotendolo."
onCast.1.note: "Solo In preda al panico: in ogni suo turno il bersaglio deve effettuare l'azione Scatto e allontanarsi dall'incantatore lungo il percorso più sicuro e rapido; l'effetto termina se raggiunge un punto a più di 18 metri dove non è più in grado di vederlo."
onCast.2.text: "Nauseato: il bersaglio subisce svantaggio ai tiri per colpire e alle prove di caratteristica; alla fine di ogni suo turno può ripetere il tiro salvezza su Saggezza per terminare l'effetto."
