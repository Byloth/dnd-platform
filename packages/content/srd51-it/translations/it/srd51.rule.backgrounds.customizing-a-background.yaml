name: Personalizzare un background
text: |-
  Un giocatore potrebbe decidere di ritoccare alcuni privilegi di un background in modo che si adattino meglio al suo personaggio o all'ambientazione della campagna. Per personalizzare un background è sufficiente sostituire un privilegio con un altro qualsiasi, scegliere due abilità qualsiasi e un totale di due competenze negli strumenti o linguaggi dai background di esempio. È possibile usare l'equipaggiamento della dotazione indicata dal background o spendere il denaro come descritto nella sezione "Equipaggiamento". (Se un personaggio sceglie di spendere il denaro, non può ottenere anche l'equipaggiamento della dotazione suggerita per la sua classe.) Infine si scelgono due tratti caratteriali, un ideale, un legame e un difetto. Se un giocatore non trova alcun privilegio adatto al background che desidera, può accordarsi con il GM per crearne uno.
