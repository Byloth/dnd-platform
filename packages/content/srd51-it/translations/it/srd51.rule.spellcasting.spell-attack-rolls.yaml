name: Tiri per colpire
text: |-
  Alcuni incantesimi richiedono che l'incantatore effettui un tiro per colpire per determinare se l'effetto dell'incantesimo colpisce il bersaglio desiderato. Il bonus di attacco dell'incantatore con un attacco con incantesimo è pari al modificatore di caratteristica da incantatore + il bonus di competenza dell'incantatore.

  La maggior parte degli incantesimi che richiedono tiri per colpire prevede attacchi a distanza. Va inoltre ricordato che il personaggio subisce svantaggio al tiro per colpire a distanza se si trova entro 1,5 metri da una creatura ostile non incapacitata che sia in grado di vederlo.
