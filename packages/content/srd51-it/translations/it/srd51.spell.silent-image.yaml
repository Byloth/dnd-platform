name: Immagine silenziosa
components.m: Un ciuffo di lana.
text: |-
  L'incantatore crea l'immagine di un oggetto, una creatura o un altro fenomeno visibile che non sia più grande di un cubo di 4,5 metri. L'immagine compare in un punto situato entro gittata e permane per la durata dell'incantesimo. L'immagine è puramente visiva; non è accompagnata da suoni, odori o altri effetti sensoriali. L'incantatore può usare la sua azione per fare in modo che l'immagine si muova fino a un qualsiasi altro punto entro gittata. Mentre l'immagine è in movimento, l'incantatore può alterarne l'aspetto in modo che i movimenti risultino naturali. Ad esempio, se l'incantatore crea l'immagine di una creatura e decide di farla muovere, può alterarla in modo da simulare che stia camminando. L'illusione può essere rivelata da un'interazione fisica, perché è possibile passarle attraverso. Una creatura che usa la sua azione per esaminare l'immagine può determinare che si tratta di un'illusione superando una prova di Intelligenza (Indagare) contro la CD del tiro salvezza sull'incantesimo. Se una creatura riconosce l'illusione per ciò che è, riesce a vedere attraverso l'immagine.
