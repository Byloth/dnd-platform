name: Armature pesanti
text: |-
  Tra tutte le categorie di armature, le armature pesanti sono quelle che offrono la protezione migliore. Coprono tutto il corpo e sono concepite per fermare una vasta gamma di attacchi. Soltanto i combattenti competenti sono in grado di gestire il peso e la stazza di questo tipo di armatura.

  L'armatura pesante non consente a un personaggio di aggiungere il proprio modificatore di Destrezza alla Classe Armatura, ma non lo penalizza neanche, qualora il suo modificatore di Destrezza sia negativo.

  **_Corazza ad anelli._** È un'armatura di cuoio su cui sono stati cuciti dei pesanti anelli di metallo che rinforzano l'armatura contro i colpi di spada e ascia. Una corazza ad anelli è inferiore a una cotta di maglia e solitamente è indossata soltanto da coloro che non possono permettersi un'armatura migliore.

  **_Cotta di maglia._** Una cotta di maglia, composta da anelli di metallo interconnessi, include uno strato di tessuto trapuntato da indossare sotto la cotta per evitare l'attrito e per attutire l'impatto dei colpi. Include anche due guanti d'arme.

  **_Corazza a strisce._** Quest'armatura è fatta di strette strisce verticali di metallo agganciate a uno strato di cuoio da indossare su un'imbottitura di stoffa. Le giunture sono protette da cotta di maglia flessibile.

  **_Armatura a piastre._** Un'armatura a piastre è composta da piastre di metallo modellate e interconnesse che coprono tutto il corpo. Include guanti d'arme, pesanti stivali di cuoio, un elmo con visiera e uno spesso strato di imbottitura sotto l'armatura. Una serie di fibbie e di cinghie consente di distribuire il peso su tutto il corpo.
