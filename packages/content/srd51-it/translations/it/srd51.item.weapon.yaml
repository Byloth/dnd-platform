name: Arma +1, +2 o +3
text: |-
  Arma (qualsiasi), non comune (+1), rara (+2) o molto rara (+3)

  Il personaggio ottiene un bonus ai tiri per colpire e ai tiri per i danni effettuati con quest'arma magica. Il bonus è determinato dalla rarità dell'arma.
features.0.name: Arma magica
features.0.effects.0.note: Il bonus è determinato dalla rarità dell'arma. Questa entità non possiede proprietà proprie di un'arma base.
features.0.effects.0.options.0.name: +1 (non comune)
features.0.effects.0.options.1.name: +2 (rara)
features.0.effects.0.options.2.name: +3 (molto rara)
