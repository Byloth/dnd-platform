name: Sfera di cristallo
text: |-
  Oggetto meraviglioso, molto raro o leggendario (richiede sintonia)

  Una tipica sfera di cristallo, un oggetto molto raro, ha un diametro di circa 15 cm. Mentre il personaggio tocca la sfera, può lanciare l'incantesimo scrutare (CD del tiro salvezza 17).

  Le seguenti varianti della sfera di cristallo sono oggetti leggendari e hanno proprietà aggiuntive.

  ***Sfera di cristallo della lettura del pensiero.*** Mentre il personaggio scruta con la sfera di cristallo, può usare un'azione per lanciare l'incantesimo individuazione dei pensieri (CD del tiro salvezza 17) su creature che è in grado di vedere situate entro 9 metri dal sensore dell'incantesimo. Non è obbligato a concentrarsi su individuazione dei pensieri per mantenerlo per la sua durata, ma se scrutare viene interrotto, anche l'incantesimo si interrompe.

  ***Sfera di cristallo della telepatia.*** Mentre il personaggio scruta con la sfera di cristallo, può comunicare telepaticamente con le creature che è in grado di vedere situate entro 9 metri dal sensore dell'incantesimo. Può anche usare un'azione per lanciare su una di quelle creature l'incantesimo suggestione (CD del tiro salvezza 17) attraverso il sensore. Non è obbligato a concentrarsi su suggestione per mantenerlo per la sua durata, ma se scrutare viene interrotto, anche l'incantesimo si interrompe. Una volta usato, il potere di suggestione della sfera di cristallo non può essere riutilizzato fino all'alba successiva.

  ***Sfera di cristallo della visione del vero.*** Mentre il personaggio scruta con la sfera di cristallo, ottiene vista pura entro un raggio di 36 metri centrato sul sensore dell'incantesimo.
