name: Servitore inosservato
components.m: Un pezzo di spago e un pezzo di legno.
text: |-
  Fino al termine di questo incantesimo, una forza invisibile, amorfa e priva di volontà propria svolge dei compiti semplici su ordine dell'incantatore. Il servitore appare sul terreno in uno spazio libero entro gittata, possiede CA 10, 1 punto ferita e Forza pari a 2 e non può attaccare. Quando i suoi punti ferita scendono a 0, l'incantesimo termina. Una volta in ogni suo turno, come azione bonus, l'incantatore può ordinare mentalmente al servitore di spostarsi di un massimo di 4,5 metri e interagire con un oggetto. Esso può eseguire compiti semplici alla stregua di un servitore umano, come portare oggetti, pulire, riparare, ripiegare abiti, accendere fuochi, servire pietanze e versare vino. Una volta impartito il comando, il servitore svolge il compito al meglio delle sue capacità finché non lo porta a termine, poi attende l'ordine successivo dell'incantatore. Se l'incantatore ordina al servitore di eseguire un compito che lo porta a più di 18 metri da lui, l'incantesimo termina.
effects.0.name: Comandare il servitore inosservato
effects.0.text: |-
  Ordini mentalmente al servitore di spostarsi fino a 4,5 metri e interagire con un oggetto, svolgendo un compito semplice alla stregua di un servitore umano finché non lo porta a termine. Se gli ordini di spostarsi a più di 18 metri da te, l'incantesimo termina.
effects.1.text: |-
  Una forza invisibile, amorfa e priva di volontà propria con CA 10, 1 punto ferita e Forza 2, che non può attaccare; l'incantesimo termina se i suoi punti ferita scendono a 0.
effects.1.note: "In v0 non ci sono blocchi di statistiche: le poche statistiche del servitore sono nel testo."
