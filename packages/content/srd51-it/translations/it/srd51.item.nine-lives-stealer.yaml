  Quando il personaggio mette a segno un colpo critico contro una creatura con meno di 100 punti ferita, quest'ultima deve superare un tiro salvezza su Costituzione con CD 15, altrimenti muore all'istante (i costrutti e i non morti sono immuni). La spada perde 1 carica per ogni creatura uccisa in questo modo; le cariche non si recuperano mai e, quando le termina, la spada perde questa proprietà.
features.1.effects.0.note: |-
