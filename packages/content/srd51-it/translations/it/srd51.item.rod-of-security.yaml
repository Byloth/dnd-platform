features.0.effects.0.name: Verga della sicurezza
features.0.effects.0.note: La verga non può essere riutilizzata finché non sono trascorsi 10 giorni; non esiste una ricarica di dieci giorni, quindi ripristinala a mano.
features.0.effects.1.name: Paradiso
features.0.effects.1.text: |-
  Trasporti istantaneamente te stesso e fino ad altre 199 creature consenzienti che sei in grado di vedere in un paradiso extraplanare di una forma a tua scelta, con acqua e cibo sufficienti per i visitatori. Per ogni ora passata lì, un visitatore recupera punti ferita come se avesse speso 1 Dado Vita; le creature non invecchiano. I visitatori possono rimanere fino a 200 giorni suddivisi per il numero delle creature presenti (arrotondato per difetto). Quando il tempo si esaurisce o usi un'azione per terminare l'effetto, tutti ricompaiono dove si trovavano o nello spazio libero più vicino.
features.0.effects.1.onUse.0.text: Tieni il conto al tavolo della permanenza (200 giorni suddivisi per il numero dei visitatori) e del recupero orario pari a 1 Dado Vita.
