name: Verga della sicurezza
text: |-
  Verga, molto rara

  Mentre il personaggio impugna questa verga, può usare un'azione per attivarla. La verga trasporta istantaneamente il personaggio e un massimo di altre 199 creature consenzienti e che è in grado di vedere in un paradiso situato in uno spazio extraplanare. È il personaggio a scegliere la forma che il paradiso assume. Potrebbe trattarsi di un giardino tranquillo, un'incantevole radura, un'allegra taverna, un palazzo immenso, un'isola tropicale, una fantastica fiera o qualsiasi altra cosa possa immaginare. A prescindere dalla sua natura, il paradiso contiene acqua e cibo sufficienti per soddisfare i bisogni dei visitatori. Ogni altra cosa con cui è possibile interagire in questo spazio extraplanare può esistere solamente al suo interno. Per esempio, un fiore colto in un giardino del paradiso scompare se portato fuori dallo spazio extraplanare.

  Per ogni ora passata nel paradiso, un visitatore recupera punti ferita come se avesse speso 1 Dado Vita. Inoltre, le creature non invecchiano mentre si trovano in tale luogo, sebbene il tempo scorra normalmente. I visitatori possono rimanere nel paradiso fino a un massimo di 200 giorni suddivisi per il numero delle creature presenti (arrotondato per difetto).

  Quando il tempo si esaurisce o il personaggio usa un'azione per terminare l'effetto, tutti i visitatori ricompaiono nello spazio che occupavano quando il personaggio ha attivato la verga o nello spazio libero più vicino. La verga non può essere riutilizzata finché non sono trascorsi 10 giorni.
