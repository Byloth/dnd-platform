name: "Incantesimi"
text: |-
  Alcuni oggetti magici consentono a chi li utilizza di lanciare un incantesimo tramite essi. L'incantesimo viene lanciato al più basso livello di incantesimo possibile, non consuma alcuno slot incantesimo e non richiede componenti, a meno che la descrizione dell'oggetto non specifichi altrimenti. L'incantesimo usa i suoi normali tempi di lancio, gittata e durata e, se richiede concentrazione, chi utilizza l'oggetto deve concentrarsi. Molti oggetti, come le pozioni, aggirano il lancio di un incantesimo e ne conferiscono direttamente gli effetti con la loro normale durata. Alcuni oggetti costituiscono un'eccezione a queste regole e possono cambiare il tempo di lancio, la durata o altre parti di un incantesimo.

  Alcuni oggetti magici, come certi bastoni, possono richiedere a chi li utilizza di usare la propria caratteristica da incantatore quando lancia un incantesimo tramite essi. Se chi utilizza l'oggetto possiede più di una caratteristica da incantatore, può scegliere quale usare. Se invece non possiede una caratteristica da incantatore (per esempio, nel caso di un ladro con il privilegio Usare Oggetto Magico), il suo modificatore di caratteristica da incantatore è pari a +0 per l'oggetto e il suo bonus di competenza è applicabile.
