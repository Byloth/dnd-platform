name: Sorpresa
text: |-
  Gli avventurieri si avvicinano di soppiatto a un accampamento di banditi e sbucano di colpo fuori dalla boscaglia per attaccarli. Un cubo gelatinoso scivola lungo il dungeon senza essere notato dagli avventurieri finché all'improvviso non ne inghiotte uno. In queste situazioni, una fazione della battaglia beneficia di sorpresa nei confronti dell'altra.

  È il GM a determinare chi potrebbe essere sorpreso. Se nessuna delle due fazioni cerca di essere furtiva, ognuna nota automaticamente l'altra. Altrimenti, il GM confronta le prove di Destrezza (Furtività) di chiunque tenti di nascondersi con il punteggio di Saggezza (Percezione) passiva di ogni creatura della fazione opposta. Ogni personaggio o mostro che non nota una minaccia è sorpreso all'inizio dell'incontro.

  Chi è sorpreso non può muoversi o effettuare un'azione nel suo primo turno di combattimento e non può effettuare una reazione finché quel turno non termina. Un membro di un gruppo può essere sorpreso anche se gli altri membri del suo gruppo non lo sono.
