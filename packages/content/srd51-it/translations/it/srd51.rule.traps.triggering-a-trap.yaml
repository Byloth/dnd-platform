name: Innescare una trappola
text: |-
  La maggior parte delle trappole si innesca quando una creatura entra in un qualche luogo o tocca qualcosa che il creatore della trappola voleva proteggere. Gli inneschi più comuni includono calpestare una piastra a pressione o una sezione falsa del pavimento, tirare un cavo teso, girare la maniglia di una porta e usare la chiave sbagliata in una serratura. Le trappole magiche vengono sovente innescate quando una creatura entra in un'area o tocca un oggetto. Alcune trappole magiche (come l'incantesimo _glifo di interdizione_) hanno delle condizioni di innesco più complicate, tra cui una parola d'ordine che impedisce alla trappola di attivarsi.
