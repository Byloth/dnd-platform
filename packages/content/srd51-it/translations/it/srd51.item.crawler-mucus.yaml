name: Muco di vermeiena
text: |-
  Questo veleno deve essere estratto da un vermeiena morto o incapacitato. Una creatura vittima di questo veleno deve superare un tiro salvezza su Costituzione con CD 13, altrimenti viene avvelenata per 1 minuto, rimanendo paralizzata per quel periodo. La creatura può ripetere il tiro salvezza alla fine di ogni suo turno e, se lo supera, l'effetto per lei termina.

  **_Contatto._** I veleni da contatto possono essere cosparsi su un oggetto e rimangono attivi finché non vengono toccati o lavati via. Una creatura che tocca un veleno da contatto con la pelle scoperta ne subisce gli effetti.
