name: Armature leggere
text: |-
  Le armature leggere, ricavate da materiali flessibili e sottili, sono le più adatte agli avventurieri agili, dal momento che forniscono protezione senza sacrificare la mobilità. Quando un personaggio indossa un'armatura leggera, aggiunge il proprio modificatore di Destrezza al numero base del tipo di armatura per determinare la sua Classe Armatura.

  **_Imbottita._** Un'armatura imbottita è costituita da vari strati trapuntati di stoffa e imbottitura.

  **_Cuoio._** Il pettorale e le spalline che compongono quest'armatura sono fatti di cuoio indurito e bollito nell'olio. Il resto dell'armatura è fatto di materiali più morbidi e flessibili.

  **_Cuoio borchiato._** Un'armatura di cuoio borchiato è fatta di cuoio resistente ma flessibile, rinforzato con borchie o spuntoni di metallo.
