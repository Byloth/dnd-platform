name: Veleno base (fiala)
text: |-
  Un personaggio può usare il veleno contenuto in questa fiala per rivestire un'arma tagliente o perforante, o un massimo di tre munizioni. Per applicare il veleno è richiesta un'azione. Una creatura colpita dall'arma o dalle munizioni avvelenate deve superare un tiro salvezza su Costituzione con CD 10, altrimenti subirà 1d4 danni da veleno. Una volta applicato, il veleno mantiene la sua potenza per 1 minuto prima di essiccarsi.
