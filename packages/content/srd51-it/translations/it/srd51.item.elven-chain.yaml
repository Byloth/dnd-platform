name: "Giaco di maglia elfico"
text: |-
  Armatura (giaco di maglia), rara

  Quando il personaggio indossa quest'armatura, ottiene un bonus di +1 alla CA ed è considerato competente nell'uso di quest'armatura anche se è privo di competenza nell'uso delle armature medie.
features.0.name: "Bonus di +1"
features.0.effects.1.note: "Sei considerato competente nell'uso di quest'armatura anche se sei privo di competenza nell'uso delle armature medie."
