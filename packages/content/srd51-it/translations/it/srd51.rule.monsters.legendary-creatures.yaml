name: "Creature leggendarie"
text: |-
  Una creatura leggendaria può fare cose che le creature ordinarie non sono in grado di fare. Può effettuare azioni speciali al di fuori del suo turno e può proiettare la sua influenza magica nel raggio di vari chilometri.

  Se una creatura assume la forma di una creatura leggendaria, per esempio tramite un incantesimo, non ottiene le azioni leggendarie, le azioni di tana o gli effetti regionali di quella forma.
