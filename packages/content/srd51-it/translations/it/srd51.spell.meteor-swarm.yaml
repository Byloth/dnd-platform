name: Sciame di meteore
text: Globi infuocati precipitano sul terreno in quattro punti differenti entro gittata che l'incantatore è in grado di vedere. Ogni creatura situata in una sfera del raggio di 12 metri centrata su ognuno di quei punti deve effettuare un tiro salvezza su Destrezza. La sfera si estende intorno agli angoli. Una creatura subisce 20d6 danni da fuoco e 20d6 danni contundenti in caso di fallimento, o la metà dei danni in caso di successo. Una creatura in un'area con più esplosioni infuocate subisce l'effetto soltanto una volta. L'incantesimo danneggia gli oggetti presenti nell'area e incendia quelli infiammabili non indossati o trasportati.
