name: "Vista putrefatta"
text: |-
  Questa infezione dolorosa causa sanguinamento dagli occhi e con il tempo finisce per accecare la vittima.

  Una bestia o un umanoide che beve acqua contaminata da vista putrefatta deve superare un tiro salvezza su Costituzione con CD 15, altrimenti viene infettato. Un giorno dopo l'infezione, la vista della creatura inizia a farsi sfocata ed essa subisce una penalità di -1 ai tiri per colpire e alle prove di caratteristica basate sulla vista. Al termine di ogni riposo lungo dopo la comparsa dei sintomi, la penalità peggiora di 1. Quando raggiunge -5, la vittima è accecata finché la sua vista non viene ripristinata da magie come _ristorare inferiore_ o _guarigione_.

  Vista putrefatta può essere curata usando un raro fiore chiamato Occhiovispo, che cresce in alcune paludi. In un'ora, un personaggio dotato di competenza con una borsa da erborista può trasformare il fiore in una dose di unguento che, applicata sugli occhi prima di un riposo lungo, impedisce alla malattia di peggiorare una volta completato il riposo. Dopo l'applicazione di tre dosi, l'unguento cura la malattia in modo definitivo.
