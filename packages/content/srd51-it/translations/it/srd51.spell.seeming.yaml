name: Sembrare
text: |-
  Questo incantesimo consente all'incantatore di alterare l'aspetto di un qualsiasi numero di creature entro gittata che è in grado di vedere, assegnando a ognuna un nuovo aspetto illusorio. Un bersaglio non consenziente può effettuare un tiro salvezza su Carisma e, se lo supera, non ne viene influenzato. L'incantesimo camuffa l'aspetto fisico oltre agli abiti, l'armatura, le armi e l'equipaggiamento. Ogni creatura può apparire 30 cm più alta o più bassa, apparire magra, grassa o di corporatura intermedia. Tuttavia, l'incantatore non può cambiare il tipo di corpo del bersaglio, quindi deve scegliere una forma che usi la stessa disposizione basilare degli arti. Entro questi limiti, la natura dell'illusione dipende da lui. L'incantesimo permane per tutta la sua durata, a meno che l'incantatore non usi un'azione per interromperlo prima. I cambiamenti apportati da questo incantesimo non passano il vaglio di un'ispezione fisica. Per esempio, se l'incantatore usa questo incantesimo per aggiungere un cappello all'abbigliamento della creatura, dato che gli oggetti sono in grado di attraversarlo, chiunque lo tocchi non sente nulla o tasta solamente la testa e i capelli della creatura. Se l'incantatore usa questo incantesimo per apparire più magro rispetto alla realtà, quando qualcuno tenta di toccarlo incontrerebbe il suo corpo mentre la mano è ancora apparentemente a mezz'aria. Una creatura può usare la sua azione per ispezionare il bersaglio ed effettuare una prova di Intelligenza (Indagare) contro la CD del tiro salvezza sull'incantesimo. Se la supera, capisce che il bersaglio è camuffato.
