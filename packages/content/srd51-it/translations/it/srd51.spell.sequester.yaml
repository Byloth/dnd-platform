name: Celare
components.m: Un composto di polvere di diamante, smeraldo, rubino e zaffiro del valore di almeno 5.000 mo, che l'incantesimo consuma.
text: |-
  Questo incantesimo consente all'incantatore di nascondere una creatura consenziente o un oggetto dai tentativi di individuazione per la durata dell'incantesimo. Quando l'incantatore lancia questo incantesimo e tocca il bersaglio, questo diventa invisibile e non può essere bersagliato da incantesimi di divinazione o percepito dai sensori di scrutamento creati da quegli incantesimi. Se il bersaglio è una creatura, cade in uno stato di animazione sospesa: per lei, il tempo cessa di scorrere e non invecchia. Per terminare prematuramente l'incantesimo, l'incantatore può stabilire una condizione, che può essere qualsiasi cosa a sua scelta che, tuttavia, debba verificarsi o essere visibile entro 1,5 km dal bersaglio. Per esempio, "dopo 1.000 anni" o "al risveglio del tarrasque". Questo incantesimo termina inoltre se il bersaglio subisce danni.
onCast.0.note: Una creatura consenziente o un oggetto; non può essere bersagliato da incantesimi di divinazione né percepito dai sensori di scrutamento.
onCast.1.text: |-
  Una creatura cade in uno stato di animazione sospesa e non invecchia. L'incantesimo termina quando si verifica una condizione da te stabilita (che si verifichi o sia visibile entro 1,5 km) o se il bersaglio subisce danni.
