name: Azione bonus
text: |-
  Un incantesimo lanciato con un'azione bonus è particolarmente rapido. Devi usare un'azione bonus nel tuo turno per lanciare l'incantesimo, purché tu non abbia già effettuato un'azione bonus in quel turno. Non potrai lanciare nessun altro incantesimo durante quello stesso turno, a eccezione di un trucchetto che abbia un tempo di lancio di 1 azione.
