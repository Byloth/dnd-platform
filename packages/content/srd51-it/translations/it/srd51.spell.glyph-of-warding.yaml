name: Glifo di interdizione
components.m: Incenso e polvere di diamante del valore di almeno 200 mo, che l'incantesimo consuma.
text: |-
  Quando lancia questo incantesimo, l'incantatore traccia un glifo che danneggia le altre creature su una superficie (come un tavolo o una sezione di pavimento o parete) o, al fine di nasconderlo, all'interno di un oggetto che può essere chiuso (come un libro, una pergamena o un forziere del tesoro). Se sceglie una superficie, il glifo può coprire un'area massima del diametro di 3 metri. Se l'incantatore sceglie un oggetto, questo non deve essere spostato; se ciò avviene, una volta che l'oggetto si allontana per più di 3 metri dal luogo in cui è stato lanciato l'incantesimo, il glifo si infrange e l'incantesimo termina senza essere innescato. Il glifo è pressoché invisibile e per scorgerlo è necessario superare una prova di Intelligenza (Indagare) contro la CD del tiro salvezza sull'incantesimo. Quando questo incantesimo viene lanciato, l'incantatore decide cosa innesca il glifo. Nel caso di glifi tracciati su una superficie, gli inneschi più comuni includono: toccare o camminare su di essi, rimuovere un altro oggetto che li copre, avvicinarsi a una certa distanza da loro o manipolare gli oggetti su cui sono tracciati. Nel caso di glifi tracciati all'interno di un oggetto, gli inneschi più comuni includono: aprire l'oggetto, avvicinarsi a una certa distanza da esso, oppure vedere o leggere il glifo. Una volta che un glifo viene innescato, l'incantesimo termina. L'incantatore può definire l'innesco in modo che l'incantesimo si attivi solamente in certe circostanze o in base a certe caratteristiche fisiche (come peso o altezza), al tipo di creature (per esempio, la protezione potrebbe attivarsi solo contro aberrazioni o drow) o all'allineamento. L'incantatore può inoltre impostare condizioni per evitare di innescare il glifo, come pronunciare una specifica parola d'ordine. Quando l'incantatore traccia il glifo, può scegliere tra glifo magico o rune esplosive.

  **Rune esplosive.** Quando attivato, il glifo esplode in una sfera di energia con raggio di 6 metri centrata su di esso che si estende oltre gli angoli. Ogni creatura presente nell'area deve effettuare un tiro salvezza su Destrezza. In caso di fallimento, subisce 5d8 danni da acido, freddo, fulmine, fuoco o tuono (a scelta dell'incantatore al momento della creazione del glifo), o la metà dei danni in caso di successo.

  **Glifo magico.** L'incantatore può custodire un incantesimo preparato di 3° livello o inferiore all'interno del glifo lanciandolo come parte del suo processo di creazione. L'incantesimo deve avere come bersaglio una sola creatura o un'area. In questo modo, l'incantesimo custodito non ha effetto immediato, ma viene lanciato quando il glifo si attiva. Se l'incantesimo ha un bersaglio, risulterà essere la creatura che ha attivato il glifo, mentre se influenza un'area, tale area sarà centrata su quella creatura. Se l'incantesimo evoca creature ostili oppure crea oggetti o trappole dannose, ciò che viene evocato o creato appare nel punto più vicino possibile all'intruso e lo attacca. Se l'incantesimo richiede concentrazione, permane per tutta la sua durata.
higherLevel: |-
  Quando l'incantatore lancia questo incantesimo usando uno slot incantesimo di 4° livello o superiore, i danni di un glifo rune esplosive aumentano di 1d8 per ogni slot di livello superiore al 3°. Se l'incantatore crea un glifo magico, può custodirvi qualsiasi incantesimo di livello pari o inferiore a quello dello slot usato per il glifo di interdizione.
