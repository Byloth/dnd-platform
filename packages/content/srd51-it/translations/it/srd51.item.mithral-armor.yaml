features.0.effects.0.note: |-
  Questa voce copre qualsiasi armatura media o pesante, quindi non può dichiarare un unico insieme di campi dell'armatura. Una variante concreta (giaco di maglia in mithral, armatura a piastre in mithral) dovrebbe dichiarare la propria categoria, CA e peso senza stealthDisadvantage né strengthMin.
