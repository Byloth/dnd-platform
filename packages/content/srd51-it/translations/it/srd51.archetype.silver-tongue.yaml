name: Lingua d'argento
pitch: Un artista affascinante che se la cava con le parole, ispira gli amici e lancia incantesimi che cambiano le sorti di uno scontro.
why.class: "I bardi aiutano tutti al tavolo: Ispirazione Bardica, guarigione e un incantesimo per quasi ogni situazione."
why.species: "Un mezzelfo aumenta il Carisma e altri due punteggi a scelta e ottiene due abilità extra: la specie più flessibile."
why.abilityPriority: Il Carisma alimenta i tuoi incantesimi e la tua ispirazione; la Destrezza ti protegge in armatura leggera; la Costituzione ti tiene in piedi.
why.background: Accolito, l'unico background dell'SRD, ti dà le abilità Intuizione e Religione e due linguaggi.
