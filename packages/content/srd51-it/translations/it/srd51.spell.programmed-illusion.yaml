name: Illusione programmata
components.m: Un ciuffo di lana e polvere di giada del valore di almeno 25 mo.
text: |-
  L'incantatore crea un'illusione di un oggetto, una creatura o qualche altro fenomeno visibile entro gittata che si attiva al verificarsi di una condizione specifica. Fino ad allora, l'illusione è impercettibile. Inoltre, essa non può essere più grande di un cubo di 9 metri ed è l'incantatore al momento del lancio a decidere come si comporta e quali suoni emette. Questa esibizione programmata può durare un massimo di 5 minuti. Quando la condizione specificata si verifica, l'illusione si materializza e si comporta nella maniera descritta dall'incantatore. Al termine della sua esibizione, l'illusione scompare e rimane latente per 10 minuti. Dopo questo periodo, l'illusione può essere attivata di nuovo. La condizione di innesco può essere sia generale che dettagliata, ma deve essere basata su condizioni visibili o udibili che si verificano entro 9 metri dall'area. Per esempio, l'incantatore potrebbe creare un'illusione di se stesso per avvertire coloro che tentano di aprire una porta protetta da una trappola o potrebbe programmare l'illusione per innescarsi solo quando una creatura recita la parola o la frase giusta. L'illusione può essere rivelata da un'interazione fisica, perché è possibile passarle attraverso. Una creatura che usa la sua azione per esaminare l'immagine può determinare che si tratta di un'illusione superando una prova di Intelligenza (Indagare) contro la CD del tiro salvezza sull'incantesimo. Se una creatura riconosce l'illusione per ciò che è, riesce a vedere attraverso l'immagine e gli eventuali suoni che emette si attenuano alle sue orecchie.
