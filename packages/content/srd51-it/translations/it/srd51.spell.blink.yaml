name: Intermittenza
text: |-
  L'incantatore tira un d20 alla fine di ogni suo turno per la durata dell'incantesimo. Con un risultato pari o superiore a 11, l'incantatore svanisce dal piano di esistenza in cui si trova per riapparire sul Piano Etereo (l'incantesimo non funziona e il lancio va sprecato se l'incantatore si trova già su quel piano). All'inizio del suo turno successivo, e quando l'incantesimo termina nel caso l'incantatore si trovi già sul Piano Etereo, l'incantatore ritorna in uno spazio libero a sua scelta, che è in grado di vedere e situato entro 3 metri dal punto in cui è svanito. Se nessuno spazio libero è disponibile entro quel raggio, l'incantatore appare nello spazio libero più vicino (scelto casualmente se più spazi liberi si trovano a pari distanza). Con un'azione, l'incantatore può terminare questo incantesimo. Mentre si trova sul Piano Etereo, l'incantatore può sentire e vedere il piano da cui proviene, che è proiettato in scala di grigi ed è visibile solo fino a una distanza di 18 metri. L'incantatore può influenzare ed essere influenzato solo dalle creature che si trovano sul Piano Etereo. Quelle che non sono presenti sul piano non possono percepire o interagire con l'incantatore, a meno che non siano dotate di una qualche capacità per farlo.
