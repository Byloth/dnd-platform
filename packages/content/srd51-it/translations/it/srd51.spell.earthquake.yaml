name: Terremoto
components.m: Un pizzico di terriccio, un frammento di roccia e un pezzo d'argilla.
text: |-
  L'incantatore crea una scossa sismica in un punto del terreno entro gittata che è in grado di vedere. Per la durata dell'incantesimo, una scossa intensa sconquassa il terreno in un raggio di 30 metri centrato su quel punto e scuote creature e strutture a contatto con il terreno di quell'area. Il terreno nell'area diventa terreno difficile: qualsiasi creatura si stia concentrando all'interno dell'area deve effettuare un tiro salvezza su Costituzione. Se lo fallisce, la sua concentrazione viene interrotta. Quando l'incantatore lancia questo incantesimo e alla fine di ogni turno trascorso a concentrarsi su di esso, ogni creatura sul terreno nell'area deve effettuare un tiro salvezza su Destrezza. Se lo fallisce, la creatura viene buttata a terra prona. Questo incantesimo può avere degli effetti aggiuntivi in base al terreno nell'area, come determinato dal GM.

  **Crepe.** Dopo aver lanciato l'incantesimo, per tutta l'area interessata si aprono delle crepe a partire dall'inizio del turno successivo dell'incantatore. Un totale di 1d6 crepe di questo tipo si apre in punti scelti dal GM. Ognuna di esse è profonda 1d10 × 3 metri, ampia 3 metri e si estende da un lato all'altro dell'area dell'incantesimo. Se una creatura si trova nel punto in cui si apre una crepa, deve superare un tiro salvezza su Destrezza o vi cade dentro. Una creatura che supera il tiro salvezza riesce a spostarsi insieme al bordo della crepa mentre si apre. Una crepa che si apre sotto una struttura ne provoca il crollo immediato (vedi di seguito).

  **Strutture.** La scossa infligge 50 danni contundenti a una qualsiasi struttura a contatto con il terreno nell'area in cui è stato lanciato l'incantesimo e all'inizio di ogni turno dell'incantatore fino al termine dell'incantesimo. Se la struttura scende a 0 punti ferita, crolla e potenzialmente danneggia le creature vicine. Una creatura situata a una distanza pari alla metà dell'altezza della struttura deve effettuare un tiro salvezza su Destrezza. Se fallisce, subisce 5d6 danni contundenti, viene buttata a terra prona e rimane sepolta sotto le macerie; per liberarsi con un'azione deve effettuare una prova di Forza (Atletica) con CD 20. Il GM può aumentare o ridurre la CD, in base alla natura delle macerie. In caso di successo, subisce la metà dei danni, non viene buttata a terra prona e non viene sepolta sotto le macerie.
onCast.0.note: Quando l'incantatore lancia l'incantesimo e alla fine di ogni turno trascorso a concentrarsi su di esso, ogni creatura sul terreno nell'area effettua un tiro salvezza su Destrezza e, se lo fallisce, viene buttata a terra prona.
onCast.1.text: |-
  Ogni creatura sul terreno che si sta concentrando effettua un tiro salvezza su Costituzione o perde la concentrazione. Il terreno è terreno difficile. All'inizio del turno successivo dell'incantatore si aprono delle crepe (1d6, ognuna profonda 1d10 × 3 metri): una creatura che si trova dove se ne apre una effettua un tiro salvezza su Destrezza o vi cade dentro. Le strutture subiscono 50 danni contundenti quando l'incantatore lancia l'incantesimo e all'inizio di ogni suo turno; quando una crolla, le creature entro una distanza pari alla metà della sua altezza effettuano un tiro salvezza su Destrezza: se lo falliscono subiscono 5d6 danni contundenti, vengono buttate a terra prone e rimangono sepolte (prova di Forza (Atletica) con CD 20 come azione per liberarsi); se lo superano subiscono la metà dei danni.
