name: Labirinto
text: L'incantatore bandisce una creatura entro gittata che è in grado di vedere in un semipiano labirintico. Il bersaglio rimane laggiù per la durata dell'incantesimo o finché non fugge dal labirinto. Il bersaglio può usare la sua azione per provare a fuggire. Quando questo avviene, effettua una prova di Intelligenza con CD 20. Se la supera, riesce a fuggire e l'incantesimo termina (un minotauro o un demone goristro la superano automaticamente). Al termine dell'incantesimo, il bersaglio riappare nello spazio in cui si trovava prima del lancio o, se è occupato, nello spazio libero più vicino.
