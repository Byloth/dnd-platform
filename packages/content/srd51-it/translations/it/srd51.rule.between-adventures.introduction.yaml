name: Tra un'avventura e l'altra
text: |-
  Tra un'incursione in un dungeon e una battaglia contro un'antica entità malvagia, gli avventurieri hanno bisogno di tempo per riposare, recuperare le forze e prepararsi all'avventura successiva. Molti avventurieri usano questo tempo anche per dedicarsi ad altre attività come fabbricare armi e armature, condurre ricerche o spendere le monete d'oro che hanno guadagnato con tanta fatica.

  In alcuni casi il trascorrere del tempo è qualcosa che richiede poca enfasi o descrizione. All'inizio di una nuova avventura, il GM potrebbe limitarsi a dichiarare che è passato un certo lasso di tempo e consentire a ogni giocatore di descrivere per sommi capi cos'ha fatto il suo personaggio nel frattempo. In altri casi il GM potrebbe decidere di tenere semplicemente il conto di quanto tempo è passato per calcolare le conseguenze di certi eventi al di là della percezione dei personaggi.
