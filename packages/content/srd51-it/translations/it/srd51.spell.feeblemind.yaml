name: Regressione mentale
components.m: Una manciata di argilla, cristallo, vetro o sfere di minerali.
text: |-
  L'incantatore assale la mente di una creatura entro gittata che è in grado di vedere, nel tentativo di frantumare il suo intelletto e la sua personalità. Il bersaglio subisce 4d6 danni psichici e deve effettuare un tiro salvezza su Intelligenza. Se lo fallisce, i suoi punteggi di Intelligenza e Carisma si riducono a 1: la creatura non può lanciare incantesimi, attivare oggetti magici, comprendere linguaggi o comunicare in alcun modo intelligibile. Tuttavia, può identificare i propri amici, seguirli e anche proteggerli. Alla fine di ogni 30 giorni, la creatura può ripetere il tiro salvezza contro questo incantesimo. In caso di successo, l'incantesimo termina. Anche gli incantesimi desiderio, guarigione o ristorare superiore possono porre fine a questo incantesimo.
effects.2.text: Non puoi lanciare incantesimi, attivare oggetti magici, comprendere linguaggi o comunicare in alcun modo intelligibile; puoi identificare i tuoi amici, seguirli e proteggerli.
onCast.0.text: 4d6 danni psichici indipendentemente dal tiro salvezza; se la creatura fallisce il tiro salvezza su Intelligenza, i suoi punteggi di Intelligenza e Carisma si riducono a 1 e si applicano gli effetti precedenti finché non supera il tiro salvezza ripetuto alla fine di ogni 30 giorni, o finché ristorare superiore, guarigione o desiderio non pongono fine all'incantesimo. L'incantesimo è istantaneo, quindi il motore di gioco non traccia questi effetti come un incantesimo attivo.
