name: Sfera congelante
components.m: Una piccola sfera di cristallo.
text: |-
  Una sfera congelata di energia fredda sfreccia dal dito dell'incantatore verso un punto a sua scelta entro gittata, dove esplode in una sfera di 18 metri di raggio. Ogni creatura nell'area deve effettuare un tiro salvezza su Costituzione. Se lo fallisce, subisce 10d6 danni da freddo, mentre se lo supera, subisce solo la metà dei danni. Se la sfera colpisce uno specchio d'acqua o un liquido composto principalmente da acqua (escluse le creature di questo tipo), ghiaccia il liquido fino a una profondità di 15 cm in un'area quadrata di 9 metri. Il ghiaccio dura 1 minuto. Le creature che stavano nuotando sulla superficie dell'acqua ghiacciata rimangono intrappolate nel ghiaccio e possono usare un'azione per effettuare una prova di Forza contro la CD del tiro salvezza sull'incantesimo per liberarsi. Una volta completato l'incantesimo, l'incantatore può decidere di non scagliare la sfera. Una piccola sfera della grandezza di una pietra da fionda, fredda al tocco, appare tra le mani dell'incantatore. In qualsiasi momento, l'incantatore o una creatura a cui l'ha consegnata può lanciare la sfera (entro una gittata di 12 metri) o scagliarla con una fionda (entro la normale gittata della fionda). La sfera si infrange all'impatto, con lo stesso effetto del lancio normale dell'incantesimo. Tuttavia, l'incantatore può anche appoggiare la sfera a terra senza romperla. Dopo 1 minuto, se non è ancora stata infranta, la sfera esplode.
higherLevel: |-
  Quando l'incantatore lancia questo incantesimo usando uno slot incantesimo di 7° livello o superiore, i danni aumentano di 1d6 per ogni slot di livello superiore al 6°.
