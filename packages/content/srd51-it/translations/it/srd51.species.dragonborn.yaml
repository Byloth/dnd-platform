name: "Dragonide"
text: |-
  Il retaggio draconico si manifesta in una varietà di caratteristiche che il personaggio condivide con gli altri dragonidi.
features.0.name: "Incremento dei punteggi di caratteristica"
features.0.text: |-
  Il punteggio di Forza di un dragonide aumenta di 2 e quello di Carisma aumenta di 1.
features.1.name: "Velocità"
features.1.text: |-
  La velocità base sul terreno di un dragonide è di 9 metri.
features.2.name: "Età"
features.2.text: |-
  I giovani dragonidi crescono velocemente. Camminano già poche ore dopo la schiusa dell'uovo, a 3 anni raggiungono le dimensioni e lo sviluppo di un bambino umano di 10 anni e a 15 anni raggiungono la maturità. Vivono all'incirca fino a 80 anni.
features.3.name: "Allineamento"
features.3.text: |-
  I dragonidi tendono agli estremi e scelgono coscientemente da che parte stare nella guerra cosmica tra il bene e il male. La maggior parte dei dragonidi è buona, ma quelli che si schierano con il male possono rivelarsi tremendamente malvagi.
features.4.name: "Taglia"
features.4.text: |-
  I dragonidi sono più alti e pesanti degli umani: hanno un'altezza superiore a 1,8 metri e un peso medio di 125 kg. Un dragonide è una creatura di taglia Media.
features.5.name: "Linguaggi"
features.5.text: |-
  Un dragonide sa parlare, leggere e scrivere in Comune e in Draconico. Si ritiene che il Draconico sia uno dei linguaggi più antichi e viene spesso usato nello studio della magia. Ha un suono aspro per la maggior parte delle creature e include numerose consonanti dure e sibilanti.
features.6.name: "Tabella della discendenza draconica"
features.6.text: |-
  | Drago   | Tipo di danni | Soffio                                  |
  |---------|---------------|-----------------------------------------|
  | Nero    | Acido         | Linea di 1,5 m × 9 m (TS Destrezza)     |
  | Blu     | Fulmine       | Linea di 1,5 m × 9 m (TS Destrezza)     |
  | Ottone  | Fuoco         | Linea di 1,5 m × 9 m (TS Destrezza)     |
  | Bronzo  | Fulmine       | Linea di 1,5 m × 9 m (TS Destrezza)     |
  | Rame    | Acido         | Linea di 1,5 m × 9 m (TS Destrezza)     |
  | Oro     | Fuoco         | Cono di 4,5 m (TS Destrezza)            |
  | Verde   | Veleno        | Cono di 4,5 m (TS Costituzione)         |
