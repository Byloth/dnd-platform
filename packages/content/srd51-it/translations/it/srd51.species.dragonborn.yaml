features.7.effects.0.note: |-
  La resistenza ai danni e il soffio del drago scelto sono applicati dai tratti Resistenza ai danni e Soffio.
features.8.name: "Soffio"
features.8.text: |-
  Un dragonide può usare la sua azione per esalare un soffio di energia distruttiva. La discendenza draconica determina la dimensione, la forma e il tipo di danno dell'esalazione.
  Quando il dragonide utilizza il suo soffio, ogni creatura entro l'area dell'esalazione deve effettuare un tiro salvezza determinato in base alla discendenza draconica. La CD di questo tiro salvezza è pari a 8 + il modificatore di Costituzione del dragonide + il bonus di competenza del dragonide. Una creatura subisce 2d6 danni se il tiro salvezza fallisce. Se invece ha successo, i danni sono dimezzati. I danni aumentano a 3d6 al 6° livello, 4d6 all'11° livello e 5d6 al 16° livello.
features.8.effects.0.name: "Soffio"
features.8.effects.0.note: |-
  Una volta per riposo breve o lungo; il testo importato omette la frase sul riposo, il limite segue l'SRD.
features.8.effects.1.name: "Soffio"
features.8.effects.1.text: |-
  Esali energia distruttiva nell'area determinata dalla tua discendenza draconica. Ogni creatura nell'area deve effettuare un tiro salvezza (CD 8 + il tuo modificatore di Costituzione + il tuo bonus di competenza) e subisce 2d6 danni se il tiro salvezza fallisce, o la metà dei danni se ha successo. I danni aumentano a 3d6 al 6° livello, 4d6 all'11° livello e 5d6 al 16° livello.
features.8.effects.1.onUse.0.text: |-
  Area, caratteristica del tiro salvezza e tipo di danni dipendono dalla tua discendenza draconica: nero/blu/ottone/bronzo/rame linea di 1,5 m × 9 m (TS Destrezza); oro/rosso cono di 4,5 m (TS Destrezza); verde/argento/bianco cono di 4,5 m (TS Costituzione). Danni: 2d6, 3d6 al 6° livello, 4d6 all'11°, 5d6 al 16°.
features.8.effects.1.note: |-
  I dadi dei danni aumentano con il livello del personaggio e la forma, il tiro salvezza e il tipo di danni variano con la discendenza scelta; nella v0 sono riportati nella nota.
features.9.name: "Resistenza ai danni"
features.9.text: |-
  Un dragonide dispone di resistenza ai danni del tipo associato alla sua discendenza draconica.
