  | Argento | Freddo        | Cono di 4,5 m (TS Costituzione)         |
  | Bianco  | Freddo        | Cono di 4,5 m (TS Costituzione)         |
features.7.name: "Discendenza draconica"
features.7.text: |-
  Un dragonide vanta una discendenza da un drago. Il giocatore sceglie un tipo di drago dalla tabella "Discendenza draconica". Il soffio del personaggio e la sua resistenza ai danni saranno determinati dalla tipologia di drago, come indicato dalla tabella.
