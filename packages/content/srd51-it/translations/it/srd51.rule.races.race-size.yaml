name: Taglia
text: |-
  I personaggi della maggior parte delle razze sono di taglia Media, una categoria di taglia che include creature alte all'incirca da 1,2 a 2,4 metri. I membri di alcune razze sono di taglia Piccola (tra 0,6 metri e 1,2 metri), il che significa che alcune regole di gioco li influenzano in modo diverso. La più importante di queste regole è che i personaggi di taglia Piccola hanno difficoltà a maneggiare armi pesanti, come spiegato in "Equipaggiamento".
