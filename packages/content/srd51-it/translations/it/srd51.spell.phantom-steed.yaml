name: Destriero fantomatico
text: Una creatura di taglia Grande, simile a un cavallo quasi reale, compare sul terreno in uno spazio libero entro gittata a scelta dell'incantatore. L'incantatore può inoltre scegliere l'aspetto della creatura, che deve tuttavia essere dotata di sella, morso e briglie. Qualsiasi equipaggiamento creato dall'incantesimo svanisce in uno sbuffo di fumo se trasportato a più di 3 metri dal destriero. Per la durata dell'incantesimo, l'incantatore o una creatura a sua scelta può cavalcare il destriero, che usa le statistiche di un cavallo da galoppo, ma ha una velocità di 30 metri e può percorrere 15 km in un'ora o 20 km a passo veloce. Al termine dell'incantesimo, la cavalcatura svanisce gradualmente, dando al suo cavaliere 1 minuto per smontare. L'incantesimo termina se l'incantatore usa un'azione per interromperlo o se il destriero subisce danni.
effects.0.text: "Un destriero quasi reale di taglia Grande che l'incantatore o una creatura a sua scelta può cavalcare: usa le statistiche di un cavallo da galoppo, ma ha una velocità di 30 metri e percorre 15 km all'ora (20 km a passo veloce). Il suo equipaggiamento svanisce se trasportato a più di 3 metri da esso; l'incantesimo termina se l'incantatore lo interrompe con un'azione o se il destriero subisce danni, e il destriero svanisce nell'arco di 1 minuto."
effects.0.note: "Nessuna scheda delle statistiche nella v0: le statistiche del cavallo da galoppo vanno consultate a parte."
