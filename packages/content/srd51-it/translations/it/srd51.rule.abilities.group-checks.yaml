name: Prove di gruppo
text: |-
  Quando alcuni individui cercano di ottenere insieme un risultato, il GM può richiedere una prova di caratteristica di gruppo. In una situazione del genere, i personaggi abili in una determinata impresa aiutano quelli che non lo sono.

  Per effettuare una prova di caratteristica di gruppo, ogni membro del gruppo effettua la prova di caratteristica richiesta. Se almeno metà del gruppo la supera, l'intero gruppo ha successo. Altrimenti il gruppo fallisce.

  Le prove di gruppo si usano raramente e tornano utili soprattutto quando tutti i personaggi hanno successo o falliscono come gruppo. Per esempio, quando gli avventurieri devono attraversare una palude, il GM potrebbe richiedere una prova di gruppo di Saggezza (Sopravvivenza) per determinare se i personaggi evitano le sabbie mobili, le doline e gli altri pericoli naturali di quell'ambiente. Se almeno metà del gruppo la supera, i personaggi vincenti riescono a tenere i loro compagni fuori dal pericolo. Altrimenti, il gruppo s'imbatte in uno di quei pericoli.

  Ogni impresa che un personaggio o un mostro può tentare nel gioco è coperta da una delle sei caratteristiche. Questa sezione spiega in maggior dettaglio cosa significano quelle caratteristiche e i modi in cui sono usate nel gioco.
