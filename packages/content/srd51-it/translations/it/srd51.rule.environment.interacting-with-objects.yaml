name: "Interazioni con gli oggetti"
text: |-
  Le interazioni di un personaggio con gli oggetti all'interno di un ambiente spesso si risolvono in modo molto semplice nel gioco. Il giocatore annuncia al GM che il suo personaggio sta facendo qualcosa, come per esempio azionare una leva, e il GM descrive cosa succede (sempre che succeda qualcosa).
  Per esempio, un personaggio potrebbe decidere di azionare una leva che, a sua volta, potrebbe sollevare una saracinesca e allagare d'acqua una stanza, oppure aprire una porta segreta lungo una parete. Se la leva è bloccata dalla ruggine, tuttavia, il personaggio potrebbe essere costretto a sbloccarla con la forza. In quel caso, il GM potrebbe richiedergli una prova di Forza per determinare se riesce a tirare la leva nella posizione desiderata. Il GM stabilisce la CD per prove simili basandosi sulla difficoltà dell'impresa.
  I personaggi possono anche danneggiare gli oggetti usando armi e incantesimi.
  Gli oggetti sono immuni al veleno e ai danni psichici, ma per il resto sono influenzati dagli attacchi fisici e magici analogamente alle creature. Il GM determina la Classe Armatura e i punti ferita di un oggetto, e potrebbe decidere che certi oggetti siano dotati di resistenza o immunità a certi tipi di attacco. (È difficile tagliare una corda con un randello, per esempio.) Gli oggetti falliscono sempre i loro tiri salvezza su Forza e Destrezza e sono immuni agli effetti che richiedono altri tiri salvezza. Quando un oggetto scende a 0 punti ferita, si rompe.
  Un personaggio può anche effettuare una prova di Forza per rompere un oggetto. È il GM a stabilire la CD di questo genere di prove.
