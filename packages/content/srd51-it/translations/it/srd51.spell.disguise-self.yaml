name: Camuffare se stesso
text: |-
  L'incantatore assume un aspetto diverso (che include i suoi abiti, armatura, armi e altri oggetti personali presenti sulla sua persona) per la durata dell'incantesimo o finché non usa la sua azione per terminarlo. Può apparire 30 cm più alto o più basso e apparire magro, grasso o di corporatura normale. Non può cambiare il suo tipo di corpo, quindi deve adottare una forma che usi la stessa disposizione basilare degli arti. Entro questi limiti, la natura dell'illusione dipende da lui. I cambiamenti apportati da questo incantesimo non passano il vaglio di un'ispezione fisica. Per esempio, se l'incantatore usa questo incantesimo per aggiungere un cappello al suo abbigliamento, gli oggetti attraverserebbero il cappello e chiunque toccasse l'incantatore non sentirebbe nulla, o gli toccherebbe la testa e i capelli. Se l'incantatore usa questo incantesimo per apparire più magro rispetto alla realtà, quando qualcuno tenta di toccarlo incontrerebbe il suo corpo mentre la mano è ancora apparentemente a mezz'aria. Per capire che l'incantatore è camuffato, una creatura può usare la sua azione per ispezionarne l'aspetto e deve superare una prova di Intelligenza (Indagare) contro la CD del tiro salvezza sull'incantesimo.
