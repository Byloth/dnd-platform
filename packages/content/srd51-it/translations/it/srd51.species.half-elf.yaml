name: "Mezzelfo"
text: |-
  Un personaggio mezzelfo possiede alcune qualità in comune con gli elfi e altre uniche dei mezzelfi.
features.0.name: "Incremento dei punteggi di caratteristica"
features.0.text: |-
  Il punteggio di Carisma di un mezzelfo aumenta di 2 e altri due punteggi di caratteristica a scelta aumentano di 1.
features.1.name: "Velocità"
features.1.text: |-
  La velocità base sul terreno di un mezzelfo è di 9 metri.
features.2.name: "Scurovisione"
features.2.text: |-
  Grazie al suo sangue elfico, un mezzelfo beneficia di una vista superiore nell'oscurità e nelle condizioni di luce fioca. In condizioni di luce fioca, può vedere fino a una distanza di 18 metri come se si trovasse in condizioni di luce intensa e nell'oscurità come se si trovasse in presenza di luce fioca. Nell'oscurità non è in grado di discernere i colori, ma solo le tonalità di grigio.
features.3.name: "Età"
features.3.text: |-
  I mezzelfi crescono agli stessi ritmi degli umani e raggiungono l'età adulta attorno ai 20 anni. Vivono comunque molto più a lungo degli umani e spesso superano i 180 anni.
features.4.name: "Allineamento"
features.4.text: |-
  I mezzelfi condividono la propensione al caos insita nel loro retaggio elfico. Rispettano sia la libertà personale che l'espressione creativa, non amano troppo le figure autoritarie e non desiderano avere seguaci. Sono infastiditi dalle regole, non sopportano le pretese altrui e spesso si dimostrano inaffidabili o nel migliore dei casi imprevedibili.
features.5.name: "Taglia"
features.5.text: |-
  Un mezzelfo ha all'incirca le stesse dimensioni di un umano e la sua altezza può variare da 1,5 a 1,8 metri. È di taglia Media.
features.6.name: "Linguaggi"
features.6.text: |-
  Un mezzelfo può parlare, leggere e scrivere in Comune, in Elfico e in un linguaggio extra a sua scelta.
features.7.name: "Retaggio fatato"
features.7.text: |-
  Un mezzelfo dispone di vantaggio ai tiri salvezza per non essere affascinato e non può essere addormentato tramite la magia.
features.7.effects.1.note: |-
  La magia non può farti addormentare: il sonno non è una condizione dell'elenco, quindi qui si usa l'id descrittivo magical-sleep.
features.8.name: "Versatilità nelle abilità"
features.8.text: |-
  Un mezzelfo ha competenza in due abilità a sua scelta.
