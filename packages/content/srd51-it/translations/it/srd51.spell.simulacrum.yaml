name: Simulacro
components.m: Una quantità di neve o ghiaccio sufficiente per realizzare una copia a grandezza naturale della creatura da duplicare; una ciocca di capelli, un'unghia tagliata o un altro pezzo del corpo di quella creatura da collocare in mezzo alla neve o al ghiaccio; polvere di rubino del valore di 1.500 mo da cospargere sul duplicato, che l'incantesimo consuma.
text: |-
  L'incantatore realizza un duplicato illusorio di una bestia o un umanoide che deve rimanere entro gittata per l'intero tempo di lancio dell'incantesimo. Il duplicato è una creatura parzialmente reale fatta di ghiaccio o di neve, che può effettuare azioni ed essere influenzata come una creatura normale. Ha lo stesso aspetto dell'originale, ma possiede la metà dei suoi punti ferita massimi ed è creata senza equipaggiamento. Sotto ogni altro aspetto, l'illusione usa tutte le statistiche della creatura che duplica. Il simulacro è amichevole nei confronti dell'incantatore e delle creature da lui indicate. Obbedisce ai comandi vocali dell'incantatore, muovendosi e agendo in ottemperanza ai suoi desideri, nonché agendo in combattimento nel suo turno. Il simulacro non è in grado di apprendere o di diventare più potente, quindi non aumenta mai di livello, come non lo fanno le altre capacità, e non può recuperare gli slot incantesimo spesi. Se il simulacro subisce danni, l'incantatore può ripararlo in un laboratorio alchemico, usando erbe e minerali rari del valore di 100 mo per punto ferita recuperato. Il simulacro permane finché non scende a 0 punti ferita, nel qual caso si ritrasforma in neve e si scioglie istantaneamente. Se l'incantatore lancia di nuovo questo incantesimo, il duplicato attualmente attivo da lui creato viene istantaneamente distrutto.
effects.0.text: |-
  Un duplicato illusorio di una bestia o di un umanoide con tutte le sue statistiche, ma con la metà dei suoi punti ferita massimi e senza equipaggiamento; è amichevole nei tuoi confronti, obbedisce ai tuoi comandi vocali e agisce nel tuo turno. Non aumenta mai di livello né migliora le sue capacità e non può recuperare gli slot incantesimo; i danni si riparano solo in un laboratorio alchemico, al costo di 100 mo per punto ferita. Si scioglie a 0 punti ferita e lanciare di nuovo l'incantesimo lo distrugge.
effects.0.note: "Nessun blocco di statistiche nella v0: le statistiche della creatura duplicata vanno registrate a mano."
