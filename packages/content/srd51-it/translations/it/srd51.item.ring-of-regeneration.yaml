features.0.effects.0.text: |-
  Recuperi 1d6 punti ferita ogni 10 minuti, purché tu abbia almeno 1 punto ferita. Una parte del corpo perduta ricresce dopo 1d6 + 1 giorni, se hai almeno 1 punto ferita per tutto questo periodo.
features.0.effects.0.note: La guarigione periodica al di fuori dei riposi non ha un tipo nel catalogo.
