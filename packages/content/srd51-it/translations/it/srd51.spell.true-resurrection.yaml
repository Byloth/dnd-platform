name: Resurrezione pura
components.m: Uno spruzzo di acqua santa e diamanti del valore di almeno 25.000 mo, che l'incantesimo consuma.
text: |-
  L'incantatore tocca una creatura morta da non più di 200 anni a causa di un qualsiasi motivo fuorché la vecchiaia. Se la sua anima è libera e consenziente, essa torna in vita con tutti i suoi punti ferita. Questo incantesimo chiude tutte le ferite, neutralizza ogni veleno, cura tutte le malattie e annulla ogni maledizione che affliggeva la creatura al momento della morte. Inoltre, ripristina gli eventuali organi e arti danneggiati o mancanti. L'incantesimo può perfino fornire al bersaglio un nuovo corpo se l'originale non esiste più, nel qual caso l'incantatore deve pronunciare il nome della creatura, che appare in uno spazio libero a scelta dell'incantatore entro 3 metri da lui.
