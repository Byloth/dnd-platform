name: Scrutare
components.m: Un focus del valore di almeno 1.000 mo, come una sfera di cristallo, uno specchio d'argento o un bacile pieno di acqua santa.
text: |-
  L'incantatore può vedere e udire una particolare creatura a sua scelta situata sul suo stesso piano di esistenza. Il bersaglio deve effettuare un tiro salvezza su Saggezza, modificato dalla conoscenza e dal tipo di legame fisico che l'incantatore ha nei confronti della creatura. Se il bersaglio è consapevole che l'incantatore sta lanciando questo incantesimo, può fallire volontariamente il tiro salvezza se desidera essere osservato.

  **Conoscenza e modificatore al tiro salvezza** Indiretta (l'incantatore ha solo sentito parlare del bersaglio) +5 Diretta (l'incantatore ha incontrato il bersaglio) +0 Familiarità (l'incantatore conosce bene il bersaglio) -5 **Connessione e modificatore al tiro salvezza** Descrizione o immagine -2 Oggetto personale o abito -4 Parte del corpo, ciocca di capelli, pezzo di unghia, ecc. -10
  In caso di tiro salvezza superato, il bersaglio non viene influenzato dall'incantesimo, che l'incantatore non può usare contro di lui per 24 ore. Se lo fallisce, l'incantesimo crea un sensore invisibile entro 3 metri dal bersaglio, attraverso cui l'incantatore può vedere e sentire come se si trovasse sul posto. Il sensore si muove insieme al bersaglio, rimanendo entro 3 metri da esso per la durata dell'incantesimo. Una creatura che è in grado di vedere gli oggetti invisibili vede il sensore come una sfera luminosa grande quanto il pugno dell'incantatore. Anziché una creatura, l'incantatore può scegliere come bersaglio dell'incantesimo un luogo che abbia già visto in precedenza. Quando lo fa, il sensore appare in quel luogo e non si muove.
