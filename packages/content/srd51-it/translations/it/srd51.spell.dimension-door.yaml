name: Porta dimensionale
text: |-
  L'incantatore si teletrasporta dalla posizione in cui si trova a un altro punto entro gittata. L'incantatore arriva precisamente nel luogo desiderato, che può essere un punto che è in grado di vedere, che riesce a visualizzare o che è in grado di descrivere dichiarandone la distanza e la direzione, come per esempio "60 metri in linea retta verso il basso" o "verso nord-ovest, a un'angolazione ascendente di 45 gradi per 90 metri". L'incantatore può portare con sé degli oggetti il cui peso non superi quello che è in grado di trasportare. Può inoltre portare con sé una creatura consenziente di taglia pari o inferiore alla sua, che trasporti dell'attrezzatura il cui peso non superi la sua capacità di trasporto. Al momento del lancio dell'incantesimo, la creatura non deve trovarsi a più di 1,5 metri dall'incantatore. Se il luogo d'arrivo è già occupato da un oggetto o una creatura, l'incantatore e la creatura che viaggia con lui subiscono 4d6 danni da forza e l'incantesimo di teletrasporto fallisce.
