name: Costituzione
text: |-
  La Costituzione misura la salute, la resistenza fisica e l'energia vitale del personaggio.

  ## Prove di Costituzione

  Le prove di Costituzione sono rare: nessuna abilità viene applicata alle prove di Costituzione, in quanto la resistenza rappresentata da questa caratteristica è principalmente una dote passiva e non richiede uno sforzo specifico da parte di un personaggio o di un mostro. Una prova di Costituzione può tuttavia rappresentare il tentativo di un personaggio di spingersi oltre i propri limiti.

  Il GM potrebbe richiedere una prova di Costituzione anche quando un personaggio tenta di compiere imprese come:  - Trattenere il respiro - Marciare o svolgere lavori pesanti per ore senza riposare - Rinunciare a dormire - Sopravvivere senza cibo o acqua - Ingurgitare un intero boccale di birra in un sorso  ## Punti Ferita  
  Il modificatore di Costituzione di un personaggio contribuisce a determinare i suoi punti ferita. Solitamente un personaggio aggiunge il suo modificatore di Costituzione a ogni Dado Vita che tira per i suoi punti ferita.

  Se il modificatore di Costituzione di un personaggio cambia, anche il massimo dei suoi punti ferita cambia di conseguenza, come se il personaggio avesse posseduto il nuovo modificatore sin dal 1° livello. Per esempio, se un personaggio aumenta il suo punteggio di Costituzione quando arriva al 4° livello e il suo modificatore aumenta da +1 a +2, il suo massimo dei punti ferita viene regolato come se il modificatore fosse sempre stato +2. Quindi il personaggio aggiunge 3 punti ferita per i suoi primi tre livelli e poi tira per i suoi punti ferita del 4° livello usando il suo nuovo modificatore. Oppure, se un personaggio di 7° livello vede il suo punteggio di Costituzione abbassarsi in seguito a qualche effetto, riducendo il suo modificatore di Costituzione di 1, il suo massimo dei punti ferita si riduce di 7.
