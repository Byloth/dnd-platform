name: Crescita vegetale
text: "Questo incantesimo incanala vitalità nei vegetali di un'area specifica. Esistono due possibili usi dell'incantesimo, mirati a fornire benefici immediati o a lungo termine. Se l'incantatore lancia questo incantesimo usando 1 azione, sceglie un punto situato entro gittata: tutti i vegetali normali entro un raggio di 30 metri centrato su quel punto crescono rigogliosamente fino a formare un groviglio. Una creatura che si muove attraverso quell'area deve spendere 1,2 metri di movimento per ogni 30 cm di cui si muove. L'incantatore può escludere dall'influenza dell'incantesimo una o più aree di qualsiasi dimensione all'interno dell'area scelta. Se l'incantatore lancia questo incantesimo nell'arco di 8 ore, rende la terra fertile: tutti i vegetali entro un raggio di 750 metri centrato in un punto entro gittata cresceranno rigogliosamente per 1 anno e al momento del raccolto produrranno il doppio del cibo normale."
