name: Scopri il percorso
components.m: Una serie di strumenti da divinazione, come ossa, bastoncini d'avorio, carte, denti o incisioni runiche, del valore di 100 mo e un oggetto proveniente dal luogo che si desidera trovare.
text: |-
  Questo incantesimo permette all'incantatore di scoprire il percorso fisico più breve e diretto verso un determinato luogo fisso a lui noto e che si trova sullo stesso piano di esistenza. Se l'incantatore nomina una destinazione su un altro piano di esistenza, una destinazione in movimento (come una fortezza mobile) o una destinazione poco specifica (come "la tana di un drago verde"), l'incantesimo non ha effetto. Per tutta la durata dell'incantesimo, finché l'incantatore si trova sullo stesso piano di esistenza della destinazione, sa quanto è lontana e in che direzione si trova. Mentre viaggia per raggiungerla, quando gli si presentano più percorsi tra cui scegliere lungo il cammino, l'incantatore determina automaticamente il percorso più breve e diretto (ma non necessariamente il più sicuro) che lo porterà a destinazione.
