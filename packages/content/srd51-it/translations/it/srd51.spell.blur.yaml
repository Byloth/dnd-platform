name: Sfocatura
text: |-
  Il corpo dell'incantatore diventa sfocato, instabile e ondeggiante agli occhi di chiunque sia in grado di vederlo. Per la durata dell'incantesimo, tutte le creature subiscono svantaggio ai tiri per colpire contro l'incantatore. Un attaccante è immune a questo effetto se non si affida alla vista naturale, per esempio se è dotato di vista cieca o se è in grado di vedere attraverso le illusioni, come nel caso di vista pura.
effects.0.text: |-
  Tutte le creature subiscono svantaggio ai tiri per colpire contro di te, tranne quelle che non si affidano alla vista (come nel caso di vista cieca) o sono in grado di vedere attraverso le illusioni (come nel caso di vista pura).
effects.0.note: |-
  Lo svantaggio agli attacchi effettuati contro il personaggio non è esprimibile in v0.
