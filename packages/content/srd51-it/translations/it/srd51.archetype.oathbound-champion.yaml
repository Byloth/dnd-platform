name: Campione del giuramento
pitch: Un cavaliere sacro in armatura scintillante che protegge i deboli, punisce il male e guarisce con un tocco.
why.class: "I paladini uniscono armatura pesante, attacchi potenti e guarigione: perdonano gli errori e sono utili in ogni combattimento."
why.species: Un dragonide aumenta la Forza e il Carisma, i due punteggi che servono a un paladino, e soffia fuoco (discendenza draconica del drago d'oro).
why.abilityPriority: La Forza guida i tuoi attacchi e la tua armatura pesante; il Carisma alimenta i tuoi incantesimi e, più avanti, la tua aura; la Costituzione ti dà punti ferita.
why.background: Accolito, l'unico background dell'SRD, ti dà le abilità Intuizione e Religione e due linguaggi.
