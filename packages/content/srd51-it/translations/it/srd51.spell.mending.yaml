name: Riparare
components.m: Due calamite.
text: Questo incantesimo ripara una singola crepa o uno squarcio in un oggetto toccato dall'incantatore, come l'anello spezzato di una catena, due metà di una chiave spezzata, un mantello strappato o un otre forato. Se le dimensioni della crepa o dello squarcio non superano i 30 cm, l'incantatore ripara l'oggetto senza lasciare traccia del danno precedente. Questo incantesimo può riparare un oggetto magico o un costrutto solo fisicamente, senza ripristinare la magia in esso contenuta.
