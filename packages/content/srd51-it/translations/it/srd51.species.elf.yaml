name: "Elfo"
text: |-
  Un personaggio elfo è dotato di una vasta gamma di capacità naturali, affinate dal suo popolo nel corso di interi millenni.
features.0.name: "Incremento dei punteggi di caratteristica"
features.0.text: |-
  Il punteggio di Destrezza di un elfo aumenta di 2.
features.1.name: "Velocità"
features.1.text: |-
  La velocità base sul terreno di un elfo è di 9 metri.
features.2.name: "Scurovisione"
features.2.text: |-
  Un elfo, abituato a muoversi nella penombra del sottobosco e alla luce della luna, beneficia di una vista superiore nell'oscurità e nelle condizioni di luce fioca. In condizioni di luce fioca, può vedere fino a una distanza di 18 metri come se si trovasse in condizioni di luce intensa e nell'oscurità come se si trovasse in presenza di luce fioca. Nell'oscurità non è in grado di discernere i colori, ma solo le tonalità di grigio.
features.3.name: "Età"
features.3.text: |-
  Anche se gli elfi raggiungono la maturità fisica più o meno alla stessa età degli umani, la visione elfica della maturità trascende l'aspetto puramente biologico e comprende un'esperienza più ampia del mondo. Gli elfi generalmente si dichiarano adulti e assumono il loro nome da adulto intorno all'età di 100 anni e possono vivere fino a 750 anni.
features.4.name: "Allineamento"
features.4.text: |-
  Gli elfi amano la libertà, la varietà e l'espressione individuale, cosa che li avvicina agli aspetti più positivi del caos. Apprezzano e proteggono la libertà degli altri quanto la propria e per buona parte tendono al bene piuttosto che al male.
features.5.name: "Taglia"
features.5.text: |-
  Un elfo ha un'altezza che va da poco meno di 1,5 a poco più di 1,8 metri e una corporatura snella. È di taglia Media.
features.6.name: "Linguaggi"
features.6.text: |-
  Gli elfi sanno parlare, leggere e scrivere in Comune e in Elfico. L'Elfico è una lingua fluida, dalle tonalità sottili e dalla grammatica complessa. La letteratura elfica è ricca e variegata: i loro canti e i loro poemi sono celebri anche presso le altre razze. Molti bardi imparano la lingua degli elfi per poter aggiungere le ballate elfiche al proprio repertorio.
features.7.name: "Sensi acuti"
features.7.text: |-
  Un elfo ha competenza nell'abilità Percezione.
features.8.name: "Retaggio fatato"
features.8.text: |-
  Un elfo dispone di vantaggio ai tiri salvezza per non essere affascinato e non può essere addormentato tramite la magia.
features.8.effects.1.note: |-
  La magia non può farti addormentare: il sonno non è una condizione dell'elenco, quindi qui si usa l'id descrittivo magical-sleep.
features.9.name: "Trance"
features.9.text: |-
  Gli elfi non hanno bisogno di dormire. Anziché dormire entrano per 4 ore al giorno in una profonda meditazione e in uno stato semicosciente. (Il termine in Comune per tale meditazione è "trance".) Durante questa meditazione, l'elfo entra in una sorta di stato sognante, che in realtà non è altro che una serie di esercizi mentali che anni di pratica hanno reso automatici. Dopo tale periodo, l'elfo ottiene gli stessi benefici di 8 ore di sonno per un umano.
features.9.effects.0.text: |-
  Non hai bisogno di dormire; entrare in una profonda meditazione per 4 ore al giorno ti conferisce gli stessi benefici che un umano ottiene da 8 ore di sonno.
features.9.effects.0.note: |-
  Variante della regola del riposo; il motore non rappresenta il sonno né la durata del riposo lungo.
subspecies.0.name: "Elfo alto"
subspecies.0.text: |-
  Un elfo alto è dotato di una mente brillante e della padronanza di alcune forme basilari di magia. In molti mondi fantasy esistono due tipologie di elfi alti. Uno, che si considera superiore alle altre razze e anche agli altri elfi, è altezzoso e si tiene a distanza da tutti gli altri. L'altro tipo è più diffuso e più amichevole, e i suoi membri si mescolano più facilmente agli umani e alle altre razze.
subspecies.0.features.0.name: "Incremento dei punteggi di caratteristica"
subspecies.0.features.0.text: |-
  Il punteggio di Intelligenza di un elfo alto aumenta di 1.
subspecies.0.features.1.name: "Addestramento nelle armi elfiche"
subspecies.0.features.1.text: |-
  Un elfo alto ha competenza nelle spade corte, nelle spade lunghe, negli archi corti e negli archi lunghi.
subspecies.0.features.2.name: "Trucchetto"
subspecies.0.features.2.text: |-
  Un elfo alto conosce un trucchetto scelto dalla lista degli incantesimi da mago. La caratteristica da incantatore per questo trucchetto è Intelligenza.
subspecies.0.features.2.effects.0.note: |-
  Intelligenza è la tua caratteristica da incantatore per questo trucchetto: la scelta non può indicare una caratteristica, quindi è specificata qui.
subspecies.0.features.3.name: "Linguaggio extra"
subspecies.0.features.3.text: |-
  Un elfo alto sa parlare, leggere e scrivere un linguaggio extra a sua scelta.
