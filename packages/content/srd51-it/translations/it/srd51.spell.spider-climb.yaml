name: Movimenti del ragno
components.m: Una goccia di bitume e un ragno.
text: |-
  Fino al termine dell'incantesimo, una creatura consenziente toccata dall'incantatore ottiene la capacità di muoversi verticalmente e orizzontalmente sulle pareti e a testa in giù sui soffitti, mantenendo le mani libere. Il bersaglio ottiene inoltre una velocità di scalare pari alla sua velocità base sul terreno.
effects.0.text: |-
  Velocità di scalare pari alla sua velocità base sul terreno; può muoversi verticalmente e orizzontalmente sulle pareti e a testa in giù sui soffitti, mantenendo le mani libere.
effects.0.note: "speed.climb non può essere resa pari alla velocità base sul terreno: le formule della v0 non hanno una variabile per la velocità."
