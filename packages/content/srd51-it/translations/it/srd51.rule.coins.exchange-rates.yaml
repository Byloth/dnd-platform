name: "Valori di scambio"
text: |-
  | Moneta        | MR    | MA   | ME   | MO    | MP      |
  |---------------|-------|------|------|-------|---------|
  | Rame (mr)     | 1     | 1/10 | 1/50 | 1/100 | 1/1.000 |
  | Argento (ma)  | 10    | 1    | 1/5  | 1/10  | 1/100   |
  | Electrum (me) | 50    | 5    | 1    | 1/2   | 1/20    |
  | Oro (mo)      | 100   | 10   | 2    | 1     | 1/10    |
  | Platino (mp)  | 1.000 | 100  | 20   | 10    | 1       |
