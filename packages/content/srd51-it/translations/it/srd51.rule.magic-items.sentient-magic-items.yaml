name: "Oggetti magici senzienti"
text: |-
  Alcuni oggetti magici sono dotati di mente e personalità proprie. Gli oggetti di questo tipo potrebbero essere posseduti, infestati dagli spiriti di un precedente proprietario oppure potrebbero essere senzienti grazie alla magia usata nella loro creazione. In ogni caso, un oggetto di questo tipo si comporta come un personaggio, con tanto di peculiarità, ideali, legami e a volte difetti. Un oggetto senziente potrebbe essere per il suo possessore un prezioso alleato o una costante spina nel fianco.

  La maggior parte degli oggetti senzienti è un'arma. Altri tipi di oggetto possono manifestare una volontà propria, ma quelli consumabili, come le pozioni e le pergamene, non sono mai senzienti.

  Gli oggetti magici senzienti funzionano come PNG sotto il controllo del GM. Ogni proprietà attivata dell'oggetto è sotto il controllo dell'oggetto stesso e non del suo possessore. Fintantoché il possessore mantiene un buon rapporto con l'oggetto, può accedere a tali proprietà normalmente. Se il rapporto si fa teso, l'oggetto può sopprimere le sue proprietà attivate o perfino ritorcerle contro il possessore.
