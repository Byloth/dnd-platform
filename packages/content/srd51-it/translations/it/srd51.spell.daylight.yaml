name: Luce diurna
text: |-
  Una sfera di luce si espande in un raggio di 18 metri da un punto entro la gittata scelto dall'incantatore. La sfera emette luce intensa e poi luce fioca per ulteriori 18 metri. Se il punto scelto dall'incantatore si trova su un oggetto che lui stesso sta impugnando o che non è indossato o trasportato da nessuno, la luce si diffonde dall'oggetto e si muove assieme a esso. Coprire completamente l'oggetto interessato con un oggetto opaco, come una scodella o un elmo, blocca la luce. Se una parte dell'area di questo incantesimo si sovrappone a un'area d'oscurità creata da un incantesimo di 3° livello o inferiore, l'incantesimo che ha creato l'oscurità viene dissolto.
