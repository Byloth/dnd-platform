name: "Flauto"
text: "Alcuni dei tipi più comuni di strumento musicale sono indicati nella tabella come esempi. Se un personaggio è competente in un determinato strumento musicale, può aggiungere il suo bonus di competenza alle prove di caratteristica che effettua per suonare con quello strumento. Un bardo può usare uno strumento musicale come focus da incantatore. Ogni tipo di strumento musicale richiede una competenza separata."
