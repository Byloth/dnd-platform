name: Caraffa dell'acqua eterna
text: |-
  Oggetto meraviglioso, non comune

  Quando si scuote quest'ampolla chiusa da un tappo di sughero, si sente uno sciabordio, come se contenesse dell'acqua. Quest'oggetto pesa 2,5 kg.

  Con un'azione, il personaggio può rimuovere il tappo e pronunciare una delle tre possibili parole d'ordine, nel qual caso dall'ampolla esce una certa quantità di acqua potabile o salata (a scelta del personaggio). L'acqua smette di uscire all'inizio del turno successivo del personaggio. Scegli tra una delle seguenti opzioni:

  "Ruscello" produce 4 litri d'acqua.

  "Fontana" produce 20 litri d'acqua.

  "Geyser" produce 120 litri d'acqua che scaturiscono in un getto lungo 9 metri e largo 30 cm. Come azione bonus, mentre tiene in mano la caraffa, il personaggio può orientare il getto verso una creatura che è in grado di vedere situata entro 9 metri da lui. Il bersaglio deve superare un tiro salvezza su Forza con CD 13, altrimenti subisce 1d4 danni contundenti e cade a terra prono. In alternativa, il personaggio può dirigere il getto contro un oggetto che non sia indossato o trasportato e che non pesi più di 100 kg. L'oggetto viene rovesciato o spinto fino a 4,5 metri dal personaggio.
