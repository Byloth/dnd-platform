name: Charme su persone
text: |-
  L'incantatore tenta di affascinare un umanoide entro gittata che è in grado di vedere. L'umanoide deve effettuare un tiro salvezza su Saggezza e dispone di vantaggio se l'incantatore o i suoi compagni stanno combattendo contro di lui. Se lo fallisce, è affascinato dall'incantatore finché l'incantesimo non termina o finché l'incantatore o i suoi compagni non lo danneggiano in qualche modo. La creatura affascinata considera l'incantatore una figura conosciuta e amichevole. Quando l'incantesimo termina, la creatura capirà di essere stata affascinata dall'incantatore.
higherLevel: |-
  Quando l'incantatore lancia questo incantesimo usando uno slot incantesimo di 2° livello o superiore, può bersagliare una creatura aggiuntiva per ogni slot di livello superiore al 1°. Quando l'incantatore le bersaglia, le creature devono trovarsi a non più di 9 metri l'una dall'altra.
onCast.0.note: |-
  Se fallisce il tiro salvezza su Saggezza (effettuato con vantaggio se tu o i tuoi compagni state combattendo contro il bersaglio); termina se tu o i tuoi compagni lo danneggiate in qualche modo. Il bersaglio ti considera una figura conosciuta e amichevole e, quando l'incantesimo termina, capisce di essere stato affascinato. Una creatura aggiuntiva (entro 9 metri dalle altre) per ogni slot di livello superiore al 1°.
