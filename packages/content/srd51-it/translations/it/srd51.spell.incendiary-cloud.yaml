name: Nube incendiaria
text: |-
  Una nube turbinante di fumo mista a tizzoni ardenti appare in una sfera del raggio di 6 metri centrata su un punto entro gittata. La nube si estende intorno agli angoli, è pesantemente oscurata e permane per la durata dell'incantesimo o finché un vento di velocità moderata o superiore (almeno 15 km orari) non la disperde. Quando appare la nube, ogni creatura al suo interno deve effettuare un tiro salvezza su Destrezza, subendo 10d8 danni da fuoco in caso di fallimento, o la metà dei danni in caso di successo. Inoltre, una creatura deve superare tale tiro salvezza anche quando entra nell'area dell'incantesimo per la prima volta in un turno o termina il suo turno qui. La nube si allontana di 3 metri dall'incantatore in una direzione scelta da quest'ultimo all'inizio di ogni suo turno.
