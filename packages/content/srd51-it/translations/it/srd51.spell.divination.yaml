name: Divinazione
components.m: Incenso e un'offerta sacrificale appropriata alla religione dell'incantatore del valore complessivo di almeno 25 mo, che l'incantesimo consuma.
text: |-
  La magia e l'offerta mettono in contatto l'incantatore con una divinità o con un servitore della divinità. L'incantatore pone una sola domanda relativa a uno specifico obiettivo, evento o attività che si verificherà entro 7 giorni. Il GM fornisce una risposta onesta, che può essere una breve frase, una rima enigmatica o un presagio. L'incantesimo non prende in considerazione le potenziali circostanze che potrebbero alterare l'esito del presagio, come per esempio il lancio di incantesimi aggiuntivi o la perdita o l'acquisizione di un compagno. Se l'incantatore lancia l'incantesimo due o più volte prima di completare il suo riposo lungo successivo, esiste una probabilità cumulativa del 25% di ottenere un responso casuale per ogni lancio dopo il primo. Il GM effettua questo tiro in segreto.
