name: Scrigno segreto
components.m: Un forziere di fattura pregiata che misura 90 × 60 × 60 cm, realizzato con materiali rari del valore di almeno 5.000 mo, e una riproduzione minuscola fatta degli stessi materiali del valore di almeno 50 mo.
text: |-
  L'incantatore nasconde uno scrigno e tutti i suoi contenuti sul Piano Etereo. Per farlo, deve toccare il forziere e la riproduzione in miniatura che funge da componente materiale dell'incantesimo. Il forziere può contenere fino a 12 cubi con spigolo di 30 cm di materiale non vivente (90 × 60 × 60 cm). Finché il forziere rimane sul Piano Etereo, l'incantatore può usare un'azione e toccare la riproduzione per richiamare a sé lo scrigno, che appare a terra in uno spazio libero entro 1,5 metri da lui. Con un'azione, l'incantatore può inviarlo nuovamente sul Piano Etereo toccando sia il forziere che la replica. Dopo 60 giorni, esiste una probabilità cumulativa del 5% al giorno che l'effetto dell'incantesimo termini. Inoltre, esso termina se l'incantatore lancia nuovamente l'incantesimo, se la riproduzione più piccola del forziere viene distrutta o se l'incantatore sceglie di terminare l'incantesimo con un'azione. Se il forziere più grande si trova sul Piano Etereo quando l'incantesimo termina, è perduto irrimediabilmente.
