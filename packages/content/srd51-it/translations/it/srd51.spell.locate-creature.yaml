name: Localizza creatura
components.m: Un ciuffo di peli di un segugio.
text: L'incantatore descrive o nomina una creatura a lui familiare, percependo la direzione della sua ubicazione, purché si trovi entro 300 metri da lui. Se la creatura è in movimento, l'incantatore apprende verso quale direzione si sta dirigendo. L'incantesimo può localizzare una creatura specifica nota all'incantatore o una creatura di un tipo specifico più vicina (come un umano o un unicorno), purché l'incantatore abbia visto tale creatura da vicino (entro 9 metri) almeno una volta. Se la creatura descritta o nominata ha una forma diversa, per esempio se si trova sotto l'effetto di un incantesimo metamorfosi, questo incantesimo non riesce a localizzarla. Inoltre, questo incantesimo non può localizzare una creatura se un corso d'acqua largo almeno 3 metri blocca il percorso diretto tra essa e l'incantatore.
