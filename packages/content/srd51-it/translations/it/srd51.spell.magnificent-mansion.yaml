name: Reggia meravigliosa
components.m: Un portale in miniatura scolpito in avorio, un frammento di marmo lucido, un cucchiaino d'argento, del valore di almeno 5 mo ciascuno.
text: L'incantatore evoca entro gittata una dimora extradimensionale che permane per la durata dell'incantesimo. Sceglie inoltre l'ubicazione della sua entrata, che risplende di un debole bagliore ed è larga 1,5 metri e alta 3 metri. L'incantatore e una qualsiasi creatura da lui scelta al momento del lancio possono entrare nella dimora extradimensionale fintantoché il portale rimane aperto. L'incantatore può aprire o chiudere il portale se si trova entro 9 metri da esso; quando è chiuso, il portale è invisibile. Oltre il portale si trova un atrio sfarzoso su cui si aprono numerose stanze. L'atmosfera è pulita, fresca e accogliente. L'incantatore può definire la planimetria della dimora, ma lo spazio non può superare la grandezza di 50 cubi, ciascuno con lato di 3 metri. Inoltre, la dimora è ammobiliata e decorata come l'incantatore preferisce e contiene cibo a sufficienza per servire un banchetto di nove portate per un massimo di 100 persone. A provvedere a ogni bisogno degli ospiti è presente una schiera di 100 servitori semitrasparenti, il cui aspetto e abbigliamento è deciso dall'incantatore, ai cui ordini sono totalmente ubbidienti. Ogni servitore può eseguire qualsiasi compito allo stesso modo di un servitore umano, ma non può attaccare o effettuare azioni che ferirebbero in modo diretto un'altra creatura. I servitori possono perciò trasportare oggetti, pulire, riparare, piegare abiti, accendere fuochi, servire cibo, versare vino e così via. Possono inoltre spostarsi ovunque nell'edificio, ma non possono uscirne. Arredi e altri oggetti creati da questo incantesimo si dissolvono in fumo quando vengono rimossi dalla dimora. Al termine dell'incantesimo, tutte le creature all'interno dello spazio extradimensionale vengono espulse negli spazi aperti più vicini all'entrata.
