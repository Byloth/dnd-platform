name: Ragnatela
components.m: Un frammento di ragnatela comune.
text: |-
  L'incantatore evoca una massa di spessi e viscosi filamenti di ragnatela in un punto a sua scelta situato entro gittata. A partire da quel punto, le ragnatele riempiono un cubo con spigolo di 6 metri per la durata dell'incantesimo. Le ragnatele sono terreno difficile e la loro area è considerata leggermente oscurata. Se le ragnatele non sono ancorate tra due masse solide (per esempio pareti o alberi) o stese su un pavimento, un muro o un soffitto, collassano su se stesse e l'incantesimo termina all'inizio del turno successivo dell'incantatore. Le ragnatele stese su una superficie piatta hanno una profondità di 1,5 metri. Ogni creatura che inizia il suo turno nelle ragnatele o che vi entra durante il proprio turno deve effettuare un tiro salvezza su Destrezza. Se lo fallisce, la creatura è trattenuta fintanto che rimane tra le ragnatele o finché non si libera. Una creatura trattenuta dalle ragnatele può usare la sua azione per effettuare una prova di Forza contro la CD del tiro salvezza sull'incantesimo. Se ha successo, non è più trattenuta. Le ragnatele sono infiammabili. Un cubo di ragnatele di 1,5 metri esposto al fuoco brucia in 1 round, infliggendo 2d4 danni da fuoco a ogni creatura che inizi il suo turno tra le fiamme.
onCast.0.note: |-
  Una creatura che inizia il suo turno nelle ragnatele o vi entra durante il proprio turno, se fallisce il tiro salvezza su Destrezza; è trattenuta finché rimane tra le ragnatele o finché non si libera con un'azione superando una prova di Forza contro la CD del tiro salvezza sull'incantesimo.
onCast.1.text: |-
  Il cubo di ragnatele con spigolo di 6 metri è terreno difficile e leggermente oscurato; se non è ancorato tra due masse solide o steso su una superficie, collassa e l'incantesimo termina all'inizio del tuo turno successivo. Ogni cubo di 1,5 metri esposto al fuoco brucia in 1 round, infliggendo 2d4 danni da fuoco a una creatura che inizia il suo turno tra le fiamme.
