name: Attacchi in mischia
text: |-
  Un attacco in mischia, usato nei combattimenti corpo a corpo, consente a un personaggio di attaccare un nemico entro la sua portata. Un attacco in mischia solitamente prevede un'arma impugnata come una spada, un martello da guerra o un'ascia. Un mostro in genere effettua un attacco in mischia quando colpisce con i suoi artigli, tentacoli, zanne, corna o altre parti del corpo. Anche alcuni incantesimi prevedono un attacco in mischia.

  La maggior parte delle creature ha una **portata** di 1,5 metri e quindi può attaccare i bersagli entro 1,5 metri da sé quando effettua un attacco in mischia. Alcune creature (solitamente quelle di taglia superiore alla Media) possono effettuare attacchi in mischia con una portata superiore a 1,5 metri, come indicato nella loro descrizione.

  Invece di usare un'arma per effettuare un attacco in mischia, un personaggio può usare un **colpo senz'armi**: un pugno, un calcio, una testata o un altro colpo violento simile (nessuno dei quali conta come arma). Se un colpo senz'armi va a segno, infligge danni contundenti pari a 1 + il modificatore di Forza del personaggio. Un personaggio è competente nei colpi senz'armi.
