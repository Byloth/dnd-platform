name: "Pantheon norreno"
text: |-
  Là dove le distese collinari innevate precipitano nei fiordi ghiacciati sottostanti, dove le lunghe navi nordiche vengono issate sulla spiaggia e i ghiacciai avanzano ogni autunno per poi ritirarsi in primavera, si trova la terra dei Vichinghi, dimora del pantheon norreno. È una terra dal clima brutale, che impone ai propri abitanti una vita altrettanto dura. Per sopravvivere, i suoi guerrieri hanno imparato ad adattarsi alle condizioni più aspre, ma non si sono lasciati corrompere dalle imposizioni delle loro terre. Considerata la necessità di razziare per trovare cibo e ricchezze, è sorprendente che i mortali del nord siano in realtà un popolo di grande valore. I poteri delle loro divinità riflettono la necessità di questi guerrieri di avere una guida forte e decisa nell'azione. Di conseguenza, riconoscono i propri dèi in ogni ansa del fiume, in ogni rombo di tuono e scricchiolio dei ghiacciai e nell'odore del fumo di una casa lunga in fiamme.

  Il pantheon norreno è formato da due famiglie principali, gli Aesir (dèi della guerra e del destino) e i Vanir (dèi della fertilità e della prosperità). Le due famiglie, un tempo nemiche, ora sono strette alleate contro i loro nemici comuni, i giganti (come gli dèi Surtur e Thrym).
