name: "Modificare le creature"
text: |-
  Sebbene questo volume contenga una vasta e versatile raccolta di mostri, a volte si potrebbe sentire il bisogno di creare una creatura ad hoc per una parte dell'avventura. In tal caso è possibile ritoccarne una già esistente per renderla più conforme ai propri scopi, magari servendosi di uno o due tratti di un mostro diverso o usando una variante o un archetipo, come quelli contenuti in questo libro. È importante ricordare che quando si modifica un mostro, per esempio applicando un archetipo, il suo grado di sfida potrebbe variare.
