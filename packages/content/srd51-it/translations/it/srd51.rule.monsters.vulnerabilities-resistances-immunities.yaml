name: "Vulnerabilità, resistenze e immunità"
text: |-
  Alcune creature sono dotate di vulnerabilità, resistenza o immunità a certi tipi di danno. Alcune particolari creature possono perfino essere resistenti o immuni ai danni degli attacchi non magici (un attacco magico è un attacco sferrato tramite un incantesimo, un oggetto magico o un'altra fonte magica). Inoltre, alcune creature sono immuni a certe condizioni.
