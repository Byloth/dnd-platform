name: Età
text: |-
  La voce dell'età indica l'età in cui un membro della razza è considerato un adulto, così come la durata di vita prevista. Queste informazioni possono aiutarti a decidere quanti anni ha il tuo personaggio all'inizio del gioco. Puoi scegliere qualsiasi età per il tuo personaggio, il che potrebbe fornire una spiegazione per alcuni dei tuoi punteggi di caratteristica. Ad esempio, se interpreti un personaggio giovane o molto anziano, l'età potrebbe spiegare un punteggio di Forza o Costituzione particolarmente basso, oppure l'età avanzata potrebbe spiegare un'elevata Intelligenza o Saggezza.
