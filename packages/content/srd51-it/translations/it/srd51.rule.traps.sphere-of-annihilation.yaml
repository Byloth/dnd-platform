name: Sfera annientatrice
text: |-
  _Trappola magica_

  Un'oscurità magica e impenetrabile riempie la bocca spalancata di un volto di pietra scolpito sulla parete. La bocca ha un diametro di 60 cm ed è pressoché circolare, non emette alcun suono e nessuna luce può illuminarne l'interno; inoltre, qualsiasi materia vi finisca dentro viene istantaneamente annientata.

  Superare una prova di Intelligenza (Arcano) con CD 20 rivela che la bocca contiene una _sfera annientatrice_ impossibile da controllare o muovere. Sotto ogni altro aspetto è identica a una normale _sfera annientatrice_.

  Alcune versioni della trappola includono un ammaliamento posto sul volto di pietra, che genera in certe creature specifiche un impulso irresistibile ad avvicinarsi e a strisciare all'interno della bocca. Per il resto, questo effetto è simile all'aspetto _simpatia_ dell'incantesimo _antipatia/simpatia_. Un incantesimo _dissolvi magie_ (CD 18) lanciato con successo rimuove questo ammaliamento.
