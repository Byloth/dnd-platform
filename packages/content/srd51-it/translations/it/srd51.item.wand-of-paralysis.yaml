name: Bacchetta della paralisi
text: |-
  Bacchetta, rara (richiede sintonia con un incantatore)

  Questa bacchetta possiede 7 cariche. Mentre il personaggio la impugna, può usare un'azione per consumare 1 carica e lanciare dalla punta della bacchetta un sottile raggio blu contro una creatura che è in grado di vedere situata entro 18 metri da lui. Il bersaglio deve superare un tiro salvezza su Costituzione con CD 15, altrimenti rimane paralizzato per 1 minuto. Alla fine di ogni suo turno, la creatura può ripetere il tiro salvezza e, se lo supera, l'effetto svanisce.

  All'alba di ogni giorno, la bacchetta recupera 1d6 + 1 cariche consumate. Se il personaggio consuma l'ultima carica, deve tirare un d20: se ottiene 1, la bacchetta diventa cenere e viene distrutta.
attunement.by: un incantatore
features.0.name: Raggio paralizzante
features.0.effects.0.name: Raggio paralizzante
features.0.effects.0.text: |-
  Un sottile raggio blu parte dalla punta della bacchetta contro una creatura che sei in grado di vedere entro 18 metri. Il bersaglio deve superare un tiro salvezza su Costituzione con CD 15, altrimenti rimane paralizzato per 1 minuto; alla fine di ogni suo turno può ripetere il tiro salvezza e, se lo supera, l'effetto svanisce. Se consumi l'ultima carica, tira un d20: con un 1 la bacchetta diventa cenere e viene distrutta.
features.0.effects.0.onUse.0.note: Solo se fallisce il tiro salvezza su Costituzione con CD 15; il bersaglio ripete il tiro salvezza alla fine di ogni suo turno.
