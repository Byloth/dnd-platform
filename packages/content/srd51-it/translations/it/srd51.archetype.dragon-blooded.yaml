name: Sangue di drago
pitch: "Un incantatore con un drago in famiglia: la magia viene dal sangue, e così anche il fuoco."
why.class: "Gli stregoni conoscono pochi incantesimi e li lanciano spesso: meno scelte da fare, e più avanti la Metamagia rende ogni incantesimo più potente."
why.species: Un dragonide aumenta il Carisma e soffia fuoco; un antenato drago rosso si accorda con la Discendenza Draconica.
why.abilityPriority: Il Carisma alimenta i tuoi incantesimi; la Costituzione ti dà punti ferita e mantiene la tua concentrazione; la Destrezza ti protegge senza armatura.
why.subclass: La Discendenza Draconica ti dà una pelle più resistente (una Classe Armatura migliore) e più punti ferita, le due cose che mancano a un incantatore.
why.background: Accolito, l'unico background dell'SRD, ti dà le abilità Intuizione e Religione e due linguaggi.
