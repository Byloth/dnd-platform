name: "Bottiglia dell'efreeti"
text: |-
  Oggetto meraviglioso, molto raro

  Questa bottiglia di ottone dipinto pesa 0,5 kg. Quando il personaggio usa un'azione per rimuovere il tappo, dalla bottiglia si sprigiona una nube di fumo denso. Alla fine del turno del personaggio, il fumo scompare con un lampo di fuoco innocuo e in uno spazio libero entro 9 metri da lui compare un efreeti.

  La prima volta che la bottiglia viene aperta, il GM tira per determinare cosa accade.

  | d100 | Effetto |

  |---|---|

  | 01–10 | L'efreeti attacca il personaggio. Dopo avere combattuto per 5 round, l'efreeti scompare e la bottiglia perde la sua magia. |

  | 11–90 | L'efreeti serve il personaggio per 1 ora e obbedisce ai suoi comandi, poi torna nella bottiglia, che viene chiusa da un nuovo tappo che non può essere rimosso per 24 ore. Le due volte successive in cui la bottiglia viene aperta, si ottiene lo stesso effetto. Se la bottiglia viene aperta una quarta volta, l'efreeti fugge scomparendo e la bottiglia perde la sua magia. |

  | 91–100 | L'efreeti può lanciare tre volte l'incantesimo desiderio a beneficio del personaggio, poi scompare dopo aver concesso l'ultimo desiderio o dopo 1 ora, e la bottiglia perde la sua magia. |
