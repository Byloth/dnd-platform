features.0.effects.0.text: "Dalla bottiglia si sprigiona una nube di fumo denso. Alla fine del tuo turno, il fumo scompare con un lampo di fuoco innocuo e in uno spazio libero entro 9 metri da te compare un efreeti. La prima volta che la bottiglia viene aperta, il GM tira un d100: 01–10 l'efreeti ti attacca per 5 round e la bottiglia perde la sua magia; 11–90 l'efreeti ti serve per 1 ora, poi torna nella bottiglia (le due volte successive si ottiene lo stesso effetto, e alla quarta apertura l'efreeti fugge); 91–100 l'efreeti lancia tre volte desiderio a tuo beneficio, poi scompare e la bottiglia perde la sua magia."
