name: "Bonus di competenza"
text: |-
  Il bonus di competenza è sempre basato sul livello totale del personaggio, come indicato nella tabella "Avanzamento dei personaggi", e non sul suo livello in una particolare classe. Per esempio, se un personaggio è un guerriero 3/ladro 2, avrà il bonus di competenza di un personaggio di 5° livello, che è pari a +3.
