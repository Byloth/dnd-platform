name: Palla di fuoco ritardata
components.m: Una pallina di guano di pipistrello e zolfo.
text: |-
  Un raggio di luce gialla si sprigiona dal dito indice dell'incantatore per poi condensarsi in un punto a sua scelta entro gittata, formando una sfera scintillante che permane per la durata dell'incantesimo. Quando l'incantesimo termina per decisione dell'incantatore o perché la sua concentrazione viene interrotta, la sfera si disintegra con un cupo boato in un'esplosione di fiamme che si diffondono oltre gli angoli. Ogni creatura situata entro una sfera del raggio di 6 metri centrata su quel punto deve effettuare un tiro salvezza su Destrezza. In caso di fallimento, la creatura subisce una quantità di danni da fuoco pari al totale dei danni accumulati, o la metà dei danni in caso di successo. I danni base dell'incantesimo sono pari a 12d6 e se al termine del turno la sfera non è ancora esplosa, i danni aumentano di 1d6. Se una creatura tocca la sfera scintillante prima dello scadere dell'intervallo, deve effettuare un tiro salvezza su Destrezza. Se lo fallisce, l'incantesimo termina immediatamente, causando l'esplosione della sfera. In caso di successo, la creatura può lanciare la sfera fino a una distanza di 12 metri: quando colpisce una creatura o un oggetto solido, l'incantesimo termina e la sfera esplode. Il fuoco danneggia ogni oggetto presente nell'area e incendia gli oggetti infiammabili non indossati o trasportati.
higherLevel: |-
  Quando l'incantatore lancia questo incantesimo usando uno slot incantesimo di 8° livello o superiore, i danni di base aumentano di 1d6 per ogni slot di livello superiore al 7°.
