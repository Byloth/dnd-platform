name: Tocco gelido
text: |-
  L'incantatore crea una mano scheletrica e spettrale nello spazio di una creatura entro gittata ed effettua contro di lei un attacco a distanza con incantesimo, investendola con un flusso di gelo sepolcrale. Se il colpo va a segno, il bersaglio subisce 1d8 danni necrotici e non può recuperare punti ferita fino all'inizio del turno successivo dell'incantatore. Fino ad allora, la mano rimane avvinghiata al bersaglio. Se il bersaglio colpito è un non morto, subisce svantaggio ai tiri per colpire contro l'incantatore fino al termine del turno successivo di quest'ultimo.
higherLevel: |-
  I danni di questo incantesimo aumentano di 1d8 quando l'incantatore raggiunge il 5° livello (2d8), l'11° livello (3d8) e il 17° livello (4d8).
effects.0.text: |-
  Non può recuperare punti ferita fino all'inizio del turno successivo dell'incantatore.
effects.0.note: |-
  Impedire la guarigione non è esprimibile in v0.
effects.1.note: |-
  Solo bersagli non morti, fino al termine del turno successivo dell'incantatore.
