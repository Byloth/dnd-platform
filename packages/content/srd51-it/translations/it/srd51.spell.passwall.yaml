name: Passapareti
components.m: Un pizzico di semi di sesamo.
text: L'incantatore sceglie un punto entro gittata e che è in grado di vedere su una superficie di legno, pietra o intonaco (come una parete, un soffitto o un pavimento), dove si apre un passaggio che permane per la durata dell'incantesimo. L'incantatore sceglie inoltre le dimensioni dell'apertura, che non possono superare una larghezza di 1,5 metri, un'altezza di 2,4 metri e una profondità di 6 metri. Il passaggio non crea alcuna instabilità nella struttura che lo circonda. Quando l'apertura scompare, qualsiasi creatura o oggetto all'interno del passaggio creato dall'incantesimo viene espulso senza subire danni nello spazio libero più vicino alla superficie su cui l'incantesimo è stato lanciato.
