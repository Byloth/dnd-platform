name: Anello delle stelle cadenti
text: |-
  Anello, molto raro (richiede sintonia in un luogo esterno di notte)

  Finché il personaggio indossa questo anello e si trova in un'area di luce fioca o oscurità, può lanciare con esso gli incantesimi *luci danzanti* e *luce* a volontà. Ognuno di questi incantesimi richiede un'azione per essere lanciato.

  L'anello possiede 6 cariche per le altre proprietà, descritte di seguito. All'alba di ogni giorno, l'anello recupera 1d6 cariche consumate.

  ***Luminescenza.*** Il personaggio può usare un'azione per consumare 1 carica e lanciare l'incantesimo *luminescenza* con l'anello.

  ***Sfera di fulmini.*** Il personaggio può consumare 2 cariche usando un'azione per creare da una a quattro sfere di fulmini del diametro di 90 cm. Maggiore è il numero delle sfere create, minore è la potenza di ogni singola sfera.

  Ogni sfera compare in uno spazio libero che il personaggio è in grado di vedere entro 36 metri da lui, e dura finché il personaggio si concentra (come se si concentrasse su un incantesimo), fino a un massimo di 1 minuto. Ogni sfera emana luce fioca in un raggio di 9 metri.

  Come azione bonus, il personaggio può muovere ogni sfera fino a 9 metri, ma mai a più di 36 metri da sé. Quando una creatura che non sia il personaggio giunge entro 1,5 metri da una sfera, questa scarica un fulmine contro quella creatura e scompare. La creatura deve superare un tiro salvezza su Destrezza con CD 15, altrimenti subisce un ammontare di danni da fulmine dipendente dal numero delle sfere che il personaggio ha creato.

  | Sfere | Danni da fulmine |

  |---|---|

  | 4 | 2d4 |

  | 3 | 2d6 |

  | 2 | 5d4 |

  | 1 | 4d12 |

  ***Stelle cadenti.*** Il personaggio può consumare da 1 a 3 cariche usando un'azione. Per ogni carica consumata, il personaggio lancia dall'anello un frammento di luce scintillante verso un punto che è in grado di vedere situato entro 18 metri da lui. Ogni creatura che si trova all'interno di un cubo con spigolo di 4,5 metri originato da quel punto viene inondata di scintille e deve effettuare un tiro salvezza su Destrezza con CD 15: subisce 5d4 danni da fuoco in caso di fallimento, o la metà dei danni in caso di successo.
features.0.name: Luci danzanti e luce
features.0.effects.0.note: A volontà mentre indossi l'anello in un'area di luce fioca o oscurità; ognuno dei due incantesimi richiede un'azione per essere lanciato con l'anello. La sintonia richiede di trovarsi in un luogo esterno di notte.
