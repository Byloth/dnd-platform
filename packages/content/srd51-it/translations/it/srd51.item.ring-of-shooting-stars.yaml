features.2.effects.0.name: Sfera di fulmini
features.2.effects.0.text: |-
  Crea da una a quattro sfere di fulmini del diametro di 90 cm in spazi liberi che sei in grado di vedere entro 36 metri. Come azione bonus, muovi ogni sfera fino a 9 metri (mai a più di 36 metri da te). Quando una creatura diversa da te giunge entro 1,5 metri da una sfera, questa si scarica e scompare: tiro salvezza su Destrezza con CD 15, altrimenti danni da fulmine in base al numero delle sfere.
features.2.effects.0.onUse.0.text: |-
  Danni da fulmine in caso di fallimento: 4 sfere 2d4, 3 sfere 2d6, 2 sfere 5d4, 1 sfera 4d12. Ogni sfera emana luce fioca in un raggio di 9 metri.
features.3.name: Stelle cadenti
features.3.effects.0.name: Stelle cadenti
features.3.effects.0.text: |-
  Consuma da 1 a 3 cariche. Per ogni carica, lancia un frammento di luce scintillante verso un punto che sei in grado di vedere entro 18 metri; ogni creatura all'interno di un cubo con spigolo di 4,5 metri originato da quel punto effettua un tiro salvezza su Destrezza con CD 15 e subisce 5d4 danni da fuoco in caso di fallimento, o la metà in caso di successo.
features.3.effects.0.note: Il costo è di 1 carica per frammento, fino a 3 frammenti per azione.
