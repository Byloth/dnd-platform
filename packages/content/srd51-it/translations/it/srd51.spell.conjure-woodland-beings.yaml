name: Evoca creature boschive
components.m: Una bacca di agrifoglio per ogni creatura evocata.
text: |-
  L'incantatore evoca creature fatate che appaiono in spazi liberi entro gittata che è in grado di vedere. Per determinare ciò che appare, l'incantatore sceglie una tra le opzioni seguenti:
  - Una creatura fatata con grado di sfida pari o inferiore a 2
  - Due creature fatate con grado di sfida pari o inferiore a 1
  - Quattro creature fatate con grado di sfida pari o inferiore a 1/2
  - Otto creature fatate con grado di sfida pari o inferiore a 1/4

  Una creatura evocata scompare quando scende a 0 punti ferita o al termine dell'incantesimo. Le creature evocate sono amichevoli nei confronti dell'incantatore e dei suoi compagni. Si tira per l'iniziativa delle creature evocate, che svolgono i propri turni come gruppo. Le creature obbediscono ai comandi verbali dell'incantatore (nessuna azione richiesta). Se l'incantatore non impartisce dei comandi, si difendono dalle creature ostili, ma non intraprendono altre azioni. Il GM possiede le statistiche delle creature.
higherLevel: |-
  Quando l'incantatore lancia questo incantesimo usando determinati slot incantesimo di livello superiore, sceglie una delle opzioni di evocazione elencate sopra e appaiono nuove creature: il doppio con uno slot di 6° livello e il triplo con uno slot di 8° livello.
effects.0.text: |-
  Le creature fatate evocate (una con grado di sfida pari o inferiore a 2, due con GS pari o inferiore a 1, quattro con GS pari o inferiore a 1/2 oppure otto con GS pari o inferiore a 1/4) sono amichevoli nei confronti dell'incantatore e dei suoi compagni, tirano l'iniziativa come gruppo e obbediscono ai suoi comandi verbali (nessuna azione richiesta); se non ricevono comandi, si limitano a difendersi. Una creatura scompare quando scende a 0 punti ferita o al termine dell'incantesimo.
onCast.0.text: |-
  Il GM possiede le statistiche delle creature (nessun blocco di statistiche nella v0). Il doppio delle creature con uno slot di 6° livello, il triplo con uno slot di 8° livello.
