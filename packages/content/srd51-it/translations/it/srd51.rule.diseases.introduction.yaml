name: Malattie
text: |-
  Un'epidemia devasta il regno e gli avventurieri devono partire alla ricerca di una cura. Un'avventuriera emerge da un'antica tomba, rimasta sigillata per secoli, e presto si ritrova afflitta da un male che la consuma lentamente. Un warlock offende una potenza oscura e contrae una strana malattia che si diffonde ogni volta che lancia un incantesimo.

  Un contagio limitato potrebbe incidere in minima parte sulle risorse del gruppo ed essere curato con un incantesimo _ristorare inferiore_. Un contagio su larga scala potrebbe porre le basi per una o più avventure in cui i personaggi vanno alla ricerca di una cura, arginano la diffusione della malattia e ne affrontano le conseguenze.

  Se una malattia non si limita a infettare alcuni membri del gruppo, è principalmente uno strumento narrativo. Le regole contribuiscono a descriverne gli effetti e il metodo con cui può essere curata, ma i dettagli del funzionamento di una malattia non sono vincolati da un insieme comune di regole. Le malattie possono colpire ogni creatura, e un determinato ceppo potrebbe o non potrebbe trasmettersi da una razza o da una specie di creatura all'altra. Un'epidemia potrebbe influenzare solo costrutti o non morti, oppure decimare un quartiere di halfling senza toccare nessun'altra razza. Ciò che conta è la storia che il GM desidera raccontare.
