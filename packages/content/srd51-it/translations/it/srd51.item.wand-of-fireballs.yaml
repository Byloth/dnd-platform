name: Bacchetta delle palle di fuoco
text: |-
  Bacchetta, rara (richiede sintonia con un incantatore)

  Questa bacchetta possiede 7 cariche. Mentre il personaggio la impugna, può usare un'azione per consumare 1 o più delle sue cariche e lanciare con essa l'incantesimo palla di fuoco (CD del tiro salvezza 15). Consumando 1 carica, il personaggio lancia la versione di 3° livello dell'incantesimo. Può aumentare il livello dello slot incantesimo di 1 per ogni carica aggiuntiva consumata.

  All'alba di ogni giorno, la bacchetta recupera 1d6 + 1 cariche consumate. Se il personaggio consuma l'ultima carica, deve tirare un d20: se ottiene 1, la bacchetta diventa cenere e viene distrutta.
attunement.by: un incantatore
features.0.name: Palla di fuoco
