name: Tunica dei colori scintillanti
text: |-
  Oggetto meraviglioso, molto raro (richiede sintonia)

  Questa tunica possiede 3 cariche e recupera 1d3 cariche consumate all'alba di ogni giorno. Finché il personaggio la indossa, può usare un'azione e consumare 1 carica per fare comparire sull'indumento un motivo rotante dai colori sgargianti, che permane fino alla fine del suo turno successivo. Durante questo periodo, la tunica emana luce intensa in un raggio di 9 metri e luce fioca per altri 9 metri. Le creature che possono vedere il personaggio subiscono svantaggio ai tiri per colpire effettuati contro di lui. Inoltre, ogni creatura che si trova dentro la luce intensa e che può vedere il personaggio quando la proprietà della tunica viene attivata deve superare un tiro salvezza su Saggezza con CD 15, altrimenti diventa stordita finché l'effetto non termina.
features.0.name: Colori scintillanti
features.0.effects.0.name: Colori scintillanti
features.0.effects.0.text: |-
  Sulla tunica compare un motivo rotante dai colori sgargianti fino alla fine del tuo turno successivo; emana luce intensa in un raggio di 9 metri e luce fioca per altri 9 metri. Le creature che possono vederti subiscono svantaggio ai tiri per colpire contro di te. Ogni creatura dentro la luce intensa che può vederti quando la proprietà viene attivata deve superare un tiro salvezza su Saggezza con CD 15, altrimenti rimane stordita finché l'effetto non termina.
features.0.effects.0.onUse.0.note: Solo le creature dentro la luce intensa che possono vederti e falliscono il tiro salvezza su Saggezza con CD 15.
features.0.effects.0.onUse.1.text: Finché i colori permangono, le creature che possono vederti subiscono svantaggio ai tiri per colpire contro di te.
