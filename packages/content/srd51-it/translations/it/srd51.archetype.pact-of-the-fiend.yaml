name: Patto con l'immondo
pitch: "Un incantatore che ha stretto un accordo con un immondo: pochi incantesimi, ma sempre pronti, e un patrono che vuole qualcosa in cambio."
why.class: I warlock hanno pochi slot incantesimo, che tornano dopo un riposo breve, e deflagrazione occulta è uno dei migliori trucchetti del gioco.
why.species: "Un tiefling aumenta il Carisma, resiste al fuoco e conosce un po' di magia infernale: la scelta naturale per un patto con un immondo."
why.abilityPriority: Il Carisma alimenta i tuoi incantesimi e la tua deflagrazione occulta; la Costituzione ti dà punti ferita; la Destrezza ti protegge in armatura leggera.
why.subclass: "L'Immondo ti dà punti ferita temporanei ogni volta che sconfiggi un nemico: ti tiene in combattimento."
why.background: Accolito, l'unico background dell'SRD, ti dà le abilità Intuizione e Religione e due linguaggi.
