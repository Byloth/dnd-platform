name: Anti-individuazione
components.m: Un pizzico di polvere di diamante del valore di 25 mo da spargere sul bersaglio, che l'incantesimo consuma.
text: Per la durata dell'incantesimo, l'incantatore nasconde alle magie di divinazione un bersaglio da lui toccato. Il bersaglio può essere una creatura consenziente, oppure un luogo o un oggetto non più grande di 3 metri in qualsiasi dimensione. Il bersaglio non può essere preso di mira da alcuna magia di divinazione né percepito da sensori di scrutamento magico.
