name: Scopri trappole
text: |-
  L'incantatore percepisce la presenza di qualsiasi trappola piazzata entro gittata e nel suo campo visivo. Ai fini di questo incantesimo, per trappola si intende qualsiasi cosa che infligga un effetto improvviso e inaspettato considerato dannoso o indesiderabile dall'incantatore e specificatamente realizzato a tali fini dal suo creatore. Pertanto, l'incantesimo è in grado di individuare un'area influenzata dall'incantesimo allarme, da un glifo di interdizione o in cui è presente una fossa meccanica nascosta, ma non di rivelare un cedimento naturale del pavimento, un soffitto instabile o una voragine nascosta. Questo incantesimo rivela semplicemente la presenza di una trappola. L'incantatore non scopre la posizione precisa, ma solo la natura generale del pericolo che pone.
