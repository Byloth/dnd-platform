name: "Ottenere ispirazione"
text: |-
  Il GM può decidere di impartire ispirazione a un personaggio per i motivi più disparati. Solitamente un GM concede ispirazione quando un giocatore impersona i suoi tratti caratteriali, accetta gli svantaggi presentati da un difetto o da un legame o in ogni caso quando interpreta il suo personaggio in modo convincente. Il GM comunica ai giocatori in che modo è possibile guadagnare ispirazione nel corso del gioco.

  L'ispirazione o si ha o non si ha: non è possibile accumulare più "ispirazioni" per usarle in seguito.
