name: Riposo inviolato
components.m: Un pizzico di sale e due monete di rame da posizionare sugli occhi del cadavere, che deve rimanere in quella posizione per la durata dell'incantesimo.
text: |-
  L'incantatore tocca un cadavere o altri resti: per la durata dell'incantesimo, il bersaglio è protetto dalla decomposizione e non può diventare un non morto. Inoltre, l'incantesimo estende il limite di tempo entro cui rianimare il bersaglio dalla morte, in quanto i giorni trascorsi sotto l'influenza di questo incantesimo non contano al fine di determinare il limite di tempo di incantesimi come rianimare morti.
