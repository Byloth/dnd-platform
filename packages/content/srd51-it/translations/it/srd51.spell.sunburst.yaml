name: Esplosione solare
components.m: Fuoco e un frammento di pietra del sole.
text: |-
  Una radiosa luce solare splende in un raggio di 18 metri, centrato su un punto entro gittata a scelta dell'incantatore. Ogni creatura toccata dalla luce deve effettuare un tiro salvezza su Costituzione. Se lo fallisce, subisce 12d6 danni radiosi e rimane accecata per 1 minuto. In caso di successo, subisce invece solo la metà dei danni e non viene accecata dall'incantesimo. Non morti e melme subiscono svantaggio a questo tiro salvezza. Una creatura accecata da questo incantesimo effettua un altro tiro salvezza su Costituzione al termine di ogni suo turno. In caso di successo, non è più accecata. Questo incantesimo dissolve qualsiasi oscurità creata da un incantesimo presente nell'area.
onCast.0.note: |-
  In caso di fallimento del tiro salvezza; non morti e melme subiscono svantaggio al tiro salvezza. Una creatura accecata ripete il tiro salvezza su Costituzione al termine di ogni suo turno e, in caso di successo, non è più accecata. L'incantesimo dissolve qualsiasi oscurità magica presente nella sua area.
