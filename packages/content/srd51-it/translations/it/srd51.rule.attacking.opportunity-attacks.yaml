name: Attacchi di opportunità
text: |-
  Tutti i partecipanti a un combattimento attendono costantemente l'occasione di colpire un nemico che fugge o gli passa accanto. Un colpo di questo tipo è definito attacco di opportunità.

  Un personaggio può effettuare un attacco di opportunità quando una creatura ostile che egli sia in grado di vedere, muovendosi, esce dalla sua portata. Il personaggio usa la sua reazione per effettuare l'attacco di opportunità, sferrando un attacco in mischia contro la creatura che lo ha provocato. L'attacco si verifica appena prima che la creatura esca dalla portata del personaggio.

  È possibile evitare di provocare un attacco di opportunità effettuando l'azione di Disimpegno. Inoltre, un personaggio non provoca un attacco di opportunità quando si teletrasporta o quando qualcuno o qualcosa lo muove senza che egli usi il proprio movimento, azione o reazione. Per esempio, non provoca un attacco di opportunità se un'esplosione lo scaraventa fuori dalla portata di un nemico o se la gravità lo fa cadere oltre un nemico.
