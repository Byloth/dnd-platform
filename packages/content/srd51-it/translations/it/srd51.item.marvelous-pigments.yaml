name: Pigmenti meravigliosi
text: |-
  Oggetto meraviglioso, molto raro

  Questi pigmenti, che solitamente si trovano in 1d4 vasetti custoditi all'interno di un'elegante scatola di legno insieme a un pennello (per un peso totale di 0,5 kg), consentono di creare oggetti tridimensionali dipingendoli in due dimensioni. La vernice fluisce dal pennello e forma l'oggetto desiderato mentre il personaggio si concentra sulla sua immagine.

  Ogni vasetto di pittura può coprire una superficie di 90 metri quadrati e consente al personaggio di creare oggetti inanimati o caratteristiche del terreno (porte, fosse, fiori, alberi, celle, stanze o armi) per un volume massimo pari a 10.000 cubi con spigolo di 30 cm. Per coprire un'area di 9 metri quadrati sono necessari 10 minuti di tempo.

  Dopo che il personaggio ha completato il dipinto, l'oggetto o l'elemento del terreno diventa un oggetto non magico reale. Di conseguenza, se il personaggio dipinge una porta su un muro, crea una vera porta che dà accesso a ciò che si trova dall'altra parte e, se dipinge una fossa sul pavimento, crea una fossa vera e propria la cui profondità conta al fine di determinare l'area totale di oggetti che il personaggio può creare.

  Nulla di ciò che viene creato tramite i pigmenti può avere un valore superiore a 25 mo. Se il personaggio dipinge un oggetto di valore superiore (come un diamante o una pila d'oro), tale oggetto appare autentico, ma un esame accurato rivela che è composto di pasta, di osso o di qualche altro materiale privo di valore.

  Se viene dipinta una forma di energia come il fuoco o il fulmine, l'energia compare, ma si dissipa non appena il personaggio finisce di dipingerla, senza infliggere alcun danno.
