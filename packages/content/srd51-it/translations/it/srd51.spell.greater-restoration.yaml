name: Ristorare superiore
components.m: Polvere di diamante del valore di almeno 100 mo, che l'incantesimo consuma.
text: |-
  L'incantatore infonde energia positiva in una creatura toccata per annullare un effetto debilitante. Può ridurre di uno il livello di indebolimento del bersaglio o porre fine a uno dei seguenti effetti su di esso:
  - Un effetto che ha affascinato o pietrificato il bersaglio
  - Una maledizione, inclusa la sintonia del bersaglio con un oggetto magico maledetto
  - Qualsiasi riduzione di un punteggio di caratteristica del bersaglio
  - Un effetto che riduce i punti ferita massimi del bersaglio
