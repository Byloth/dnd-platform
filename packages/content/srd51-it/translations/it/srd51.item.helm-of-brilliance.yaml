name: Elmo della luminosità
text: |-
  Oggetto meraviglioso, molto raro (richiede sintonia)

  In questo elmo scintillante sono stati incastonati 1d10 diamanti, 2d10 rubini, 3d10 opali di fuoco e 4d10 opali. Se staccate dall'elmo, le gemme diventano polvere. Quando tutte le gemme sono state rimosse o distrutte, l'elmo perde la sua magia.

  Finché il personaggio lo indossa, ottiene i benefici seguenti:

  Può usare un'azione per lanciare uno degli incantesimi seguenti (CD del tiro salvezza 18), usando una gemma del tipo specificato come componente: luce diurna (opale), muro di fuoco (rubino), palla di fuoco (opale di fuoco) o spruzzo prismatico (diamante). Non appena lanciato l'incantesimo, la gemma viene distrutta e scompare dall'elmo.

  Finché rimane incastonato almeno un diamante, l'elmo emana luce fioca in un raggio di 9 metri quando almeno un non morto si trova in quell'area. Ogni non morto che inizia il suo turno in quell'area subisce 1d6 danni radiosi.

  Finché rimane incastonato almeno un rubino, il personaggio ottiene resistenza ai danni da fuoco.

  Finché rimane incastonato almeno un opale di fuoco, il personaggio può usare un'azione per pronunciare una parola d'ordine e generare fiamme intorno a una delle armi che impugna. Le fiamme proiettano luce intensa in un raggio di 3 metri e luce fioca per altri 3 metri. Le fiamme non danneggiano né il personaggio, né l'arma. Quando il personaggio colpisce con un attacco sferrato con l'arma fiammeggiante, infligge al bersaglio 1d6 danni da fuoco extra. Le fiamme permangono finché il personaggio non usa un'azione bonus per pronunciare nuovamente la parola d'ordine, finché non lascia cadere l'arma o finché non la rinfodera.

  Il personaggio tira un d20 se indossa l'elmo e subisce danni da fuoco per avere fallito un tiro salvezza contro un incantesimo. Se ottiene come risultato 1, le gemme rimaste sull'elmo irradiano raggi di luce. Ogni creatura situata entro 18 metri dall'elmo, a eccezione del personaggio, deve superare un tiro salvezza su Destrezza con CD 17, altrimenti viene colpita da un raggio e subisce un ammontare di danni radiosi pari al numero di gemme rimaste sull'elmo. Subito dopo, sia l'elmo che le gemme vengono distrutti.
