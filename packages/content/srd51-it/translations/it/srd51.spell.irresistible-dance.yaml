name: Danza irresistibile
text: |-
  L'incantatore sceglie una creatura entro gittata che è in grado di vedere. Il bersaglio inizia a danzare comicamente sul posto, agitando le braccia, battendo i piedi e facendo capriole per la durata dell'incantesimo. Le creature che non possono essere affascinate sono immuni a questo incantesimo. Una creatura danzante deve usare tutti i suoi movimenti per ballare senza uscire dal suo spazio e subisce svantaggio ai tiri salvezza su Destrezza e ai tiri per colpire. Inoltre, mentre il bersaglio è influenzato dall'incantesimo, le altre creature dispongono di vantaggio ai tiri per colpire indirizzati contro di lui. Con un'azione, una creatura danzante effettua un tiro salvezza su Saggezza per riprendere il controllo di sé. In caso di successo, l'incantesimo termina.
effects.2.text: |-
  Deve usare tutto il suo movimento per ballare senza uscire dal suo spazio; le altre creature dispongono di vantaggio ai tiri per colpire contro di lei. Con un'azione, può effettuare un tiro salvezza su Saggezza per riprendere il controllo di sé: in caso di successo, l'incantesimo termina.
onCast.0.text: Nessun tiro salvezza al momento del lancio; le creature che non possono essere affascinate sono immuni.
