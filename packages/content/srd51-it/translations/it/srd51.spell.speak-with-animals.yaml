name: Parlare con gli animali
text: |-
  L'incantatore ottiene la capacità di comprendere le bestie e comunicare verbalmente con loro per la durata dell'incantesimo. Le conoscenze e la consapevolezza di molte bestie sono limitate alla loro intelligenza, ma quantomeno l'incantatore può apprendere da loro informazioni sui luoghi e sui mostri nelle vicinanze, o su ciò che esse sono in grado di percepire o hanno percepito nell'ultimo giorno. L'incantatore potrebbe anche persuadere una bestia a fargli un piccolo favore, a discrezione del GM.
