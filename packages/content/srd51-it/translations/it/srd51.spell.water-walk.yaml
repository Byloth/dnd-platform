name: Camminare sull'acqua
text: |-
  Questo incantesimo conferisce la capacità di muoversi su una qualsiasi superficie liquida, come l'acqua, l'acido, il fango, la neve, le sabbie mobili o la lava, come se si trattasse di un innocuo terreno solido (ma le creature che attraversano un tratto di lava fusa possono comunque subire danni dal calore). Fino a dieci creature consenzienti entro gittata che l'incantatore è in grado di vedere ottengono questa capacità per tutta la durata dell'incantesimo. Se il bersaglio è una creatura immersa in un liquido, l'incantesimo la sposta in superficie a una velocità di 18 metri per round.
