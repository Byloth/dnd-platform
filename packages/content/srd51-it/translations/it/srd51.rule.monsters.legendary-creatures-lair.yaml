name: "La tana di una creatura leggendaria"
text: |-
  Una creatura leggendaria può avere una sezione che descriva la sua tana e gli effetti speciali che può creare finché si trova al suo interno, a volte con un atto volontario, altre volte semplicemente tramite la sua presenza. Questa sezione si applica soltanto alle creature leggendarie che trascorrono molto tempo nella loro tana.
