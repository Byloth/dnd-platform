name: Armi improvvisate
text: |-
  A volte un personaggio è privo di armi ed è costretto ad attaccare con ciò che trova a portata di mano. Un'arma improvvisata consiste in un qualsiasi oggetto che un personaggio può impugnare con una o due mani, come una bottiglia rotta, la gamba di un tavolo, una padella, la ruota di un carro o un goblin morto.

  Spesso un'arma improvvisata è simile a un'arma vera e propria e può essere trattata come tale: la gamba di un tavolo, per esempio, è simile a un randello. A discrezione del GM, un personaggio competente in un'arma può usare un oggetto simile come se si trattasse di quell'arma e applicarvi il proprio bonus di competenza.

  Un oggetto che non assomiglia a nessun'arma infligge 1d4 danni (il GM stabilisce il tipo di danno appropriato). Se un personaggio usa un'arma a distanza per effettuare un attacco in mischia o lancia un'arma da mischia che non possiede la proprietà da lancio, anche quell'arma infligge 1d4 danni. Un'arma da lancio improvvisata ha una gittata normale di 6 metri e una gittata lunga di 18 metri.
