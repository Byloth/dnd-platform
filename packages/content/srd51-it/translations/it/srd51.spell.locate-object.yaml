name: Localizza oggetto
components.m: Un ramoscello biforcuto.
text: L'incantatore descrive o nomina un oggetto a lui familiare, percependo la direzione della sua ubicazione, purché si trovi entro 300 metri da lui. Se l'oggetto è in movimento, l'incantatore apprende verso quale direzione si sta dirigendo. L'incantesimo può localizzare un oggetto specifico noto all'incantatore, purché l'abbia visto da vicino (entro 9 metri) almeno una volta. In alternativa, può localizzare l'oggetto di un tipo particolare più vicino, come per esempio un certo tipo di veste, gioiello, mobile, strumento o arma. Inoltre, questo incantesimo non può localizzare un oggetto se uno strato di piombo di qualsiasi spessore, anche una lamina sottile, blocca il percorso diretto tra esso e l'incantatore.
