name: "Cariche"
text: |-
  Alcuni oggetti magici contengono delle cariche che devono essere consumate per attivarne le proprietà. Il numero di cariche che rimangono a un oggetto viene rivelato quando su di esso viene lanciato un incantesimo identificare, nonché quando una creatura vi entra in sintonia. Inoltre, quando un oggetto recupera delle cariche, la creatura in sintonia con esso apprende quante cariche ha recuperato.
