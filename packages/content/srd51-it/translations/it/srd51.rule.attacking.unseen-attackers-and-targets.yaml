name: Attaccanti e bersagli non visibili
text: |-
  Spesso un combattente cerca di sfuggire alla vista dei suoi avversari nascondendosi, lanciando l'incantesimo invisibilità o nascondendosi nell'oscurità.

  Quando un personaggio attacca un bersaglio che non è in grado di vedere, subisce svantaggio al tiro per colpire. Questo vale sia che stia tirando a indovinare la posizione del bersaglio, sia che stia prendendo di mira una creatura che è in grado di udire ma non di vedere. Se il bersaglio non si trova nel punto che il personaggio ha bersagliato, l'attacco manca automaticamente, ma il GM solitamente si limita a dire che l'attacco ha mancato il bersaglio, senza specificare se il personaggio ne aveva indovinato la posizione.

  Quando una creatura non è in grado di vedere il personaggio, questi dispone di vantaggio ai tiri per colpire contro tale creatura. Se il personaggio è nascosto (non può essere né visto né sentito) quando effettua un attacco, rivela la sua posizione quando l'attacco colpisce o manca il bersaglio.
