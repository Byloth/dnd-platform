name: Modificare memoria
text: L'incantatore tenta di alterare i ricordi di un'altra creatura che è in grado di vedere, la quale deve effettuare un tiro salvezza su Saggezza. Se l'incantatore sta combattendo contro la creatura, essa dispone di vantaggio al tiro salvezza. Se lo fallisce, il bersaglio rimane affascinato per tutta la durata dell'incantesimo, è inoltre incapacitato e inconsapevole di ciò che accade intorno a lui, ma può ancora udire l'incantatore. Se subisce danni o è bersagliato da un altro incantesimo, questo incantesimo termina e nessun ricordo del bersaglio viene modificato. Finché questo ammaliamento permane, l'incantatore può alterare il ricordo che il bersaglio ha di un evento avvenuto entro le 24 ore precedenti e della durata massima di 10 minuti. Può eliminare permanentemente tutti i ricordi dell'evento, consentire al bersaglio di ricordarlo con estrema chiarezza e in ogni dettaglio, alterare il ricordo di alcuni dettagli dell'evento o creare il ricordo di un evento diverso. Per descrivere in che modo i ricordi vengono alterati, l'incantatore deve parlare con il bersaglio, che deve quindi comprendere il linguaggio usato affinché i ricordi modificati si radichino nella sua mente. Essa poi riempie le eventuali lacune presenti nella descrizione dell'incantatore. Se l'incantesimo termina prima che l'incantatore abbia finito di descrivere i ricordi modificati, la memoria della creatura non subisce alcuna alterazione. In caso contrario, i ricordi modificati si radicano nella sua mente al termine dell'incantesimo. Un ricordo modificato non influenza necessariamente il comportamento di una creatura, in particolare se contraddice le sue inclinazioni naturali, il suo allineamento o le sue convinzioni. Un ricordo modificato illogicamente, come per esempio il ricordo di quanto la creatura ami immergersi nell'acido, viene ignorato e considerato probabilmente come un brutto sogno. Il GM potrebbe ritenere che un ricordo modificato sia troppo insensato per influenzare la creatura in modo significativo. Un incantesimo rimuovi maledizione o ristorare superiore lanciato su un bersaglio ripristina i veri ricordi della creatura.
higherLevel: Quando l'incantatore lancia questo incantesimo usando uno slot incantesimo di 6° livello o superiore, può modificare i ricordi del bersaglio relativi a un evento risalente fino a 7 giorni prima (6° livello), 30 giorni prima (7° livello), 1 anno prima (8° livello) o a un qualsiasi momento del suo passato (9° livello).
onCast.2.text: Se il bersaglio fallisce il tiro salvezza su Saggezza (con vantaggio se l'incantatore sta combattendo contro di esso). Il bersaglio affascinato è incapacitato e inconsapevole di ciò che accade intorno a lui, ma può udire l'incantatore; l'incantesimo termina se subisce danni o è bersagliato da un altro incantesimo. L'alterazione del ricordo di un evento delle ultime 24 ore (più lontano con slot di livello superiore) è decisa dal GM.
