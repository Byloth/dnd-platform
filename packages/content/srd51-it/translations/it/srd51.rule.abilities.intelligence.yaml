name: Intelligenza
text: |-
  L'Intelligenza misura l'acume mentale, la precisione della memoria e le capacità logiche.

  ## Prove di Intelligenza

  Una prova di Intelligenza entra in gioco quando un personaggio ricorre alla logica, all'istruzione, alla memoria o al ragionamento deduttivo. Le abilità Arcano, Storia, Indagare, Natura e Religione rappresentano una preparazione superiore in certi tipi di prove di Intelligenza.

  ### Arcano

  Una prova di Intelligenza (Arcano) misura la capacità di un personaggio di ricordare informazioni relative a incantesimi, oggetti magici, simboli occulti, tradizioni magiche, piani di esistenza e abitanti di quei piani.

  ### Storia

  Una prova di Intelligenza (Storia) misura la capacità di un personaggio di ricordare informazioni relative a eventi storici, figure leggendarie, regni antichi, dispute del passato, guerre recenti e civiltà perdute.

  ### Indagare

  Quando un personaggio cerca indizi ed effettua deduzioni dipendenti da quegli indizi, effettua una prova di Intelligenza (Indagare). Potrebbe dedurre l'ubicazione di un oggetto nascosto, capire quale arma ha inferto un certo tipo di ferita o determinare il punto debole di un tunnel che potrebbe provocarne il crollo. Anche esaminare una raccolta di antiche pergamene in cerca di conoscenze nascoste potrebbe richiedere una prova di Intelligenza (Indagare).

  ### Natura

  Una prova di Intelligenza (Natura) misura la capacità di un personaggio di ricordare informazioni sul terreno, i vegetali, gli animali, il clima e i cicli naturali.

  ### Religione

  Una prova di Intelligenza (Religione) misura la capacità di un personaggio di ricordare informazioni sulle divinità, i riti, le preghiere, le gerarchie religiose, i simboli sacri e le pratiche dei culti segreti.

  ### Altre prove di Intelligenza

  Il GM potrebbe richiedere una prova di Intelligenza anche quando un personaggio tenta di compiere imprese come:  - Comunicare con una creatura senza usare parole - Stimare il valore di un oggetto prezioso - Travestirsi per passare da guardia cittadina - Falsificare un documento - Ricordare informazioni relative a un'arte o a un mestiere - Vincere a un gioco di abilità

  ## Caratteristica da incantatore

  I maghi usano Intelligenza come caratteristica da incantatore per determinare le CD dei tiri salvezza degli incantesimi che lanciano.
