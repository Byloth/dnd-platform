name: Resurrezione
components.m: Un diamante del valore di almeno 1.000 mo, che l'incantesimo consuma.
text: |-
  L'incantatore tocca una creatura defunta da non più di un secolo, che non sia morta di vecchiaia e non sia un non morto. Se la sua anima è libera e consenziente, il bersaglio torna in vita con tutti i suoi punti ferita. Questo incantesimo neutralizza qualsiasi veleno e cura le normali malattie che influenzavano la creatura al momento della morte. Non rimuove tuttavia malattie magiche, maledizioni e altre afflizioni analoghe; se tali effetti non vengono rimossi prima del lancio dell'incantesimo, affliggeranno il bersaglio una volta tornato in vita. Questo incantesimo richiude tutte le ferite mortali e ripristina le eventuali parti del corpo mancanti. Il ritorno dalla morte è un vero e proprio travaglio. Il bersaglio subisce una penalità di -4 a tutti i tiri per colpire, tiri salvezza e prove di caratteristica. Ogni volta che completa un riposo lungo, questa penalità viene ridotta di 1 finché non sparisce del tutto. Lanciare questo incantesimo per riportare in vita una creatura morta da un anno o più risulta estremamente spossante per l'incantatore. Finché non completa un riposo lungo, non può lanciare di nuovo incantesimi e subisce svantaggio a tutti i tiri per colpire, alle prove di caratteristica e ai tiri salvezza.
