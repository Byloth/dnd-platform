name: Capanna
components.m: Una piccola perla di cristallo.
text: |-
  Una cupola di forza immobile del raggio di 3 metri si materializza intorno e al di sopra dell'incantatore, rimanendo fissa per la durata dell'incantesimo, che termina nel momento in cui l'incantatore esce dalla sua area. La cupola può contenere, oltre all'incantatore, nove creature di taglia Media o inferiore. L'incantesimo non funziona se nella sua area è presente una creatura di taglia maggiore o più di nove creature. Le creature e gli oggetti all'interno della cupola al momento del lancio dell'incantesimo possono attraversare liberamente la barriera, mentre a tutte le altre creature e oggetti è proibito. Gli incantesimi e gli altri effetti magici non possono estendersi oltre la cupola o essere lanciati attraverso di essa. L'atmosfera all'interno dell'area è gradevole e asciutta, a prescindere dal tempo atmosferico all'esterno. Fino al termine dell'incantesimo, l'incantatore può fare in modo che l'interno sia buio o illuminato da luce fioca. Dall'esterno la cupola appare opaca, di un qualsiasi colore a scelta dell'incantatore, ma dall'interno risulta trasparente.
