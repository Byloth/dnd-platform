name: Moneta d'oro
text: Con una moneta d'oro, un personaggio può comprare un giaciglio, 15 metri di corda pregiata o una capra. Un artigiano abile (ma non straordinario) può guadagnare una moneta d'oro al giorno. La moneta d'oro è l'unità di misura standard della ricchezza, anche se le monete vere e proprie di questo tipo non sono usate spesso. Quando i mercanti discutono di affari che riguardano merci o servizi del valore di centinaia o migliaia di monete d'oro, le transazioni in genere non prevedono lo scambio di monete. La moneta d'oro è usata principalmente come misura di valuta standard, ma lo scambio vero e proprio viene effettuato in lingotti d'oro, lettere di credito o merci preziose.
