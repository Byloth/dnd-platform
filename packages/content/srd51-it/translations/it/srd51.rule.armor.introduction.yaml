name: Armature
text: |-
  I mondi dei giochi di ruolo fantasy sono un vasto arazzo composto da molte culture diverse, caratterizzate da vari livelli di tecnologia. Di conseguenza, gli avventurieri possono accedere a una vasta gamma di armature che spazia da quelle di cuoio alle cotte di maglia, fino alle costose armature a piastre. La tabella "Armature" elenca i tipi di armature più diffusi e disponibili nel gioco, suddividendole in tre categorie: armature leggere, armature medie e armature pesanti. Molti guerrieri aggiungono all'utilizzo di un'armatura anche quello di uno scudo.

  La tabella "Armature" mostra il costo, il peso e le altre proprietà dei tipi più comuni di armature e degli scudi usati nei mondi fantasy dei giochi di ruolo.

  **_Competenza nelle armature._** Tutti possono indossare un'armatura o legarsi uno scudo al braccio, ma soltanto chi è competente nell'utilizzo delle armature sa come indossarli con efficacia. Ogni classe fornisce al personaggio competenze in certi tipi di armature. Se un personaggio indossa un'armatura in cui non è competente, subisce svantaggio a ogni prova di caratteristica, tiro salvezza o tiro per colpire correlato a Forza o Destrezza, e non può lanciare incantesimi.

  **_Classe Armatura (CA)._** L'armatura protegge dagli attacchi. L'armatura e l'eventuale scudo di un personaggio determinano la sua Classe Armatura base.

  **_Armature pesanti._** Le armature più pesanti interferiscono con l'abilità del portatore di muoversi rapidamente, furtivamente o liberamente. Se la tabella "Armature" indica "For 13" o "For 15" nella colonna "Forza" relativa a un certo tipo di armatura, quell'armatura riduce la velocità del portatore di 3 metri a meno che questi non possieda un punteggio di Forza pari o superiore a quello elencato.

  **_Furtività._** Se nella tabella "Armature" compare la voce "Svantaggio" nella colonna "Furtività", il portatore subisce svantaggio alle prove di Destrezza (Furtività).

  **_Scudi._** Uno scudo può essere fatto di legno o di metallo ed è impugnato con una mano. Impugnare uno scudo aumenta di 2 la Classe Armatura del personaggio. È possibile beneficiare di un solo scudo alla volta.
