name: Carne in pietra
components.m: Un pizzico di calce, acqua e terra.
text: |-
  L'incantatore tenta di tramutare in pietra una creatura entro gittata che è in grado di vedere. La creatura deve effettuare un tiro salvezza su Costituzione se il suo corpo è di carne. Se lo fallisce, il bersaglio è trattenuto e la sua carne inizia a indurirsi, mentre se lo supera, la creatura non subisce alcun effetto. Una creatura trattenuta da questo incantesimo deve effettuare un altro tiro salvezza su Costituzione al termine di ogni suo turno. L'incantesimo termina se il bersaglio supera per tre volte il tiro salvezza contro questo incantesimo, mentre se lo fallisce per tre volte, viene tramutato in pietra ed è soggetto alla condizione pietrificato per la durata dell'incantesimo. Non è necessario che i tiri superati o falliti siano consecutivi: si tiene semplicemente il conto di entrambi finché il bersaglio non ne accumula tre di un certo tipo. Se la creatura subisce una rottura fisica mentre è pietrificata, soffrirà di una deformità analoga una volta tornata al suo stato originale. Se l'incantatore mantiene la concentrazione su questo incantesimo per l'intera durata possibile, la creatura viene tramutata in pietra finché l'effetto non viene rimosso.
onCast.0.note: Se fallisce il tiro salvezza su Costituzione (solo creature di carne). La creatura trattenuta ripete il tiro salvezza al termine di ogni suo turno; tre successi terminano l'incantesimo, tre fallimenti la tramutano in pietra (pietrificata) per la durata dell'incantesimo, o permanentemente se l'incantatore mantiene la concentrazione per l'intera durata.
