name: "Dadi"
text: |-
  Questo strumento comprende un assortimento di elementi di gioco, tra cui dadi e mazzi di carte (per giochi come Tre Draghi al Buio). Alcuni esempi comuni compaiono nella tabella "Strumenti", ma esistono anche giochi di altro tipo. Se un personaggio è competente in un gioco, può aggiungere il suo bonus di competenza alle prove di caratteristica che effettua quando gioca una partita a quel gioco. Ogni tipo di gioco richiede una competenza separata.
