name: Semipiano
text: |-
  L'incantatore crea una porta d'ombra su una superficie piatta e solida entro gittata che è in grado di vedere. La porta è ampia a sufficienza per permettere alle creature di taglia Media di attraversarla senza difficoltà e, una volta aperta, conduce a un semipiano che appare come una stanza vuota di legno o pietra ampia 9 metri in ogni dimensione. Al termine dell'incantesimo, la porta scompare e ogni creatura o oggetto all'interno rimane intrappolato nel semipiano, in quanto la porta scompare anche sul lato opposto. Ogni volta che lancia questo incantesimo, l'incantatore può creare un nuovo semipiano o collegare la porta d'ombra a un semipiano da lui creato con un lancio precedente di questo incantesimo. Inoltre, se l'incantatore conosce la natura e i contenuti di un semipiano creato da un'altra creatura lanciando questo incantesimo, può fare invece in modo che la porta d'ombra si colleghi a quel semipiano.
