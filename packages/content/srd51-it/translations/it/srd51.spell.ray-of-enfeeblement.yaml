name: Raggio di affaticamento
text: |-
  Un raggio nero di energia logorante scaturisce dal dito dell'incantatore puntato contro una creatura entro gittata. Con questo incantesimo, l'incantatore effettua un attacco a distanza con incantesimo contro il bersaglio. Se il colpo va a segno, fino al termine dell'incantesimo il bersaglio infligge solo la metà dei danni con attacchi con armi che usano Forza. Alla fine di ogni suo turno, il bersaglio può effettuare un tiro salvezza su Costituzione contro l'incantesimo. In caso di successo, l'incantesimo termina.
effects.0.text: Infligge solo la metà dei danni con attacchi con armi che usano Forza.
onCast.0.text: |-
  Se l'attacco a distanza con incantesimo va a segno. Alla fine di ogni suo turno, il bersaglio può effettuare un tiro salvezza su Costituzione contro l'incantesimo (il testo dice Costituzione, non Forza); in caso di successo, l'incantesimo termina.
