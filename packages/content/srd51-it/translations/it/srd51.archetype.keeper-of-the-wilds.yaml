name: Custode delle terre selvagge
pitch: Un guardiano della natura che parla con gli animali, guarisce e in battaglia invoca il vento, le spine e la luce lunare.
why.class: "I druidi lanciano incantesimi della natura e possono trasformarsi in animali: una classe piena di opzioni, in cui la Saggezza fa quasi tutto il lavoro."
why.species: "Un umano migliora un po' in tutto (+1 a ogni punteggio) e ottiene un linguaggio extra: nessun punto debole di cui preoccuparsi."
why.abilityPriority: La Saggezza alimenta i tuoi incantesimi; la Costituzione mantiene la tua concentrazione e i tuoi punti ferita; la Destrezza ti protegge in armatura leggera.
why.background: Accolito, l'unico background dell'SRD, ti dà le abilità Intuizione e Religione e due linguaggi.
