name: Guarigione
text: |-
  L'incantatore sceglie una creatura entro gittata che è in grado di vedere. Un flusso di energia positiva investe la creatura, facendole recuperare 70 punti ferita. Questo incantesimo termina qualsiasi forma di cecità, sordità e malattia che influenza il bersaglio e non ha effetto su costrutti o non morti.
higherLevel: |-
  Quando l'incantatore lancia questo incantesimo usando uno slot incantesimo di 7° livello o superiore, l'ammontare di guarigione aumenta di 10 per ogni slot di livello superiore al 6°.
onCast.0.note: Più 10 per ogni slot di livello superiore al 6°. Termina inoltre cecità, sordità e qualsiasi malattia che influenza il bersaglio; nessun effetto su costrutti o non morti.
