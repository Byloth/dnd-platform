name: "Gnomo"
text: |-
  Un personaggio gnomo possiede alcune caratteristiche in comune con tutti gli altri gnomi.
features.0.name: "Incremento dei punteggi di caratteristica"
features.0.text: |-
  Il punteggio di Intelligenza di uno gnomo aumenta di 2.
features.1.name: "Velocità"
features.1.text: |-
  La velocità base sul terreno di uno gnomo è di 7,5 metri.
features.2.name: "Scurovisione"
features.2.text: |-
  Uno gnomo è abituato a vivere sottoterra e beneficia di una vista superiore nell'oscurità e nelle condizioni di luce fioca. In condizioni di luce fioca, può vedere fino a una distanza di 18 metri come se si trovasse in condizioni di luce intensa e nell'oscurità come se si trovasse in presenza di luce fioca. Nell'oscurità non è in grado di discernere i colori, ma solo le tonalità di grigio.
features.3.name: "Età"
features.3.text: |-
  Gli gnomi maturano alla stessa velocità degli umani e la maggior parte solitamente adotta la stabilità di una vita adulta attorno ai 40 anni. Uno gnomo può vivere dai 350 ai 500 anni circa.
features.4.name: "Allineamento"
features.4.text: |-
  Gli gnomi sono spesso buoni. Quelli che tendono alla legalità sono sapienti, ingegneri, ricercatori, studiosi, investigatori o inventori. Quelli che tendono al caos sono menestrelli, imbroglioni, viandanti o eccentrici gioiellieri. Gli gnomi sono creature di buon cuore e anche quelli di indole più ingannevole sono generalmente più burloni che malvagi.
features.5.name: "Taglia"
features.5.text: |-
  Uno gnomo può essere alto dai 90 ai 120 cm e pesare in media 20 kg. È una creatura di taglia Piccola.
features.6.name: "Linguaggi"
features.6.text: |-
  Uno gnomo può parlare, leggere e scrivere in Comune e in Gnomesco. Lo Gnomesco, che usa l'alfabeto Nanico, è rinomato per i suoi trattati tecnici e le sue enciclopedie sul mondo naturale.
features.7.name: "Astuzia gnomesca"
features.7.text: |-
  Uno gnomo dispone di vantaggio a tutti i tiri salvezza su Intelligenza, Saggezza e Carisma contro la magia.
subspecies.0.name: "Gnomo delle rocce"
subspecies.0.text: |-
  Uno gnomo delle rocce è dotato di una creatività innata e di una resistenza superiore a quella degli altri gnomi.
subspecies.0.features.0.name: "Incremento dei punteggi di caratteristica"
subspecies.0.features.0.text: |-
  Il punteggio di Costituzione di uno gnomo aumenta di 1.
subspecies.0.features.1.name: "Conoscenze dell'artefice"
subspecies.0.features.1.text: |-
  Ogni volta che uno gnomo delle rocce effettua una prova di Intelligenza (Storia) relativa a oggetti magici, alchemici o congegni tecnologici, può aggiungere il doppio del suo bonus di competenza anziché l'eventuale bonus di competenza che applicherebbe solitamente.
subspecies.0.features.1.effects.0.text: |-
  Aggiungi il doppio del tuo bonus di competenza, anziché l'eventuale bonus di competenza che applicheresti solitamente, alle prove di Intelligenza (Storia) relative a oggetti magici, alchemici o congegni tecnologici.
subspecies.0.features.1.effects.0.note: |-
  Situazionale: è il giocatore a stabilire che la prova riguarda tali oggetti; non è derivato (stessa forma di Esperto minatore).
subspecies.0.features.2.name: "Inventore"
subspecies.0.features.2.text: |-
  Uno gnomo delle rocce ha competenza negli strumenti da artigiano (strumenti da inventore). Utilizzando questi strumenti, uno gnomo delle rocce può dedicare un'ora e una quantità di materiali pari a un valore di 10 mo per costruire un congegno meccanico Minuscolo (CA 5, 1 punto ferita). Il congegno cessa di funzionare dopo 24 ore (a meno che il personaggio non spenda 1 ora a ripararlo per mantenerlo in funzione) o quando lo gnomo delle rocce usa un'azione per smantellarlo (nel qual caso può recuperare i materiali utilizzati per crearlo). Non è possibile avere più di tre congegni attivi allo stesso tempo.

  Quando uno gnomo delle rocce decide di creare un congegno, deve sceglierne uno tra le opzioni seguenti:
  * _Giocattolo a molla._ Questo giocattolo meccanico ha la forma di un animale, un mostro o un individuo, come per esempio una rana, un topo, un uccello, un drago o un soldato. Quando viene posizionato per terra, il giocattolo si sposta di 1,5 metri a ogni turno del personaggio, in una direzione casuale. Il giocattolo a molla emette i tipici suoni della creatura che rappresenta.
  * _Accendifuoco._ Questo congegno produce una fiamma in miniatura che un personaggio può usare per accendere una candela, una torcia o un fuoco da campo. Per utilizzare questo congegno è richiesta un'azione.
  * _Carillon._ Una volta aperto, il carillon emette un'unica melodia a un volume moderato. Smette di suonare quando arriva alla fine della melodia o quando viene richiuso.
subspecies.0.features.2.effects.1.text: |-
  Utilizzando gli strumenti da inventore, puoi dedicare 1 ora e una quantità di materiali pari a un valore di 10 mo per costruire un congegno meccanico Minuscolo (CA 5, 1 punto ferita): un giocattolo a molla, un accendifuoco o un carillon. Il congegno cessa di funzionare dopo 24 ore, a meno che tu non spenda 1 ora a ripararlo, o quando usi un'azione per smantellarlo e recuperare i materiali. Non puoi avere più di tre congegni attivi allo stesso tempo.
subspecies.0.features.2.effects.1.note: |-
  Creazione narrativa; i tre congegni attivi non sono tracciati come risorsa.
