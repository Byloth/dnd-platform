name: Reincarnazione
components.m: Oli e unguenti rari del valore di almeno 1.000 mo, che l'incantesimo consuma.
text: |-
  L'incantatore tocca un umanoide defunto o una parte di umanoide defunto. Se la creatura non è morta da più di 10 giorni, l'incantesimo le forma un nuovo corpo adulto e poi richiama la sua anima all'interno di quel corpo. Se l'anima del bersaglio non è consenziente o libera di tornare, l'incantesimo non funziona. La magia crea un nuovo corpo in cui l'umanoide possa vivere, perciò è probabile che anche la razza della creatura cambi. Il GM tira un d100 e consulta la tabella seguente per determinare quale forma assume la creatura quando torna in vita o, in alternativa, la può scegliere lui stesso.

  | d100 | Razza |
  |---|---|
  | 01-04 | Dragonide |
  | 05-13 | Elfo alto |
  | 14-21 | Elfo dei boschi |
  | 22-25 | Elfo oscuro |
  | 26-29 | Gnomo delle foreste |
  | 30-35 | Gnomo delle rocce |
  | 36-43 | Halfling piedelesto |
  | 44-51 | Halfling tozzo |
  | 52-55 | Mezzelfo |
  | 56-59 | Mezzorco |
  | 60-68 | Nano delle colline |
  | 69-76 | Nano delle montagne |
  | 77-80 | Tiefling |
  | 81-100 | Umano |

  La creatura reincarnata ricorda la sua vita e le sue esperienze passate. Conserva le capacità che possedeva nella sua forma originale, ma la sua razza precedente viene sostituita dalla nuova, così come i suoi tratti razziali.
