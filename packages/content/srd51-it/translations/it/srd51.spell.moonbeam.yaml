name: Bagliore lunare
components.m: Alcuni semi a mezzaluna di un qualsiasi vitigno legnoso e un frammento di feldspato opalescente.
text: Un bagliore argentato di luce pallida forma un cilindro del raggio di 1,5 metri e dell'altezza di 12 metri centrato su un punto entro gittata. Fino al termine dell'incantesimo, il cilindro è pervaso da luce fioca. Quando una creatura entra nell'area dell'incantesimo per la prima volta in un turno o inizia il suo turno qui, è avvolta da fiamme spettrali che le causano dolori lancinanti e deve effettuare un tiro salvezza su Costituzione. In caso di fallimento, subisce 2d10 danni radiosi, o la metà dei danni in caso di successo. Un mutaforma subisce svantaggio a questo tiro salvezza e, se lo fallisce, riassume immediatamente la sua forma originale e non può assumerne una diversa finché non esce dalla luce dell'incantesimo. Nei suoi turni successivi, dopo aver lanciato questo incantesimo, l'incantatore può usare un'azione per muovere il bagliore per 18 metri in ogni direzione.
higherLevel: Quando l'incantatore lancia questo incantesimo usando uno slot incantesimo di 3° livello o superiore, i danni aumentano di 1d10 per ogni slot di livello superiore al 2°.
effects.0.name: Muovere il bagliore lunare
effects.0.text: L'incantatore muove il bagliore fino a 18 metri in qualsiasi direzione.
onCast.0.text: Una creatura che entra nel cilindro per la prima volta in un turno o vi inizia il suo turno effettua il tiro salvezza su Costituzione. Un mutaforma subisce svantaggio al tiro salvezza e, se lo fallisce, riassume la sua forma originale e non può cambiare forma finché non esce dalla luce.
