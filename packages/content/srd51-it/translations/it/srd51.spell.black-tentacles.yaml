name: Tentacoli neri
components.m: Un pezzo di tentacolo appartenente a una piovra o una seppia gigante
text: |-
  Una massa in movimento di tentacoli color ebano riempie un quadrato con lato di 6 metri situato sul terreno entro gittata e che l'incantatore è in grado di vedere. Per la durata dell'incantesimo, questi tentacoli trasformano quell'area in un terreno difficile. Quando una creatura entra nell'area influenzata per la prima volta in un turno o inizia il suo turno qui, deve superare un tiro salvezza su Destrezza, altrimenti subisce 3d6 danni contundenti ed è trattenuta dai tentacoli fino alla fine dell'incantesimo. Qualsiasi creatura che inizi il proprio turno nell'area e sia già trattenuta dai tentacoli subisce 3d6 danni contundenti. Una creatura trattenuta dai tentacoli può usare la sua azione per effettuare una prova di Forza o Destrezza (a sua scelta) contro la CD del tiro salvezza sull'incantesimo. In caso di successo, si libera.
onCast.0.note: |-
  Se una creatura fallisce il tiro salvezza su Destrezza quando entra nell'area per la prima volta in un turno o vi inizia il suo turno, è trattenuta e subisce 3d6 danni contundenti; una creatura che inizia il suo turno trattenuta subisce di nuovo 3d6 danni contundenti e può usare la sua azione per effettuare una prova di Forza o Destrezza contro la CD del tiro salvezza sull'incantesimo per liberarsi. L'area è terreno difficile.
