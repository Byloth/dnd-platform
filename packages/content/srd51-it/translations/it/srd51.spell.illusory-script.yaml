name: Scritto illusorio
components.m: Inchiostro a base di piombo del valore di almeno 10 mo, che l'incantesimo consuma.
text: |-
  L'incantatore scrive su una pergamena, un foglio o un altro materiale adatto alla scrittura e infonde nello scritto una potente illusione che permane per la durata dell'incantesimo. All'incantatore e a qualsiasi creatura indicata da lui al momento del lancio, lo scritto appare normale, stilato nella calligrafia dell'incantatore e trasmette il significato inteso nel momento in cui è stato scritto. Agli occhi di tutti gli altri, il messaggio appare scritto in un linguaggio magico o ignoto che risulta per loro incomprensibile. In alternativa, l'incantatore può fare in modo che appaia come un messaggio totalmente diverso, scritto in una calligrafia e un linguaggio differenti, quest'ultimo tuttavia deve essere noto all'incantatore. Nel caso in cui l'incantesimo venga dissolto, il messaggio originale e l'illusione scompaiono. Una creatura con vista pura può leggere il messaggio nascosto.
