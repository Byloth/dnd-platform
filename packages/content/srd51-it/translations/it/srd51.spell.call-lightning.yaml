name: Invocare il fulmine
text: |-
  Una nube di tempesta appare sotto forma cilindrica di altezza pari a 3 metri e raggio pari a 18 metri, centrata su un punto che l'incantatore è in grado di vedere situato a 30 metri esattamente sopra di lui. L'incantesimo non funziona se l'incantatore non può vedere il punto in cui la nube potrebbe comparire (per esempio, se si trova all'interno di una stanza che non è in grado di contenere la nube). Quando lancia questo incantesimo, l'incantatore sceglie un punto che è in grado di vedere entro gittata, dove si abbatte un fulmine originato dalla nube. Ogni creatura situata entro 1,5 metri da quel punto deve effettuare un tiro salvezza su Destrezza, subendo 3d10 danni da fulmine in caso di fallimento, o la metà dei danni in caso di successo. In ogni suo turno finché l'incantesimo non termina, l'incantatore può usare un'azione per richiamare il fulmine in questo modo, bersagliando lo stesso punto o un punto diverso. Se nel momento in cui lancia l'incantesimo l'incantatore si trova all'esterno durante una tempesta, ottiene il controllo della tempesta esistente invece di crearne una nuova. In queste condizioni, i danni provocati dall'incantesimo aumentano di 1d10.
higherLevel: |-
  Quando l'incantatore lancia questo incantesimo usando uno slot incantesimo di 4° livello o superiore, i danni aumentano di 1d10 per ogni slot di livello superiore al 3°.
effects.0.name: Invocare il fulmine
effects.0.text: |-
  Richiama un fulmine su un punto che sei in grado di vedere sotto la nube di tempesta: ogni creatura entro 1,5 metri da quel punto effettua un tiro salvezza su Destrezza e subisce 3d10 danni da fulmine in caso di fallimento, o la metà dei danni in caso di successo.
effects.0.note: |-
  I danni aumentano di 1d10 per ogni slot di livello superiore al 3° e di 1d10 se al momento del lancio ti trovavi all'esterno durante una tempesta.
