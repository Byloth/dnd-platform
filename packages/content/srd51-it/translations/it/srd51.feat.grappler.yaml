name: Lottatore
text: |-
  Il personaggio ha sviluppato le abilità necessarie per farsi valere nella lotta corpo a corpo. Ottiene i seguenti benefici:
  - Dispone di vantaggio ai tiri per colpire contro una creatura con cui sta lottando.
  - Può usare la sua azione per tentare di immobilizzare una creatura da lui afferrata. Per farlo deve effettuare un'altra prova di lotta. Se la supera, il personaggio e la creatura sono entrambi trattenuti fino alla fine della lotta.
effects.1.name: Immobilizzare
effects.1.text: Tenta di immobilizzare una creatura da te afferrata. Per farlo, effettua un'altra prova di lotta. Se la superi, tu e la creatura siete entrambi trattenuti fino alla fine della lotta.
