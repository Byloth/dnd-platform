name: "Poteri psionici"
text: |-
  Un mostro che lancia incantesimi usando soltanto il potere della mente possiede il descrittore "psionici" accanto al suo tratto speciale Incantesimi o Incantesimi innati. Questo descrittore non comporta alcuna regola intrinseca, ma altre parti del gioco potrebbero farvi riferimento. Un mostro dotato di questo descrittore solitamente non ha bisogno di alcuna componente per lanciare i suoi incantesimi.
