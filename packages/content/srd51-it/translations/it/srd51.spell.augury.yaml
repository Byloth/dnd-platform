name: Presagio
components.m: Bastoncini, ossa o oggetti simili dotati di contrassegni speciali, del valore di almeno 25 mo.
text: |-
  Lanciando bastoncini incastonati di gemme o ossa di drago, rivelando carte illustrate o usando altri strumenti di divinazione, l'incantatore riceve un segno da un'entità ultraterrena riguardo al risultato di un corso d'azione specifico che intende intraprendere entro i prossimi 30 minuti. Il GM sceglie tra i seguenti presagi possibili:
  - Ventura, se l'azione fornisce risultati positivi
  - Sventura, se l'azione fornisce risultati negativi
  - Ventura e sventura, se l'azione fornisce risultati sia positivi che negativi
  - Nulla, se non ci sono risultati positivi o negativi rilevanti

  L'incantesimo non prende in considerazione le potenziali circostanze che potrebbero alterare l'esito del presagio, come per esempio il lancio di incantesimi aggiuntivi o la perdita o l'acquisizione di un compagno. Se l'incantatore lancia l'incantesimo due o più volte prima di completare il suo riposo lungo successivo, esiste una probabilità cumulativa del 25% di ottenere un responso casuale per ogni lancio dopo il primo. Il GM effettua questo tiro in segreto.
