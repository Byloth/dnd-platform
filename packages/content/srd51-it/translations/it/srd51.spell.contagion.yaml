name: Contagio
text: |-
  Il tocco dell'incantatore trasmette una malattia. L'incantatore effettua un attacco in mischia con incantesimo contro una creatura entro gittata. Se il colpo va a segno, trasmette alla creatura una malattia a sua scelta tra quelle descritte in seguito. Alla fine di ogni suo turno, il bersaglio deve effettuare un tiro salvezza su Costituzione. Dopo aver fallito tre tiri salvezza, gli effetti della malattia permangono per tutta la durata dell'incantesimo e la creatura non effettua più tiri salvezza. Dopo aver superato tre tiri salvezza, la creatura guarisce dalla malattia e l'incantesimo termina. Poiché questo incantesimo induce una malattia naturale al bersaglio, qualsiasi effetto che rimuove una malattia o ne migliora gli effetti è efficace.

  **Infermità accecante.** La mente della creatura è attanagliata dal dolore e i suoi occhi diventano lattiginosi. La creatura è accecata e subisce svantaggio alle prove di Saggezza e ai tiri salvezza su Saggezza.

  **Febbre lurida.** Il corpo della creatura brucia di febbre. La creatura subisce svantaggio alle prove di Forza, ai tiri salvezza su Forza e ai tiri per colpire che utilizzano la Forza.

  **Carne putrefatta.** La carne della creatura si decompone. La creatura subisce svantaggio alle prove di Carisma e ha vulnerabilità a tutti i danni.

  **Fuoco mentale.** La mente della creatura è febbricitante. La creatura subisce svantaggio alle prove di Intelligenza e ai tiri salvezza su Intelligenza; inoltre, durante il combattimento si comporta come se fosse sotto l'effetto dell'incantesimo confusione.

  **Tremori.** Il corpo della creatura è scosso da tremori. La creatura subisce svantaggio alle prove di Destrezza, ai tiri salvezza su Destrezza e ai tiri per colpire che utilizzano la Destrezza.

  **Devastazione vischiosa.** La creatura inizia a sanguinare in modo incontrollabile. La creatura subisce svantaggio alle prove di Costituzione e ai tiri salvezza su Costituzione. Inoltre, ogni volta che subisce danni, è stordita fino al termine del proprio turno successivo.
effects.0.text: |-
  Malattia (una sola, scelta quando il colpo va a segno): Infermità accecante (svantaggio alle prove di Saggezza e ai tiri salvezza su Saggezza, accecata); Febbre lurida (svantaggio alle prove di Forza, ai tiri salvezza su Forza e ai tiri per colpire che utilizzano la Forza); Carne putrefatta (svantaggio alle prove di Carisma, vulnerabilità a tutti i danni); Fuoco mentale (svantaggio alle prove di Intelligenza e ai tiri salvezza su Intelligenza, durante il combattimento si comporta come se fosse sotto l'effetto dell'incantesimo confusione); Tremori (svantaggio alle prove di Destrezza, ai tiri salvezza su Destrezza e ai tiri per colpire che utilizzano la Destrezza); Devastazione vischiosa (svantaggio alle prove di Costituzione e ai tiri salvezza su Costituzione, stordita fino al termine del proprio turno successivo ogni volta che subisce danni).
effects.0.note: Dipende dall'opzione scelta, quindi non è espresso come svantaggio ai tiri né come difesa.
onCast.0.note: Solo Infermità accecante.
onCast.1.text: |-
  Se l'attacco in mischia con incantesimo va a segno, alla fine di ogni suo turno il bersaglio effettua un tiro salvezza su Costituzione: dopo tre fallimenti la malattia permane per tutta la durata (7 giorni) e i tiri salvezza cessano; dopo tre successi il bersaglio guarisce e l'incantesimo termina. Qualsiasi effetto che rimuove una malattia o ne migliora gli effetti è efficace.
