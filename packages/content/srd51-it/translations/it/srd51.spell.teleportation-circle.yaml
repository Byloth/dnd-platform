name: Cerchio di teletrasporto
components.m: Gessetti e inchiostri rari infusi di gemme preziose del valore di 50 mo, che l'incantesimo consuma.
text: |-
  Quando lancia l'incantesimo, l'incantatore traccia un cerchio del diametro di 3 metri sul terreno dotato di sigilli che collegano il luogo in cui si trova a un cerchio di teletrasporto permanente a sua scelta, di cui conosce la sequenza di sigilli e che si trova sul suo stesso piano di esistenza. All'interno del cerchio tracciato si apre un portale scintillante che rimane aperto fino al termine del suo turno successivo. Qualsiasi creatura che entra nel portale appare immediatamente entro 1,5 metri dal cerchio di destinazione o nello spazio libero più vicino se tale spazio è occupato. Molti dei più grandi templi, gilde e altri luoghi importanti hanno cerchi di teletrasporto permanenti tracciati entro i loro confini. Ognuno di questi cerchi include una sequenza di sigilli unica: una serie di rune magiche disposte secondo uno schema particolare. Quando l'incantatore ottiene per la prima volta la capacità di lanciare questo incantesimo, apprende la sequenza di sigilli abbinata a due destinazioni situate sul Piano Materiale, determinate dal GM. Nel corso delle sue avventure può apprendere ulteriori sequenze di sigilli, imparando a memoria ciascuna di esse dopo 1 minuto di studio. L'incantatore può creare un cerchio di teletrasporto permanente lanciando questo incantesimo nello stesso luogo ogni giorno per un anno e, in quel momento, non è obbligato a usare il cerchio per teletrasportarsi.
