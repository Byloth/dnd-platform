name: Bilancia da mercante
text: Una bilancia è composta da un piccolo braccio, due piatti e un assortimento di pesi di varie misure fino a un massimo di 1 kg. Grazie a essa, un personaggio può misurare il peso esatto degli oggetti più piccoli, come i metalli preziosi allo stato grezzo o le merci, per determinarne il valore esatto.
