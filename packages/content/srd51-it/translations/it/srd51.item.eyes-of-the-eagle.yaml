name: "Lenti dell'aquila"
text: |-
  Oggetto meraviglioso, non comune (richiede sintonia)

  Queste lenti di cristallo si adattano agli occhi di chi le indossa. Quando il personaggio le indossa, dispone di vantaggio alle prove di Saggezza (Percezione) basate sulla vista. In condizioni di visibilità ottimale, può discernere i dettagli di creature e oggetti di almeno 60 cm di diametro anche da lunghissime distanze.
features.0.name: "Vista acuta"
features.0.effects.0.note: "Solo alle prove di Saggezza (Percezione) basate sulla vista. In condizioni di visibilità ottimale puoi discernere i dettagli di creature e oggetti di almeno 60 cm di diametro anche da lunghissime distanze."
