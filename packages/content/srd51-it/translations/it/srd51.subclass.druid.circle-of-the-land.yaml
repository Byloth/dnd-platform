levels.3.features.0.effects.0.options.1.text: "Incantesimi del circolo della costa: 3° livello, immagine speculare e passo velato; 5° livello, camminare sull'acqua e respirare sott'acqua; 7° livello, controllare acqua e libertà di movimento; 9° livello, evoca elementale e scrutare."
levels.3.features.0.effects.0.options.2.name: Deserto
levels.3.features.0.effects.0.options.2.text: "Incantesimi del circolo del deserto: 3° livello, sfocatura e silenzio; 5° livello, creare cibo e acqua e protezione dall'energia; 7° livello, inaridire e terreno illusorio; 9° livello, muro di pietra e piaga degli insetti."
levels.3.features.0.effects.0.options.3.name: Foresta
levels.3.features.0.effects.0.options.3.text: "Incantesimi del circolo della foresta: 3° livello, movimenti del ragno e pelle coriacea; 5° livello, crescita vegetale e invocare il fulmine; 7° livello, divinazione e libertà di movimento; 9° livello, comunione con la natura e traslazione arborea."
levels.3.features.0.effects.0.options.4.name: Prateria
levels.3.features.0.effects.0.options.4.text: "Incantesimi del circolo della prateria: 3° livello, invisibilità e passare senza tracce; 5° livello, luce diurna e velocità; 7° livello, divinazione e libertà di movimento; 9° livello, piaga degli insetti e sogno."
levels.3.features.0.effects.0.options.5.name: Montagna
levels.3.features.0.effects.0.options.5.text: "Incantesimi del circolo della montagna: 3° livello, crescita di spine e movimenti del ragno; 5° livello, fondersi nella pietra e fulmine; 7° livello, pelle di pietra e scolpire pietra; 9° livello, muro di pietra e passapareti."
levels.3.features.0.effects.0.options.6.name: Palude
levels.3.features.0.effects.0.options.6.text: "Incantesimi del circolo della palude: 3° livello, freccia acida e oscurità; 5° livello, camminare sull'acqua e nube maleodorante; 7° livello, libertà di movimento e localizza creatura; 9° livello, piaga degli insetti e scrutare."
levels.6.features.0.name: Andatura sul Territorio
levels.6.features.0.text: |-
  A partire dal 6° livello, muoversi attraverso il terreno difficile non magico non richiede più un costo in movimento extra al druido. Inoltre, può passare attraverso i vegetali non magici senza esserne rallentato e senza subire danni se tali vegetali presentano spine, aculei o altri pericoli simili.

  Infine, il druido dispone di vantaggio ai tiri salvezza contro i vegetali creati magicamente o manipolati per ostacolare il movimento, come quelli creati dall'incantesimo intralciare.
levels.6.features.0.effects.0.text: Muoversi attraverso il terreno difficile non magico non ti richiede più un costo in movimento extra. Inoltre, puoi passare attraverso i vegetali non magici senza esserne rallentato e senza subire danni se tali vegetali presentano spine, aculei o altri pericoli simili.
levels.6.features.0.effects.0.note: "Gestione in gioco: il terreno difficile e i pericoli dei vegetali dipendono dalla situazione e non sono tracciati dal motore."
levels.10.features.0.name: Interdizione della Natura
levels.10.features.0.text: Quando il druido arriva al 10° livello, non può essere affascinato o spaventato dagli elementali o dai folletti ed è immune ai veleni e alle malattie.
levels.10.features.0.effects.2.text: Non puoi essere affascinato o spaventato dagli elementali o dai folletti.
levels.10.features.0.effects.2.note: "Lacuna: un'immunità a condizioni limitata agli elementali e ai folletti come fonte; la difesa non può essere circoscritta per fonte, quindi è mostrata come testo."
levels.14.features.0.name: Rifugio della Natura
levels.14.features.0.text: |-
  Quando il druido arriva al 14° livello, le creature del mondo naturale percepiscono il suo legame con la natura ed esitano ad attaccarlo. Quando una bestia o una creatura vegetale lo attacca, quella creatura deve effettuare un tiro salvezza su Saggezza contro la CD del tiro salvezza sull'incantesimo del druido. Se lo fallisce, deve scegliere un bersaglio diverso, altrimenti l'attacco manca automaticamente. Se invece lo supera, la creatura è immune a questo effetto per 24 ore.

  La creatura è consapevole di questo effetto prima di effettuare il suo attacco contro il druido.
levels.14.features.0.effects.0.text: Quando una bestia o una creatura vegetale ti attacca, quella creatura deve effettuare un tiro salvezza su Saggezza contro la CD del tiro salvezza sui tuoi incantesimi da druido. Se lo fallisce, deve scegliere un bersaglio diverso, altrimenti l'attacco manca automaticamente. Se invece lo supera, la creatura è immune a questo effetto per 24 ore. La creatura è consapevole di questo effetto prima di effettuare il suo attacco contro di te.
levels.14.features.0.effects.0.note: "Gestione in gioco: un effetto passivo risolto dal tiro salvezza dell'attaccante contro la CD del tiro salvezza sui tuoi incantesimi; sulla scheda non viene calcolato nulla oltre alla CD."
