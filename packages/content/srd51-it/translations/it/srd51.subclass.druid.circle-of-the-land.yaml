name: Circolo della Terra
levels.2.features.0.name: Trucchetto bonus
levels.2.features.0.text: Quando il druido sceglie questo circolo al 2° livello, apprende un trucchetto da druido aggiuntivo a sua scelta.
levels.2.features.0.effects.0.note: Un trucchetto da druido aggiuntivo, oltre a quelli della colonna Trucchetti conosciuti della tabella "Druido".
levels.2.features.1.name: Recupero naturale
levels.2.features.1.text: |-
  A partire dal 2° livello, il druido recupera parte della sua energia magica mettendosi seduto a meditare per entrare in comunione con la natura. Durante un riposo breve, il druido sceglie quali slot incantesimo spesi desidera recuperare. Questi slot incantesimo possono avere un livello totale pari o inferiore alla metà del livello da druido (arrotondato per eccesso) e nessuno slot può essere di livello pari o superiore al 6°. Il druido non può più utilizzare questo privilegio finché non completa un riposo lungo.

  Per esempio, un druido di 4° livello può recuperare slot incantesimo per un valore totale di due livelli. Potrà quindi recuperare uno slot di 2° livello o due slot di 1° livello.
levels.2.features.1.effects.0.name: Recupero naturale
levels.2.features.1.effects.1.name: Recupero naturale
levels.2.features.1.effects.1.trigger: durante un riposo breve
levels.2.features.1.effects.1.text: Durante un riposo breve, scegli quali slot incantesimo spesi desideri recuperare. Questi slot incantesimo possono avere un livello totale pari o inferiore alla metà del tuo livello da druido (arrotondato per eccesso) e nessuno slot può essere di livello pari o superiore al 6°.
levels.2.features.1.effects.1.onUse.0.note: Livello totale degli slot fino alla metà del tuo livello da druido (arrotondato per eccesso); nessuno slot di livello pari o superiore al 6°.
levels.3.features.0.name: Incantesimi del Circolo
levels.3.features.0.text: |-
  Grazie al suo legame mistico con la terra, il druido è in grado di lanciare alcuni particolari incantesimi. Al 3°, 5°, 7° e 9° livello, il druido può accedere agli incantesimi del circolo collegati alla terra in cui è diventato un druido. Il giocatore sceglie quel tipo di territorio (artico, costa, deserto, foresta, montagna, palude o prateria) e consulta la lista di incantesimi a esso associata.

  Una volta ottenuto l'accesso a un incantesimo del circolo, quell'incantesimo è sempre considerato preparato e non conta al fine di determinare il numero di incantesimi che il druido può preparare ogni giorno. Se il druido ottiene accesso a un incantesimo che non compare nella lista degli incantesimi da druido, quell'incantesimo è comunque considerato un incantesimo da druido per lui.

  **Artico (tabella)**

  | Livello da druido | Incantesimi del Circolo |
  |---|---|
  | 3° | blocca persone, crescita di spine |
  | 5° | lentezza, tempesta di nevischio |
  | 7° | libertà di movimento, tempesta di ghiaccio |
  | 9° | comunione con la natura, cono di freddo |

  **Costa (tabella)**

  | Livello da druido | Incantesimi del Circolo |
  |---|---|
  | 3° | immagine speculare, passo velato |
  | 5° | camminare sull'acqua, respirare sott'acqua |
  | 7° | controllare acqua, libertà di movimento |
  | 9° | evoca elementale, scrutare |

  **Deserto (tabella)**

  | Livello da druido | Incantesimi del Circolo |
  |---|---|
  | 3° | sfocatura, silenzio |
  | 5° | creare cibo e acqua, protezione dall'energia |
  | 7° | inaridire, terreno illusorio |
  | 9° | muro di pietra, piaga degli insetti |

  **Foresta (tabella)**

  | Livello da druido | Incantesimi del Circolo |
  |---|---|
  | 3° | movimenti del ragno, pelle coriacea |
  | 5° | crescita vegetale, invocare il fulmine |
  | 7° | divinazione, libertà di movimento |
  | 9° | comunione con la natura, traslazione arborea |

  **Prateria (tabella)**

  | Livello da druido | Incantesimi del Circolo |
  |---|---|
  | 3° | invisibilità, passare senza tracce |
  | 5° | luce diurna, velocità |
  | 7° | divinazione, libertà di movimento |
  | 9° | piaga degli insetti, sogno |

  **Montagna (tabella)**

  | Livello da druido | Incantesimi del Circolo |
  |---|---|
  | 3° | crescita di spine, movimenti del ragno |
  | 5° | fondersi nella pietra, fulmine |
  | 7° | pelle di pietra, scolpire pietra |
  | 9° | muro di pietra, passapareti |

  **Palude (tabella)**

  | Livello da druido | Incantesimi del Circolo |
  |---|---|
  | 3° | freccia acida, oscurità |
  | 5° | camminare sull'acqua, nube maleodorante |
  | 7° | libertà di movimento, localizza creatura |
  | 9° | piaga degli insetti, scrutare |
levels.3.features.0.effects.0.note: Scegli la terra in cui sei diventato un druido. Una volta ottenuto l'accesso a un incantesimo del circolo, quell'incantesimo è sempre considerato preparato e non conta al fine di determinare il numero di incantesimi che puoi preparare ogni giorno. Un incantesimo del circolo che non compare nella lista degli incantesimi da druido è comunque considerato un incantesimo da druido per te.
