name: Incensiere del controllo degli elementali dell'aria
text: |-
  Oggetto meraviglioso, raro

  Quando il personaggio brucia dell'incenso in questo incensiere, può usare un'azione per pronunciare la sua parola d'ordine ed evocare un elementale dell'aria, come se avesse lanciato l'incantesimo evoca elementale. L'incensiere non può essere riutilizzato in questo modo fino all'alba successiva.

  Il recipiente, largo 15 cm e alto 30 cm, somiglia a un calice chiuso da un coperchio decorato e pesa 0,5 kg.
features.0.name: Evocare un elementale dell'aria
features.0.effects.0.name: Evocare un elementale dell'aria
features.0.effects.0.text: Quando bruci dell'incenso nell'incensiere, pronuncia la sua parola d'ordine per evocare un elementale dell'aria, come se avessi lanciato l'incantesimo evoca elementale. L'incensiere non può essere riutilizzato in questo modo fino all'alba successiva.
features.0.effects.0.onUse.0.text: Compare un elementale dell'aria come per evoca elementale (nell'incensiere deve bruciare dell'incenso); consulta l'incantesimo per il controllo e la durata.
