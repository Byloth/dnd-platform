name: Dominio della Vita
levels.1.features.0.name: Competenza Bonus
levels.1.features.0.text: Quando il chierico sceglie questo dominio al 1° livello, ottiene competenza nelle armature pesanti.
levels.1.features.1.name: Discepolo della Vita
levels.1.features.1.text: A partire dal 1° livello, gli incantesimi di guarigione del chierico diventano più efficaci. Ogni volta che il chierico usa un incantesimo di 1° livello o di livello superiore per ripristinare i punti ferita di una creatura, quella creatura recupera un ammontare di punti ferita aggiuntivi pari a 2 + il livello dell'incantesimo.
levels.1.features.1.effects.0.text: Ogni volta che usi un incantesimo di 1° livello o di livello superiore per ripristinare i punti ferita di una creatura, quella creatura recupera un ammontare di punti ferita aggiuntivi pari a 2 + il livello dell'incantesimo.
levels.1.features.1.effects.0.note: "Lacuna: nessun aggancio all'evento di lancio per gli incantesimi di guarigione; aggiungi 2 + il livello dello slot alla guarigione durante il gioco."
levels.1.features.2.name: Incantesimi del Dominio della Vita (tabella)
levels.1.features.2.text: |-
  Livello da chierico | Incantesimi |
  |---|---|
  | 1° | benedizione, cura ferite |
  | 3° | arma spirituale, ristorare inferiore |
  | 5° | faro di speranza, rinascita |
  | 7° | guardiano della fede, interdizione alla morte |
  | 9° | cura ferite di massa, rianimare morti |
levels.2.features.0.name: "Incanalare Divinità: Preservare Vita"
levels.2.features.0.text: |-
  A partire dal 2° livello, il chierico può utilizzare Incanalare Divinità per curare chi è stato gravemente ferito.

  Con un'azione, il chierico brandisce il suo simbolo sacro ed evoca un flusso di energia curativa che può ripristinare un numero di punti ferita pari a cinque volte il suo livello da chierico. Sceglie le creature desiderate purché siano situate entro 9 metri da lui e suddivide questo ammontare di punti ferita tra di esse. Questo privilegio può ripristinare in una creatura un ammontare di punti ferita che la riporti a non più della metà del suo massimo dei punti ferita. Il chierico non può utilizzare questo privilegio su un costrutto o su un non morto.
levels.2.features.0.effects.0.name: "Incanalare Divinità: Preservare Vita"
levels.2.features.0.effects.0.text: Brandisci il tuo simbolo sacro ed evochi un flusso di energia curativa che può ripristinare un numero di punti ferita pari a cinque volte il tuo livello da chierico. Scegli le creature desiderate purché siano situate entro 9 metri da te e suddividi questo ammontare di punti ferita tra di esse. Questo privilegio può ripristinare in una creatura un ammontare di punti ferita che la riporti a non più della metà del suo massimo dei punti ferita. Non puoi utilizzare questo privilegio su un costrutto o su un non morto.
levels.2.features.0.effects.0.onUse.0.note: Suddividi i punti ferita tra le creature desiderate entro 9 metri; nessuna creatura oltre la metà del suo massimo dei punti ferita; non su non morti o costrutti.
levels.6.features.0.name: Guaritore Benedetto
levels.6.features.0.text: A partire dal 6° livello, gli incantesimi curativi che il chierico lancia sugli altri guariscono anche lui. Quando il chierico lancia un incantesimo di 1° livello o di livello superiore che ripristina punti ferita in una creatura diversa da lui, recupera un ammontare di punti ferita pari a 2 + il livello dell'incantesimo.
levels.6.features.0.effects.0.text: Quando lanci un incantesimo di 1° livello o di livello superiore che ripristina punti ferita in una creatura diversa da te, recuperi un ammontare di punti ferita pari a 2 + il livello dell'incantesimo.
levels.6.features.0.effects.0.note: "Lacuna: nessun aggancio all'evento di lancio per gli incantesimi di guarigione; recupera tu stesso punti ferita pari a 2 + il livello dello slot durante il gioco."
levels.8.features.0.name: Colpo Divino
levels.8.features.0.text: All'8° livello il chierico ottiene la capacità di infondere energia divina ai colpi della sua arma. Una volta per ogni suo turno, quando colpisce una creatura con un attacco con arma, il chierico può fare in modo che l'attacco infligga 1d8 danni radiosi extra al bersaglio. Una volta raggiunto il 14° livello, il danno aggiuntivo aumenta a 2d8.
levels.8.features.0.effects.0.name: Colpo Divino
levels.8.features.0.effects.0.text: Una volta per ogni tuo turno, quando colpisci una creatura con un attacco con arma, puoi fare in modo che l'attacco infligga 1d8 danni radiosi extra al bersaglio.
levels.8.features.0.effects.1.name: Colpo Divino
levels.8.features.0.effects.1.text: Una volta per ogni tuo turno, quando colpisci una creatura con un attacco con arma, puoi fare in modo che l'attacco infligga 2d8 danni radiosi extra al bersaglio.
levels.17.features.0.name: Guarigione Suprema
levels.17.features.0.text: A partire dal 17° livello, quando il chierico normalmente dovrebbe tirare uno o più dadi per ripristinare i punti ferita con un incantesimo, usa invece il numero più alto possibile per ogni dado. Ad esempio, invece di ripristinare 2d6 punti ferita a una creatura, un chierico ne ripristina 12.
levels.17.features.0.effects.0.text: Quando normalmente dovresti tirare uno o più dadi per ripristinare i punti ferita con un incantesimo, usi invece il numero più alto possibile per ogni dado.
levels.17.features.0.effects.0.note: "Lacuna: la massimizzazione dei dadi di guarigione si applica al momento del tiro, durante il gioco."
