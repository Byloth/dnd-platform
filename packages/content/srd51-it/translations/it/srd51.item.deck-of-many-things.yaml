features.0.effects.0.text: "Dichiara quante carte intendi pescare, poi pescale in maniera casuale; la magia di ogni carta ha effetto non appena viene pescata. Devi pescare ogni carta entro 1 ora dall'ultima carta pescata; se non riesci a pescare il numero di carte dichiarato, le carte restanti volano via dal mazzo e hanno effetto simultaneamente. Una carta pescata svanisce e, a eccezione della Matta e del Giullare, ricompare nel mazzo."
features.0.effects.0.onUse.0.text: "Risolvi ogni carta con il GM usando le descrizioni delle carte del mazzo; gli effetti permanenti (Eurialo: –2 ai tiri salvezza; Idiota: Intelligenza ridotta di 1d4 + 1; Luna: desiderio 1d3 volte) vanno annotati a mano."
