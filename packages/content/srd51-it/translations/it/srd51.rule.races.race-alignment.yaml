name: Allineamento
text: |-
  La maggior parte delle razze è più incline a determinati allineamenti, descritti sotto questa voce. Tali allineamenti non sono vincolanti, ma considerare il motivo per cui il tuo nano ha un allineamento caotico, ad esempio, nonostante il fatto che la maggior parte dei nani sia legale, può aiutarti a definire meglio il tuo personaggio.
