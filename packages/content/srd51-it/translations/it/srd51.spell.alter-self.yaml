name: Alterare se stesso
text: |-
  L'incantatore assume una forma differente, scegliendo al momento del lancio dell'incantesimo una delle opzioni seguenti, i cui effetti permangono per la durata dell'incantesimo. Finché l'incantesimo permane, l'incantatore può terminare un'opzione con un'azione per ottenere i benefici di un'opzione diversa.

  **Adattamento acquatico.** L'incantatore adatta il proprio corpo a un ambiente acquatico, sviluppando le branchie e una membrana tra le dita. Inoltre, può respirare sott'acqua e ottenere una velocità di nuotare pari alla sua velocità base.

  **Cambiare aspetto.** L'incantatore altera il suo aspetto, decidendo come apparire e definendo altezza, peso, lineamenti facciali, tono della voce, lunghezza dei capelli, carnagione e tratti distintivi, se lo desidera. L'incantatore può decidere di assomigliare a un membro di un'altra razza, ma le sue statistiche non subiscono modifiche. Inoltre, non può apparire come una creatura di taglia diversa dalla propria e la sua forma base rimane la stessa; per esempio, se è bipede, non può usare un incantesimo per diventare quadrupede. In qualsiasi momento per la durata dell'incantesimo, l'incantatore può usare un'azione per mutare di nuovo aspetto in questo modo.

  **Armi naturali.** L'incantatore sviluppa artigli, zanne, corna o un'altra arma naturale a sua scelta. I suoi colpi senz'armi infliggono 1d6 danni contundenti, perforanti o taglienti, secondo l'arma naturale scelta e diventa competente nei suoi colpi senz'armi. Infine, l'arma naturale è magica e l'incantatore ottiene un bonus di +1 ai tiri per colpire e ai tiri per i danni effettuati con essa.
effects.0.text: "Adattamento acquatico: l'incantatore può respirare sott'acqua e ottiene una velocità di nuotare pari alla sua velocità base."
effects.0.note: Si sceglie un'opzione al momento del lancio (con un'azione si passa a un'altra); il linguaggio delle formule non può fare riferimento alla velocità base, quindi la velocità di nuotare resta testo.
effects.1.text: "Cambiare aspetto: l'incantatore decide come apparire; le sue statistiche non subiscono modifiche. Può usare un'azione per mutare di nuovo aspetto."
effects.2.text: "Armi naturali: i colpi senz'armi dell'incantatore infliggono 1d6 danni contundenti, perforanti o taglienti, l'incantatore è competente in essi, l'arma naturale è magica e ottiene un bonus di +1 ai tiri per colpire e ai tiri per i danni effettuati con essa."
effects.2.note: Dipende dall'opzione, quindi non è espresso come modify-attacks (non esiste un vocabolario per un'opzione scelta al momento del lancio).
