name: Colpi critici
text: |-
  Quando un personaggio mette a segno un colpo critico, ha diritto a tirare dei dadi extra per i danni dell'attacco contro il bersaglio. Tira tutti i dadi di danno dell'attacco due volte e li somma. Poi aggiunge gli eventuali modificatori rilevanti come di consueto. Per velocizzare il gioco, può anche tirare tutti i dadi di danno simultaneamente.

  Per esempio, se mette a segno un colpo critico con un pugnale, tira 2d4 per i danni anziché 1d4, poi aggiunge al risultato il suo modificatore di caratteristica rilevante. Se l'attacco prevede altri dadi di danno, come per esempio nel caso del privilegio Attacco Furtivo del ladro, tira anche quei dadi due volte.
