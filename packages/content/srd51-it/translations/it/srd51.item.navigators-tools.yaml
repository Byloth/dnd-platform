name: Strumenti da navigatore
text: |-
  Questa serie di strumenti viene usata per navigare in mare. La competenza negli strumenti da navigatore consente a un personaggio di tracciare la rotta di una nave e di seguire le carte nautiche. Questi strumenti consentono inoltre a un personaggio di aggiungere il proprio bonus di competenza a ogni prova di caratteristica effettuata per evitare di smarrirsi in mare.
