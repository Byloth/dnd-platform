name: Armature medie
text: |-
  Le armature medie forniscono una maggiore protezione rispetto a quelle leggere, ma ostacolano maggiormente i movimenti. Quando un personaggio indossa un'armatura media, aggiunge il proprio modificatore di Destrezza, fino a un massimo di +2, al numero base del tipo di armatura per determinare la sua Classe Armatura.

  **_Pelle._** Questa rozza armatura è composta da un fitto strato di pelle e pelliccia. Solitamente questo tipo di armatura è indossato dai membri delle tribù barbariche, umanoidi malvagi e altri individui che non possono accedere agli strumenti e ai materiali necessari per fabbricarne di migliori.

  **_Giaco di maglia._** Un giaco di maglia, composto da anelli di metallo interconnessi, si indossa tra due strati di stoffa o di cuoio. Quest'armatura offre una certa protezione alla parte superiore del corpo e smorza il rumore degli anelli di metallo attutendolo tra i due strati esterni.

  **_Corazza a scaglie._** Quest'armatura è composta da un corpetto e da gambali (e talvolta da una gonna separata) di cuoio ed è ricoperta di pezzi di metallo leggermente sovrapposti, come le squame di un pesce. Include anche due guanti d'arme.

  **_Corazza di piastre._** Quest'armatura è composta da un pettorale di metallo montato su uno strato di cuoio flessibile. Anche se lascia le gambe e le braccia relativamente scoperte, fornisce una buona protezione degli organi vitali del portatore, con un ingombro modesto.

  **_Mezza armatura._** Una mezza armatura è composta da una serie di piastre di metallo modellate che coprono la maggior parte del corpo. Non include una protezione per le gambe, al di là di due semplici gambiere fissate da cinghie di cuoio.
