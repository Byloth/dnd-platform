name: Trova famiglio
components.m: Carbone, incenso ed erbe del valore di 10 mo da bruciare in un braciere d'ottone.
text: |-
  L'incantatore ottiene il servizio di un famiglio, uno spirito che assume la forma di un animale a sua scelta: cavalluccio marino, corvo, donnola, falco, gatto, granchio, gufo, lucertola, pesce (quipper), piovra, pipistrello, ragno, rana (rospo), serpente velenoso, topo. Il famiglio appare in uno spazio libero entro gittata, ha le statistiche della forma scelta, anche se si tratta di un celestiale, un folletto o un immondo (a scelta dell'incantatore) invece di una bestia. Il famiglio è indipendente dall'incantatore, ma obbedisce sempre ai suoi comandi. In combattimento, tira per la propria iniziativa e agisce nel proprio turno. Un famiglio non può attaccare, ma può effettuare altre azioni normalmente. Quando un famiglio scende a 0 punti ferita, scompare, non lasciando dietro di sé alcuna forma fisica e riappare quando l'incantatore lancia nuovamente questo incantesimo. Finché il famiglio si trova a 30 metri dall'incantatore, quest'ultimo può comunicare con lui telepaticamente. Inoltre, con un'azione, l'incantatore è in grado di vedere attraverso gli occhi del famiglio e sentire ciò che sente fino all'inizio del turno successivo, ottenendo i benefici di eventuali sensi speciali posseduti dal famiglio. Durante questo periodo, l'incantatore non vede o sente nulla con i propri sensi. Con un'azione, l'incantatore può temporaneamente congedare il suo famiglio, che scompare in una sacca dimensionale dove attende di essere nuovamente evocato. In alternativa, l'incantatore può farlo sparire per sempre. Con un'azione, finché il famiglio è congedato temporaneamente, l'incantatore può farlo ricomparire in uno spazio libero entro 9 metri da sé. Un incantatore non può avere più di un famiglio alla volta. Se lancia questo incantesimo mentre è già presente un famiglio, l'incantatore gli impartisce una nuova forma. L'incantatore sceglie una delle forme dalla lista soprastante e il famiglio si trasformerà nella creatura scelta. Infine, quando l'incantatore lancia un incantesimo con gittata a contatto, il suo famiglio può trasmettere l'incantesimo come se fosse stato lui a lanciarlo. Il famiglio deve trovarsi entro 30 metri dall'incantatore e deve usare la sua reazione per trasmettere l'incantesimo lanciato. Se l'incantesimo richiede un tiro per colpire, l'incantatore può utilizzare il suo modificatore di attacco per quel tiro.
onCast.0.text: Il famiglio ha le statistiche della forma animale scelta (cavalluccio marino, corvo, donnola, falco, gatto, granchio, gufo, lucertola, pesce, piovra, pipistrello, ragno, rana, serpente velenoso o topo) come celestiale, folletto o immondo; le statistiche le possiede il GM (in v0 non ci sono blocchi di statistiche). Tira per la propria iniziativa, non può attaccare e scompare a 0 punti ferita finché l'incantatore non lancia di nuovo l'incantesimo. Finché si trova entro 30 metri, l'incantatore può comunicare con lui telepaticamente; con un'azione può vedere attraverso i suoi occhi e sentire ciò che sente fino all'inizio del suo turno successivo (senza vedere o sentire nulla con i propri sensi nel frattempo), congedarlo temporaneamente o farlo ricomparire entro 9 metri da sé. Il famiglio può trasmettere un incantesimo con gittata a contatto lanciato dall'incantatore usando la sua reazione, se si trova entro 30 metri. Lanciare l'incantesimo mentre è già presente un famiglio gli impartisce una nuova forma.
