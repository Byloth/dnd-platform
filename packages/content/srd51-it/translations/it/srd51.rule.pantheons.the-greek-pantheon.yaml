name: "Pantheon greco"
text: |-
  Gli dèi dell'Olimpo si rivelano nelle onde che lambiscono dolcemente le rive del mare e nello scoppio del tuono che echeggia tra i picchi coperti di nuvole. Le fitte foreste popolate da cinghiali e i pendii delle colline coperti di ulivi testimoniano il loro passaggio. La loro presenza riecheggia in ogni aspetto della natura e, per questo, hanno conquistato un posto anche nel cuore degli uomini.
