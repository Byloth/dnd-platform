name: Anello della vista a raggi X
text: |-
  Anello, raro (richiede sintonia)

  Finché il personaggio indossa questo anello, può usare un'azione per pronunciarne la parola d'ordine. Quando lo fa, può vedere all'interno della materia solida e attraverso di essa per 1 minuto. Questo tipo di vista ha un raggio di 9 metri. Gli oggetti solidi che si trovano entro il raggio d'azione appaiono al personaggio come trasparenti e non impediscono alla luce di attraversarli. La vista può penetrare 30 cm di pietra, 2,5 centimetri di metallo comune o fino a 90 cm di legno o terriccio. Le sostanze più dense, come per esempio un sottile strato di piombo, bloccano questa forma di vista.

  Ogni volta che usa di nuovo l'anello prima di completare un riposo lungo, il personaggio deve superare un tiro salvezza su Costituzione con CD 15, altrimenti subisce un livello di indebolimento.
