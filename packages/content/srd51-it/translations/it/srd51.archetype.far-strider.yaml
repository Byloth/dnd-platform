name: Ramingo
pitch: Un segugio e arciere che conosce le terre selvagge, caccia bestie pericolose e non manca mai un colpo.
why.class: "I ranger tirano bene da lontano, seguono le tracce di qualsiasi cosa e hanno qualche incantesimo utile: un buon equilibrio tra combattimento ed esplorazione."
why.species: Un elfo aumenta la Destrezza, vede nell'oscurità ed è difficile da affascinare; un elfo alto conosce anche un trucchetto da mago.
why.abilityPriority: La Destrezza guida il tuo arco e la tua Classe Armatura; la Saggezza alimenta i tuoi incantesimi e i tuoi sensi; la Costituzione ti tiene in piedi.
why.background: Accolito, l'unico background dell'SRD, ti dà le abilità Intuizione e Religione e due linguaggi.
