name: Mazza del terrore
text: |-
  Arma (mazza), rara (richiede sintonia)

  Quest'arma magica possiede 3 cariche. Mentre la impugna, il personaggio può usare un'azione e consumare 1 carica per sprigionare un'ondata di terrore. Tutte le creature scelte dal personaggio e situate in un raggio di 9 metri da lui devono superare un tiro salvezza su Saggezza con CD 15, altrimenti diventano spaventate da lui per 1 minuto. Una creatura spaventata deve spendere i suoi turni tentando di allontanarsi il più possibile dal personaggio e non può volontariamente muoversi in uno spazio entro 9 metri da lui. Inoltre, non può effettuare reazioni. Come azione, può usare solo l'azione di Scatto o tentare di fuggire da un effetto che le impedisce di muoversi. Se non può muoversi in alcuno spazio, la creatura può usare l'azione di Schivata. Alla fine di ogni suo turno, la creatura può ripetere il tiro salvezza e, se lo supera, l'effetto per lei svanisce.

  La mazza recupera 1d3 cariche consumate all'alba di ogni giorno.
