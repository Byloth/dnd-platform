features.1.effects.0.name: Ondata di terrore
features.1.effects.0.onUse.0.note: |-
  Ogni creatura scelta dal personaggio entro 9 metri che fallisce il tiro salvezza. Mentre è spaventata in questo modo, deve allontanarsi il più possibile dal personaggio, non può volontariamente avvicinarsi entro 9 metri da lui, non può effettuare reazioni e può solo usare l'azione di Scatto (o di Schivata se non può muoversi). Ripete il tiro salvezza alla fine di ogni suo turno.
