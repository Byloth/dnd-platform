name: "Parola d'ordine"
text: |-
  Una parola d'ordine è una parola o una frase che deve essere pronunciata affinché un oggetto funzioni. Un oggetto magico che richiede una parola d'ordine non può essere attivato in un'area dove i suoni sono soppressi, come l'area di effetto di un incantesimo silenzio.
