name: "Movimento"
text: |-
  Attraversare a nuoto un fiume impetuoso, avanzare di soppiatto lungo il corridoio di un dungeon, scalare una pericolosa parete rocciosa di montagna: tutte queste forme di movimento svolgono un ruolo essenziale nelle avventure fantasy.

  Il GM può riassumere il movimento degli avventurieri senza calcolare le distanze o i tempi di viaggio in modo esatto: "Attraversate la foresta e giungete all'ingresso del dungeon a tarda sera del terzo giorno". Anche all'interno di un dungeon, specialmente se si tratta di un dungeon molto grande o di un complesso di caverne, il GM può riassumere i movimenti tra un incontro e l'altro: "Dopo avere ucciso il guardiano all'ingresso dell'antica roccaforte nanica, consultate la vostra mappa, che vi conduce attraverso chilometri e chilometri di corridoi deserti fino a un vasto baratro attraversato da un'esile arcata di pietra".

  Tuttavia, a volte è importante sapere quanto tempo passa per spostarsi da un punto all'altro, che la risposta sia in giorni, ore o minuti. Le regole per determinare i tempi di viaggio dipendono da due fattori: la velocità e il passo di viaggio delle creature che si muovono, e il terreno su cui si muovono.
