name: Muro di pietra
components.m: Un piccolo blocco di granito.
text: |-
  Un muro non magico di solida pietra si materializza in un punto a scelta dell'incantatore situato entro gittata. Il muro è spesso 15 cm ed è composto da dieci pannelli con lato di 3 metri, ognuno dei quali dev'essere contiguo ad almeno un altro pannello. In alternativa, l'incantatore può creare pannelli di 3 metri per 6 metri spessi solo 8 cm. Se, nel momento in cui appare, il muro passa attraverso lo spazio di una creatura, questa viene spinta da un lato del muro a scelta dell'incantatore. Se una creatura rischia di trovarsi circondata su tutti i lati dal muro (o dal muro e un'altra superficie solida) può effettuare un tiro salvezza su Destrezza. In caso di successo, può usare la sua reazione per muoversi fino alla sua velocità massima nel tentativo di non rimanere intrappolata dal muro. Il muro può avere la forma desiderata dall'incantatore, ma non può occupare lo stesso spazio di una creatura o un oggetto. Non è necessario che sia verticale o poggi su fondamenta solide, deve tuttavia fondersi ed essere saldamente appoggiato a un blocco di pietra già esistente. È quindi possibile usare questo incantesimo per creare una rampa o realizzare un ponte che attraversi un baratro. Se l'incantatore crea una campata di lunghezza superiore a 6 metri, deve dimezzare le dimensioni di ogni pannello per creare dei sostegni. Può inoltre modellare rozzamente il muro per creare feritoie, parapetti e così via. Il muro è un oggetto in pietra che può essere danneggiato e quindi sfondato. Ogni pannello possiede CA 15 e 30 punti ferita per ogni 2,5 cm di spessore. Quando un pannello scende a 0 punti ferita, viene distrutto e potrebbe causare il crollo dei pannelli collegati, a discrezione del GM. Se l'incantatore mantiene la concentrazione su questo incantesimo per l'intera durata, il muro diventa permanente e non può essere dissolto. In caso contrario, il muro scompare al termine dell'incantesimo.
