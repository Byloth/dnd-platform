name: Desiderio
text: |-
  Desiderio è l'incantesimo più potente che una creatura mortale sia in grado di lanciare. Pronunciando semplicemente il proprio desiderio ad alta voce, l'incantatore altera le fondamenta stesse della realtà in base a ciò che desidera. L'uso base di questo incantesimo è riprodurre un qualsiasi altro incantesimo di livello pari o inferiore all'8°. L'incantatore non deve rispettarne i requisiti, inclusi eventuali componenti costosi: l'incantesimo ha semplicemente effetto. In alternativa, l'incantatore può creare uno dei seguenti effetti a sua scelta:
  - L'incantatore crea un oggetto del valore massimo di 25.000 mo che non sia un oggetto magico e che non misuri più di 90 metri in ogni dimensione. L'oggetto si materializza a terra in uno spazio libero che l'incantatore è in grado di vedere.
  - L'incantatore consente a un massimo di venti creature che è in grado di vedere di recuperare tutti i punti ferita e pone fine a tutti gli effetti su di loro come descritto nell'incantesimo ristorare superiore.
  - L'incantatore conferisce a un massimo di dieci creature che è in grado di vedere resistenza a un tipo di danno a sua scelta.
  - L'incantatore conferisce a un massimo di dieci creature che è in grado di vedere immunità a un singolo incantesimo o un altro effetto magico per 8 ore. Per esempio, potrebbe rendere se stesso e tutti i suoi compagni immuni all'attacco Risucchio di vita di un lich.
  - L'incantatore annulla un singolo evento recente imponendo la ripetizione di un qualsiasi tiro effettuato entro l'ultimo round (incluso il suo ultimo turno). La realtà viene rimodellata e si adatta al nuovo risultato. Per esempio, un incantesimo desiderio potrebbe annullare il tiro salvezza superato di un avversario, il colpo critico di un nemico o un tiro salvezza fallito di un amico. L'incantatore può imporre che il tiro ripetuto sia effettuato con vantaggio o svantaggio e poi può scegliere se usare il tiro ripetuto o il tiro originale.
  L'incantatore potrebbe essere in grado di realizzare qualcosa che vada oltre gli esempi elencati sopra, dichiarando il suo desiderio al GM nel modo più preciso possibile. Il GM ha la massima libertà di decidere cosa accade in questi casi: più potente è il desiderio, maggiori sono le probabilità che qualcosa vada storto. L'incantesimo potrebbe semplicemente fallire, l'effetto desiderato potrebbe avverarsi solo in parte o l'incantatore potrebbe subire conseguenze inaspettate come risultato della formulazione del desiderio. Per esempio, se desidera che un suo nemico sia morto, potrebbe essere trascinato nel futuro fino al momento in cui quel nemico non è più in vita, venendo a tutti gli effetti rimosso dal gioco. Analogamente, se desidera un manufatto o un oggetto magico leggendario, potrebbe essere trasportato istantaneamente in presenza del suo attuale proprietario. La tensione provocata dal lancio di questo incantesimo per produrre un qualsiasi effetto diverso dalla duplicazione di un altro incantesimo debilita l'incantatore. Dopo aver sopportato quella tensione, ogni volta che l'incantatore lancia un incantesimo prima di avere completato un riposo lungo, subisce 1d10 danni necrotici per livello di quell'incantesimo. Questi danni non possono essere ridotti o prevenuti in alcun modo. Inoltre, la Forza dell'incantatore scende a 3, se non è già pari o inferiore a 3, per 2d4 giorni. Per ognuno di quei giorni trascorso a riposare e a non fare nulla fuorché attività poco impegnative, il tempo di recupero rimanente diminuisce di 2 giorni. Esiste infine una probabilità del 33% che l'incantatore non sia più in grado di lanciare desiderio, se non riesce a reggere la tensione.
