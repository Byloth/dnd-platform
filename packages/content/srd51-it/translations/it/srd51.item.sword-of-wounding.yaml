name: Spada del ferimento
text: |-
  Arma (qualsiasi spada), rara (richiede sintonia)

  I punti ferita persi a causa dei danni inferti da questa spada possono essere recuperati solo tramite un riposo breve o lungo, e non tramite rigenerazione, magia o qualsiasi altro metodo.

  Una volta per turno, quando colpisce una creatura con un attacco sferrato con quest'arma magica, il personaggio può decidere di ferire il bersaglio. All'inizio di ogni turno della creatura ferita, essa subisce 1d4 danni necrotici per ogni volta in cui il personaggio l'ha ferita; può poi effettuare un tiro salvezza su Costituzione con CD 15 per porre fine all'effetto di tutte le ferite che ha ricevuto in caso di successo. In alternativa, la creatura ferita o un'altra creatura entro 1,5 metri da essa può usare un'azione per effettuare una prova di Saggezza (Medicina) con CD 15, terminando l'effetto delle ferite in caso di successo.
features.0.name: Arma magica
features.0.effects.0.note: Qualsiasi spada; quest'oggetto non ha proprietà di un'arma base proprie.
