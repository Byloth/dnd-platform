name: Bacchetta di individuazione dei nemici
text: |-
  Bacchetta, rara (richiede sintonia)

  Questa bacchetta possiede 7 cariche. Mentre il personaggio la impugna, può usare un'azione e spendere 1 carica per pronunciarne la parola d'ordine. Durante il minuto successivo, il personaggio conosce la direzione della creatura ostile a lui più vicina e situata entro 18 metri da lui, ma non la sua distanza precisa. La bacchetta può percepire la presenza di creature ostili eteree, invisibili, camuffate o nascoste, oltre a quelle in piena vista. L'effetto termina se il personaggio smette di impugnare la bacchetta.

  All'alba di ogni giorno, la bacchetta recupera 1d6 + 1 cariche consumate. Se il personaggio consuma l'ultima carica, deve tirare un d20: se ottiene 1, la bacchetta diventa cenere e viene distrutta.
