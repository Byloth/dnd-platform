name: Attrezzi da scalatore
text: Gli attrezzi da scalatore includono chiodi da rocciatore speciali, punte per stivali, guanti e un'imbragatura. Con un'azione, un personaggio può usare questi strumenti per ancorarsi; quando lo fa, non può cadere per più di 7,5 metri dal punto in cui si è ancorato e non può arrampicarsi per più di 7,5 metri da quel punto senza disfare l'ancoraggio.
