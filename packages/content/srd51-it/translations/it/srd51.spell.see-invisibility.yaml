name: Vedere invisibilità
components.m: Un pizzico di talco e una spolverata di polvere d'argento.
text: |-
  Per la durata dell'incantesimo, l'incantatore è in grado di vedere le creature e gli oggetti invisibili come se fossero visibili e proiettare la sua vista sul Piano Etereo. Le creature e gli oggetti eterei gli appaiono spettrali e trasparenti.
