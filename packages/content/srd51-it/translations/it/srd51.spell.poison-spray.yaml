name: Spruzzo velenoso
text: L'incantatore allunga la mano verso una creatura entro gittata che è in grado di vedere e proietta uno sbuffo di gas velenoso dal suo palmo. La creatura deve superare un tiro salvezza su Costituzione, altrimenti subisce 1d12 danni da veleno.
higherLevel: I danni dell'incantesimo aumentano di 1d12 quando l'incantatore raggiunge il 5° livello (2d12), l'11° livello (3d12) e il 17° livello (4d12).
