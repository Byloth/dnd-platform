name: "I piani di esistenza"
text: |-
  Il cosmo pullula di una moltitudine di mondi e una miriade di dimensioni alternative della realtà, chiamate piani di esistenza. Abbraccia ogni mondo in cui i GM conducono le loro avventure, all'interno del reame relativamente realistico del Piano Materiale. Oltre quel piano si celano domini di materia ed energia elementale, reami di puro pensiero ed ethos, dimore di demoni e angeli, e domini degli dèi.

  Molti incantesimi e oggetti magici sono in grado di trarre energia da questi piani, evocare le creature che vi risiedono, comunicare con i loro abitanti e consentire agli avventurieri di recarvisi. Quando un personaggio raggiunge l'apice del suo potere e i livelli più alti, potrebbe percorrere vie fatte di fuoco solido o dimostrare il suo valore su un campo di battaglia dove i caduti tornano in vita a ogni alba.
