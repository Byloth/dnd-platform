name: Trappole complesse
text: |-
  Le trappole complesse funzionano come quelle normali, con la differenza che una volta attivate eseguono una serie di azioni per round. Una trappola complessa trasforma la procedura per contrastarla in qualcosa di più simile a un incontro di combattimento.

  Quando una trappola complessa viene attivata, tira per l'iniziativa (la sua descrizione include un bonus di iniziativa). Nel suo turno, la trappola si attiva di nuovo, spesso effettuando un'azione: potrebbe sferrare ulteriori attacchi contro gli intrusi, creare un effetto che cambia nel tempo o produrre una sfida dinamica di tipo diverso. In ogni caso, la trappola complessa può comunque essere rilevata e disinnescata, oppure oltrepassata nei soliti modi.

  Per esempio, una trappola che inonda gradualmente una stanza funziona meglio come trappola complessa: nel suo turno, il livello dell'acqua sale. Dopo alcuni round, la stanza è completamente sommersa.
