name: "Veleno di drow"
text: |-
  Questo veleno è solitamente prodotto soltanto dai drow e solo in un luogo lontano dalla luce del sole. Una creatura vittima di questo veleno deve superare un tiro salvezza su Costituzione con CD 13, altrimenti viene avvelenata per 1 ora. Se il tiro salvezza fallisce di 5 o più, la creatura avvelenata rimane anche priva di sensi e si risveglia se subisce danni o se un'altra creatura usa un'azione per svegliarla scuotendola.

  **_Ferimento._** I veleni da ferimento possono essere applicati ad armi, munizioni, componenti di trappole e altri oggetti che infliggono danni taglienti o perforanti e rimangono attivi finché non vengono a contatto con una ferita o lavati via. Una creatura che subisce danni taglienti o perforanti da un oggetto rivestito di veleno ne subisce gli effetti.
