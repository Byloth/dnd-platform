name: Comunione
components.m: Incenso e una fiala di acqua santa o sacrilega.
text: |-
  L'incantatore entra in contatto con la sua divinità o un emissario divino e, prima della fine dell'incantesimo, pone fino a tre domande a cui è possibile rispondere con sì o no. L'incantatore riceve una risposta corretta per ogni domanda. Gli esseri divini non sono necessariamente onniscienti, quindi l'incantatore potrebbe ricevere "ignoto" come risposta se una domanda riguarda informazioni che vanno oltre le loro conoscenze. Nel caso in cui una risposta di una parola sola possa rivelarsi fuorviante o contraria agli interessi della divinità, il GM può fornire come risposta una breve frase. Se l'incantatore lancia l'incantesimo due o più volte prima di completare il suo riposo lungo successivo, esiste una probabilità cumulativa del 25% di non ottenere risposta per ogni lancio dopo il primo. Il GM effettua questo tiro in segreto.
