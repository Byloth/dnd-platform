name: "Telepatia"
text: |-
  La telepatia è un'abilità magica che consente a un mostro di comunicare mentalmente con un'altra creatura entro un raggio specificato. Non è necessario che la creatura contattata condivida un linguaggio con il mostro al fine di comunicare, ma essa dev'essere in grado di capire almeno un linguaggio. Una creatura priva di telepatia può ricevere i messaggi telepatici e rispondervi, ma non può avviare o terminare una conversazione telepatica.

  Un mostro telepatico non ha bisogno di vedere la creatura da contattare e può terminare il contatto telepatico in qualsiasi momento. Il contatto si interrompe non appena le due creature non si trovano più entro il raggio l'una dall'altra o se il mostro telepatico contatta un'altra creatura nel raggio. Un mostro telepatico può avviare o terminare una conversazione telepatica senza usare un'azione, ma finché è incapacitato non può avviare un contatto telepatico e quelli in corso vengono terminati.

  Una creatura all'interno dell'area di un *campo anti-magia* o in qualsiasi altro luogo in cui la magia non funziona non può inviare o ricevere messaggi telepatici.
