name: Corazza ad anelli
text: |-
  È un'armatura di cuoio su cui sono stati cuciti dei pesanti anelli di metallo che rinforzano l'armatura contro i colpi di spada e ascia. Una corazza ad anelli è inferiore a una cotta di maglia e solitamente è indossata soltanto da coloro che non possono permettersi un'armatura migliore.
