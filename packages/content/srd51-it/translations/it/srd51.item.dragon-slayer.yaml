name: "Ammazzadraghi"
text: |-
  Arma (qualsiasi spada), rara

  Il personaggio ottiene un bonus di +1 ai tiri per colpire e ai tiri per i danni effettuati con quest'arma magica.

  Quando il personaggio colpisce un drago con quest'arma, il drago subisce 3d6 danni extra del tipo inflitto dall'arma. Ai fini di quest'arma, per "drago" si intende qualsiasi creatura del tipo drago, incluse le testuggini dragone e le viverne.
features.0.name: "Bonus di +1"
features.1.name: "Uccisione dei draghi"
features.1.effects.0.note: "Solo quando colpisci un drago (qualsiasi creatura del tipo drago, incluse le testuggini dragone e le viverne): 3d6 danni extra del tipo inflitto dall'arma."
