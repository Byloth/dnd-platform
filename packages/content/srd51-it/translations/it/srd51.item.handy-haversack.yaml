name: Zainetto pratico
text: |-
  Oggetto meraviglioso, raro

  Questo zaino è dotato di una tasca centrale e due laterali, che si aprono su altrettanti spazi extradimensionali. Ognuna delle tasche laterali può custodire fino a 10 kg di materiale, per un volume che non superi 2 cubi con spigolo di 30 cm. La tasca centrale, più grande, può custodire oggetti per un volume massimo pari a 8 cubi con spigolo di 30 cm o del peso di 40 kg. Lo zaino pesa sempre 2,5 kg, a prescindere dal contenuto.

  Per inserire un oggetto nello zainetto, si applicano le normali regole relative alle interazioni con gli oggetti. Per recuperare un oggetto dallo zainetto, il personaggio deve usare un'azione. Quando fruga nello zainetto alla ricerca di un oggetto specifico, questo si trova sempre magicamente in cima.

  Lo zainetto ha alcune limitazioni. Se viene caricato eccessivamente o se un oggetto acuminato lo buca o lo strappa, lo zainetto si rompe ed è distrutto. Se lo zainetto viene distrutto, gli oggetti contenuti al suo interno sono perduti per sempre, anche se un manufatto prima o poi rispunterà fuori da qualche altra parte. Se lo zainetto viene rivoltato, tutto ciò che conteneva cade a terra senza danneggiarsi, ma lo zainetto deve essere rivoltato di nuovo per poter essere riutilizzato. Se nello zainetto viene fatta entrare una creatura che necessita di respirare, quella creatura può sopravvivere per un massimo di 10 minuti, dopodiché inizia a soffocare.

  Collocare uno zainetto all'interno di uno spazio extradimensionale, come quello creato da una borsa conservante, un buco portatile o da altri oggetti simili, distrugge istantaneamente entrambi gli oggetti e apre un portale sul Piano Astrale. Il portale ha origine nel punto in cui uno dei due oggetti è stato inserito nell'altro. Tutte le creature entro 3 metri dal portale vengono attirate al suo interno e depositate in un luogo casuale del Piano Astrale, dopodiché il portale si chiude. Il portale è a senso unico e non può essere riaperto.
