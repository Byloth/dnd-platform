name: Vincolo di interdizione
components.m: Un paio di anelli di platino del valore di almeno 50 mo ciascuno, che l'incantatore e il bersaglio devono indossare per la durata dell'incantesimo.
text: |-
  Questo incantesimo protegge una creatura consenziente toccata dall'incantatore e crea tra i due un legame mistico che permane finché l'incantesimo non termina. Finché il bersaglio si trova entro 18 metri dall'incantatore, ottiene un bonus di +1 alla CA e ai tiri salvezza e resistenza a tutti i danni. Inoltre, ogni volta che subisce danni, l'incantatore ne subisce la stessa quantità. L'incantesimo termina se l'incantatore scende a 0 punti ferita, se lui e il bersaglio si allontanano per più di 18 metri o se l'incantesimo viene lanciato di nuovo su una delle due creature collegate. Inoltre, l'incantatore può interrompere l'incantesimo con un'azione.
effects.0.note: Finché si trova entro 18 metri dall'incantatore.
effects.1.note: Finché si trova entro 18 metri dall'incantatore.
effects.2.note: Tutti i danni, finché si trova entro 18 metri dall'incantatore.
effects.3.text: |-
  Ogni volta che il bersaglio subisce danni, l'incantatore ne subisce la stessa quantità. L'incantesimo termina se l'incantatore scende a 0 punti ferita, se i due si allontanano per più di 18 metri, se l'incantesimo viene lanciato di nuovo su uno dei due o se l'incantatore lo interrompe con un'azione.
