name: Guaritore risoluto
pitch: Un robusto servitore di un dio che indossa un'armatura pesante, cura i feriti e tiene in vita il gruppo.
why.class: "Un chierico del Dominio della Vita è il miglior guaritore del gioco, indossa l'armatura pesante e combatte comunque bene: ogni gruppo è felice di averne uno."
why.species: "Un nano delle colline aumenta la Saggezza e la Costituzione e ottiene punti ferita extra a ogni livello: difficile da abbattere."
why.abilityPriority: La Saggezza alimenta i tuoi incantesimi e le tue cure; la Costituzione ti dà punti ferita; la Forza ti permette di indossare un'armatura pesante senza essere rallentato.
why.subclass: Il Dominio della Vita rende più potente ogni incantesimo di guarigione e ti permette di indossare l'armatura pesante.
why.background: Accolito, l'unico background dell'SRD, ti dà le abilità Intuizione e Religione e due linguaggi.
