name: Scuola di Invocazione
levels.2.features.0.name: Invocatore Sapiente
levels.2.features.0.text: A partire da quando il mago sceglie questa scuola al 2° livello, il tempo e il denaro che egli deve spendere per copiare un incantesimo di invocazione nel suo libro degli incantesimi sono dimezzati.
levels.2.features.0.effects.0.text: |-
  Il tempo e il denaro che devi spendere per copiare un incantesimo di invocazione nel tuo libro degli incantesimi sono dimezzati.
levels.2.features.0.effects.0.note: |-
  La copiatura degli incantesimi in un libro degli incantesimi (vedi "Il libro degli incantesimi del mago") si risolve durante il gioco; nessun tipo nel catalogo.
levels.2.features.1.name: Plasmare Incantesimi
levels.2.features.1.text: A partire dal 2° livello, il mago è in grado di creare delle sacche di relativa sicurezza all'interno degli effetti dei suoi incantesimi di invocazione. Quando il mago lancia un incantesimo di invocazione che influenza le altre creature che è in grado di vedere, può scegliere un numero di quelle creature pari a 1 + il livello dell'incantesimo. Le creature scelte superano automaticamente i loro tiri salvezza contro l'incantesimo e non subiscono alcun danno se normalmente subirebbero la metà dei danni in caso di tiro salvezza superato.
levels.2.features.1.effects.0.text: Quando lanci un incantesimo di invocazione che influenza le altre creature che sei in grado di vedere, puoi scegliere un numero di quelle creature pari a 1 + il livello dell'incantesimo. Le creature scelte superano automaticamente i loro tiri salvezza contro l'incantesimo e non subiscono alcun danno se normalmente subirebbero la metà dei danni in caso di tiro salvezza superato.
levels.2.features.1.effects.0.note: Risparmiare le creature scelte dai tuoi incantesimi di invocazione avviene al lancio, contro altre creature, cosa che il motore di gioco non modella.
levels.6.features.0.name: Trucchetto Potente
levels.6.features.0.text: A partire dal 6° livello, i trucchetti del mago che infliggono danni possono influenzare perfino le creature che altrimenti eviterebbero il grosso dell'effetto. Quando una creatura supera un tiro salvezza contro un trucchetto del mago, quella creatura subisce la metà dei danni del trucchetto (se previsti), ma non subisce alcun effetto aggiuntivo da quel trucchetto.
levels.6.features.0.effects.0.text: Quando una creatura supera un tiro salvezza contro un tuo trucchetto, quella creatura subisce la metà dei danni del trucchetto (se previsti), ma non subisce alcun effetto aggiuntivo da quel trucchetto.
levels.6.features.0.effects.0.note: La metà dei danni in caso di tiro salvezza superato contro i tuoi trucchetti si risolve sul tiro salvezza del bersaglio, che il motore di gioco non modella.
levels.10.features.0.name: Invocazione potente
levels.10.features.0.text: A partire dal 10° livello, il mago può aggiungere il suo modificatore di Intelligenza a un tiro per i danni di un qualsiasi incantesimo di invocazione da mago da lui lanciato.
levels.10.features.0.effects.0.note: Solo a un tiro per i danni di un incantesimo di invocazione da mago che lanci; il bonus non può essere limitato a una scuola, quindi ignoralo per gli altri incantesimi.
levels.14.features.0.name: Saturazione Magica
levels.14.features.0.text: |-
  A partire dal 14° livello, il mago può intensificare il potere dei suoi incantesimi più semplici. Quando lancia un incantesimo da mago compreso tra il 1° e il 5° livello che infligge danni, può infliggere il massimo dei danni con quell'incantesimo.

  La prima volta che il mago lo fa, non subisce alcun effetto avverso. Se però utilizza questo privilegio di nuovo prima di avere completato un riposo lungo, subisce 2d12 danni necrotici per ogni livello dell'incantesimo in questione, subito dopo averlo lanciato. Ogni volta che utilizza di nuovo questo privilegio prima di avere completato un riposo lungo, i danni necrotici per livello dell'incantesimo aumentano di 1d12. Questi danni ignorano le varie forme di resistenza e immunità.
levels.14.features.0.effects.0.name: Utilizzi di Saturazione Magica
levels.14.features.0.effects.0.note: Conta quante volte hai usato Saturazione Magica dal tuo ultimo riposo lungo; i danni necrotici aumentano a ogni uso dopo il primo.
levels.14.features.0.effects.1.name: Saturazione Magica
levels.14.features.0.effects.1.text: Quando lanci un incantesimo da mago compreso tra il 1° e il 5° livello che infligge danni, puoi infliggere il massimo dei danni con quell'incantesimo. La prima volta che lo fai, non subisci alcun effetto avverso. Se però utilizzi questo privilegio di nuovo prima di avere completato un riposo lungo, subisci 2d12 danni necrotici per ogni livello dell'incantesimo in questione, subito dopo averlo lanciato. Ogni volta che utilizzi di nuovo questo privilegio prima di avere completato un riposo lungo, i danni necrotici per livello dell'incantesimo aumentano di 1d12. Questi danni ignorano le varie forme di resistenza e immunità.
levels.14.features.0.effects.1.onUse.0.text: "L'incantesimo infligge il massimo dei danni. Se non è il tuo primo uso dall'ultimo riposo lungo, subisci danni necrotici subito dopo il lancio: 2d12 per livello dell'incantesimo al secondo uso, 3d12 per livello al terzo, e così via. Questi danni ignorano le varie forme di resistenza e immunità."
levels.14.features.0.effects.1.note: I danni crescenti che subisci dipendono dal numero di usi e dal livello dell'incantesimo, che un effetto di gioco non sa ancora calcolare; tirali a mano in base al contatore.
text: |-
  Lo studio della magia accademica risale ai tempi in cui i primi mortali scoprirono la magia. È un elemento saldamente radicato nei mondi dei giochi di ruolo fantasy e vanta diverse tradizioni dedicate al suo complesso studio.

  Le tradizioni arcane più diffuse nel multiverso si basano sulle scuole di magia. Nel corso dei secoli i maghi hanno catalogato migliaia di incantesimi, ripartendoli in otto gruppi chiamati "scuole". In alcuni luoghi, queste tradizioni hanno dato origine a scuole vere e proprie. In altre istituzioni le scuole sono più simili alle facoltà universitarie, dove le cattedre rivali competono tra loro per accaparrarsi studenti e fondi. Anche i maghi che istruiscono i loro apprendisti nella solitudine delle loro torri personali fanno uso della ripartizione degli incantesimi in scuole come strumento didattico, in quanto gli incantesimi delle varie scuole richiedono tecniche diverse per essere padroneggiati.

  Un invocatore concentra i suoi studi sulle magie che generano potenti effetti elementali come un freddo pungente, una fiamma incandescente, un rombo di tuono, un fulmine crepitante o un acido sfrigolante. Alcuni invocatori prestano servizio nelle forze militari come unità di artiglieria in grado di colpire gli eserciti nemici da lontano. Altri usano i loro straordinari poteri per proteggere i deboli, mentre altri ancora vanno in cerca di profitto come banditi, avventurieri o aspiranti tiranni.
