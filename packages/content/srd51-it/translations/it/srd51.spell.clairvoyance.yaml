name: Chiaroveggenza
components.m: Un focus del valore di almeno 100 mo, a scelta tra un cornetto acustico incastonato di gemme o un occhio di vetro per la vista.
text: |-
  L'incantatore crea un sensore invisibile entro gittata in un luogo a lui familiare (cioè che ha già visitato o visto), oppure in un luogo comune a lui non familiare (come per esempio dietro una porta, dietro un angolo o in un boschetto). Il sensore rimane in quella posizione per tutta la durata dell'incantesimo e non è possibile attaccarlo o interagire in altri modi con esso. Quando lancia l'incantesimo, l'incantatore sceglie tra vista e udito, potendo utilizzare il senso scelto attraverso il sensore come se si trovasse nel suo spazio. Con un'azione, l'incantatore può passare dalla vista all'udito e viceversa. Una creatura che può vedere il sensore (per esempio una creatura che beneficia di vedere invisibilità o vista pura) scorge una sfera luminosa e intangibile grande quanto il pugno dell'incantatore.
