name: Mantello distorcente
text: |-
  Oggetto meraviglioso, raro (richiede sintonia)

  Quando il personaggio indossa questo mantello proietta un'illusione che lo fa apparire in un punto diverso da quello in cui si trova in realtà. Di conseguenza, tutte le creature subiscono svantaggio ai tiri per colpire contro di lui. Se il personaggio subisce danni, la proprietà smette di funzionare fino all'inizio del suo turno successivo. Questa proprietà è soppressa finché il personaggio è incapacitato, trattenuto o impossibilitato a muoversi in altri modi.
features.0.name: Distorsione
features.0.effects.0.text: Tutte le creature subiscono svantaggio ai tiri per colpire contro di te. Se subisci danni, la proprietà smette di funzionare fino all'inizio del tuo turno successivo. Questa proprietà è soppressa finché sei incapacitato, trattenuto o impossibilitato a muoverti in altri modi.
features.0.effects.0.note: Lo svantaggio agli attacchi contro di te lo applica chi attacca; la scheda si limita a ricordartelo.
