name: Comprensione dei linguaggi
components.m: Un pizzico di fuliggine e di sale.
text: |-
  Per la durata dell'incantesimo, l'incantatore comprende il significato letterale di qualsiasi linguaggio parlato che è in grado di sentire. L'incantatore comprende inoltre ogni linguaggio scritto che è in grado di vedere, ma deve toccare la superficie su cui sono scritte le parole. È necessario circa 1 minuto per leggere una pagina di testo. Questo incantesimo non decodifica i messaggi segreti di un testo o di un glifo, come un sigillo arcano, che non faccia parte di un linguaggio scritto.
