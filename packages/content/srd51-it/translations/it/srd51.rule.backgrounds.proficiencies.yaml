name: "Competenze"
text: |-
  Ogni background fornisce a un personaggio competenza in due abilità (descritte in "Usare i Punteggi di Caratteristica").

  Inoltre, la maggior parte dei background fornisce a un personaggio competenza in uno o più strumenti (descritti in "Equipaggiamento").

  Se un personaggio ottiene la stessa competenza da due fonti diverse, può invece scegliere una competenza diversa dello stesso tipo (abilità o strumento).
