name: "Più oggetti dello stesso tipo"
text: |-
  È sufficiente usare il buon senso per decidere se è possibile indossare più oggetti magici di un determinato tipo. Normalmente un personaggio non può indossare più di un paio di calzature, un paio di guanti (normali o d'arme), un paio di bracciali, un'armatura, un copricapo e un mantello. Il GM può concedere qualche eccezione: un personaggio, per esempio, potrebbe indossare un diadema sotto un elmo o due mantelli uno sopra l'altro.
