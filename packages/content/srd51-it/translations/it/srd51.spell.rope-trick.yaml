name: Trucco della corda
components.m: Estratto di mais in polvere e un pezzo di pergamena intrecciato.
text: |-
  L'incantatore tocca un pezzo di corda della lunghezza massima di 18 metri. Un'estremità della corda sale in aria finché non pende perpendicolarmente al terreno. All'estremità superiore della corda, si apre un'entrata invisibile verso uno spazio extradimensionale che permane fino al termine dell'incantesimo. Lo spazio extradimensionale può essere raggiunto arrampicandosi in cima alla corda e può contenere un massimo di otto creature di taglia Media o inferiore. La corda può essere ritratta all'interno dello spazio, facendola sparire dalla vista di chi osserva dall'esterno. Gli attacchi e gli incantesimi non possono attraversare lo spazio extradimensionale in entrata o uscita, ma coloro che si trovano all'interno possono vedere all'esterno come da una finestra di 90 cm per 1,5 metri centrata sulla corda. Tutto ciò che si trova all'interno dello spazio extradimensionale cade all'esterno al termine dell'incantesimo.
