levels.14.features.0.effects.1.text: Quando colpisci una creatura con un attacco, puoi utilizzare questo privilegio per trascinare istantaneamente il bersaglio sui piani inferiori. La creatura scompare e sfreccia attraverso un territorio da incubo. Alla fine del tuo turno successivo, il bersaglio torna nello spazio che occupava in precedenza, o nello spazio libero più vicino. Se il bersaglio non è un immondo, subisce 10d10 danni psichici in quanto resta sconvolto da questa esperienza terrificante.
levels.14.features.0.effects.1.onUse.0.text: Il bersaglio scompare fino alla fine del tuo turno successivo, poi torna nel suo spazio (o nello spazio libero più vicino).
levels.14.features.0.effects.1.onUse.1.note: Inflitti quando il bersaglio torna alla fine del tuo turno successivo, solo se non è un immondo.
text: |-
  Gli esseri che fungono da patroni per i warlock sono potenti entità che risiedono su altri piani di esistenza; pur non essendo divinità vere e proprie, il loro potere rasenta il divino. Ogni patrono può fornire a un warlock l'accesso a poteri e suppliche di natura diversa e si aspetta di ricevere favori significativi in cambio.

  Alcuni patroni accumulano numerosi warlock, elargiscono le loro conoscenze mistiche con disinvoltura o si vantano della loro abilità nel vincolare i mortali al loro volere. Altri patroni concedono il loro potere soltanto con riluttanza e potrebbero decidere di stipulare un patto con un solo warlock. Due warlock al servizio dello stesso patrono potrebbero considerarsi alleati, fratelli o rivali.

  Il warlock ha stipulato un patto con un immondo dei piani inferiori di esistenza, un essere le cui mire rimangono malvagie, anche se il warlock vi si oppone. Le creature come l'Immondo bramano la corruzione o la distruzione di tutte le cose, e questo prima o poi includerà anche il warlock. Gli immondi sufficientemente potenti da stipulare un patto includono i signori dei demoni come Demogorgon, Orcus, Fraz-Urb'luu e Baphomet, gli arcidiavoli come Asmodeus, Dispater, Mefistofele e Belial, i diavoli delle fosse e i balor di particolare potenza, gli ultroloth e gli altri signori degli yugoloth.

  ### I Doni del Patto

  Ogni opzione di Dono del Patto genera una creatura o un oggetto speciale, che riflette la natura del patrono del warlock.

  ***Patto della Catena.*** Il famiglio del warlock è più intelligente dei famigli normali. La sua forma standard può riflettere l'essenza del suo patrono: gli imp e i quasit sono collegati all'Immondo.

  ***Patto della Lama.*** Se il warlock serve l'Immondo, la sua arma potrebbe essere un'ascia fatta di metallo nero e decorata con simboli fiammeggianti.

  ***Patto del Tomo.*** Il Libro delle Ombre del warlock potrebbe essere un poderoso tomo rilegato in pelle demoniaca e borchie metalliche, pieno di incantesimi di evocazione e informazioni proibite sulle più sinistre regioni del cosmo, in quanto dono dell'Immondo.
