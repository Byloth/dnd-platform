name: "L'Immondo"
levels.1.features.0.name: "Benedizione dell'Oscuro"
levels.1.features.0.text: "A partire dal 1° livello, quando il warlock porta una creatura ostile a 0 punti ferita, ottiene un ammontare di punti ferita temporanei pari al proprio modificatore di Carisma + il proprio livello da warlock (minimo 1)."
levels.1.features.0.effects.0.name: "Benedizione dell'Oscuro"
levels.1.features.0.effects.0.trigger: "Quando porti una creatura ostile a 0 punti ferita."
levels.1.features.0.effects.0.text: "Quando porti una creatura ostile a 0 punti ferita, ottieni un ammontare di punti ferita temporanei pari al tuo modificatore di Carisma + il tuo livello da warlock (minimo 1)."
levels.1.features.0.effects.0.note: "Il motore di gioco non rileva l'evento che attiva l'effetto (portare una creatura ostile a 0 punti ferita); usalo quando accade."
levels.1.features.1.name: "Lista ampliata degli incantesimi"
levels.1.features.1.text: |-
  L'Immondo permette al warlock di scegliere da una lista di incantesimi più ampia quando impara un nuovo incantesimo da warlock. I seguenti incantesimi sono aggiunti alla sua lista degli incantesimi da warlock.

  ### Incantesimi ampliati dell'Immondo (tabella)
  | Livello dell'incantesimo | Incantesimi |
  | --- | --- |
  | 1° | comando, mani brucianti |
  | 2° | cecità/sordità, raggio rovente |
  | 3° | nube maleodorante, palla di fuoco |
  | 4° | muro di fuoco, scudo di fuoco |
  | 5° | colpo infuocato, santificare |
levels.6.features.0.name: "Fortuna dell'Oscuro"
levels.6.features.0.text: |-
  A partire dal 6° livello, il warlock può appellarsi al suo patrono per alterare il fato in suo favore. Quando effettua una prova di caratteristica o un tiro salvezza, può utilizzare questo privilegio per aggiungere un d10 al suo tiro. Può farlo dopo avere visto il tiro iniziale, ma prima che qualsiasi effetto del tiro sia applicato.

  Una volta utilizzato questo privilegio, il warlock non può più utilizzarlo finché non completa un riposo breve o lungo.
levels.6.features.0.effects.0.name: "Fortuna dell'Oscuro"
levels.6.features.0.effects.1.name: "Fortuna dell'Oscuro"
levels.6.features.0.effects.1.text: "Quando effettui una prova di caratteristica o un tiro salvezza, puoi utilizzare questo privilegio per aggiungere un d10 al tuo tiro. Puoi farlo dopo avere visto il tiro iniziale, ma prima che qualsiasi effetto del tiro sia applicato."
levels.6.features.0.effects.1.onUse.0.text: "Aggiungi 1d10 alla prova di caratteristica o al tiro salvezza appena effettuato."
levels.10.features.0.name: "Resilienza Immonda"
levels.10.features.0.text: "A partire dal 10° livello, il warlock può scegliere un tipo di danno quando completa un riposo breve o lungo. Ottiene resistenza a quel tipo di danno finché non ne sceglie uno diverso tramite questo privilegio. I danni delle armi magiche o delle armi argentate ignorano questa resistenza."
levels.10.features.0.effects.0.note: "Il tipo di danno si sceglie quando completi un riposo breve o lungo e può essere cambiato a ogni riposo; i danni delle armi magiche o delle armi argentate ignorano questa resistenza."
