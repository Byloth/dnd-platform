levels.14.features.0.name: "Scagliare all'inferno"
levels.14.features.0.text: |-
  A partire dal 14° livello, quando il warlock colpisce una creatura con un attacco, può utilizzare questo privilegio per trascinare istantaneamente il bersaglio sui piani inferiori. La creatura scompare e sfreccia attraverso un territorio da incubo.

  Alla fine del turno successivo del warlock, il bersaglio torna nello spazio che occupava in precedenza, o nello spazio libero più vicino. Se il bersaglio non è un immondo, subisce 10d10 danni psichici in quanto resta sconvolto da questa esperienza terrificante.

  Una volta utilizzato questo privilegio, il warlock non può più utilizzarlo finché non completa un riposo lungo.
levels.14.features.0.effects.0.name: "Scagliare all'inferno"
levels.14.features.0.effects.1.name: "Scagliare all'inferno"
levels.14.features.0.effects.1.trigger: "Quando colpisci una creatura con un attacco."
levels.14.features.0.effects.1.text: "Quando colpisci una creatura con un attacco, puoi utilizzare questo privilegio per trascinare istantaneamente il bersaglio sui piani inferiori. La creatura scompare e sfreccia attraverso un territorio da incubo. Alla fine del tuo turno successivo, il bersaglio torna nello spazio che occupava in precedenza, o nello spazio libero più vicino. Se il bersaglio non è un immondo, subisce 10d10 danni psichici in quanto resta sconvolto da questa esperienza terrificante."
levels.14.features.0.effects.1.onUse.0.text: "Il bersaglio scompare fino alla fine del tuo turno successivo, poi torna nel suo spazio (o nello spazio libero più vicino)."
levels.14.features.0.effects.1.onUse.1.note: "Inflitti quando il bersaglio torna alla fine del tuo turno successivo, solo se non è un immondo."
