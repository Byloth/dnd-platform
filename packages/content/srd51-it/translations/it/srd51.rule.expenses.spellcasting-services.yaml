name: "Servizi magici"
text: |-
  Gli individui che sono in grado di lanciare incantesimi non ricadono nella categoria dei gregari ordinari. A volte è possibile trovare qualcuno disposto a lanciare un incantesimo in cambio di monete o di favori, ma si tratta di casi sporadici e non esiste alcuna tariffa prestabilita al riguardo. Come indicazione generica, più alto è il livello dell'incantesimo desiderato, più è difficile trovare qualcuno in grado di lanciarlo, e più elevato è il costo.

  Ingaggiare qualcuno che lanci un incantesimo relativamente comune di 1° o 2° livello come *cura ferite* o *identificare* è relativamente facile in un paese o in una cittadina e può costare dalle 10 alle 50 monete d'oro (più il prezzo delle eventuali componenti materiali costose). Per trovare qualcuno in grado di lanciare un incantesimo di livello superiore (e disposto a farlo) potrebbe essere necessario recarsi in una grande città, magari dotata di un'università o un tempio importante. Una volta trovato l'incantatore, questi potrebbe richiedere un servizio che solo gli avventurieri possono svolgere al posto di un pagamento, come recuperare un oggetto raro da un luogo pericoloso o attraversare un territorio infestato dai mostri per consegnare qualcosa di importante presso un insediamento lontano.
