features.0.effects.0.note: |-
  Lanciata con un'azione fino a 18 metri, CD del tiro salvezza 15. Le perle (cariche) non si recuperano mai. Lanciare più perle con un'unica azione aumenta il livello della *palla di fuoco* di 1 per ogni perla oltre alla prima.
