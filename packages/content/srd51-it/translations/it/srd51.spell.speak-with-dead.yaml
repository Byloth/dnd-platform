name: Parlare con i morti
components.m: Incenso bruciato.
text: |-
  L'incantatore conferisce una parvenza di vita e di intelligenza a un cadavere a sua scelta situato entro gittata, permettendogli di rispondere alle domande che gli vengono poste. Il cadavere deve avere ancora una bocca e non può essere un non morto. L'incantesimo fallisce se il cadavere è già stato il bersaglio di questo incantesimo negli ultimi 10 giorni. Fino al termine dell'incantesimo, l'incantatore può porre al cadavere un massimo di cinque domande. Il cadavere conosce solo quello che sapeva in vita, inclusi i linguaggi. Generalmente, le risposte sono brevi, criptiche o ripetitive e il cadavere non è obbligato a offrire una risposta sincera se l'incantatore gli è ostile o se il cadavere lo riconosce come nemico. Questo incantesimo non riporta l'anima della creatura nel suo corpo, solamente lo spirito animante. Perciò il cadavere non può apprendere nuove informazioni, non conosce nulla di ciò che è accaduto dopo la sua morte e non può speculare sugli eventi futuri.
