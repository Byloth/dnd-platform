name: Talismano del bene puro
text: |-
  Oggetto meraviglioso, leggendario (richiede sintonia con una creatura di allineamento buono)

  Questo talismano è un potente simbolo del bene. Se una creatura che non è di allineamento buono né malvagio tocca il talismano, subisce 6d6 danni radiosi. Una creatura malvagia che tocca il talismano subisce 8d6 danni radiosi. In entrambi i casi, la creatura subisce i danni ogni volta che termina il proprio turno impugnando o trasportando il talismano.

  Se il personaggio è un chierico o un paladino buono, può usare il talismano come simbolo sacro e ottiene un bonus di +2 ai tiri per colpire con incantesimo quando lo indossa o lo impugna.

  Il talismano possiede 7 cariche. Se il personaggio lo indossa o lo impugna, può usare un'azione e consumare 1 carica per scegliere una creatura che è in grado di vedere situata sul terreno entro 36 metri da lui. Se il bersaglio è di allineamento malvagio, sotto di lui si apre una fenditura infuocata. Il bersaglio deve superare un tiro salvezza su Destrezza con CD 20, altrimenti cade nella fenditura ed è distrutto, senza lasciare resti. La fenditura poi si richiude, senza lasciare alcuna traccia della sua esistenza. Quando il personaggio spende l'ultima carica, il talismano si disperde in una manciata di scintille dorate ed è distrutto.
attunement.by: una creatura di allineamento buono
features.0.name: Simbolo sacro
features.0.effects.0.note: |-
  Solo se sei un chierico o un paladino buono, mentre indossi o impugni il talismano; puoi anche usarlo come simbolo sacro.
features.1.name: Fenditura
features.1.effects.0.name: Fenditura
features.1.effects.0.text: |-
  Scegli una creatura che sei in grado di vedere situata sul terreno entro 36 metri. Se il bersaglio è di allineamento malvagio, sotto di lui si apre una fenditura infuocata: deve superare un tiro salvezza su Destrezza con CD 20, altrimenti cade nella fenditura ed è distrutto, senza lasciare resti. Le cariche non si ricaricano mai; quando spendi l'ultima, il talismano si disperde in una manciata di scintille dorate ed è distrutto.
features.1.effects.0.onUse.0.text: Solo bersagli malvagi; tiro salvezza su Destrezza con CD 20, altrimenti distrutto.
features.2.name: Simbolo del bene
features.2.effects.0.text: |-
  Una creatura che non è né buona né malvagia subisce 6d6 danni radiosi quando tocca il talismano; una creatura malvagia subisce 8d6 danni radiosi. In entrambi i casi, la creatura subisce di nuovo i danni ogni volta che termina il proprio turno impugnando o trasportando il talismano.
