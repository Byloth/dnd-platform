name: Clone
components.m: Un diamante del valore di almeno 1.000 mo, un cubo di carne della creatura da clonare di almeno 2,5 cm per lato, che l'incantesimo consuma, e un contenitore del valore di almeno 2.000 mo che abbia un coperchio sigillabile e sia abbastanza grande da contenere una creatura di taglia Media, come un'urna enorme, una bara, una ciste piena di fango nel terreno o un contenitore di cristallo riempito con acqua salata.
text: |-
  Questo incantesimo crea un duplicato inerme di una creatura vivente come protezione contro la morte. Tale clone si sviluppa all'interno di un contenitore sigillato e raggiunge piena taglia e maturità dopo 120 giorni; l'incantatore può anche decidere di creare il clone di una versione più giovane della creatura. Il clone rimane inerte e permane per un tempo indeterminato, fintantoché il suo involucro rimane indisturbato. In qualsiasi momento dopo che il clone ha raggiunto la maturazione, se la creatura originale muore, la sua anima viene trasferita al clone, purché essa sia libera e disposta a tornare. Il clone è fisicamente identico all'originale e possiede la sua personalità, i suoi ricordi e le sue abilità, ma non il suo equipaggiamento. I resti fisici della creatura originale, se ancora esistono, diventano inerti e non possono più essere riportati in vita, in quanto l'anima della creatura è altrove.
