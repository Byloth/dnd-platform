name: Arnesi da scasso
text: |-
  Questo set di arnesi include una piccola lima, una serie di grimaldelli, uno specchietto montato su una maniglia di metallo, un paio di forbicine e un paio di pinze. La competenza in questi oggetti consente a un personaggio di aggiungere il proprio bonus di competenza a ogni prova di caratteristica effettuata per disattivare trappole o scassinare serrature.
