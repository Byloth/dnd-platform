name: "Scurovisione"
text: |-
  Molte creature dei mondi dei giochi fantasy, specialmente quelle che vivono sottoterra, sono dotate di scurovisione. Entro un raggio specifico, una creatura dotata di scurovisione può vedere in condizioni di oscurità come se fosse in condizioni di luce fioca, quindi le aree di oscurità risultano soltanto leggermente oscurate per lei. Tuttavia, in quell'oscurità la creatura non è in grado di distinguere i colori e vede tutto in scala di grigi.
