name: Dotazione da scassinatore
text: "Include: 1 × Zaino, 1 × Sfere metalliche (sacchetto da 1.000), 1 × Spago (3 metri), 1 × Campanella, 5 × Candela, 1 × Piede di porco, 1 × Martello, 10 × Chiodo da rocciatore, 1 × Lanterna schermabile, 2 × Olio (ampolla), 5 × Razioni (1 giornata), 1 × Acciarino e pietra focaia, 1 × Otre, 1 × Corda di canapa (15 metri)."
