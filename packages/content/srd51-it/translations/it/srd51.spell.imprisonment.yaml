name: Imprigionare
components.m: Un ritratto su pergamena o una statuetta intagliata con le fattezze del bersaglio e una componente speciale che varia in base alla versione dell'incantesimo scelta, del valore di almeno 500 mo per ogni Dado Vita del bersaglio.
text: |-
  L'incantatore crea una costrizione magica per trattenere una creatura entro gittata che è in grado di vedere. Il bersaglio deve superare un tiro salvezza su Saggezza, altrimenti sarà vincolato dall'incantesimo; in caso di successo, ne diventa immune qualora l'incantatore volesse lanciarlo di nuovo. Finché è influenzata da questo incantesimo, la creatura non ha bisogno di respirare, mangiare o bere e non invecchia. Gli incantesimi di divinazione non possono localizzare o individuare il bersaglio. Quando questo incantesimo viene lanciato, l'incantatore sceglie una delle forme di reclusione seguenti.

  **Sepoltura.** Il bersaglio viene sepolto nelle viscere della terra in una sfera di forza magica sufficientemente ampia da contenerlo. Nulla può attraversare la sfera e nessuna creatura può utilizzare il teletrasporto o i viaggi planari per entrarvi o uscirvi. La componente speciale per questa versione dell'incantesimo è un piccolo globo di mithral.

  **Ceppi.** Il bersaglio è bloccato da una serie di pesanti catene saldamente ancorate al terreno ed è trattenuto fino al termine dell'incantesimo, non potendo muoversi o essere mosso in alcun modo fino ad allora. La componente speciale per questa versione dell'incantesimo è una sottile catena di metallo prezioso.

  **Prigione protetta.** L'incantesimo trasporta il bersaglio in un semipiano minuscolo protetto da teletrasporto e viaggi planari. Il semipiano può essere un labirinto, una gabbia, una torre o un'analoga struttura o area delimitata a scelta dell'incantatore. La componente speciale per questa versione dell'incantesimo è una rappresentazione in miniatura della prigione realizzata in giada.

  **Prigionia ridotta.** Il bersaglio viene rimpicciolito a un'altezza di 2,5 centimetri e imprigionato all'interno di una gemma o un oggetto simile. La luce passa normalmente attraverso la gemma (permettendo al bersaglio di guardare all'esterno e alle altre creature di guardare all'interno), ma nient'altro può attraversarla, nemmeno utilizzando il teletrasporto o i viaggi planari. La gemma non può essere tagliata o rotta mentre l'incantesimo è attivo. La componente speciale per questa versione dell'incantesimo è una grande gemma trasparente, come un corindone, un diamante o un rubino.

  **Sonno.** Il bersaglio si addormenta e non può essere svegliato. La componente speciale per questa versione dell'incantesimo consiste in rare erbe soporifere.

  **Porre fine all'incantesimo.** Durante il lancio dell'incantesimo, in qualsiasi sua versione, l'incantatore può specificare una condizione che vi pone fine, liberando il bersaglio. La condizione può essere specifica e complessa quanto l'incantatore desidera, ma il GM deve considerarla ragionevole e ritenere che abbia una possibilità di verificarsi. Le condizioni possono essere basate sul nome, l'identità o la divinità di una creatura, ma devono fondarsi su azioni o qualità osservabili e non su concetti intangibili come livello, classe o punti ferita. Dissolvi magie può porre fine a questo incantesimo solo se viene lanciato come un incantesimo di 9° livello, bersagliando la prigione o la componente speciale usata per crearla. L'incantatore può utilizzare una particolare componente speciale per creare una sola prigione alla volta. Se l'incantatore lancia nuovamente l'incantesimo usando la stessa componente, il bersaglio del primo lancio viene subito liberato dalla sua prigionia.
