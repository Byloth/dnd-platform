name: "Competenze in armi, armature e strumenti"
text: |-
  Si presume che una creatura sia competente nelle armi, nelle armature e negli strumenti che possiede. Se il GM decide di cambiare questi oggetti, deve decidere se la creatura è competente o meno nell'uso del suo nuovo equipaggiamento.

  Per esempio, un gigante delle colline solitamente indossa un'armatura di pelle e impugna un randello pesante. Il GM potrebbe decidere di dotarlo invece di una cotta di maglia e di un'ascia bipenne, e decidere che il gigante sia competente nell'una o nell'altra cosa, in entrambe o in nessuna delle due.

  Vedi il *Manuale del Giocatore* per le regole relative all'uso delle armi o delle armature senza competenza.
