features.0.effects.0.name: Giurare un nemico
features.0.effects.0.text: |-
  Se il personaggio pronuncia la parola d'ordine quando effettua un attacco a distanza con l'arco, il bersaglio diventa nemico giurato del personaggio fino alla sua morte o all'alba del settimo giorno dopo l'attacco. Un solo nemico giurato alla volta; dopo la sua morte, il personaggio può sceglierne un altro a partire dall'alba successiva.
features.0.effects.1.note: |-
  Tiri per colpire a distanza con quest'arco contro il nemico giurato. Il bersaglio non ottiene alcun beneficio da una copertura che non sia totale e il personaggio non subisce svantaggio a causa della lunga gittata.
features.0.effects.2.note: Solo quando l'attacco colpisce il nemico giurato.
features.0.effects.3.note: |-
  Solo ai tiri per colpire con armi diverse dall'arco del giuramento, finché il nemico giurato è in vita.
