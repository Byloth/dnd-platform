name: Invisibilità superiore
text: |-
  L'incantatore o una creatura da lui toccata diventa invisibile fino al termine dell'incantesimo. Ciò accade anche a tutto ciò che il bersaglio indossa o trasporta, sempre che non se ne separi.
onCast.0.note: |-
  Tu o una creatura che tocchi; tutto ciò che il bersaglio indossa o trasporta è invisibile, sempre che non se ne separi.
