name: Miraggio arcano
text: L'incantatore fa in modo che il terreno in un'area massima di un quadrato con lato di 1,5 km appaia, suoni, odori e perfino risulti al tatto come un altro tipo di terreno, nonostante la sua forma generale rimanga la medesima. Un campo aperto o una strada potrebbe così sembrare una palude, una collina, un crepaccio o qualche altro tipo di terreno difficile o invalicabile. Allo stesso modo, uno stagno potrebbe apparire come un prato erboso, un precipizio come un dolce pendio o un fosso irto di rocce come una strada ampia e accogliente. L'incantatore può similmente modificare l'aspetto di strutture o aggiungerne altre dove non sono presenti. Tuttavia, l'incantesimo non può camuffare, occultare o aggiungere creature. L'illusione include elementi uditivi, visivi, tattili e olfattivi, quindi può trasformare un terreno libero in un terreno difficile (o viceversa), oppure ostacolare in altri modi i movimenti all'interno dell'area. Ogni frammento di terreno illusorio (come una roccia o un bastone) che viene rimosso dall'area dell'incantesimo scompare immediatamente. Le creature con vista pura sono in grado di vedere la vera forma del terreno attraverso l'illusione; tuttavia, permangono tutti gli altri elementi dell'illusione, quindi nonostante la creatura sia consapevole della sua presenza, può continuare a interagire fisicamente con essa.
