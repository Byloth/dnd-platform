name: "Azioni leggendarie"
text: |-
  Una creatura leggendaria può eseguire un certo numero di azioni speciali (chiamate azioni leggendarie) al di fuori del suo turno. È possibile utilizzare solo un'opzione di azione leggendaria alla volta e soltanto alla fine del turno di un'altra creatura. Una creatura recupera le azioni leggendarie effettuate all'inizio del proprio turno. Può rinunciare a usarle e non può usarle quando è incapacitata o impossibilitata in altri modi a effettuare azioni. Se sorpresa, può usarle soltanto dopo il suo primo turno in combattimento.
