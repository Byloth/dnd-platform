name: Sonno
components.m: Un pizzico di sabbia finissima, petali di rosa o un grillo.
text: |-
  Questo incantesimo fa in modo che le creature siano vittime di un sonno magico. L'incantatore tira 5d8 e il totale ottenuto è la quantità di punti ferita delle creature che questo incantesimo può influenzare. Le creature entro 6 metri da un punto a scelta dell'incantatore situato entro gittata sono influenzate in ordine crescente in base ai loro punti ferita attuali (le creature prive di sensi sono escluse). A partire da quella che al momento possiede meno punti ferita, ogni creatura influenzata da questo incantesimo cade priva di sensi e resta tale finché l'incantesimo non termina, finché subisce dei danni o qualcuno usa un'azione per svegliarla scuotendola o schiaffeggiandola. Si sottraggono i punti ferita di ogni creatura dal totale, prima di passare alla creatura che possiede il numero di punti ferita immediatamente più basso. Affinché quella creatura possa essere influenzata, il totale dei suoi punti ferita deve essere pari o inferiore al totale rimanente. Le creature non morte e quelle immuni all'essere affascinate non sono influenzate da questo incantesimo.
higherLevel: |-
  Quando l'incantatore lancia questo incantesimo usando uno slot incantesimo di 2° livello o superiore, tira 2d8 aggiuntivi per ogni slot di livello superiore al 1°.
onCast.0.note: |-
  Nessun tiro salvezza. Tira 5d8 (+2d8 per ogni slot di livello superiore al 1°): le creature entro 6 metri dal punto sono influenzate in ordine crescente di punti ferita attuali, e ognuna sottrae i suoi punti ferita dal totale, purché siano pari o inferiori a quanto rimane. Le creature non morte e quelle immuni all'essere affascinate non sono influenzate. Una creatura addormentata si sveglia se subisce danni o se qualcuno usa un'azione per scuoterla o schiaffeggiarla.
