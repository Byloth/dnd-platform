name: Libertà di movimento
components.m: Una cinghia di cuoio legata intorno al braccio o un'appendice simile.
text: |-
  L'incantatore tocca una creatura consenziente. Per la durata dell'incantesimo, il movimento del bersaglio non è influenzato dal terreno difficile, inoltre incantesimi e altri effetti magici non possono né ridurne la velocità né trattenerlo o provocarne la paralisi. Il bersaglio può inoltre spendere 1,5 metri di movimento per sfuggire automaticamente alle restrizioni non magiche, come manette o la presa di una creatura. Infine, se si trova sott'acqua, il movimento e gli attacchi del bersaglio non subiscono penalità.
effects.0.note: Solo contro incantesimi e altri effetti magici.
effects.1.text: Il tuo movimento non è influenzato dal terreno difficile e incantesimi e altri effetti magici non possono ridurre la tua velocità; puoi spendere 1,5 metri di movimento per sfuggire automaticamente alle restrizioni non magiche, come manette o la presa di una creatura; se ti trovi sott'acqua, il tuo movimento e i tuoi attacchi non subiscono penalità.
