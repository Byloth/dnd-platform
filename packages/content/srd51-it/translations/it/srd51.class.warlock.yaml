levels.2.features.0.effects.0.options.25.text: |-
  Prerequisito: 5° livello. Il warlock può lanciare scagliare maledizione una volta usando uno slot incantesimo da warlock. Non può farlo di nuovo finché non completa un riposo lungo.
levels.2.features.0.effects.0.options.25.effects.0.note: |-
