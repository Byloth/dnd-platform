levels.3.features.0.effects.0.options.2.effects.0.note: |-
  Tre trucchetti dalla lista degli incantesimi di qualsiasi classe. Quando il warlock porta con sé il Libro delle Ombre può lanciarli a volontà; non contano ai fini dei trucchetti conosciuti e sono considerati incantesimi da warlock per lui. I trucchetti scelti non possono ancora essere concessi dalla risposta, quindi vanno aggiunti a mano agli incantesimi conosciuti.
levels.3.features.0.effects.0.options.2.effects.1.text: |-
  Se il Libro delle Ombre va perduto, il warlock può effettuare un cerimoniale da 1 ora per riceverne un altro dal proprio patrono. Tale cerimoniale può essere effettuato durante un periodo di riposo breve o lungo, e provoca la distruzione del vecchio libro. Il libro si riduce in polvere alla morte del warlock.
levels.4.features.0.name: Aumento dei Punteggi di Caratteristica
levels.4.features.0.text: |-
  Quando arriva al 4° livello, e poi di nuovo all'8°, 12°, 16° e 19° livello, un warlock può aumentare di 2 un punteggio di caratteristica a sua scelta, oppure può aumentare di 1 due punteggi di caratteristica a sua scelta. Come di consueto, non è consentito aumentare un punteggio di caratteristica a più di 20 utilizzando questo privilegio.
levels.11.features.0.name: Arcanum Mistico
levels.11.features.0.text: |-
  All'11° livello, il patrono rivela al warlock un segreto magico chiamato arcanum. Il warlock sceglie un incantesimo di 6° livello dalla lista degli incantesimi da warlock come arcanum.

  Il warlock può lanciare il suo incantesimo arcanum una volta senza spendere uno slot incantesimo. Deve completare un riposo lungo prima di poterlo fare di nuovo.

  Ai livelli successivi, il warlock ottiene altri incantesimi da warlock a sua scelta da lanciare in questo modo: un incantesimo di 7° livello al 13° livello, un incantesimo di 8° livello al 15° livello e un incantesimo di 9° livello al 17° livello. Recupera tutti gli utilizzi del suo Arcanum Mistico quando completa un riposo lungo.
levels.11.features.0.effects.0.note: |-
  L'arcanum di 6° livello del warlock. Può lanciarlo una volta senza spendere uno slot incantesimo; recupera l'utilizzo quando completa un riposo lungo.
levels.11.features.0.effects.1.note: |-
  L'arcanum di 7° livello del warlock, ottenuto al 13° livello. Può lanciarlo una volta senza spendere uno slot incantesimo; recupera l'utilizzo quando completa un riposo lungo.
levels.11.features.0.effects.2.note: |-
  L'arcanum di 8° livello del warlock, ottenuto al 15° livello. Può lanciarlo una volta senza spendere uno slot incantesimo; recupera l'utilizzo quando completa un riposo lungo.
levels.11.features.0.effects.3.note: |-
  L'arcanum di 9° livello del warlock, ottenuto al 17° livello. Può lanciarlo una volta senza spendere uno slot incantesimo; recupera l'utilizzo quando completa un riposo lungo.
levels.11.features.0.effects.4.name: Arcanum Mistico (6° livello)
levels.11.features.0.effects.5.name: Arcanum Mistico (7° livello)
levels.11.features.0.effects.6.name: Arcanum Mistico (8° livello)
levels.11.features.0.effects.7.name: Arcanum Mistico (9° livello)
levels.11.features.0.effects.8.text: |-
  Il warlock può lanciare ogni incantesimo arcanum una volta senza spendere uno slot incantesimo. Deve completare un riposo lungo prima di poterlo fare di nuovo.
levels.11.features.0.effects.8.note: |-
  Un incantesimo scelto tramite una scelta non può ancora essere concesso con degli utilizzi (grant-spells richiede id di incantesimo fissi); quando il warlock lancia l'arcanum, l'utilizzo corrispondente di Arcanum Mistico va speso a mano.
levels.20.features.0.name: Maestro dell'Occulto
levels.20.features.0.text: |-
  Al 20° livello, il warlock è in grado di attingere alla sua riserva interiore di potere mistico quando invoca il suo patrono per riottenere gli slot incantesimo spesi. Il warlock può trascorrere 1 minuto invocando l'aiuto del suo patrono per riottenere tutti gli slot incantesimo concessi dal privilegio Magia del Patto che ha speso. Una volta riottenuti gli slot incantesimo tramite questo privilegio, il warlock deve completare un riposo lungo prima di poterlo fare di nuovo.
levels.20.features.0.effects.0.name: Maestro dell'Occulto
levels.20.features.0.effects.1.name: Maestro dell'Occulto
levels.20.features.0.effects.1.text: |-
  Il warlock può trascorrere 1 minuto invocando l'aiuto del suo patrono per riottenere tutti gli slot incantesimo concessi dal privilegio Magia del Patto che ha speso. Una volta riottenuti gli slot incantesimo tramite questo privilegio, il warlock deve completare un riposo lungo prima di poterlo fare di nuovo.
levels.20.features.0.effects.1.onUse.0.note: |-
  Il warlock riottiene tutti gli slot incantesimo spesi della Magia del Patto dopo 1 minuto passato a invocare il suo patrono.
