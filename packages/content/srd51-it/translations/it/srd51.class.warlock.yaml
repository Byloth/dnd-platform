name: Warlock
levels.1.features.0.name: Elenco delle Suppliche Occulte
levels.1.features.0.text: |-
  Se una supplica occulta prevede dei prerequisiti, il warlock deve soddisfarli per poterla apprendere. Può apprendere quella supplica nel momento in cui ne soddisfa i prerequisiti. Un prerequisito di livello indica il livello nella classe del warlock.

  ### Deflagrazione agonizzante

  Prerequisito: trucchetto deflagrazione occulta

  Quando il warlock lancia deflagrazione occulta, aggiunge il suo modificatore di Carisma ai danni che infligge quando colpisce il bersaglio.
  Armatura delle ombre

  Il warlock può lanciare armatura magica su se stesso a volontà senza spendere uno slot incantesimo o componenti materiali.

  ### Passo ascendente

  Prerequisito: 9° livello

  Il warlock può lanciare levitazione su se stesso a volontà senza spendere uno slot incantesimo o componenti materiali.

  ### Lingue delle bestie

  Il warlock può lanciare parlare con gli animali a volontà senza spendere uno slot incantesimo.

  ### Influenza seducente

  Il warlock ottiene competenza nelle abilità Inganno e Persuasione.

  ### Sussurri stregati

  Prerequisito: 7° livello

  Il warlock può lanciare compulsione una volta usando uno slot incantesimo da warlock. Non può farlo di nuovo finché non completa un riposo lungo.

  ### Libro degli antichi segreti

  Prerequisito: privilegio Patto del Tomo

  Il warlock può ora trascrivere i rituali magici nel suo Libro delle Ombre. Sceglie due incantesimi di 1° livello con il descrittore rituale dalle liste di incantesimi di qualsiasi classe (non è necessario che i due incantesimi appartengano alla stessa lista). Gli incantesimi compaiono nel libro e non contano ai fini di determinare il numero di incantesimi che il warlock conosce. Quando il warlock impugna il suo Libro delle Ombre, può lanciare gli incantesimi scelti come rituali. Può lanciare quegli incantesimi soltanto come rituali, a meno che non li abbia appresi anche in altri modi. Può inoltre lanciare un incantesimo da warlock che conosce come rituale, se tale incantesimo possiede il descrittore rituale.

  Nel corso delle sue avventure, il warlock può aggiungere altri incantesimi rituali al suo Libro delle Ombre. Quando trova un incantesimo del genere, può aggiungerlo al libro se il livello dell'incantesimo è pari o inferiore alla metà del suo livello da warlock (arrotondato per eccesso) e se dispone di abbastanza tempo per trascrivere l'incantesimo. Per ogni livello dell'incantesimo, il processo di trascrizione richiede 2 ore e costa 50 mo per gli inchiostri rari richiesti.

  ### Catene di Carceri

  Prerequisito: 15° livello, privilegio Patto della Catena

  Il warlock può lanciare blocca mostri a volontà (bersagliando un celestiale, un immondo o un elementale) senza spendere uno slot incantesimo o componenti materiali. Deve completare un riposo lungo prima che possa usare di nuovo questa supplica sulla stessa creatura.

  ### Vista del diavolo

  Il warlock è in grado di vedere normalmente nell'oscurità, sia magica che non, fino a una distanza di 36 metri.

  ### Parola temibile

  Prerequisito: 7° livello

  Il warlock può lanciare confusione una volta usando uno slot incantesimo da warlock. Non può farlo di nuovo finché non completa un riposo lungo.

  ### Vista dell'occulto

  Il warlock può lanciare individuazione del magico a volontà, senza spendere uno slot incantesimo.

  ### Lancia occulta

  Prerequisito: trucchetto deflagrazione occulta

  Quando il warlock lancia deflagrazione occulta, la sua gittata è di 90 metri.

  ### Occhi del custode delle rune

  Il warlock è in grado di leggere ogni forma di scrittura.

  ### Vigore immondo

  Il warlock può lanciare vita falsata su se stesso a volontà come incantesimo di 1° livello, senza spendere uno slot incantesimo o componenti materiali.

  ### Sguardo delle due menti

  Il warlock può usare la sua azione per toccare un umanoide consenziente e percepire il mondo attraverso i suoi sensi fino alla fine del proprio turno successivo. Fintantoché la creatura si trova sullo stesso piano di esistenza del warlock, quest'ultimo può usare la sua azione nei turni successivi per mantenere questo legame, estendendo la durata fino alla fine del suo turno successivo. Finché percepisce il mondo attraverso i sensi dell'altra creatura, il warlock beneficia degli eventuali sensi speciali posseduti da essa, ma è cieco e sordo riguardo a ciò che accade attorno a lui.

  ### Succhiavita

  Prerequisiti: 12° livello, privilegio Patto della Lama

  Quando il warlock colpisce una creatura con la sua arma del patto, quella creatura subisce danni necrotici extra pari al modificatore di Carisma del warlock (minimo 1).

  ### Maschera dei molti volti

  Il warlock può lanciare camuffare se stesso a volontà senza spendere uno slot incantesimo.

  ### Maestro di mille forme

  Prerequisito: 15° livello

  Il warlock può lanciare alterare se stesso a volontà, senza spendere uno slot incantesimo.

  ### Servitori del caos

  Prerequisito: 9° livello

  Il warlock può lanciare evoca elementale una volta usando uno slot incantesimo da warlock. Non può farlo di nuovo finché non completa un riposo lungo.

  ### Fardello mentale

  Prerequisito: 5° livello

  Il warlock può lanciare lentezza una volta usando uno slot incantesimo da warlock. Non può farlo di nuovo finché non completa un riposo lungo.

  ### Visioni velate

  Il warlock può lanciare immagine silenziosa a volontà senza spendere uno slot incantesimo o componenti materiali.

  ### Tutt'uno con le ombre

  Prerequisito: 5° livello

  Quando il warlock si trova in un'area di luce fioca o di oscurità, può usare la sua azione per diventare invisibile finché non si muove, effettua un'azione o una reazione.

  ### Balzo ultraterreno

  Prerequisito: 9° livello

  Il warlock può lanciare saltare su se stesso a volontà senza spendere uno slot incantesimo o componenti materiali.

  ### Deflagrazione respingente

  Prerequisito: trucchetto deflagrazione occulta

  Quando il warlock colpisce una creatura con deflagrazione occulta, può spingere la creatura fino a un massimo di 3 metri per allontanarla da sé in linea retta.

  ### Scultore della carne

  Prerequisito: 7° livello

  Il warlock può lanciare metamorfosi una volta usando uno slot incantesimo da warlock. Non può farlo di nuovo finché non completa un riposo lungo.

  ### Presagio di sventura

  Prerequisito: 5° livello

  Il warlock può lanciare scagliare maledizione una volta usando uno slot incantesimo da warlock. Non può farlo di nuovo finché non completa un riposo lungo.

  ### Ladro dei cinque fati

  Il warlock può lanciare anatema una volta usando uno slot incantesimo da warlock. Non può farlo di nuovo finché non completa un riposo lungo.

  ### Lama assetata

  Prerequisiti: 5° livello, privilegio Patto della Lama

  Ogni volta che effettua l'azione Attacco nel suo turno, il warlock può attaccare con la sua arma del patto due volte anziché una.

  ### Visione dei reami lontani

  Prerequisito: 15° livello

  Il warlock può lanciare occhio arcano a volontà senza spendere uno slot incantesimo.

  ### Voce del Signore delle Catene

  Prerequisito: privilegio Patto della Catena

  Il warlock può comunicare telepaticamente con il suo famiglio e percepire il mondo attraverso i sensi di quest'ultimo, purché entrambi si trovino sullo stesso piano di esistenza. Inoltre, finché percepisce il mondo attraverso i sensi del suo famiglio, può anche parlare attraverso di esso con la propria voce, anche se il suo famiglio normalmente non è in grado di parlare.

  ### Sussurri dalla tomba

  Prerequisito: 9° livello

  Il warlock può lanciare parlare con i morti a volontà, senza spendere uno slot incantesimo.

  ### Vista stregata

  Prerequisito: 15° livello

  Il warlock è in grado di vedere la vera forma di qualsiasi mutaforma o creatura celata da una magia di illusione o trasmutazione, finché quella creatura si trova entro 9 metri da lui ed entro il suo campo visivo.
levels.1.features.1.name: Patrono Ultraterreno
levels.1.features.1.text: |-
  Al 1° livello, un warlock stipula un patto con un essere ultraterreno a sua scelta: il Signore Fatato, l'Immondo o il Grande Antico, ognuno dei quali è descritto in dettaglio alla fine della sezione di questa classe. La scelta del patrono gli conferisce alcuni privilegi al 1° livello e poi ancora al 6°, 10° e 14° livello.
levels.1.features.2.name: Magia del Patto
levels.1.features.2.text: |-
  Le ricerche arcane condotte dal warlock e l'energia magica che il suo patrono gli conferisce rendono il warlock particolarmente abile nell'uso degli incantesimi.

  ### Trucchetti

  Un warlock conosce due trucchetti a sua scelta tratti dalla lista degli incantesimi da warlock. Apprende ulteriori trucchetti da warlock a sua scelta ai livelli successivi, come indicato dalla colonna "Trucchetti conosciuti" nella tabella "Warlock".
  Slot incantesimo

  La tabella "Warlock" indica quanti slot incantesimo possiede un warlock. La tabella indica anche il livello di quegli slot; tutti gli slot incantesimo da warlock sono dello stesso livello. Per lanciare un incantesimo di livello pari o superiore al 1°, il warlock deve spendere uno slot incantesimo. Il warlock recupera tutti gli slot incantesimo spesi quando completa un riposo breve o lungo.

  Per esempio, un warlock di 5° livello possiede due slot incantesimo di 3° livello. Per lanciare l'incantesimo di 1° livello onda tonante deve spendere uno di quegli slot e lanciarlo come incantesimo di 3° livello.

  ### Incantesimi conosciuti di 1° livello e di livello superiore

  Al 1° livello, un warlock conosce due incantesimi di 1° livello a sua scelta dalla lista degli incantesimi da warlock.

  La colonna "Incantesimi conosciuti" nella tabella "Warlock" indica quando un warlock impara altri incantesimi da warlock a sua scelta di 1° livello o superiore. Ognuno di questi incantesimi deve appartenere a un livello pari o inferiore al "Livello dello slot" relativo al livello attuale del warlock e indicato nella sua tabella. Per esempio, quando un warlock arriva al 6° livello apprende un nuovo incantesimo da warlock di 1°, 2° o 3° livello.

  Inoltre, quando un warlock acquisisce un livello, può scegliere un incantesimo da warlock che conosce e sostituirlo con un altro incantesimo della lista degli incantesimi da warlock; anche il nuovo incantesimo deve essere di un livello di cui possiede degli slot incantesimo.

  ### Caratteristica da incantatore

  Carisma è la caratteristica da incantatore per gli incantesimi da warlock, quindi un warlock usa Carisma ogni volta che un incantesimo fa riferimento alla sua caratteristica da incantatore. Usa inoltre il suo modificatore di Carisma per definire la CD del tiro salvezza di un incantesimo da warlock da lui lanciato e quando effettua un tiro per colpire con un incantesimo.

  **CD del tiro salvezza sull'incantesimo** = 8 + il bonus di competenza + il modificatore di Carisma

  **Modificatore di attacco dell'incantesimo** = il bonus di competenza + il modificatore di Carisma

  ### Focus da incantatore

  Un warlock può usare un focus arcano come focus da incantatore per i suoi incantesimi da warlock.
levels.2.features.0.name: Suppliche Occulte
levels.2.features.0.text: |-
  Dedicandosi allo studio delle scienze occulte, un warlock ha scoperto come usare alcune suppliche occulte, frammenti di conoscenze proibite che gli conferiscono persistenti doti magiche.

  Al 2° livello, il warlock ottiene due suppliche occulte a sua scelta. Le sue opzioni di supplica sono illustrate alla fine della descrizione di questa classe. Quando il warlock raggiunge livelli superiori, ottiene ulteriori suppliche a sua scelta, come indicato nella colonna "Suppliche conosciute" nella tabella "Warlock".

  Inoltre, quando acquisisce un nuovo livello, il warlock può scegliere una delle suppliche che conosce e sostituirla con un'altra che potrebbe imparare a quel livello.
levels.2.features.0.effects.0.note: |-
  Due suppliche al 2° livello; il warlock ne ottiene altre come indicato nella colonna "Suppliche conosciute" (table(warlock.invocations-known)) e il numero di opzioni di una scelta non può ancora seguire una tabella. Quando acquisisce un livello in questa classe, il warlock può sostituire una supplica che conosce con un'altra che potrebbe imparare a quel livello. Un prerequisito di livello indica il livello da warlock.
