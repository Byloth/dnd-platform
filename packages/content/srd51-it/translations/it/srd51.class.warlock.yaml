levels.2.features.0.effects.0.options.23.name: Deflagrazione respingente
levels.2.features.0.effects.0.options.23.text: |-
  Prerequisito: trucchetto deflagrazione occulta. Quando il warlock colpisce una creatura con deflagrazione occulta, può spingere la creatura fino a un massimo di 3 metri per allontanarla da sé in linea retta.
levels.2.features.0.effects.0.options.23.effects.0.text: |-
  Quando il warlock colpisce una creatura con deflagrazione occulta, può spingere la creatura fino a un massimo di 3 metri per allontanarla da sé in linea retta.
levels.2.features.0.effects.0.options.23.effects.0.note: |-
  Una spinta quando si colpisce con un solo incantesimo non è modellata; applicarla a mano.
