levels.3.features.0.effects.0.options.1.effects.0.name: Creare l'arma del patto
levels.3.features.0.effects.0.options.1.effects.0.text: |-
  Il warlock fa apparire un'arma del patto nella sua mano vuota, scegliendo ogni volta la forma che questa arma da mischia assume. È considerato competente nell'arma fintantoché la impugna, e l'arma è considerata magica al fine di superare la resistenza e l'immunità agli attacchi e ai danni non magici. L'arma scompare se rimane per 1 minuto o più a più di 1,5 metri di distanza dal warlock, se il warlock utilizza di nuovo il privilegio, se la congeda (non è richiesta alcuna azione per farlo), o se muore.
levels.3.features.0.effects.0.options.1.effects.0.note: |-
  Non esiste un oggetto "arma del patto", quindi la competenza e la proprietà magica non possono essere associate all'arma creata; considerare competente e magica l'arma che si aggiunge al proprio equipaggiamento.
levels.3.features.0.effects.0.options.1.effects.1.text: |-
