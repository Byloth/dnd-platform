levels.2.features.0.effects.0.options.24.text: |-
  Prerequisito: 7° livello. Il warlock può lanciare metamorfosi una volta usando uno slot incantesimo da warlock. Non può farlo di nuovo finché non completa un riposo lungo.
levels.2.features.0.effects.0.options.24.effects.0.note: |-
