levels.2.features.0.effects.0.options.26.name: Ladro dei cinque fati
levels.2.features.0.effects.0.options.26.text: |-
  Il warlock può lanciare anatema una volta usando uno slot incantesimo da warlock. Non può farlo di nuovo finché non completa un riposo lungo.
levels.2.features.0.effects.0.options.26.effects.0.note: |-
  Si lancia una volta usando uno slot incantesimo da warlock (lo slot viene comunque speso); non è possibile farlo di nuovo finché non si completa un riposo lungo.
levels.2.features.0.effects.0.options.27.name: Lama assetata
levels.2.features.0.effects.0.options.27.text: |-
  Prerequisiti: 5° livello, privilegio Patto della Lama. Ogni volta che effettua l'azione Attacco nel suo turno, il warlock può attaccare con la sua arma del patto due volte anziché una.
levels.2.features.0.effects.0.options.27.effects.0.note: |-
  Soltanto quando il warlock attacca con la sua arma del patto; con qualsiasi altra arma effettua comunque un solo attacco.
levels.2.features.0.effects.0.options.28.name: Visione dei reami lontani
levels.2.features.0.effects.0.options.28.text: |-
  Prerequisito: 15° livello. Il warlock può lanciare occhio arcano a volontà senza spendere uno slot incantesimo.
levels.2.features.0.effects.0.options.28.effects.0.note: |-
  Si lancia a volontà, senza spendere uno slot incantesimo.
levels.2.features.0.effects.0.options.29.name: Voce del Signore delle Catene
levels.2.features.0.effects.0.options.29.text: |-
  Prerequisito: privilegio Patto della Catena. Il warlock può comunicare telepaticamente con il suo famiglio e percepire il mondo attraverso i sensi di quest'ultimo, purché entrambi si trovino sullo stesso piano di esistenza. Inoltre, finché percepisce il mondo attraverso i sensi del suo famiglio, può anche parlare attraverso di esso con la propria voce, anche se il suo famiglio normalmente non è in grado di parlare.
levels.2.features.0.effects.0.options.29.effects.0.text: |-
  Il warlock può comunicare telepaticamente con il suo famiglio e percepire il mondo attraverso i sensi di quest'ultimo, purché entrambi si trovino sullo stesso piano di esistenza. Finché percepisce il mondo attraverso i sensi del suo famiglio, può anche parlare attraverso di esso con la propria voce, anche se il suo famiglio normalmente non è in grado di parlare.
levels.2.features.0.effects.0.options.30.name: Sussurri dalla tomba
levels.2.features.0.effects.0.options.30.text: |-
  Prerequisito: 9° livello. Il warlock può lanciare parlare con i morti a volontà, senza spendere uno slot incantesimo.
levels.2.features.0.effects.0.options.30.effects.0.note: |-
