levels.2.features.0.effects.0.options.31.name: Vista stregata
levels.2.features.0.effects.0.options.31.text: |-
  Prerequisito: 15° livello. Il warlock è in grado di vedere la vera forma di qualsiasi mutaforma o creatura celata da una magia di illusione o trasmutazione, finché quella creatura si trova entro 9 metri da lui ed entro il suo campo visivo.
levels.2.features.0.effects.0.options.31.effects.0.text: |-
  Il warlock è in grado di vedere la vera forma di qualsiasi mutaforma o creatura celata da una magia di illusione o trasmutazione, finché quella creatura si trova entro 9 metri da lui ed entro il suo campo visivo.
levels.3.features.0.name: Dono del Patto
levels.3.features.0.text: |-
  Al 3° livello, il patrono ultraterreno elargisce al warlock un dono per ricompensarlo dei suoi fedeli servigi. Il warlock ottiene uno dei seguenti privilegi a sua scelta.

  ### Patto della Catena

  Il warlock impara l'incantesimo trova famiglio e può lanciarlo come rituale. Questo incantesimo non va conteggiato al fine di determinare il numero di incantesimi conosciuti dal warlock.

  Quando il warlock lancia l'incantesimo, può scegliere per il suo famiglio una delle forme normali o una delle forme speciali seguenti: imp, pseudodrago, quasit o spiritello.

  Inoltre, quando effettua l'azione Attacco, il warlock può rinunciare a uno dei suoi attacchi per consentire al suo famiglio di effettuare un suo attacco individuale con la sua reazione.

  ### Patto della Lama

  Il warlock può usare la sua azione per fare apparire un'arma del patto nella sua mano vuota. Può scegliere la forma che questa arma da mischia assume ogni volta che la crea. Il warlock è considerato competente nell'arma fintantoché la impugna. Quest'arma è considerata magica al fine di superare la resistenza e l'immunità agli attacchi e ai danni non magici.

  L'arma del patto scompare se rimane per 1 minuto o più a più di 1,5 metri di distanza dal warlock. L'arma scompare anche se il warlock utilizza di nuovo il privilegio, se la congeda (non è richiesta alcuna azione per farlo), o se muore.

  Il warlock può trasformare un'arma magica nella sua arma del patto celebrando un rituale speciale mentre la impugna. Il rituale dura 1 ora e può essere completato durante un periodo di riposo breve. Una volta completato il rituale, il warlock può congedare l'arma relegandola in uno spazio extradimensionale; da allora in poi compare ogni volta che il warlock crea la sua arma del patto. Non è possibile influenzare un manufatto o un'arma senziente in questo modo. L'arma cessa di essere l'arma del patto se il warlock muore, se celebra un rituale di 1 ora su un'altra arma o se celebra un altro rituale di 1 ora per spezzare il suo vincolo con l'arma. Se l'arma si trova nello spazio extradimensionale quando il vincolo viene spezzato, ricompare ai piedi del warlock.

  ### Patto del Tomo

  Il patrono dona al warlock un grimorio chiamato il Libro delle Ombre. Quando ottiene questo privilegio, il warlock può scegliere tre trucchetti dalla lista degli incantesimi di qualsiasi classe (non devono necessariamente appartenere alla stessa lista). Quando il warlock porta il libro con sé, può lanciare quei trucchetti a volontà. Non vengono conteggiati al fine di determinare il numero di trucchetti conosciuti dal warlock. Anche se non compaiono sulla lista degli incantesimi da warlock, sono comunque considerati incantesimi da warlock per lui.

  Se il Libro delle Ombre va perduto, il warlock può effettuare un cerimoniale da 1 ora per riceverne un altro dal proprio patrono. Tale cerimoniale può essere effettuato durante un periodo di riposo breve o lungo, e provoca la distruzione del vecchio libro. Il libro si riduce in polvere alla morte del warlock.
