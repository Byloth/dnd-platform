levels.2.features.0.effects.0.options.20.text: |-
  Il warlock può lanciare immagine silenziosa a volontà senza spendere uno slot incantesimo o componenti materiali.
levels.2.features.0.effects.0.options.20.effects.0.note: |-
  Si lancia a volontà, senza spendere uno slot incantesimo o componenti materiali.
levels.2.features.0.effects.0.options.21.name: Tutt'uno con le ombre
levels.2.features.0.effects.0.options.21.text: |-
  Prerequisito: 5° livello. Quando il warlock si trova in un'area di luce fioca o di oscurità, può usare la sua azione per diventare invisibile finché non si muove, effettua un'azione o una reazione.
levels.2.features.0.effects.0.options.21.effects.0.name: Tutt'uno con le ombre
levels.2.features.0.effects.0.options.21.effects.0.text: |-
  Quando il warlock si trova in un'area di luce fioca o di oscurità, può usare la sua azione per diventare invisibile finché non si muove, effettua un'azione o una reazione.
levels.2.features.0.effects.0.options.21.effects.0.onUse.0.note: |-
