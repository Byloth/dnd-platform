name: Guscio anti-vita
text: |-
  Una barriera scintillante si proietta dall'incantatore in un raggio di 3 metri, seguendolo nei suoi movimenti e rimanendo centrata su di lui, respingendo tutte le creature diverse da non morti e costrutti. La barriera permane per tutta la durata dell'incantesimo. La barriera impedisce a una creatura influenzata di attraversarla o protendersi oltre essa. Una creatura influenzata può lanciare incantesimi o effettuare attacchi utilizzando armi a distanza o con portata attraverso la barriera. Se l'incantatore si muove in modo che una creatura influenzata sia costretta ad attraversare la barriera, l'incantesimo termina.
