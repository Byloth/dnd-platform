name: Parola guaritrice di massa
text: L'incantatore pronuncia una serie di parole di guarigione e fino a sei creature a sua scelta, entro gittata e che è in grado di vedere, recuperano una quantità di punti ferita pari a 1d4 + il modificatore di caratteristica da incantatore. Questo incantesimo non ha effetto sui non morti o sui costrutti.
higherLevel: Quando l'incantatore lancia questo incantesimo usando uno slot incantesimo di 4° livello o superiore, la guarigione aumenta di 1d4 per ogni slot di livello superiore al 3°.
onCast.0.note: Più il modificatore di caratteristica da incantatore, a ognuna di un massimo di sei creature che l'incantatore è in grado di vedere. Nessun effetto sui non morti o sui costrutti.
