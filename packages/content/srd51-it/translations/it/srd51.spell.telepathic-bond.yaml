name: Legame telepatico
components.m: Pezzi di gusci d'uovo di due tipi di creature diverse.
text: |-
  L'incantatore stringe un legame telepatico con un massimo di otto creature consenzienti a sua scelta entro gittata, collegando mentalmente ogni creatura a tutte le altre per la durata dell'incantesimo. Le creature con un punteggio di Intelligenza pari o inferiore a 2 non sono influenzate da questo incantesimo. Fino al termine dell'incantesimo, i bersagli possono comunicare telepaticamente attraverso il legame, a prescindere che abbiano un linguaggio comune. La comunicazione è possibile attraverso qualsiasi distanza, ma non può estendersi ad altri piani di esistenza.
