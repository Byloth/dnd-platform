name: Collegio della Sapienza
levels.3.features.0.name: Competenze bonus
levels.3.features.0.text: Quando un bardo si unisce al Collegio della Sapienza al 3° livello, ottiene competenza in tre abilità a sua scelta.
levels.3.features.1.name: Parole Taglienti
levels.3.features.1.text: Sempre al 3° livello, il bardo impara anche a fare buon uso del suo ingegno per distrarre, confondere e fiaccare la determinazione e la competenza altrui. Quando una creatura situata entro 18 metri e che il bardo è in grado di vedere effettua un tiro per colpire, una prova di caratteristica o un tiro per i danni, il bardo può usare la sua reazione per spendere uno dei suoi utilizzi di Ispirazione Bardica, tirare un dado di Ispirazione Bardica e sottrarre il numero ottenuto dal tiro della creatura. Può scegliere di utilizzare questo privilegio dopo che la creatura ha effettuato il suo tiro, ma prima che il GM dichiari se il tiro per colpire o la prova di caratteristica abbia avuto successo o meno, o prima che la creatura infligga i danni. La creatura è immune se non è in grado di sentire il bardo o se non può essere affascinata.
levels.3.features.1.effects.0.name: Parole Taglienti
levels.3.features.1.effects.0.trigger: quando una creatura situata entro 18 metri e che sei in grado di vedere effettua un tiro per colpire, una prova di caratteristica o un tiro per i danni
levels.3.features.1.effects.0.text: Spendi un utilizzo di Ispirazione Bardica, tira un dado di Ispirazione Bardica e sottrai il numero ottenuto dal tiro della creatura. Puoi farlo dopo che la creatura ha effettuato il suo tiro, ma prima che il GM dichiari se il tiro per colpire o la prova di caratteristica abbia avuto successo o meno, o prima che la creatura infligga i danni. La creatura è immune se non è in grado di sentirti o se non può essere affascinata.
levels.3.features.1.effects.0.onUse.0.text: Tira un dado di Ispirazione Bardica (taglia table(bard.bardic-inspiration-die)) e sottrailo dal tiro della creatura.
levels.6.features.0.name: Segreti Magici Aggiuntivi
levels.6.features.0.text: Al 6° livello, un bardo impara due incantesimi a sua scelta da qualsiasi classe. Ogni incantesimo scelto deve essere di un livello che il bardo sia in grado di lanciare, come indicato dalla tabella "Bardo", oppure deve essere un trucchetto. Gli incantesimi scelti contano come incantesimi da bardo, ma non contano al fine di determinare il numero di incantesimi da bardo conosciuti.
levels.6.features.0.effects.0.note: Due incantesimi da qualsiasi classe, di un livello che sei in grado di lanciare oppure trucchetti; contano come incantesimi da bardo, ma non contano al fine di determinare il numero di incantesimi da bardo conosciuti.
levels.14.features.0.name: Abilità Impareggiabile
levels.14.features.0.text: A partire dal 14° livello, quando un bardo effettua una prova di caratteristica, può spendere un utilizzo di Ispirazione Bardica. Se lo fa, tira un dado di Ispirazione Bardica e aggiunge il risultato ottenuto alla sua prova di caratteristica. Può scegliere di farlo dopo avere tirato il dado per la prova di caratteristica, ma prima che il GM dichiari se la prova abbia avuto successo o meno.
levels.14.features.0.effects.0.name: Abilità Impareggiabile
levels.14.features.0.effects.0.text: Quando effettui una prova di caratteristica, puoi spendere un utilizzo di Ispirazione Bardica. Se lo fai, tira un dado di Ispirazione Bardica e aggiungi il risultato ottenuto alla tua prova di caratteristica. Puoi scegliere di farlo dopo avere tirato il dado per la prova di caratteristica, ma prima che il GM dichiari se la prova abbia avuto successo o meno.
levels.14.features.0.effects.0.onUse.0.text: Aggiungi un dado di Ispirazione Bardica (taglia table(bard.bardic-inspiration-die)) alla tua prova di caratteristica.
