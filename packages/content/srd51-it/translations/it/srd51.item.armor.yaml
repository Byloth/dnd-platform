name: "Armatura +1, +2 o +3"
text: |-
  Armatura (leggera, media o pesante), rara (+1), molto rara (+2) o leggendaria (+3)

  Il personaggio che indossa quest'armatura ottiene un bonus alla CA determinato dalla sua rarità.
