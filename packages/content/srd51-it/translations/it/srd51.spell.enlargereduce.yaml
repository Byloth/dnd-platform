name: Ingrandire/Ridurre
components.m: Un pizzico di polvere di ferro.
text: |-
  Per tutta la durata dell'incantesimo, l'incantatore ingrandisce o riduce la taglia di una creatura o un oggetto entro gittata che è in grado di vedere, scegliendo una creatura o un oggetto che non sia né indossato né trasportato. Il bersaglio può effettuare un tiro salvezza su Costituzione se non è consenziente. Se lo supera, l'incantesimo non sortisce alcun effetto. Se il bersaglio è una creatura, tutto ciò che indossa o trasporta cambia di taglia insieme a lei e, se lascia cadere un oggetto, questo torna immediatamente alla sua taglia normale.

  **Ingrandire.** La taglia del bersaglio raddoppia in tutte le dimensioni e il suo peso aumenta di otto volte. Questa crescita aumenta la sua taglia di una categoria (da Media a Grande, per esempio). Se non c'è abbastanza spazio per consentire al bersaglio di raddoppiare la sua taglia, la creatura o l'oggetto in questione cresce fino a raggiungere la taglia maggiore possibile nello spazio disponibile. Fino al termine dell'incantesimo, il bersaglio dispone anche di vantaggio alle prove di Forza e ai tiri salvezza su Forza. Inoltre, le sue armi crescono fino ad adattarsi alla sua nuova taglia. Finché queste armi sono ingrandite, gli attacchi effettuati dal bersaglio con esse infliggono 1d4 danni extra.

  **Ridurre.** La taglia del bersaglio è dimezzata in tutte le dimensioni e il suo peso si riduce a un ottavo del peso normale. Questa riduzione diminuisce la sua taglia di una categoria (da Media a Piccola, per esempio). Fino al termine dell'incantesimo, il bersaglio subisce anche svantaggio alle prove di Forza e ai tiri salvezza su Forza. Inoltre, le sue armi si riducono fino ad adattarsi alla sua nuova taglia. Finché queste armi sono ridotte, gli attacchi effettuati dal bersaglio con esse infliggono 1d4 danni in meno (i danni non possono scendere a meno di 1).
effects.0.text: "Ingrandire: la tua taglia raddoppia in tutte le dimensioni (una categoria di taglia in più, peso moltiplicato per otto), disponi di vantaggio alle prove di Forza e ai tiri salvezza su Forza e i tuoi attacchi con le armi ingrandite infliggono 1d4 danni extra. Ridurre: la tua taglia è dimezzata (una categoria di taglia in meno, peso ridotto a un ottavo), subisci svantaggio alle prove di Forza e ai tiri salvezza su Forza e i tuoi attacchi con le armi ridotte infliggono 1d4 danni in meno (non meno di 1)."
effects.0.note: Dipende dall'opzione scelta (ingrandire o ridurre, al momento del lancio), quindi non è espresso come vantaggio ai tiri, modifica degli attacchi o modifica della taglia.
onCast.0.text: Un bersaglio non consenziente effettua un tiro salvezza su Costituzione; se lo supera, l'incantesimo non sortisce alcun effetto. Tutto ciò che la creatura indossa o trasporta cambia di taglia insieme a lei; un oggetto lasciato cadere torna alla sua taglia normale.
