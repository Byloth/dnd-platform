name: Tiefling
text: I tiefling condividono alcuni tratti razziali frutto della loro discendenza infernale.
features.0.name: Incremento dei punteggi di caratteristica
features.0.text: Il punteggio di Intelligenza di un tiefling aumenta di 1 e quello di Carisma aumenta di 2.
features.1.name: Velocità
features.1.text: La velocità base sul terreno di un tiefling è di 9 metri.
features.2.name: Scurovisione
features.2.text: Grazie al suo retaggio infernale, un tiefling beneficia di una vista superiore nell'oscurità e nelle condizioni di luce fioca. In condizioni di luce fioca, può vedere fino a una distanza di 18 metri come se si trovasse in condizioni di luce intensa e nell'oscurità come se si trovasse in presenza di luce fioca. Nell'oscurità non è in grado di discernere i colori, ma solo le tonalità di grigio.
features.3.name: Età
features.3.text: I tiefling raggiungono la maturità con la stessa velocità degli umani, ma vivono qualche anno in più.
features.4.name: Allineamento
features.4.text: I tiefling non tendono al male per natura, ma molti ne subiscono comunque il richiamo. Malvagi o meno che siano, molti tiefling aderiscono a un allineamento caotico a causa della loro indole indipendente.
features.5.name: Taglia
features.5.text: I tiefling hanno all'incirca le stesse dimensioni e corporatura degli umani. Un tiefling è una creatura di taglia Media.
features.6.name: Linguaggi
features.6.text: Un tiefling può parlare, leggere e scrivere in Comune e in Infernale.
features.7.name: Resistenza infernale
features.7.text: Un tiefling dispone di resistenza ai danni da fuoco.
features.8.name: Eredità infernale
features.8.text: Un tiefling conosce il trucchetto taumaturgia. Quando raggiunge il 3° livello, può lanciare l'incantesimo intimorire infernale come incantesimo di 2° livello una volta con questo tratto e recuperare la capacità di farlo quando completa un riposo lungo. Quando raggiunge il 5° livello può lanciare l'incantesimo oscurità una volta con questo tratto e recuperare la capacità di farlo quando completa un riposo lungo. La caratteristica da incantatore per questi incantesimi è Carisma.
