name: Oscurità
components.m: Pelo di pipistrello e una goccia di pece o un pezzo di carbone.
text: |-
  L'incantatore sceglie un punto situato entro gittata da cui si diffonde un'oscurità magica che riempie una sfera del raggio di 4,5 metri per la durata dell'incantesimo. L'oscurità si diffonde oltre gli angoli. Una creatura dotata di scurovisione non è in grado di vedere attraverso questa oscurità e le luci non magiche non possono illuminarla. Se il punto scelto dall'incantatore si trova su un oggetto che sta impugnando o che non è indossato o trasportato da nessuno, l'oscurità si diffonde dall'oggetto e si muove assieme a esso. Coprire completamente la fonte dell'oscurità con un oggetto opaco, come una scodella o un elmo, blocca l'oscurità. Se una parte dell'area di questo incantesimo si sovrappone a un'area di luce creata da un incantesimo di 2° livello o inferiore, l'incantesimo che ha creato la luce viene dissolto.
