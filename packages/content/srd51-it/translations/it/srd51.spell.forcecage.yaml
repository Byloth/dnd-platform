name: Gabbia di forza
components.m: Polvere di rubino del valore di 1.500 mo.
text: |-
  Una prigione cubica di forza magica invisibile e immobile si materializza intorno a un'area entro gittata scelta dall'incantatore. La prigione può essere una gabbia o una struttura solida a sua scelta. Una prigione a forma di gabbia può misurare fino a 6 metri per lato ed essere composta da sbarre di 1,25 cm di diametro disposte a 1,25 cm di distanza. Una prigione a forma di scatola può misurare fino a 3 metri per lato e crea una barriera compatta che impedisce a ogni tipo di materia di passarle attraverso e blocca qualsiasi incantesimo lanciato verso l'interno o l'esterno dell'area. Al momento del lancio dell'incantesimo, ogni creatura completamente all'interno dell'area della gabbia è intrappolata. Le creature situate solo parzialmente all'interno dell'area o quelle di dimensioni troppo grandi per essere contenute nell'area sono spinte lontano dal centro dell'area finché non ne fuoriescono completamente. Una creatura all'interno della gabbia non può uscirne tramite mezzi non magici. Se la creatura prova a utilizzare il teletrasporto o il viaggio interplanare, deve prima effettuare un tiro salvezza su Carisma. Se lo supera, la creatura può usare quella magia per uscire dalla gabbia, mentre se lo fallisce, non può uscirne e spreca un uso dell'incantesimo o dell'effetto. La gabbia si estende anche sul Piano Etereo, bloccando i viaggi eterei. Questo incantesimo non può essere dissolto con dissolvi magie.
