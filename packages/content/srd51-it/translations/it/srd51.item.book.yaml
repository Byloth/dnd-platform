name: Libro
text: Un libro può contenere poesie, resoconti storici, informazioni in un campo specifico di conoscenze, diagrammi e appunti su un marchingegno gnomesco o pressoché ogni informazione che sia possibile trasmettere tramite testi e immagini. Se contiene incantesimi, si tratta di un libro degli incantesimi (descritto di seguito).
