name: Segugio fedele
components.m: Un fischietto d'argento, un pezzo d'osso e un filo.
text: |-
  L'incantatore evoca un cane da guardia fantasma in uno spazio libero entro gittata che è in grado di vedere e che lì rimane per la durata dell'incantesimo, finché l'incantatore non lo congeda con un'azione o si allontana a più di 30 metri da lui. Il segugio è invisibile a tutte le creature tranne all'incantatore e non può essere ferito. Quando una creatura di taglia Piccola o superiore si avvicina entro 9 metri dal segugio senza prima aver pronunciato la parola d'ordine specificata dall'incantatore al momento del lancio dell'incantesimo, il segugio inizia ad abbaiare sonoramente. Inoltre, il segugio può vedere le creature invisibili e proiettare la sua vista sul Piano Etereo, e ignora le illusioni. All'inizio di ogni turno dell'incantatore, il segugio tenta di mordere una creatura ostile all'incantatore entro 1,5 metri da lui. Il bonus di attacco del segugio è pari al modificatore di caratteristica da incantatore + il bonus di competenza dell'incantatore. Se il colpo va a segno, infligge 4d8 danni perforanti.
effects.0.name: "Segugio fedele: morso"
effects.0.text: All'inizio di ogni tuo turno, il segugio tenta di mordere una creatura a te ostile entro 1,5 metri da lui.
effects.0.note: Il bonus di attacco del segugio è pari al tuo modificatore di caratteristica da incantatore + il tuo bonus di competenza; nel tiro compare solo il bonus di competenza (in v0 non esiste una variabile per la caratteristica da incantatore).
effects.1.text: Il cane da guardia fantasma è invisibile a tutte le creature tranne te e non può essere ferito; abbaia sonoramente quando una creatura di taglia Piccola o superiore si avvicina entro 9 metri senza prima aver pronunciato la parola d'ordine; può vedere le creature invisibili e sul Piano Etereo, e ignora le illusioni. Rimane fino al termine dell'incantesimo, finché non lo congedi con un'azione o finché non ti allontani a più di 30 metri da lui.
