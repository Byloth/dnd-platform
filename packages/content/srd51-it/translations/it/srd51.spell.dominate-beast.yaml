name: Dominare bestie
text: |-
  L'incantatore tenta di soggiogare una bestia entro gittata che è in grado di vedere e che deve superare un tiro salvezza su Saggezza, altrimenti rimarrà affascinata per la durata dell'incantesimo. Se l'incantatore o le creature a lui amichevoli stanno combattendo questa bestia, essa dispone di vantaggio al tiro salvezza. Mentre la bestia è affascinata, l'incantatore ha con essa un legame telepatico finché si trovano sullo stesso piano di esistenza. L'incantatore può utilizzare questo legame telepatico per impartire comandi alla creatura mentre è cosciente (nessuna azione richiesta), la quale fa del suo meglio per obbedire. L'incantatore può specificare una linea d'azione semplice e generale, come "attacca quella creatura", "corri fin laggiù" o "portami quell'oggetto". Se la creatura completa l'ordine e non riceve ulteriori indicazioni da parte dell'incantatore, si difende e si protegge al meglio delle sue abilità. L'incantatore può usare la sua azione per assumere il controllo totale e preciso del bersaglio. Fino al termine del turno successivo dell'incantatore, la creatura compie solamente le azioni decise da lui e non fa nulla che l'incantatore non le consenta di fare. Durante questo periodo, l'incantatore può anche fare in modo che la creatura utilizzi una reazione, ma per riuscirci lui dovrà fare altrettanto. Ogni volta che il bersaglio subisce danni, effettua un tiro salvezza su Saggezza contro l'incantesimo: in caso di successo, l'incantesimo termina.
higherLevel: |-
  Quando l'incantatore lancia questo incantesimo usando uno slot incantesimo di 5° livello, la durata diventa concentrazione, fino a 10 minuti. Quando usa uno slot incantesimo di 6° livello, la durata diventa concentrazione, fino a 1 ora. Quando usa uno slot incantesimo di 7° livello o superiore, la durata diventa concentrazione, fino a 8 ore.
effects.0.name: "Dominare bestie: controllo totale"
effects.0.text: |-
  Assume il controllo totale e preciso della bestia affascinata fino al termine del turno successivo dell'incantatore: la bestia compie solamente le azioni decise da lui; l'incantatore può anche farle usare una reazione usando la propria reazione.
onCast.0.note: |-
  Se fallisce un tiro salvezza su Saggezza (con vantaggio se l'incantatore o le creature a lui amichevoli la stanno combattendo). Mentre è affascinata, l'incantatore ha con lei un legame telepatico per impartirle comandi (nessuna azione richiesta); ogni volta che il bersaglio subisce danni ripete il tiro salvezza e, in caso di successo, l'incantesimo termina. Durata: concentrazione, fino a 10 minuti con uno slot di 5° livello, 1 ora con uno di 6°, 8 ore con uno di 7° o superiore.
