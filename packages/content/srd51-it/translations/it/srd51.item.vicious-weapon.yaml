name: Arma spietata
text: |-
  Arma (qualsiasi), rara

  Quando il personaggio ottiene un risultato di 20 al tiro per colpire con quest'arma magica, il colpo critico infligge 2d6 danni extra del tipo inflitto dall'arma.
features.0.name: Arma magica
features.0.effects.0.note: Qualsiasi arma; quest'oggetto non ha proprietà di un'arma base proprie.
