name: Localizza animali o vegetali
components.m: Un ciuffo di peli di un segugio.
text: |-
  L'incantatore descrive o nomina un tipo specifico di bestia o vegetale. Concentrandosi sulla voce della natura intorno a lui, apprende la direzione e la distanza fino alla creatura o al vegetale di quel tipo più vicino entro 7,5 km, se ne è presente almeno uno.
