name: Individuazione dei pensieri
components.m: Una moneta di rame.
text: |-
  Per la durata dell'incantesimo, l'incantatore può leggere i pensieri di alcune creature. Quando lancia l'incantesimo e come azione in ogni turno finché l'incantesimo non termina, l'incantatore può concentrarsi su una creatura che è in grado di vedere entro 9 metri da lui. Se la creatura scelta ha un'Intelligenza pari o inferiore a 3 o non parla alcun linguaggio, l'incantesimo non avrà effetti su di lei. All'inizio, l'incantatore apprende i pensieri superficiali della creatura, ciò che sta pensando in quel momento. Con un'azione, l'incantatore può spostare l'attenzione verso i pensieri di un'altra creatura o provare a scavare più in profondità nella mente della creatura su cui era già concentrato. Nell'ultimo caso, il bersaglio deve effettuare un tiro salvezza su Saggezza. Se lo fallisce, l'incantatore riesce ad avere accesso ai suoi ragionamenti (se ne fa), al suo stato emotivo e a ciò che principalmente riempie la sua mente (qualcosa di cui si preoccupa, che ama o odia). In caso di successo, l'incantesimo termina. In ogni caso, il bersaglio è consapevole che l'incantatore ha accesso alla sua mente e, se quest'ultimo non sposta la sua attenzione verso i pensieri di un'altra creatura, può usare la sua azione nel proprio turno per effettuare una prova di Intelligenza contrapposta alla prova di Intelligenza dell'incantatore; in caso di successo, l'incantesimo termina. Le domande rivolte verbalmente alla creatura bersagliata plasmano naturalmente il corso dei suoi pensieri, per questo l'incantesimo è particolarmente efficace nel corso di un interrogatorio. L'incantatore può inoltre utilizzare questo incantesimo per individuare la presenza di creature pensanti che non è in grado di vedere. Quando lancia l'incantesimo o come azione durante la sua durata, l'incantatore può cercare pensieri in un raggio di 9 metri da sé. L'incantesimo può penetrare le barriere, ma viene bloccato da 60 cm di roccia, 5 cm di un metallo diverso dal piombo o da una sottile lamina di piombo. L'incantatore non può rilevare una creatura con un'Intelligenza pari o inferiore a 3, oppure una creatura che non parla alcun linguaggio. Una volta rilevata la presenza di una creatura in questo modo, l'incantatore può leggere i suoi pensieri per il resto della durata dell'incantesimo come descritto in precedenza, anche se non è in grado di vederla; la creatura, tuttavia, deve comunque trovarsi entro gittata.
