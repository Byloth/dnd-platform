name: Fondersi nella pietra
text: L'incantatore entra in un oggetto o in una superficie di pietra sufficientemente grande da contenere il suo corpo, fondendosi con esso insieme a tutto l'equipaggiamento che trasporta per la durata dell'incantesimo. Usando il suo movimento, entra nella pietra in un punto che è in grado di toccare e nulla della sua presenza rimane visibile o individuabile da qualsiasi senso non magico. Mentre è fuso nella pietra, l'incantatore non può vedere ciò che accade al di fuori e subisce svantaggio in qualsiasi prova di Saggezza (Percezione) effettuata per udire i suoni all'esterno. Rimane tuttavia cosciente del passare del tempo e può lanciare incantesimi su di sé. L'incantatore può usare il suo movimento per uscire dalla pietra nel punto in cui è entrato, ponendo fine all'incantesimo. Altrimenti, non può muoversi. Eventuali danni fisici minori inflitti alla pietra non danneggiano l'incantatore, ma una distruzione parziale o un'alterazione nella forma (al punto da non contenerne più il corpo) provoca l'espulsione dell'incantatore, infliggendogli 6d6 danni contundenti. La completa distruzione della pietra (o la sua trasmutazione in una sostanza differente) provoca l'espulsione dell'incantatore e gli infligge 50 danni contundenti. Se l'incantatore viene espulso, cade prono nello spazio libero più vicino al punto in cui era entrato.
