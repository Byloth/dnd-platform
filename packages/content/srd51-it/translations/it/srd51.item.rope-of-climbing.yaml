name: Corda per scalare
text: |-
  Oggetto meraviglioso, non comune

  Questa corda di seta è lunga 18 metri, pesa 1,5 kg e può reggere fino a 1.500 kg di carico. Se il personaggio ne impugna un'estremità e usa un'azione per pronunciare la parola d'ordine, la corda si anima. Come azione bonus, il personaggio può ordinare all'altra estremità di muoversi verso una destinazione da lui indicata. L'estremità si muove di 3 metri durante il turno in cui il personaggio impartisce l'ordine e di 3 metri a ogni turno successivo del personaggio, finché non raggiunge la destinazione, non arriva alla sua lunghezza massima o finché il personaggio non le ordina di fermarsi. Il personaggio può anche ordinare alla corda di legarsi saldamente a un oggetto o di sciogliersi, annodarsi o sciogliere i nodi, oppure di arrotolarsi per essere trasportata.

  Se il personaggio le ordina di annodarsi, lungo la corda compare una serie di grandi nodi a distanza di 30 cm l'uno dall'altro. Quando è annodata, la corda si accorcia fino a una lunghezza di 15 metri e conferisce vantaggio alle prove effettuate per scalarla.

  La corda possiede CA 20 e 20 punti ferita. Recupera 1 punto ferita ogni 5 minuti, purché le rimanga almeno 1 punto ferita. Se la corda scende a 0 punti ferita, viene distrutta.
features.0.name: Animare
features.0.effects.0.name: Animare la corda
features.0.effects.0.text: |-
  Impugna un'estremità della corda di 18 metri e pronuncia la parola d'ordine per animarla. Puoi ordinarle di legarsi saldamente a un oggetto o di sciogliersi, annodarsi o sciogliere i nodi, oppure di arrotolarsi per essere trasportata. Annodata, la corda si accorcia fino a 15 metri con nodi a distanza di 30 cm l'uno dall'altro e conferisce vantaggio alle prove effettuate per scalarla.
features.0.effects.0.onUse.0.text: |-
  La corda regge fino a 1.500 kg; possiede CA 20 e 20 punti ferita, recupera 1 punto ferita ogni 5 minuti purché le rimanga almeno 1 punto ferita e viene distrutta a 0.
features.0.effects.1.name: Comandare la corda
features.0.effects.1.text: |-
  Ordina all'altra estremità di muoversi verso una destinazione a tua scelta. Si muove di 3 metri durante il turno in cui impartisci l'ordine e di 3 metri a ogni tuo turno successivo, finché non raggiunge la destinazione, la sua lunghezza massima o finché non le ordini di fermarsi.
