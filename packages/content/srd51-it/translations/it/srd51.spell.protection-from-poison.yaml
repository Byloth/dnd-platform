name: Protezione dai veleni
text: |-
  L'incantatore tocca una creatura, neutralizzandone il veleno nel caso fosse avvelenata. Se il bersaglio è afflitto da più veleni, l'incantatore neutralizza un veleno di cui conosce la presenza o ne neutralizza uno casuale. Per la durata dell'incantesimo, il bersaglio dispone di vantaggio ai tiri salvezza per non essere avvelenato e di resistenza ai danni da veleno.
onCast.0.text: |-
  Se il bersaglio è avvelenato, neutralizzi un veleno (uno di cui conosci la presenza, o uno casuale se il bersaglio è afflitto da più veleni).
