name: Sacro vendicatore
text: |-
  Arma (qualsiasi spada), leggendaria (richiede sintonia con un paladino)

  Il personaggio ottiene un bonus di +3 ai tiri per colpire e ai tiri per i danni effettuati con quest'arma magica. Quando colpisce con quest'arma un immondo o un non morto, quella creatura subisce 2d10 danni radiosi extra.

  Finché il personaggio impugna la spada sguainata, essa emana intorno a sé un'aura del raggio di 3 metri. Il personaggio e tutte le creature amichevoli nei suoi confronti situate all'interno dell'aura dispongono di vantaggio ai tiri salvezza contro gli incantesimi e gli altri effetti magici. Se il personaggio possiede 17 o più livelli nella classe del paladino, il raggio dell'aura aumenta a 9 metri.
attunement.by: un paladino
