name: Background
text: |-
  Ogni storia ha un inizio. Il background di un personaggio rivela da dove viene, come è diventato un avventuriero e qual è il suo posto nel mondo. Un guerriero potrebbe essere stato un coraggioso cavaliere o un soldato veterano in passato. Un mago potrebbe essere stato un sapiente o un artigiano. Un ladro potrebbe essersi guadagnato da vivere lavorando per una gilda o intrattenendo il pubblico come giullare.

  La scelta di un background fornisce a un personaggio alcuni importanti spunti narrativi sulla sua identità. La domanda più importante da porsi riguardo al background è: *cosa è cambiato?* Perché il personaggio ha smesso di fare ciò che stava facendo nel background e si è dato all'avventura? Dove ha trovato il denaro per acquistare il suo equipaggiamento di partenza, oppure, se proviene da un background benestante, perché ora non possiede una maggiore quantità di denaro? Come ha appreso le abilità della sua classe? Cosa lo distingue dagli individui comuni che condividono il suo stesso background?

  L'esempio di background qui presentato fornisce sia benefici concreti (privilegi, competenze e linguaggi), sia suggerimenti di interpretazione.
