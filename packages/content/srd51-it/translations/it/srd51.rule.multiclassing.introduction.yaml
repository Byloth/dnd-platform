name: "Multiclasse"
text: |-
  L'avanzamento multiclasse consente a un personaggio di guadagnare livelli in più classi. In questo modo, è possibile combinare le abilità di quelle classi per realizzare un tipo di personaggio che potrebbe non essere rappresentato a dovere dalle opzioni di classe standard.

  Grazie a questa regola, un personaggio può acquisire un livello in una nuova classe ogni volta che avanza di livello, anziché guadagnare un livello nella sua classe attuale. I livelli in tutte le sue classi, sommati, determinano il suo livello del personaggio. Ad esempio, con tre livelli da mago e due da guerriero, si ottiene un personaggio di 5° livello.

  Man mano che un personaggio avanza di livello, può continuare a concentrarsi principalmente sulla propria classe originale e acquisire soltanto pochi livelli in un'altra classe, oppure può cambiare rotta definitivamente, senza mai voltarsi a guardare la classe che si è lasciato alle spalle. Potrebbe perfino iniziare ad avanzare di livello in una terza o una quarta classe. Rispetto a un personaggio monoclasse, rinuncerà a certe specializzazioni, ma guadagnerà in versatilità.
