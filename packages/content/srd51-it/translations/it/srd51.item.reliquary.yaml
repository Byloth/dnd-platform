name: Reliquiario
text: Un simbolo sacro è la rappresentazione di un dio o di un pantheon. Potrebbe essere un amuleto che raffigura il simbolo di una divinità, o uno scudo che porta quel simbolo inciso come emblema, o un minuscolo scrigno contenente il frammento di una reliquia sacra. L'appendice B del Manuale del Giocatore "Pantheon fantasy-storici" elenca i simboli comunemente associati alla maggior parte delle divinità del multiverso. Un chierico o un paladino può usare un simbolo sacro come focus da incantatore. Per usare il simbolo in questo modo, l'incantatore deve impugnarlo in modo ben visibile o portarlo su uno scudo.
