name: "Condurre ricerche"
text: |-
  I periodi tra un'avventura e l'altra offrono ottime opportunità per condurre ricerche e fare luce sui misteri che sono emersi nel corso della campagna. Per condurre ricerche potrebbe essere necessario setacciare tomi polverosi e pergamene fragili in una biblioteca o pagare da bere alla gente del luogo per apprendere le nuove dicerie e gli ultimi pettegolezzi direttamente dalle loro labbra.

  Quando un personaggio inizia le sue ricerche, il GM determina se le informazioni sono disponibili, quanti giorni fuori servizio ci vorranno per trovarle e se le ricerche sono soggette a qualche vincolo (come per esempio trovare un individuo, un tomo o un luogo in particolare). Il GM potrebbe anche richiedere al personaggio di effettuare una o più prove di caratteristica, o una prova di Intelligenza (Indagare), per trovare indizi che portino alle informazioni che cerca, o ancora una prova di Carisma (Persuasione) per assicurarsi l'aiuto di qualcuno. Una volta soddisfatte tali condizioni, il personaggio apprende le informazioni, se esse sono disponibili.

  Per ogni giorno di ricerche, il personaggio deve spendere 1 mo per coprire le spese.

  Questo costo è considerato aggiuntivo alle sue normali spese dello stile di vita.
