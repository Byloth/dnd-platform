name: Pozzo dei mondi
text: |-
  Oggetto meraviglioso, leggendario

  Quando è piegato, questo panno di elegante tessuto nero morbido come la seta ha le dimensioni di un fazzoletto. Una volta spiegato, copre una superficie circolare di 1,8 metri di diametro.

  Il personaggio può usare un'azione per stendere e posizionare il pozzo dei mondi su una superficie solida, creando un portale a doppio senso verso un altro mondo o piano di esistenza. Ogni volta che l'oggetto apre un portale, il GM decide dove porterà. Il personaggio può usare un'azione per chiudere un portale aperto afferrandone i lembi e ripiegandoli. Una volta che ha aperto un portale, il pozzo dei mondi non può essere riutilizzato per 1d8 ore.
