features.0.effects.1.text: "Stendi e posiziona il pozzo su una superficie solida: crea un portale a doppio senso verso un altro mondo o piano di esistenza. Ogni volta che l'oggetto apre un portale, il GM decide dove porterà."
features.0.effects.1.onUse.0.text: Il GM decide dove porterà il portale.
features.0.effects.2.name: Chiudere il portale
features.0.effects.2.text: Afferra i lembi del panno e ripiegali per chiudere un portale aperto.
