name: Bastone dei tuoni e fulmini
text: |-
  Bastone, molto raro (richiede sintonia)

  Questo bastone può essere impugnato come un bastone ferrato magico che garantisce un bonus di +2 ai tiri per colpire e ai tiri per i danni effettuati con esso. Possiede anche le seguenti proprietà aggiuntive. Quando una di queste proprietà viene usata, non può essere riutilizzata fino all'alba successiva.

  ***Fulmini.*** Quando il personaggio colpisce con un attacco in mischia usando questo bastone, il bersaglio subisce 2d6 danni da fulmine extra.

  ***Tuono.*** Quando il personaggio colpisce con un attacco in mischia usando questo bastone, quest'ultimo scatena un tuono che può essere udito fino a 90 metri. Il bersaglio colpito deve superare un tiro salvezza su Costituzione con CD 17, altrimenti sarà stordito fino alla fine del suo turno successivo.

  ***Colpo del fulmine.*** Il personaggio può usare un'azione per generare un fulmine che guizza dalla punta del bastone lungo una linea larga 1,5 metri e lunga 36 metri. Ogni creatura su quella linea deve effettuare un tiro salvezza su Destrezza con CD 17, subendo 9d6 danni da fulmine in caso di fallimento, o la metà dei danni in caso di successo.

  ***Rombo di tuono.*** Il personaggio può usare un'azione per fare in modo che il bastone emetta un rombo di tuono assordante, udibile fino a 180 metri. Ogni creatura entro 18 metri dal personaggio (escluso il personaggio stesso) deve superare un tiro salvezza su Costituzione con CD 17. Se lo fallisce, subisce 2d6 danni da tuono e diventa assordata per 1 minuto, mentre se lo supera, subisce la metà di quei danni e non viene assordata.

  ***Tuono e fulmine.*** Il personaggio può usare un'azione per attivare le proprietà Colpo del fulmine e Rombo di tuono contemporaneamente. Così facendo il personaggio non consuma l'uso giornaliero di quelle proprietà, ma solamente l'uso di questa.
