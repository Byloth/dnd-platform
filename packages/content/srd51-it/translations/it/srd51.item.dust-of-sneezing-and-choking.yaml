name: "Polvere dello starnuto e del soffocamento"
text: |-
  Oggetto meraviglioso, non comune

  Questa polvere sembra sabbia molto sottile ed è contenuta in un piccolo contenitore. Ha lo stesso aspetto della polvere dell'invisibilità e un incantesimo identificare la indica come tale. Nel contenitore si trova polvere a sufficienza per un singolo uso.

  Quando il personaggio usa un'azione per gettare in aria una manciata di polvere, lui e ogni creatura che necessita di respirare situata entro 9 metri da lui devono superare un tiro salvezza su Costituzione con CD 15, altrimenti non riescono più a respirare e iniziano a starnutire in modo incontrollato. Le creature influenzate in questo modo diventano incapacitate e soffocano. Finché una creatura resta cosciente, può ripetere il tiro salvezza alla fine di ogni suo turno, ponendo fine all'effetto su di lei in caso di successo. Tale effetto può terminare anche grazie all'incantesimo ristorare inferiore.
onUse.0.text: "Getta in aria una manciata di polvere con un'azione: tu e ogni creatura che necessita di respirare entro 9 metri dovete superare un tiro salvezza su Costituzione con CD 15, altrimenti non riuscite più a respirare e starnutite in modo incontrollato (incapacitati e in soffocamento). Una creatura cosciente ripete il tiro salvezza alla fine di ogni suo turno, ponendo fine all'effetto in caso di successo; anche ristorare inferiore pone fine all'effetto. La polvere è sufficiente per un singolo uso."
