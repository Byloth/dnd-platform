name: Gli allineamenti nel multiverso
text: |-
  Per molte creature pensanti, l'allineamento è una scelta morale. Gli umani, i nani, gli elfi e le altre razze umanoidi possono scegliere se seguire la via del bene o del male, della legge o del caos. Stando alle leggende, le divinità di allineamento buono che crearono queste razze fecero loro dono del libero arbitrio per consentire di scegliere la via morale da seguire, ben consce che il bene senza il libero arbitrio equivale a schiavitù.

  Le divinità malvagie che crearono altre razze, tuttavia, costrinsero quelle razze a servirle. Di conseguenza, tali razze hanno una forte tendenza innata a emulare la natura delle loro divinità. Molti orchi condividono la natura violenta e selvaggia degli dèi orcheschi e di conseguenza tendono al male. Anche se un orco sceglie un allineamento buono, dovrà lottare contro le sue tendenze innate per tutta la vita. (Perfino i mezzorchi sono soggetti alle costanti pulsioni dovute all'influenza del dio orchesco.)

  L'allineamento è una parte essenziale della natura dei celestiali e degli immondi. Un diavolo non sceglie di essere legale malvagio e non tende a questo allineamento: è la sua stessa essenza a essere legale malvagia. Se per qualche motivo cessasse di essere legale malvagio, cesserebbe di essere un diavolo.

  La maggior parte delle creature prive di una mente razionale è anche priva di allineamento ed è definita **senza allineamento**. Una tale creatura non è in grado di fare una scelta etica o morale e agisce soltanto in base alla sua natura bestiale. Gli squali, per esempio, sono predatori feroci, ma non sono malvagi: di fatto, non possiedono allineamento.
