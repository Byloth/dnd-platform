name: Forma eterea
text: |-
  L'incantatore mette piede nelle regioni di confine del Piano Etereo, nell'area in cui si sovrappone al suo piano attuale. Rimane nel Confine Etereo per la durata dell'incantesimo o finché non utilizza la sua azione per terminarlo. Durante questo periodo, l'incantatore può muoversi in ogni direzione. Muovendosi su o giù, ogni 30 cm di movimento gli costano 30 cm extra. L'incantatore può sentire e vedere il piano da cui proviene, ma tutto gli appare grigio e visibile solo fino a una distanza di 18 metri. Mentre l'incantatore si trova sul Piano Etereo, può influenzare ed essere influenzato solo dalle creature che si trovano su quel piano. Le creature che non sono presenti sul Piano Etereo non possono percepire o interagire con l'incantatore, a meno che non siano dotate di magia o di una qualche capacità speciale per farlo. L'incantatore ignora tutti gli oggetti e gli effetti che non si trovano sul Piano Etereo, cosa che gli consente di muoversi attraverso gli oggetti che percepisce sul piano da cui proviene. Al termine dell'incantesimo, l'incantatore ritorna immediatamente sul piano di provenienza, nel punto in cui si trova attualmente. Se quel punto è occupato da un oggetto solido o da una creatura, l'incantatore viene subito sbalzato nello spazio libero più vicino che può occupare e subisce una quantità di danni da forza pari al doppio del numero di metri di cui si è mosso. Questo incantesimo non ha effetto se l'incantatore lo lancia mentre si trova sul Piano Etereo o su un piano non confinante, come uno dei Piani Esterni.
higherLevel: |-
  Quando l'incantatore lancia questo incantesimo usando uno slot incantesimo di 8° livello o superiore, può bersagliare fino a tre creature consenzienti (incluso sé stesso) per ogni slot superiore al 7°. Al momento del lancio dell'incantesimo, le creature non devono trovarsi a più di 3 metri dall'incantatore.
