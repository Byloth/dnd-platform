name: "Addestrarsi"
text: |-
  Un personaggio può trascorrere il tempo tra un'avventura e l'altra ad apprendere un nuovo linguaggio o ad addestrarsi nell'utilizzo di un tipo di strumenti. Il GM potrebbe concedere ulteriori opzioni di addestramento.

  Innanzitutto, il personaggio deve trovare un istruttore disposto a insegnargli ciò che desidera apprendere. Il GM determina quanto tempo ci vuole e se sono richieste una o più prove di caratteristica.

  L'addestramento dura 250 giorni e costa 1 mo al giorno. Dopo avere speso il denaro e impiegato l'ammontare di tempo richiesto, il personaggio apprende il linguaggio o ottiene la competenza nel nuovo strumento.
