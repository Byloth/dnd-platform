name: Ottenere un 1 o un 20
text: |-
  A volte la sorte benedice o maledice un combattente: un novizio può fare centro e un veterano può mancare il bersaglio.

  Se il risultato del tiro del d20 per un attacco è un 20, l'attacco va a segno a prescindere da qualsiasi modificatore o dalla CA del bersaglio. Questo viene definito un colpo critico.

  Se il risultato del tiro del d20 per un attacco è un 1, l'attacco manca a prescindere da qualsiasi modificatore o dalla CA del bersaglio.
