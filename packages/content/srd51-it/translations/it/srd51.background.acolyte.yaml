name: Accolito
text: |-
  Un accolito ha passato la sua vita a servire un tempio dedicato a una specifica divinità o un pantheon di divinità. Funge da intermediario tra il reame del sacro e il mondo dei mortali, celebrando riti solenni e offrendo sacrifici al fine di radunare nuovi fedeli presso il suo patrono divino. Non è necessariamente un chierico, in quanto celebrare i riti sacri è ben diverso da incanalare il potere divino.

  Il personaggio sceglie un dio, un pantheon di divinità o un altro essere semi-divino tra quelli elencati in "Pantheon fantasy-storici" o tra quelli specificati dal GM, e si accorda con quest'ultimo per definire in dettaglio la natura del suo servizio religioso. Era un funzionario minore in un tempio, dove è stato cresciuto fin dall'infanzia per assistere i sacerdoti nei loro riti? Oppure è un sommo sacerdote che improvvisamente ha udito un richiamo che lo ha spinto a servire il suo dio in modo diverso? Forse era il capo di un piccolo culto al di fuori delle strutture tradizionali del tempio, o addirittura un gruppo occulto al servizio di un padrone immondo che ora l'accolito ha rinnegato.
equipment.text: Un simbolo sacro (donatogli quando è stato ordinato come sacerdote), un libro di preghiere o una ruota della preghiera, 5 bastoncini di incenso, vesti, un abito comune, una borsa con 15 mo
features.0.name: Rifugio dei Fedeli
features.0.text: |-
  Un accolito gode del rispetto di coloro che condividono la sua fede ed è in grado di celebrare le cerimonie religiose della sua divinità. L'accolito e i suoi compagni di avventura possono aspettarsi di ricevere cure e guarigioni gratuite presso un tempio, un santuario o un'altra presenza stabile della sua fede, anche se dovrà fornire le eventuali componenti richieste per gli incantesimi. Coloro che condividono la sua religione lo manterranno (limitandosi soltanto a lui) offrendogli uno stile di vita modesto.

  Un accolito potrebbe anche avere dei legami con un tempio specifico dedicato alla divinità o al pantheon di sua scelta e beneficiare di una dimora presso quel tempio. Potrebbe trattarsi dello stesso tempio dove aveva prestato servizio in passato, se è rimasto in buoni rapporti con i fedeli del posto, oppure di un tempio dove ha trovato accoglienza recentemente. Finché si trova nei pressi del suo tempio, l'accolito può chiedere aiuto ai sacerdoti, purché quell'aiuto non comporti pericoli ed egli goda di una buona reputazione presso il tempio.
features.0.effects.0.text: Tu e i tuoi compagni potete aspettarvi cure e guarigioni gratuite presso i templi della tua fede.
personality.traits.0: L'accolito venera un particolare eroe della sua fede e si ispira continuamente alle sue gesta e al suo esempio.
personality.traits.1: L'accolito è in grado di trovare punti in comune perfino tra acerrimi nemici, riuscendo a fraternizzare con loro e adoperandosi sempre per una soluzione pacifica.
personality.traits.2: L'accolito vede presagi in ogni evento e gesto. Ritiene che gli dèi cerchino continuamente di parlare ai mortali e che questi ultimi debbano soltanto imparare ad ascoltarli.
personality.traits.3: Nulla riesce a minare l'ottimismo dell'accolito.
personality.traits.4: L'accolito cita (non necessariamente con esattezza) i testi sacri e i proverbi pressoché in ogni situazione.
personality.traits.5: L'accolito è tollerante (o intollerante) nei confronti delle altre fedi e rispetta (o disprezza) il culto degli altri dèi.
personality.traits.6: Frequentando gli alti funzionari del suo tempio, l'accolito ha goduto dei piaceri del buon cibo e del buon vino e si è inserito nell'alta società. La povertà lo mette a disagio.
personality.traits.7: L'accolito ha passato così tanto tempo all'interno del tempio che ha qualche difficoltà pratica a interagire con gli altri esseri umani nel mondo esterno.
personality.ideals.0: Tradizione. Le antiche tradizioni di preghiera e sacrificio devono essere conservate e sostenute.
personality.ideals.1: Carità. L'accolito cerca sempre di aiutare i bisognosi e non esita a sacrificarsi personalmente.
personality.ideals.2: Cambiamento. L'accolito deve contribuire alla diffusione dei mutamenti che gli dèi operano costantemente nel mondo.
personality.ideals.3: Potere. L'accolito spera di riuscire un giorno a raggiungere le posizioni più elevate della gerarchia della sua chiesa.
personality.ideals.4: Fede. L'accolito è profondamente convinto che la sua divinità guidi le sue scelte. Crede quindi che, se si impegnerà a fondo, le cose non potranno che andare bene.
personality.ideals.5: Ambizione. L'accolito cerca di dimostrarsi degno del favore della sua divinità e interviene per correggere le azioni che vanno contro i suoi insegnamenti.
personality.bonds.0: L'accolito morirebbe pur di recuperare un'antica reliquia della sua fede perduta da molto tempo.
personality.bonds.1: L'accolito cerca vendetta contro i corrotti ministri del suo tempio che lo accusarono di eresia.
personality.bonds.2: L'accolito deve la vita al sacerdote che lo fece entrare nel tempio alla morte dei suoi genitori.
personality.bonds.3: Tutto ciò che l'accolito fa, lo fa per la gente comune.
personality.bonds.4: L'accolito farà qualunque cosa pur di proteggere il tempio in cui ha servito.
personality.bonds.5: L'accolito cerca di proteggere un testo sacro che i suoi nemici considerano invece eretico e cercano di distruggere.
personality.flaws.0: L'accolito giudica gli altri con durezza e se stesso ancora più severamente.
personality.flaws.1: L'accolito si affida totalmente e acriticamente a quelli che detengono il potere all'interno del suo tempio.
personality.flaws.2: La religiosità dell'accolito lo induce a volte a credere ciecamente a coloro che professano la sua stessa fede.
personality.flaws.3: L'accolito è inflessibile.
personality.flaws.4: L'accolito non si fida degli sconosciuti e si aspetta sempre il peggio da loro.
personality.flaws.5: Quando l'accolito si prefigge un obiettivo, ne è ossessionato fino a ignorare ogni altro aspetto della sua vita.
personality.suggested: |-
  Gli accoliti sono plasmati dalle loro esperienze nei templi o nelle altre comunità religiose. I loro studi storici e i dettami della loro fede, insieme al rapporto che hanno con templi, santuari o gerarchie, ne influenzano il modo di fare e gli ideali. Come difetti potrebbero nascondere qualche ipocrisia o pensiero eretico, oppure sviluppare un ideale o un legame fino a portarlo all'estremo.

