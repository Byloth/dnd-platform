name: "Divinità celtiche"
text: |-
  | Divinità                                              | Allineamento | Domini suggeriti   | Simbolo                                 |
  |-------------------------------------------------------|--------------|--------------------|-----------------------------------------|
  | Dagda, dio del tempo e dei raccolti                   | CB           | Inganno, Natura    | Calderone ribollente o scudo            |
  | Arawn, dio della vita e della morte                   | NM           | Morte, Vita        | Stella nera su sfondo grigio            |
  | Belenus, dio del sole, della luce e del calore        | NB           | Luce               | Disco solare e monoliti                 |
  | Brigantia, dea dei fiumi e del bestiame               | NB           | Vita               | Ponte                                   |
  | Dian Cécht, dio della medicina e della guarigione     | LB           | Vita               | Rami di quercia e di vischio incrociati |
  | Dunatis, dio delle montagne e dei picchi              | N            | Natura             | Picco di montagna rosso davanti al sole |
  | Goibniu, dio dei fabbri e della guarigione            | NB           | Conoscenza, Vita   | Martello gigante sopra una spada        |
  | Lugh, dio delle arti, dei viaggi e del commercio      | CN           | Conoscenza, Vita   | Due lunghe mani                         |
  | Manannan mac Lir, dio degli oceani e delle creature marine | LN      | Natura, Tempesta   | Onda d'acqua bianca su sfondo verde     |
  | Math Mathonwy, dio della magia                        | NM           | Conoscenza         | Bastone                                 |
  | Morrigan, dea della battaglia                         | CM           | Guerra             | Due lance incrociate                    |
  | Nuada, dio della guerra e dei guerrieri               | N            | Guerra             | Mano argento su sfondo nero             |
  | Oghma, dio della parola e della scrittura             | NB           | Conoscenza         | Pergamena srotolata                     |
  | Silvanus, dio della natura e delle foreste            | N            | Natura             | Albero di quercia                       |
