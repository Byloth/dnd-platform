features.0.effects.0.note: |-
  Anche gli elementali del piano collegato subiscono svantaggio ai tiri per colpire contro di te.
features.1.name: Piano collegato
features.1.text: |-
  Questo anello è collegato a un Piano Elementale scelto dal GM o determinato in maniera casuale. Gli incantesimi lanciati dall'anello hanno una CD del tiro salvezza pari a 17. Ogni piano conferisce proprietà specifiche, e altre ancora quando il personaggio contribuisce a uccidere un elementale di quel piano mentre è in sintonia con l'anello.
