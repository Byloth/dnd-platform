features.1.effects.0.options.0.effects.1.note: Una regola sulla caduta, non una difesa contro un tipo di danno.
features.1.effects.0.options.0.effects.3.note: Solo dopo che hai contribuito a uccidere un elementale dell'aria mentre sei in sintonia con l'anello.
features.1.effects.0.options.0.effects.4.text: |-
