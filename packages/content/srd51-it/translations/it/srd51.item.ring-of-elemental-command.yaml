name: Anello del comando degli elementali
text: |-
  Anello, leggendario (richiede sintonia)

  Questo anello è collegato a un Piano Elementale scelto dal GM o determinato in maniera casuale.

  Finché il personaggio indossa questo anello, dispone di vantaggio ai tiri per colpire contro gli elementali provenienti dal piano a esso collegato; questi ultimi, inoltre, subiscono svantaggio ai tiri per colpire contro di lui. Il personaggio ha anche accesso alle proprietà basate sul piano collegato.

  L'anello possiede 5 cariche e recupera 1d4 + 1 cariche consumate all'alba di ogni giorno. Gli incantesimi lanciati dall'anello hanno una CD del tiro salvezza pari a 17.

  ***Anello del comando degli elementali dell'aria.*** Il personaggio può consumare 2 cariche dell'anello per lanciare *dominare mostri* su un elementale dell'aria. Inoltre, quando il personaggio cade, scende di 18 metri per round senza subire danni dalla caduta. Può anche parlare e capire l'Auran.

  Se il personaggio contribuisce a uccidere un elementale dell'aria mentre è in sintonia con l'anello, ottiene le seguenti proprietà aggiuntive:

  Possiede resistenza ai danni da fulmine.

  Possiede una velocità di volare pari alla sua velocità base e può fluttuare.

  Può lanciare dall'anello gli incantesimi seguenti, consumando il numero necessario di cariche: *catena di fulmini* (3 cariche), *folata di vento* (2 cariche) o *muro di vento* (1 carica).

  ***Anello del comando degli elementali della terra.*** Il personaggio può consumare 2 cariche dell'anello per lanciare *dominare mostri* su un elementale della terra. Inoltre, può muoversi su un terreno difficile formato da macerie, rocce o terriccio come se fosse terreno normale. Può anche parlare e capire il Terran.

  Se il personaggio contribuisce a uccidere un elementale della terra mentre è in sintonia con l'anello, ottiene le seguenti proprietà aggiuntive:

  Possiede resistenza ai danni da acido.

  Può muoversi attraverso la terra solida o la roccia come se fossero aree di terreno difficile. Se termina il suo turno in una di queste aree, viene spostato nell'ultimo spazio libero che ha occupato.

  Può lanciare dall'anello gli incantesimi seguenti, consumando il numero necessario di cariche: *muro di pietra* (3 cariche), *pelle di pietra* (3 cariche) o *scolpire pietra* (2 cariche).

  ***Anello del comando degli elementali del fuoco.*** Il personaggio può consumare 2 cariche dell'anello per lanciare *dominare mostri* su un elementale del fuoco. Inoltre, dispone di resistenza ai danni da fuoco. Può anche parlare e capire l'Ignan.

  Se il personaggio contribuisce a uccidere un elementale del fuoco mentre è in sintonia con l'anello, ottiene le seguenti proprietà aggiuntive:

  Ottiene immunità ai danni da fuoco.

  Può lanciare dall'anello gli incantesimi seguenti, consumando il numero necessario di cariche: *mani brucianti* (1 carica), *muro di fuoco* (3 cariche) o *palla di fuoco* (2 cariche).

  ***Anello del comando degli elementali dell'acqua.*** Il personaggio può consumare 2 cariche dell'anello per lanciare *dominare mostri* su un elementale dell'acqua. Inoltre, può stare in piedi e camminare sulle superfici liquide come se fossero terreno solido. Può anche parlare e capire l'Aquan.

  Se il personaggio contribuisce a uccidere un elementale dell'acqua mentre è in sintonia con l'anello, ottiene le seguenti proprietà aggiuntive:

  Può respirare sott'acqua e ha una velocità di nuotare pari alla sua velocità base sul terreno.

  Può lanciare dall'anello gli incantesimi seguenti, consumando il numero necessario di cariche: *controllare acqua* (3 cariche), *creare o distruggere acqua* (1 carica), *muro di ghiaccio* (3 cariche) o *tempesta di ghiaccio* (2 cariche).
