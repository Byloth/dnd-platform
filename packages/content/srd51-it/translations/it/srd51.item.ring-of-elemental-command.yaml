features.1.effects.0.options.0.text: |-
  Il personaggio può consumare 2 cariche dell'anello per lanciare *dominare mostri* su un elementale dell'aria. Inoltre, quando il personaggio cade, scende di 18 metri per round senza subire danni dalla caduta. Può anche parlare e capire l'Auran. Se il personaggio contribuisce a uccidere un elementale dell'aria mentre è in sintonia con l'anello, ottiene resistenza ai danni da fulmine e una velocità di volare pari alla sua velocità base (e può fluttuare), e può lanciare dall'anello *catena di fulmini* (3 cariche), *folata di vento* (2 cariche) o *muro di vento* (1 carica).
features.1.effects.0.options.0.effects.0.note: Solo su un elementale dell'aria. CD del tiro salvezza 17.
features.1.effects.0.options.0.effects.1.text: |-
