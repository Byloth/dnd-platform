name: Messaggio
components.m: Un piccolo pezzo di filo di rame.
text: L'incantatore punta il dito contro una creatura entro gittata e sussurra un messaggio. Solo il bersaglio sente il messaggio e può sussurrare una risposta che unicamente l'incantatore può sentire. L'incantatore può lanciare questo incantesimo attraverso oggetti solidi se il bersaglio gli è noto e sa che si trova oltre la barriera. Tuttavia, l'incantesimo viene bloccato da silenzio magico, 30 cm di pietra, 2,5 cm di metallo comune, una sottile lamina di piombo o 90 cm di legno. Inoltre, l'incantesimo non deve necessariamente seguire una linea retta e può svilupparsi liberamente oltre gli angoli o attraverso le aperture.
