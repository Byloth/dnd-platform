name: Piede di porco
text: L'utilizzo di un piede di porco conferisce vantaggio alle prove di Forza in cui è possibile usare il piede di porco per fare leva.
features.0.name: Leva
features.0.effects.0.note: Solo mentre usi il piede di porco, alle prove di Forza in cui è possibile usare il piede di porco per fare leva.
