name: "Nano"
text: |-
  Un personaggio nano dispone di varie capacità innate, intrinsecamente correlate alla sua natura nanica.
features.0.name: "Incremento dei punteggi di caratteristica"
features.0.text: |-
  Il punteggio di Costituzione di un nano aumenta di 2.
features.1.name: "Velocità"
features.1.text: |-
  La velocità base sul terreno di un nano è di 7,5 metri. Tale velocità non viene ridotta se il nano indossa un'armatura pesante.
features.1.effects.0.text: |-
  La tua velocità non viene ridotta se indossi un'armatura pesante.
features.1.effects.0.note: |-
  La penalità alla velocità dovuta all'armatura pesante è un promemoria della modalità di gioco; nella v0 nessun valore derivato la rappresenta.
features.2.name: "Scurovisione"
features.2.text: |-
  Un nano è abituato a vivere sottoterra e beneficia di una vista superiore nell'oscurità e nelle condizioni di luce fioca. In condizioni di luce fioca, può vedere fino a una distanza di 18 metri come se si trovasse in condizioni di luce intensa e nell'oscurità come se si trovasse in presenza di luce fioca. Nell'oscurità non è in grado di discernere i colori, ma solo le tonalità di grigio.
features.3.name: "Età"
features.3.text: |-
  I nani maturano allo stesso ritmo degli umani, ma sono considerati giovani fino al raggiungimento dei 50 anni. Vivono in media 350 anni.
features.4.name: "Allineamento"
features.4.text: |-
  La maggior parte dei nani è legale e crede fermamente nei benefici di una società ben ordinata. Molti nani tendono anche al bene, danno grande valore alla correttezza e credono che tutti debbano condividere i benefici concessi da un ordine equo.
features.5.name: "Taglia"
features.5.text: |-
  Un nano è alto da 1,2 a 1,5 metri e pesa circa 75 kg. È di taglia Media.
features.6.name: "Linguaggi"
features.6.text: |-
  Un nano è in grado di parlare, leggere e scrivere in Comune e in Nanico. Il Nanico è una lingua ricca di aspre consonanti e di suoni gutturali, inflessioni che traspaiono anche negli altri linguaggi che il nano potrebbe parlare.
features.7.name: "Resilienza nanica"
features.7.text: |-
  Un nano dispone di vantaggio ai tiri salvezza contro il veleno e di resistenza ai danni da veleno.
features.8.name: "Addestramento da combattimento nanico"
features.8.text: |-
  Un nano ha competenza nelle asce, nelle asce da battaglia, nei martelli da guerra e nei martelli leggeri.
features.9.name: "Competenza negli strumenti"
features.9.text: |-
  Un nano ha competenza in un gruppo di strumenti da artigiano a sua scelta: strumenti da fabbro, scorte da birraio o strumenti da muratore.
features.10.name: "Esperto minatore"
features.10.text: |-
  Ogni volta che un nano effettua una prova di Intelligenza (Storia) relativa all'origine di una struttura in pietra, è considerato avere competenza nell'abilità Storia e aggiunge il doppio del suo bonus di competenza alla prova anziché il suo normale bonus di competenza.
features.10.effects.0.text: |-
  Doppio del bonus di competenza alle prove di Intelligenza (Storia) relative all'origine di una struttura in pietra.
features.10.effects.0.note: |-
  Situazionale: è il giocatore a stabilire che la prova riguarda una struttura in pietra; non è derivato.
subspecies.0.name: "Nano delle colline"
subspecies.0.text: |-
  Un nano delle colline è dotato di sensi acuti, di una profonda intuizione e di una straordinaria resilienza.
subspecies.0.features.0.name: "Incremento dei punteggi di caratteristica"
subspecies.0.features.0.text: |-
  Il punteggio di Saggezza di un nano aumenta di 1.
subspecies.0.features.1.name: "Robustezza nanica"
subspecies.0.features.1.text: |-
  Il massimo dei punti ferita di un nano aumenta di 1 e aumenta di nuovo di 1 ogni volta che acquisisce un livello.
subspecies.0.features.1.effects.0.note: |-
  +1 punto ferita per livello, compreso il primo.
