name: Tunica dell'arcimago
text: |-
  Oggetto meraviglioso, leggendario (richiede sintonia con un mago, uno stregone o un warlock)

  Questa elegante tunica è fatta di un esclusivo tessuto di colore bianco, grigio o nero decorato con rune argentate. Il colore della tunica corrisponde all'allineamento per il quale la tunica è stata creata: bianco per un allineamento buono, grigio per un allineamento neutrale e nero per un allineamento malvagio. Un personaggio può entrare in sintonia solo con una *tunica dell'arcimago* che corrisponde al suo allineamento.

  Finché il personaggio indossa questa tunica ottiene i benefici seguenti:

  Se il personaggio non indossa alcuna armatura, la sua Classe Armatura base è pari a 15 + il suo modificatore di Destrezza.

  Il personaggio dispone di vantaggio ai tiri salvezza contro gli incantesimi e gli altri effetti magici.

  La CD del tiro salvezza sull'incantesimo e il bonus di attacco dell'incantesimo del personaggio aumentano entrambi di 2.
attunement.by: un mago, uno stregone o un warlock
