features.0.effects.0.name: Comandare la sfera
features.0.effects.0.onUse.0.text: |-
  Il personaggio effettua una prova di Carisma con CD 15. In caso di successo controlla la sfera finché rimane in sintonia; in caso di fallimento ne è affascinato finché rimane in sintonia, non può interrompere volontariamente la sintonia e la sfera lancia *suggestione* su di lui a volontà (CD del tiro salvezza 18).
features.0.effects.0.text: |-
  Si scruta nella sfera pronunciandone la parola d'ordine, poi si effettua una prova di Carisma con CD 15 per controllarla.
