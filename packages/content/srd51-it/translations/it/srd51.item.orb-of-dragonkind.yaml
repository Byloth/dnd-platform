features.3.effects.0.name: Richiamare draghi
features.3.effects.0.onUse.0.text: |-
  I draghi malvagi entro 60 km sono obbligati a raggiungere la sfera lungo il percorso più diretto; le divinità dei draghi sono immuni. La proprietà non può essere riutilizzata per 1 ora.
features.3.effects.0.text: |-
  Si invia un richiamo telepatico ai draghi malvagi entro 60 km. Una volta ogni ora, solo mentre il personaggio controlla la sfera.
