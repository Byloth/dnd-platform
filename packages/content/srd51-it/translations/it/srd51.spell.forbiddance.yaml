name: Proibizione
components.m: Uno spruzzo di acqua santa, incenso raro e polvere di rubino del valore di almeno 1.000 mo.
text: |-
  L'incantatore crea una difesa contro i viaggi magici che protegge un'area quadrata di terreno di 60 metri e un'altezza di massimo 9 metri. Per la durata dell'incantesimo, per entrare in tale area le creature non possono utilizzare teletrasporto o portali, come quelli creati dall'incantesimo portale. L'incantesimo protegge l'area contro i viaggi planari, impedendo perciò alle creature di accedervi tramite il Piano Astrale, il Piano Etereo, la Selva Fatata, la Coltre Oscura e l'incantesimo spostamento planare. Inoltre, infligge danni a uno o più tipi di creature indicati dall'incantatore al momento del lancio scelti tra i seguenti: celestiali, elementali, folletti, immondi e non morti. Quando una creatura scelta entra nell'area dell'incantesimo per la prima volta in un turno o inizia il suo turno qui, subisce 5d10 danni necrotici o radiosi (a scelta dell'incantatore al momento del lancio). Quando lancia questo incantesimo, l'incantatore può indicare una parola d'ordine: una creatura che la pronuncia accedendo all'area non subisce danni. L'area di questo incantesimo non può sovrapporsi all'area di un altro incantesimo proibizione. Se l'incantatore lancia proibizione ogni giorno nello stesso luogo per 30 giorni, l'incantesimo permane finché non viene dissolto e i componenti materiali vengono consumati al momento dell'ultimo lancio.
