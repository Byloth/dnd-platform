features.0.effects.0.name: Accendere la candela
features.0.effects.0.text: La candela arde per un totale di 4 ore, dopodiché viene distrutta; puoi spegnerla prima che si esaurisca (il tempo di utilizzo va sottratto in frazioni da 1 minuto). Mentre è accesa, proietta luce fioca entro un raggio di 9 metri.
features.0.effects.0.onUse.0.text: "Tieni il conto del tempo di utilizzo: 4 ore in totale, sottratte in frazioni da 1 minuto."
features.0.effects.1.text: Mentre la candela è accesa, tutte le creature illuminate dalla sua luce e il cui allineamento corrisponde a quello della candela dispongono di vantaggio ai tiri per colpire, ai tiri salvezza e alle prove di caratteristica. Chierici e druidi nell'area illuminata con allineamento corrispondente a quello della candela possono lanciare gli incantesimi preparati di 1° livello senza consumare slot incantesimo, come se fossero lanciati con uno slot di 1° livello.
features.0.effects.1.note: Il vantaggio si applica a ogni creatura illuminata con l'allineamento della candela, non solo a te; il motore non può confrontare gli allineamenti, quindi applicalo a mano finché la candela è accesa.
features.0.effects.2.note: Solo quando accendi la candela per la prima volta; in questo modo la candela viene distrutta.
