name: Teletrasporto
text: |-
  Questo incantesimo teletrasporta immediatamente l'incantatore e un solo oggetto o un massimo di otto creature consenzienti da lui scelte, che si trovano entro gittata e che egli è in grado di vedere, fino a una destinazione a sua scelta. Se il bersaglio è un oggetto, questo deve poter essere contenuto in un cubo di 3 metri e non può essere impugnato o trasportato da una creatura non consenziente. La destinazione scelta deve essere nota all'incantatore e deve trovarsi sul suo stesso piano di esistenza. La sua familiarità con la destinazione determina il successo del teletrasporto. Il GM tira un d100 e consulta la tabella.

  **Familiarità.** "Cerchio permanente" indica un cerchio di teletrasporto permanente di cui l'incantatore conosce la sequenza di sigilli. "Oggetto associato" indica che l'incantatore è in possesso di un oggetto prelevato alla destinazione desiderata da non più di sei mesi, come un libro della biblioteca di un mago, lenzuola di un alloggio reale o un frammento di marmo della tomba segreta di un lich. "Molto familiare" è un luogo che l'incantatore ha visitato molto spesso, un luogo che ha studiato con attenzione o un luogo che è in grado di vedere quando lancia l'incantesimo. "Visto occasionalmente" è un luogo che l'incantatore ha visto più di una volta ma che non gli è troppo familiare. "Visto una volta" è un luogo che ha visto una volta sola, probabilmente usando la magia. "Descrizione" è un luogo la cui ubicazione e apparenza sono noti all'incantatore solo attraverso la descrizione di qualcun altro o grazie a una mappa. "Falsa destinazione" è un luogo inesistente. Forse l'incantatore ha cercato di scrutare il rifugio segreto di un nemico ma ha visto invece un'illusione, oppure tenta di teletrasportarsi in un luogo familiare che non esiste più.

  **Sul bersaglio.** L'incantatore e il suo gruppo (o l'oggetto bersaglio) compaiono dove desidera.

  **Fuori bersaglio.** L'incantatore e il suo gruppo (o l'oggetto bersaglio) compaiono a una distanza casuale dalla destinazione in una direzione casuale. La distanza fuori bersaglio è 1d10 × 1d10 per cento della distanza da percorrere. Per esempio, se l'incantatore prova a viaggiare per 180 km, arriva fuori bersaglio e ottiene un 5 e un 3 sui due dadi, arriva fuori bersaglio del 15%, cioè di 27 km. Il GM determina la direzione fuori bersaglio tirando un d8, dove l'1 corrisponde al nord, il 2 al nord-est, il 3 all'est e così via a indicare tutti i punti cardinali. Se l'incantatore voleva teletrasportarsi in una città costiera e si ritrova invece 27 km al largo della costa, potrebbe essere nei guai.

  **Area simile.** L'incantatore e il suo gruppo (o l'oggetto bersaglio) arrivano in un'area diversa che è visivamente o tematicamente simile all'area bersaglio. Per esempio, se è diretto nel suo laboratorio personale, potrebbe finire nel laboratorio di un altro mago o in un negozio di sostanze alchemiche che contiene molti strumenti e materiali simili a quelli nel suo laboratorio. In genere, l'incantatore appare nel luogo simile più vicino, ma dal momento che l'incantesimo non ha limiti di gittata, potrebbe comparire in un qualsiasi punto del piano.

  **Errore.** La magia imprevedibile dell'incantesimo rende difficile il viaggio. Ogni creatura che si teletrasporta (o l'oggetto bersaglio) subisce 3d10 danni da forza e il GM lancia di nuovo sulla tabella per determinare dove arriverà (potrebbero verificarsi vari errori, nel qual caso i danni verranno inflitti ogni volta).
