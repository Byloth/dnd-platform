name: Acqua santa (ampolla)
text: |-
  Con un'azione, il personaggio può spruzzare il contenuto di quest'ampolla su una creatura situata entro 1,5 metri da lui o lanciarla fino a 6 metri di distanza (l'ampolla si frantumerà all'impatto). In entrambi i casi, il personaggio effettua un attacco a distanza contro la creatura bersaglio, considerando l'acqua santa come un'arma improvvisata. Se il bersaglio è un immondo o un non morto, subisce 2d6 danni radiosi.

  Un chierico o un paladino può creare acqua santa celebrando un rituale speciale. Il rituale richiede 1 ora di tempo e polvere d'argento per un valore di 25 mo; l'incantatore deve inoltre spendere uno slot incantesimo di 1° livello.
