name: Taumaturgia
text: |-
  L'incantatore genera una meraviglia minore, una manifestazione di potere soprannaturale entro gittata. Crei uno degli effetti magici seguenti entro gittata:
  - La tua voce rimbomba con potenza tre volte superiore rispetto al normale per 1 minuto.
  - Fai in modo che una fiamma tremi, si intensifichi, si affievolisca o cambi colore per 1 minuto.
  - Generi un tremito innocuo sul terreno per 1 minuto.
  - Crei un suono improvviso che abbia origine da un punto entro gittata a tua scelta, come un rombo di tuono, il verso di un corvo o un mormorio sinistro.
  - Fai in modo che una porta o una finestra non chiusa a chiave si spalanchi o si chiuda di colpo da sola.
  - Alteri l'aspetto dei tuoi occhi per 1 minuto.
  Se lanci questo incantesimo più volte, puoi mantenere attivi simultaneamente fino a tre dei suoi effetti da 1 minuto e puoi congedare uno di quegli effetti con un'azione.
