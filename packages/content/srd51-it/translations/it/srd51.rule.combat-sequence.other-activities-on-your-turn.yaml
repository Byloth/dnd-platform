name: "Altre attività nel proprio turno"
text: |-
  Il turno di un personaggio può includere numerose attività minori che non richiedono né un'azione né un movimento.

  Nel corso del proprio turno, un personaggio può comunicare in qualsiasi modo gli sia consentito, tramite brevi frasi e gesti.

  Può inoltre interagire con un oggetto o un elemento dell'ambiente gratuitamente, durante il suo movimento o la sua azione. Per esempio, potrebbe aprire una porta durante il suo movimento mentre avanza verso un avversario, oppure potrebbe sfoderare la sua arma come parte della stessa azione che usa per attaccare.

  Se desidera interagire con un secondo oggetto, dovrà usare la sua azione. Alcuni oggetti magici e altri oggetti speciali richiedono sempre un'azione per essere utilizzati, come specificato nella loro descrizione.

  Il GM potrebbe richiedere al personaggio di usare un'azione per ognuna di queste attività quando è necessaria una certa attenzione o quando si presenta un ostacolo inconsueto. Per esempio, sarebbe ragionevole che il GM chiedesse a un personaggio di usare un'azione per aprire una porta incastrata o per girare la manovella che consentirà di abbassare un ponte levatoio.
