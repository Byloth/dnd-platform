name: "Spese dello stile di vita"
text: |-
  Tra un'avventura e l'altra, un personaggio sceglie di condurre uno stile di vita particolare e paga il costo di sostentamento di quel tenore di vita.

  Condurre una certa vita non ha grosse ripercussioni sul personaggio vero e proprio, ma potrebbe influenzare le reazioni di certi gruppi e individui nei suoi confronti. Per esempio, chi conduce uno stile di vita aristocratico potrà influenzare più facilmente i nobili cittadini rispetto a chi vive in povertà.
