name: Tappeto volante
text: |-
  Oggetto meraviglioso, molto raro

  Con un'azione, il personaggio può pronunciare la parola d'ordine del tappeto per fare in modo che fluttui in volo. Il tappeto si muove in base ai comandi verbali impartiti dal personaggio, che deve trovarsi entro 9 metri da esso.

  Esistono tappeti volanti di quattro misure diverse. Il GM può scegliere le dimensioni di un determinato tappeto o determinarle casualmente.

  | d100 | Dimensioni | Capacità di trasporto | Velocità di volare |

  |---|---|---|---|

  | 01–20 | 90 cm × 150 cm | 100 kg | 24 metri |

  | 21–55 | 120 cm × 180 cm | 200 kg | 18 metri |

  | 56–80 | 150 cm × 210 cm | 300 kg | 12 metri |

  | 81–100 | 180 cm × 270 cm | 400 kg | 9 metri |

  Un tappeto può trasportare fino al doppio del peso indicato in tabella, ma se trasporta più di quanto indicato vola a velocità dimezzata.
