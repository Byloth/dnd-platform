name: Produrre fiamma
text: |-
  Nella mano dell'incantatore appare una fiamma tremolante che permane per la durata dell'incantesimo e non infligge danni né all'incantatore né al suo equipaggiamento. La fiamma emana luce intensa in un raggio di 3 metri e luce fioca per ulteriori 3 metri. L'incantesimo termina se l'incantatore lo interrompe con un'azione o se lo lancia di nuovo. L'incantatore può anche attaccare con la fiamma, ponendo tuttavia fine all'incantesimo. Quando lancia questo incantesimo o con un'azione in un turno successivo, l'incantatore può scagliare la fiamma contro una creatura situata entro 9 metri da lui, effettuando un attacco a distanza con incantesimo. Se il colpo va a segno, il bersaglio subisce 1d8 danni da fuoco.
higherLevel: |-
  I danni di questo incantesimo aumentano di 1d8 quando l'incantatore raggiunge il 5° livello (2d8), l'11° livello (3d8) e il 17° livello (4d8).
effects.0.name: Scagliare la fiamma
effects.0.text: |-
  Scagli la fiamma contro una creatura entro 9 metri: attacco a distanza con incantesimo, 1d8 danni da fuoco se il colpo va a segno (2d8 al 5° livello, 3d8 all'11°, 4d8 al 17°). Attaccare con la fiamma pone fine all'incantesimo.
effects.1.text: |-
  La fiamma emana luce intensa in un raggio di 3 metri e luce fioca per ulteriori 3 metri; l'incantesimo termina se lo interrompi con un'azione o se lo lanci di nuovo.
