name: Viaggi planari
text: |-
  Quando gli avventurieri si recano su altri piani di esistenza, intraprendono un viaggio straordinario al di là delle soglie dell'esistenza verso una destinazione mitica dove tentano di portare a termine la loro missione. Un viaggio simile è un'impresa leggendaria. Affrontare i reami dei morti, mettersi alla ricerca dei servitori celestiali di una divinità o contrattare con un efreeti nella sua città di origine sono gesta che saranno narrate e cantate negli anni a venire.

  È possibile viaggiare fino ai piani oltre il Piano Materiale in due modi: lanciando un incantesimo o usando un portale planare.

  **_Incantesimi._** Esistono vari incantesimi che consentono di accedere in modo diretto o indiretto ad altri piani di esistenza. _Spostamento planare_ e _portale_ possono teletrasportare gli avventurieri direttamente su un altro piano di esistenza, con vari gradi di precisione. _Forma eterea_ permette agli avventurieri di accedere al Piano Etereo e da lì raggiungere qualsiasi piano da esso toccato, come per esempio i Piani Elementali. L'incantesimo _proiezione astrale_, invece, consente agli avventurieri di proiettarsi sul Piano Astrale e viaggiare fino ai Piani Esterni.

  **_Portali._** Portale è un termine generico che si riferisce a un collegamento interplanare fisso tra due luoghi specifici situati su due piani differenti. Alcuni portali hanno l'aspetto di una soglia, di una finestra trasparente o di un passaggio pieno di nebbia, ed è sufficiente varcarli per compiere un viaggio interplanare. Altri sono dei luoghi: cerchi di monoliti, torri svettanti, velieri o addirittura intere cittadine, che esistono su più piani simultaneamente o si spostano da un piano all'altro in successione. Altri ancora sono vortici che generalmente collegano un Piano Elementale con un luogo simile sul Piano Materiale, come la caldera di un vulcano (che conduce al Piano del Fuoco) o le profondità dell'oceano (collegate al Piano dell'Acqua).
