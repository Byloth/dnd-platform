name: "Indossare e impugnare gli oggetti"
text: |-
  Per usare le proprietà di un oggetto magico potrebbe essere necessario impugnarlo o indossarlo. Un oggetto magico deve essere indossato nel modo appropriato: gli stivali vanno ai piedi, i guanti alle mani, i cappelli e gli elmi sulla testa, e gli anelli alle dita. Le armature magiche devono essere indossate, uno scudo dev'essere legato al braccio, un mantello deve venire agganciato alle spalle. Un'arma dev'essere impugnata.

  Nella maggior parte dei casi, un oggetto magico concepito per essere indossato può "calzare" una creatura a prescindere dalla taglia o dalla corporatura di quest'ultima. Molti abiti magici vengono creati per essere facilmente modificabili o si adattano magicamente alla taglia del portatore, ma esistono alcune rare eccezioni. Se a livello narrativo c'è un buon motivo per cui un oggetto possa essere indossato soltanto da creature di una certa taglia o forma, il GM può decidere che tale oggetto non si adatti ad altri portatori. Per esempio, un'armatura di fattura drow potrebbe essere indossata soltanto dagli elfi. I nani potrebbero fabbricare oggetti utilizzabili soltanto da creature di taglia e corporatura simile alla loro.

  Quando un non umanoide cerca di indossare un oggetto, il GM può decidere a sua discrezione se quell'oggetto funziona nel modo inteso. Un anello infilato su un tentacolo potrebbe funzionare, ma uno yuan-ti con una coda da serpente al posto delle gambe non può indossare un paio di stivali.
