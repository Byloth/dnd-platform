name: Evocazioni istantanee
components.m: Uno zaffiro del valore di 1.000 mo.
text: |-
  L'incantatore tocca un oggetto del peso pari o inferiore a 5 kg e la cui dimensione più lunga sia pari o inferiore a 1,8 metri. L'incantesimo imprime un marchio invisibile sulla sua superficie e traccia in modo invisibile il nome dell'oggetto sullo zaffiro usato come componente materiale. Ogni volta che l'incantatore lancia questo incantesimo, deve utilizzare uno zaffiro diverso. Da quel momento in poi, l'incantatore può usare la sua azione per pronunciare il nome dell'oggetto e distruggere lo zaffiro. L'oggetto appare immediatamente nella mano dell'incantatore, a prescindere dalle distanze fisiche o planari e l'incantesimo termina. Se un'altra creatura impugna o trasporta l'oggetto, la distruzione dello zaffiro non comporta l'apparizione dell'oggetto, ma l'incantatore apprende invece chi è la creatura in suo possesso e l'ubicazione approssimativa. Dissolvi magie o un effetto analogo applicato con successo sullo zaffiro termina l'effetto di questo incantesimo.
