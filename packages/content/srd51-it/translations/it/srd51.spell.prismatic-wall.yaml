name: Muro prismatico
text: |-
  Un piano scintillante di luce multicolore forma un muro opaco verticale (che può misurare fino a 27 metri di lunghezza, 9 metri di altezza e 2,5 cm di spessore), centrato su un punto entro gittata che l'incantatore è in grado di vedere. In alternativa, l'incantatore può modellare il muro in una sfera del diametro massimo di 9 metri centrata su un punto a sua scelta entro gittata. Il muro rimane in quella posizione per la durata dell'incantesimo. Se l'incantatore posiziona il muro in modo che passi attraverso uno spazio occupato da una creatura, l'incantesimo fallisce e sia l'azione dell'incantatore che lo slot incantesimo vengono sprecati. Il muro emana luce intensa in un raggio di 30 metri e luce fioca per ulteriori 30 metri. L'incantatore e le creature da lui scelte al momento del lancio dell'incantesimo possono passare attraverso il muro o rimanervi accanto senza subire danni. Se un'altra creatura in grado di vedere il muro giunge entro 6 metri da esso o comincia lì il proprio turno, deve superare un tiro salvezza su Costituzione, altrimenti è accecata per 1 minuto. Il muro è composto da sette strati, ognuno di un colore diverso. Quando una creatura cerca di protendersi oltre il muro o passarvi attraverso, lo fa attraversando uno strato alla volta. Quando questo accade, deve superare un tiro salvezza su Destrezza, altrimenti sarà influenzata dalle proprietà di quello strato, come descritto in seguito. Il muro può essere distrutto, anche in questo caso uno strato alla volta e in ordine dal rosso al viola, in un modo specifico per ogni strato. Quando uno strato viene distrutto, rimane in questo stato per la durata dell'incantesimo. Una verga della cancellazione distrugge un muro prismatico, ma un campo anti-magia non ha alcun effetto su di esso.

  **1. Rosso.** La creatura subisce 10d6 danni da fuoco se fallisce il tiro salvezza, o la metà dei danni in caso di successo. Finché questo strato rimane al suo posto, gli attacchi non magici a distanza non possono attraversare il muro. Questo strato può essere distrutto se subisce almeno 25 danni da freddo.

  **2. Arancione.** La creatura subisce 10d6 danni da acido se fallisce il tiro salvezza, o la metà dei danni in caso di successo. Finché questo strato rimane al suo posto, gli attacchi magici a distanza non possono attraversare il muro. Questo strato può essere distrutto da un vento forte.

  **3. Giallo.** La creatura subisce 10d6 danni da fulmine se fallisce il tiro salvezza, o la metà dei danni in caso di successo. Questo strato può essere distrutto se subisce almeno 60 danni da forza.

  **4. Verde.** La creatura subisce 10d6 danni da veleno se fallisce il tiro salvezza, o la metà dei danni in caso di successo. Un incantesimo passapareti o un altro incantesimo di livello pari o superiore è in grado di aprire un portale su una superficie solida, distruggendo questo strato.

  **5. Blu.** La creatura subisce 10d6 danni da freddo se fallisce il tiro salvezza, o la metà dei danni in caso di successo. Questo strato può essere distrutto se subisce almeno 25 danni da fuoco.

  **6. Indaco.** Se fallisce il tiro salvezza, la creatura è trattenuta e deve effettuare un tiro salvezza su Costituzione alla fine di ogni suo turno. Se lo supera per tre volte, l'incantesimo termina, mentre se lo fallisce per tre volte, viene tramutata in pietra permanentemente ed è soggetta alla condizione pietrificato. Non è necessario che i tiri superati o falliti siano consecutivi: si tiene semplicemente il conto di entrambi finché la creatura non ne accumula tre di un certo tipo. Finché questo strato rimane al suo posto, non è possibile lanciare incantesimi attraverso il muro. Questo strato può essere distrutto da una luce intensa emanata da un incantesimo luce diurna o da un incantesimo analogo di livello pari o superiore.

  **7. Viola.** Se fallisce il tiro salvezza, la creatura è accecata e deve effettuare un tiro salvezza su Saggezza all'inizio del turno successivo dell'incantatore. Se lo supera, non è più accecata, mentre se lo fallisce, viene trasportata su un altro piano a scelta del GM e non è più accecata. (Solitamente, una creatura che si trova su un piano diverso da quello di origine viene esiliata sul suo piano di origine, mentre le altre creature vengono inviate sul Piano Astrale o sul Piano Etereo.) Questo strato viene distrutto da un incantesimo dissolvi magie o da un incantesimo analogo di livello pari o superiore che sia in grado di porre termine agli incantesimi e agli effetti magici.
onCast.0.note: |-
  Una creatura in grado di vedere il muro che giunge entro 6 metri da esso o comincia lì il proprio turno deve superare un tiro salvezza su Costituzione, altrimenti è accecata per 1 minuto (non tu né le creature da te scelte al momento del lancio).
onCast.1.text: |-
  Passare attraverso il muro o protendersi oltre di esso significa attraversare i suoi sette strati uno alla volta, ognuno dei quali richiede un tiro salvezza su Destrezza: rosso 10d6 danni da fuoco, arancione 10d6 danni da acido, giallo 10d6 danni da fulmine, verde 10d6 danni da veleno, blu 10d6 danni da freddo (la metà in caso di successo); indaco trattiene (poi un tiro salvezza su Costituzione a ogni turno: tre fallimenti pietrificano permanentemente, tre successi pongono fine all'incantesimo); viola acceca (tiro salvezza su Saggezza all'inizio del tuo turno successivo, altrimenti la creatura viene trasportata su un altro piano). Gli strati bloccano gli attacchi a distanza e gli incantesimi e vengono distrutti in modi specifici, in ordine dal rosso al viola.
