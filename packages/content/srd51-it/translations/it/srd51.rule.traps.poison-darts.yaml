name: Dardi avvelenati
text: |-
  _Trappola meccanica_

  Quando una creatura calpesta una piastra a pressione nascosta, dei dardi dalla punta avvelenata vengono scagliati da una serie di tubi caricati a molla o pressurizzati e ingegnosamente nascosti nelle pareti circostanti. Un'area potrebbe includere varie piastre a pressione, ognuna collegata a una serie diversa di dardi.

  I minuscoli fori nelle pareti sono coperti da polvere e ragnatele, oppure astutamente nascosti tra i bassorilievi, i dipinti murali o gli affreschi che le decorano e la CD per individuarli è pari a 15. Un personaggio può notare la presenza di una piastra a pressione dalle variazioni nella malta e nella pietra usate per crearla rispetto al pavimento circostante superando una prova di Intelligenza (Indagare) con CD 15. Inserire uno spuntone di ferro o un oggetto analogo sotto la piastra a pressione impedisce alla trappola di attivarsi, mentre riempire i fori con pezzi di stoffa o cera impedisce ai dardi all'interno di essere lanciati.

  Quando più di 10 kg di peso si trovano sulla piastra a pressione, la trappola si attiva rilasciando quattro dardi. Ogni dardo effettua un attacco a distanza con un bonus di +8 contro un bersaglio casuale situato entro 3 metri dalla piastra a pressione (la visione è irrilevante per questo tiro per colpire; se non ci sono bersagli nell'area, i dardi non colpiscono nulla). Un bersaglio colpito subisce 2 (1d4) danni perforanti e deve effettuare un tiro salvezza su Costituzione con CD 15, subendo 11 (2d10) danni da veleno in caso di fallimento, o la metà dei danni in caso di successo.
