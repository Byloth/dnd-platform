name: "Riposo breve"
text: |-
  Un riposo breve è un periodo di inattività di almeno 1 ora in cui un personaggio non fa nulla di più impegnativo di mangiare, bere, leggere e medicare le ferite.

  Un personaggio può spendere uno o più Dadi Vita alla fine di un riposo breve, fino al massimo dei suoi Dadi Vita, che è equivalente al livello del personaggio. Per ogni Dado Vita speso in questo modo, il giocatore tira il dado e aggiunge al risultato il modificatore di Costituzione del personaggio. Il personaggio recupera un numero di punti ferita pari al totale. Il giocatore può decidere di spendere un Dado Vita aggiuntivo dopo ogni tiro. Un personaggio recupera alcuni dei Dadi Vita che ha speso una volta completato un riposo lungo, come spiegato di seguito.
