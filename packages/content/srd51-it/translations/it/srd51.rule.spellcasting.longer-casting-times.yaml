name: Tempi di lancio superiori
text: |-
  Per lanciare certi incantesimi (inclusi gli incantesimi lanciati come rituali) è necessario più tempo: minuti o addirittura ore. Quando un personaggio lancia un incantesimo con un tempo di lancio superiore a una singola azione o reazione, deve spendere la sua azione di ogni turno per lanciare l'incantesimo e deve mantenere la concentrazione mentre lo fa (vedi "Concentrazione", sotto). Se la sua concentrazione viene interrotta, l'incantesimo fallisce, ma il personaggio non spende uno slot incantesimo. Se vuoi tentare di lanciare di nuovo l'incantesimo, devi ricominciare da capo.
