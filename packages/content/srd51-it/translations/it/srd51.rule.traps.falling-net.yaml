name: Rete in caduta
text: |-
  _Trappola meccanica_

  Questa trappola utilizza un cavo teso per liberare una rete fissata al soffitto.

  Il cavo è teso a 8 cm dal terreno tra due colonne o alberi e la rete è nascosta da ragnatele o dal fogliame. La CD per individuare il cavo teso e la rete è pari a 10. Il cavo teso può essere spezzato senza subire danni superando una prova di Destrezza con CD 15 usando degli arnesi da scasso. Un personaggio senza gli arnesi da scasso può tentare di effettuare questa prova con svantaggio, usando una qualsiasi arma affilata o strumento appuntito. In caso di fallimento, la trappola si innesca.

  Innescando la trappola, la rete viene sganciata e copre un'area quadrata con lato di 3 metri. Le creature in quell'area vengono intrappolate sotto la rete e trattenute, quelle che falliscono un tiro salvezza su Forza con CD 10 inoltre vengono buttate a terra prone. Una creatura può usare la sua azione per effettuare una prova di Forza con CD 10 e liberare se stessa o qualcun altro alla sua portata in caso di successo. La rete ha CA 10 e 20 punti ferita. Infliggendo 5 danni taglienti alla rete (CA 10) si distrugge una sua sezione quadrata di 1,5 metri per lato, liberando le eventuali creature che vi sono intrappolate sotto.
