name: Frantumare
components.m: Un frammento di mica.
text: |-
  Un rumore improvviso e assordante, dolorosamente intenso, si diffonde da un punto a scelta dell'incantatore situato entro gittata. Ogni creatura entro una sfera del raggio di 3 metri centrata su quel punto deve effettuare un tiro salvezza su Costituzione. In caso di fallimento, la creatura subisce 3d8 danni da tuono, mentre se lo supera subisce soltanto la metà di quei danni. Una creatura fatta di materiale inorganico come pietra, cristallo o metallo subisce svantaggio a questo tiro salvezza. Anche un oggetto non magico che non sia indossato o trasportato subisce i danni se si trova entro l'area dell'incantesimo.
higherLevel: |-
  Quando l'incantatore lancia questo incantesimo usando uno slot incantesimo di 3° livello o superiore, i danni aumentano di 1d8 per ogni slot di livello superiore al 2°.
