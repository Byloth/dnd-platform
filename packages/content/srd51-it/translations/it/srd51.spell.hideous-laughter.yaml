name: Risata incontenibile
components.m: Una manciata di briciole e una piuma da agitare in aria.
text: |-
  Sotto l'influenza di questo incantesimo, una creatura scelta dall'incantatore, situata entro gittata e che è in grado di vedere, percepisce ogni cosa come esilarante ed è scossa da risate incontrollabili. Il bersaglio deve superare un tiro salvezza su Saggezza, altrimenti cade prono, rimanendo incapacitato e immobilizzato per la durata dell'incantesimo. Una creatura con un punteggio di Intelligenza pari o inferiore a 4 non è influenzata dall'incantesimo. Il bersaglio può effettuare un altro tiro salvezza su Saggezza alla fine di ogni suo turno e ogni volta che subisce danni; in quest'ultimo caso dispone di vantaggio al tiro salvezza. In caso di successo, l'incantesimo termina.
onCast.2.text: |-
  Con un tiro salvezza su Saggezza fallito; il bersaglio non è in grado di rialzarsi per la durata dell'incantesimo. Una creatura con un punteggio di Intelligenza pari o inferiore a 4 non è influenzata. Alla fine di ogni suo turno e ogni volta che subisce danni (con vantaggio), il bersaglio ripete il tiro salvezza; in caso di successo l'incantesimo termina.
