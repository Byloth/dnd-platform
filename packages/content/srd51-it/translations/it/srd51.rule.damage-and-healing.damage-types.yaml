name: "Tipi di danno"
text: |-
  Gli attacchi, gli incantesimi e gli altri effetti dannosi infliggono vari tipi di danno. I tipi di danno non seguono regole particolari ma altre regole, come per esempio la resistenza ai danni, possono farvi riferimento.

  Di seguito sono elencati i vari tipi di danno, oltre ad alcuni esempi che possono aiutare il GM ad assegnare un tipo di danno a un nuovo effetto.

  **Acido.** Lo spruzzo corrosivo del soffio di un drago nero e gli enzimi corrosivi secreti da un protoplasma nero infliggono danni da acido.

  **Contundente.** Gli attacchi basati su un violento impatto (martelli, cadute, stritolamenti e così via) infliggono danni contundenti.

  **Freddo.** Il gelo infernale emanato dalla lancia di un diavolo del ghiaccio e il gelido soffio di un drago bianco infliggono danni da freddo.

  **Fuoco.** I draghi rossi sputano fuoco e molti incantesimi evocano fiamme che infliggono danni da fuoco.

  **Forza.** La forza è energia magica allo stato puro, concentrata in una forma al fine di infliggere danni. Molti effetti che infliggono danni da forza sono incantesimi, tra cui _arma spirituale_ e _dardo incantato_.

  **Fulmine.** Un incantesimo _fulmine_ e il soffio di un drago blu infliggono danni da fulmine.

  **Necrotico.** I danni necrotici, inflitti da certi non morti e da incantesimi come _tocco gelido_, fanno avvizzire la materia e a volte anche l'anima.

  **Perforante.** Gli attacchi acuminati o impalanti, come quelli di una lancia o delle zanne di un mostro, infliggono danni perforanti.

  **Veleno.** I pungiglioni velenosi e il soffio gassoso tossico esalato da un drago verde infliggono danni da veleno.

  **Psichico.** Le capacità mentali, come la deflagrazione psionica di un mind flayer, infliggono danni psichici.

  **Radioso.** I danni radiosi inferti dall'incantesimo _colpo infuocato_ di un chierico o dall'arma punitiva di un angelo bruciano la carne come se fossero incandescenti e sovraccaricano lo spirito di energia.

  **Tagliente.** Le spade, le asce e gli artigli dei mostri infliggono danni taglienti.

  **Tuono.** Un'esplosione sonora concussiva, come l'effetto dell'incantesimo srd:thunderwave, infligge danni da tuono.
