name: Colla meravigliosa
text: |-
  Oggetto meraviglioso, leggendario

  Questa sostanza viscosa e lattiginosa può creare un legame adesivo permanente tra due oggetti qualsiasi. Deve essere custodita in un barattolo o in un'ampolla al cui interno sia stato spalmato dell'*olio della scivolosità*. Quando viene trovato, il contenitore contiene (1d6 + 1) × 30 grammi.

  Una quantità di colla pari a 30 grammi può coprire una superficie quadrata con lato di 30 cm. La colla impiega 1 minuto a fare effetto. Il legame così creatosi può essere spezzato solamente con un'applicazione di *solvente universale* o di *olio della forma eterea*, o tramite un incantesimo *desiderio*.
