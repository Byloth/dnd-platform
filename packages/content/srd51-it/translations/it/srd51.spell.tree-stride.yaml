name: Traslazione arborea
text: |-
  L'incantatore ottiene la capacità di entrare in un albero e muoversi al suo interno fino ad arrivare a un altro albero dello stesso tipo posto entro 150 metri. Entrambi gli alberi devono essere vivi e di taglia pari o superiore a quella dell'incantatore, che deve usare 1,5 metri di movimento per entrare in uno di essi. L'incantatore apprende immediatamente l'ubicazione di tutti gli altri alberi dello stesso tipo entro 150 metri e, come parte del movimento usato per entrare nell'albero, può scegliere se passare in uno di quegli alberi o riemergere da quello in cui si trova. L'incantatore ricompare in un punto a sua scelta entro 1,5 metri dall'albero di destinazione, usando ulteriori 1,5 metri di movimento. Se non gli rimane più alcun movimento, ricompare entro 1,5 metri dall'albero in cui è entrato. Per la durata dell'incantesimo, l'incantatore può usare questa abilità di trasporto una volta per round e deve concludere ogni suo turno fuori dall'albero.
