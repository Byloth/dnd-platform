levels.1.features.1.effects.3.text: |-
  Quando effettui una prova di Intelligenza o di Saggezza relativa al tuo terreno prescelto, raddoppi il tuo bonus di competenza se usi un'abilità in cui possiedi competenza.
levels.1.features.1.effects.3.note: |-
  Situazionale: è il giocatore a stabilire che la prova è relativa al terreno prescelto; non è una Maestria registrata sulla scheda.
levels.1.features.1.effects.4.text: |-
  Quando viaggi per un'ora o più nel tuo terreno prescelto: il terreno difficile non rallenta il viaggio del tuo gruppo; il tuo gruppo non può smarrirsi, se non per cause magiche; anche se sei impegnato in un'altra attività mentre viaggi (per esempio foraggiare, orientarti o seguire tracce), rimani all'erta nei confronti dei potenziali pericoli; se viaggi da solo, puoi muoverti furtivamente a passo normale; quando foraggi, trovi il doppio del cibo che troveresti normalmente; quando segui le tracce di altre creature, apprendi anche il loro numero esatto, le loro taglie e da quanto tempo sono passate nell'area.
levels.1.features.1.effects.4.note: |-
  I benefici di viaggio sono narrativi; nessun tipo di effetto nel catalogo.
levels.2.features.0.name: |-
  Stile di Combattimento
levels.2.features.0.text: |-
  Al 2° livello, un ranger adotta uno stile di combattimento in cui specializzarsi scegliendo una tra le opzioni seguenti. Non è consentito scegliere uno stile di combattimento più di una volta, anche se in seguito il ranger ha diritto a scegliere di nuovo.

  ### Tiro

  Il ranger ottiene un bonus di +2 ai tiri per colpire che effettua con le armi a distanza.

  ### Difesa

  Finché indossa un'armatura, il ranger ottiene un bonus di +1 alla CA.

  ### Duellare

  Quando il ranger impugna un'arma da mischia in una mano e non impugna altre armi, ottiene un bonus di +2 ai tiri per i danni di quell'arma.

  ### Combattere con Due Armi

  Quando il ranger combatte con due armi, può aggiungere il suo modificatore di caratteristica ai danni del secondo attacco.
levels.2.features.0.effects.0.note: |-
  Non è consentito scegliere uno stile di combattimento più di una volta, anche se in seguito il ranger ha diritto a scegliere di nuovo.
