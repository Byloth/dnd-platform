levels.1.features.1.name: |-
  Esploratore Nato
levels.1.features.1.text: |-
  Il ranger conosce molto bene un tipo di ambiente naturale ed è particolarmente abile nel viaggiare e sopravvivere in quelle regioni. Il giocatore sceglie un tipo di terreno prescelto: artico, costa, deserto, foresta, montagna, palude o prateria. Quando il ranger effettua una prova di Intelligenza o di Saggezza relativa al suo terreno prescelto, raddoppia il suo bonus di competenza se usa un'abilità in cui possiede competenza.

  Quando viaggia per un'ora o più in una regione del suo terreno prescelto, il ranger ottiene i benefici seguenti:

  * Il terreno difficile non rallenta il viaggio del suo gruppo.
  * Il suo gruppo non può smarrirsi, se non per cause magiche.
  * Anche se il ranger è impegnato in un'altra attività mentre viaggia (per esempio foraggiare, orientarsi o seguire tracce), rimane all'erta nei confronti dei potenziali pericoli.
  * Se il ranger viaggia da solo, può muoversi furtivamente a passo normale.
  * Quando foraggia, il ranger trova il doppio del cibo che troverebbe normalmente.
  * Quando segue le tracce di altre creature, apprende anche il loro numero esatto, le loro taglie e da quanto tempo sono passate nell'area.

  Il ranger sceglie altri tipi di terreno prescelto al 6° e al 10° livello.
