name: "Azioni bonus"
text: |-
  Vari privilegi di classe, incantesimi e altre capacità ti consentono di effettuare un'azione aggiuntiva nel tuo turno, chiamata azione bonus. Il privilegio Azione Scaltra, per esempio, consente a un ladro di effettuare un'azione bonus. Un personaggio può effettuare un'azione bonus soltanto quando una capacità speciale, un incantesimo o un altro privilegio del gioco gli permette di fare qualcosa come azione bonus. In caso contrario, un personaggio non dispone di alcuna azione bonus da effettuare.

  > **Sage Advice**

  > Le azioni e le azioni bonus non sono intercambiabili. Se un personaggio possiede due capacità che richiedono un'azione bonus per essere attivate, può usarne soltanto una, anche se non effettua nessun'altra azione.

  > Fonte: [Sage Advice > Compendium](http://media.wizards.com/2015/downloads/dnd/SA_Compendium_1.01.pdf)

  Un personaggio può effettuare soltanto un'azione bonus nel proprio turno, quindi dovrà scegliere quale azione bonus usare qualora ne avesse più di una a disposizione.

  Un personaggio può scegliere quando effettuare un'azione bonus durante il proprio turno, a meno che la tempistica dell'azione bonus non sia specificata. Inoltre, tutto ciò che priva un personaggio della sua possibilità di effettuare azioni lo priva anche della possibilità di effettuare un'azione bonus.
