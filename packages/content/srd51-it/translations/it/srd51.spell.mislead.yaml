name: Fuorviare
text: L'incantatore diventa invisibile nello stesso momento in cui un suo sosia illusorio appare nel punto in cui si trova. Il suo sosia permane per la durata dell'incantesimo, ma l'invisibilità termina quando l'incantatore attacca o lancia un incantesimo. L'incantatore può usare la sua azione per muovere il sosia illusorio fino al doppio della sua velocità e farlo gesticolare, parlare e comportare nel modo che ritiene più opportuno. Inoltre, può vedere e sentire attraverso il sosia, come se si trovasse nello stesso punto. In ognuno dei suoi turni come azione bonus, l'incantatore può passare dall'uso dei propri sensi a quelli del sosia e viceversa. Mentre utilizza i sensi del sosia, non può vedere né sentire nulla di ciò che circonda il suo vero corpo.
onCast.0.note: L'invisibilità termina se l'incantatore attacca o lancia un incantesimo.
onCast.1.text: "Un sosia illusorio appare nel punto in cui si trova l'incantatore per la durata: con un'azione l'incantatore può muoverlo fino al doppio della sua velocità e farlo gesticolare, parlare e comportare come desidera; può vedere e sentire attraverso di esso, passando da un senso all'altro come azione bonus (mentre usa i sensi del sosia è accecato e assordato per ciò che lo circonda)."
