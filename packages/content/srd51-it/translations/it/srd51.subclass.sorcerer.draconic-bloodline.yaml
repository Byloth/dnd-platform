levels.6.features.0.name: "Affinità elementale"
levels.6.features.0.text: "A partire dal 6° livello, quando lo stregone lancia un incantesimo che infligge danni del tipo associato al suo antenato draconico, può aggiungere il suo modificatore di Carisma a un tiro per i danni di quell'incantesimo. Allo stesso tempo, lo stregone può spendere 1 punto stregoneria per ottenere resistenza a quel tipo di danno per 1 ora."
levels.6.features.0.effects.0.text: "Quando lanci un incantesimo che infligge danni del tipo associato al tuo antenato draconico, puoi aggiungere il tuo modificatore di Carisma a un tiro per i danni di quell'incantesimo."
levels.6.features.0.effects.0.note: "Un bonus ai danni limitato agli incantesimi di un solo tipo di danno non ha un bersaglio di modifica; aggiungi a mano il tuo modificatore di Carisma a un tiro per i danni."
levels.6.features.0.effects.1.name: "Affinità elementale (resistenza)"
levels.6.features.0.effects.1.text: "Quando lanci un incantesimo che infligge danni del tipo associato al tuo antenato draconico, puoi spendere 1 punto stregoneria per ottenere resistenza a quel tipo di danno per 1 ora."
levels.14.features.0.name: "Ali di drago"
levels.14.features.0.text: |-
  Al 14° livello, lo stregone sviluppa la capacità di generare un paio di ali di drago sulla sua schiena, ottenendo una velocità di volare pari alla sua velocità attuale. Lo stregone può generare queste ali come azione bonus nel suo turno. Le ali durano finché lo stregone non le congeda con un'azione bonus durante il proprio turno.

  Lo stregone non può manifestare le sue ali mentre indossa un'armatura, a meno che l'armatura non sia concepita per accoglierle; i vestiti che non sono stati concepiti per tale scopo potrebbero venire distrutti quando lo stregone le manifesta.
levels.14.features.0.effects.0.name: "Ali di drago"
levels.14.features.0.effects.0.text: "Come azione bonus nel tuo turno generi un paio di ali di drago sulla tua schiena, ottenendo una velocità di volare pari alla tua velocità attuale. Le ali durano finché non le congedi con un'azione bonus durante il tuo turno. Non puoi manifestare le tue ali mentre indossi un'armatura, a meno che l'armatura non sia concepita per accoglierle; i vestiti che non sono stati concepiti per tale scopo potrebbero venire distrutti quando le manifesti."
levels.14.features.0.effects.1.text: "Finché le tue ali di drago sono manifestate, hai una velocità di volare pari alla tua attuale velocità base sul terreno."
levels.14.features.0.effects.1.note: "Una velocità di volare pari all'attuale velocità base sul terreno non ha una formula (le velocità non sono utilizzabili nelle formule); leggila dalla tua velocità base sul terreno finché le ali sono manifestate."
levels.18.features.0.name: "Presenza draconica"
levels.18.features.0.text: "A partire dal 18° livello, lo stregone può incanalare la presenza terrificante del suo antenato draconico, rendendo le creature intorno a lui affascinate o spaventate. Con un'azione, lo stregone può spendere 5 punti stregoneria per attingere a questo potere ed emanare un'aura di soggezione o di paura (a sua scelta) entro una distanza di 18 metri. Per 1 minuto o finché non perde la sua concentrazione (come se stesse lanciando un incantesimo che richiede concentrazione), ogni creatura ostile che inizia il suo turno entro questa aura deve superare un tiro salvezza su Saggezza o sarà affascinata (se lo stregone ha scelto soggezione) o spaventata (se ha scelto paura) finché l'aura non termina. Una creatura che supera questo tiro salvezza è immune all'aura dello stregone per 24 ore."
levels.18.features.0.effects.0.name: "Presenza draconica"
levels.18.features.0.effects.0.text: "Con un'azione, puoi spendere 5 punti stregoneria per emanare un'aura di soggezione o di paura (a tua scelta) entro una distanza di 18 metri. Per 1 minuto o finché non perdi la tua concentrazione (come se stessi lanciando un incantesimo che richiede concentrazione), ogni creatura ostile che inizia il suo turno entro questa aura deve superare un tiro salvezza su Saggezza o sarà affascinata (se hai scelto soggezione) o spaventata (se hai scelto paura) finché l'aura non termina. Una creatura che supera questo tiro salvezza è immune alla tua aura per 24 ore."
levels.18.features.0.effects.0.onUse.0.text: "Scegli soggezione (affascinato) o paura (spaventato). Ogni creatura ostile che inizia il suo turno entro 18 metri effettua un tiro salvezza su Saggezza; se lo fallisce è affascinata o spaventata finché l'aura non termina, se lo supera è immune alla tua aura per 24 ore."
levels.18.features.0.effects.0.note: "Il testo non indica la CD del tiro salvezza, quindi non ne è dichiarata alcuna; la condizione è imposta ad altre creature all'inizio dei loro turni, cosa che il motore di gioco non traccia."
