name: Amicizia con gli animali
components.m: Un boccone di cibo.
text: |-
  Tramite questo incantesimo l'incantatore convince una bestia di essere innocuo. L'incantatore sceglie una bestia entro gittata che è in grado di vedere. La creatura deve essere in grado di vederlo e sentirlo. Tuttavia, se la sua Intelligenza è pari o superiore a 4, l'incantesimo fallisce. In caso contrario, la bestia deve superare un tiro salvezza su Saggezza, altrimenti rimarrà affascinata per la durata dell'incantesimo. Se l'incantatore o uno dei suoi compagni infligge danni al bersaglio, l'incantesimo termina.
higherLevel: |-
  Quando l'incantatore lancia questo incantesimo usando uno slot incantesimo di 2° livello o superiore, può influenzare una bestia aggiuntiva per ogni slot di livello superiore al 1°.
onCast.0.note: Se fallisce il tiro salvezza su Saggezza (come da testo); una bestia con Intelligenza pari o superiore a 4 non è influenzata. Termina se l'incantatore o uno dei suoi compagni infligge danni al bersaglio. Una bestia aggiuntiva per ogni slot di livello superiore al 1°.
