name: Bastone dei magi
text: |-
  Bastone, leggendario (richiede sintonia con un mago, uno stregone o un warlock)

  Questo bastone può essere impugnato come un bastone ferrato magico che garantisce un bonus di +2 ai tiri per colpire e ai tiri per i danni effettuati con esso. Mentre il personaggio lo impugna, ottiene un bonus di +2 ai tiri per colpire con incantesimo.

  Il bastone possiede 50 cariche per le proprietà descritte di seguito e recupera 4d6 + 2 cariche consumate all'alba di ogni giorno. Se il personaggio consuma l'ultima carica, deve tirare un d20; se ottiene 20, il bastone recupera 1d12 + 1 cariche.

  ***Assorbimento degli incantesimi.*** Mentre il personaggio impugna il bastone, dispone di vantaggio ai tiri salvezza contro gli incantesimi. Può inoltre usare la sua reazione quando un'altra creatura lancia un incantesimo che ha solo lui come bersaglio. Se lo fa, il bastone assorbe la magia dell'incantesimo, annullandone gli effetti e ottenendo un numero di cariche pari al livello dell'incantesimo assorbito. Tuttavia, se così facendo il numero totale delle cariche del bastone supera 50, il bastone esplode come se il personaggio avesse attivato il suo colpo del castigo (vedi di seguito).

  ***Incantesimi.*** Mentre il personaggio impugna il bastone, può usare un'azione per consumare alcune cariche e lanciare uno dei seguenti incantesimi usando la CD del tiro salvezza sull'incantesimo e la sua caratteristica da incantatore: dissolvi magie (3 cariche), evoca elementale (7 cariche), fulmine (versione di 7° livello, 7 cariche), invisibilità (2 cariche), muro di fuoco (4 cariche), palla di fuoco (versione di 7° livello, 7 cariche), passapareti (5 cariche), ragnatela (2 cariche), scassinare (2 cariche), sfera infuocata (2 cariche), spostamento planare (7 cariche), telecinesi (5 cariche) o tempesta di ghiaccio (4 cariche).

  Il personaggio può anche usare un'azione per lanciare con il bastone uno degli incantesimi seguenti senza spendere alcuna carica: individuazione del magico, ingrandire/ridurre, luce, mano magica, protezione dal bene e dal male o serratura arcana.

  ***Colpo del castigo.*** Il personaggio può usare un'azione per spezzare il bastone sul ginocchio o contro una superficie solida ed effettuare un colpo del castigo. Il bastone è distrutto e sprigiona la magia che gli restava in un'esplosione che si espande fino a riempire una sfera del raggio di 9 metri centrata su di esso.

  Il personaggio ha una probabilità del 50% di spostarsi istantaneamente su un piano di esistenza casuale per evitare l'esplosione. Se non riesce a evitare l'effetto, subisce danni da forza pari a 16 × il numero di cariche rimanenti nel bastone. Ogni altra creatura nell'area deve effettuare un tiro salvezza su Destrezza con CD 17: se lo fallisce, subisce un ammontare di danni basato sulla sua distanza dal punto di origine dell'esplosione, come indicato nella tabella sottostante. Ogni creatura che supera il tiro salvezza subisce soltanto la metà di quei danni.

  | Distanza dall'origine | Danni |

  |---|---|

  | 3 m o meno | 8 × il numero di cariche nel bastone |

  | Più di 3 m, fino a 6 m | 6 × il numero di cariche nel bastone |

  | Più di 6 m, fino a 9 m | 4 × il numero di cariche nel bastone |
attunement.by: un mago, uno stregone o un warlock
features.0.name: Bastone ferrato magico
features.1.name: Assorbimento degli incantesimi
features.1.effects.1.name: Assorbire un incantesimo
features.1.effects.1.trigger: quando un'altra creatura lancia un incantesimo che ha solo te come bersaglio
features.1.effects.1.text: |-
  Il bastone assorbe la magia dell'incantesimo, annullandone gli effetti e ottenendo un numero di cariche pari al livello dell'incantesimo assorbito. Se così facendo il bastone supera 50 cariche, esplode come se avessi attivato il suo colpo del castigo.
features.1.effects.1.onUse.0.note: |-
  Il bastone recupera un numero di cariche pari al livello dell'incantesimo assorbito, non 1; oltre 50 cariche esplode (Colpo del castigo).
features.2.name: Incantesimi
features.2.effects.0.note: |-
  Si lancia con un'azione usando la tua CD del tiro salvezza sull'incantesimo e la tua caratteristica da incantatore. Se consumi l'ultima carica, tira un d20: con un 20 il bastone recupera 1d12 + 1 cariche.
features.2.effects.6.note: Si lancia con il bastone con un'azione, senza spendere alcuna carica.
features.3.name: Colpo del castigo
features.3.effects.0.name: Colpo del castigo
features.3.effects.0.text: |-
  Spezzi il bastone: è distrutto e sprigiona la magia che gli restava in un'esplosione che riempie una sfera del raggio di 9 metri centrata su di esso. Hai una probabilità del 50% di spostarti istantaneamente su un piano di esistenza casuale, evitando l'esplosione; altrimenti subisci danni da forza pari a 16 × il numero di cariche nel bastone. Ogni altra creatura nell'area effettua un tiro salvezza su Destrezza con CD 17 e subisce danni in base alla sua distanza dal punto di origine (la metà in caso di successo).
features.3.effects.0.onUse.0.text: |-
  Danni in base alla distanza: 3 m o meno 8 × cariche, più di 3 m fino a 6 m 6 × cariche, più di 6 m fino a 9 m 4 × cariche (danni da forza). Il bastone è distrutto.
