name: "Manette dimensionali"
text: |-
  Oggetto meraviglioso, raro

  Il personaggio può usare un'azione per mettere queste manette a una creatura incapacitata. Le manette si adattano alle creature di taglia Piccola, Media o Grande. Oltre a funzionare come manette comuni, impediscono alla creatura ammanettata di usare qualsiasi metodo di movimento extradimensionale, inclusi il teletrasporto e il viaggio su un diverso piano di esistenza. Non le impediscono però di attraversare un portale interdimensionale.

  Il personaggio e qualsiasi creatura da lui designata al momento della chiusura delle manette possono usare un'azione per rimuoverle. Una volta ogni 30 giorni, la creatura ammanettata può effettuare una prova di Forza (Atletica) con CD 30. In caso di successo, la creatura si libera e distrugge le manette.
