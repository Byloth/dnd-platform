features.0.effects.0.text: "Le manette si adattano alle creature di taglia da Piccola a Grande. Oltre a funzionare come manette comuni, impediscono alla creatura ammanettata di usare qualsiasi metodo di movimento extradimensionale, inclusi il teletrasporto e il viaggio su un diverso piano (ma non di attraversare un portale interdimensionale). Tu e qualsiasi creatura da te designata potete usare un'azione per rimuoverle. Una volta ogni 30 giorni, la creatura ammanettata può effettuare una prova di Forza (Atletica) con CD 30; in caso di successo si libera e distrugge le manette."
