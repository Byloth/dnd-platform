name: Metamorfosi pura
components.m: Una goccia di mercurio, una piccola quantità di resina e uno sbuffo di fumo.
text: |-
  L'incantatore sceglie una creatura o un oggetto non magico entro gittata che è in grado di vedere e trasforma la creatura in una creatura diversa o in un oggetto, oppure l'oggetto in una creatura (esso non deve essere indossato o trasportato da un'altra creatura). La trasformazione permane per la durata dell'incantesimo o finché il bersaglio non scende a 0 punti ferita o muore. Se l'incantatore si concentra su questo incantesimo per tutta la sua durata, la trasformazione permane finché non viene dissolta. Questo incantesimo non ha effetto su un mutaforma, una creatura con 0 punti ferita o una creatura non consenziente che supera un tiro salvezza su Saggezza.

  **Creatura in creatura.** Se l'incantatore trasforma una creatura in un altro tipo di creatura, la nuova forma può essere di un qualsiasi tipo, purché il suo grado di sfida sia pari o inferiore a quello del bersaglio (o al livello del bersaglio, se esso non possiede un grado di sfida). Le statistiche di gioco del bersaglio, inclusi i punteggi di caratteristica mentali, vengono sostituite dalle statistiche della nuova forma, ma mantiene il suo allineamento e la sua personalità. Il bersaglio assume i punti ferita della nuova forma e, quando riassume la sua forma normale, la creatura ritorna al numero di punti ferita che aveva prima della trasformazione. Se torna alla sua forma normale per essere sceso a 0 punti ferita, gli eventuali danni in eccesso si trasmettono alla sua forma normale. Fintantoché i danni in eccesso non riducono la forma normale della creatura a 0 punti ferita, questa non cade priva di sensi. La creatura è limitata alle azioni che può effettuare in base alla natura della sua nuova forma e non può parlare, lanciare incantesimi o effettuare qualsiasi altra azione che richieda l'uso delle mani o della parola, a meno che la sua nuova forma non sia in grado di compiere tali azioni. L'attrezzatura del bersaglio si fonde nella sua nuova forma e la creatura non può attivare, usare, impugnare o beneficiare del proprio equipaggiamento.

  **Oggetto in creatura.** L'incantatore può trasformare un oggetto in un qualsiasi tipo di creatura, purché la sua taglia non sia maggiore di quella dell'oggetto e il suo grado di sfida sia pari o inferiore a 9. La creatura è amichevole nei confronti dell'incantatore e dei suoi compagni e agisce in ogni turno dell'incantatore, che decide quale azione effettua e come si muove. Il GM possiede le statistiche di questa creatura e risolve le sue azioni e i suoi movimenti. Se l'incantesimo diventa permanente, l'incantatore non controlla più la creatura, che potrebbe rimanere amichevole o meno nei suoi confronti, in base a come è stata trattata.

  **Creatura in oggetto.** Se l'incantatore trasforma una creatura in un oggetto, tutto ciò che essa indossa o trasporta si fonde nella nuova forma. Le statistiche della creatura diventano quelle dell'oggetto e, una volta terminato l'incantesimo e tornata nella sua forma normale, essa non ricorderà nulla del tempo trascorso in quella forma.
effects.0.text: |-
  Creatura in creatura: le statistiche di gioco (inclusi i punteggi di caratteristica mentali) sono sostituite da quelle di una creatura con grado di sfida non superiore a quello del bersaglio (o al suo livello), che mantiene allineamento e personalità; ha i punti ferita della nuova forma, non può parlare, lanciare incantesimi o effettuare azioni che richiedano mani o parola a meno che la forma non lo permetta, e il suo equipaggiamento si fonde nella forma e non può essere usato. Oggetto in creatura (GS 9 o inferiore, non più grande dell'oggetto): una creatura amichevole che agisce nei tuoi turni, di cui il GM risolve le statistiche. Creatura in oggetto: le sue statistiche diventano quelle dell'oggetto. Se ti concentri per tutta la durata, la trasformazione diventa permanente.
effects.0.note: |-
  In v0 la sostituzione del blocco di statistiche e le creature evocate non sono esprimibili: annota le statistiche a mano.
onCast.0.text: |-
  Una creatura non consenziente che supera un tiro salvezza su Saggezza non è influenzata; nessun effetto su un mutaforma o su una creatura con 0 punti ferita. La trasformazione termina a 0 punti ferita, quando la creatura torna ai punti ferita che aveva prima, e i danni in eccesso si trasmettono alla forma normale.
