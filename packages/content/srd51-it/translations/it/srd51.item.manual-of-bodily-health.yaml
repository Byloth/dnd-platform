name: Manuale della salute
text: |-
  Oggetto meraviglioso, molto raro

  Questo libro contiene suggerimenti utili sulla salute e sulla dieta, e le sue parole sono cariche di magia. Se il personaggio trascorre 48 ore in un periodo massimo di 6 giorni a studiare il contenuto del libro e ad applicarne i precetti, il suo punteggio di Costituzione aumenta di 2, come anche il massimo ottenibile in quel punteggio. Una volta letto, il libro perde il suo potere: lo riacquisterà dopo un secolo.
onUse.0.text: |-
  Se il personaggio trascorre 48 ore in un periodo massimo di 6 giorni a studiare il contenuto del libro e ad applicarne i precetti, il suo punteggio di Costituzione aumenta di 2, come anche il massimo ottenibile in quel punteggio. Una volta letto, il libro perde il suo potere: lo riacquisterà dopo un secolo. Registrare la modifica permanente sul personaggio (ability.con e ability.con.max +2); non è un effetto dell'oggetto equipaggiato.
