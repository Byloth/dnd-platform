name: Creare cibo e acqua
text: |-
  L'incantatore crea 20 kg di cibo e 135 litri d'acqua sul terreno o all'interno di un contenitore entro gittata, sufficienti per offrire sostentamento a quindici umanoidi o cinque destrieri per 24 ore. Il cibo è insipido ma nutriente e marcisce se non viene consumato entro 24 ore. L'acqua è pulita e non va a male.
