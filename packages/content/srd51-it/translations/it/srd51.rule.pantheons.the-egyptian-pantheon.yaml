name: "Pantheon egizio"
text: |-
  Pantheon egizio

  Queste divinità sono una giovane dinastia appartenente a un'antica famiglia divina, eredi della sovranità del cosmo e della preservazione del principio divino del Ma'at: l'ordine fondamentale costituito da verità, giustizia, legge e ordine che assegna equamente e secondo logica a divinità, faraoni mortali e donne e uomini comuni il proprio posto nell'universo.

  Il pantheon egizio si distingue dagli altri nell'avere tre dèi della morte di allineamento diverso. Anubi è il dio legale neutrale dell'oltretomba, colui che giudica le anime dei morti. Set è il dio caotico malvagio dell'omicidio, noto soprattutto per avere ucciso suo fratello Osiride. Infine, Nefti è la dea caotica buona del lutto.
