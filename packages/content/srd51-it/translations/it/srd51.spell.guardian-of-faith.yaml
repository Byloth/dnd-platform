name: Guardiano della fede
text: |-
  Per la durata dell'incantesimo, un guardiano spettrale di taglia Grande compare e fluttua in uno spazio libero a scelta dell'incantatore, entro gittata e che è in grado di vedere. Il guardiano occupa quello spazio e appare indefinito, fatta eccezione per una spada e uno scudo scintillanti decorati con il simbolo della divinità dell'incantatore. Ogni creatura ostile all'incantatore che si muove in uno spazio entro 3 metri dal guardiano per la prima volta in un turno deve superare un tiro salvezza su Destrezza. In caso di fallimento, subisce 20 danni radiosi, o la metà dei danni in caso di successo. Il guardiano svanisce quando ha inflitto un totale di 60 danni.
effects.0.text: |-
  Un guardiano spettrale di taglia Grande fluttua nello spazio scelto. Ogni creatura ostile a te che si muove in uno spazio entro 3 metri da esso per la prima volta in un turno deve effettuare un tiro salvezza su Destrezza, subendo 20 danni radiosi in caso di fallimento, o la metà dei danni in caso di successo. Il guardiano svanisce quando ha inflitto un totale di 60 danni.
onCast.0.text: |-
  Il guardiano non ha statistiche; i suoi danni sono sempre 20 danni radiosi (tiro salvezza su Destrezza per dimezzarli).
