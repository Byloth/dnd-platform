name: Contese
text: |-
  A volte gli sforzi di un personaggio o di un mostro sono direttamente contrapposti a quelli di qualcun altro. Questo può accadere quando entrambi i contendenti cercano di fare la stessa cosa e soltanto uno può riuscirci, come per esempio tentare di afferrare un anello magico che è caduto a terra. Questa situazione si applica anche quando uno di loro cerca di impedire all'altro di fare qualcosa, come per esempio quando un mostro tenta di forzare una porta che un avventuriero tiene bloccata. In situazioni come queste l'esito è determinato da una forma speciale di prova di caratteristica chiamata contesa.

  Entrambi i partecipanti a una contesa effettuano prove di caratteristica separate che rappresentano i loro sforzi. Applicano tutti le penalità e i bonus appropriati, ma invece di confrontare il totale a una CD, confrontano i totali delle due prove tra loro. Il contendente che ha ottenuto il totale di prova più alto vince la contesa. Quel personaggio o mostro riesce a compiere l'azione desiderata o a impedire all'altro contendente di avere successo.

  Se la contesa ha come risultato un pareggio, la situazione rimane quella che era prima della contesa, quindi uno dei contendenti potrebbe vincere la contesa proprio perché non è cambiato nulla. Se due personaggi ottengono lo stesso risultato per impadronirsi dell'anello caduto a terra, nessuno dei due riesce ad afferrarlo. In una contesa tra un mostro che cerca di aprire una porta e un avventuriero che cerca di tenerla chiusa, un pareggio significa che la porta rimane chiusa.
