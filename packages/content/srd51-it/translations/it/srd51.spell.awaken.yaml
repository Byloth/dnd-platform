name: Risveglio
components.m: Un'agata del valore di almeno 1.000 mo, che l'incantesimo consuma.
text: |-
  Dopo aver trascorso il tempo di lancio tracciando percorsi magici su una pietra preziosa, l'incantatore tocca una bestia o un vegetale di taglia Enorme o inferiore. Il bersaglio deve essere privo di un punteggio di Intelligenza o possedere Intelligenza pari o inferiore a 3. Il bersaglio ottiene Intelligenza pari a 10 e la capacità di parlare un linguaggio conosciuto dall'incantatore. Se il bersaglio è un vegetale, ottiene l'abilità di muovere i suoi rami, radici, liane, rampicanti e così via e sviluppa sensi simili a quelli umani. Il GM sceglie le statistiche appropriate per il vegetale risvegliato, come per esempio nel caso di un cespuglio o un albero risvegliato. La bestia o il vegetale risvegliato rimane affascinato dall'incantatore per 30 giorni o finché quest'ultimo o i suoi compagni non lo danneggiano in qualche modo. Quando la condizione di affascinato termina, la creatura risvegliata sceglie se rimanere amichevole o meno nei confronti dell'incantatore, in base a com'è stata trattata quando affascinata.
onCast.0.note: |-
  La bestia o il vegetale risvegliato rimane affascinato da te per 30 giorni o finché tu o i tuoi compagni non lo danneggiate in qualche modo; quando la condizione termina, sceglie se rimanere amichevole o meno nei tuoi confronti.
onCast.1.text: |-
  Il bersaglio (una bestia o un vegetale di taglia Enorme o inferiore privo di un punteggio di Intelligenza o con Intelligenza pari o inferiore a 3) ottiene Intelligenza pari a 10 e la capacità di parlare un linguaggio che conosci; un vegetale risvegliato può muovere i suoi rami e sviluppa sensi simili a quelli umani, con statistiche scelte dal GM.
