name: Spruzzo colorato
components.m: Un pizzico di polvere o sabbia di colore rosso, giallo e blu.
text: |-
  Dalla mano dell'incantatore si sprigiona un lampo abbagliante di luce multicolore. L'incantatore tira un 6d10 e il totale ottenuto è la quantità di punti ferita delle creature che questo incantesimo può influenzare. Le creature all'interno di un cono di 4,5 metri che ha origine dall'incantatore sono influenzate in ordine crescente in base ai loro punti ferita attuali (le creature prive di sensi e vista sono escluse). A partire dalla creatura che al momento possiede meno punti ferita, ogni creatura influenzata da questo incantesimo è accecata fino al termine dell'incantesimo. Si sottraggono i punti ferita di ogni creatura dal totale, per poi iniziare dalla creatura che possiede il numero di punti ferita più basso. Affinché quella creatura possa essere influenzata, il totale dei suoi punti ferita deve essere pari o inferiore al totale rimanente.
higherLevel: |-
  Quando l'incantatore lancia questo incantesimo usando uno slot incantesimo di 2° livello o superiore, tira 2d10 aggiuntivi per ogni slot di livello superiore al 1°.
onCast.0.note: |-
  Nessun tiro salvezza: tira 6d10 (più 2d10 per ogni slot di livello superiore al 1°); le creature nel cono di 4,5 metri sono influenzate in ordine crescente in base ai loro punti ferita attuali, escludendo le creature prive di sensi e quelle che non possono vedere, e i punti ferita di ognuna si sottraggono dal totale finché il totale rimanente non è troppo basso.
