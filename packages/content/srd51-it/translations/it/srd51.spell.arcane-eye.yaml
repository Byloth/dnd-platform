name: Occhio arcano
components.m: Un ciuffo di peli di pipistrello.
text: |-
  L'incantatore crea un occhio magico invisibile che fluttua nell'aria per la durata dell'incantesimo entro la sua gittata. L'incantatore riceve informazioni visive dall'occhio, che è dotato di visione normale e scurovisione fino a 9 metri e che può inoltre guardare in ogni direzione. Con un'azione, l'incantatore può muovere l'occhio per un massimo di 9 metri in ogni direzione. Non c'è limite alla distanza di cui l'occhio può allontanarsi dall'incantatore, purché non entri in un altro piano di esistenza. Una barriera solida blocca il movimento dell'occhio, che tuttavia può passare attraverso un'apertura dal diametro minimo di 2,5 centimetri.
