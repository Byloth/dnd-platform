name: Collaborare
text: |-
  A volte due o più personaggi possono unire le forze nel tentativo di portare a termine un'impresa. Il personaggio che guida l'operazione (o quello con il modificatore di caratteristica più alto) può effettuare una prova di caratteristica disponendo di vantaggio, a rappresentare l'aiuto che riceve dagli altri personaggi. In combattimento, questo richiede l'azione di Aiuto.

  Un personaggio può aiutare soltanto se sarebbe in grado di tentare quell'impresa anche autonomamente. Per esempio, scassinare una serratura richiede competenza negli arnesi da scasso, quindi un personaggio privo di quella competenza non può aiutarne un altro in quell'impresa. Inoltre, un personaggio può aiutare soltanto qualora la collaborazione tra due o più individui sarebbe effettivamente produttiva. Alcune imprese, come per esempio infilare un filo nella cruna di un ago, non diventano più facili con l'aiuto di altri.
