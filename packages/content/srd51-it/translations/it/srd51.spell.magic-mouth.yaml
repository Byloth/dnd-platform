name: Bocca magica
components.m: Un frammento di favo e polvere di giada del valore di almeno 10 mo, che l'incantesimo consuma
text: L'incantatore imprime un messaggio all'interno di un oggetto entro gittata, che viene pronunciato quando si verifica una condizione di innesco. L'incantatore sceglie un oggetto che è in grado di vedere e che non è indossato o trasportato da un'altra creatura. Quindi pronuncia il messaggio, che non deve essere più lungo di 25 parole, ma può essere enunciato nell'arco di 10 minuti. Infine, determina la circostanza che innesca l'incantesimo e l'emissione del messaggio. Quando quella circostanza si verifica, sull'oggetto appare una bocca magica che recita il messaggio con il tono e il volume di voce dell'incantatore. Se l'oggetto scelto presenta già una bocca o qualcosa di simile (per esempio, la bocca di una statua), la bocca magica appare in modo che le parole sembrino pronunciate dalla bocca dell'oggetto. Quando lancia questo incantesimo, l'incantatore può fare in modo che esso termini una volta consegnato il messaggio o che rimanga attivo ripetendo il messaggio ogniqualvolta si verifica la circostanza di innesco. La circostanza di innesco può essere sia generale che dettagliata, ma deve essere basata su condizioni visibili o udibili che si verificano entro 9 metri dall'oggetto. Per esempio, l'incantatore potrebbe ordinare alla bocca di parlare quando, entro 9 metri dall'oggetto, una qualsiasi creatura si muove, oppure una campana d'argento suona.
