name: Durata
text: |-
  La durata di un incantesimo è il periodo di tempo in cui l'incantesimo persiste: può essere espressa in round, minuti, ore o perfino anni. Alcuni incantesimi specificano che i loro effetti durano finché gli incantesimi stessi non vengono dissolti o distrutti.

  ### Istantanea

  Molti incantesimi sono istantanei: l'incantesimo danneggia, cura, crea o altera una creatura o un oggetto in un modo che non può essere dissolto, in quanto la sua magia esiste per un solo istante.

  ### Concentrazione

  Alcuni incantesimi richiedono all'incantatore di mantenere la concentrazione al fine di mantenere attiva la loro magia. Se l'incantatore perde la concentrazione, un incantesimo di questo tipo termina.

  Se un incantesimo deve essere mantenuto tramite concentrazione, questo requisito è indicato alla voce Durata, dove viene anche specificato quanto a lungo l'incantatore può concentrarsi. Si può terminare la concentrazione in qualsiasi momento (nessuna azione richiesta).

  Normali attività come muoversi e attaccare non interferiscono con la concentrazione. I fattori seguenti possono invece interromperla:

  * **Lanciare un altro incantesimo che richiede concentrazione.** L'incantatore perde la concentrazione su un incantesimo se lancia un altro incantesimo che richiede concentrazione. Un incantatore non può concentrarsi su due incantesimi alla volta.
  * **Subire danni.** Ogni volta che l'incantatore subisce danni mentre si concentra su un incantesimo, deve effettuare un tiro salvezza su Costituzione per mantenere la concentrazione. La CD è pari a 10 o alla metà dei danni subiti (si sceglie il valore più alto). Se l'incantatore subisce danni da più fonti, come per esempio una freccia e il soffio di un drago, effettua un tiro salvezza separato per ogni fonte di danno.
  * **Essere incapacitato o ucciso.** L'incantatore perde la concentrazione su un incantesimo se è incapacitato o muore.

  Nel caso di particolari fenomeni ambientali, come un'onda che investe l'incantatore sul ponte di una nave nel bel mezzo di una tempesta, il GM potrebbe richiedere all'incantatore di superare un tiro salvezza su Costituzione con CD 10 per mantenere la concentrazione su un incantesimo.
