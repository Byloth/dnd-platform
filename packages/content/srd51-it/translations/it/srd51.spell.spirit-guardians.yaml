name: Guardiani spirituali
components.m: Un simbolo sacro.
text: |-
  L'incantatore chiama a sé degli spiriti che lo proteggano. Gli spiriti fluttuano attorno a lui a una distanza di 4,5 metri per la durata dell'incantesimo. Se l'incantatore è buono o neutrale, la loro forma spettrale appare angelica o fatata (a scelta dell'incantatore). Se è malvagio, appaiono come demoniaci. Quando l'incantatore lancia questo incantesimo, può indicare un qualsiasi numero di creature, che è in grado di vedere, che non ne saranno influenzate. La velocità di una creatura influenzata viene dimezzata all'interno dell'area e quando essa vi entra per la prima volta in un turno o vi inizia il proprio turno, deve effettuare un tiro salvezza su Saggezza. Se lo fallisce, subisce 3d8 danni radiosi (se l'incantatore è buono o neutrale) o 3d8 danni necrotici (se è malvagio). In caso di successo, subisce invece soltanto la metà di quei danni.
higherLevel: |-
  Quando l'incantatore lancia questo incantesimo usando uno slot incantesimo di 4° livello o superiore, i danni aumentano di 1d8 per ogni slot di livello superiore al 3°.
effects.0.text: |-
  Gli spiriti fluttuano attorno a te fino a 4,5 metri. Ogni creatura che non hai indicato al momento del lancio ha la velocità dimezzata nell'area e, quando vi entra per la prima volta in un turno o vi inizia il proprio turno, effettua un tiro salvezza su Saggezza: 3d8 danni radiosi (se sei buono o neutrale) o necrotici (se sei malvagio) in caso di fallimento, la metà in caso di successo; +1d8 per ogni slot di livello superiore al 3°.
