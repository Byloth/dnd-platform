name: Scassinare
text: |-
  L'incantatore sceglie un oggetto entro gittata che è in grado di vedere. Può trattarsi di una porta, uno scrigno, un forziere, un paio di manette, un lucchetto o un altro oggetto dotato di un mezzo normale o magico per la chiusura. Un bersaglio tenuto chiuso da una normale serratura, incastrato o sbarrato, cessa di essere tale. Se l'oggetto è protetto da più serrature, con questo incantesimo se ne sblocca soltanto una. Se l'incantatore sceglie un bersaglio tenuto chiuso da serratura arcana, quell'incantesimo è soppresso per 10 minuti, nel corso dei quali l'oggetto può essere aperto e chiuso normalmente. Quando l'incantatore lancia l'incantesimo, si percepisce un forte rumore simile al bussare proveniente dall'oggetto bersaglio, udibile fino a una distanza di 90 metri.
