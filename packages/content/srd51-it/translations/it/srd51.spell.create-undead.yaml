name: Creare non morti
components.m: Un vaso d'argilla colmo di terra raccolta in un cimitero, un vaso d'argilla colmo d'acqua salmastra e una pietra onice nera del valore di 150 mo per ogni cadavere.
text: |-
  L'incantatore può lanciare questo incantesimo soltanto di notte, scegliendo fino a tre cadaveri umanoidi di taglia Media o Piccola entro gittata. Ogni cadavere diventa un ghoul sotto il controllo dell'incantatore. (Il GM possiede le statistiche di gioco di queste creature.) Come azione bonus a ogni suo turno, l'incantatore può comandare mentalmente qualsiasi creatura animata con questo incantesimo, a patto che si trovi entro 36 metri da lui (se controlla varie creature, l'incantatore può comandarne una o tutte allo stesso momento, impartendo lo stesso comando a ciascuna di loro). L'incantatore decide quale azione effettuerà la creatura e dove si muoverà durante il suo turno successivo, oppure può impartirle un comando generale, come proteggere una stanza o un corridoio particolare. Se non impartisce comandi, la creatura si limita a difendersi dalle creature ostili. Una volta ricevuto un ordine, la creatura continua a seguirlo finché non ha portato a termine il compito. La creatura rimane sotto il controllo dell'incantatore per 24 ore, passate le quali smette di obbedire a qualsiasi comando ulteriore. Per mantenere il controllo sulla creatura per altre 24 ore, l'incantatore deve lanciare questo incantesimo su di essa prima che l'attuale periodo di 24 ore termini. Questo uso dell'incantesimo gli permette di ristabilire il controllo su un massimo di tre creature da lui animate tramite questo incantesimo, anziché animarne di nuove.
higherLevel: |-
  Quando l'incantatore lancia questo incantesimo usando uno slot incantesimo di 7° livello, può animare o ristabilire il controllo su quattro ghoul. Quando l'incantatore lancia questo incantesimo usando uno slot incantesimo di 8° livello, può animare o ristabilire il controllo su cinque ghoul, oppure su due ghast o wight. Quando l'incantatore lancia questo incantesimo usando uno slot incantesimo di 9° livello, può animare o ristabilire il controllo su sei ghoul, tre ghast o wight, oppure su due mummie.
onCast.0.text: |-
  Si lancia soltanto di notte. Fino a tre cadaveri di umanoidi di taglia Media o Piccola diventano ghoul sotto il controllo dell'incantatore per 24 ore; il GM possiede le loro statistiche (nessun blocco di statistiche nella v0). Come azione bonus a ogni suo turno, l'incantatore può comandarli entro 36 metri. Con uno slot di 7° livello: quattro ghoul; di 8°: cinque ghoul oppure due ghast o wight; di 9°: sei ghoul, tre ghast o wight, oppure due mummie. Lanciare di nuovo l'incantesimo permette invece di ristabilire il controllo anziché animare nuove creature.
