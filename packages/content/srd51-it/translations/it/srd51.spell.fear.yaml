name: Paura
components.m: Una piuma bianca o un cuore di pollo.
text: |-
  L'incantatore proietta la rappresentazione illusoria delle più grandi paure di una creatura. Ogni creatura entro un cono di 9 metri deve superare un tiro salvezza su Saggezza, altrimenti lascia cadere ciò che tiene in mano e diventa spaventata per la durata dell'incantesimo. Finché è spaventata da questo incantesimo, una creatura deve effettuare l'azione Scatto e muoversi a ogni suo turno per allontanarsi dall'incantatore lungo il percorso più sicuro possibile, sempre che abbia lo spazio per muoversi. Se la creatura termina il suo turno in un luogo dove l'incantatore non è in vista, può effettuare un tiro salvezza su Saggezza. Se lo supera, l'incantesimo termina il suo effetto su quella creatura.
onCast.0.note: Se fallisce il tiro salvezza su Saggezza, la creatura lascia cadere ciò che tiene in mano ed è spaventata; a ogni suo turno deve effettuare l'azione Scatto e allontanarsi dall'incantatore lungo il percorso più sicuro possibile, sempre che abbia lo spazio per muoversi. Una creatura che termina il suo turno in un luogo dove l'incantatore non è in vista può ripetere il tiro salvezza e, se lo supera, l'incantesimo termina il suo effetto su di lei.
