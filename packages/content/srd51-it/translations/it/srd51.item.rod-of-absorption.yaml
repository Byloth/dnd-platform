name: Verga dell'assorbimento
text: |-
  Verga, molto rara (richiede sintonia)

  Mentre il personaggio impugna questa verga, può usare la sua reazione per assorbire un incantesimo che sta bersagliando solo lui e che non abbia un'area di effetto. L'effetto dell'incantesimo assorbito è annullato e l'energia dell'incantesimo (ma non l'incantesimo vero e proprio) viene accumulata nella verga. L'energia ha lo stesso livello dell'incantesimo nel momento in cui è stato lanciato. La verga può assorbire e accumulare fino a 50 livelli di energia nel corso della sua esistenza. Dopo aver assorbito 50 livelli di energia, non può assorbirne altri. Se il personaggio è bersagliato da un incantesimo che non può essere accumulato, la verga non ha alcun effetto su quell'incantesimo.

  Quando il personaggio entra in sintonia con la verga, scopre quanti livelli di energia quest'ultima ha assorbito nel corso della propria esistenza e quanti livelli di energia degli incantesimi contiene attualmente.

  Se il personaggio è un incantatore e impugna la verga, può trasformare l'energia accumulata al suo interno in slot incantesimo e usarli per lanciare gli incantesimi che ha preparato o che conosce. Il personaggio può creare soltanto slot incantesimo di livello pari o inferiore a quello dei propri slot, fino al 5° livello al massimo. Il personaggio usa i livelli accumulati al posto dei propri slot, ma sotto ogni altro aspetto lancia l'incantesimo normalmente. Per esempio, può usare 3 livelli accumulati nella verga come uno slot incantesimo di 3° livello.

  Una verga appena trovata ha già 1d10 livelli di energia di incantesimi accumulati. Una verga che non può assorbire altra energia degli incantesimi e a cui non rimane più energia smette di essere un oggetto magico.
features.0.name: Assorbire incantesimi
features.0.effects.0.name: Assorbire incantesimi
features.0.effects.0.trigger: quando viene lanciato un incantesimo che bersaglia solo te (senza un'area di effetto)
features.0.effects.0.text: |-
  L'effetto dell'incantesimo assorbito è annullato e la sua energia viene accumulata nella verga al livello a cui l'incantesimo è stato lanciato. La verga può assorbire e accumulare fino a 50 livelli di energia nel corso della sua esistenza; dopo aver assorbito 50 livelli non può assorbirne altri, e un incantesimo che non può accumulare non subisce alcun effetto.
features.0.effects.0.onUse.0.text: |-
  Tieni il conto a mano dei livelli accumulati e del totale assorbito nel corso dell'esistenza (massimo 50). Una verga appena trovata contiene già 1d10 livelli.
features.1.name: Energia accumulata
features.1.effects.0.text: |-
  Se sei un incantatore e impugni la verga, puoi trasformare l'energia accumulata in slot incantesimo per lanciare gli incantesimi che hai preparato o che conosci, di livello pari o inferiore a quello dei tuoi slot, fino al 5° livello. I livelli accumulati sostituiscono il tuo slot; sotto ogni altro aspetto lanci l'incantesimo normalmente. Una verga che non può assorbire altra energia e a cui non ne rimane più smette di essere un oggetto magico.
features.1.effects.0.note: L'accumulo di incantesimi (trasformare l'energia accumulata in slot) non è esprimibile nella v0; è riportato come testo.
