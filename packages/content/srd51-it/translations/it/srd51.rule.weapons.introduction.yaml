name: Armi
text: |-
  Ogni classe conferisce a un personaggio competenza nell'utilizzo di certe armi, che riflettono le priorità di quella classe e gli strumenti che il personaggio tenderà più probabilmente a usare. Sia che il personaggio prediliga una spada lunga o un arco lungo, la sua arma e la sua capacità nell'usarla potranno a tutti gli effetti fare la differenza tra la vita e la morte nel corso dell'avventura.

  La tabella "Armi" indica le armi più comuni nei mondi dei giochi di ruolo fantasy, il loro costo, il peso, i danni che infliggono quando colpiscono e le eventuali capacità speciali che possiedono. Ogni arma è classificata come arma da mischia o arma a distanza. Un'arma da mischia si usa per attaccare un bersaglio entro 1,5 metri dal personaggio, mentre un'arma a distanza si usa per attaccare un bersaglio a distanza.
