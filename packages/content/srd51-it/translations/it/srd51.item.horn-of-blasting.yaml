name: Corno della distruzione
text: |-
  Oggetto meraviglioso, raro

  Il personaggio può usare un'azione per pronunciare la parola d'ordine del corno e suonarlo, emettendo un boato roboante in un cono di 9 metri udibile fino a una distanza di 180 metri. Ogni creatura all'interno del cono deve effettuare un tiro salvezza su Costituzione con CD 15: se lo fallisce, subisce 5d6 danni da tuono ed è assordata per 1 minuto, mentre se lo supera, subisce la metà di quei danni e non viene assordata. Le creature e gli oggetti fatti di vetro o di cristallo hanno svantaggio al tiro salvezza e subiscono 10d6 danni da tuono invece che 5d6.

  Ogni volta che viene usata la magia del corno esiste una probabilità del 20 percento che esploda. L'esplosione infligge 10d6 danni da fuoco a chi ha suonato il corno e distrugge l'oggetto.
