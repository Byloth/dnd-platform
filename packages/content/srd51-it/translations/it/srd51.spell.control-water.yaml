name: Controllare acqua
components.m: Una goccia d'acqua e un pizzico di polvere.
text: |-
  Fino al termine dell'incantesimo, l'incantatore controlla una massa libera d'acqua all'interno di un'area a sua scelta, con un volume massimo pari a un cubo di 30 metri per lato. Quando lancia questo incantesimo, l'incantatore può scegliere uno dei seguenti effetti e, con un'azione durante il suo turno, può ripetere il medesimo effetto o sceglierne uno differente.

  **Inondazione.** L'incantatore fa in modo che il livello di tutta l'acqua ferma dell'area si alzi di un massimo di 6 metri. Se l'area include una riva, l'inondazione si riversa sulla terraferma. Se l'incantatore sceglie un'area all'interno di un grande specchio d'acqua, genera invece un'onda alta 6 metri che da una parte dell'area si infrange sull'altra. Qualsiasi veicolo di taglia Enorme o inferiore sul percorso dell'onda viene trascinato dall'altra parte dell'area e ha una probabilità del 25% di capovolgersi. Il livello dell'acqua rimane elevato fino al termine dell'incantesimo o finché l'incantatore non sceglie un effetto diverso. Se questo effetto produce un'onda, questa si ripete all'inizio del turno successivo dell'incantatore finché l'effetto di inondazione permane.

  **Separare le acque.** L'incantatore fa in modo che l'acqua presente nell'area scelta si separi, creando un canale che si estende per tutta l'area dell'incantesimo; le acque divise formano un muro su entrambi i lati. Il canale permane fino al termine dell'incantesimo o finché l'incantatore non sceglie un effetto diverso. L'acqua poi riempie lentamente il canale nel corso del round successivo, finché il livello normale dell'acqua non viene ripristinato.

  **Deviare la corrente.** L'incantatore fa in modo che l'acqua corrente nell'area si muova in una direzione scelta da lui, anche se l'acqua deve risalire ostacoli e pareti o scorrere in altre direzioni inverosimili. L'acqua nell'area si muove secondo le indicazioni dell'incantatore, ma una volta superata l'area dell'incantesimo, riprende il suo corso in base alle condizioni del terreno. L'acqua continua a scorrere nella direzione scelta fino al termine dell'incantesimo o finché l'incantatore non sceglie un effetto diverso.

  **Gorgo.** Questo effetto richiede uno specchio d'acqua in un'area quadrata di almeno 15 metri e 7,5 metri di profondità. L'incantesimo crea un gorgo al centro dell'area, che forma un vortice alto 7,5 metri e ampio 1,5 metri alla base e fino a 15 metri alla sommità. Qualsiasi creatura o oggetto nell'acqua ed entro 7,5 metri dal vortice viene trascinato per 3 metri verso di esso. Una creatura può allontanarsi nuotando dal vortice superando una prova di Forza (Atletica) contro la CD del tiro salvezza sull'incantesimo. Quando una creatura viene trascinata nel vortice per la prima volta in un turno o inizia il suo turno qui, deve superare un tiro salvezza su Forza. Se lo fallisce, la creatura subisce 2d8 danni contundenti e rimane bloccata nel vortice fino al termine dell'incantesimo. In caso di successo, la creatura subisce invece soltanto la metà di quei danni e non viene trascinata nel vortice. Una creatura trascinata nel vortice può usare un'azione per provare a uscirne come descritto in precedenza, ma subisce svantaggio alla prova di Forza (Atletica). La prima volta che in ogni turno un oggetto viene trascinato nel vortice, subisce 2d8 danni contundenti; questi danni vengono inferti a ogni round in cui l'oggetto rimane nel vortice.
effects.0.name: Controllare acqua
effects.0.text: |-
  Ripete il medesimo effetto o ne sceglie uno differente: Inondazione (alza il livello dell'acqua di un massimo di 6 metri, oppure genera un'onda alta 6 metri che attraversa l'area, trascina i veicoli di taglia Enorme o inferiore e ha una probabilità del 25% di capovolgerli); Separare le acque (apre un canale attraverso l'area); Deviare la corrente (fa muovere l'acqua corrente in una direzione scelta dall'incantatore); Gorgo (in uno specchio d'acqua quadrato di almeno 15 metri di lato e 7,5 metri di profondità: le creature e gli oggetti entro 7,5 metri vengono trascinati per 3 metri verso il vortice; una creatura che vi entra o vi inizia il suo turno effettua un tiro salvezza su Forza, e se lo fallisce subisce 2d8 danni contundenti e rimane bloccata, mentre in caso di successo subisce la metà dei danni; per allontanarsi a nuoto serve una prova di Forza (Atletica) contro la CD del tiro salvezza sull'incantesimo, con svantaggio se è bloccata).
effects.0.note: I tiri appartengono all'effetto Gorgo; gli altri effetti sono gestiti dal GM.
