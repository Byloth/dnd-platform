name: Deflagrazione occulta
text: |-
  Un raggio di energia crepitante viene scagliato contro una creatura entro gittata effettuando un attacco a distanza con incantesimo contro il bersaglio. Se il colpo va a segno, il bersaglio subisce 1d10 danni da forza. L'incantesimo crea più raggi quando l'incantatore raggiunge livelli superiori: due raggi al 5° livello, tre raggi all'11° livello e quattro raggi al 17° livello. L'incantatore può indirizzare i raggi contro lo stesso bersaglio o contro bersagli differenti, effettuando un tiro per colpire separato per ogni raggio.
