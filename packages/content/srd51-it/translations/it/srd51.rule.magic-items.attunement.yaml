name: "Sintonia"
text: |-
  Alcuni oggetti magici richiedono che una creatura formi un legame con essi prima di poterne utilizzare le proprietà magiche. Questo legame è definito sintonia e per alcuni oggetti sono necessari dei prerequisiti per stabilirlo. Se il prerequisito in questione è una classe, una creatura deve appartenere a quella classe per entrare in sintonia con l'oggetto. (Se si tratta di una classe da incantatore, un mostro si qualifica se possiede degli slot incantesimo e usa la lista di incantesimi di quella classe.) Se il prerequisito è essere un incantatore, la creatura si qualifica se può lanciare almeno un incantesimo usando i suoi tratti o privilegi, e non usando oggetti magici o simili.

  Chi non entra in sintonia con un oggetto che la richiede ne ottiene soltanto i benefici non magici, a meno che la sua descrizione non specifichi diversamente. Per esempio, uno scudo magico che richiede sintonia fornisce i benefici di uno scudo normale a una creatura che non sia in sintonia con esso, ma non le fornisce alcuna delle sue proprietà magiche.

  Per entrare in sintonia con un oggetto, una creatura deve spendere un riposo breve concentrandosi soltanto su quell'oggetto e mantenendosi in contatto fisico con esso (non può trattarsi dello stesso riposo breve usato per apprenderne le proprietà). Questa concentrazione può esprimersi in una seduta di addestramento con le armi (nel caso di un'arma), meditazione (nel caso di un oggetto meraviglioso) o un'altra attività appropriata. Se il riposo breve viene interrotto, il tentativo di sintonia fallisce. Altrimenti, alla fine del riposo breve, la creatura ottiene una comprensione intuitiva di come attivare le eventuali proprietà magiche dell'oggetto, incluse le parole d'ordine necessarie.

  Un oggetto può essere in sintonia soltanto con una creatura alla volta e una creatura può essere in sintonia con un massimo di tre oggetti magici contemporaneamente. Ogni tentativo di entrare in sintonia con un quarto oggetto fallisce: per riuscirci, la creatura deve prima porre fine alla sintonia con uno degli altri oggetti. Inoltre, una creatura non può entrare in sintonia con più di una copia di un determinato oggetto. Per esempio, non può entrare in sintonia con più di un *anello di protezione* alla volta.

  La sintonia di una creatura con un oggetto termina se la creatura non soddisfa più i prerequisiti di sintonia, se l'oggetto si trova a più di 30 metri di distanza per almeno 24 ore, se la creatura muore o se un'altra creatura entra in sintonia con l'oggetto. Una creatura può anche porre fine volontariamente alla sintonia, completando un altro riposo breve concentrandosi sull'oggetto, a meno che quest'ultimo non sia maledetto.
