name: Suggestione di massa
components.m: Una lingua di serpente e un elemento a scelta tra un frammento di alveare e una goccia di olio dolce.
text: "L'incantatore suggerisce un corso d'azione da intraprendere (limitandosi a una o due frasi) influenzando magicamente fino a dodici creature entro gittata che è in grado di vedere, le quali devono essere in grado di sentire l'incantatore e di comprenderne le parole. Le creature che non possono essere affascinate sono immuni a questo effetto. La suggestione deve essere formulata in modo che il corso d'azione appaia ragionevole: chiedere a una creatura di pugnalarsi, gettarsi su una lancia, immolarsi o compiere altri atti palesemente autolesionistici annulla automaticamente l'effetto dell'incantesimo. Ogni bersaglio deve effettuare un tiro salvezza su Saggezza. Se lo fallisce, deve perseguire il corso d'azione descritto dall'incantatore al meglio delle sue capacità. Tale corso d'azione può proseguire per l'intera durata dell'incantesimo. Se l'attività suggerita può essere completata in un periodo di tempo più breve, l'incantesimo termina quando il soggetto conclude ciò che gli è stato chiesto di fare. Mentre l'incantesimo è attivo, l'incantatore può anche specificare delle condizioni che inneschino un'attività speciale. Per esempio, potrebbe suggerire che dei soldati cedano tutti i loro soldi al primo mendicante che incontrano. Se la condizione non viene soddisfatta prima che l'incantesimo termini, l'attività non viene eseguita. Se l'incantatore o uno dei suoi compagni infligge danni a una creatura influenzata dall'incantesimo, questo termina per quella creatura."
higherLevel: Quando l'incantatore lancia questo incantesimo usando uno slot incantesimo di 7° livello, la durata è pari a 10 giorni. Quando usa uno slot incantesimo di 8° livello, la durata è pari a 30 giorni. Quando invece usa uno slot incantesimo di 9° livello, la durata è pari a un anno e un giorno.
