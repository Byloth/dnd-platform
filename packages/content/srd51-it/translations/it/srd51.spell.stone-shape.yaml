name: Scolpire pietra
components.m: Argilla morbida, che deve essere plasmata nella forma dell'oggetto desiderato.
text: |-
  L'incantatore tocca un oggetto di pietra di taglia Media o inferiore, oppure una sezione di pietra non più grande di 1,5 metri in ogni dimensione, modellandola nella forma che desidera. Potrebbe, per esempio, modellare una grossa roccia in un'arma, un idolo o uno scrigno, oppure aprire un piccolo passaggio in una parete, purché essa non sia spessa più di 1,5 metri. L'incantatore può anche modellare una porta di pietra o i suoi stipiti per sigillarla. L'oggetto creato può avere un massimo di due cardini e una chiusura, ma non può essere dotato di meccanismi più raffinati.
