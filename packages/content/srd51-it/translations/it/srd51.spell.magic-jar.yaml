name: Giara magica
components.m: Una gemma, un cristallo, un reliquiario o un altro contenitore ornamentale del valore di almeno 500 mo.
text: Il corpo dell'incantatore cade in uno stato catatonico e la sua anima lo abbandona entrando nel contenitore utilizzato come componente materiale dell'incantesimo. Mentre la sua anima si trova all'interno del contenitore, l'incantatore è consapevole di ciò che accade intorno a lui come se si trovasse nello spazio del contenitore; non può tuttavia muoversi o usare reazioni. L'unica azione che può effettuare è proiettare la propria anima fino a 30 metri fuori dal contenitore, tornando nel suo corpo (e così terminando l'incantesimo) o provando a prendere possesso di un corpo umanoide. L'incantatore può tentare di possedere un qualsiasi umanoide entro 30 metri da lui che è in grado di vedere (tranne le creature protette da un incantesimo protezione dal bene e dal male o cerchio magico). Il bersaglio deve effettuare un tiro salvezza su Carisma. In caso di fallimento, l'anima dell'incantatore migra nel corpo del bersaglio, la cui anima viene intrappolata nel contenitore. In caso di successo, il bersaglio resiste agli sforzi dell'incantatore di possederlo e quest'ultimo non può riprovare per le 24 ore successive. Quando l'incantatore prende possesso del corpo di una creatura, ne ha il pieno controllo. Le sue statistiche di gioco vengono sostituite dalle statistiche della creatura, benché l'incantatore conservi il proprio allineamento, i punteggi di Intelligenza, Saggezza e Carisma e il beneficio dei suoi privilegi di classe. Se il bersaglio ha dei livelli di classe, l'incantatore non può utilizzare i privilegi di classe della creatura. Nel frattempo, l'anima della creatura posseduta può percepire ciò che accade intorno al contenitore utilizzando i propri sensi, ma non può muoversi o effettuare azioni. Mentre è in possesso di un corpo, l'incantatore può usare la sua azione per tornare nel contenitore se si trova entro 30 metri da lui, riportando l'anima della creatura ospite nel suo corpo. Se il corpo ospite muore mentre l'incantatore si trova al suo interno, anche la creatura muore e l'incantatore deve effettuare un tiro salvezza su Carisma contro la CD del suo stesso incantesimo. In caso di successo, l'incantatore torna nel contenitore, che deve tuttavia trovarsi entro 30 metri da lui; altrimenti muore. Se il contenitore viene distrutto o l'incantesimo termina, l'anima dell'incantatore torna nel suo corpo. Tuttavia, se il corpo si trova a più di 30 metri da lui o se è morto quando l'incantatore tenta di tornarci, anche l'incantatore perirà. Se l'anima di un'altra creatura si trova all'interno del contenitore quando viene distrutto, questa ritorna nel suo corpo, a patto che sia vivo e si trovi entro 30 metri; altrimenti, la creatura muore. Al termine dell'incantesimo, il contenitore viene distrutto.
effects.0.text: Mentre possiede un corpo, le statistiche di gioco dell'incantatore vengono sostituite da quelle della creatura, benché conservi il proprio allineamento e i punteggi di Intelligenza, Saggezza e Carisma e mantenga i propri privilegi di classe (ma non possa usare quelli dell'ospite). Mentre la sua anima si trova nel contenitore non può muoversi o usare reazioni; la sua unica azione è proiettare la propria anima fino a 30 metri per tornare nel suo corpo o tentare una possessione.
effects.0.note: "La sostituzione delle statistiche non è esprimibile nella v0: le statistiche dell'ospite vanno tenute a mano."
onCast.0.text: Un umanoide entro 30 metri che l'incantatore è in grado di vedere deve effettuare un tiro salvezza su Carisma; se lo fallisce, l'anima dell'incantatore migra nel suo corpo e la sua anima viene intrappolata nel contenitore; se lo supera, l'incantatore non può tentare di possederlo di nuovo per 24 ore. Le creature protette da protezione dal bene e dal male o cerchio magico non possono essere possedute. Se il corpo ospite muore mentre l'incantatore si trova al suo interno, questi effettua un tiro salvezza su Carisma contro la CD del suo stesso incantesimo per tornare nel contenitore entro 30 metri, altrimenti muore.
