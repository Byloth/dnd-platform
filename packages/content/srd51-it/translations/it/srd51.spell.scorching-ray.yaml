name: Raggio rovente
text: |-
  L'incantatore crea tre raggi di fuoco e li scaglia contro dei bersagli entro gittata, che possono essere uno o più. Con questo incantesimo, l'incantatore effettua un attacco a distanza con incantesimo per ogni raggio. Se il colpo va a segno, il bersaglio subisce 2d6 danni da fuoco.
higherLevel: |-
  Quando l'incantatore lancia questo incantesimo usando uno slot incantesimo di 3° livello o superiore, crea un raggio aggiuntivo per ogni slot di livello superiore al 2°.
