name: Sfera elastica
components.m: Una semisfera di cristallo trasparente e una semisfera corrispondente di resina.
text: |-
  Una sfera di forza scintillante circonda una creatura o un oggetto di taglia Grande o inferiore entro gittata. Una creatura non consenziente deve effettuare un tiro salvezza su Destrezza. Se lo fallisce, rimane intrappolata nella sfera per la durata dell'incantesimo. Nulla può attraversare la barriera in entrata e in uscita (oggetti fisici, energia o altri effetti magici), ma una creatura all'interno può respirare liberamente. La sfera è immune a tutti i danni e una creatura o un oggetto all'interno non può essere danneggiato dagli attacchi o dagli effetti che provengono dall'esterno; analogamente, non può infliggere danni a qualsiasi cosa si trovi all'esterno. La sfera non ha peso ed è grande quanto basta da contenere la creatura o l'oggetto al suo interno. Una creatura rinchiusa può usare la sua azione per spingere le pareti della sfera e farla rotolare a una velocità massima pari alla metà della propria. Analogamente, la sfera può essere sollevata e mossa da altre creature. Un incantesimo disintegrazione distrugge la sfera senza danneggiare ciò che contiene.
