name: "Equipaggiamento"
text: |-
  Le monete hanno diverse denominazioni in base al valore del materiale di cui sono composte. Le più comuni sono la moneta d'oro (mo), la moneta d'argento (ma) e la moneta di rame (mr).

  Con una moneta d'oro, un personaggio può comprare un giaciglio, 15 metri di corda pregiata o una capra. Un artigiano abile (ma non straordinario) può guadagnare una moneta d'oro al giorno. La moneta d'oro è l'unità di misura standard della ricchezza, anche se le monete vere e proprie di questo tipo non sono usate spesso. Quando i mercanti discutono di affari che riguardano merci o servizi del valore di centinaia o migliaia di monete d'oro, le transazioni in genere non prevedono lo scambio di monete. La moneta d'oro è usata principalmente come misura di valuta standard, ma lo scambio vero e proprio viene effettuato in lingotti d'oro, lettere di credito o merci preziose.

  Una moneta d'oro vale dieci monete d'argento, la valuta più diffusa presso i popolani. Una moneta d'argento è sufficiente a comprare mezza giornata di lavoro di un bracciante, un'ampolla di olio per lampade o una notte di riposo in una locanda povera.

  Una moneta d'argento vale dieci monete di rame, la valuta più diffusa presso i manovali e i mendicanti. Una moneta di rame consente di comprare una candela, una torcia o un gessetto.

  Esistono inoltre alcune monete insolite fatte di altri metalli preziosi, che a volte compaiono nei cumuli dei tesori. La moneta di electrum (me) e la moneta di platino (mp) provengono da imperi decaduti e regni perduti e a volte destano sospetto e scetticismo se usate nelle transazioni. Una moneta di electrum vale cinque monete d'argento e una moneta di platino vale dieci monete d'oro.

  Una moneta standard pesa circa dieci grammi, quindi cinquanta monete pesano circa mezzo chilogrammo.
