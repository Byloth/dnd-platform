name: "Punti esperienza"
text: |-
  Quanti punti esperienza (PE) vale un mostro dipende dal suo grado di sfida. Solitamente i PE vengono concessi quando il mostro viene sconfitto, ma il GM potrebbe assegnare i PE anche se la minaccia costituita dal mostro viene sventata in altri modi.

  Salvo dove specificato diversamente, un mostro evocato da un incantesimo o da un'altra capacità magica vale i PE indicati nella sua scheda delle statistiche.
