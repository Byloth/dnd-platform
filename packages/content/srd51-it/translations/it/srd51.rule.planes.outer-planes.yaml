name: "Piani Esterni"
text: |-
  Se i Piani Interni sono formati dall'energia e le materie prime che compongono il multiverso, i Piani Esterni sono la guida, il pensiero e lo scopo di tale costruzione. Di conseguenza, molti sapienti si riferiscono ai Piani Esterni come piani divini, piani spirituali o piani degli dèi, in quanto essi sono noti come le dimore delle divinità.

  Quando si parla di qualsiasi cosa riguardi le divinità, è necessario usare un linguaggio fortemente metaforico. Le loro dimore non sono dei "luoghi" reali, bensì l'esemplificazione dell'idea che vede i Piani Esterni come reami del pensiero e dello spirito. Come nel caso dei Piani Elementali, è possibile immaginare la parte percepibile dei Piani Esterni come una specie di regione di confine, mentre le vaste regioni spirituali si estendono oltre le normali esperienze sensoriali.

  Anche in quelle regioni percepibili, le apparenze possono ingannare. Inizialmente, molti dei Piani Esterni appaiono ospitali e familiari ai viaggiatori provenienti dal Piano Materiale, ma il paesaggio può cambiare secondo i capricci delle potenti forze che vi dimorano. I desideri delle forze che vivono su questi piani potrebbero rimodellarli completamente, a tutti gli effetti cancellando e ricostruendo l'esistenza stessa per adattarla alle loro necessità.

  La distanza è un concetto pressoché insignificante sui Piani Esterni. Le regioni percepibili dei piani spesso sembrano molto piccole, ma possono protendersi per quella che sembra un'infinità. Se le potenze degli Inferi lo desiderassero, sarebbe possibile completare in un solo giorno una visita guidata dei Nove Inferi, dal primo al nono strato; oppure potrebbero essere necessarie intere settimane di viaggio massacrante per poterne attraversare un solo strato.

  I Piani Esterni più noti sono un gruppo di sedici piani corrispondenti agli otto allineamenti (esclusa la neutralità) e alle sfumature che li distinguono gli uni dagli altri.

  I piani con un elemento buono nella loro natura sono chiamati **Piani Superiori** e sono abitati da creature celestiali come angeli e pegasi. I piani con un elemento malvagio nella loro natura sono chiamati **Piani Inferiori** e sono abitati da immondi come demoni e diavoli. L'allineamento di un piano ne costituisce l'essenza e un personaggio il cui allineamento è in contrasto con quello del piano prova un forte senso di straniamento quando si trova in quel luogo. Per esempio, quando una creatura buona visita l'Elisio, un Piano Superiore neutrale buono, si sente in sintonia con quel piano; al contrario, una creatura malvagia si sentirà in contrasto con quel luogo e proverà un certo disagio.
