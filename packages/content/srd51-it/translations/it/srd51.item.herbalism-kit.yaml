name: Borsa da erborista
text: Questa borsa contiene vari strumenti come forbici, mortaio, pestello, sacchetti e fiale usate dagli erboristi per creare rimedi e pozioni. La competenza in questo oggetto consente a un personaggio di aggiungere il proprio bonus di competenza a ogni prova di caratteristica effettuata per identificare o applicare erbe. È inoltre richiesta competenza in questo oggetto per creare antitossine e pozioni di guarigione.
