name: Ferire
text: |-
  L'incantatore scatena una malattia virulenta contro una creatura entro gittata che è in grado di vedere. Il bersaglio deve effettuare un tiro salvezza su Costituzione subendo 14d6 danni necrotici in caso di fallimento, o la metà dei danni in caso di successo. Il danno non può ridurre i punti ferita del bersaglio a meno di 1. Se il bersaglio fallisce il tiro salvezza, i suoi punti ferita massimi vengono ridotti per 1 ora di un ammontare pari ai danni necrotici subiti. Qualsiasi effetto che rimuove le malattie riporta i punti ferita massimi della creatura alla normalità prima che quel periodo termini.
onCast.0.text: |-
  Il danno non può ridurre i punti ferita del bersaglio a meno di 1. Se il bersaglio fallisce il tiro salvezza su Costituzione, i suoi punti ferita massimi vengono ridotti per 1 ora di un ammontare pari ai danni necrotici subiti (nessuna formula per i danni subiti in v0); qualsiasi effetto che rimuove le malattie li riporta prima alla normalità.
