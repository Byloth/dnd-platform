name: Ammazzagiganti
text: |-
  Arma (qualsiasi ascia o spada), rara

  Il personaggio ottiene un bonus di +1 ai tiri per colpire e ai tiri per i danni effettuati con quest'arma magica.

  Quando il personaggio colpisce un gigante con quest'arma, il gigante subisce 2d6 danni extra del tipo inflitto dall'arma e deve superare un tiro salvezza su Forza con CD 15, altrimenti cade a terra prono. Ai fini di quest'arma, "gigante" si riferisce a qualsiasi creatura del tipo gigante, inclusi gli ettin e i troll.
features.0.name: Bonus di +1
features.1.name: Uccisione dei giganti
features.1.effects.0.note: "Solo quando colpisci un gigante (qualsiasi creatura del tipo gigante, inclusi gli ettin e i troll): 2d6 danni extra del tipo inflitto dall'arma, e il gigante deve superare un tiro salvezza su Forza con CD 15, altrimenti cade a terra prono."
