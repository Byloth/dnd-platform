name: "Impazzire"
text: |-
  Esistono vari effetti magici in grado di infliggere la follia a una mente altrimenti stabile. Alcuni incantesimi, come per esempio _contattare altri piani_ e _simbolo_, possono condurre alla follia e il GM può usare le regole illustrate in questa sezione al posto degli effetti di quegli incantesimi. Malattie, veleni e alcuni effetti planari, come il vento psichico o i venti ululanti di Pandemonium, possono tutti infliggere la follia. Alcuni manufatti sono inoltre in grado di devastare la psiche di un personaggio che li utilizza o entra in sintonia con loro.

  Per resistere a un effetto che induce alla follia è solitamente richiesto un tiro salvezza su Carisma o su Saggezza.
