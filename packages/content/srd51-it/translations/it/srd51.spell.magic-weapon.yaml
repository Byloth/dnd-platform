name: Arma magica
text: L'incantatore tocca un'arma non magica e, finché l'incantesimo non termina, quell'arma diventa un'arma magica con un bonus di +1 ai tiri per colpire e ai tiri per i danni.
higherLevel: Quando l'incantatore lancia questo incantesimo usando uno slot incantesimo di 4° livello o superiore, il bonus aumenta a +2. Quando l'incantatore usa uno slot incantesimo di 6° livello o superiore, il bonus aumenta a +3.
effects.0.note: Solo l'arma non magica toccata. Il bonus è +2 con uno slot di 4° livello o superiore e +3 con uno slot di 6° livello o superiore.
