name: Trova cavalcatura
text: |-
  L'incantatore evoca uno spirito che assume la forma di una cavalcatura insolitamente intelligente, forte e leale, stringendovi un legame duraturo. La cavalcatura appare in uno spazio libero entro gittata e assume la forma scelta dall'incantatore: cavallo da guerra, pony, cammello, alce o mastino. (Il GM potrebbe consentire ad altri animali di essere evocati come cavalcature.) La cavalcatura usa le statistiche della forma scelta, anche se si tratta di un celestiale, un folletto o un immondo (a scelta dell'incantatore) anziché di un tipo normale. Inoltre, se la cavalcatura ha un'Intelligenza pari o inferiore a 5, questa diventa 6 e ottiene la capacità di comprendere un linguaggio a scelta dell'incantatore che quest'ultimo sia in grado di parlare. La cavalcatura serve l'incantatore sia in combattimento che in altri momenti e, grazie al legame istintivo che li unisce, i due combattono come un'unica entità. Mentre è in sella alla cavalcatura, l'incantatore può fare in modo che ogni incantesimo che bersaglia solo se stesso bersagli anche la sua cavalcatura. Quando una cavalcatura scende a 0 punti ferita, scompare, non lasciando dietro di sé alcuna forma fisica. Inoltre, l'incantatore può in ogni momento congedare la cavalcatura con un'azione, causandone la scomparsa. In ogni caso, lanciare nuovamente questo incantesimo evocherà la medesima cavalcatura, con i suoi punti ferita massimi ripristinati. Finché la cavalcatura si trova a 1,5 km dall'incantatore, quest'ultimo può comunicare con lei telepaticamente. Un incantatore non può legarsi a più di una cavalcatura alla volta tramite questo incantesimo. Con un'azione, l'incantatore può liberare in ogni momento la cavalcatura dal legame che li unisce, causandone la scomparsa.
onCast.0.text: La cavalcatura usa le statistiche della forma scelta (cavallo da guerra, pony, cammello, alce, mastino o un altro animale consentito dal GM) come celestiale, folletto o immondo, con un'Intelligenza pari almeno a 6 e un linguaggio a scelta dell'incantatore che quest'ultimo sia in grado di parlare; le statistiche le possiede il GM (in v0 non ci sono blocchi di statistiche). Mentre è in sella, ogni incantesimo lanciato dall'incantatore che bersaglia solo se stesso può bersagliare anche la cavalcatura. Scompare a 0 punti ferita o quando l'incantatore la congeda con un'azione; lanciare di nuovo l'incantesimo evoca la medesima cavalcatura con i suoi punti ferita massimi. Entro 1,5 km l'incantatore può comunicare con lei telepaticamente.
