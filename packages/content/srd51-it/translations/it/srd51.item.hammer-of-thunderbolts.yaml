name: Martello dei fulmini
text: |-
  Arma (maglio), leggendaria

  Il personaggio ottiene un bonus di +1 ai tiri per colpire e ai tiri per i danni effettuati con quest'arma magica.

  Anatema dei giganti (richiede sintonia). Per entrare in sintonia con quest'arma, il personaggio deve indossare una cintura della forza dei giganti (di qualunque tipo) e dei guanti del potere orchesco. La sintonia termina se il personaggio rimuove uno qualsiasi di questi oggetti. Finché il personaggio è in sintonia con l'arma e la impugna, il suo punteggio di Forza aumenta di 4 e può superare 20, ma non 30. Quando il personaggio ottiene un 20 ai tiri per colpire effettuati con quest'arma contro un gigante, quest'ultimo deve superare un tiro salvezza su Costituzione con CD 17, altrimenti muore.

  Il martello, inoltre, possiede 5 cariche. Finché il personaggio è in sintonia con esso, può consumare 1 carica e usarlo per effettuare un attacco con arma a distanza, come se avesse la proprietà da lancio con una gittata normale di 6 metri e una gittata lunga di 18 metri. Se l'attacco va a segno, il martello genera un rombo di tuono udibile fino a 90 metri di distanza. Il bersaglio e ogni creatura entro 9 metri dal martello devono superare un tiro salvezza su Costituzione con CD 17, altrimenti diventano stordite fino alla fine del turno successivo del personaggio. Il martello recupera 1d4 + 1 cariche consumate all'alba di ogni giorno.
attunement.by: una creatura che indossa una cintura della forza dei giganti (di qualunque tipo) e dei guanti del potere orchesco; la sintonia termina se rimuovi uno qualsiasi di questi oggetti
