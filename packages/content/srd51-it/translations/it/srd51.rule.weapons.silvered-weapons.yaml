name: Armi argentate
text: |-
  Alcuni mostri dotati di immunità o resistenza alle armi non magiche sono suscettibili alle armi argentate, quindi gli avventurieri più lungimiranti investono qualche moneta in più per far placcare d'argento le proprie armi. Un personaggio può rendere argentata una singola arma o dieci munizioni al costo di 100 mo. Questo costo riflette non solo il prezzo dell'argento, ma anche il tempo e la perizia richiesti per aggiungere l'argento all'arma senza comprometterne l'efficacia.
