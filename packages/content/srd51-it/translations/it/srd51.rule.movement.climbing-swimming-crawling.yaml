name: "Nuotare, scalare e strisciare"
text: |-
  Quando un personaggio nuota o scala, ogni 30 cm di movimento costano 30 cm extra (60 cm extra in caso di terreno difficile), a meno che una creatura non sia dotata di una velocità di nuotare o scalare. A discrezione del GM, per scalare una superficie verticale scivolosa o una che offra pochi appigli potrebbe essere necessario superare una prova di Forza (Atletica). Analogamente, per coprire una certa distanza in acque agitate potrebbe essere necessario superare una prova di Forza (Atletica).
