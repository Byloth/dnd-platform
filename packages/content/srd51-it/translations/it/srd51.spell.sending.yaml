name: Inviare
components.m: Un piccolo pezzo di filo di rame.
text: |-
  L'incantatore invia un breve messaggio di un massimo di venticinque parole a una creatura che gli sia familiare. La creatura sente il messaggio nella sua mente, riconosce l'incantatore come colui che l'ha inviato se lo conosce e può rispondere immediatamente allo stesso modo. L'incantesimo consente alle creature con un punteggio di Intelligenza pari o superiore a 1 di capire il significato del messaggio. L'incantatore può inviare il messaggio a qualsiasi distanza e perfino ad altri piani di esistenza, ma se il bersaglio si trova su un piano di esistenza diverso dal suo, c'è una probabilità del 5% che il messaggio non arrivi.
