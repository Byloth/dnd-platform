name: Inversione della gravità
components.m: Una calamita e limatura di ferro.
text: |-
  Questo incantesimo inverte la gravità all'interno di un cilindro del raggio di 15 metri e dell'altezza di 30 metri centrato su un punto entro gittata. Quando viene lanciato, tutte le creature e gli oggetti presenti nell'area che non sono in qualche modo ancorati al terreno vengono trascinati verso l'alto e raggiungono la parte superiore del cilindro. Una creatura può effettuare un tiro salvezza su Destrezza per afferrare un oggetto ancorato entro portata, evitando di essere trascinata verso l'alto. Se un oggetto solido di qualche tipo (come per esempio un soffitto) viene urtato durante l'ascesa, gli oggetti e le creature subiscono un impatto identico a quello di una normale caduta verso il basso. Se un oggetto o una creatura raggiunge la sommità dell'area senza colpire nulla, rimane sospeso lassù a oscillare leggermente per la durata dell'incantesimo. Al termine dell'incantesimo, gli oggetti e le creature influenzati ricadono a terra.
