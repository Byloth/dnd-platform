name: "Pantheon celtico"
text: |-
  Si dice che nel profondo di ogni anima si annidi qualcosa di selvaggio: una parte che si emoziona nell'udire il richiamo degli uccelli notturni o il sussurro del vento tra gli abeti e che freme nel cogliere l'inaspettato colore rosso dell'agrifoglio tra i rami di una quercia; ed è in quello spazio profondo che dimorano gli dèi celtici. Nati da torrenti e ruscelli, la loro potenza è rafforzata dalla robustezza della quercia e dalla bellezza delle foreste e delle brughiere. Quando il primo abitante delle foreste osò dare un nome al volto scorto nel nodo legnoso di un albero o alla voce che gorgogliava in un ruscello, questi dèi si manifestarono.

  Le divinità celtiche sono sovente servite da druidi e chierici, in quanto strettamente legate alle forze della natura venerate dai druidi.
