name: Disco fluttuante
components.m: Una goccia di mercurio.
text: |-
  Questo incantesimo crea un piano circolare e orizzontale di forza del diametro di 90 cm e spessore di 2,5 cm, che fluttua 90 cm sopra il terreno in uno spazio libero a scelta dell'incantatore entro gittata e che è in grado di vedere. Questo disco permane per la durata dell'incantesimo e può sostenere fino a 250 kg. Se si aggiunge ulteriore peso, l'incantesimo termina e tutto ciò che si trovava sul disco precipita a terra. Il disco rimane immobile se l'incantatore si trova entro 6 metri da esso. Se l'incantatore si allontana a più di 6 metri, il disco lo segue per rimanere entro 6 metri da lui. Può muoversi sul terreno dissestato, lungo scalinate, pendii e terreni simili, ma non può superare un dislivello pari o superiore a 3 metri. Per esempio, il disco non può attraversare una fossa profonda 3 metri o uscirne se si trovasse sul fondo. L'incantesimo termina se l'incantatore si allontana di più di 30 metri dal disco (normalmente accade perché il disco non può superare un ostacolo per seguirlo).
