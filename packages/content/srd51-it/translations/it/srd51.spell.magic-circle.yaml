name: Cerchio magico
components.m: Acqua santa o polvere d'argento e di ferro del valore di almeno 100 mo, che l'incantesimo consuma.
text: |-
  L'incantatore crea un cilindro di energia magica di 3 metri di raggio e 6 metri di altezza centrato in un punto del terreno entro gittata che è in grado di vedere. Rune luminose appaiono nei punti in cui il cilindro si interseca con il pavimento o altre superfici. L'incantatore sceglie uno o più tra i tipi di creature seguenti: celestiali, elementali, folletti, immondi o non morti. Il cerchio influenza una creatura del tipo scelto nei seguenti modi:
  - La creatura non può entrare volontariamente nel cilindro tramite mezzi non magici. Se prova a utilizzare il teletrasporto o il viaggio interplanare, deve prima superare un tiro salvezza su Carisma.
  - La creatura subisce svantaggio ai tiri per colpire contro i bersagli all'interno del cilindro.
  - I bersagli all'interno del cilindro non possono essere affascinati, spaventati o posseduti dalla creatura.
  Quando lancia questo incantesimo, l'incantatore può decidere di far funzionare la sua magia nella direzione inversa, impedendo cioè a una creatura di un tipo specifico di uscire dal cilindro e proteggendo i bersagli all'esterno.
higherLevel: Quando l'incantatore lancia questo incantesimo usando uno slot incantesimo di 4° livello o superiore, la durata aumenta di 1 ora per ogni slot di livello superiore al 3°.
effects.0.text: "Contro i tipi di creature scelti (celestiali, elementali, folletti, immondi o non morti): non possono entrare volontariamente nel cilindro tramite mezzi non magici (tiro salvezza su Carisma per farlo tramite teletrasporto o viaggio interplanare), subiscono svantaggio ai tiri per colpire contro i bersagli al suo interno e non possono affascinarli, spaventarli o possederli. Il cerchio può essere invertito per trattenere tali creature al suo interno. Ogni slot di livello superiore al 3° aggiunge 1 ora alla durata."
effects.0.note: "Dipende dal tipo di creatura dell'attaccante: solo promemoria."
