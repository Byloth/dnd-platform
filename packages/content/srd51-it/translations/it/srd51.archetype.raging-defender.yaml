name: Difensore furioso
pitch: Un combattente che colpisce duro, incassa i colpi, carica per primo e tiene impegnato il nemico mentre gli amici fanno il loro lavoro.
why.class: "I barbari colpiscono duro, hanno più punti ferita di tutti e combattono senza armatura pesante: un compito chiaro e poche regole da tenere a mente."
why.species: Un mezzorco è forte e difficile da abbattere (Resistenza implacabile ti mantiene a 1 punto ferita una volta per riposo lungo).
why.abilityPriority: La Forza guida i tuoi attacchi e i danni della tua Ira; la Costituzione ti dà punti ferita e, insieme alla Destrezza, la tua Classe Armatura.
why.background: Accolito, l'unico background dell'SRD, ti dà le abilità Intuizione e Religione e due linguaggi.
