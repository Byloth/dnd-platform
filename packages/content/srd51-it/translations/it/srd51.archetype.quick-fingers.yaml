name: Dita svelte
pitch: Un esperto piccolo e scaltro che si muove furtivamente, scassina serrature e colpisce dove fa più male.
why.class: "I ladri infliggono molti danni con l'Attacco Furtivo e sono i migliori nelle abilità: scelte chiare a ogni turno."
why.species: "Un halfling piedelesto aumenta la Destrezza, può nascondersi dietro agli amici ed è Fortunato: ottenere un 1 raramente è un disastro."
why.abilityPriority: La Destrezza guida i tuoi attacchi, la tua Classe Armatura e le tue abilità migliori; la Costituzione ti tiene in piedi; l'Intelligenza aiuta con Indagare.
why.background: Accolito, l'unico background dell'SRD, ti dà le abilità Intuizione e Religione e due linguaggi.
