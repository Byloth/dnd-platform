name: "Velocità"
text: |-
  A ogni personaggio o mostro è abbinata una velocità, vale a dire la distanza in metri che percorre in 1 round. Questo valore include anche i brevi movimenti veloci che un personaggio potrebbe effettuare nelle situazioni in cui rischia la vita.

  Le regole seguenti determinano la distanza che un personaggio o un mostro può percorrere in un minuto, un'ora o un giorno.
