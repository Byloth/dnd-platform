name: Scagliare maledizione
text: |-
  L'incantatore tocca una creatura, che deve superare un tiro salvezza su Saggezza, altrimenti verrà maledetta per la durata dell'incantesimo. Quando lancia questo incantesimo, l'incantatore sceglie la natura della maledizione tra le seguenti opzioni:
  - L'incantatore sceglie un punteggio di caratteristica. Mentre è maledetto, il bersaglio subisce svantaggio alle prove di caratteristica e ai tiri salvezza effettuati con quel punteggio di caratteristica.
  - Mentre è maledetto, il bersaglio ha svantaggio ai tiri per colpire contro l'incantatore.
  - Mentre è maledetto, il bersaglio deve effettuare un tiro salvezza su Saggezza all'inizio di ogni suo turno. Se lo fallisce, spreca la sua azione in quel turno senza fare nulla.
  - Mentre è maledetto, gli attacchi e gli incantesimi dell'incantatore infliggono al bersaglio 1d8 danni necrotici extra.

  Un incantesimo rimuovi maledizione pone fine a questo effetto. A discrezione del GM, l'incantatore può scegliere un effetto alternativo per la maledizione, che tuttavia non dovrebbe risultare più potente di quelli descritti sopra. Il GM ha l'ultima parola su tali effetti della maledizione.
higherLevel: |-
  Se l'incantatore lancia questo incantesimo usando uno slot incantesimo di 4° livello o superiore, la durata diventa concentrazione, fino a 10 minuti. Se usa uno slot incantesimo di 5° livello o superiore, la durata diventa 8 ore. Se usa uno slot incantesimo di 7° livello o superiore, la durata è di 24 ore. Se usa uno slot incantesimo di 9° livello, l'incantesimo dura finché non viene dissolto. Usando uno slot incantesimo di 5° livello o superiore, la durata non richiede concentrazione.
effects.0.text: |-
  Maledetto (un'opzione scelta al momento del lancio): svantaggio alle prove di caratteristica e ai tiri salvezza effettuati con un punteggio di caratteristica scelto; oppure svantaggio ai tiri per colpire contro l'incantatore; oppure un tiro salvezza su Saggezza all'inizio di ogni tuo turno, e se lo fallisci sprechi la tua azione; oppure gli attacchi e gli incantesimi dell'incantatore ti infliggono 1d8 danni necrotici extra.
effects.0.note: |-
  Dipende dall'opzione scelta, quindi non è espresso come svantaggio ai tiri; "maledetto" non è una condizione standard. Gli slot superiori estendono la durata: concentrazione fino a 10 minuti al 4° livello, 8 ore al 5°, 24 ore al 7°, finché non viene dissolto al 9° (senza concentrazione dal 5° livello).
onCast.0.text: |-
  Un tiro salvezza su Saggezza superato annulla l'effetto. Un incantesimo rimuovi maledizione pone fine all'effetto; il GM può consentire una maledizione alternativa di potenza simile.
