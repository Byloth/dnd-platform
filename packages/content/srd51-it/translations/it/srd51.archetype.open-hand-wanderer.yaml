name: Viandante della mano aperta
pitch: "Un combattente rapido e silenzioso che non ha bisogno né di armature né di armi: prima osserva, poi colpisce."
why.class: "I monaci combattono con mani e piedi, si muovono veloci e non devono mai preoccuparsi dell'armatura: meno cose da imparare il primo giorno."
why.species: Un nano delle colline è robusto (punti ferita extra, resistenza al veleno, scurovisione), e questo perdona gli errori iniziali.
why.abilityPriority: La Destrezza guida i tuoi attacchi e la tua Classe Armatura; la Saggezza si aggiunge alla tua Classe Armatura e al tuo ki; la Costituzione ti tiene in piedi.
why.background: Accolito, l'unico background dell'SRD, ti dà le abilità Intuizione e Religione e due linguaggi.
