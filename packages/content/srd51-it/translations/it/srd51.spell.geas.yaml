name: Costrizione
text: |-
  L'incantatore impartisce un comando magico a una creatura entro gittata che è in grado di vedere, costringendola a svolgere per lui un servizio di qualche tipo o ad astenersi dal compiere un'azione o un'attività. Se la creatura è in grado di comprendere l'incantatore, deve superare un tiro salvezza su Saggezza, altrimenti rimane affascinata per la durata dell'incantesimo. Mentre la creatura è affascinata dall'incantatore, subisce 5d10 danni psichici ogni volta che agisce in maniera direttamente contraria alle sue istruzioni, ma non più di una volta al giorno. L'incantesimo non ha effetto su una creatura che non è in grado di comprendere l'incantatore. L'incantatore può impartire al bersaglio un comando a sua scelta, a eccezione di un'attività che ne provocherebbe la morte certa: se impartisce un comando suicida, l'incantesimo termina. L'incantatore può usare un'azione per far cessare prematuramente l'incantesimo, che termina inoltre con un incantesimo rimuovi maledizione, ristorare superiore o desiderio.
higherLevel: |-
  Quando l'incantatore lancia questo incantesimo usando uno slot incantesimo di 7° o 8° livello, la durata è pari a 1 anno. Quando l'incantatore lancia questo incantesimo usando uno slot incantesimo di 9° livello, l'incantesimo permane finché uno degli incantesimi menzionati sopra non vi pone fine.
onCast.0.note: |-
  Con un tiro salvezza su Saggezza fallito (una creatura che non è in grado di comprenderti non è influenzata). Mentre è affascinata, la creatura subisce 5d10 danni psichici ogni volta che agisce in maniera direttamente contraria alle tue istruzioni, ma non più di una volta al giorno. Durata di 1 anno con uno slot di 7° o 8° livello, fino a quando non viene terminato con uno slot di 9° livello; puoi far cessare l'incantesimo con un'azione, un comando suicida vi pone fine e rimuovi maledizione, ristorare superiore o desiderio lo terminano.
