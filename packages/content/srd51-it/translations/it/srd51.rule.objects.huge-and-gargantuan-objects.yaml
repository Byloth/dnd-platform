name: "Oggetti di taglia Enorme o Mastodontica"
text: |-
  Le armi normali sono di scarsa utilità contro oggetti di taglia Enorme o Mastodontica, come per esempio una statua colossale, una colonna torreggiante di pietra o un gigantesco macigno. Detto questo, una torcia può incendiare un arazzo di taglia Enorme e un incantesimo _terremoto_ può ridurre in macerie un colosso di pietra. Il GM può tenere il conto dei punti ferita degli oggetti di taglia Enorme o Mastodontica, o può semplicemente decidere fino a quando l'oggetto può resistere all'arma o alla forza usata contro di lui. Se il GM tiene il conto dei punti ferita dell'oggetto, dovrà suddividerlo in sezioni di taglia Grande o inferiore e tenere il conto dei punti ferita di ognuna di esse separatamente. La distruzione di una delle sezioni potrebbe distruggere l'oggetto intero: una statua di taglia Mastodontica di un umano, per esempio, potrebbe crollare quando una delle sue gambe di taglia Grande è ridotta a 0 punti ferita.
