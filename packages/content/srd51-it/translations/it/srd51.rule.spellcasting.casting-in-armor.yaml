name: Lanciare incantesimi in armatura
text: |-
  Lanciare un incantesimo richiede grande concentrazione mentale e l'utilizzo di gesti molto precisi, quindi un personaggio deve essere competente nell'armatura che indossa per lanciare un incantesimo. In caso contrario, sarà troppo distratto e ostacolato dalla sua armatura per poter lanciare incantesimi.
