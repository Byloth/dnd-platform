name: Spada arcana
components.m: Una spada di platino in miniatura dall'impugnatura e dal pomolo di rame e zinco, del valore di 250 mo.
text: |-
  L'incantatore crea un piano di forza a forma di spada che fluttua entro gittata e permane per tutta la durata dell'incantesimo. Quando la spada appare, l'incantatore può effettuare un attacco in mischia con questo incantesimo contro un bersaglio a sua scelta che si trova entro 1,5 metri dalla spada. Se il colpo va a segno, il bersaglio subisce 3d10 danni da forza. Finché l'incantesimo non termina, l'incantatore può usare un'azione bonus in ogni suo turno per muovere la spada per un massimo di 6 metri fino a un punto che è in grado di vedere e ripetere questo attacco contro lo stesso bersaglio o contro uno diverso.
effects.0.name: "Spada arcana: attacco"
effects.0.text: |-
  Muovi la spada fino a 6 metri fino a un punto che sei in grado di vedere ed effettua un attacco in mischia con incantesimo contro un bersaglio entro 1,5 metri da essa; se il colpo va a segno, il bersaglio subisce 3d10 danni da forza.
