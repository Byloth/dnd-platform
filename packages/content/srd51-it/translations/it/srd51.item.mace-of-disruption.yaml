name: Mazza della distruzione
text: |-
  Arma (mazza), rara (richiede sintonia)

  Quando il personaggio colpisce con quest'arma magica un immondo o un non morto, quella creatura subisce 2d6 danni radiosi extra. Se il colpo porta il bersaglio a 25 punti ferita o meno, tale bersaglio deve superare un tiro salvezza su Saggezza con CD 15, altrimenti viene distrutto. In caso di successo, la creatura diventa spaventata dal personaggio fino alla fine del turno successivo di quest'ultimo.

  Finché il personaggio impugna quest'arma, essa proietta luce intensa in un raggio di 6 metri e luce fioca per altri 6 metri.
