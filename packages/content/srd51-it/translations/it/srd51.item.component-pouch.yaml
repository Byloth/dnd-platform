name: Borsa per componenti
text: Una borsa per componenti è un piccolo marsupio di cuoio impermeabile, dotato di scomparti dove custodire tutte le componenti materiali e gli altri oggetti speciali di cui il personaggio ha bisogno per lanciare incantesimi, fatta eccezione per le componenti con un costo specifico (come indicato nella descrizione dell'incantesimo).
