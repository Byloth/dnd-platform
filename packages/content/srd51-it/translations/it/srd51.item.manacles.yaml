name: Manette
text: |-
  Queste costrizioni di metallo possono bloccare una creatura di taglia Media o Piccola. Per sfuggire alle manette è necessario superare una prova di Destrezza con CD 20 e per romperle occorre superare una prova di Forza con CD 20. A ogni coppia di manette è abbinata una chiave. Senza la chiave, una creatura competente negli arnesi da scasso può scassinare la serratura superando una prova di Destrezza con CD 15. Le manette hanno 15 punti ferita.
