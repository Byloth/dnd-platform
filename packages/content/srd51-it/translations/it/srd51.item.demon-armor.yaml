name: "Armatura demoniaca"
text: |-
  Armatura (armatura a piastre), molto rara (richiede sintonia)

  Mentre il personaggio indossa questa armatura, ottiene un bonus di +1 alla CA ed è in grado di comprendere e parlare l'Abissale. Inoltre, i guanti d'arme artigliati dell'armatura trasformano i colpi senz'armi effettuati con le mani in armi magiche che infliggono 1d8 danni taglienti, con un bonus di +1 ai tiri per colpire e ai tiri per i danni.

  ***Maledizione.*** Una volta indossata quest'armatura maledetta, il personaggio non può togliersela a meno che non sia bersagliato da un incantesimo rimuovi maledizione o una magia analoga. Mentre l'indossa, il personaggio subisce svantaggio ai tiri per colpire contro i demoni e ai tiri salvezza contro i loro incantesimi e le loro abilità speciali.
