name: "Combattere in sella"
text: |-
  Un cavaliere che parte alla carica in sella al suo cavallo da guerra, un mago che lancia incantesimi dal dorso di un grifone o un chierico che sfreccia in cielo su di un pegaso beneficiano tutti della velocità e della mobilità che quella cavalcatura può fornire.

  Una creatura consenziente di taglia superiore di almeno una categoria a quella del personaggio e dotata di anatomia appropriata può fungere da cavalcatura per quel personaggio, rispettando le regole seguenti.
