name: Cono di freddo
components.m: Un piccolo cono di cristallo o vetro.
text: |-
  Un getto d'aria gelida si propaga dalle mani dell'incantatore. Ogni creatura entro un cono di 18 metri deve effettuare un tiro salvezza su Costituzione. In caso di fallimento, la creatura subisce 8d8 danni da freddo, o la metà dei danni in caso di successo. Una creatura uccisa da questo incantesimo si tramuta in una statua di ghiaccio finché non si scioglie.
higherLevel: |-
  Quando l'incantatore lancia questo incantesimo usando uno slot incantesimo di 6° livello o superiore, i danni aumentano di 1d8 per ogni slot di livello superiore al 5°.
