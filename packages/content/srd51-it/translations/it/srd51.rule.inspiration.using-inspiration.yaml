name: "Usare l'ispirazione"
text: |-
  Se un personaggio è dotato di ispirazione, può spenderla quando effettua un tiro per colpire, un tiro salvezza o una prova di caratteristica. Quando un personaggio spende ispirazione, dispone di vantaggio a quel tiro.

  Inoltre, se un personaggio possiede ispirazione, può ricompensare un altro giocatore per una buona interpretazione, un'idea ingegnosa o semplicemente per aver fatto qualcosa di entusiasmante nel corso del gioco. Quando un altro personaggio giocante fa qualcosa che offre un contributo determinante alla storia in modi divertenti e interessanti, il personaggio dotato di ispirazione può rinunciare alla sua ispirazione e cederla all'altro personaggio.
