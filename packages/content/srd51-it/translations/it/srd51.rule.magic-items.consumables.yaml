name: "Oggetti consumabili"
text: |-
  Alcuni oggetti si consumano quando vengono attivati. Pozioni ed elisir devono essere ingeriti, mentre un olio dev'essere spalmato sul corpo. Le parole scritte su una pergamena spariscono non appena quest'ultima è stata letta. Una volta usato, un oggetto consumabile perde la sua magia.
