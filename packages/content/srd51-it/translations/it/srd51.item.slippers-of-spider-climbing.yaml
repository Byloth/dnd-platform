name: Pantofole del ragno
text: |-
  Oggetto meraviglioso, non comune (richiede sintonia)

  Mentre indossa queste scarpe leggere, il personaggio può muoversi in alto, in basso e lateralmente sulle superfici verticali e a testa in giù sui soffitti mantenendo le mani libere. Inoltre, possiede velocità di scalare pari alla propria velocità base sul terreno. Tuttavia, le pantofole non gli permettono di muoversi in questo modo su una superficie scivolosa, come per esempio una superficie ricoperta di ghiaccio o d'olio.
features.0.name: Scalare come un ragno
features.0.effects.0.text: |-
  Possiedi velocità di scalare pari alla tua velocità base sul terreno e puoi muoverti in alto, in basso e lateralmente sulle superfici verticali e a testa in giù sui soffitti mantenendo le mani libere, tranne che su una superficie scivolosa, come una superficie ricoperta di ghiaccio o d'olio.
features.0.effects.0.note: |-
  Nessuna formula può fare riferimento alla velocità base sul terreno nella v0 (la set-formula di speed.climb richiede una variabile per la velocità base sul terreno); è mostrata come testo.
