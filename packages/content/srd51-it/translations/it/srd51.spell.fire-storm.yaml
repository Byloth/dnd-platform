name: Tempesta di fuoco
text: |-
  Una tempesta di ardenti lingue di fuoco appare in un punto entro gittata a scelta dell'incantatore. L'area della tempesta è composta da un massimo di dieci cubi di 3 metri, che l'incantatore può disporre come desidera. Ognuno di loro deve avere almeno un lato adiacente a quello di un altro cubo. Ogni creatura presente nell'area deve effettuare un tiro salvezza su Destrezza. In caso di fallimento, subisce 7d10 danni da fuoco, o la metà dei danni in caso di successo. Il fuoco danneggia ogni oggetto presente nell'area e incendia gli oggetti infiammabili non indossati o trasportati. L'incantatore può decidere di non influenzare con questo incantesimo le forme di vita vegetali nell'area.
