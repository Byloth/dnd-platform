name: Trasformazione
components.m: Un diadema di giada del valore di almeno 1.500 mo, che l'incantatore deve indossare prima di lanciare l'incantesimo.
text: |-
  L'incantatore assume la forma di una creatura diversa per la durata dell'incantesimo. La nuova forma può essere quella di una qualsiasi creatura con un grado di sfida pari o inferiore al suo livello. La creatura non può essere un costrutto o un non morto e deve essere di un tipo che l'incantatore abbia già visto almeno una volta. L'incantatore si trasforma in un normale esemplare di quella creatura, privo di livelli di classe o del tratto Incantesimi. Le sue statistiche di gioco vengono sostituite dalle statistiche della creatura scelta, benché l'incantatore conservi il proprio allineamento e i punteggi di Intelligenza, Saggezza e Carisma. Conserva inoltre tutte le sue competenze nelle abilità e nei tiri salvezza, oltre a ottenere quelle della creatura. Se la creatura possiede una competenza che anche l'incantatore possiede e il bonus nelle sue statistiche è superiore a quello dell'incantatore, quest'ultimo usa il bonus della creatura anziché il proprio. L'incantatore non può usare azioni leggendarie o azioni di tana nella sua nuova forma. L'incantatore assume i punti ferita e i Dadi Vita della nuova forma e, una volta tornato nella sua forma normale, riassume il numero di punti ferita che possedeva prima della trasformazione. Se torna nella sua forma normale per essere sceso a 0 punti ferita, gli eventuali danni in eccesso si trasmettono a essa. Fintantoché i danni in eccesso non portano la sua forma normale a 0 punti ferita, non cade privo di sensi. L'incantatore mantiene i benefici di tutti i privilegi forniti dalla sua classe, razza e da qualsiasi altra fonte e può usarli se, nella nuova forma, è fisicamente in grado di farlo. Tuttavia, non può usare nessuno dei suoi sensi speciali, come per esempio la scurovisione, a meno che non li possieda anche nella nuova forma, potendo parlare solo se la creatura è normalmente in grado di farlo. Quando si trasforma, l'incantatore può scegliere se lasciare cadere a terra l'equipaggiamento, se permettere che si fonda nella sua nuova forma o se indossarlo. L'equipaggiamento indossato funziona normalmente, ma spetta al GM decidere se è pratico o meno che la nuova forma indossi ogni determinato oggetto d'equipaggiamento, in base alla forma e alla taglia della creatura. L'equipaggiamento dell'incantatore non cambia per adattarsi alla nuova forma e ogni oggetto di equipaggiamento che non può indossare deve cadere a terra o fondersi con essa. L'equipaggiamento fuso nella nuova forma non ha alcun effetto in quello stato. Per la durata dell'incantesimo, l'incantatore può usare un'azione per assumere una forma diversa seguendo le stesse regole e restrizioni relative alla forma originale, con un'eccezione: se la nuova forma possiede più punti ferita rispetto a quelli attuali dell'incantatore, i punti ferita di quest'ultimo rimangono al valore attuale.
effects.0.text: |-
  Le tue statistiche di gioco vengono sostituite da quelle della creatura scelta (grado di sfida pari o inferiore al tuo livello, non un costrutto o un non morto, priva di livelli di classe e del tratto Incantesimi), ma conservi il tuo allineamento, i tuoi punteggi di Intelligenza, Saggezza e Carisma, le tue competenze nelle abilità e nei tiri salvezza (usando il bonus della creatura se superiore) e i privilegi di classe, razza e altre fonti se la forma lo consente. Assumi i suoi punti ferita e Dadi Vita; quando torni alla tua forma normale riassumi i punti ferita che possedevi prima, e i danni in eccesso si trasmettono a essa. Nessuna azione leggendaria o azione di tana; sensi speciali solo se la forma li possiede; puoi parlare solo se la forma è in grado di farlo.
effects.0.note: "La sostituzione del blocco di statistiche non è esprimibile nella v0: tieni traccia a mano delle statistiche della creatura. Non è richiesto alcun tiro salvezza."
effects.1.name: Cambiare forma
effects.1.text: |-
  Assumi una forma diversa seguendo le stesse restrizioni; se la nuova forma possiede più punti ferita di quella attuale, i tuoi punti ferita rimangono al valore attuale.
