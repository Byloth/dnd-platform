name: "Statuina del potere meraviglioso"
text: |-
  Oggetto meraviglioso, rarità variabile

  Una statuina del potere meraviglioso è una scultura raffigurante un animale abbastanza piccola da stare in tasca. Se il personaggio usa un'azione per pronunciare la parola d'ordine e gettare la statuina al suolo in un punto entro 18 metri da lui, essa si trasforma in una creatura vivente. Se lo spazio dove dovrebbe apparire la creatura è già occupato da altre creature o oggetti, o se non c'è spazio a sufficienza, la statuina non si trasforma.

  La creatura è amichevole nei confronti del personaggio e dei suoi compagni. Comprende i suoi linguaggi e obbedisce ai suoi comandi verbali. Se il personaggio non impartisce comandi, la creatura si difende, ma non effettua altre azioni.

  La creatura permane per una durata specifica per ogni statuina. Esaurita la durata, la creatura riassume la forma di statuina. La creatura si ritrasforma anticipatamente anche se scende a 0 punti ferita o se il personaggio usa di nuovo un'azione per pronunciare la parola d'ordine mentre la tocca. Quando torna a essere una statuina, la sua proprietà non può essere riutilizzata prima che sia trascorso un certo periodo di tempo, come specificato nella descrizione della specifica statuina.

  ***Grifone di bronzo (rara).*** Questa statuina di bronzo raffigura un grifone rampante. Può trasformarsi in grifone per una durata massima di 6 ore. Una volta usata, non può essere riutilizzata finché non sono trascorsi 5 giorni.

  ***Mosca d'ebano (rara).*** Questa statuina di ebano raffigura un tafano. Può trasformarsi in una mosca gigante per una durata massima di 12 ore e può essere montata come cavalcatura. Una volta usata, non può essere riutilizzata finché non sono trascorsi 2 giorni.

  Mosca gigante

  Bestia Grande, senza allineamento

  Classe Armatura 11

  Punti Ferita 19 (3d10 + 3)

  Velocità 9 m, volare 18 m

  | FOR | DES | COS | INT | SAG | CAR |

  |---|---|---|---|---|---|

  | 14 (+2) | 13 (+1) | 13 (+1) | 2 (-4) | 10 (+0) | 3 (-4) |

  Sensi Percezione passiva 10, scurovisione 18 m

  Linguaggi —

  ***Leoni d'oro (rara).*** Le statuine di questi leoni vengono sempre create in coppia. È possibile usare una sola statuina o entrambe contemporaneamente. Ognuna può trasformarsi in un leone per una durata massima di 1 ora. Ogni leone, una volta che è stato usato, non può essere riutilizzato finché non sono trascorsi 7 giorni.

  ***Capre d'avorio (rara).*** Queste statuine di avorio raffiguranti delle capre vengono sempre create in gruppi di tre pezzi. Ognuna delle capre ha un aspetto diverso dalle altre e funziona diversamente. Le loro caratteristiche speciali sono le seguenti:

  La capra del viaggio può trasformarsi in una capra Grande con le stesse statistiche di un cavallo da galoppo. Possiede 24 cariche e ogni ora o frazione di ora trascorsa in forma bestiale costa 1 carica. Finché la statuina possiede ancora delle cariche, il personaggio può usarla ogni volta che desidera. Una volta esaurite le cariche, torna alla forma di statuina e non può essere riutilizzata finché non sono trascorsi 7 giorni, momento in cui recupera tutte le sue cariche.

  La capra del dolore diventa una capra gigante per una durata massima di 3 ore. Una volta usata, non può essere riutilizzata finché non sono trascorsi 30 giorni.

  La capra del terrore diventa una capra gigante per una durata massima di 3 ore. La capra non può effettuare attacchi, ma il personaggio può rimuovere le corna e usarle come armi. Un corno diventa una lancia da cavaliere +1, l'altro una spada lunga +2. La rimozione di un corno richiede un'azione e le armi scompaiono quando la capra ritorna in forma di statuina, nel qual caso recupera le sue corna. Inoltre, quando il personaggio la cavalca, la capra emana un'aura di terrore entro un raggio di 9 metri. Tutte le creature ostili al personaggio che iniziano il loro turno dentro l'aura di terrore devono superare un tiro salvezza su Saggezza con CD 15, altrimenti diventano spaventate dalla capra per 1 minuto o finché quest'ultima non ritorna in forma di statuina. La creatura spaventata può ripetere il tiro salvezza alla fine di ogni suo turno e, se lo supera, l'effetto per lei svanisce. Una volta superato il tiro salvezza contro l'effetto, una creatura diventa immune a quell'aura per le 24 ore successive. Una volta usata, la statuina non può essere riutilizzata finché non sono trascorsi 15 giorni.

  ***Elefante di marmo (rara).*** Questa statuina di marmo è alta e lunga circa 10 cm. Può trasformarsi in un elefante per una durata massima di 24 ore. Una volta usata, non può essere riutilizzata finché non sono trascorsi 7 giorni.

  ***Stallone di ossidiana (molto rara).*** Questa statuina di ossidiana levigata può trasformarsi in un cavallo degli incubi per una durata massima di 24 ore. Il cavallo degli incubi combatte solo per difendersi. Una volta usata, non può essere riutilizzata finché non sono trascorsi 5 giorni.

  Se l'allineamento del personaggio è buono, ogni volta che usa la statuina esiste una probabilità del 10 percento che il cavallo degli incubi ignori i suoi comandi, compreso quello di riassumere la forma di statuina. Se il personaggio è in sella al cavallo degli incubi quando quest'ultimo ignora i suoi comandi, entrambi vengono istantaneamente trasportati in un luogo casuale sul piano dell'Ade, dove il cavallo degli incubi si ritrasforma in statuina.

  ***Cane di onice (rara).*** Questa statuina di onice raffigura un cane e può trasformarsi in un mastino per una durata massima di 6 ore. Il mastino ha un punteggio di Intelligenza pari a 8 e può parlare il Comune. Possiede inoltre scurovisione entro un raggio di 18 metri ed entro questo raggio è in grado di vedere creature e oggetti invisibili. Una volta usata, non può essere riutilizzata finché non sono trascorsi 7 giorni.

  ***Gufo di serpentino (rara).*** Questa statuina di serpentino raffigurante un gufo può trasformarsi in un gufo gigante per una durata massima di 8 ore. Una volta usata, non può essere riutilizzata finché non sono trascorsi 2 giorni. Il gufo può comunicare telepaticamente con il personaggio a qualsiasi distanza, purché entrambi si trovino sullo stesso piano di esistenza.

  ***Corvo d'argento (non comune).*** Questa statuina d'argento raffigurante un corvo può trasformarsi in un corvo per una durata massima di 12 ore. Una volta usata, non può essere riutilizzata finché non sono trascorsi 2 giorni. Finché è in forma di corvo, la statuina consente al personaggio di lanciare su di essa l'incantesimo animale messaggero a volontà.
