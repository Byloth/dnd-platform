features.0.effects.0.name: "Pronunciare la parola d'ordine e gettare la statuina"
features.0.effects.0.text: "Getta la statuina al suolo in un punto entro 18 metri da te: si trasforma in una creatura vivente, amichevole nei confronti tuoi e dei tuoi compagni, che comprende i tuoi linguaggi e obbedisce ai tuoi comandi verbali (se lo spazio è occupato o insufficiente, non si trasforma). Riassume la forma di statuina al termine della sua durata, se scende a 0 punti ferita o se usi un'azione per pronunciare di nuovo la parola d'ordine mentre la tocchi. Una volta ritrasformata, la statuina non può essere riutilizzata finché non è trascorso il periodo specificato per essa."
features.0.effects.0.onUse.0.text: "Durata e tempo di ricarica dipendono dalla statuina; il formato non prevede ricariche a giorni, quindi tieni traccia a mano del tempo di ricarica."
