name: Parlare con i vegetali
text: |-
  L'incantatore infonde nei vegetali entro 9 metri da sé una parvenza di animazione e di volontà, donando loro la capacità di comunicare con lui e di seguire dei comandi semplici. Può interrogare i vegetali sugli eventi avvenuti nell'area dell'incantesimo nella giornata passata, ottenere informazioni riguardo alle creature transitate al suo interno, al clima e ad altre circostanze. Per la durata dell'incantesimo, l'incantatore può anche trasformare un terreno difficile a causa della crescita vegetale (come per esempio arbusti e sottobosco) in un terreno normale. In alternativa può trasformare un terreno normale dove siano presenti dei vegetali in un terreno difficile, ordinando per esempio a rampicanti e rami di ostacolare degli inseguitori. I vegetali potrebbero essere in grado di effettuare altri compiti per conto dell'incantatore, a discrezione del GM. L'incantesimo non consente alle piante di sradicarsi e di deambulare, ma consente loro di muovere liberamente rami, rampicanti e viticci. Se una creatura vegetale si trova nell'area, l'incantatore può comunicarci come se entrambi condividessero una lingua comune, ma non ottiene alcuna capacità magica di influenzarla. Questo incantesimo può fare in modo che i vegetali creati con un incantesimo intralciare liberino una creatura trattenuta.
