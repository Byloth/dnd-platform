name: "Praticare una professione"
text: |-
  Un personaggio può lavorare tra un'avventura e l'altra: se lo fa, è in grado di condurre uno stile di vita modesto senza dover pagare 1 mo al giorno. Questo beneficio permane fintantoché il personaggio continua a praticare la sua professione.

  Se il personaggio appartiene a un'organizzazione in grado di fornirgli un impiego proficuo, come un tempio o una gilda di ladri, guadagna invece quanto basta per potersi permettere uno stile di vita agiato.

  Se possiede competenza nell'abilità Intrattenere e ne fa buon uso nei suoi periodi fuori servizio, guadagna invece quanto basta da permettersi uno stile di vita ricco.
