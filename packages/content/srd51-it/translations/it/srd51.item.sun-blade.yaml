name: Lama del sole
text: |-
  Arma (spada lunga), rara (richiede sintonia)

  Quest'oggetto sembra l'elsa di una spada lunga. Mentre il personaggio impugna l'elsa, può far comparire (o scomparire) una lama di pura energia radiosa usando un'azione bonus. Finché la lama è presente, questa spada lunga magica possiede la proprietà accurata. Se il personaggio è competente nelle spade corte o lunghe, è competente anche nell'uso della lama del sole.

  Il personaggio ottiene un bonus di +2 ai tiri per colpire e ai tiri per i danni effettuati con quest'arma, che infligge danni radiosi anziché taglienti. Quando l'arma colpisce un non morto, il bersaglio subisce 1d8 danni radiosi extra.

  La lama luminosa di questa spada proietta luce intensa in un raggio di 4,5 metri e luce fioca per altri 4,5 metri. La luce è considerata luce solare. Finché la lama permane, il personaggio può usare un'azione per ampliare o ridurre il raggio della luce intensa e fioca di 1,5 metri per ognuna, fino a un massimo di 9 metri o a un minimo di 3 metri per ognuna.
features.0.name: Lama radiosa
features.0.effects.0.note: |-
  I 1d8 danni radiosi extra si applicano solo quando colpisci un non morto. Finché è presente, la lama infligge danni radiosi anziché taglienti e possiede la proprietà accurata.
features.0.effects.1.note: |-
  Se sei competente nelle spade corte o lunghe, sei competente anche nella lama del sole.
features.1.name: Lama di energia radiosa
features.1.effects.0.name: Far comparire o scomparire la lama
features.1.effects.0.text: |-
  Mentre impugni l'elsa, fai comparire una lama di pura energia radiosa, o la fai scomparire. La lama proietta luce intensa in un raggio di 4,5 metri e luce fioca per altri 4,5 metri; la luce è considerata luce solare.
features.1.effects.1.name: Ampliare o ridurre la luce
features.1.effects.1.text: |-
  Aumenti o riduci il raggio della luce intensa e fioca della lama di 1,5 metri per ognuna, fino a un massimo di 9 metri o a un minimo di 3 metri per ognuna.
