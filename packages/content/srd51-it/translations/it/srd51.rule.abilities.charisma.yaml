name: Carisma
text: |-
  Il Carisma misura la capacità del personaggio di interagire con successo con gli altri. Include fattori come la sua sicurezza e la sua eloquenza e può rappresentare una personalità accattivante o imperiosa.

  ## Prove di Carisma

  Un personaggio può effettuare una prova di Carisma quando cerca di influenzare o di intrattenere gli altri, quando tenta di fare bella figura con qualcuno o di raccontare una bugia convincente, o quando deve destreggiarsi in una situazione sociale spinosa. Le abilità Inganno, Intimidire, Intrattenere e Persuasione rappresentano una maggiore disinvoltura in certi tipi di prove di Carisma.

  ### Inganno

  Una prova di Carisma (Inganno) determina se un personaggio è in grado di nascondere efficacemente la verità, verbalmente o tramite le sue azioni. Questa forma di inganno può abbracciare ogni metodo, dal fuorviare il prossimo tramite affermazioni ambigue, alle bugie vere e proprie. Situazioni tipiche possono includere imbrogliare una guardia con le chiacchiere, truffare un mercante, guadagnare denaro con il gioco d'azzardo, spacciarsi per qualcun altro sotto mentite spoglie, fugare i sospetti di qualcuno fornendo false rassicurazioni o mantenere un volto impassibile mentre si dice una bugia.

  ### Intimidire

  Quando un personaggio tenta di influenzare qualcuno tramite minacce dichiarate, azioni ostili e atti di violenza fisica, il GM può chiedergli di effettuare una prova di Carisma (Intimidire). Gli esempi al riguardo possono includere cercare di strappare informazioni a un prigioniero, convincere dei malviventi a rinunciare a uno scontro diretto o usare una bottiglia rotta per convincere uno sprezzante visir a cambiare la sua decisione.

  ### Intrattenere

  Una prova di Carisma (Intrattenere) stabilisce la misura in cui un personaggio riesce a deliziare il pubblico con un'esibizione di musica, danza, recitazione, narrazione o altre forme di intrattenimento.

  ### Persuasione

  Quando un personaggio tenta di influenzare altri tramite il tatto, la socievolezza o la benevolenza, il GM può chiedergli di effettuare una prova di Carisma (Persuasione). Solitamente un personaggio usa Persuasione quando agisce in buona fede per stringere amicizia, formulare una richiesta cordiale o agire come prevede il galateo. Esempi di persuasione includono convincere un ciambellano a portare il gruppo al cospetto del re, negoziare la pace tra due tribù in guerra o ispirare una folla di popolani.

  ### Altre prove di Carisma

  Il GM potrebbe richiedere una prova di Carisma anche quando un personaggio tenta di compiere imprese come:

  - Trovare la persona più adatta con cui parlare per apprendere notizie, dicerie e pettegolezzi
  - Mescolarsi a una folla per scoprire gli argomenti di conversazione che vanno per la maggiore


  ## Caratteristica da incantatore

  I bardi, i paladini, gli stregoni e i warlock usano Carisma come caratteristica da incantatore per determinare le CD dei tiri salvezza degli incantesimi che lanciano.
