name: Evoca folletto
text: |-
  L'incantatore evoca un folletto con grado di sfida pari o inferiore a 6, oppure uno spirito fatato che assume la forma di una bestia con grado di sfida pari o inferiore a 6. Il folletto appare in uno spazio libero entro gittata che l'incantatore è in grado di vedere e scompare quando scende a 0 punti ferita o al termine dell'incantesimo. La creatura fatata è amichevole nei confronti dell'incantatore e dei suoi compagni per tutta la durata dell'incantesimo. Si tira per l'iniziativa della creatura, che svolge i propri turni. La creatura fatata obbedisce ai comandi verbali dell'incantatore (nessuna azione richiesta), a patto che non violino il suo allineamento. Se l'incantatore non impartisce comandi, si difende dalle creature ostili, ma non intraprende altre azioni. Se la concentrazione viene meno, il folletto non scompare ma l'incantatore perde il controllo su di lui attirandone l'ostilità su di sé e sui suoi compagni, rischiando che la creatura fatata li attacchi. L'incantatore non può scacciare un folletto fuori dal suo controllo, che tuttavia scompare 1 ora dopo essere stato evocato. Il GM possiede le statistiche della creatura fatata.
higherLevel: |-
  Quando l'incantatore lancia questo incantesimo usando uno slot incantesimo di 7° livello o superiore, il grado di sfida aumenta di 1 per ogni slot di livello superiore al 6°.
effects.0.text: |-
  Il folletto evocato (grado di sfida pari o inferiore a 6, oppure uno spirito fatato in forma di bestia con GS pari o inferiore a 6) è amichevole nei confronti dell'incantatore e dei suoi compagni, tira la propria iniziativa e obbedisce ai suoi comandi verbali (nessuna azione richiesta), a patto che non violino il suo allineamento; se non riceve comandi, si limita a difendersi. Scompare quando scende a 0 punti ferita o al termine dell'incantesimo. Se la concentrazione viene meno, il folletto non scompare, diventa ostile, non può essere scacciato e scompare 1 ora dopo essere stato evocato.
onCast.0.text: |-
  Il GM possiede le statistiche della creatura fatata (nessun blocco di statistiche nella v0). Il grado di sfida aumenta di 1 per ogni slot di livello superiore al 6°.
