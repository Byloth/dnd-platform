name: Olio (ampolla)
text: |-
  L'olio solitamente viene venduto in ampolle di argilla da 0,5 litri. Con un'azione, il personaggio può spruzzare l'olio dell'ampolla su una creatura situata entro 1,5 metri da lui o lanciarla fino a 6 metri di distanza (l'ampolla si frantumerà all'impatto). In entrambi i casi, il personaggio effettua un attacco a distanza contro la creatura o l'oggetto bersaglio, considerando l'olio come un'arma improvvisata. Se colpisce il bersaglio, lo ricopre d'olio. Se il bersaglio subisce danni da fuoco prima che l'olio si asciughi (dopo 1 minuto), subisce 5 danni da fuoco aggiuntivi a causa dell'olio incendiato. Un personaggio può anche versare un'ampolla d'olio sul terreno per coprire un'area quadrata con lato di 1,5 metri, purché la superficie sia piana. Una volta incendiato, l'olio brucia per 2 round e infligge 5 danni da fuoco a qualsiasi creatura che entri nell'area o vi termini il proprio turno. Una creatura può subire questi danni solo una volta per turno.
