name: Individuare e disinnescare una trappola
text: |-
  In genere, alcuni elementi di una trappola sono visibili in seguito a un'ispezione attenta. I personaggi potrebbero notare una lastra di pietra che nasconde una piastra a pressione, il luccichio di un sottile cavo teso, dei piccoli fori lungo le pareti da cui potrebbero sprigionarsi getti di fiamme o qualche altro elemento che riveli la presenza di una trappola.

  La descrizione di una trappola specifica le prove e le CD richieste per individuarla o disinnescarla, oppure per entrambe le cose. Se un personaggio cerca attivamente una trappola, può effettuare una prova di Saggezza (Percezione) contro la CD della trappola. Il GM può anche confrontare la CD per individuare la trappola con il punteggio di Saggezza (Percezione) passiva di ogni personaggio, per determinare se qualcuno nel gruppo la nota mentre passa. Se gli avventurieri individuano una trappola prima di attivarla, potrebbero essere in grado di disarmarla, permanentemente o abbastanza a lungo da oltrepassarla. Il GM potrebbe richiedere a un personaggio una prova di Intelligenza (Indagare) per dedurre cosa sia necessario fare, seguita da una prova di Destrezza usando gli arnesi da scasso per mettere in atto il sabotaggio richiesto.

  Qualsiasi personaggio può effettuare una prova di Intelligenza (Arcano) per individuare o disattivare una trappola magica, in aggiunta alle eventuali prove elencate nella sua descrizione. Le CD rimangono le stesse a prescindere dalla prova usata. Inoltre, _dissolvi magie_ ha una probabilità di disinnescare la maggior parte delle trappole magiche, nella cui descrizione è fornita la CD della prova di caratteristica da effettuare quando si usa questo incantesimo.

  Nella maggior parte dei casi, la descrizione di una trappola è sufficientemente chiara da consentire al GM di determinare se le azioni di un personaggio riescono a individuare o far fallire la trappola. Come in molte situazioni, i tiri dei dadi non dovrebbero avere la precedenza sulle scelte di gioco intelligenti e su una buona pianificazione. È sufficiente usare il buon senso e basarsi sulla descrizione della trappola per determinare cosa succede. Nessuna trappola, per quanto ben progettata, può prevedere ogni potenziale azione che i personaggi potrebbero effettuare.

  Il GM dovrebbe permettere a un personaggio di scoprire la trappola senza effettuare una prova di caratteristica se una sua azione è in grado di rilevarne chiaramente la presenza. Per esempio, se un personaggio solleva un tappeto che nasconde una piastra a pressione, trova l'innesco della trappola senza bisogno di effettuare alcuna prova.

  Provocare il fallimento della trappola può essere più complicato. Si prenda l'esempio di un forziere del tesoro protetto da una trappola. Se il forziere viene aperto senza prima tirare le due maniglie sui lati, un meccanismo all'interno scocca una raffica di aghi avvelenati contro chiunque vi si trovi davanti. Dopo avere ispezionato il forziere e avere effettuato alcune prove, i personaggi non sapranno ancora dire con certezza se sia protetto da una trappola. Invece di limitarsi ad aprire il forziere, potrebbero posizionare uno scudo davanti a esso e poi aprire il forziere da una certa distanza con una verga di ferro. In questo caso, la trappola si innesca comunque, ma la raffica di aghi colpisce lo scudo senza provocare danni.

  Le trappole sono spesso progettate con meccanismi che consentono di disattivarle o oltrepassarle. I mostri intelligenti che collocano trappole intorno e all'interno della loro tana necessitano di un modo per oltrepassarle senza subire danni. Le trappole di questo tipo potrebbero essere dotate di una leva nascosta che le disinnesca o potrebbe esistere una porta segreta che nasconde un passaggio per aggirarle.
