name: "Allineamento"
text: |-
  L'allineamento di un mostro fornisce un indizio sulla sua indole e sul modo in cui si comporta in una situazione di interazione o di combattimento. Per esempio, un mostro caotico malvagio è un mostro con cui è difficile ragionare e potrebbe attaccare i personaggi a vista, mentre un mostro neutrale potrebbe essere disposto a scendere a compromessi. Consulta il *Manuale del Giocatore* per le descrizioni dei vari allineamenti.

  L'allineamento specificato nella scheda delle statistiche di un mostro è quello predefinito, ma il GM è libero di discostarsene e cambiarlo per adattarlo alle necessità della sua campagna. Se vuole usare un drago verde di allineamento buono o un gigante delle tempeste malvagio, niente glielo impedisce.

  Alcune creature possono avere **qualsiasi allineamento**. In altre parole, è il GM a stabilirlo. L'allineamento di certi mostri può indicare una tendenza o un'avversione alla legge, al caos, al bene o al male. Per esempio, un berserker può appartenere a qualsiasi allineamento caotico (caotico buono, caotico neutrale o caotico malvagio), come ben si addice alla sua natura selvaggia.

  Molte creature di intelligenza limitata non hanno alcuna comprensione della legge, del caos, del bene o del male. Non compiono scelte di tipo morale o etico e agiscono puramente in base all'istinto. Queste creature sono dette **senza allineamento**, ovvero non possiedono alcun allineamento.
