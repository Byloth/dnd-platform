name: Attacco
text: |-
  L'azione più comune in combattimento è quella di Attacco, che si tratti di menare un fendente di spada, scoccare una freccia con un arco o sferrare pugni a mani nude.

  Con quest'azione un personaggio effettua un attacco in mischia o a distanza. Vedi la sezione "Effettuare un attacco" per le regole che governano gli attacchi. Certi privilegi, come il privilegio Attacco Extra del guerriero, consentono a un personaggio di effettuare più di un attacco con quest'azione.
