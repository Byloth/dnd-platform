name: "Spese"
text: "Quando non si calano nelle viscere della terra, non esplorano rovine in cerca di tesori perduti o non muovono guerra alle forze dell'oscurità incombente, anche gli avventurieri devono pensare ai bisogni più comuni. Anche in un mondo fantastico, la gente deve soddisfare necessità basilari come vitto, alloggio e vestiario. Tutto questo ha un costo, anche se certi stili di vita costano più di altri."
