name: "Tempo"
text: |-
  Nelle situazioni in cui tenere conto del tempo che passa è importante, è il GM a decidere quanto tempo richieda una determinata impresa. Il GM può usare un'unità di misura temporale diversa in base al contesto. All'interno di un dungeon, i movimenti degli avventurieri vengono misurati in minuti. Impiegheranno circa un minuto per avanzare con prudenza lungo un corridoio, un altro minuto per individuare le eventuali trappole e almeno dieci minuti per setacciare l'area alla ricerca di tutto ciò che può contenere di interessante o di prezioso.

  In città o nelle terre selvagge spesso è più appropriato misurare il tempo in ore. Un gruppo di avventurieri desiderosi di raggiungere la torre solitaria al centro della foresta tenteranno di coprire i venti chilometri di distanza che li separano da essa entro quattro ore.

  Nel caso dei viaggi più lunghi, la misurazione in giorni è la più appropriata. Mentre gli avventurieri percorrono la strada che va da Soglia di Baldur ad Acquafonda, passeranno quattro giorni senza eventi degni di nota finché l'imboscata tesa da una banda di goblin non interromperà il loro viaggio.

  Nei combattimenti e nelle altre situazioni a ritmo serrato, il gioco è misurato in round, un intervallo di 6 secondi.
