name: Armatura della resistenza
text: |-
  Armatura (leggera, media o pesante), rara (richiede sintonia)

  Il personaggio che indossa questa armatura ottiene resistenza a un tipo di danno che il GM sceglie o determina casualmente tra le opzioni sottostanti.

  | d10 | Tipo di danno |
  |---|---|
  | 1 | Acido |
  | 2 | Freddo |
  | 3 | Fuoco |
  | 4 | Forza |
  | 5 | Fulmine |
  | 6 | Necrotico |
  | 7 | Veleno |
  | 8 | Psichico |
  | 9 | Radioso |
  | 10 | Tuono |
features.0.name: Resistenza
features.0.effects.0.note: Il GM sceglie il tipo di danno o lo determina casualmente (d10).
