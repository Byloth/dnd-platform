name: Contingenza
components.m: Una statuetta dell'incantatore scolpita in avorio e decorata con gemme del valore di almeno 1.500 mo.
text: |-
  L'incantatore sceglie un incantesimo di livello pari o inferiore a 5 che sia in grado di lanciare, che abbia un tempo di lancio di 1 azione e che possa avere come bersaglio l'incantatore stesso. L'incantatore lancia l'incantesimo, chiamato incantesimo contingente, come parte del lancio di contingenza, spendendo gli slot incantesimo per entrambi. L'incantesimo contingente, tuttavia, non ha effetto finché non si verificano determinate circostanze, che l'incantatore descrive nel momento in cui lancia i due incantesimi. Per esempio, un lancio di contingenza con respirare sott'acqua potrebbe stabilire che respirare sott'acqua avrà effetto quando l'incantatore sarà sommerso nell'acqua o in un liquido simile. Che l'incantatore lo desideri o meno, l'incantesimo contingente ha effetto nel momento in cui le circostanze vengono soddisfatte per la prima volta, poi contingenza termina. L'incantesimo contingente ha effetto solamente sull'incantatore, nonostante normalmente possa essere lanciato contro altri. L'incantatore può utilizzare un solo incantesimo contingenza alla volta. Se l'incantatore lancia nuovamente questo incantesimo, l'effetto di un altro incantesimo contingenza su di lui termina. Inoltre, contingenza termina qualora la sua componente materiale non si trovi sulla persona dell'incantatore.
