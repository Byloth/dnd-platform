name: Effettuare un attacco
text: |-
  Che si tratti di sferrare un colpo con un'arma da mischia, usare un'arma a distanza o effettuare un tiro per colpire come parte di un incantesimo, gli attacchi seguono una struttura molto semplice.

  1. **Scegliere un bersaglio.** Il personaggio sceglie un bersaglio entro la gittata del suo attacco: una creatura, un oggetto o un luogo.
  2. **Determinare i modificatori.** Il GM determina se il bersaglio beneficia di copertura e se l'attaccante dispone di vantaggio o svantaggio contro il bersaglio. Inoltre, gli incantesimi, le capacità speciali e gli altri effetti possono applicare bonus o penalità al suo tiro per colpire.
  3. **Sferrare l'attacco.** L'attaccante effettua il tiro per colpire. Se colpisce il bersaglio, tira per i danni, a meno che quel particolare attacco non preveda regole che specifichino diversamente. Alcuni attacchi generano effetti speciali in aggiunta o al posto dei danni.

  Se sussistono dei dubbi sul fatto che un'azione conti o meno come un attacco, la regola è semplice: se il personaggio effettua un tiro per colpire, sferra un attacco.
