name: Controincantesimo
castingTime.trigger: che l'incantatore può effettuare quando vede una creatura entro 18 metri da lui lanciare un incantesimo
text: |-
  L'incantatore tenta di interrompere una creatura nell'atto di lanciare un incantesimo. Se la creatura sta lanciando un incantesimo di 3° livello o inferiore, il suo incantesimo fallisce e non ha effetto. Se l'incantesimo è di 4° livello o superiore, l'incantatore effettua una prova di caratteristica usando la propria caratteristica da incantatore. La CD è pari a 10 + il livello dell'incantesimo. In caso di successo, l'incantesimo fallisce e non sortisce alcun effetto.
higherLevel: |-
  Quando l'incantatore lancia questo incantesimo usando uno slot incantesimo di 4° livello o superiore, l'incantesimo interrotto non sortisce alcun effetto se il suo livello è pari o inferiore al livello dello slot incantesimo usato dall'incantatore.
