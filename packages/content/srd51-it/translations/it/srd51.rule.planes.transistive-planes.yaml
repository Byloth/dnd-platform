name: Piani di transizione
text: |-
  Il Piano Etereo e il Piano Astrale sono chiamati Piani di transizione: reami perlopiù privi di tratti distintivi che fungono principalmente da mezzi per viaggiare da un piano all'altro. Incantesimi come _forma eterea_ e _proiezione astrale_ permettono ai personaggi di accedere a questi piani e di attraversarli per raggiungere quelli situati oltre di essi.

  Il **Piano Etereo** è una dimensione indistinta e immersa nella nebbia che viene talvolta descritta come un immenso oceano. Le sue rive, che prendono il nome di Confine Etereo, si sovrappongono al Piano Materiale e ai Piani Interni, così ogni luogo su questi piani corrisponde a un luogo simile sul Piano Etereo. Alcune creature sono in grado di vedere sul Confine Etereo, abilità concessa anche dagli incantesimi _vedere invisibilità_ e _visione del vero_. Inoltre, alcuni effetti magici si estendono oltre il Piano Materiale fino al Confine Etereo, in particolare quelli che usano l'energia della forza come _gabbia di forza_ e _muro di forza_. Le profondità del piano, chiamate Profondo Etereo, sono una regione di foschia turbinante e nebbie colorate.

  Il **Piano Astrale** è il reame del pensiero e del sogno, dove i visitatori viaggiano come anime incorporee per raggiungere i piani divini e demoniaci. Si tratta di un grande mare argentato, che appare identico da sopra e da sotto, attraversato da sbuffi di foschia bianchi e grigi che sfrecciano tra scintille di luce simili a stelle lontane e vortici di colore che roteano come monetine a mezz'aria. Qua e là è possibile imbattersi in qualche frammento di terraferma, ma la maggior parte del Piano Astrale è un dominio aperto e sconfinato.
