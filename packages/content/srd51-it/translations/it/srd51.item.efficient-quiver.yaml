name: "Faretra efficiente"
text: |-
  Oggetto meraviglioso, non comune

  Ognuno dei tre scomparti di questa faretra è collegato a uno spazio extradimensionale che le consente di contenere numerosi oggetti senza mai pesare più di 1 kg. Lo scomparto più corto può contenere fino a sessanta frecce, quadrelli o oggetti simili. Lo scomparto medio può contenere fino a diciotto giavellotti o oggetti simili. Lo scomparto più lungo contiene fino a sei oggetti lunghi come archi, bastoni ferrati o lance.

  Il personaggio può estrarre un qualsiasi oggetto qui contenuto come se fosse una normale faretra o fodero.
