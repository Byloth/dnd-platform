name: Incantesimi conosciuti e preparati
text: |-
  Prima che un incantatore possa usare un incantesimo, deve averlo ben chiaro in mente, oppure deve avere accesso a un oggetto magico che custodisce l'incantesimo in questione. I membri di alcune classi, compresi bardi e stregoni, hanno una lista limitata di incantesimi conosciuti che sono sempre impressi nella loro mente. Lo stesso vale per molti mostri in grado di usare la magia. Altri incantatori, come i chierici e i maghi, si sottopongono a un processo di preparazione degli incantesimi. Questo processo può variare da classe a classe, come definito nella loro descrizione.

  In ogni caso, il numero di incantesimi che un incantatore ha sempre impressi nella mente dipende dal livello del personaggio.
