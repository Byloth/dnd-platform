name: Barriera di lame
text: |-
  L'incantatore crea un muro verticale di lame affilate e turbinanti, composte da energia magica. Il muro compare entro gittata e permane per la durata dell'incantesimo. L'incantatore può creare un muro lineare lungo fino a 30 metri, alto 6 metri e spesso 1,5 metri, oppure un muro circolare del diametro massimo di 18 metri, alto 6 metri e spesso 1,5 metri. Il muro garantisce tre quarti di copertura alle creature che vi si trovano dietro e il suo spazio è un terreno difficile. Quando una creatura entra nell'area del muro per la prima volta in un turno o inizia il suo turno qui, deve superare un tiro salvezza su Destrezza. Se fallisce il tiro salvezza, la creatura subisce 6d10 danni taglienti. In caso di successo, subisce invece soltanto la metà di quei danni.
