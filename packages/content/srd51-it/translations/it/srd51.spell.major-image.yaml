name: Immagine maggiore
components.m: Un ciuffo di lana.
text: L'incantatore crea l'immagine di un oggetto, una creatura o qualche altro fenomeno visibile che non sia più grande di un cubo di 6 metri. L'immagine, apparendo in un punto situato entro gittata che l'incantatore sia in grado di vedere, permane per la durata dell'incantesimo. L'immagine illusoria sembra completamente reale e include suoni, odori e temperatura dell'oggetto che rappresenta. L'incantatore non può creare calore o freddo sufficienti a infliggere danni, un rumore abbastanza forte da infliggere danni da tuono o assordare una creatura, oppure un odore in grado di rendere una creatura inferma (come il fetore di un troglodita). Finché l'incantatore si trova entro la gittata dell'immagine illusoria, può usare la sua azione per fare in modo che essa si muova fino a un qualsiasi altro punto entro gittata. Mentre l'immagine è in movimento, l'incantatore può alterarne l'aspetto in modo che i movimenti risultino naturali. Ad esempio, se l'incantatore crea l'immagine di una creatura e decide di farla muovere, può alterare l'immagine in modo da simulare che stia camminando. Analogamente, può fare in modo che l'illusione generi suoni diversi in momenti diversi, in modo per esempio da farla perfino partecipare a una conversazione. L'illusione può essere rivelata da un'interazione fisica, perché è possibile passarle attraverso. Una creatura che usa la sua azione per esaminare l'immagine può determinare che si tratta di un'illusione superando una prova di Intelligenza (Indagare) contro la CD del tiro salvezza sull'incantesimo. Se una creatura riconosce l'illusione per ciò che è, riesce a vedere attraverso l'immagine, di cui si attenuano le altre caratteristiche sensoriali.
higherLevel: Quando l'incantatore lancia questo incantesimo usando uno slot incantesimo di 6° livello o superiore, l'incantesimo dura finché non viene dissolto, senza richiedere la concentrazione dell'incantatore.
