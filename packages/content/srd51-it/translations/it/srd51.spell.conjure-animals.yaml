name: Evoca animali
text: |-
  L'incantatore evoca alcuni spiriti fatati che assumono la forma di bestie e appaiono in spazi liberi che egli è in grado di vedere. Per determinare ciò che appare, l'incantatore sceglie una tra le opzioni seguenti:
  - Una bestia di grado di sfida pari o inferiore a 2
  - Due bestie di grado di sfida pari o inferiore a 1
  - Quattro bestie di grado di sfida pari o inferiore a 1/2
  - Otto bestie di grado di sfida pari o inferiore a 1/4
  - Ogni bestia è anche considerata un folletto e scompare quando scende a 0 punti ferita o quando l'incantesimo termina.

  Le creature evocate sono amichevoli nei confronti dell'incantatore e dei suoi compagni. Si tira per l'iniziativa delle creature evocate, che svolgono i propri turni come gruppo. Le creature obbediscono ai comandi verbali dell'incantatore (nessuna azione richiesta). Se l'incantatore non impartisce dei comandi, si difendono dalle creature ostili, ma non intraprendono altre azioni. Il GM possiede le statistiche delle creature.
higherLevel: |-
  Quando l'incantatore lancia questo incantesimo usando determinati slot incantesimo di livello superiore, sceglie una delle opzioni di evocazione elencate sopra e appaiono nuove creature: il doppio con uno slot di 5° livello, il triplo con uno slot di 7° livello e il quadruplo con uno slot di 9° livello.
effects.0.text: |-
  Gli spiriti fatati evocati in forma di bestia (una bestia di grado di sfida pari o inferiore a 2, due di GS pari o inferiore a 1, quattro di GS pari o inferiore a 1/2 oppure otto di GS pari o inferiore a 1/4) sono amichevoli nei confronti tuoi e dei tuoi compagni, tirano l'iniziativa come gruppo e obbediscono ai tuoi comandi verbali (nessuna azione richiesta); senza comandi si limitano a difendersi. Una bestia scompare quando scende a 0 punti ferita o quando l'incantesimo termina.
onCast.0.text: |-
  Il GM possiede le statistiche delle creature (nessun blocco di statistiche in v0). Il doppio delle creature con uno slot di 5° livello, il triplo con uno slot di 7° livello, il quadruplo con uno slot di 9° livello.
