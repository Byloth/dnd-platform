name: "Attività fuori servizio"
text: |-
  Tra un'avventura e l'altra, il GM potrebbe chiedere ai giocatori cosa fanno i loro personaggi durante i periodi di inattività. Tali momenti possono avere durate differenti, ma ciascuna attività fuori servizio richiederà un certo numero di giorni per essere completata prima che il personaggio possa trarne dei benefici. Inoltre, almeno 8 ore ogni giorno devono essere dedicate all'attività fuori servizio affinché la giornata sia valida. Non è necessario che i giorni siano consecutivi. Se il personaggio può dedicare più giorni del numero minimo richiesto, può continuare a svolgere la stessa attività per un periodo più lungo o passare a una nuova attività fuori servizio.

  È possibile condurre altre attività fuori servizio oltre a quelle presentate di seguito. Se un giocatore desidera che il suo personaggio trascorra il suo periodo fuori servizio dedicandosi a un'attività diversa da quelle descritte in questa sezione, deve discuterne con il GM.
