name: Aiuto
components.m: Una minuscola striscia di tessuto bianco.
text: |-
  Questo incantesimo rafforza il vigore e la determinazione degli alleati. L'incantatore sceglie fino a tre creature entro gittata. I punti ferita massimi e i punti ferita attuali di ogni bersaglio aumentano di 5 per la durata dell'incantesimo.
higherLevel: |-
  Quando l'incantatore lancia questo incantesimo usando uno slot incantesimo di 3° livello o superiore, i punti ferita di un bersaglio aumentano di altri 5 punti per ogni slot di livello superiore al 2°.
effects.0.note: Più 5 per ogni slot di livello superiore al 2°.
onCast.0.note: I punti ferita attuali aumentano di 5 insieme ai punti ferita massimi (più 5 per ogni slot di livello superiore al 2°); fino a tre creature.
