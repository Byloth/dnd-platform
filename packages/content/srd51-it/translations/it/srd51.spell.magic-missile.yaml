name: Dardo incantato
text: L'incantatore crea tre dardi lucenti di forza magica. Ogni dardo colpisce una creatura a sua scelta, situata entro gittata e che è in grado di vedere. Un dardo infligge 1d4 + 1 danni da forza al suo bersaglio. Tutti i dardi colpiscono simultaneamente e l'incantatore può dirigerli per colpire una o più creature.
higherLevel: Quando l'incantatore lancia questo incantesimo usando uno slot incantesimo di 2° livello o superiore, l'incantesimo crea un dardo aggiuntivo per ogni slot di livello superiore al 1°.
