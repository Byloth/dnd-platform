name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  checks:
    name: Lint, typecheck, build, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          # No packageManager field: the developer's own pnpm locally, the latest 12.x here.
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm generate:types:check
      - run: pnpm validate:content
      - run: pnpm build:content
      # A public package whose content changed must carry a new, released version (DEC-21).
      - run: pnpm release:content:check
      # After build:content: the web tests read the SRD bundle from build/content/.
      - run: pnpm test
      - run: pnpm fixtures
      - run: pnpm web:prepare-content
      - run: pnpm web:generate
      # Public content only: content-private/ never exists here.
      # Fixtures that require a private package are reported as skipped.
