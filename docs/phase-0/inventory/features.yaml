  - id: srd51.feature.cleric.spellcasting
    owner: cleric
    ownerType: class
    level: 1
    name: Spellcasting
    text: |-
      As a conduit for divine power, you can cast cleric spells.

      ###Cantrips

      At 1st level, you know three cantrips of your choice from the cleric spell list. You learn additional cleric cantrips of your choice at higher levels, as shown in the Cantrips Known column of the Cleric table.
      Preparing and Casting Spells

      The Cleric table shows how many spell slots you have to cast your spells of 1st level and higher. To cast one of these spells, you must expend a slot of the spell's level or higher. You regain all expended spell slots when you finish a long rest.

      You prepare the list of cleric spells that are available for you to cast, choosing from the cleric spell list. When you do so, choose a number of cleric spells equal to your Wisdom modifier + your cleric level (minimum of one spell). The spells must be of a level for which you have spell slots.

      For example, if you are a 3rd-level cleric, you have four 1st-level and two 2nd-level spell slots. With a Wisdom of 16, your list of prepared spells can include six spells of 1st or 2nd level, in any combination. If you prepare the 1st-level spell cure wounds, you can cast it using a 1st-level or 2nd-level slot. Casting the spell doesn't remove it from your list of prepared spells.

      You can change your list of prepared spells when you finish a long rest. Preparing a new list of cleric spells requires time spent in prayer and meditation: at least 1 minute per spell level for each spell on your list.

      ###Spellcasting Ability

      Wisdom is your spellcasting ability for your cleric spells. The power of your spells comes from your devotion to your deity. You use your Wisdom whenever a cleric spell refers to your spellcasting ability. In addition, you use your Wisdom modifier when setting the saving throw DC for a cleric spell you cast and when making an attack roll with one.

      **Spell save DC** = 8 + your proficiency bonus + your Wisdom modifier

      **Spell attack modifier** = your proficiency bonus + your Wisdom modifier

      ###Ritual Casting

      You can cast a cleric spell as a ritual if that spell has the ritual tag and you have the spell prepared.

      ###Spellcasting Focus

      You can use a holy symbol (see chapter 5, “Equipment”) as a spellcasting focus for your cleric spells.
    mechanics: null
  - id: srd51.feature.college-of-lore.additional-magical-secrets
    owner: college-of-lore
    ownerType: subclass
    level: 6
    name: Additional Magical Secrets
    text: At 6th level, you learn two spells of your choice from any class. A spell you choose must be of a level you can cast, as shown on the Bard table, or a cantrip. The chosen spells count as bard spells for you but don't count against the number of bard spells you know.
    mechanics: null
  - id: srd51.feature.college-of-lore.bonus-proficiencies
    owner: college-of-lore
    ownerType: subclass
    level: 3
    name: Bonus Proficiencies
    text: When you join the College of Lore at 3rd level, you gain proficiency with three skills of your choice.
    mechanics: null
  - id: srd51.feature.college-of-lore.cutting-words
    owner: college-of-lore
    ownerType: subclass
    level: 3
    name: Cutting Words
    text: Also at 3rd level, you learn how to use your wit to distract, confuse, and otherwise sap the confidence and competence of others. When a creature that you can see within 60 feet of you makes an attack roll, an ability check, or a damage roll, you can use your reaction to expend one of your uses of Bardic Inspiration, rolling a Bardic Inspiration die and subtracting the number rolled from the creature's roll. You can choose to use this feature after the creature makes its roll, but before the GM determines whether the attack roll or ability check succeeds or fails, or before the creature deals its damage. The creature is immune if it can't hear you or if it's immune to being charmed.
    mechanics: null
  - id: srd51.feature.college-of-lore.peerless-skill
    owner: college-of-lore
    ownerType: subclass
    level: 14
    name: Peerless Skill
    text: Starting at 14th level, when you make an ability check, you can expend one use of Bardic Inspiration. Roll a Bardic Inspiration die and add the number rolled to your ability check. You can choose to do so after you roll the die for the ability check, but before the GM tells you whether you succeed or fail.
    mechanics: null
  - id: srd51.feature.draconic-bloodline.draconic-presence
    owner: draconic-bloodline
    ownerType: subclass
    level: 18
    name: Draconic Presence
    text: Beginning at 18th level, you can channel the dread presence of your dragon ancestor, causing those around you to become awestruck or frightened. As an action, you can spend 5 sorcery points to draw on this power and exude an aura of awe or fear (your choice) to a distance of 60 feet. For 1 minute or until you lose your concentration (as if you were casting a concentration spell), each hostile creature that starts its turn in this aura must succeed on a Wisdom saving throw or be charmed (if you chose awe) or frightened (if you chose fear) until the aura ends. A creature that succeeds on this saving throw is immune to your aura for 24 hours.
    mechanics: null
  - id: srd51.feature.draconic-bloodline.draconic-resilience
    owner: draconic-bloodline
    ownerType: subclass
    level: 1
    name: Draconic Resilience
    text: |-
      As magic flows through your body, it causes physical traits of your dragon ancestors to emerge. At 1st level, your hit point maximum increases by 1 and increases by 1 again whenever you gain a level in this class.

      Additionally, parts of your skin are covered by a thin sheen of dragon-like scales. When you aren't wearing armor, your AC equals 13 + your Dexterity modifier.
    mechanics: null
  - id: srd51.feature.draconic-bloodline.dragon-ancestor
    owner: draconic-bloodline
    ownerType: subclass
    level: 1
    name: Dragon Ancestor
    text: |-
      At 1st level, you choose one type of dragon as your ancestor. The damage type associated with each dragon is used by features you gain later.

      ### Draconic Ancestry (table)
      | Dragon | Damage Type |
      | --- | --- |
      | Black | Acid |
      | Blue | Lightning |
      | Brass | Fire |
      | Bronze | Lightning |
      | Copper | Acid |
      | Gold | Fire |
      | Green | Poison |
      | Red | Fire |
      | Silver | Cold |
      | White | Cold |

      You can speak, read, and write Draconic. Additionally, whenever you make a Charisma check when interacting with dragons, your proficiency bonus is doubled if it applies to the check.
    mechanics: null
  - id: srd51.feature.draconic-bloodline.dragon-wings
    owner: draconic-bloodline
    ownerType: subclass
    level: 14
    name: Dragon Wings
    text: |-
      At 14th level, you gain the ability to sprout a pair of dragon wings from your back, gaining a flying speed equal to your current speed. You can create these wings as a bonus action on your turn. They last until you dismiss them as a bonus action on your turn.

      You can't manifest your wings while wearing armor unless the armor is made to accommodate them, and clothing not made to accommodate your wings might be destroyed when you manifest them.
    mechanics: null
  - id: srd51.feature.draconic-bloodline.elemental-affinity
    owner: draconic-bloodline
    ownerType: subclass
    level: 6
    name: Elemental Affinity
    text: Starting at 6th level, when you cast a spell that deals damage of the type associated with your draconic ancestry, you can add your Charisma modifier to one damage roll of that spell. At the same time, you can spend 1 sorcery point to gain resistance to that damage type for 1 hour.
    mechanics: null
