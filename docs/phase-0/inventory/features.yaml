# Classification skeleton: one record per feature, trait or benefit. Generated; the classified copy is classification.yaml.
records:
  - id: srd51.feature.barbarian.ability-score-improvement
    owner: barbarian
    ownerType: class
    level: 4
    name: Ability Score Improvement
    text: When you reach 4th level, and again at 8th, 12th, 16th, and 19th level, you can increase one ability score of your choice by 2, or you can increase two ability scores of your choice by 1. As normal, you can’t increase an ability score above 20 using this feature.
    mechanics: null
  - id: srd51.feature.barbarian.brutal-critical
    owner: barbarian
    ownerType: class
    level: 9
    name: Brutal Critical
    table: 9 → 1 dice; 13 → 2 dice; 17 → 3 dice
    text: |-
      Beginning at 9th level, you can roll one additional weapon damage die when determining the extra damage for a critical hit with a melee attack.

      This increases to two additional dice at 13th level and three additional dice at 17th level.
    mechanics: null
  - id: srd51.feature.barbarian.danger-sense
    owner: barbarian
    ownerType: class
    level: 2
    name: Danger Sense
    text: |-
      At 2nd level, you gain an uncanny sense of when things nearby aren’t as they should be, giving you an edge when you dodge away from danger.

      You have advantage on Dexterity saving throws against effects that you can see, such as traps and spells. To gain this benefit, you can’t be blinded, deafened, or incapacitated.
    mechanics: null
  - id: srd51.feature.barbarian.equipment
    owner: barbarian
    ownerType: class
    level: null
    name: Equipment
    text: |-
      You start with the following equipment, in addition to the equipment granted by your background:
      * (*a*) a greataxe or (*b*) any martial melee weapon
      * (*a*) two handaxes or (*b*) any simple weapon
      * An explorer’s pack and four javelins
    mechanics: null
  - id: srd51.feature.barbarian.extra-attack
    owner: barbarian
    ownerType: class
    level: 5
    name: Extra Attack
    text: Beginning at 5th level, you can attack twice, instead of once, whenever you take the Attack action on your turn.
    mechanics: null
  - id: srd51.feature.barbarian.fast-movement
    owner: barbarian
    ownerType: class
    level: 5
    name: Fast Movement
    text: Starting at 5th level, your speed increases by 10 feet while you aren’t wearing heavy armor.
    mechanics: null
  - id: srd51.feature.barbarian.feral-instinct
    owner: barbarian
    ownerType: class
    level: 7
    name: Feral Instinct
    text: |-
      By 7th level, your instincts are so honed that you have advantage on initiative rolls.

      Additionally, if you are surprised at the beginning of combat and aren’t incapacitated, you can act normally on your first turn, but only if you enter your rage before doing anything else on that turn.
    mechanics: null
  - id: srd51.feature.barbarian.indomitable-might
    owner: barbarian
    ownerType: class
    level: 18
    name: Indomitable Might
    text: Beginning at 18th level, if your total for a Strength check is less than your Strength score, you can use that score in place of the total.
    mechanics: null
  - id: srd51.feature.barbarian.persistent-rage
    owner: barbarian
    ownerType: class
    level: 15
    name: Persistent Rage
    text: Beginning at 15th level, your rage is so fierce that it ends early only if you fall unconscious or if you choose to end it.
    mechanics: null
  - id: srd51.feature.barbarian.primal-champion
