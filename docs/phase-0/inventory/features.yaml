    table: 1 → 3; 2 → 3; 3 → 3; 4 → 4; 5 → 4; 6 → 4; 7 → 4; 8 → 4; 9 → 4; 10 → 5; 11 → 5; 12 → 5; 13 → 5; 14 → 5; 15 → 5; 16 → 5; 17 → 5; 18 → 5; 19 → 5; 20 → 5
