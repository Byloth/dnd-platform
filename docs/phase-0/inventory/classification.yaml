      - roll-advantage
      - play-mode
    activation: free
    confidence: medium
    note: "A declared choice on the first attack of the turn: advantage on Str melee attack rolls for the turn (when the reckless state is active) while attacks against you have advantage, which is a state on the character resolved in play rather than a roll-disadvantage on own rolls."
  - id: srd51.feature.barbarian.relentless-rage
    owner: barbarian
    ownerType: class
    level: 11
    name: Relentless Rage
    text: |-
      Starting at 11th level, your rage can keep you fighting despite grievous wounds. If you drop to 0 hit points while you’re raging and don’t die outright, you can make a DC 10 Constitution saving throw. If you succeed, you drop to 1 hit point instead.

      Each time you use this feature after the first, the DC increases by 5. When you finish a short or long rest, the DC resets to 10.
    mechanics:
      - play-mode
      - declare-resource
    resource: relentless-rage
    confidence: medium
    note: Triggered when dropping to 0 HP while raging; the escalating DC (10 + 5 per use since the last rest) is tracked as a counter resource with short-rest recharge.
