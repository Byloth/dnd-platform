      - declare-resource
      - add-action
      - play-mode
    resource: channel-divinity
    activation: action
    confidence: high
    note: Pool max from the table (1/2/3), short-rest recharge; Turn Undead is an action costing 1 use with a save against spell.dc, resolved in play mode; domain options add further actions on the same pool.
