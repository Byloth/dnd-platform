id: srd51.spell.silence
name:
  en: Silence
source: srd51
level: 2
school: illusion
castingTime:
  activation: action
range:
  type: point
  distance: 120
area:
  shape: sphere
  radius: 20
components:
  v: true
  s: true
  m: false
duration:
  type: timed
  minutes: 10
  concentration: true
ritual: true
text:
  en: |-
    For the duration, no sound can be created within or pass through a 20-foot-radius sphere centered on a point you choose within range. Any creature or object entirely inside the sphere is immune to thunder damage, and creatures are deafened while entirely inside it. Casting a spell that includes a verbal component is impossible there.
tags:
- area
- anti-caster
- stealth
effects:
- kind: defense
  defense: immunity
  to:
  - thunder
  note:
    en: While entirely inside the sphere.
- kind: add-text
  section: features
  text:
    en: Deafened while entirely inside; spells with verbal components cannot be cast inside.
