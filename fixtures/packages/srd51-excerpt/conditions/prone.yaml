id: srd51.condition.prone
name:
  en: Prone
source: srd51
text:
  en: |-
    * A prone creature’s only movement option is to crawl, unless it stands up and thereby ends the condition.
    * The creature has disadvantage on attack rolls.
    * An attack roll against the creature has advantage if the attacker is within 5 feet of the creature. Otherwise, the attack roll has disadvantage.
effects:
- kind: roll-disadvantage
  on:
    type: attack
- kind: add-text
  section: conditions
  text:
    en: Attacks against you have advantage within 5 feet, disadvantage otherwise; crawling only.
  note:
    en: Rolls made against you are not modelled by the engine; shown as a reminder.
