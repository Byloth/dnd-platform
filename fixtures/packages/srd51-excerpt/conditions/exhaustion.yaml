      op: mul
      value: 0.5
  3:
    text:
      en: Disadvantage on attack rolls and saving throws
    effects:
    - kind: roll-disadvantage
      on:
        type: attack
    - kind: roll-disadvantage
      on:
        type: save
  4:
    text:
