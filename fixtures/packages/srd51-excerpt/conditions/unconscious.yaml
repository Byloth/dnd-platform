id: srd51.condition.unconscious
name:
  en: Unconscious
source: srd51
text:
  en: |-
    * An unconscious creature is incapacitated (see the condition), can’t move or speak, and is unaware of its surroundings
    * The creature drops whatever it’s holding and falls prone.
    * The creature automatically fails Strength and Dexterity saving throws.
    * Attack rolls against the creature have advantage.
    * Any attack that hits the creature is a critical hit if the attacker is within 5 feet of the creature.
effects:
- kind: modify
  target: speed.walk
  op: set
  value: 0
- kind: modify
  target: speed.climb
  op: set
  value: 0
- kind: modify
  target: speed.fly
  op: set
  value: 0
- kind: modify
  target: speed.swim
  op: set
  value: 0
- kind: modify
  target: speed.burrow
  op: set
  value: 0
- kind: add-text
  section: conditions
  text:
    en: |-
      Incapacitated, prone, unaware; you automatically fail Strength and Dexterity saves; attacks against you have advantage and are critical hits within 5 feet.
  note:
    en: Rolls made against you are not modelled by the engine; shown as a reminder.
