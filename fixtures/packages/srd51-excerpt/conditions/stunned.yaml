id: srd51.condition.stunned
name:
  en: Stunned
source: srd51
text:
  en: |-
    * A stunned creature is incapacitated (see the condition), can’t move, and can speak only falteringly.
    * The creature automatically fails Strength and Dexterity saving throws.
    * Attack rolls against the creature have advantage.
effects:
- kind: modify
  target: speed.walk
  op: set
  value: 0
- kind: modify
  target: speed.climb
  op: set
  value: 0
- kind: modify
  target: speed.fly
  op: set
  value: 0
- kind: modify
  target: speed.swim
  op: set
  value: 0
- kind: modify
  target: speed.burrow
  op: set
  value: 0
- kind: add-text
  section: conditions
  text:
    en: |-
      Incapacitated; you automatically fail Strength and Dexterity saves; attacks against you have advantage.
  note:
    en: Rolls made against you are not modelled by the engine; shown as a reminder.
