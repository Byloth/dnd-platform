# Gold dragonborn Paladin 1 on the SRD 5.1 base package. No oath before level 3, no spellcasting before level 2.
# Scores: base str 15, dex 10, con 14, int 8, wis 12, cha 13; dragonborn +2 str → 17, +1 cha → 14.
# Modifiers floor((score - 10) / 2): str +3, dex 0, con +2, int -1, wis +1, cha +2. Proficiency bonus at 1: +2.
values:
  ability.str: 17          # 15 + 2 (Ability Score Increase, dragonborn)
  ability.dex: 10
  ability.con: 14
  ability.int: 8
  ability.wis: 12
  ability.cha: 14          # 13 + 1 (Ability Score Increase, dragonborn)
  proficiencyBonus: 2      # table proficiency-bonus, level 1
  hp.max: 12               # hitDie 10 + mod(con) 2
  ac: 18                   # chain mail 16 (no Dexterity) + shield 2
                           # ENGINE MISMATCH: got 16 (srd51.item.shield is `type: gear` with tag `shield`; the engine only recognises `type: shield` and adds no shield bonus)
  initiative: 0            # mod(dex)
  speed.walk: 30           # dragonborn
  attacks.perAction: 1
  save.wis: 3              # mod 1 + proficiency 2 (paladin saving throw)
  save.cha: 4              # mod 2 + 2
  save.str: 3              # mod 3, not proficient
  save.dex: 0
  save.con: 2
  save.int: -1
  skill.athletics: 5       # mod(str) 3 + 2 (chosen)
  skill.persuasion: 4      # mod(cha) 2 + 2 (chosen)
  skill.religion: -1       # mod(int) -1, not proficient
  skill.insight: 1         # mod(wis) 1, not proficient
  skill.perception: 1      # mod(wis) 1, not proficient
  passive.perception: 11   # 10 + skill.perception
provenance:
  hp.max: ["Level 1 (Paladin)"]
resources:
  divine-sense: { max: 3, recharge: [long-rest] }       # 1 + mod(cha) 2
  lay-on-hands: { max: 5, recharge: [long-rest] }       # 5 × paladin level 1
  breath-weapon: { max: 1, recharge: [short-rest, long-rest] }
actions:
  divine-sense: { activation: action, cost: { divine-sense: 1 } }
  lay-on-hands: { activation: action, cost: { lay-on-hands: 1 } }
  lay-on-hands-cure: { activation: action, cost: { lay-on-hands: 5 } }
  breath-weapon: { activation: action, cost: { breath-weapon: 1 } }
attacks:
  longsword: { toHit: 5, damage: "1d8 + 3", type: slashing }             # mod(str) 3 + proficiency 2 (martial)
  longsword-two-handed: { toHit: 5, damage: "1d10 + 3", type: slashing } # versatile
  unarmed-strike: { toHit: 5, damage: "4", type: bludgeoning }           # 1 + mod(str) 3
features:
  - srd51.feature.paladin.divine-sense
  - srd51.feature.paladin.lay-on-hands
  - srd51.feature.dragonborn.draconic-ancestry
  - srd51.feature.dragonborn.breath-weapon
  - srd51.feature.dragonborn.damage-resistance
choices:
  "srd51.class.paladin#skills": answered
  "srd51.feature.dragonborn.draconic-ancestry#draconic-ancestry": answered
proficiencies:
  - save:wis
  - save:cha
  - skill:athletics
  - skill:persuasion
  - armor:light
  - armor:medium
  - armor:heavy
  - armor:shield
  - weapon:simple
  - weapon:martial
  - language:common
  - language:draconic
sections:
  active: [core, abilities, saves, skills, combat, attacks, actions, resources, features]
  inactive: [senses, spellcasting, spells]              # dragonborn have no darkvision; spellcasting starts at 2
