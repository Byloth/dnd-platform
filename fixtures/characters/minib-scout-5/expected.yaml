# Scout 5 on the fictional ruleset B: proves the engine reads proficiency, hit points and rests from the base package.
# No species: the engine's default base walking speed is assumed to be 30 (ruleset B declares none).
# Scores: str 10, dex 16, con 14, int 10, wis 14, cha 8 → mods str 0, dex +3, con +2, int 0, wis +2, cha -1.
values:
  proficiencyBonus: 4      # minib.table.proficiency-bonus: 1 → 3, 5 → 4 (not the SRD's +3)
  hp.max: 40               # firstLevel "hitDie + mod(con) + 2" = 8 + 2 + 2 = 12; perLevel × 4 = 4 × (5 + 2) = 28
  ac: 13                   # 10 + mod(dex) 3, no armour
  attacks.perAction: 2     # Extra Attack at scout 5 (set 2)
  speed.walk: 35           # default 30 + Quick Step 5
  initiative: 3
  skill.perception: 4      # mod(wis) 2 + Keen Eye 2, not proficient
  skill.stealth: 7         # mod(dex) 3 + proficiency 4 (chosen)
  skill.athletics: 4       # mod(str) 0 + 4 (chosen)
  save.dex: 7              # mod 3 + 4 (scout saving throw)
  save.wis: 6              # mod 2 + 4
  save.con: 2              # not proficient
proficiencies:
  - skill:stealth
  - skill:athletics
  - save:dex
  - save:wis
  - armor:light
  - weapon:simple
sections:
  active: [core, abilities, saves, skills, combat, features]
  inactive: [resources, spellcasting]
warnings: [W_UNANSWERED_CHOICE]                       # scout-path (subclass) not chosen
