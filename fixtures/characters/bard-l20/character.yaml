    # (the half-elf's +1 DEX +1 CON are the answer to its ability choice)
    bonuses: { dex: 5, con: 2, cha: 3 }
  answers:
    "srd51.feature.half-elf.ability-score-increase#ability-scores": [dex, con]
    "srd51.class.bard#skills": [performance, persuasion, deception]
    "srd51.class.bard#tools": [lute, flute, drum]
    "srd51.feature.half-elf.skill-versatility#skill": [insight, perception]
