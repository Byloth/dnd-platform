# Half-elf Warlock 3 (The Fiend) / Sorcerer 2 (Draconic Bloodline), character level 5.
# Scores: STR 8, DEX 15 (14 + 1 bonus), CON 15 (14 + 1 bonus), INT 10, WIS 12, CHA 17 (15 + 2 half-elf).
# Modifiers: str -1, dex +2, con +2, int 0, wis +1, cha +3. Proficiency bonus at 5: +3.
values:
  ability.cha: 17            # 15 + 2 (half-elf)
  ability.dex: 15            # 14 + 1 (bonus of choice)
  ability.con: 15            # 14 + 1 (bonus of choice)
  mod.cha: 3
  proficiencyBonus: 3
  hp.max: 38                 # warlock level 1: 8 + CON 2 = 10; warlock levels 2-3: 2 × (5 + 2) = 14; sorcerer levels 1-2: 2 × (4 + 2) = 12; Draconic Resilience +1 × 2 sorcerer levels = 2
  ac: 15                     # Draconic Resilience: 13 + DEX 2 (no armour)
  initiative: 2
  speed.walk: 30
  sense.darkvision: 120      # half-elf 60, Devil's Sight (op max 120)
  save.wis: 4                # 1 + 3, proficient (warlock, first class)
  save.cha: 6                # 3 + 3, proficient (warlock, first class)
  save.con: 2                # CON save of the sorcerer is NOT gained by multiclassing (SRD: saving throw proficiencies come from the first class only)
                             # ENGINE MISMATCH: got 5 (the engine grants the saving throws of every class listed)
  save.dex: 2                # not proficient
  skill.arcana: 3            # INT 0 + 3
  skill.deception: 6         # CHA 3 + 3
  skill.persuasion: 6        # CHA 3 + 3 (Skill Versatility)
  skill.insight: 4           # WIS 1 + 3 (Skill Versatility)
  skill.intimidation: 3      # CHA 3, not proficient
spellcasting:
  srd51.class.warlock:
    dc: 14                   # 8 + 3 + CHA 3
    attackBonus: 6           # 3 + 3
    cantripsKnown: 2         # warlock cantrips-known table, class level 3 → row 1
    spellsKnown: 4           # warlock spells-known table, row 3
    # Pact Magic: pact-slots table row 3 = [2, 2] → `pact: { slots: 2, level: 2 }` (two 2nd-level slots, regained on a short rest).
    # The runner compares only `slots`; a pact caster has no regular slot levels, so every level reads 0.
    slots: { 1: 0, 2: 0 }
  srd51.class.sorcerer:
    dc: 14                   # 8 + 3 + CHA 3
    attackBonus: 6           # 3 + 3
    cantripsKnown: 4         # sorcerer cantrips-known table, class level 2 → row 1
    spellsKnown: 3           # sorcerer spells-known table, row 2
    # multiclass table, caster level = warlock 3 × 0 (pact magic does not count) + sorcerer 2 × 1 = 2 → row 2: 3 / 0
    slots: { 1: 3, 2: 0 }
spells:
  srd51.spell.eldritch-blast: free    # warlock cantrip
  srd51.spell.fire-bolt: free         # sorcerer cantrip
  srd51.spell.hellish-rebuke: slot    # warlock known spell
  srd51.spell.scorching-ray: slot     # Fiend expanded list
  srd51.spell.mage-armor: slot        # Armor of Shadows invocation (always prepared)
  srd51.spell.magic-missile: slot     # sorcerer known spell
resources:
  sorcery-points: { max: 2, recharge: [long-rest] }   # table(sorcerer.sorcery-points) row 2 → 2 at sorcerer 2
actions:
  create-spell-slot: { activation: bonus-action }      # Font of Magic
  convert-spell-slot: { activation: bonus-action }     # Font of Magic
  dark-ones-blessing: { activation: free }             # The Fiend
  create-pact-weapon: { activation: action }           # Pact of the Blade
features:
  - srd51.feature.warlock.pact-magic
  - srd51.feature.sorcerer.spellcasting
  - srd51.feature.sorcerer.font-of-magic
  - srd51.feature.draconic-bloodline.draconic-resilience
  - srd51.feature.the-fiend.dark-ones-blessing
  - srd51.feature.half-elf.fey-ancestry
choices:
  "srd51.class.warlock#otherworldly-patron": answered
  "srd51.class.sorcerer#sorcerous-origin": answered
  "srd51.feature.warlock.eldritch-invocations#eldritch-invocations": answered
  "srd51.feature.warlock.pact-boon#pact-boon": answered
  "srd51.feature.draconic-bloodline.dragon-ancestor#dragon-ancestor": answered
  "srd51.feature.half-elf.skill-versatility#skill": answered
proficiencies:
  - save:wis
  - save:cha
  - skill:arcana
  - skill:deception
  - skill:persuasion
  - skill:insight
  - armor:light
  - weapon:simple
  - language:common
  - language:elvish
  - language:infernal
  - language:draconic         # Dragon Ancestor
sections:
  active: [spellcasting, spells, resources, actions, senses, features]
