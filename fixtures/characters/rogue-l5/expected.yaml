  - srd51.feature.rogue.cunning-action
  - srd51.feature.rogue.roguish-archetype
  - srd51.feature.rogue.uncanny-dodge
  - srd51.feature.thief.fast-hands
  - srd51.feature.thief.second-story-work
  - srd51.feature.gnome.darkvision
choices:
