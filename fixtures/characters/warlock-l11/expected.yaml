# Human Warlock 11 (The Fiend, Pact of the Blade). Base str 9, dex 13, con 13, int 10, wis 11, cha 15; human +1 all;
# ASI 4 +2 CHA, ASI 8 +2 CHA → str 10, dex 14, con 14, int 11, wis 12, cha 20. Modifiers: 0, +2, +2, 0, +1, +5.
# Proficiency bonus at level 11: +4.
values:
  ability.cha: 20               # 15 + 1 (human) + 2 (ASI 4) + 2 (ASI 8)
  proficiencyBonus: 4
  hp.max: 80                    # level 1: 8 + 2 = 10; levels 2-11: 10 × (5 + 2) = 70
  ac: 13                        # leather 11 + DEX 2
  initiative: 2
  sense.darkvision: 120         # Devil's Sight
  attacks.perAction: 2          # Thirsting Blade
  save.wis: 5                   # 1 + 4
  save.cha: 9                   # 5 + 4
  skill.arcana: 4               # INT 0 + 4
  skill.deception: 9            # CHA 5 + 4
  passive.perception: 11
spellcasting:
  # Pact Magic row 11: 3 slots of 5th level → snapshot pact: { slots: 3, level: 5 }
  srd51.class.warlock:
    dc: 17                      # 8 + 4 + 5
    attackBonus: 9              # 4 + 5
    cantripsKnown: 4            # table row 10
    spellsKnown: 11             # table row 11
spells:
  srd51.spell.eldritch-blast: free
  srd51.spell.wall-of-fire: slot
  srd51.spell.false-life: slot  # Fiendish Vigor: always prepared, cast at 1st level with a slot (at will in the SRD, no cost modelled)
  srd51.spell.slow: uses:1      # Mire the Mind: once per long rest
resources:
  dark-ones-own-luck: { max: 1, recharge: [short-rest, long-rest] }   # level 6
  mystic-arcanum-6: { max: 1, recharge: [long-rest] }                 # table(warlock.mystic-arcanum-level-6) row 11
actions:
  dark-ones-blessing: { activation: free }
  create-pact-weapon: { activation: action }
  dark-ones-own-luck: { activation: free, cost: { dark-ones-own-luck: 1 } }
attacks:
  dagger: { toHit: 6, damage: "1d4 + 2", type: piercing }   # DEX 2 + 4
features:
  - srd51.feature.warlock.eldritch-invocations
  - srd51.feature.warlock.pact-boon
  - srd51.feature.warlock.mystic-arcanum
  - srd51.feature.the-fiend.dark-ones-blessing
  - srd51.feature.the-fiend.dark-ones-own-luck
  - srd51.feature.the-fiend.fiendish-resilience
choices:
  "srd51.class.warlock#asi-4": answered
  "srd51.class.warlock#asi-8": answered
  "srd51.feature.warlock.eldritch-invocations#eldritch-invocations": answered
  "srd51.feature.warlock.pact-boon#pact-boon": answered
  "srd51.feature.the-fiend.fiendish-resilience#fiendish-resilience": answered
  "srd51.feature.warlock.mystic-arcanum#mystic-arcanum-6": answered
  # By the SRD the 7th/8th/9th-level arcana are not offered before levels 13/15/17, so no choice should be pending
  # and no W_UNANSWERED_CHOICE expected. ENGINE MISMATCH: the engine ignores the `level:` of those open-choice
  # effects and registers mystic-arcanum-7/8/9 (unanswered) at 11. Absence of a choice cannot be asserted here.
sections:
  active: [senses, attacks, actions, resources, spellcasting, spells, features]
