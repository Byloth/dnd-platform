  ability.wis: 18          # 15 + 1 (hill dwarf) + 2 (ASI 4)
  ability.cha: 12
  mod.wis: 4
  proficiencyBonus: 3
  hp.max: 43               # level 1: 8 + 2 = 10; levels 2-5: 4 × (average(d8) 5 + 2) = 28; Dwarven Toughness 1 × 5 = 5
  ac: 18                   # chain mail 16 (no DEX) + shield 2  # ENGINE MISMATCH: got 16 (srd51.item.shield is type gear, the engine adds no shield bonus)
