# Hill dwarf Cleric 5, Life Domain, acolyte. Base str 14, dex 10, con 13, int 10, wis 15, cha 12; dwarf +2 CON, hill dwarf +1 WIS;
# ASI 4 +2 WIS → STR 14, DEX 10, CON 15, INT 10, WIS 18, CHA 12. Modifiers: str +2, dex 0, con +2, int 0, wis +4, cha +1.
# Proficiency bonus +3. Chain mail (heavy, Life Domain proficiency; STR 14 ≥ 13) and a shield; a dwarf's speed is not
# reduced by heavy armour.
values:
