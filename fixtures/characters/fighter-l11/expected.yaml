# Human Fighter 11 (Champion; Defense + Archery styles) in chain mail with shield, longsword and longbow.
# Scores: base + human 1 + ASIs (4 STR, 6 STR, 8 CON): STR 20, DEX 14, CON 17, INT 10, WIS 12, CHA 10.
# Modifiers: STR +5, DEX +2, CON +3, INT 0, WIS +1, CHA 0. Proficiency bonus at level 11: +4.
# Remarkable Athlete (Champion 7): ceil(4 / 2) = +2 on STR/DEX/CON checks not already proficient, and on initiative.
values:
  ability.str: 20            # 15 + 1 + 4
  ability.con: 17            # 14 + 1 + 2
  proficiencyBonus: 4        # level 11
  hp.max: 103                # level 1: 10 + 3 = 13; levels 2-11: 10 × (6 + 3) = 90
  ac: 19                     # chain mail 16 (no DEX) + shield 2 + Defense 1 (wearing armour). ENGINE MISMATCH: got 17 (srd51.item.shield is type gear/tag shield, the engine only reads type shield and adds no shield AC)
  initiative: 4              # DEX 2 + Remarkable Athlete 2
  check.str: 7               # STR 5 + Remarkable Athlete 2
  jump.long: 25              # STR score 20 + Remarkable Athlete STR modifier 5
  attacks.perAction: 3       # 1 + table(fighter.extra-attacks) row 11 = 2
  save.str: 9                # 5 + 4
  save.con: 7                # 3 + 4
  save.dex: 2
  save.wis: 1
  skill.athletics: 9         # STR 5 + 4 (proficient: Remarkable Athlete does not stack)
  skill.perception: 5        # WIS 1 + 4
  skill.acrobatics: 4        # DEX 2 + Remarkable Athlete 2 (not proficient)
  skill.stealth: 4           # DEX 2 + 2
  skill.sleight-of-hand: 4   # DEX 2 + 2
  skill.survival: 1          # WIS: Remarkable Athlete does not apply
  passive.perception: 15     # 10 + 5
resources:
  second-wind: { max: 1, recharge: [short-rest, long-rest] }
  action-surge: { max: 1, recharge: [short-rest, long-rest] }  # row 2 = 1 (2 only from 17)
  indomitable: { max: 1, recharge: [long-rest] }               # table(fighter.indomitable-uses) row 9 = 1
actions:
  second-wind: { activation: bonus-action, cost: { second-wind: 1 } }
  action-surge: { activation: free, cost: { action-surge: 1 } }
  indomitable: { activation: free, cost: { indomitable: 1 } }
attacks:
  longsword: { toHit: 9, damage: "1d8 + 5", type: slashing }             # STR 5 + prof 4
  longsword-two-handed: { toHit: 9, damage: "1d10 + 5", type: slashing }
  longbow: { toHit: 8, damage: "1d8 + 2", type: piercing }               # DEX 2 + prof 4 + Archery 2; 1d8 + DEX 2
  unarmed-strike: { toHit: 9, damage: "6", type: bludgeoning }           # 1 + STR 5
features:
  - srd51.feature.fighter.extra-attack
  - srd51.feature.fighter.indomitable
  - srd51.feature.champion.improved-critical
  - srd51.feature.champion.remarkable-athlete
  - srd51.feature.champion.additional-fighting-style
choices:
  "srd51.class.fighter#asi-4": answered
  "srd51.class.fighter#asi-6": answered
  "srd51.class.fighter#asi-8": answered
  "srd51.feature.champion.additional-fighting-style#additional-fighting-style": answered
  "srd51.class.fighter#martial-archetype": answered
proficiencies: [save:str, save:con, skill:athletics, skill:perception, armor:heavy, weapon:martial]
sections:
  active: [core, abilities, saves, skills, combat, attacks, actions, resources, features]
  inactive: [senses, spellcasting, spells]
warnings: []
