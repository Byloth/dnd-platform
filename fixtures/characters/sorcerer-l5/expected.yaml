# Tiefling Sorcerer 5 (Draconic Bloodline, red dragon). Base str 8, dex 14, con 14, int 11, wis 12, cha 15;
# tiefling +1 INT, +2 CHA; ASI at 4 +2 CHA → str 8, dex 14, con 14, int 12, wis 12, cha 19.
# Modifiers: str -1, dex +2, con +2, int +1, wis +1, cha +4. Proficiency bonus at level 5: +3.
values:
  ability.str: 8
  ability.dex: 14
  ability.con: 14
  ability.int: 12               # 11 + 1 (tiefling)
  ability.wis: 12
  ability.cha: 19               # 15 + 2 (tiefling) + 2 (ASI 4)
  proficiencyBonus: 3
  hp.max: 37                    # level 1: 6 + 2 = 8; levels 2-5: 4 × (4 + 2) = 24; Draconic Resilience +1 × 5 = 5
  ac: 15                        # Draconic Resilience, no armour: 13 + DEX 2
  initiative: 2
  speed.walk: 30
  sense.darkvision: 60
  save.con: 5                   # 2 + 3
  save.cha: 7                   # 4 + 3
  save.wis: 1                   # not proficient
  skill.arcana: 4               # INT 1 + 3
  skill.persuasion: 7           # CHA 4 + 3
  skill.perception: 1
  passive.perception: 11
spellcasting:
  srd51.class.sorcerer:
    dc: 15                      # 8 + 3 + 4
    attackBonus: 7              # 3 + 4
    slots: { 1: 4, 2: 3, 3: 2 } # full-caster table, level 5
    cantripsKnown: 5            # table row 4
    spellsKnown: 6              # table row 5
spells:
  srd51.spell.fire-bolt: free
  srd51.spell.fireball: slot
  srd51.spell.thaumaturgy: free
  srd51.spell.hellish-rebuke: uses:1   # Infernal Legacy from level 3 (once per long rest)
  srd51.spell.darkness: uses:1         # Infernal Legacy from level 5
resources:
  sorcery-points: { max: 5, recharge: [long-rest] }   # table(sorcerer.sorcery-points) row 5
actions:
  create-spell-slot: { activation: bonus-action }
  convert-spell-slot: { activation: bonus-action }
  quickened-spell: { activation: free, cost: { sorcery-points: 2 } }
  twinned-spell: { activation: free, cost: {} }         # cost equals the spell level, deducted by hand
attacks:
  dagger: { toHit: 5, damage: "1d4 + 2", type: piercing }   # DEX 2 + 3
features:
  - srd51.feature.sorcerer.font-of-magic
  - srd51.feature.sorcerer.metamagic
  - srd51.feature.draconic-bloodline.draconic-resilience
  - srd51.feature.draconic-bloodline.dragon-ancestor
  - srd51.feature.tiefling.infernal-legacy
choices:
  "srd51.class.sorcerer#sorcerous-origin": answered
  "srd51.class.sorcerer#cantrips": answered
  "srd51.class.sorcerer#spells": answered
  "srd51.class.sorcerer#asi-4": answered
  "srd51.feature.sorcerer.metamagic#metamagic": answered
  "srd51.feature.draconic-bloodline.dragon-ancestor#dragon-ancestor": answered
proficiencies: [save:con, save:cha, skill:arcana, skill:persuasion, weapon:dagger, language:draconic]
sections:
  active: [core, abilities, saves, skills, senses, combat, attacks, actions, resources, spellcasting, spells, features]
