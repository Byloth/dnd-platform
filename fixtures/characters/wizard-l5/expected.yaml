  - srd51.feature.rock-gnome.tinker
choices:
  "srd51.class.wizard#arcane-tradition": answered
  "srd51.class.wizard#cantrips": answered
  "srd51.class.wizard#spells": answered
  "srd51.class.wizard#asi-4": answered
proficiencies: [save:int, save:wis, skill:arcana, skill:investigation, weapon:quarterstaff, tool:tinkers-tools]
sections:
