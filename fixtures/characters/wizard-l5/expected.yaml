  ability.con: 14
  proficiencyBonus: 3
  hp.max: 32                    # level 1: 6 + 2 = 8; levels 2-5: 4 × (4 + 2) = 24
  ac: 12                        # 10 + DEX 2
  initiative: 2
  speed.walk: 25
  sense.darkvision: 60
  save.int: 7                   # 4 + 3
  save.wis: 4                   # 1 + 3
