# High elf Druid 5 (Circle of the Land, forest) in leather armour with a scimitar.
# Scores: base + elf/high elf + ASI 4 (WIS +2): STR 8, DEX 16, CON 14, INT 12, WIS 18, CHA 10.
# Modifiers: STR -1, DEX +3, CON +2, INT +1, WIS +4, CHA 0. Proficiency bonus at level 5: +3.
values:
  ability.wis: 18            # 16 + 2 (ASI 4)
  proficiencyBonus: 3
  hp.max: 38                 # level 1: 8 + 2 = 10; levels 2-5: 4 × (average(d8) 5 + 2) = 28
  ac: 14                     # leather 11 + DEX 3
  initiative: 3
  speed.walk: 30
  sense.darkvision: 60
  save.int: 4                # 1 + 3
  save.wis: 7                # 4 + 3
  save.con: 2
  skill.nature: 4            # INT 1 + 3
  skill.survival: 7          # WIS 4 + 3
  skill.perception: 7        # WIS 4 + 3 (Keen Senses)
  skill.animal-handling: 4   # WIS 4, not proficient
  passive.perception: 17
spellcasting:
  srd51.class.druid:
    dc: 15                   # 8 + 3 + 4
    attackBonus: 7           # 3 + 4
    slots: { 1: 4, 2: 3, 3: 2 }   # full-caster table, level 5
    cantripsKnown: 3         # srd51.table.druid.cantrips-known row 4
spells:
  srd51.spell.druidcraft: free
  srd51.spell.shillelagh: free
  srd51.spell.guidance: free            # Bonus Cantrip (Circle of the Land). ENGINE MISMATCH: got absent (same open-choice of spell gap)
  srd51.spell.fire-bolt: free           # High Elf cantrip (wizard list, INT). ENGINE MISMATCH: got absent (an open-choice of spell answer is registered but never added to the spell list)
  srd51.spell.cure-wounds: slot
  srd51.spell.dispel-magic: slot
  srd51.spell.barkskin: slot            # Circle Spells, forest, druid 3: always prepared
  srd51.spell.spider-climb: slot
  srd51.spell.call-lightning: slot      # forest, druid 5
  srd51.spell.plant-growth: slot
resources:
  wild-shape: { max: 2, recharge: [short-rest, long-rest] }
  natural-recovery: { max: 1, recharge: [long-rest] }
actions:
  wild-shape: { activation: action, cost: { wild-shape: 1 } }
  wild-shape-revert: { activation: bonus-action }
  natural-recovery: { activation: special, cost: { natural-recovery: 1 } }
attacks:
  scimitar: { toHit: 6, damage: "1d6 + 3", type: slashing }   # DEX 3 + prof 3
