  primeval-awareness: { activation: action, cost: { spell-slot: 1 } }
  colossus-slayer: { activation: special }
  hide-in-plain-sight: { activation: special }
  volley: { activation: action }
  vanish: { activation: bonus-action }                            # 14th level
  foe-slayer: { activation: free }                                # 20th level
spellcasting:
  srd51.class.ranger:
    dc: 19                 # 8 + 6 + mod(wis) 5
    attackBonus: 11        # 6 + 5
    slots: { 1: 4, 2: 3, 3: 3, 4: 3, 5: 2 }   # half-caster table, ranger level 20
    spellsKnown: 11        # table ranger.spells-known, level 20 (19 → 11)
spells:
  srd51.spell.hunters-mark: slot
  srd51.spell.stoneskin: slot
  srd51.spell.tree-stride: slot
