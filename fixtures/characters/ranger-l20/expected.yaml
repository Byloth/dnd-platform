  - srd51.feature.ranger.vanish
  - srd51.feature.ranger.feral-senses
  - srd51.feature.ranger.foe-slayer
  - srd51.feature.hunter.hunters-prey
  - srd51.feature.hunter.defensive-tactics
  - srd51.feature.hunter.multiattack
