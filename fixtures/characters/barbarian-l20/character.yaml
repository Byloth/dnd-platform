  classes:
    - { class: srd51.class.barbarian, subclass: srd51.subclass.barbarian.path-of-the-berserker, levels: 20 }
  abilityScores:
    method: manual
    # half-orc: +2 STR, +1 CON generated from the species traits → STR 17, CON 15 before the ASIs
    base: { str: 15, dex: 14, con: 14, int: 8, wis: 10, cha: 12 }
    # ASI 4: +2 STR (19). ASI 8: +1 STR +1 CON (20, 16). ASI 12: +2 CON (18). ASI 16: +2 CON (20). ASI 19: +2 DEX (16).
    # Primal Champion (level 20) then adds +4 STR and +4 CON from the class feature (not recorded here).
    bonuses: { str: 3, con: 5, dex: 2 }
  answers:
    "srd51.class.barbarian#skills": [athletics, survival]
    "srd51.class.barbarian#primal-path": [srd51.subclass.barbarian.path-of-the-berserker]
    "srd51.class.barbarian#asi-4": [asi]
    "srd51.class.barbarian#asi-8": [asi]
    "srd51.class.barbarian#asi-12": [asi]
    "srd51.class.barbarian#asi-16": [asi]
    "srd51.class.barbarian#asi-19": [asi]
  equipment:
