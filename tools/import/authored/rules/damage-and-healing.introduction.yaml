id: srd51.rule.damage-and-healing.introduction
name:
  en: Damage and Healing
source: srd51
category: combat
text:
  en: Injury and the risk of death are constant companions of those who explore fantasy gaming worlds. The thrust of a sword, a well-placed arrow, or a blast of flame from a *fireball* spell all have the potential to damage, or even kill, the hardiest of creatures.
