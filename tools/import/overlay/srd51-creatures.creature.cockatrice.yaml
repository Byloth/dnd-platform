actions:
  - name:
      en: Bite
    text:
      en: "Melee Weapon Attack: +3 to hit, reach 5 ft., one creature. Hit: 3 (1d4 + 1) piercing damage, and the target must succeed on a DC 11 Constitution saving throw against being magically petrified. On a failed save, the creature begins to turn to stone and is restrained. It must repeat the saving throw at the end of its next turn. On a success, the effect ends. On a failure, the creature is petrified for 24 hours."
    attack:
      kind: melee
      source: weapon
      bonus: 3
      reach: 5
    damage:
      - dice: 1d4+1
        damageType: piercing
    save:
      ability: con
      dc: 11
