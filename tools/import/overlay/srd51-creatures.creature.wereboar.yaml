subtypes:
  - human
  - shapechanger
armorClass:
  - value: 10
speed:
  walk: 30
traits:
  - name:
      en: Shapechanger
    text:
      en: The wereboar can use its action to polymorph into a boar-humanoid hybrid or into a boar, or back into its true form, which is humanoid. Its statistics, other than its AC, are the same in each form. Any equipment it is wearing or carrying isn't transformed. It reverts to its true form if it dies.
  - name:
      en: Charge (Boar or Hybrid Form Only)
    text:
      en: If the wereboar moves at least 15 feet straight toward a target and then hits it with its tusks on the same turn, the target takes an extra 7 (2d6) slashing damage. If the target is a creature, it must succeed on a DC 13 Strength saving throw or be knocked prone.
    save:
      ability: str
      dc: 13
  - name:
      en: Relentless
    text:
      en: If the wereboar takes 14 damage or less that would reduce it to 0 hit points, it is reduced to 1 hit point instead.
    usage:
      rest: short
actions:
  - name:
      en: Multiattack (Humanoid or Hybrid Form Only)
    text:
      en: The wereboar makes two attacks, only one of which can be with its tusks.
    multiattack:
      - action:
          en: Maul (Humanoid or Hybrid Form Only)
        count: 2
  - name:
      en: Maul (Humanoid or Hybrid Form Only)
    text:
      en: "Melee Weapon Attack: +5 to hit, reach 5 ft., one target. Hit: 10 (2d6 + 3) bludgeoning damage."
    attack:
      kind: melee
      source: weapon
      bonus: 5
      reach: 5
    damage:
      - dice: 2d6+3
        damageType: bludgeoning
  - name:
      en: Tusks (Boar or Hybrid Form Only)
    text:
      en: "Melee Weapon Attack: +5 to hit, reach 5 ft., one target. Hit: 10 (2d6 + 3) slashing damage. If the target is a humanoid, it must succeed on a DC 12 Constitution saving throw or be cursed with wereboar lycanthropy."
    attack:
      kind: melee
      source: weapon
      bonus: 5
      reach: 5
    damage:
      - dice: 2d6+3
        damageType: slashing
    save:
      ability: con
      dc: 12
forms:
  - name:
      en: Human
  - name:
      en: Boar
    armorClass:
      - value: 11
        note:
          en: natural armor
    speed:
      walk: 40
  - name:
      en: Hybrid
    armorClass:
      - value: 11
        note:
          en: natural armor
languages:
  en: Common (can't speak in boar form)
