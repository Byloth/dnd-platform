traits:
  - name:
      en: Standing Leap
    text:
      en: The bulette's long jump is up to 30 ft. and its high jump is up to 15 ft., with or without a running start.
actions:
  - name:
      en: Bite
    text:
      en: "Melee Weapon Attack: +7 to hit, reach 5 ft., one target. Hit: 30 (4d12 + 4) piercing damage."
    attack:
      kind: melee
      source: weapon
      bonus: 7
      reach: 5
    damage:
      - dice: 4d12+4
        damageType: piercing
  - name:
      en: Deadly Leap
    text:
      en: If the bulette jumps at least 15 ft. as part of its movement, it can then use this action to land on its feet in a space that contains one or more other creatures. Each of those creatures must succeed on a DC 16 Strength or Dexterity saving throw (target's choice) or be knocked prone and take 14 (3d6 + 4) bludgeoning damage plus 14 (3d6 + 4) slashing damage. On a successful save, the creature takes only half the damage, isn't knocked prone, and is pushed 5 ft. out of the bulette's space into an unoccupied space of the creature's choice. If no unoccupied space is within range, the creature instead falls prone in the bulette's space.
    damage:
      - dice: 3d6+4
        damageType: bludgeoning
      - dice: 3d6+4
        damageType: slashing
