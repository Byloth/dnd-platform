resistances:
  - acid
  - fire
  - lightning
  - thunder
  - types:
      - bludgeoning
      - piercing
      - slashing
    note:
      en: from nonmagical attacks
traits:
  - name:
      en: Ethereal Sight
    text:
      en: The ghost can see 60 ft. into the Ethereal Plane when it is on the Material Plane, and vice versa.
  - name:
      en: Incorporeal Movement
    text:
      en: The ghost can move through other creatures and objects as if they were difficult terrain. It takes 5 (1d10) force damage if it ends its turn inside an object.
