effects:
  - kind: modify-attacks
    filter: { item: srd51.item.club }
    set:
      damageDie: "1d8"
      magical: true
    note: { en: "Only the club you were holding when you cast the spell; use your spellcasting ability instead of Strength for its melee attack and damage rolls. Ends if you cast it again or let go of the weapon." }
  - kind: modify-attacks
    filter: { item: srd51.item.quarterstaff }
    set:
      damageDie: "1d8"
      magical: true
    note: { en: "Only the quarterstaff you were holding when you cast the spell; use your spellcasting ability instead of Strength for its melee attack and damage rolls. Ends if you cast it again or let go of the weapon." }
