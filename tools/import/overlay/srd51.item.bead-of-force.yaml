onUse:
  - kind: note
    text: { en: "Throw the bead up to 60 feet as an action; it explodes on impact and is destroyed. Each creature within a 10-foot radius must succeed on a DC 15 Dexterity saving throw or take 5d4 force damage. A sphere of transparent force then encloses the area for 1 minute, trapping creatures that failed the save and are completely within it." }
