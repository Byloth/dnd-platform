# The SRD 5.1 wording: it names only the Thief (the upstream text is the PHB's, with archetypes not in the SRD).
text:
  en: At 3rd level, you choose an archetype that you emulate in the exercise of your rogue abilities, such as Thief. Your archetype choice grants you features at 3rd level and then again at 9th, 13th, and 17th level.
