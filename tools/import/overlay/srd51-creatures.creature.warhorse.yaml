traits:
  - name:
      en: Trampling Charge
    text:
      en: If the horse moves at least 20 ft. straight toward a creature and then hits it with a hooves attack on the same turn, that target must succeed on a DC 14 Strength saving throw or be knocked prone. If the target is prone, the horse can make another attack with its hooves against it as a bonus action.
    save:
      ability: str
      dc: 14
