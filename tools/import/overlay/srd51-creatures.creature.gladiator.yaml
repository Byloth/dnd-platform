traits:
  - name:
      en: Brave
    text:
      en: The gladiator has advantage on saving throws against being frightened.
  - name:
      en: Brute
    text:
      en: A melee weapon deals one extra die of its damage when the gladiator hits with it (included in the attack).
actions:
  - name:
      en: Multiattack
    text:
      en: The gladiator makes three melee attacks or two ranged attacks.
  - name:
      en: Spear
    text:
      en: "Melee or Ranged Weapon Attack: +7 to hit, reach 5 ft. or range 20/60 ft., one target. Hit: 11 (2d6 + 4) piercing damage, or 13 (2d8 + 4) piercing damage if used with two hands to make a melee attack."
    attack:
      kind: melee-or-ranged
      source: weapon
      bonus: 7
      reach: 5
      range:
        normal: 20
        long: 60
    damage:
      - dice: 2d6+4
        damageType: piercing
  - name:
      en: Shield Bash
    text:
      en: "Melee Weapon Attack: +7 to hit, reach 5 ft., one creature. Hit: 9 (2d4 + 4) bludgeoning damage. If the target is a Medium or smaller creature, it must succeed on a DC 15 Strength saving throw or be knocked prone."
    attack:
      kind: melee
      source: weapon
      bonus: 7
      reach: 5
    damage:
      - dice: 2d4+4
        damageType: bludgeoning
    save:
      ability: str
      dc: 15
