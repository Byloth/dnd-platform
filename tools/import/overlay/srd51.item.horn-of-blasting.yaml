features:
  - id: srd51.feature.item.horn-of-blasting.thunderous-blast
    name:
      en: "Thunderous Blast"
    text:
      en: "You can use an action to speak the horn's command word and then blow the horn, which emits a thunderous blast in a 30-foot cone that is audible 600 feet away. Each creature in the cone must make a DC 15 Constitution saving throw. On a failed save, a creature takes 5d6 thunder damage and is deafened for 1 minute. On a successful save, a creature takes half as much damage and isn't deafened. Creatures and objects made of glass or crystal have disadvantage on the saving throw and take 10d6 thunder damage instead of 5d6. Each use of the horn's magic has a 20 percent chance of causing the horn to explode. The explosion deals 10d6 fire damage to the blower and destroys the horn."
    effects:
      - kind: add-action
        action: blow-the-horn
        name:
          en: "Blow the Horn"
        activation: action
        dc: "15"
        rolls:
          - { type: save, ability: con, dc: "15" }
          - { type: damage, dice: 5d6, damageType: thunder, onSuccess: half }
        onUse:
          - kind: applyCondition
            condition: srd51.condition.deafened
            target: other
            expires: { minutes: 1 }
            note:
              en: "Each creature in a 30-foot cone that fails the DC 15 Constitution save is deafened for 1 minute; creatures and objects of glass or crystal save with disadvantage and take 10d6 thunder damage instead."
          - kind: note
            text:
              en: "Each use has a 20 percent chance of making the horn explode, dealing 10d6 fire damage to you and destroying the horn."
        text:
          en: "A thunderous blast in a 30-foot cone. DC 15 Constitution save, 5d6 thunder damage and deafened for 1 minute on a failure, half damage and not deafened on a success."
