attunement: true
features:
  - id: srd51.feature.item.ring-of-jumping.jump
    name:
      en: "Jump"
    text:
      en: "While wearing this ring, you can cast the jump spell from it as a bonus action at will, but can target only yourself when you do so."
    effects:
      - kind: grant-spells
        spells: [srd51.spell.jump]
        as: always-prepared
        note:
          en: "Cast at will as a bonus action, without a spell slot, targeting only yourself."
