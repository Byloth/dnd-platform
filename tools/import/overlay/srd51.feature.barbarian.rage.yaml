effects:
  - kind: declare-resource
    resource: rage
    name:
      en: Rages
    max: table(barbarian.rage-count)
    recharge:
      - on: long-rest
        amount: full
    display: pips
  - kind: add-action
    action: rage
    name:
      en: Rage
    activation: bonus-action
    cost:
      - resource: rage
        amount: 1
    duration:
      type: timed
      minutes: 1
    toggle:
      state: raging
      expires:
        minutes: 1
    text:
      en: "On your turn, you can enter a rage as a bonus action. Your rage lasts for 1 minute. It ends early if you are knocked unconscious or if your turn ends and you haven't attacked a hostile creature since your last turn or taken damage since then. You can also end your rage on your turn as a bonus action."
    onUse:
      - kind: note
        text:
          en: "While raging you can't cast spells or concentrate on them. The benefits apply only if you aren't wearing heavy armor. End the rage early on your turn as a bonus action by switching it off."
  - kind: roll-advantage
    on:
      type: check
      ability: str
    when:
      toggled: raging
      not:
        armorCategory: heavy
  - kind: roll-advantage
    on:
      type: save
      ability: str
    when:
      toggled: raging
      not:
        armorCategory: heavy
  - kind: modify
    target: damage.melee.bonus
    op: add
    formula: table(barbarian.rage-damage-bonus)
    when:
      toggled: raging
      not:
        armorCategory: heavy
    note:
      en: Only on melee weapon attacks made using Strength.
  - kind: defense
    defense: resistance
    to:
      - bludgeoning
      - piercing
      - slashing
    when:
      toggled: raging
      not:
        armorCategory: heavy
