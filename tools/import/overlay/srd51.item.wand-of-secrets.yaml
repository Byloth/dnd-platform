charges:
  max: 3
  recharge: [{ on: dawn, amount: "1d3" }]
features:
  - id: srd51.feature.item.wand-of-secrets.secrets
    name: { en: "Secrets" }
    effects:
      - kind: add-action
        action: find-secrets
        name: { en: "Find secrets" }
        activation: action
        cost: [{ resource: charges, amount: 1 }]
