  - kind: add-text
    section: features
    text:
      en: When you make an Intelligence or Wisdom check related to your favored terrain, your proficiency bonus is doubled if you are using a skill that you're proficient in.
    note:
      en: "Situational: the player asserts the check relates to the favored terrain; not a sheet expertise."
  - kind: add-text
    section: features
    text:
      en: "While traveling for an hour or more in your favored terrain: difficult terrain doesn't slow your group's travel; your group can't become lost except by magical means; even when engaged in another activity while traveling (such as foraging, navigating, or tracking) you remain alert to danger; if traveling alone you can move stealthily at a normal pace; when you forage you find twice as much food as you normally would; while tracking other creatures you also learn their exact number, their sizes, and how long ago they passed through the area."
    note:
      en: Travel benefits are narrative; no catalogue kind.
