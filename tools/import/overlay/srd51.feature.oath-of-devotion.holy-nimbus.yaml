effects:
  - kind: declare-resource
    resource: holy-nimbus
    name:
      en: Holy Nimbus
    max: 1
    recharge:
      - on: long-rest
        amount: full
    display: pips
  - kind: add-action
    action: holy-nimbus
    name:
      en: Holy Nimbus
    activation: action
    cost:
      - resource: holy-nimbus
        amount: 1
    range:
      type: self
      distance: 30
    duration:
      type: timed
      minutes: 1
    toggle:
      state: holy-nimbus
      expires:
        minutes: 1
    text:
      en: Emanate an aura of sunlight. For 1 minute, bright light shines from you in a 30-foot radius, and dim light shines 30 feet beyond that. Whenever an enemy creature starts its turn in the bright light, the creature takes 10 radiant damage. In addition, for the duration, you have advantage on saving throws against spells cast by fiends or undead.
    onUse:
      - kind: note
        text:
          en: For 1 minute, each enemy that starts its turn in the bright light (30-foot radius) takes 10 radiant damage.
  - kind: roll-advantage
    on:
      type: save
      against:
        - spells cast by fiends or undead
    when:
      toggled: holy-nimbus
