traits:
  - name:
      en: Inscrutable
    text:
      en: The sphinx is immune to any effect that would sense its emotions or read its thoughts, as well as any divination spell that it refuses. Wisdom (Insight) checks made to ascertain the sphinx's intentions or sincerity have disadvantage.
  - name:
      en: Magic Weapons
    text:
      en: The sphinx's weapon attacks are magical.
  - name:
      en: Spellcasting
    text:
      en: |-
        The sphinx is a 9th-level spellcaster. Its spellcasting ability is Intelligence (spell save DC 16, +8 to hit with spell attacks). It requires no material components to cast its spells. The sphinx has the following wizard spells prepared:

        - Cantrips (at will): mage hand, minor illusion, prestidigitation
        - 1st level (4 slots): detect magic, identify, shield
        - 2nd level (3 slots): darkness, locate object, suggestion
        - 3rd level (3 slots): dispel magic, remove curse, tongues
        - 4th level (3 slots): banishment, greater invisibility
        - 5th level (1 slot): legend lore
    spellcasting:
      ability: int
      dc: 16
      attack: 8
      casterLevel: 9
      slots:
        "1": 4
        "2": 3
        "3": 3
        "4": 3
        "5": 1
      spells:
        - spell: srd51.spell.mage-hand
        - spell: srd51.spell.minor-illusion
        - spell: srd51.spell.prestidigitation
        - spell: srd51.spell.detect-magic
        - spell: srd51.spell.identify
        - spell: srd51.spell.shield
        - spell: srd51.spell.darkness
        - spell: srd51.spell.locate-object
        - spell: srd51.spell.suggestion
        - spell: srd51.spell.dispel-magic
        - spell: srd51.spell.remove-curse
        - spell: srd51.spell.tongues
        - spell: srd51.spell.banishment
        - spell: srd51.spell.greater-invisibility
        - spell: srd51.spell.legend-lore
actions:
  - name:
      en: Multiattack
    text:
      en: The sphinx makes two claw attacks.
    multiattack:
      - action:
          en: Claw
        count: 2
  - name:
      en: Claw
    text:
      en: "Melee Weapon Attack: +8 to hit, reach 5 ft., one target. Hit: 13 (2d8 + 4) slashing damage."
    attack:
      kind: melee
      source: weapon
      bonus: 8
      reach: 5
    damage:
      - dice: 2d8+4
        damageType: slashing
resistances:
  - types:
      - bludgeoning
      - piercing
      - slashing
    note:
      en: from nonmagical attacks
