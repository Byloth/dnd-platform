attunement: { by: { en: "a spellcaster" } }
charges:
  max: 7
  recharge: [{ on: dawn, amount: "1d6 + 1" }]
features:
  - id: srd51.feature.item.wand-of-wonder.wonder
    name: { en: "Wonder" }
    effects:
      - kind: add-action
        action: wonder
        name: { en: "Wonder" }
        activation: action
        cost: [{ resource: charges, amount: 1 }]
        range: { type: point, distance: 120 }
        text: { en: "Choose a target within 120 feet: a creature, an object or a point in space. Roll d100 and consult the item's table to discover what happens. A spell cast from the wand has save DC 15, and a range expressed in feet becomes 120 feet if it isn't already; an area effect is centered on and includes the target; with multiple possible subjects, the GM randomly determines which are affected. If you expend the last charge, roll a d20: on a 1 the wand crumbles into dust and is destroyed." }
        onUse:
          - kind: note
            text: { en: "Roll d100 on the Wand of Wonder table (see the item's text): random spells such as slow, faerie fire, gust of wind, detect thoughts, stinking cloud, lightning bolt, darkness, fireball, invisibility or enlarge/reduce, or one of its other effects." }
