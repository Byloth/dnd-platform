actions:
  - name:
      en: Sting
    text:
      en: "Melee Weapon Attack: +2 to hit, reach 5 ft., one creature. Hit: 1 piercing damage, and the target must make a DC 9 Constitution saving throw, taking 4 (1d8) poison damage on a failed save, or half as much damage on a successful one."
    attack:
      kind: melee
      source: weapon
      bonus: 2
      reach: 5
    damage:
      - dice: 1
        damageType: piercing
      - dice: 1d8
        damageType: poison
    save:
      ability: con
      dc: 9
      onSuccess: half
