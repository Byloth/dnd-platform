onCast:
  - kind: heal
    amount: "1"
    target: other
    note: { en: "A creature dead no longer than 10 days, whose soul is willing and free, returns to life with 1 hit point; poisons and nonmagical diseases are neutralized. Undead can't be raised, and the spell fails if body parts integral to survival are missing." }
  - kind: note
    text: { en: "The target takes a -4 penalty to all attack rolls, saving throws and ability checks, reduced by 1 each time it finishes a long rest until it disappears." }
