legendary:
  actions:
    - name:
        en: Cantrip
      text:
        en: The lich casts a cantrip.
    - name:
        en: Paralyzing Touch (Costs 2 Actions)
      text:
        en: The lich uses its Paralyzing Touch.
      cost: 2
    - name:
        en: Frightening Gaze (Costs 2 Actions)
      text:
        en: The lich fixes its gaze on one creature it can see within 10 feet of it. The target must succeed on a DC 18 Wisdom saving throw against this magic or become frightened for 1 minute. The frightened target can repeat the saving throw at the end of each of its turns, ending the effect on itself on a success. If a target's saving throw is successful or the effect ends for it, the target is immune to the lich's gaze for the next 24 hours.
      cost: 2
      save:
        ability: wis
        dc: 18
    - name:
        en: Disrupt Life (Costs 3 Actions)
      text:
        en: Each non-undead creature within 20 feet of the lich must make a DC 18 Constitution saving throw against this magic, taking 21 (6d6) necrotic damage on a failed save, or half as much damage on a successful one.
      cost: 3
      damage:
        - dice: 6d6
          damageType: necrotic
      save:
        ability: con
        dc: 18
        onSuccess: half
