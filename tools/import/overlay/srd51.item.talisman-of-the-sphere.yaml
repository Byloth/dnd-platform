attunement: true
features:
  - id: srd51.feature.item.talisman-of-the-sphere.control
    name: { en: "Sphere Control" }
    effects:
      - kind: add-text
        section: skills
        text: { en: "When you make an Intelligence (Arcana) check to control a sphere of annihilation while holding this talisman, you double your proficiency bonus on the check." }
        note: { en: "A doubled proficiency bonus on one specific use of a skill has no target in v0; shown as text." }
      - kind: add-action
        action: levitate-sphere
        name: { en: "Levitate the sphere" }
        activation: action
        text: { en: "When you start your turn with control over a sphere of annihilation, levitate it 10 feet plus a number of additional feet equal to 10 x your Intelligence modifier." }
        onUse:
          - kind: note
            text: { en: "Levitate the sphere 10 + 10 x mod(int) feet." }
