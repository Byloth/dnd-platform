traits:
  - name:
      en: Charge
    text:
      en: If the unicorn moves at least 20 ft. straight toward a target and then hits it with a horn attack on the same turn, the target takes an extra 9 (2d8) piercing damage. If the target is a creature, it must succeed on a DC 15 Strength saving throw or be knocked prone.
    save:
      ability: str
      dc: 15
  - name:
      en: Innate Spellcasting
    text:
      en: |-
        The unicorn's innate spellcasting ability is Charisma (spell save DC 14). The unicorn can innately cast the following spells, requiring no components:

        At will: detect evil and good, druidcraft, pass without trace
        1/day each: calm emotions, dispel evil and good, entangle
    spellcasting:
      ability: cha
      dc: 14
      innate: true
      spells:
        - spell: srd51.spell.detect-evil-and-good
          atWill: true
        - spell: srd51.spell.druidcraft
          atWill: true
        - spell: srd51.spell.pass-without-trace
          atWill: true
        - spell: srd51.spell.calm-emotions
          perDay: 1
        - spell: srd51.spell.dispel-evil-and-good
          perDay: 1
        - spell: srd51.spell.entangle
          perDay: 1
  - name:
      en: Magic Resistance
    text:
      en: The unicorn has advantage on saving throws against spells and other magical effects.
  - name:
      en: Magic Weapons
    text:
      en: The unicorn's weapon attacks are magical.
legendary:
  text:
    en: The unicorn can take 3 legendary actions, choosing from the options below. Only one legendary action option can be used at a time and only at the end of another creature's turn. The unicorn regains spent legendary actions at the start of its turn.
