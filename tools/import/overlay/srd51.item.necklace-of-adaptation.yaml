attunement: true
features:
  - id: srd51.feature.item.necklace-of-adaptation.adaptation
    name:
      en: "Adaptation"
    text:
      en: "While wearing this necklace, you can breathe normally in any environment, and you have advantage on saving throws made against harmful gases and vapors (such as cloudkill and stinking cloud effects, inhaled poisons, and the breath weapons of some dragons)."
    effects:
      - kind: roll-advantage
        on: { type: save, against: [harmful gases and vapors] }
        note:
          en: "Cloudkill and stinking cloud effects, inhaled poisons, the breath weapons of some dragons. You can also breathe normally in any environment."
