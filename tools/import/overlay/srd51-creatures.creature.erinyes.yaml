resistances:
  - cold
  - types:
      - bludgeoning
      - piercing
      - slashing
    note:
      en: from nonmagical attacks that aren't silvered
traits:
  - name:
      en: Hellish Weapons
    text:
      en: The erinyes's weapon attacks are magical and deal an extra 13 (3d8) poison damage on a hit (included in the attacks).
  - name:
      en: Magic Resistance
    text:
      en: The erinyes has advantage on saving throws against spells and other magical effects.
actions:
  - name:
      en: Multiattack
    text:
      en: The erinyes makes three attacks
  - name:
      en: Longsword
    text:
      en: "Melee Weapon Attack: +8 to hit, reach 5 ft., one target. Hit: 8 (1d8 + 4) slashing damage, or 9 (1d10 + 4) slashing damage if used with two hands, plus 13 (3d8) poison damage."
    attack:
      kind: melee
      source: weapon
      bonus: 8
      reach: 5
    damage:
      - dice: 1d8+4
        damageType: slashing
      - dice: 3d8
        damageType: poison
  - name:
      en: Longbow
    text:
      en: "Ranged Weapon Attack: +7 to hit, range 150/600 ft., one target. Hit: 7 (1d8 + 3) piercing damage plus 13 (3d8) poison damage, and the target must succeed on a DC 14 Constitution saving throw or be poisoned. The poison lasts until it is removed by the lesser restoration spell or similar magic."
    attack:
      kind: ranged
      source: weapon
      bonus: 7
      range:
        normal: 150
        long: 600
    damage:
      - dice: 1d8+3
        damageType: piercing
      - dice: 3d8
        damageType: poison
    save:
      ability: con
      dc: 14
