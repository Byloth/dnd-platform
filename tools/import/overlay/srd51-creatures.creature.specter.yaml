actions:
  - name:
      en: Life Drain
    text:
      en: "Melee Spell Attack: +4 to hit, reach 5 ft., one creature. Hit: 10 (3d6) necrotic damage. The target must succeed on a DC 10 Constitution saving throw or its hit point maximum is reduced by an amount equal to the damage taken. This reduction lasts until the creature finishes a long rest. The target dies if this effect reduces its hit point maximum to 0."
    attack:
      kind: melee
      source: spell
      bonus: 4
      reach: 5
    damage:
      - dice: 3d6
        damageType: necrotic
    save:
      ability: con
      dc: 10
