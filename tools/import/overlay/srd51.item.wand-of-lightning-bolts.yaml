attunement: { by: { en: "a spellcaster" } }
charges:
  max: 7
  recharge: [{ on: dawn, amount: "1d6 + 1" }]
features:
  - id: srd51.feature.item.wand-of-lightning-bolts.lightning-bolt
    name: { en: "Lightning Bolt" }
    effects:
      - kind: grant-spells
        spells: [srd51.spell.lightning-bolt]
