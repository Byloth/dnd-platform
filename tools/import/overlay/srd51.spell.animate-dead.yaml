onCast:
  - kind: note
    text: { en: "Raises a skeleton (from bones) or a zombie (from a corpse) under your control for 24 hours; the DM has its statistics (no stat blocks in v0). On each of your turns you can use a bonus action to command creatures made with this spell within 60 feet. Casting the spell again reasserts control over up to four creatures instead; two additional creatures for each slot level above 3rd." }
