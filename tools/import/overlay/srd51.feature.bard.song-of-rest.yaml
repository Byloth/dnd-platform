onRest:
  - kind: heal
    amount: table(bard.song-of-rest-die)
    target: other
    note:
      en: "Short rest only: you or any friendly creatures who can hear your performance and regain hit points at the end of the rest by spending one or more Hit Dice each regain the extra hit points (1d6, 1d8 at 9th level, 1d10 at 13th, 1d12 at 17th)."
