traits:
  - name:
      en: Charge
    text:
      en: If the skeleton moves at least 10 feet straight toward a target and then hits it with a gore attack on the same turn, the target takes an extra 9 (2d8) piercing damage. If the target is a creature, it must succeed on a DC 14 Strength saving throw or be pushed up to 10 feet away and knocked prone.
    damage:
      - dice: 2d8
        damageType: piercing
    save:
      ability: str
      dc: 14
