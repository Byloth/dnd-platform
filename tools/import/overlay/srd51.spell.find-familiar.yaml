onCast:
  - kind: note
    text: { en: "The familiar takes the statistics of the chosen animal form (bat, cat, crab, frog, hawk, lizard, octopus, owl, poisonous snake, fish, rat, raven, sea horse, spider or weasel) as a celestial, fey or fiend; the DM has the statistics (no stat blocks in v0). It rolls its own initiative, can't attack, and disappears at 0 hit points until you cast the spell again. While it is within 100 feet you can communicate with it telepathically; as an action you can see through its eyes and hear what it hears until the start of your next turn (deaf and blind to your own senses meanwhile), temporarily dismiss it, or make it reappear within 30 feet of you. It can deliver a touch spell you cast by using its reaction while within 100 feet. Casting the spell while you have a familiar changes its form." }
