actions:
  - name:
      en: Multiattack
    text:
      en: "The dragon can use its Frightful Presence. It then makes three attacks: one with its bite and two with its claws."
    multiattack:
      - action:
          en: Frightful Presence
        count: 1
      - action:
          en: Bite
        count: 1
      - action:
          en: Claw
        count: 2
  - name:
      en: Bite
    text:
      en: "Melee Weapon Attack: +14 to hit, reach 10 ft., one target. Hit: 19 (2d10 + 8) piercing damage."
    attack:
      kind: melee
      source: weapon
      bonus: 14
      reach: 10
    damage:
      - dice: 2d10+8
        damageType: piercing
  - name:
      en: Claw
    text:
      en: "Melee Weapon Attack: +14 to hit, reach 5 ft., one target. Hit: 15 (2d6 + 8) slashing damage."
    attack:
      kind: melee
      source: weapon
      bonus: 14
      reach: 5
    damage:
      - dice: 2d6+8
        damageType: slashing
  - name:
      en: Tail
    text:
      en: "Melee Weapon Attack: +14 to hit, reach 15 ft., one target. Hit: 17 (2d8 + 8) bludgeoning damage."
    attack:
      kind: melee
      source: weapon
      bonus: 14
      reach: 15
    damage:
      - dice: 2d8+8
        damageType: bludgeoning
  - name:
      en: Frightful Presence
    text:
      en: Each creature of the dragon's choice that is within 120 feet of the dragon and aware of it must succeed on a DC 21 Wisdom saving throw or become frightened for 1 minute. A creature can repeat the saving throw at the end of each of its turns, ending the effect on itself on a success. If a creature's saving throw is successful or the effect ends for it, the creature is immune to the dragon's Frightful Presence for the next 24 hours.
    save:
      ability: wis
      dc: 21
  - name:
      en: Breath Weapons
    text:
      en: |-
        The dragon uses one of the following breath weapons.
        Fire Breath. The dragon exhales fire in a 60-foot cone. Each creature in that area must make a DC 21 Dexterity saving throw, taking 66 (12d10) fire damage on a failed save, or half as much damage on a successful one.
        Weakening Breath. The dragon exhales gas in a 60-foot cone. Each creature in that area must succeed on a DC 21 Strength saving throw or have disadvantage on Strength-based attack rolls, Strength checks, and Strength saving throws for 1 minute. A creature can repeat the saving throw at the end of each of its turns, ending the effect on itself on a success.
    usage:
      recharge: 5
  - name:
      en: Change Shape
    text:
      en: |-
        The dragon magically polymorphs into a humanoid or beast that has a challenge rating no higher than its own, or back into its true form. It reverts to its true form if it dies. Any equipment it is wearing or carrying is absorbed or borne by the new form (the dragon's choice).
        In a new form, the dragon retains its alignment, hit points, Hit Dice, ability to speak, proficiencies, Legendary Resistance, lair actions, and Intelligence, Wisdom, and Charisma scores, as well as this action. Its statistics and capabilities are otherwise replaced by those of the new form, except any class features or legendary actions of that form.
