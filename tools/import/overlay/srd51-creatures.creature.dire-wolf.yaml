traits:
  - name:
      en: Keen Hearing and Smell
    text:
      en: The wolf has advantage on Wisdom (Perception) checks that rely on hearing or smell.
  - name:
      en: Pack Tactics
    text:
      en: The wolf has advantage on an attack roll against a creature if at least one of the wolf's allies is within 5 ft. of the creature and the ally isn't incapacitated.
actions:
  - name:
      en: Bite
    text:
      en: "Melee Weapon Attack: +5 to hit, reach 5 ft., one target. Hit: 10 (2d6 + 3) piercing damage. If the target is a creature, it must succeed on a DC 13 Strength saving throw or be knocked prone."
    attack:
      kind: melee
      source: weapon
      bonus: 5
      reach: 5
    damage:
      - dice: 2d6+3
        damageType: piercing
    save:
      ability: str
      dc: 13
