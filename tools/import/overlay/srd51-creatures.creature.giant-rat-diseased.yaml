traits:
  - name:
      en: Keen Smell
    text:
      en: The rat has advantage on Wisdom (Perception) checks that rely on smell.
  - name:
      en: Pack Tactics
    text:
      en: The rat has advantage on an attack roll against a creature if at least one of the rat's allies is within 5 ft. of the creature and the ally isn't incapacitated.
actions:
  - name:
      en: Bite
    text:
      en: "Melee Weapon Attack: +4 to hit, reach 5 ft., one target. Hit: 4 (1d4 + 2) piercing damage. If the target is a creature, it must succeed on a DC 10 Constitution saving throw or contract a disease. Until the disease is cured, the target can't regain hit points except by magical means, and the target's hit point maximum decreases by 3 (1d6) every 24 hours. If the target's hit point maximum drops to 0 as a result of this disease, the target dies."
    attack:
      kind: melee
      source: weapon
      bonus: 4
      reach: 5
    damage:
      - dice: 1d4+2
        damageType: piercing
    save:
      ability: con
      dc: 10
