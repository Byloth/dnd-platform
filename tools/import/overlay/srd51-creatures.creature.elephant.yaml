traits:
  - name:
      en: Trampling Charge
    text:
      en: If the elephant moves at least 20 ft. straight toward a creature and then hits it with a gore attack on the same turn, that target must succeed on a DC 12 Strength saving throw or be knocked prone. If the target is prone, the elephant can make one stomp attack against it as a bonus action.
    save:
      ability: str
      dc: 12
