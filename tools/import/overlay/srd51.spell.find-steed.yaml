onCast:
  - kind: note
    text: { en: "The steed takes the statistics of the chosen form (warhorse, pony, camel, elk, mastiff or another the DM allows) as a celestial, fey or fiend, with an Intelligence of at least 6 and one language of your choice that you speak; the DM has the statistics (no stat blocks in v0). While mounted, any spell you cast that targets only you can also target the steed. It disappears at 0 hit points or when you dismiss it as an action; casting the spell again summons the same steed at its hit point maximum. While within 1 mile you can communicate telepathically." }
