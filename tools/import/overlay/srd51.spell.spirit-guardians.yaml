effects:
  - kind: add-text
    section: features
    text: { en: "Spirits flit around you to 15 feet. Any creature you didn't designate when casting has its speed halved in the area and, when it enters the area for the first time on a turn or starts its turn there, makes a Wisdom saving throw: 3d8 radiant damage (if you are good or neutral) or necrotic (if you are evil) on a failure, half on a success; +1d8 per slot level above 3rd." }
