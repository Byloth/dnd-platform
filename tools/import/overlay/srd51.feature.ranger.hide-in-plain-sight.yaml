effects:
  - kind: add-action
    action: hide-in-plain-sight
    name:
      en: Hide in Plain Sight
    activation: special
    duration:
      type: special
    toggle:
      state: hide-in-plain-sight
      expires:
        manual: true
    text:
      en: Spend 1 minute creating camouflage for yourself (you need fresh mud, dirt, plants, soot, and other naturally occurring materials). Once camouflaged, you can try to hide by pressing yourself up against a solid surface, such as a tree or wall, that is at least as tall and wide as you are. You gain a +10 bonus to Dexterity (Stealth) checks as long as you remain there without moving or taking actions. Once you move or take an action or a reaction, you must camouflage yourself again to gain this benefit.
    onUse:
      - kind: note
        text:
          en: Takes 1 minute. Switch the state off as soon as you move or take an action or a reaction.
  - kind: modify
    target: skill.stealth
    op: add
    value: 10
    when:
      toggled: hide-in-plain-sight
    note:
      en: Only while camouflaged and pressed against a solid surface without moving or taking actions.
