onCast:
  - kind: applyCondition
    condition: srd51.condition.frightened
    target: other
    expires: { minutes: 1 }
  - kind: note
    text: { en: "On a failed Wisdom save. At the end of each of its turns the target must succeed on a Wisdom saving throw or take 4d10 psychic damage (+1d10 per slot level above 4th); on a success the spell ends." }
text:
  en: You tap into the nightmares of a creature you can see within range and create an illusory manifestation of its deepest fears, visible only to that creature. The target must make a Wisdom saving throw. On a failed save, the target becomes frightened for the duration. At the end of each of the target's turns before the spell ends, the target must succeed on a Wisdom saving throw or take 4d10 psychic damage. On a successful save, the spell ends.
rolls:
  - { type: save, ability: wis, onSuccess: none }
  - { type: damage, dice: "4d10", damageType: psychic }
scaling: { by: slotLevel, from: 5, add: { dice: "1d10" } }
