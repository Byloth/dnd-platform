effects:
  - kind: add-action
    action: dominate-monster-control
    name: { en: "Dominate Monster: total control" }
    activation: action
    cost: []
    text: { en: "Take total and precise control of the charmed creature until the end of your next turn: it takes only the actions you choose; you can also make it use a reaction by using your own reaction." }
onCast:
  - kind: applyCondition
    condition: srd51.condition.charmed
    target: other
    expires: { hours: 1 }
    note: { en: "On a failed Wisdom saving throw (with advantage if you or your friends are fighting it). While charmed you have a telepathic link to issue commands (no action required); each time the target takes damage it repeats the save, ending the spell on a success. Duration: concentration up to 8 hours with a 9th-level slot." }
