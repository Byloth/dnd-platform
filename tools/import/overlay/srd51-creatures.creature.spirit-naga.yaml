actions:
  - name:
      en: Bite
    text:
      en: "Melee Weapon Attack: +7 to hit, reach 10 ft., one creature. Hit: 7 (1d6 + 4) piercing damage, and the target must make a DC 13 Constitution saving throw, taking 31 (7d8) poison damage on a failed save, or half as much damage on a successful one."
    attack:
      kind: melee
      source: weapon
      bonus: 7
      reach: 10
    damage:
      - dice: 1d6+4
        damageType: piercing
      - dice: 7d8
        damageType: poison
    save:
      ability: con
      dc: 13
      onSuccess: half
