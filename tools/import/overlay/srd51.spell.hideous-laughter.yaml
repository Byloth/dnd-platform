onCast:
  - kind: applyCondition
    condition: srd51.condition.prone
    target: other
    expires: { minutes: 1 }
  - kind: applyCondition
    condition: srd51.condition.incapacitated
    target: other
    expires: { minutes: 1 }
  - kind: note
    text: { en: "On a failed Wisdom save; the target is unable to stand up for the duration. A creature with an Intelligence score of 4 or less isn't affected. At the end of each of its turns, and each time it takes damage (with advantage), the target repeats the saving throw; on a success the spell ends." }
