effects:
  - kind: add-text
    section: features
    text: { en: "A Large spectral guardian hovers in the chosen space. Any creature hostile to you that moves to a space within 10 feet of it for the first time on a turn must make a Dexterity saving throw, taking 20 radiant damage on a failed save or half as much on a successful one. The guardian vanishes when it has dealt a total of 60 damage." }
onCast:
  - kind: note
    text: { en: "The guardian has no statistics; its damage is a flat 20 radiant (Dexterity saving throw for half)." }
