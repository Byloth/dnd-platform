traits:
  - name:
      en: Hold Breath
    text:
      en: The crocodile can hold its breath for 30 minutes.
actions:
  - name:
      en: Multiattack
    text:
      en: "The crocodile makes two attacks: one with its bite and one with its tail."
    multiattack:
      - action:
          en: Bite
        count: 1
      - action:
          en: Tail
        count: 1
  - name:
      en: Bite
    text:
      en: "Melee Weapon Attack: +8 to hit, reach 5 ft., one target. Hit: 21 (3d10 + 5) piercing damage, and the target is grappled (escape DC 16). Until this grapple ends, the target is restrained, and the crocodile can't bite another target."
    attack:
      kind: melee
      source: weapon
      bonus: 8
      reach: 5
    damage:
      - dice: 3d10+5
        damageType: piercing
  - name:
      en: Tail
    text:
      en: "Melee Weapon Attack: +8 to hit, reach 10 ft., one target not grappled by the crocodile. Hit: 14 (2d8 + 5) bludgeoning damage. If the target is a creature, it must succeed on a DC 16 Strength saving throw or be knocked prone."
    attack:
      kind: melee
      source: weapon
      bonus: 8
      reach: 10
    damage:
      - dice: 2d8+5
        damageType: bludgeoning
    save:
      ability: str
      dc: 16
