attunement: { by: { en: "a spellcaster" } }
features:
  - id: srd51.feature.item.wand-of-the-war-mage.war-mage
    name: { en: "War Mage" }
    effects:
      - kind: open-choice
        choice: variant
        of: option
        count: 1
        note: { en: "The bonus to spell attack rolls is determined by the wand's rarity." }
        options:
          - id: plus-1
            name: { en: "+1 (uncommon)" }
            effects:
              - { kind: modify, target: attack.spell.bonus, op: add, value: 1 }
          - id: plus-2
            name: { en: "+2 (rare)" }
            effects:
              - { kind: modify, target: attack.spell.bonus, op: add, value: 2 }
          - id: plus-3
            name: { en: "+3 (very rare)" }
            effects:
              - { kind: modify, target: attack.spell.bonus, op: add, value: 3 }
      - kind: add-text
        section: spellcasting
        text: { en: "You ignore half cover when making a spell attack." }
        note: { en: "Ignoring cover has no kind in v0; applied at the table." }
