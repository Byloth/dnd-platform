traits:
  - name:
      en: Spider Climb
    text:
      en: The ettercap can climb difficult surfaces, including upside down on ceilings, without needing to make an ability check.
  - name:
      en: Web Sense
    text:
      en: While in contact with a web, the ettercap knows the exact location of any other creature in contact with the same web.
  - name:
      en: Web Walker
    text:
      en: The ettercap ignores movement restrictions caused by webbing.
actions:
  - name:
      en: Multiattack
    text:
      en: "The ettercap makes two attacks: one with its bite and one with its claws."
    multiattack:
      - action:
          en: Bite
        count: 1
      - action:
          en: Claws
        count: 1
  - name:
      en: Bite
    text:
      en: "Melee Weapon Attack: +4 to hit, reach 5 ft., one creature. Hit: 6 (1d8 + 2) piercing damage plus 4 (1d8) poison damage. The target must succeed on a DC 11 Constitution saving throw or be poisoned for 1 minute. The creature can repeat the saving throw at the end of each of its turns, ending the effect on itself on a success."
    attack:
      kind: melee
      source: weapon
      bonus: 4
      reach: 5
    damage:
      - dice: 1d8+2
        damageType: piercing
      - dice: 1d8
        damageType: poison
    save:
      ability: con
      dc: 11
  - name:
      en: Claws
    text:
      en: "Melee Weapon Attack: +4 to hit, reach 5 ft., one target. Hit: 7 (2d4 + 2) slashing damage."
    attack:
      kind: melee
      source: weapon
      bonus: 4
      reach: 5
    damage:
      - dice: 2d4+2
        damageType: slashing
  - name:
      en: Web
    text:
      en: "Ranged Weapon Attack: +4 to hit, range 30/60 ft., one Large or smaller creature. Hit: The creature is restrained by webbing. As an action, the restrained creature can make a DC 11 Strength check, escaping from the webbing on a success. The effect also ends if the webbing is destroyed. The webbing has AC 10, 5 hit points, vulnerability to fire damage, and immunity to bludgeoning, poison, and psychic damage."
    usage:
      recharge: 5
    attack:
      kind: ranged
      source: weapon
      bonus: 4
      range:
        normal: 30
        long: 60
