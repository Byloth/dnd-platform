onCast:
  - kind: applyCondition
    condition: srd51.condition.frightened
    target: other
    expires: { minutes: 1 }
  - kind: note
    text: { en: "Each creature in the 30-foot-radius sphere, on a failed Wisdom save. At the end of each of its turns a frightened creature must succeed on a Wisdom saving throw or take 4d10 psychic damage; on a success the spell ends for it." }
text:
  en: Drawing on the deepest fears of a group of creatures, you create illusory creatures in their minds, visible only to them. Each creature in a 30-foot-radius sphere centered on a point of your choice within range must make a Wisdom saving throw. On a failed save, a creature becomes frightened for the duration. The illusion calls on the creature's deepest fears, manifesting its worst nightmares as an implacable threat. At the end of each of the frightened creature's turns, it must succeed on a Wisdom saving throw or take 4d10 psychic damage. On a successful save, the spell ends for that creature.
rolls:
  - { type: save, ability: wis, onSuccess: none }
  - { type: damage, dice: "4d10", damageType: psychic }
