resistances:
  - cold
  - lightning
  - types:
      - bludgeoning
      - piercing
      - slashing
    note:
      en: from nonmagical attacks
traits:
  - name:
      en: Death Throes
    text:
      en: When the balor dies, it explodes, and each creature within 30 feet of it must make a DC 20 Dexterity saving throw, taking 70 (20d6) fire damage on a failed save, or half as much damage on a successful one. The explosion ignites flammable objects in that area that aren't being worn or carried, and it destroys the balor's weapons.
    damage:
      - dice: 20d6
        damageType: fire
    save:
      ability: dex
      dc: 20
      onSuccess: half
  - name:
      en: Fire Aura
    text:
      en: At the start of each of the balor's turns, each creature within 5 feet of it takes 10 (3d6) fire damage, and flammable objects in the aura that aren't being worn or carried ignite. A creature that touches the balor or hits it with a melee attack while within 5 feet of it takes 10 (3d6) fire damage.
    damage:
      - dice: 3d6
        damageType: fire
  - name:
      en: Magic Resistance
    text:
      en: The balor has advantage on saving throws against spells and other magical effects.
  - name:
      en: Magic Weapons
    text:
      en: The balor's weapon attacks are magical.
actions:
  - name:
      en: Multiattack
    text:
      en: "The balor makes two attacks: one with its longsword and one with its whip."
    multiattack:
      - action:
          en: Longsword
        count: 1
      - action:
          en: Whip
        count: 1
  - name:
      en: Longsword
    text:
      en: "Melee Weapon Attack: +14 to hit, reach 10 ft., one target. Hit: 21 (3d8 + 8) slashing damage plus 13 (3d8) lightning damage. If the balor scores a critical hit, it rolls damage dice three times, instead of twice."
    attack:
      kind: melee
      source: weapon
      bonus: 14
      reach: 10
    damage:
      - dice: 3d8+8
        damageType: slashing
      - dice: 3d8
        damageType: lightning
  - name:
      en: Whip
    text:
      en: "Melee Weapon Attack: +14 to hit, reach 30 ft., one target. Hit: 15 (2d6 + 8) slashing damage plus 10 (3d6) fire damage, and the target must succeed on a DC 20 Strength saving throw or be pulled up to 25 feet toward the balor."
    attack:
      kind: melee
      source: weapon
      bonus: 14
      reach: 30
    damage:
      - dice: 2d6+8
        damageType: slashing
      - dice: 3d6
        damageType: fire
    save:
      ability: str
      dc: 20
  - name:
      en: Teleport
    text:
      en: The balor magically teleports, along with any equipment it is wearing or carrying, up to 120 feet to an unoccupied space it can see.
