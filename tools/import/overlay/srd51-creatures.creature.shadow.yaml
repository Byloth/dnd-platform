traits:
  - name:
      en: Amorphous
    text:
      en: The shadow can move through a space as narrow as 1 inch wide without squeezing.
  - name:
      en: Shadow Stealth
    text:
      en: While in dim light or darkness, the shadow can take the Hide action as a bonus action.
  - name:
      en: Sunlight Weakness
    text:
      en: While in sunlight, the shadow has disadvantage on attack rolls, ability checks, and saving throws.
