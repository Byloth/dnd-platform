resistances:
  - cold
  - types:
      - bludgeoning
      - piercing
      - slashing
    note:
      en: from nonmagical attacks that aren't silvered
traits:
  - name:
      en: Devil's Sight
    text:
      en: Magical darkness doesn't impede the devil's darkvision.
  - name:
      en: Magic Resistance
    text:
      en: The devil has advantage on saving throws against spells and other magical effects.
  - name:
      en: Steadfast
    text:
      en: The devil can't be frightened while it can see an allied creature within 30 feet of it.
actions:
  - name:
      en: Multiattack
    text:
      en: "The devil makes two attacks: one with its beard and one with its glaive."
    multiattack:
      - action:
          en: Beard
        count: 1
      - action:
          en: Glaive
        count: 1
  - name:
      en: Beard
    text:
      en: "Melee Weapon Attack: +5 to hit, reach 5 ft., one creature. Hit: 6 (1d8 + 2) piercing damage, and the target must succeed on a DC 12 Constitution saving throw or be poisoned for 1 minute. While poisoned in this way, the target can't regain hit points. The target can repeat the saving throw at the end of each of its turns, ending the effect on itself on a success."
    attack:
      kind: melee
      source: weapon
      bonus: 5
      reach: 5
    damage:
      - dice: 1d8+2
        damageType: piercing
    save:
      ability: con
      dc: 12
  - name:
      en: Glaive
    text:
      en: "Melee Weapon Attack: +5 to hit, reach 10 ft., one target. Hit: 8 (1d10 + 3) slashing damage. If the target is a creature other than an undead or a construct, it must succeed on a DC 12 Constitution saving throw or lose 5 (1d10) hit points at the start of each of its turns due to an infernal wound. Each time the devil hits the wounded target with this attack, the damage dealt by the wound increases by 5 (1d10). Any creature can take an action to stanch the wound with a successful DC 12 Wisdom (Medicine) check. The wound also closes if the target receives magical healing."
    attack:
      kind: melee
      source: weapon
      bonus: 5
      reach: 10
    damage:
      - dice: 1d10+3
        damageType: slashing
    save:
      ability: con
      dc: 12
