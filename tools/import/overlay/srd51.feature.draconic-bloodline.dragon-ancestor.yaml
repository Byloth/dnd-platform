  - kind: add-text
    section: features
    text:
      en: Whenever you make a Charisma check when interacting with dragons, your proficiency bonus is doubled if it applies to the check.
    note:
      en: A check scoped to a creature type has no modify target; apply the doubled proficiency bonus by hand.
