effects:
  - kind: add-action
    action: empty-body
    name:
      en: Empty Body
    activation: action
    cost:
      - resource: ki
        amount: 4
    duration:
      type: timed
      minutes: 1
    toggle:
      state: empty-body
      expires:
        minutes: 1
    text:
      en: You can use your action to spend 4 ki points to become invisible for 1 minute. During that time, you also have resistance to all damage but force damage.
    onUse:
      - kind: applyCondition
        condition: srd51.condition.invisible
        target: self
        expires:
          minutes: 1
  - kind: defense
    defense: resistance
    to:
      - acid
      - bludgeoning
      - cold
      - fire
      - lightning
      - necrotic
      - piercing
      - poison
      - psychic
      - radiant
      - slashing
      - thunder
    when:
      toggled: empty-body
    note:
      en: Resistance to all damage but force while Empty Body is active.
  - kind: grant-spells
    spells:
      - srd51.spell.astral-projection
    as: known
    ability: wis
    cost:
      - resource: ki
        amount: 8
    note:
      en: Cast astral projection by spending 8 ki points, without needing material components. You can't take any other creatures with you.
