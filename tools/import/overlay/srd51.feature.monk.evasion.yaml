effects:
  - kind: add-text
    section: saves
    text:
      en: "Evasion: when you are subjected to an effect that allows you to make a Dexterity saving throw to take only half damage, you instead take no damage if you succeed on the saving throw, and only half damage if you fail."
    note:
      en: "Gap: a save-outcome rule (no damage on success, half on failure for Dexterity half-damage saves) that play mode must hook; nothing to derive on the sheet."
