actions:
  - name:
      en: Claw
    text:
      en: "Melee Weapon Attack: +4 to hit, reach 5 ft., one target. Hit: 6 (1d8 + 2) bludgeoning damage, and the target is grappled (escape DC 12). The scorpion has two claws, each of which can grapple only one target."
    attack:
      kind: melee
      source: weapon
      bonus: 4
      reach: 5
    damage:
      - dice: 1d8+2
        damageType: bludgeoning
  - name:
      en: Multiattack
    text:
      en: "The scorpion makes three attacks: two with its claws and one with its sting."
    multiattack:
      - action:
          en: Claw
        count: 2
      - action:
          en: Sting
        count: 1
  - name:
      en: Sting
    text:
      en: "Melee Weapon Attack: +4 to hit, reach 5 ft., one creature. Hit: 7 (1d10 + 2) piercing damage, and the target must make a DC 12 Constitution saving throw, taking 22 (4d10) poison damage on a failed save, or half as much damage on a successful one."
    attack:
      kind: melee
      source: weapon
      bonus: 4
      reach: 5
    damage:
      - dice: 1d10+2
        damageType: piercing
    save:
      ability: con
      dc: 12
