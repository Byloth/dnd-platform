actions:
  - name:
      en: Bite
    text:
      en: "Melee Weapon Attack: +2 to hit, reach 5 ft., one creature. Hit: 9 (2d6 + 2) piercing damage."
    attack:
      kind: melee
      source: weapon
      bonus: 2
      reach: 5
    damage:
      - dice: 2d6+2
        damageType: piercing
  - name:
      en: Claws
    text:
      en: "Melee Weapon Attack: +4 to hit, reach 5 ft., one target. Hit: 7 (2d4 + 2) slashing damage. If the target is a creature other than an elf or undead, it must succeed on a DC 10 Constitution saving throw or be paralyzed for 1 minute. The target can repeat the saving throw at the end of each of its turns, ending the effect on itself on a success."
    attack:
      kind: melee
      source: weapon
      bonus: 4
      reach: 5
    damage:
      - dice: 2d4+2
        damageType: slashing
    save:
      ability: con
      dc: 10
