effects:
  - kind: open-choice
    choice: land
    of: option
    count: 1
    note:
      en: Choose the land where you became a druid. Once you gain access to a circle spell, you always have it prepared, and it doesn't count against the number of spells you can prepare each day. A circle spell not on the druid spell list is nonetheless a druid spell for you.
    options:
      - id: arctic
        name:
          en: Arctic
        text:
          en: "Circle spells of the arctic: 3rd level, hold person and spike growth; 5th level, sleet storm and slow; 7th level, freedom of movement and ice storm; 9th level, commune with nature and cone of cold."
        effects:
          - kind: grant-spells
            spells:
              - srd51.spell.hold-person
              - srd51.spell.spike-growth
            as: always-prepared
            ability: wis
            when:
              classLevel:
                class: srd51.class.druid
                min: 3
          - kind: grant-spells
            spells:
              - srd51.spell.sleet-storm
              - srd51.spell.slow
            as: always-prepared
            ability: wis
            when:
              classLevel:
                class: srd51.class.druid
                min: 5
          - kind: grant-spells
            spells:
              - srd51.spell.freedom-of-movement
              - srd51.spell.ice-storm
            as: always-prepared
            ability: wis
            when:
              classLevel:
                class: srd51.class.druid
                min: 7
          - kind: grant-spells
            spells:
              - srd51.spell.commune-with-nature
              - srd51.spell.cone-of-cold
            as: always-prepared
            ability: wis
            when:
              classLevel:
                class: srd51.class.druid
                min: 9
