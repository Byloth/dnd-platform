attunement: true
charges:
  max: 7
  recharge: [{ on: dawn, amount: "1d6 + 1" }]
features:
  - id: srd51.feature.item.wand-of-enemy-detection.enemy-detection
    name: { en: "Enemy Detection" }
    effects:
      - kind: add-action
        action: enemy-detection
        name: { en: "Enemy Detection" }
        activation: action
        cost: [{ resource: charges, amount: 1 }]
        duration: { type: timed, minutes: 1 }
        text: { en: "Speak the command word: for the next minute, you know the direction of the nearest creature hostile to you within 60 feet, but not its distance. The wand senses hostile creatures that are ethereal, invisible, disguised or hidden, as well as those in plain sight. The effect ends if you stop holding the wand. If you expend the last charge, roll a d20: on a 1 the wand crumbles into ashes and is destroyed." }
        onUse:
          - kind: note
            text: { en: "For 1 minute, you know the direction of the nearest hostile creature within 60 feet." }
