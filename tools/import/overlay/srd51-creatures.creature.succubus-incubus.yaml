actions:
  - name:
      en: Claw (Fiend Form Only)
    text:
      en: "Melee Weapon Attack: +5 to hit, reach 5 ft., one target. Hit: 6 (1d6 + 3) slashing damage."
    attack:
      kind: melee
      source: weapon
      bonus: 5
      reach: 5
    damage:
      - dice: 1d6+3
        damageType: slashing
  - name:
      en: Charm
    text:
      en: |-
        One humanoid the fiend can see within 30 feet of it must succeed on a DC 15 Wisdom saving throw or be magically charmed for 1 day. The charmed target obeys the fiend's verbal or telepathic commands. If the target suffers any harm or receives a suicidal command, it can repeat the saving throw, ending the effect on a success. If the target successfully saves against the effect, or if the effect on it ends, the target is immune to this fiend's Charm for the next 24 hours.
        The fiend can have only one target charmed at a time. If it charms another, the effect on the previous target ends.
    save:
      ability: wis
      dc: 15
  - name:
      en: Draining Kiss
    text:
      en: The fiend kisses a creature charmed by it or a willing creature. The target must make a DC 15 Constitution saving throw against this magic, taking 32 (5d10 + 5) psychic damage on a failed save, or half as much damage on a successful one. The target's hit point maximum is reduced by an amount equal to the damage taken. This reduction lasts until the target finishes a long rest. The target dies if this effect reduces its hit point maximum to 0.
    damage:
      - dice: 5d10+5
        damageType: psychic
    save:
      ability: con
      dc: 15
      onSuccess: half
  - name:
      en: Etherealness
    text:
      en: The fiend magically enters the Ethereal Plane from the Material Plane, or vice versa.
