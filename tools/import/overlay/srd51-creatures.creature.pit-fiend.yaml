actions:
  - name:
      en: Multiattack
    text:
      en: "The pit fiend makes four attacks: one with its bite, one with its claw, one with its mace, and one with its tail."
    multiattack:
      - action:
          en: Bite
        count: 1
      - action:
          en: Claw
        count: 1
      - action:
          en: Mace
        count: 1
      - action:
          en: Tail
        count: 1
  - name:
      en: Bite
    text:
      en: "Melee Weapon Attack: +14 to hit, reach 5 ft., one target. Hit: 22 (4d6 + 8) piercing damage. The target must succeed on a DC 21 Constitution saving throw or become poisoned. While poisoned in this way, the target can't regain hit points, and it takes 21 (6d6) poison damage at the start of each of its turns. The poisoned target can repeat the saving throw at the end of each of its turns, ending the effect on itself on a success."
    attack:
      kind: melee
      source: weapon
      bonus: 14
      reach: 5
    damage:
      - dice: 4d6+8
        damageType: piercing
    save:
      ability: con
      dc: 21
  - name:
      en: Claw
    text:
      en: "Melee Weapon Attack: +14 to hit, reach 10 ft., one target. Hit: 17 (2d8 + 8) slashing damage."
    attack:
      kind: melee
      source: weapon
      bonus: 14
      reach: 10
    damage:
      - dice: 2d8+8
        damageType: slashing
  - name:
      en: Mace
    text:
      en: "Melee Weapon Attack: +14 to hit, reach 10 ft., one target. Hit: 15 (2d6 + 8) bludgeoning damage plus 21 (6d6) fire damage."
    attack:
      kind: melee
      source: weapon
      bonus: 14
      reach: 10
    damage:
      - dice: 2d6+8
        damageType: bludgeoning
      - dice: 6d6
        damageType: fire
  - name:
      en: Tail
    text:
      en: "Melee Weapon Attack: +14 to hit, reach 10 ft., one target. Hit: 24 (3d10 + 8) bludgeoning damage."
    attack:
      kind: melee
      source: weapon
      bonus: 14
      reach: 10
    damage:
      - dice: 3d10+8
        damageType: bludgeoning
