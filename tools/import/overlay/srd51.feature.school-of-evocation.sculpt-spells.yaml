effects:
  - kind: add-text
    section: features
    text:
      en: When you cast an evocation spell that affects other creatures that you can see, you can choose a number of them equal to 1 + the spell's level. The chosen creatures automatically succeed on their saving throws against the spell, and they take no damage if they would normally take half damage on a successful save.
    note:
      en: Sparing chosen creatures from your evocation spells happens on cast against other creatures, which the play engine does not model.
