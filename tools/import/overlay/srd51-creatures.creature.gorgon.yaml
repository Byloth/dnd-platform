traits:
  - name:
      en: Trampling Charge
    text:
      en: If the gorgon moves at least 20 feet straight toward a creature and then hits it with a gore attack on the same turn, that target must succeed on a DC 16 Strength saving throw or be knocked prone. If the target is prone, the gorgon can make one attack with its hooves against it as a bonus action.
    save:
      ability: str
      dc: 16
