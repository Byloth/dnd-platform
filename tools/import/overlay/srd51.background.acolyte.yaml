# Text: the em dash the importer lost ("a cleric—performing").
text:
  en: |-
    You have spent your life in the service of a temple to a specific god or pantheon of gods. You act as an intermediary between the realm of the holy and the mortal world, performing sacred rites and offering sacrifices in order to conduct worshipers into the presence of the divine. You are not necessarily a cleric—performing sacred rites is not the same thing as channeling divine power.

    Choose a god, a pantheon of gods, or some other quasi-divine being from among those listed in "Fantasy-Historical Pantheons" or those specified by your GM, and work with your GM to detail the nature of your religious service. Were you a lesser functionary in a temple, raised from childhood to assist the priests in the sacred rites? Or were you a high priest who suddenly experienced a call to serve your god in a different way? Perhaps you were the leader of a small cult outside of any established temple structure, or even an occult group that served a fiendish master that you now deny.
# Equipment: the vestments and the 5 sticks of incense as items (the prayer book or prayer wheel has no item and stays in the text).
equipment:
  fixed:
    - item: srd51.item.clothes-common
    - item: srd51.item.pouch
    - filter:
        category: holy-symbols
    - item: srd51.item.vestments
    - item: srd51.item.block-of-incense
      quantity: 5
# Ideals: each with the alignment the SRD 5.1 table gives it.
personality:
  ideals:
    - en: Tradition. The ancient traditions of worship and sacrifice must be preserved and upheld. (Lawful)
    - en: Charity. I always try to help those in need, no matter what the personal cost. (Good)
    - en: Change. We must help bring about the changes the gods are constantly working in the world. (Chaotic)
    - en: Power. I hope to one day rise to the top of my faith's religious hierarchy. (Lawful)
    - en: Faith. I trust that my deity will guide my actions. I have faith that if I work hard, things will go well. (Lawful)
    - en: Aspiration. I seek to prove myself worthy of my god's favor by matching my actions against his or her teachings. (Any)
