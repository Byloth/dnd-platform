attunement: true
charges:
  max: "1d8 + 1"
  recharge:
    - on: manual
      amount: full
features:
  - id: srd51.feature.item.nine-lives-stealer.magic-weapon
    name:
      en: "Magic Weapon"
    text:
      en: "You gain a +2 bonus to attack and damage rolls made with this magic weapon."
    effects:
      - kind: modify-attacks
        filter: { item: srd51.item.nine-lives-stealer }
        set: { attackBonus: 2, damageBonus: 2, magical: true }
  - id: srd51.feature.item.nine-lives-stealer.life-stealing
    name:
      en: "Life Stealing"
    text:
      en: "The sword has 1d8 + 1 charges. If you score a critical hit against a creature that has fewer than 100 hit points, it must succeed on a DC 15 Constitution saving throw or be slain instantly as the sword tears its life force from its body (a construct or an undead is immune). The sword loses 1 charge if the creature is slain. When the sword has no charges remaining, it loses this property."
    effects:
      - kind: add-text
        section: features
        text:
          en: "If you score a critical hit against a creature that has fewer than 100 hit points, it must succeed on a DC 15 Constitution saving throw or be slain instantly (a construct or an undead is immune). The sword loses 1 charge if the creature is slain; the charges never come back, and the sword loses this property when it has none."
        note:
          en: "A critical-hit save-or-die; no kind expresses it. Spend a charge by hand when a creature is slain."
