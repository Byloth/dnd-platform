attunement: true
features:
  - id: srd51.feature.item.sword-of-wounding.magic-weapon
    name: { en: "Magic Weapon" }
    effects:
      - kind: modify-attacks
        filter: { item: srd51.item.sword-of-wounding }
        set: { magical: true }
        note: { en: "Any sword; this item carries no base weapon properties of its own." }
      - kind: add-text
        section: features
        text: { en: "Hit points lost to this weapon's damage can be regained only through a short or long rest, rather than by regeneration, magic, or any other means." }
  - id: srd51.feature.item.sword-of-wounding.wound
    name: { en: "Wound" }
    effects:
      - kind: add-action
        action: wound
        name: { en: "Wound" }
        activation: special
        trigger: { en: "once per turn, when you hit a creature with an attack using this weapon" }
        text: { en: "Wound the target. At the start of each of the wounded creature's turns, it takes 1d4 necrotic damage for each time you've wounded it, then can make a DC 15 Constitution saving throw, ending the effect of all such wounds on a success. Alternatively, the wounded creature or a creature within 5 feet of it can use an action to make a DC 15 Wisdom (Medicine) check, ending the wounds on a success." }
        onHit:
          - kind: note
            text: { en: "Track the number of wounds on the target: 1d4 necrotic damage per wound at the start of each of its turns, then a DC 15 Constitution save to end them all." }
