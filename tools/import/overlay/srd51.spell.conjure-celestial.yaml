effects:
  - kind: add-text
    section: features
    text: { en: "The summoned celestial (challenge rating 4 or lower) is friendly to you and your companions, rolls its own initiative and obeys your verbal commands (no action required) as long as they don't violate its alignment; without commands it only defends itself. It disappears at 0 hit points or when the spell ends." }
onCast:
  - kind: note
    text: { en: "The DM has the celestial's statistics (no stat blocks in v0). With a 9th-level slot the celestial can be of challenge rating 5 or lower." }
