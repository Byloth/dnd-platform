attunement: true
features:
  - id: srd51.feature.item.wings-of-flying.wings
    name: { en: "Wings" }
    effects:
      - kind: declare-resource
        resource: wings-of-flying
        name: { en: "Wings of Flying" }
        max: 1
        recharge: [{ on: manual, amount: full }]
        display: pips
        note: { en: "When the wings disappear, you can't use them again for 1d12 hours; no timed recharge exists, so restore it by hand." }
      - kind: add-action
        action: sprout-wings
        name: { en: "Sprout wings" }
        activation: action
        cost: [{ resource: wings-of-flying, amount: 1 }]
        duration: { type: timed, hours: 1 }
        toggle: { state: wings-of-flying, expires: { hours: 1 } }
        text: { en: "Speak the command word: the cloak turns into a pair of bat wings or bird wings on your back for 1 hour or until you repeat the command word as an action. The wings give you a flying speed of 60 feet." }
      - kind: add-action
        action: dismiss-wings
        name: { en: "Dismiss the wings" }
        activation: action
        requires: { condition: { toggled: wings-of-flying } }
        text: { en: "Repeat the command word to make the wings disappear." }
      - kind: modify
        target: speed.fly
        op: max
        value: 60
        when: { toggled: wings-of-flying }
