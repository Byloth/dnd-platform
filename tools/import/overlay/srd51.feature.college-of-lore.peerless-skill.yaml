effects:
  - kind: add-action
    action: peerless-skill
    name:
      en: Peerless Skill
    activation: free
    cost:
      - resource: bardic-inspiration
        amount: 1
    text:
      en: "When you make an ability check, you can expend one use of Bardic Inspiration. Roll a Bardic Inspiration die and add the number rolled to your ability check. You can choose to do so after you roll the die for the ability check, but before the GM tells you whether you succeed or fail."
    onUse:
      - kind: note
        text:
          en: "Add a Bardic Inspiration die (size table(bard.bardic-inspiration-die)) to your ability check."
