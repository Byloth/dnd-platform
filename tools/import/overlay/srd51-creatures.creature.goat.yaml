traits:
  - name:
      en: Charge
    text:
      en: If the goat moves at least 20 ft. straight toward a target and then hits it with a ram attack on the same turn, the target takes an extra 2 (1d4) bludgeoning damage. If the target is a creature, it must succeed on a DC 10 Strength saving throw or be knocked prone.
    damage:
      - dice: 1d4
        damageType: bludgeoning
    save:
      ability: str
      dc: 10
  - name:
      en: Sure-Footed
    text:
      en: The goat has advantage on Strength and Dexterity saving throws made against effects that would knock it prone.
