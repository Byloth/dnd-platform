actions:
  - name:
      en: Multiattack
    text:
      en: The giant makes two greatclub attacks.
    multiattack:
      - action:
          en: Greatclub
        count: 2
  - name:
      en: Greatclub
    text:
      en: "Melee Weapon Attack: +9 to hit, reach 15 ft., one target. Hit: 19 (3d8 + 6) bludgeoning damage."
    attack:
      kind: melee
      source: weapon
      bonus: 9
      reach: 15
    damage:
      - dice: 3d8+6
        damageType: bludgeoning
  - name:
      en: Rock
    text:
      en: "Ranged Weapon Attack: +9 to hit, range 60/240 ft., one target. Hit: 28 (4d10 + 6) bludgeoning damage. If the target is a creature, it must succeed on a DC 17 Strength saving throw or be knocked prone."
    attack:
      kind: ranged
      source: weapon
      bonus: 9
      range:
        normal: 60
        long: 240
    damage:
      - dice: 4d10+6
        damageType: bludgeoning
    save:
      ability: str
      dc: 17
