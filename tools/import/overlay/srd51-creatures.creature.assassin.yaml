traits:
  - name:
      en: Assassinate
    text:
      en: During its first turn, the assassin has advantage on attack rolls against any creature that hasn't taken a turn. Any hit the assassin scores against a surprised creature is a critical hit.
  - name:
      en: Evasion
    text:
      en: If the assassin is subjected to an effect that allows it to make a Dexterity saving throw to take only half damage, the assassin instead takes no damage if it succeeds on the saving throw, and only half damage if it fails.
  - name:
      en: Sneak Attack (1/Turn)
    text:
      en: The assassin deals an extra 14 (4d6) damage when it hits a target with a weapon attack and has advantage on the attack roll, or when the target is within 5 ft. of an ally of the assassin that isn't incapacitated and the assassin doesn't have disadvantage on the attack roll.
    damage:
      - dice: 4d6
actions:
  - name:
      en: Multiattack
    text:
      en: The assassin makes two shortsword attacks.
    multiattack:
      - action:
          en: Shortsword
        count: 2
  - name:
      en: Shortsword
    text:
      en: "Melee Weapon Attack: +6 to hit, reach 5 ft., one target. Hit: 6 (1d6 + 3) piercing damage, and the target must make a DC 15 Constitution saving throw, taking 24 (7d6) poison damage on a failed save, or half as much damage on a successful one."
    attack:
      kind: melee
      source: weapon
      bonus: 6
      reach: 5
    damage:
      - dice: 1d6+3
        damageType: piercing
      - dice: 7d6
        damageType: poison
    save:
      ability: con
      dc: 15
  - name:
      en: Light Crossbow
    text:
      en: "Ranged Weapon Attack: +6 to hit, range 80/320 ft., one target. Hit: 7 (1d8 + 3) piercing damage, and the target must make a DC 15 Constitution saving throw, taking 24 (7d6) poison damage on a failed save, or half as much damage on a successful one."
    attack:
      kind: ranged
      source: weapon
      bonus: 6
      range:
        normal: 80
        long: 320
    damage:
      - dice: 1d8+3
        damageType: piercing
      - dice: 7d6
        damageType: poison
    save:
      ability: con
      dc: 15
