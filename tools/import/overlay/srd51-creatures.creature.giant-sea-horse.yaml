traits:
  - name:
      en: Charge
    text:
      en: If the sea horse moves at least 20 ft. straight toward a target and then hits it with a ram attack on the same turn, the target takes an extra 7 (2d6) bludgeoning damage. If the target is a creature, it must succeed on a DC 11 Strength saving throw or be knocked prone.
    damage:
      - dice: 2d6
        damageType: bludgeoning
    save:
      ability: str
      dc: 11
  - name:
      en: Water Breathing
    text:
      en: The sea horse can breathe only underwater.
