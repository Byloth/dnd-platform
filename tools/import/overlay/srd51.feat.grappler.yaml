prerequisites:
  ability:
    ability: str
    min: 13
# Text: the SRD 5.1 pin rule is a second grapple check, not a saving throw.
text:
  en: |-
    You've developed the skills necessary to hold your own in close-quarters grappling. You gain the following benefits:
    - You have advantage on attack rolls against a creature you are grappling.
    - You can use your action to try to pin a creature grappled by you. To do so, make another grapple check. If you succeed, you and the creature are both restrained until the grapple ends.
effects:
  - kind: roll-advantage
    on:
      type: attack
      against:
        - a creature you are grappling
  - kind: add-action
    action: pin
    name:
      en: Pin
    activation: action
    text:
      en: Try to pin a creature grappled by you. To do so, make another grapple check. If you succeed, you and the creature are both restrained until the grapple ends.
