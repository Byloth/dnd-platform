type: weapon
category: simple
damage: 1d4
damageType: piercing
properties: [finesse, light, thrown]
range: { normal: 20, long: 60 }
monkWeapon: true
charges:
  max: 1
  recharge: [{ on: dawn, amount: full }]
features:
  - id: srd51.feature.item.dagger-of-venom.bonus
    name: { en: "+1 bonus" }
    effects:
      - kind: modify-attacks
        filter: { item: srd51.item.dagger-of-venom }
        set: { attackBonus: 1, damageBonus: 1, magical: true }
  - id: srd51.feature.item.dagger-of-venom.poison
    name: { en: "Venom" }
    effects:
      - kind: add-action
        action: coat-dagger-of-venom
        name: { en: "Coat the blade with poison" }
        activation: action
        cost: [{ resource: charges, amount: 1 }]
        toggle: { state: dagger-of-venom-poisoned, expires: { minutes: 1 } }
        text: { en: "Thick, black poison coats the blade for 1 minute or until an attack using this weapon hits a creature. That creature must succeed on a DC 15 Constitution saving throw or take 2d10 poison damage and become poisoned for 1 minute. The dagger can't be used this way again until the next dawn." }
        onUse:
          - kind: note
            text: { en: "On the next hit within 1 minute: DC 15 Constitution save or 2d10 poison damage and poisoned for 1 minute; then switch the poison off." }
