effects:
  - kind: declare-resource
    resource: hurl-through-hell
    name:
      en: Hurl Through Hell
    max: 1
    display: pips
    recharge:
      - on: long-rest
        amount: full
  - kind: add-action
    action: hurl-through-hell
    name:
      en: Hurl Through Hell
    activation: free
    cost:
      - resource: hurl-through-hell
        amount: 1
    trigger:
      en: When you hit a creature with an attack.
    text:
      en: When you hit a creature with an attack, you can use this feature to instantly transport the target through the lower planes. The creature disappears and hurtles through a nightmare landscape. At the end of your next turn, the target returns to the space it previously occupied, or the nearest unoccupied space. If the target is not a fiend, it takes 10d10 psychic damage as it reels from its horrific experience.
    onUse:
      - kind: note
        text:
          en: The target disappears until the end of your next turn, then returns to its space (or the nearest unoccupied space).
      - kind: extraDamage
        dice: 10d10
        damageType: psychic
        note:
          en: Dealt when the target returns at the end of your next turn, only if it is not a fiend.
