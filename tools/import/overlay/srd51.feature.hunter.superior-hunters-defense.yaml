effects:
  - kind: open-choice
    choice: superior-hunters-defense
    of: option
    count: 1
    options:
      - id: evasion
        name:
          en: Evasion
        text:
          en: When you are subjected to an effect, such as a red dragon's fiery breath or a lightning bolt spell, that allows you to make a Dexterity saving throw to take only half damage, you instead take no damage if you succeed on the saving throw, and only half damage if you fail.
        effects:
          - kind: add-text
            section: features
            text:
              en: When you are subjected to an effect that allows you to make a Dexterity saving throw to take only half damage, you instead take no damage if you succeed on the saving throw, and only half damage if you fail.
            note:
              en: Save-outcome rule resolved in play; no catalogue kind.
      - id: stand-against-the-tide
        name:
          en: Stand Against the Tide
        text:
          en: When a hostile creature misses you with a melee attack, you can use your reaction to force that creature to repeat the same attack against another creature (other than itself) of your choice.
        effects:
          - kind: add-action
            action: stand-against-the-tide
            name:
              en: Stand Against the Tide
            activation: reaction
            trigger:
              en: when a hostile creature misses you with a melee attack
            text:
              en: Force that creature to repeat the same attack against another creature (other than itself) of your choice.
            onUse:
              - kind: note
                text:
                  en: The attacker repeats the same attack against another creature of your choice (not itself).
      - id: uncanny-dodge
        name:
          en: Uncanny Dodge
        text:
          en: When an attacker that you can see hits you with an attack, you can use your reaction to halve the attack's damage against you.
        effects:
          - kind: add-action
            action: uncanny-dodge
            name:
              en: Uncanny Dodge
            activation: reaction
            trigger:
              en: when an attacker that you can see hits you with an attack
            text:
              en: Halve the attack's damage against you.
            onUse:
              - kind: note
                text:
                  en: The damage of the triggering attack is halved.
