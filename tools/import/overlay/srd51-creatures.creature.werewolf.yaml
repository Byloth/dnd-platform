subtypes:
  - human
  - shapechanger
skills:
  stealth: 3
languages:
  en: Common (can't speak in wolf form)
actions:
  - name:
      en: Multiattack (Humanoid or Hybrid Form Only)
    text:
      en: "The werewolf makes two attacks: one with its bite and one with its claws or spear."
  - name:
      en: Bite (Wolf or Hybrid Form Only)
    text:
      en: "Melee Weapon Attack: +4 to hit, reach 5 ft., one target. Hit: 6 (1d8 + 2) piercing damage. If the target is a humanoid, it must succeed on a DC 12 Constitution saving throw or be cursed with werewolf lycanthropy."
    attack:
      kind: melee
      source: weapon
      bonus: 4
      reach: 5
    damage:
      - dice: 1d8+2
        damageType: piercing
    save:
      ability: con
      dc: 12
  - name:
      en: Claws (Hybrid Form Only)
    text:
      en: "Melee Weapon Attack: +4 to hit, reach 5 ft., one creature. Hit: 7 (2d4 + 2) slashing damage."
    attack:
      kind: melee
      source: weapon
      bonus: 4
      reach: 5
    damage:
      - dice: 2d4+2
        damageType: slashing
  - name:
      en: Spear (Humanoid Form Only)
    text:
      en: "Melee or Ranged Weapon Attack: +4 to hit, reach 5 ft. or range 20/60 ft., one creature. Hit: 5 (1d6 + 2) piercing damage, or 6 (1d8 + 2) piercing damage if used with two hands to make a melee attack."
    attack:
      kind: melee-or-ranged
      source: weapon
      bonus: 4
      reach: 5
      range:
        normal: 20
        long: 60
    damage:
      - dice: 1d6+2
        damageType: piercing
