effects:
  - kind: add-text
    section: features
    text: { en: "Aquatic Adaptation: you can breathe underwater and gain a swimming speed equal to your walking speed." }
    note: { en: "One option is chosen when cast (an action switches to another); the formula language cannot reference the walking speed, so the swimming speed stays text." }
  - kind: add-text
    section: features
    text: { en: "Change Appearance: you decide what you look like; none of your statistics change. You can use your action to change your appearance again." }
  - kind: add-text
    section: features
    text: { en: "Natural Weapons: your unarmed strikes deal 1d6 bludgeoning, piercing, or slashing damage, you are proficient with them, the natural weapon is magic and you have a +1 bonus to the attack and damage rolls you make with it." }
    note: { en: "Option-dependent, so not expressed as modify-attacks (no vocabulary for an option chosen at casting)." }
