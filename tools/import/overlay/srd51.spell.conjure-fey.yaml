effects:
  - kind: add-text
    section: features
    text: { en: "The summoned fey creature (challenge rating 6 or lower, or a fey spirit in the form of a beast of CR 6 or lower) is friendly to you and your companions, rolls its own initiative and obeys your verbal commands (no action required) as long as they don't violate its alignment; without commands it only defends itself. It disappears at 0 hit points or when the spell ends. If your concentration is broken, the fey creature stays, becomes hostile, can't be dismissed and disappears 1 hour after being summoned." }
onCast:
  - kind: note
    text: { en: "The DM has the fey creature's statistics (no stat blocks in v0). The challenge rating increases by 1 for each slot level above 6th." }
