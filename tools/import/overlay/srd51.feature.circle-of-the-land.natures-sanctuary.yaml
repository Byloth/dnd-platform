effects:
  - kind: add-action
    action: natures-sanctuary
    name:
      en: Nature's Sanctuary
    activation: special
    trigger:
      en: when a beast or plant creature attacks you
    dc: 8 + proficiencyBonus + mod(wis)
    rolls:
      - type: save
        ability: wis
        dc: 8 + proficiencyBonus + mod(wis)
    text:
      en: When a beast or plant creature attacks you, that creature must make a Wisdom saving throw against your druid spell save DC. On a failed save, the creature must choose a different target, or the attack automatically misses. On a successful save, the creature is immune to this effect for 24 hours. The creature is aware of this effect before it makes its attack against you.
    note:
      en: "Play mode: a passive effect resolved by the attacker's Wisdom save against your druid spell save DC; choosing a different target or the automatic miss, and the 24-hour immunity on a success, are tracked in play."
