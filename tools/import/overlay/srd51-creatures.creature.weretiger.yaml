subtypes:
  - human
  - shapechanger
languages:
  en: Common (can't speak in tiger form)
traits:
  - name:
      en: Shapechanger
    text:
      en: The weretiger can use its action to polymorph into a tiger-humanoid hybrid or into a tiger, or back into its true form, which is humanoid. Its statistics, other than its size, are the same in each form. Any equipment it is wearing or carrying isn't transformed. It reverts to its true form if it dies.
  - name:
      en: Keen Hearing and Smell
    text:
      en: The weretiger has advantage on Wisdom (Perception) checks that rely on hearing or smell.
  - name:
      en: Pounce (Tiger or Hybrid Form Only)
    text:
      en: If the weretiger moves at least 15 feet straight toward a creature and then hits it with a claw attack on the same turn, that target must succeed on a DC 14 Strength saving throw or be knocked prone. If the target is prone, the weretiger can make one bite attack against it as a bonus action.
    save:
      ability: str
      dc: 14
actions:
  - name:
      en: Multiattack (Humanoid or Hybrid Form Only)
    text:
      en: In humanoid form, the weretiger makes two scimitar attacks or two longbow attacks. In hybrid form, it can attack like a humanoid or make two claw attacks.
  - name:
      en: Bite (Tiger or Hybrid Form Only)
    text:
      en: "Melee Weapon Attack: +5 to hit, reach 5 ft., one target. Hit: 8 (1d10 + 3) piercing damage. If the target is a humanoid, it must succeed on a DC 13 Constitution saving throw or be cursed with weretiger lycanthropy."
    attack:
      kind: melee
      source: weapon
      bonus: 5
      reach: 5
    damage:
      - dice: 1d10+3
        damageType: piercing
    save:
      ability: con
      dc: 13
  - name:
      en: Claw (Tiger or Hybrid Form Only)
    text:
      en: "Melee Weapon Attack: +5 to hit, reach 5 ft., one target. Hit: 7 (1d8 + 3) slashing damage."
    attack:
      kind: melee
      source: weapon
      bonus: 5
      reach: 5
    damage:
      - dice: 1d8+3
        damageType: slashing
  - name:
      en: Scimitar (Humanoid or Hybrid Form Only)
    text:
      en: "Melee Weapon Attack: +5 to hit, reach 5 ft., one target. Hit: 6 (1d6 + 3) slashing damage."
    attack:
      kind: melee
      source: weapon
      bonus: 5
      reach: 5
    damage:
      - dice: 1d6+3
        damageType: slashing
  - name:
      en: Longbow (Humanoid or Hybrid Form Only)
    text:
      en: "Ranged Weapon Attack: +4 to hit, range 150/600 ft., one target. Hit: 6 (1d8 + 2) piercing damage."
    attack:
      kind: ranged
      source: weapon
      bonus: 4
      range:
        normal: 150
        long: 600
    damage:
      - dice: 1d8+2
        damageType: piercing
forms:
  - name:
      en: Human
  - name:
      en: Hybrid
  - name:
      en: Tiger
    size: large
    speed:
      walk: 40
