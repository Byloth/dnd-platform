features:
  - id: srd51.feature.item.rope-of-climbing.animate
    name: { en: "Animate" }
    effects:
      - kind: add-action
        action: animate-rope
        name: { en: "Animate the rope" }
        activation: action
        text: { en: "Hold one end of the 60-foot rope and speak the command word to animate it. You can tell it to fasten itself securely to an object or to unfasten itself, to knot or unknot itself, or to coil itself for carrying. Knotted, the rope shortens to 50 feet with knots at 1-foot intervals and grants advantage on checks made to climb it." }
        onUse:
          - kind: note
            text: { en: "The rope holds up to 3,000 pounds; it has AC 20 and 20 hit points, regains 1 hit point every 5 minutes while it has at least 1, and is destroyed at 0." }
      - kind: add-action
        action: command-rope
        name: { en: "Command the rope" }
        activation: bonus-action
        text: { en: "Command the other end to move toward a destination you choose. It moves 10 feet on your turn when first commanded and 10 feet on each of your turns until it reaches the destination, its maximum length, or you tell it to stop." }
