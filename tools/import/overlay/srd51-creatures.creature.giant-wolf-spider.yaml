traits:
  - name:
      en: Spider Climb
    text:
      en: The spider can climb difficult surfaces, including upside down on ceilings, without needing to make an ability check.
  - name:
      en: Web Sense
    text:
      en: While in contact with a web, the spider knows the exact location of any other creature in contact with the same web.
  - name:
      en: Web Walker
    text:
      en: The spider ignores movement restrictions caused by webbing.
actions:
  - name:
      en: Bite
    text:
      en: "Melee Weapon Attack: +3 to hit, reach 5 ft., one creature. Hit: 4 (1d6 + 1) piercing damage, and the target must make a DC 11 Constitution saving throw, taking 7 (2d6) poison damage on a failed save, or half as much damage on a successful one. If the poison damage reduces the target to 0 hit points, the target is stable but poisoned for 1 hour, even after regaining hit points, and is paralyzed while poisoned in this way."
    attack:
      kind: melee
      source: weapon
      bonus: 3
      reach: 5
    damage:
      - dice: 1d6+1
        damageType: piercing
    save:
      ability: con
      dc: 11
