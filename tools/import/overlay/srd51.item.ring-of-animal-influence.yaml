charges:
  max: 3
  recharge:
    - on: dawn
      amount: 1d3
features:
  - id: srd51.feature.item.ring-of-animal-influence.spells
    name:
      en: "Spells"
    text:
      en: "While wearing the ring, you can use an action to expend 1 of its charges to cast one of the following spells, animal friendship (save DC 13), fear (save DC 13, targeting only beasts that have an Intelligence of 3 or lower), or speak with animals."
    effects:
      - kind: grant-spells
        spells:
          - srd51.spell.animal-friendship
          - srd51.spell.fear
          - srd51.spell.speak-with-animals
        as: always-prepared
        cost: [{ resource: charges, amount: 1 }]
        note:
          en: "Save DC 13. Fear can target only beasts with an Intelligence of 3 or lower."
