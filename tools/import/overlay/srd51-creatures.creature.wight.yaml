actions:
  - name:
      en: Multiattack
    text:
      en: The wight makes two longsword attacks or two longbow attacks. It can use its Life Drain in place of one longsword attack.
  - name:
      en: Life Drain
    text:
      en: |-
        Melee Weapon Attack: +4 to hit, reach 5 ft., one creature. Hit: 5 (1d6 + 2) necrotic damage. The target must succeed on a DC 13 Constitution saving throw or its hit point maximum is reduced by an amount equal to the damage taken. This reduction lasts until the target finishes a long rest. The target dies if this effect reduces its hit point maximum to 0.
        A humanoid slain by this attack rises 24 hours later as a zombie under the wight's control, unless the humanoid is restored to life or its body is destroyed. The wight can have no more than twelve zombies under its control at one time.
    attack:
      kind: melee
      source: weapon
      bonus: 4
      reach: 5
    damage:
      - dice: 1d6+2
        damageType: necrotic
    save:
      ability: con
      dc: 13
  - name:
      en: Longsword
    text:
      en: "Melee Weapon Attack: +4 to hit, reach 5 ft., one target. Hit: 6 (1d8 + 2) slashing damage, or 7 (1d10 + 2) slashing damage if used with two hands."
    attack:
      kind: melee
      source: weapon
      bonus: 4
      reach: 5
    damage:
      - dice: 1d8+2
        damageType: slashing
  - name:
      en: Longbow
    text:
      en: "Ranged Weapon Attack: +4 to hit, range 150/600 ft., one target. Hit: 6 (1d8 + 2) piercing damage."
    attack:
      kind: ranged
      source: weapon
      bonus: 4
      range:
        normal: 150
        long: 600
    damage:
      - dice: 1d8+2
        damageType: piercing
