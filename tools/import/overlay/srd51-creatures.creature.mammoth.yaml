traits:
  - name:
      en: Trampling Charge
    text:
      en: If the mammoth moves at least 20 feet straight toward a creature and then hits it with a gore attack on the same turn, that target must succeed on a DC 18 Strength saving throw or be knocked prone. If the target is prone, the mammoth can make one stomp attack against it as a bonus action.
    save:
      ability: str
      dc: 18
