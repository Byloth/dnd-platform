traits:
  - name:
      en: Amphibious
    text:
      en: The dragon turtle can breathe air and water.
actions:
  - name:
      en: Multiattack
    text:
      en: "The dragon turtle makes three attacks: one with its bite and two with its claws. It can make one tail attack in place of its two claw attacks."
  - name:
      en: Bite
    text:
      en: "Melee Weapon Attack: +13 to hit, reach 15 ft., one target. Hit: 26 (3d12 + 7) piercing damage."
    attack:
      kind: melee
      source: weapon
      bonus: 13
      reach: 15
    damage:
      - dice: 3d12+7
        damageType: piercing
  - name:
      en: Claw
    text:
      en: "Melee Weapon Attack: +13 to hit, reach 10 ft., one target. Hit: 16 (2d8 + 7) slashing damage."
    attack:
      kind: melee
      source: weapon
      bonus: 13
      reach: 10
    damage:
      - dice: 2d8+7
        damageType: slashing
  - name:
      en: Tail
    text:
      en: "Melee Weapon Attack: +13 to hit, reach 15 ft., one target. Hit: 26 (3d12 + 7) bludgeoning damage. If the target is a creature, it must succeed on a DC 20 Strength saving throw or be pushed up to 10 feet away from the dragon turtle and knocked prone."
    attack:
      kind: melee
      source: weapon
      bonus: 13
      reach: 15
    damage:
      - dice: 3d12+7
        damageType: bludgeoning
    save:
      ability: str
      dc: 20
  - name:
      en: Steam Breath
    text:
      en: The dragon turtle exhales scalding steam in a 60-foot cone. Each creature in that area must make a DC 18 Constitution saving throw, taking 52 (15d6) fire damage on a failed save, or half as much damage on a successful one. Being underwater doesn't grant resistance against this damage.
    usage:
      recharge: 5
    damage:
      - dice: 15d6
        damageType: fire
    save:
      ability: con
      dc: 18
      onSuccess: half
