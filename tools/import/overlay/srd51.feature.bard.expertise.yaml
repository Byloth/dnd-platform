effects:
  - kind: grant-proficiency
    type: skill
    choose:
      id: expertise-3
      count: 2
      from:
        - acrobatics
        - animal-handling
        - arcana
        - athletics
        - deception
        - history
        - insight
        - intimidation
        - investigation
        - medicine
        - nature
        - perception
        - performance
        - persuasion
        - religion
        - sleight-of-hand
        - stealth
        - survival
    expertise: true
    note:
      en: Choose two of your skill proficiencies; your proficiency bonus is doubled for any ability check you make that uses either of them. The choice cannot yet be restricted to skills you are already proficient in.
  - kind: grant-proficiency
    type: skill
    choose:
      id: expertise-10
      count: 2
      from:
        - acrobatics
        - animal-handling
        - arcana
        - athletics
        - deception
        - history
        - insight
        - intimidation
        - investigation
        - medicine
        - nature
        - perception
        - performance
        - persuasion
        - religion
        - sleight-of-hand
        - stealth
        - survival
    expertise: true
    when:
      classLevel:
        class: srd51.class.bard
        min: 10
    note:
      en: At 10th level, choose another two skill proficiencies to gain this benefit. The choice cannot yet be restricted to skills you are already proficient in.
