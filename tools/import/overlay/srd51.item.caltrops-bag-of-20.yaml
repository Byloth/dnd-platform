onUse:
  - kind: note
    text:
      en: As an action, spread the caltrops to cover a square area that is 5 feet on a side. Any creature that enters the area must succeed on a DC 15 Dexterity saving throw or stop moving this turn and take 1 piercing damage; the damage reduces its walking speed by 10 feet until it regains at least 1 hit point. A creature moving through the area at half speed doesn't need to make the save.
