components:
  m: { en: "A small, straight piece of iron." }
text:
  en: Choose a creature that you can see within range. The target must succeed on a Wisdom saving throw or be paralyzed for the duration. This spell has no effect on undead. At the end of each of its turns, the target can make another Wisdom saving throw. On a success, the spell ends on the target.
higherLevel:
  en: When you cast this spell using a spell slot of 6th level or higher, you can target one additional creature for each slot level above 5th. The creatures must be within 30 feet of each other when you target them.
scaling: { by: slotLevel, from: 6, add: { targets: 1 } }
onCast:
  - kind: applyCondition
    condition: srd51.condition.paralyzed
    target: other
    expires: { minutes: 1 }
  - kind: note
    text: { en: "On a failed Wisdom save; no effect on undead. At the end of each of its turns the target can make another Wisdom saving throw; on a success the spell ends on it. Each slot level above 5th targets one additional creature (within 30 feet of each other)." }
