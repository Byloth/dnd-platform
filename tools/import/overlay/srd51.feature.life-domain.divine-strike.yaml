effects:
  - kind: add-action
    action: divine-strike
    name:
      en: Divine Strike
    activation: free
    text:
      en: "Once on each of your turns when you hit a creature with a weapon attack, you can cause the attack to deal an extra 1d8 radiant damage to the target."
    onHit:
      - kind: extraDamage
        dice: 1d8
        damageType: radiant
        once: per-turn
    when:
      classLevel:
        class: srd51.class.cleric
        max: 13
  - kind: add-action
    action: divine-strike
    name:
      en: Divine Strike
    activation: free
    text:
      en: "Once on each of your turns when you hit a creature with a weapon attack, you can cause the attack to deal an extra 2d8 radiant damage to the target."
    onHit:
      - kind: extraDamage
        dice: 2d8
        damageType: radiant
        once: per-turn
    when:
      classLevel:
        class: srd51.class.cleric
        min: 14
