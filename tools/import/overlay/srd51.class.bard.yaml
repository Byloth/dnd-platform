# The class's primary abilities, as the SRD 5.1 multiclassing prerequisites name them.
primaryAbilities: [cha]
# Song of Rest: the table holds the dice expression, so the heal play effect can roll it.
tables:
  song-of-rest-die:
    rows:
      "2": 1d6
      "9": 1d8
      "13": 1d10
      "17": 1d12
# One line of the platform's own for the wizard's card (docs/phase-1/14-wizard-steps-revision.md).
summary:
  en: 'A performer whose music and words are magic: inspiring friends, confusing foes, knowing a bit of everything.'
