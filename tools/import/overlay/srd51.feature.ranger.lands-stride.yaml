effects:
  - kind: roll-advantage
    on:
      type: save
      against:
        - plants that are magically created or manipulated to impede movement (such as the entangle spell)
  - kind: add-text
    section: features
    text:
      en: Moving through nonmagical difficult terrain costs you no extra movement. You can also pass through nonmagical plants without being slowed by them and without taking damage from them if they have thorns, spines, or a similar hazard.
    note:
      en: Movement-cost rules have no catalogue kind; applied in play.
