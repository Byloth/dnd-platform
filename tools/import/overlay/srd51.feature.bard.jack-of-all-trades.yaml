effects:
  - kind: modify
    target: check.all
    op: add
    formula: floor(proficiencyBonus / 2)
    note:
      en: Half your proficiency bonus, rounded down, on ability checks that don't already include it.
  - kind: modify
    target: skill.acrobatics
    op: add
    formula: floor(proficiencyBonus / 2)
    when:
      not:
        proficient:
          type: skill
          item: acrobatics
